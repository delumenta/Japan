<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070c10">
<title>Coordinate Review · Japan</title>
<style>
:root{
  --bg:#070c10;--surface:#0d1318;--surface2:#11181e;--line:#263039;
  --text:#f5f3ef;--muted:#8f9aa2;
  --green:#69c78d;--green-bg:rgba(105,199,141,.10);--green-line:rgba(105,199,141,.30);
  --yellow:#e4bd69;--yellow-bg:rgba(228,189,105,.10);--yellow-line:rgba(228,189,105,.30);
  --red:#ff625f;--red-bg:rgba(255,98,95,.10);--red-line:rgba(255,98,95,.32);
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% -10%,rgba(42,56,68,.3),transparent 26%),var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,select{font:inherit}
a{color:inherit;text-decoration:none}
.shell{width:calc(100% - 24px);max-width:820px;margin:14px auto 90px;border:1px solid #273139;border-radius:26px;overflow:hidden;background:linear-gradient(180deg,#0a1116,#070d11);box-shadow:0 24px 65px rgba(0,0,0,.4)}
header{padding:24px 20px 18px;border-top:3px solid var(--red);border-bottom:1px solid var(--line);background:linear-gradient(180deg,rgba(255,98,95,.04),transparent)}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.eyebrow{color:#ef7d79;font-size:8px;font-weight:900;letter-spacing:.18em;text-transform:uppercase}.back{border:1px solid var(--line);background:#0d1419;border-radius:9px;padding:8px 10px;font-size:9px;color:#aeb6bc}
h1{margin:8px 0 5px;font-family:Georgia,"Times New Roman",serif;font-size:31px;letter-spacing:-.03em}.sub{margin:0;color:var(--muted);font-size:10px;line-height:1.55}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:17px}.stat{padding:10px;border:1px solid var(--line);border-radius:11px;background:#0c1318}.stat b,.stat span{display:block}.stat b{font-size:19px}.stat span{margin-top:3px;font-size:8px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.08em}.stat.green b{color:var(--green)}.stat.yellow b{color:var(--yellow)}.stat.red b{color:var(--red)}
.toolbar{display:grid;grid-template-columns:1.2fr .8fr;gap:7px;padding:12px 20px;border-bottom:1px solid var(--line);background:#091015;position:sticky;top:0;z-index:3}
.toolbar input,.toolbar select{width:100%;height:36px;border:1px solid var(--line);border-radius:9px;background:#0d1419;color:#e7e9e9;padding:0 10px;font-size:10px;outline:none}
.legend{display:flex;gap:7px;flex-wrap:wrap;padding:12px 20px 0}.pill{border-radius:999px;padding:6px 9px;font-size:8px;font-weight:900}.pill.green{background:var(--green-bg);border:1px solid var(--green-line);color:var(--green)}.pill.yellow{background:var(--yellow-bg);border:1px solid var(--yellow-line);color:var(--yellow)}.pill.red{background:var(--red-bg);border:1px solid var(--red-line);color:var(--red)}
main{padding:14px 20px 24px}.section{margin-bottom:14px;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#0c1318}.section>summary{list-style:none;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 14px;cursor:pointer}.section>summary::-webkit-details-marker{display:none}.section>summary b{font-size:11px}.section>summary span{font-size:9px;color:var(--muted)}.section.green{border-color:var(--green-line)}.section.yellow{border-color:var(--yellow-line)}.section.red{border-color:var(--red-line)}
.cards{display:grid;gap:8px;padding:0 10px 10px}.card{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;padding:11px;border:1px solid var(--line);border-radius:11px;background:#0a1116}.dot{width:11px;height:11px;border-radius:50%;margin-top:3px}.card.green .dot{background:var(--green);box-shadow:0 0 0 4px var(--green-bg)}.card.yellow .dot{background:var(--yellow);box-shadow:0 0 0 4px var(--yellow-bg)}.card.red .dot{background:var(--red);box-shadow:0 0 0 4px var(--red-bg)}
.name{font-size:11px;font-weight:800}.meta{margin-top:3px;color:var(--muted);font-size:8.5px;line-height:1.45}.coords{margin-top:7px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:8px;color:#b6c0c7}.reason{margin-top:7px;padding:7px 8px;border-radius:8px;font-size:8.5px;line-height:1.45}.card.green .reason{background:var(--green-bg);color:#9eddb4}.card.yellow .reason{background:var(--yellow-bg);color:#e8cc91}.card.red .reason{background:var(--red-bg);color:#ff9b99}
.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}.actions a{padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:#0d1419;font-size:8px;font-weight:800;color:#c2c9ce}.empty{padding:18px;text-align:center;color:var(--muted);font-size:9px}
.loading{padding:28px;text-align:center;color:var(--muted);font-size:10px}
@media(max-width:560px){.shell{width:calc(100% - 12px);margin-top:6px;border-radius:20px}.toolbar{grid-template-columns:1fr}.stats{gap:5px}.stat{padding:8px}.stat b{font-size:16px}header,main{padding-left:14px;padding-right:14px}.toolbar,.legend{padding-left:14px;padding-right:14px}}
</style>
</head>
<body>
<div class="shell">
<header>
  <div class="top">
    <div>
      <div class="eyebrow">JAPAN · DATA QUALITY</div>
      <h1>Coordinate Review</h1>
      <p class="sub">Green = confirmed/good. Yellow = needs review. Red = likely wrong place / too far away. Good matches are collapsed by default.</p>
    </div>
    <a class="back" href="food.html">← Food</a>
  </div>
  <div class="stats">
    <div class="stat green"><b id="greenCount">—</b><span>Green</span></div>
    <div class="stat yellow"><b id="yellowCount">—</b><span>Review</span></div>
    <div class="stat red"><b id="redCount">—</b><span>Wrong / far</span></div>
  </div>
</header>

<div class="toolbar">
  <input id="search" type="search" placeholder="Search place, city, country…">
  <select id="country"><option value="">All countries</option></select>
</div>

<div class="legend">
  <span class="pill green">● Good</span>
  <span class="pill yellow">● Needs review</span>
  <span class="pill red">● Wrong / too far</span>
</div>

<main id="content"><div class="loading">Loading coordinate review…</div></main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://zngncasvdrrxyrkjqutj.supabase.co";
const SUPABASE_KEY="sb_publishable_wUrH6t12z4tRKruS28LqWQ_2GG06U9m";
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

let rows=[];

function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function statusOf(p){
  const reason=String(p.coordinate_review_reason||'').toLowerCase();
  const src=String(p.coordinate_source||'').toLowerCase();
  const st=String(p.coordinate_status||'pending').toLowerCase();

  if(st==='failed'||/wrong place|too far|mismatch|incorrect|bad match/.test(reason)) return 'red';

  // Only independently checked sources are green automatically.
  if(st==='done' && /wikidata|wikipedia|openstreetmap|osm/.test(src)) return 'green';
  if(st==='done' && /confirmed|good match|matched|verified/.test(reason)) return 'green';

  // Google/existing coordinates stay yellow until cross-checked.
  return 'yellow';
}
function reasonText(p,status){
  if(p.coordinate_review_reason) return p.coordinate_review_reason;
  if(status==='green') return 'Coordinate independently checked.';
  if(status==='red') return 'Coordinate appears to point to the wrong place or is too far from the reference.';
  if(p.latitude==null||p.longitude==null) return 'Missing coordinates — needs review.';
  if((p.coordinate_source||'').toLowerCase()==='google') return 'Google coordinate present, but not yet independently cross-checked.';
  return 'Needs coordinate review.';
}
function mapLinks(p){
  if(p.latitude==null||p.longitude==null) return '';
  const lat=Number(p.latitude),lng=Number(p.longitude);
  const q=encodeURIComponent(p.name+' '+(p.city||'')+' '+(p.country||''));
  return '<div class="actions">'+
    '<a target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query='+lat+','+lng+'">Google pin</a>'+
    '<a target="_blank" rel="noopener" href="https://www.openstreetmap.org/?mlat='+lat+'&mlon='+lng+'#map=18/'+lat+'/'+lng+'">OSM pin</a>'+
    '<a target="_blank" rel="noopener" href="https://www.wikidata.org/w/index.php?search='+q+'">Wikidata</a>'+
    '<a target="_blank" rel="noopener" href="https://en.wikipedia.org/w/index.php?search='+q+'">Wikipedia</a>'+
  '</div>';
}
function card(p){
  const status=statusOf(p);
  return '<div class="card '+status+'">'+
    '<span class="dot"></span>'+
    '<div><div class="name">'+esc(p.name)+'</div>'+
    '<div class="meta">'+esc([p.city,p.country,p.place_type].filter(Boolean).join(' · '))+
      ' · source: '+esc(p.coordinate_source||'unknown')+
      (p.coordinate_checked_at?' · checked '+esc(new Date(p.coordinate_checked_at).toLocaleDateString()):'')+
    '</div>'+
    (p.latitude!=null&&p.longitude!=null?'<div class="coords">'+Number(p.latitude).toFixed(6)+', '+Number(p.longitude).toFixed(6)+'</div>':'<div class="coords">No coordinates</div>')+
    '<div class="reason">'+esc(reasonText(p,status))+'</div>'+
    mapLinks(p)+'</div></div>';
}
function render(){
  const q=document.getElementById('search').value.trim().toLowerCase();
  const country=document.getElementById('country').value;
  const filtered=rows.filter(p=>{
    const hay=[p.name,p.city,p.country,p.place_type].join(' ').toLowerCase();
    return (!q||hay.includes(q))&&(!country||p.country===country);
  });
  const groups={red:[],yellow:[],green:[]};
  filtered.forEach(p=>groups[statusOf(p)].push(p));

  document.getElementById('greenCount').textContent=rows.filter(p=>statusOf(p)==='green').length;
  document.getElementById('yellowCount').textContent=rows.filter(p=>statusOf(p)==='yellow').length;
  document.getElementById('redCount').textContent=rows.filter(p=>statusOf(p)==='red').length;

  const section=(status,title,open)=>{
    const arr=groups[status];
    return '<details class="section '+status+'" '+(open?'open':'')+'>'+
      '<summary><b>'+title+'</b><span>'+arr.length+' places</span></summary>'+
      (arr.length?'<div class="cards">'+arr.map(card).join('')+'</div>':'<div class="empty">Nothing here.</div>')+
    '</details>';
  };

  document.getElementById('content').innerHTML=
    section('red','Red · Wrong / too far',true)+
    section('yellow','Yellow · Needs review',true)+
    section('green','Green · Good matches',false);
}
async function load(){
  const {data,error}=await db.from('places')
    .select('id,name,city,country,place_type,latitude,longitude,coordinate_status,coordinate_source,coordinate_checked_at,coordinate_review_reason')
    .order('country').order('city').order('name');
  if(error){
    document.getElementById('content').innerHTML='<div class="empty">Could not load places: '+esc(error.message)+'</div>';
    return;
  }
  rows=data||[];
  const countries=[...new Set(rows.map(x=>x.country).filter(Boolean))].sort();
  document.getElementById('country').innerHTML='<option value="">All countries</option>'+countries.map(x=>'<option>'+esc(x)+'</option>').join('');
  render();
}
document.getElementById('search').addEventListener('input',render);
document.getElementById('country').addEventListener('change',render);
load();
</script>
</body>
</html>
