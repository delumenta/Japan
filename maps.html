/* =========================================================
   BASIC HELPERS
========================================================= */

function text(value){

  return String(
    value ?? ""
  );

}


function esc(value){

  return text(value)

    .replaceAll(
      "&",
      "&amp;"
    )

    .replaceAll(
      "<",
      "&lt;"
    )

    .replaceAll(
      ">",
      "&gt;"
    )

    .replaceAll(
      '"',
      "&quot;"
    )

    .replaceAll(
      "'",
      "&#039;"
    );

}



/* =========================================================
   DATE HELPERS
========================================================= */

function parseDate(value){

  return new Date(
    value +
    "T12:00:00"
  );

}


function weekday(value){

  return new Intl
    .DateTimeFormat(
      "en-SG",
      {
        weekday:"short"
      }
    )
    .format(
      parseDate(value)
    )
    .toUpperCase();

}


function dayMonth(value){

  return new Intl
    .DateTimeFormat(
      "en-SG",
      {
        day:"numeric",
        month:"short"
      }
    )
    .format(
      parseDate(value)
    )
    .toUpperCase();

}


function fullDate(value){

  return new Intl
    .DateTimeFormat(
      "en-SG",
      {
        weekday:"long",
        day:"numeric",
        month:"long"
      }
    )
    .format(
      parseDate(value)
    );

}



/* =========================================================
   TIME
========================================================= */

function itemTime(item){

  if(item.time_label){

    return item.time_label;

  }


  if(item.start_time){

    const parts =
      item.start_time
        .split(":");


    let hour =
      Number(
        parts[0]
      );


    const minute =
      parts[1] ||
      "00";


    const suffix =
      hour >= 12
      ?
      "PM"
      :
      "AM";


    hour =
      hour % 12 ||
      12;


    return (
      `${hour}:${minute} ${suffix}`
    );

  }


  return "Flexible";

}



/* =========================================================
   ITEM ENTITY
========================================================= */

function itemEntity(item){

  return (
    item.restaurant ||
    item.place ||
    null
  );

}



/* =========================================================
   SAFE COORDINATES
========================================================= */

function coordinateNumber(value){

  /*
    Prevent blank fields from turning
    into 0 with Number("").
  */

  if(
    value === null ||
    value === undefined ||
    value === ""
  ){

    return null;

  }


  const number =
    Number(value);


  if(
    !Number.isFinite(number)
  ){

    return null;

  }


  return number;

}


function itemCoordinates(item){

  const entity =
    itemEntity(item);


  const latitude =
    coordinateNumber(
      entity?.latitude
    )

    ??

    coordinateNumber(
      item.latitude
    );


  const longitude =
    coordinateNumber(
      entity?.longitude
    )

    ??

    coordinateNumber(
      item.longitude
    );


  if(
    latitude === null ||
    longitude === null
  ){

    return null;

  }


  /*
    Basic coordinate validation.
  */

  if(
    latitude < -90 ||
    latitude > 90 ||
    longitude < -180 ||
    longitude > 180
  ){

    return null;

  }


  return {

    lat:
      latitude,

    lng:
      longitude

  };

}



/* =========================================================

/* =========================================================

/* =========================================================
   MAP URL
========================================================= */

function itemMapsUrl(item){

  const entity =
    itemEntity(item);


  if(entity?.maps_url){

    return entity.maps_url;

  }


  if(item.maps_url){

    return item.maps_url;

  }


  const coords =
    itemCoordinates(item);


  if(coords){

    return (
      "https://www.google.com/maps/search/" +
      "?api=1" +
      `&query=${coords.lat},${coords.lng}`
    );

  }


  return null;

}



/* =========================================================
   ACCESSIBLE TRIPS
========================================================= */

async function getAccessibleTrips(){

  const [
    ownResult,
    memberResult
  ] =

  await Promise.all([


    db
      .from("trips")
      .select("*")
      .eq(
        "owner_id",
        currentUser.id
      )
      .order(
        "start_date",
        {
          ascending:true
        }
      ),


    db
      .from("trip_members")
      .select("trip_id")
      .eq(
        "user_id",
        currentUser.id
      )

  ]);


  if(ownResult.error){

    throw ownResult.error;

  }


  if(memberResult.error){

    throw memberResult.error;

  }


  const resultMap =
    new Map();


  (
    ownResult.data ||
    []
  )
  .forEach(
    row => {

      resultMap.set(
        Number(row.id),
        row
      );

    }
  );


  const sharedIds = [

    ...new Set(

      (
        memberResult.data ||
        []
      )

      .map(
        row =>
          Number(
            row.trip_id
          )
      )

      .filter(Boolean)

    )

  ];


  if(sharedIds.length){

    const sharedResult =

      await db
        .from("trips")
        .select("*")
        .in(
          "id",
          sharedIds
        )
        .order(
          "start_date",
          {
            ascending:true
          }
        );


    if(sharedResult.error){

      throw sharedResult.error;

    }


    (
      sharedResult.data ||
      []
    )
    .forEach(
      row => {

        if(
          !resultMap.has(
            Number(row.id)
          )
        ){

          resultMap.set(
            Number(row.id),
            row
          );

        }

      }
    );

  }


  return [
    ...resultMap.values()
  ]
  .sort(
    (a,b) =>

      text(
        a.start_date
      )
      .localeCompare(
        text(
          b.start_date
        )
      )

  );

}

    authResult.data?.user ||
    null;


  if(!currentUser){

    location.href =
      "login.html";


    throw new Error(
      "Please sign in."
    );

  }


  const accessibleTrips =
    await getAccessibleTrips();


  if(
    !accessibleTrips.length
  ){

    throw new Error(
      "You do not have any accessible trips yet."
    );

  }


  let resolved =

    accessibleTrips.find(
      row =>
        Number(row.id) ===
        Number(TRIP_ID)
    );


  if(!resolved){

    resolved =
      accessibleTrips[0];

  }


  TRIP_ID =
    Number(
      resolved.id
    );


  localStorage.setItem(
    "current_trip_id",
    String(TRIP_ID)
  );


  history.replaceState(
    null,
    "",
    `maps.html?trip=${TRIP_ID}`
  );

}



/* =========================================================
   LOAD SCHEDULE
========================================================= */

function loadScheduleQuery(){

  return db

    .from("schedule")

    .select(`

      id,
      trip_id,

      schedule_date,

      start_time,
      end_time,
      time_label,

      sort_order,

      title,

      item_type,

      description,
      notes,

      restaurant_id,
      place_id,

      location_name,

      address,

      latitude,
      longitude,

      maps_url,

      is_optional,
      is_locked,

      place:places(

        id,
        name,
        name_japanese,

        country,
        prefecture,
        city,
        area,

        address,

        latitude,
        longitude,

        maps_url

      ),

      restaurant:restaurants(

        id,
        name,
        name_japanese,

        country,
        prefecture,
        city,
        area,
        location,

        address,

        latitude,
        longitude,

        maps_url

      )

    `)

    .eq(
      "trip_id",
      TRIP_ID
    )

    .order(
      "schedule_date",
      {
        ascending:true
      }
    )

    .order(
      "sort_order",
      {
        ascending:true
      }
    );

}



/* =========================================================
   GOOGLE MAP LOADER
========================================================= */

async function loadMapAPI(){

  if(
    window.google?.maps
  ){

    return;

  }


  if(
    typeof window.loadGoogleMaps !==
    "function"
  ){

    throw new Error(

      "Google Maps helper was not found. " +
      "Check google-maps.js."

    );

  }


  await window
    .loadGoogleMaps();


  if(
    !window.google?.maps
  ){

    throw new Error(
      "Google Maps API could not be loaded."
    );

  }

}



/* =========================================================
   UNIQUE DATES
========================================================= */

function tripDates(){

  return [

    ...new Set(

      schedule

        .map(
          item =>
            item.schedule_date
        )

        .filter(Boolean)

    )

  ]
  .sort();

}



/* =========================================================
   DAY ROWS
========================================================= */

function rowsForDate(date){

  if(
    date === "all"
  ){

    return schedule;

  }


  return schedule.filter(
    item =>
      item.schedule_date ===
      date
  );

}



/* =========================================================
   MAP ROWS
========================================================= */

function mapRowsForDate(date){

  return rowsForDate(date)

    .map(
      item => ({

        item:

          item,

        coords:

          itemCoordinates(
            item
          )

      })
    )

    .filter(
      row =>
        row.coords
    );

}



/* =========================================================
   DAY NUMBER
========================================================= */

function dayNumber(date){

  const dates =
    tripDates();


  const index =
    dates.indexOf(date);


  return (
    index >= 0
    ?
    index + 1
    :
    null
  );

}



/* =========================================================
   DAY AREA
========================================================= */

function areaForDate(date){

  const rows =
    rowsForDate(date);


  const values = [

    ...new Set(

      rows

        .map(
          item =>
            itemArea(item)
        )

        .map(
          value =>
            text(value).trim()
        )

        .filter(Boolean)

    )

  ];


  if(!values.length){

    return (
      trip?.country ||
      ""
    );

  }


  /*
    Keep the header compact.
  */

  return values
    .slice(
      0,
      3
    )
    .join(
      " · "
    );

}



/* =========================================================
   RENDER DATE BUTTONS
========================================================= */

function renderDates(){

  const dates =
    tripDates();


  dateScroller.innerHTML = `


    ${

      dates

        .map(
          date => {

            const number =
              dayNumber(date);


            return `

              <button

                class="
                  date-btn
                  ${
                    selectedDate ===
                    date
                    ?
                    "active"
                    :
                    ""
                  }
                "

                type="button"

                data-date="${esc(date)}"

              >

                <span class="date-btn-day">

                  DAY ${number}

                </span>


                <span class="date-btn-date">

                  ${esc(
                    dayMonth(date)
                  )}

                </span>

              </button>

            `;

          }
        )
        .join("")

    }


    <button

      class="
        date-btn
        all
        ${
          selectedDate === "all"
          ?
          "active"
          :
          ""
        }
      "

      type="button"

      data-date="all"

    >

      <span class="date-btn-day">
        WHOLE
      </span>

      <span class="date-btn-date">
        ALL
      </span>

    </button>

  `;


  dateScroller

    .querySelectorAll(
      "[data-date]"
    )

    .forEach(
      button => {


        button.onclick =
          () => {


            selectedDate =
              button.dataset.date;


            renderDates();

            renderMapAndList();


            /*
              Scroll selected date
              gently into view.
            */

            button.scrollIntoView({

              behavior:"smooth",

              block:"nearest",

              inline:"center"

            });

          };

      }
    );

}



/* =========================================================
   CLEAR MARKERS
========================================================= */

function clearMarkers(){

  markers.forEach(
    marker => {

      marker.setMap(
        null
      );

    }
  );


  markers = [];

}



/* =========================================================
   DARK NUMBERED MARKER
========================================================= */

function createMarker(
  coords,
  number,
  title
){

  return new google.maps.Marker({

    map:

      map,

    position:

      coords,

    title:

      title,

    icon:{

      path:
        google.maps.SymbolPath.CIRCLE,

      fillColor:
        "#c96f68",

      fillOpacity:
        1,

      strokeColor:
        "#f1b7b2",

      strokeOpacity:
        .9,

      strokeWeight:
        1.5,

      scale:
        14

    },

    label:{

      text:
        String(number),

      color:
        "#ffffff",

      fontSize:
        "10px",

      fontWeight:
        "900"

    }

  });

}



/* =========================================================
   DAY HEADER
========================================================= */

function renderDayHeader(rows){

  if(
    selectedDate === "all"
  ){

    dayLabel.textContent =
      "WHOLE TRIP";


    dayTitle.textContent =
      trip?.name ||
      "Trip Map";


    dayArea.textContent =
      trip?.country ||
      "";


    dayCount.textContent =

      `${rows.length} ` +

      (
        rows.length === 1
        ?
        "PIN"
        :
        "PINS"
      );


    mapDayBadge.textContent =
      "Whole trip";


    return;

  }


  const number =
    dayNumber(
      selectedDate
    );


  dayLabel.textContent =
    `DAY ${number}`;


  dayTitle.textContent =
    fullDate(
      selectedDate
    );


  dayArea.textContent =
    areaForDate(
      selectedDate
    );


  dayCount.textContent =

    `${rows.length} ` +

    (
      rows.length === 1
      ?
      "PIN"
      :
      "PINS"
    );


  mapDayBadge.textContent =

    `Day ${number} · ` +

    dayMonth(
      selectedDate
    );

}



/* =========================================================
   INFO WINDOW
========================================================= */

function openMarkerInfo(
  marker,
  item
){

  const mapsUrl =
    itemMapsUrl(
      item
    );


  const location =
    itemLocation(
      item
    );


  infoWindow.setContent(`

    <div
      style="
        min-width:180px;
        max-width:240px;
        padding:11px 12px;
        background:#11181e;
        color:#f5f3ef;
        font-family:system-ui,sans-serif;
        line-height:1.4;
      "
    >

      <div
        style="
          color:#c96f68;
          font-size:9px;
          font-weight:900;
          letter-spacing:.07em;
        "
      >

        ${esc(
          selectedDate === "all"
          ?
          dayMonth(
            item.schedule_date
          )
          :
          itemTime(item)
        )}

      </div>


      <div
        style="
          margin-top:3px;
          font-size:13px;
          font-weight:800;
        "
      >

        ${esc(
          item.title ||
          location ||
          "Schedule stop"
        )}

      </div>


      ${
        location &&
        location !==
        item.title

        ?

        `

          <div
            style="
              margin-top:3px;
              color:#8b979f;
              font-size:10px;
            "
          >

            ${esc(location)}

          </div>

        `

        :

        ""

      }


      ${
        selectedDate === "all"

        ?

        `

          <div
            style="
              margin-top:5px;
              color:#74818a;
              font-size:10px;
            "
          >

            ${esc(
              itemTime(item)
            )}

          </div>

        `

        :

        ""

      }


      ${
        mapsUrl

        ?

        `

          <div
            style="
              margin-top:9px;
            "
          >

            <a

              href="${esc(mapsUrl)}"

              target="_blank"

              rel="noopener noreferrer"

              style="
                color:#9fc2f1;
                font-size:10px;
                font-weight:800;
                text-decoration:none;
              "

            >

              Open in Google Maps ↗

            </a>

          </div>

        `

        :

        ""

      }

    </div>

  `);


  infoWindow.open({

    map:

      map,

    anchor:

      marker

  });

}



/* =========================================================
   RENDER MAP + LIST
========================================================= */

function renderMapAndList(){

  if(!map){

    return;

  }


  clearMarkers();


  const rows =
    mapRowsForDate(
      selectedDate
    );


  renderDayHeader(
    rows
  );


  const bounds =
    new google.maps
      .LatLngBounds();


  rows.forEach(
    (
      row,
      index
    ) => {


      const item =
        row.item;


      const coords =
        row.coords;


      const marker =
        createMarker(

          coords,

          index + 1,

          item.title

          ||

          itemLocation(item)

          ||

          "Stop"

        );


      marker.addListener(
        "click",
        () => {

          openMarkerInfo(
            marker,
            item
          );

        }
      );


      markers.push(
        marker
      );


      bounds.extend(
        coords
      );

    }
  );


  /*
    ZOOM
  */

  if(
    rows.length === 1
  ){

    map.setCenter(
      rows[0].coords
    );


    map.setZoom(
      15
    );

  }


  else if(
    rows.length > 1
  ){

    map.fitBounds(
      bounds,
      55
    );


    /*
      Prevent a group of very close
      markers from zooming in too far.
    */

    google.maps.event
      .addListenerOnce(
        map,
        "idle",
        () => {

          if(
            map.getZoom() >
            16
          ){

            map.setZoom(
              16
            );

          }

        }
      );

  }


  pinCount.textContent =

    `${rows.length} PIN` +

    (
      rows.length === 1
      ?
      ""
      :
      "S"
    );


  listTitle.textContent =

    selectedDate === "all"

    ?

    "WHOLE TRIP"

    :

    `DAY ${dayNumber(
      selectedDate
    )} STOPS`;


  /*
    NO PINS
  */

  if(!rows.length){

    stops.innerHTML = `

      <div class="empty">

        No scheduled places with
        coordinates for

        ${
          selectedDate === "all"
          ?
          "this trip."
          :
          "this day."
        }

      </div>

    `;


    return;

  }


  /*
    STOP LIST
  */

  stops.innerHTML =

    rows

      .map(
        (
          row,
          index
        ) => {


          const item =
            row.item;


          const location =
            itemLocation(
              item
            );


          const mapsUrl =
            itemMapsUrl(
              item
            );


          const meta = [

            selectedDate === "all"

            ?

            dayMonth(
              item.schedule_date
            )

            :

            null,


            itemTime(
              item
            ),


            location &&
            location !==
            item.title

            ?

            location

            :

            null

          ]

          .filter(Boolean)

          .join(
            " · "
          );


          return `

            <div class="stop">


              <div class="num">

                ${index + 1}

              </div>


              <div>

                <div class="stop-title">

                  ${esc(
                    item.title

                    ||

                    location

                    ||

                    "Schedule stop"
                  )}

                </div>


                ${
                  meta

                  ?

                  `

                    <div class="stop-meta">

                      ${esc(meta)}

                    </div>

                  `

                  :

                  ""

                }


                ${
                  item.notes

                  ?

                  `

                    <div class="stop-notes">

                      ${esc(
                        item.notes
                      )}

                    </div>

                  `

                  :

                  ""

                }

              </div>


              ${
                mapsUrl

                ?

                `

                  <a

                    class="maps-link"

                    href="${esc(
                      mapsUrl
                    )}"

                    target="_blank"

                    rel="noopener noreferrer"

                  >

                    MAPS ↗

                  </a>

                `

                :

                ""

              }


            </div>

          `;

        }
      )

      .join("");

}



/* =========================================================
   LOAD EVERYTHING
========================================================= */

async function loadData(){

  try{


    /*
      RESOLVE TRIP
    */

    await resolveTrip();


    /*
      LOAD TRIP + SCHEDULE
    */

    const [

      tripResult,

      scheduleResult

    ] =

    await Promise.all([


      db
        .from("trips")
        .select("*")
        .eq(
          "id",
          TRIP_ID
        )
        .single(),


      loadScheduleQuery()

    ]);


    if(
      tripResult.error
    ){

      throw tripResult.error;

    }


    if(
      scheduleResult.error
    ){

      throw scheduleResult.error;

    }


    trip =
      tripResult.data;


    schedule =
      scheduleResult.data ||
      [];


    /*
      PAGE TITLE
    */

    tripName.textContent =

      trip?.name

      ||

      "My Trip";


    tripEyebrow.textContent =

      trip?.country

      ?

      `${trip.country} TRIP MAP`

      :

      "TRIP MAP";


    document.title =

      `Map · ${
        trip?.name ||
        "Travel"
      }`;


    /*
      DEFAULT TO FIRST DAY.

      This is the important change.

      It no longer starts with every
      pin from the whole trip.
    */

    const dates =
      tripDates();


    selectedDate =

      dates[0]

      ||

      "all";


    renderDates();


    /*
      LOAD GOOGLE MAPS
    */

    await loadMapAPI();


    /*
      CREATE DARK GOOGLE MAP
    */

    map =

      new google.maps.Map(

        document.getElementById(
          "map"
        ),

        {

          center:{

            lat:
              35.0116,

            lng:
              135.7681

          },


          zoom:
            11,


          styles:
            DARK_MAP_STYLE,


          backgroundColor:
            "#111820",


          mapTypeControl:
            false,


          streetViewControl:
            false,


          fullscreenControl:
            true,


          zoomControl:
            true,


          clickableIcons:
            false,


          gestureHandling:
            "greedy"

        }

      );


    /*
      INFO WINDOW
    */

    infoWindow =

      new google.maps
        .InfoWindow();


    /*
      INITIAL DAY
    */

    renderMapAndList();


    /*
      Scroll Day 1 button into view.
    */

    setTimeout(
      () => {

        document
          .querySelector(
            ".date-btn.active"
          )
          ?.scrollIntoView({

            behavior:
              "smooth",

            block:
              "nearest",

            inline:
              "center"

          });

      },
      200
    );


  }


  catch(error){


    console.error(
      "Map page:",
      error
    );


    tripName.textContent =
      "Unable to load map";


    dayLabel.textContent =
      "ERROR";


    dayTitle.textContent =
      "Map unavailable";


    dayArea.textContent =
      "";


    mapDayBadge.textContent =
      "Map unavailable";


    stops.innerHTML = `

      <div class="error">

        ${esc(

          error.message

          ||

          "Could not load your trip map."

        )}

      </div>

    `;

  }

}



/* =========================================================
   START
========================================================= */

loadData();

</script>
