<!doctype html>
<html lang="en">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,viewport-fit=cover"
>

<meta name="theme-color" content="#070c10">

<title>Trip Map · Travel</title>


<style>

:root{
  --bg:#070c10;
  --surface:#0d1318;
  --surface2:#11181e;
  --surface3:#151d24;
  --line:#263039;
  --line-soft:rgba(255,255,255,.065);

  --text:#f5f3ef;
  --muted:#929ca4;
  --muted2:#68747d;

  --red:#ff625f;
  --red-soft:rgba(255,98,95,.10);
  --red-line:rgba(255,98,95,.34);

  --blue:#78a9ef;
}


/* =========================================================
   BASE
========================================================= */

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  min-height:100vh;

  background:
    radial-gradient(
      circle at 50% -8%,
      rgba(42,56,68,.30),
      transparent 28%
    ),
    var(--bg);

  color:var(--text);

  font-family:
    Inter,
    ui-sans-serif,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

  -webkit-font-smoothing:antialiased;
}

button{
  font:inherit;
  -webkit-tap-highlight-color:transparent;
}

a{
  -webkit-tap-highlight-color:transparent;
}


/* =========================================================
   HEADER
========================================================= */

header{
  position:sticky;
  top:0;
  z-index:40;

  border-bottom:1px solid var(--line-soft);

  background:rgba(7,12,16,.965);

  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
}


.header-inner{
  width:100%;
  max-width:760px;

  margin:auto;

  padding:
    calc(14px + env(safe-area-inset-top))
    14px
    10px;
}


.header-top{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;

  gap:12px;
}


.eyebrow{
  color:var(--red);

  font-size:7px;
  font-weight:900;

  letter-spacing:.17em;
}


h1{
  margin:3px 0 0;

  font:
    700
    27px/1
    Georgia,
    "Times New Roman",
    serif;
}


.trip-name{
  margin-top:4px;

  color:var(--muted);

  font-size:8px;
  font-weight:600;
}


/* =========================================================
   MAP MODE
========================================================= */

.mode-toggle{
  display:grid;

  grid-template-columns:
    1fr
    1fr;

  gap:2px;

  padding:2px;

  border:1px solid var(--line);
  border-radius:10px;

  background:#0b1116;
}


.mode-btn{
  min-height:29px;

  padding:5px 9px;

  border:0;
  border-radius:7px;

  background:transparent;

  color:#74818a;

  font-size:6.5px;
  font-weight:900;

  letter-spacing:.06em;

  cursor:pointer;

  white-space:nowrap;
}


.mode-btn.active{
  background:var(--red-soft);

  color:#ffc0bc;
}


/* =========================================================
   MAIN
========================================================= */

main{
  width:100%;
  max-width:760px;

  margin:auto;

  padding:
    14px
    14px
    100px;
}


/* =========================================================
   DAY SUMMARY
========================================================= */

.day-summary{
  display:flex;
  align-items:center;
  justify-content:space-between;

  gap:12px;

  margin-bottom:8px;
}


.day-summary-left{
  min-width:0;
}


.day-label{
  color:var(--red);

  font-size:7px;
  font-weight:900;

  letter-spacing:.12em;
}


.day-title{
  margin-top:2px;

  font:
    700
    17px
    Georgia,
    "Times New Roman",
    serif;
}


.day-area{
  margin-top:2px;

  color:#7e8b94;

  font-size:7px;
}


.day-count{
  flex:0 0 auto;

  padding:5px 8px;

  border:1px solid var(--line);
  border-radius:999px;

  background:#10171d;

  color:#aab3b9;

  font-size:6.5px;
  font-weight:900;
}


/* =========================================================
   DATE SCROLLER
========================================================= */

.date-scroller{
  display:flex;

  gap:6px;

  margin-bottom:10px;

  padding-bottom:2px;

  overflow-x:auto;

  scroll-snap-type:x proximity;

  scrollbar-width:none;
}


.date-scroller::-webkit-scrollbar{
  display:none;
}


.date-btn{
  flex:0 0 auto;

  min-width:61px;
  min-height:48px;

  padding:6px 8px;

  border:1px solid var(--line);
  border-radius:11px;

  background:#0f161c;

  color:#7d8991;

  text-align:center;

  cursor:pointer;

  scroll-snap-align:start;
}


.date-btn-day{
  display:block;

  font-size:6px;
  font-weight:900;

  letter-spacing:.08em;
}


.date-btn-date{
  display:block;

  margin-top:2px;

  color:#c6ccd0;

  font:
    700
    12px
    Georgia,
    "Times New Roman",
    serif;
}


.date-btn.active{
  border-color:var(--red-line);

  background:var(--red-soft);

  color:#ffaaa6;
}


.date-btn.active .date-btn-date{
  color:#ffd0cd;
}


.date-btn.all{
  min-width:54px;
}


/* =========================================================
   MAP CARD
========================================================= */

.map-card{
  position:relative;

  overflow:hidden;

  border:1px solid var(--line);
  border-radius:17px;

  background:#091016;

  box-shadow:
    0 16px 40px
    rgba(0,0,0,.20);
}


.map-stage{
  position:relative;

  width:100%;

  height:min(
    62vh,
    590px
  );

  min-height:430px;
}


#tripMap,
#googleMap{
  position:absolute;

  inset:0;

  width:100%;
  height:100%;
}


#googleMap{
  display:none;

  background:#10171d;
}


/* =========================================================
   TRIP MAP BACKGROUND
========================================================= */

#tripMap{
  overflow:hidden;

  isolation:isolate;

  background:

    radial-gradient(
      circle at 78% 16%,
      rgba(43,91,116,.18),
      transparent 24%
    ),

    radial-gradient(
      circle at 25% 78%,
      rgba(38,69,57,.16),
      transparent 27%
    ),

    linear-gradient(
      155deg,
      #071017,
      #0a141b 48%,
      #071016
    );
}


.trip-land{
  position:absolute;

  inset:-8%;

  z-index:0;

  opacity:.78;

  pointer-events:none;

  filter:blur(.2px);
}


.trip-land::before,
.trip-land::after{
  content:"";

  position:absolute;

  border:
    1px solid
    rgba(108,137,149,.09);

  background:
    linear-gradient(
      145deg,
      rgba(33,53,61,.42),
      rgba(15,29,35,.12)
    );

  transform:rotate(-14deg);

  border-radius:
    48% 52% 55% 45%
    /
    42% 48% 52% 58%;
}


.trip-land::before{
  width:55%;
  height:86%;

  left:24%;
  top:2%;
}


.trip-land::after{
  width:28%;
  height:46%;

  left:2%;
  top:48%;

  transform:rotate(17deg);
}


.trip-grid{
  position:absolute;

  inset:0;

  z-index:0;

  opacity:.08;

  background-image:

    linear-gradient(
      rgba(255,255,255,.12) 1px,
      transparent 1px
    ),

    linear-gradient(
      90deg,
      rgba(255,255,255,.12) 1px,
      transparent 1px
    );

  background-size:
    38px
    38px;

  mask-image:
    linear-gradient(
      to bottom,
      transparent,
      black 18%,
      black 82%,
      transparent
    );

  pointer-events:none;
}


/* =========================================================
   ROUTE
========================================================= */

.route-svg{
  position:absolute;

  inset:0;

  z-index:2;

  width:100%;
  height:100%;

  overflow:visible;

  pointer-events:none;
}


.route-shadow{
  fill:none;

  stroke:rgba(0,0,0,.48);

  stroke-width:7;

  stroke-linecap:round;
  stroke-linejoin:round;
}


.route-path{
  fill:none;

  stroke:var(--red);

  stroke-width:2.6;

  stroke-linecap:round;
  stroke-linejoin:round;

  filter:
    drop-shadow(
      0 0 5px
      rgba(255,98,95,.34)
    );
}


.route-dash{
  fill:none;

  stroke:
    rgba(
      255,
      190,
      186,
      .60
    );

  stroke-width:.8;

  stroke-dasharray:
    2 7;

  stroke-linecap:round;
}


/* =========================================================
   TRIP MARKERS
========================================================= */

.trip-marker{
  position:absolute;

  z-index:4;

  width:58px;

  transform:
    translate(
      -50%,
      -50%
    );

  padding:0;

  border:0;

  background:transparent;

  color:inherit;

  text-align:center;

  cursor:pointer;

  user-select:none;
}


.trip-marker-bubble{
  position:relative;

  width:46px;
  height:46px;

  margin:auto;

  display:grid;
  place-items:center;

  overflow:hidden;

  border:
    1.5px solid
    rgba(
      255,
      164,
      159,
      .68
    );

  border-radius:50%;

  background:
    radial-gradient(
      circle at 50% 38%,
      #25333c,
      #11191f 65%
    );

  box-shadow:

    0 7px 20px
    rgba(0,0,0,.48),

    0 0 0 3px
    rgba(7,12,16,.72),

    0 0 16px
    rgba(255,98,95,.12);

  transition:.18s ease;
}


.trip-marker.active
.trip-marker-bubble{
  transform:scale(1.16);

  border-color:#ffd0cd;

  box-shadow:

    0 9px 25px
    rgba(0,0,0,.55),

    0 0 0 4px
    rgba(255,98,95,.12),

    0 0 22px
    rgba(255,98,95,.30);
}


.trip-marker-emoji{
  font-size:22px;

  filter:
    drop-shadow(
      0 2px 4px
      rgba(0,0,0,.45)
    );
}


.trip-marker-num{
  position:absolute;

  right:-1px;
  top:-2px;

  min-width:15px;
  height:15px;

  padding:0 3px;

  display:grid;
  place-items:center;

  border:
    1px solid
    rgba(255,255,255,.30);

  border-radius:999px;

  background:var(--red);

  color:white;

  font-size:6px;
  font-weight:900;
}


.trip-marker-label{
  position:absolute;

  left:50%;
  top:51px;

  max-width:115px;

  transform:
    translateX(-50%);

  color:#eef1f2;

  font-size:7px;
  font-weight:900;

  line-height:1.15;

  white-space:nowrap;

  text-shadow:
    0 2px 5px #000,
    0 0 8px #000;
}


.trip-marker-time{
  display:block;

  margin-top:2px;

  color:#9ca7ad;

  font-size:5.5px;
  font-weight:700;
}


/* =========================================================
   MAP BADGE
========================================================= */

.map-day-badge{
  position:absolute;

  top:10px;
  left:10px;

  z-index:8;

  padding:6px 9px;

  border:
    1px solid
    rgba(255,255,255,.10);

  border-radius:9px;

  background:
    rgba(7,12,16,.88);

  color:#d7dddf;

  font-size:7px;
  font-weight:900;

  box-shadow:
    0 4px 18px
    rgba(0,0,0,.30);

  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);

  pointer-events:none;
}


.map-compass{
  position:absolute;

  right:10px;
  top:10px;

  z-index:8;

  width:29px;
  height:29px;

  display:grid;
  place-items:center;

  border:
    1px solid
    rgba(255,255,255,.09);

  border-radius:50%;

  background:
    rgba(7,12,16,.82);

  color:#b7c0c5;

  font:
    700
    8px
    Georgia,
    serif;

  pointer-events:none;
}


/* =========================================================
   SELECTED CARD
========================================================= */

.selected-card{
  position:absolute;

  left:10px;
  right:10px;
  bottom:10px;

  z-index:9;

  display:none;

  grid-template-columns:
    36px
    minmax(0,1fr)
    auto;

  align-items:center;

  gap:9px;

  padding:9px 10px;

  border:
    1px solid
    rgba(255,255,255,.10);

  border-radius:12px;

  background:
    rgba(9,15,20,.93);

  box-shadow:
    0 10px 28px
    rgba(0,0,0,.44);

  backdrop-filter:blur(14px);
}


.selected-card.show{
  display:grid;
}


.selected-num{
  width:34px;
  height:34px;

  display:grid;
  place-items:center;

  border-radius:50%;

  background:var(--red-soft);

  color:#ffc0bc;

  border:1px solid var(--red-line);

  font-size:8px;
  font-weight:900;
}


.selected-title{
  font-size:8.5px;
  font-weight:900;

  line-height:1.25;
}


.selected-meta{
  margin-top:2px;

  color:#85919a;

  font-size:6.2px;

  line-height:1.35;
}


.selected-link{
  color:#9fc2f1;

  text-decoration:none;

  font-size:6.5px;
  font-weight:900;

  white-space:nowrap;
}


/* =========================================================
   MAP NOTE
========================================================= */

.map-note{
  margin:
    7px
    2px
    14px;

  color:#71808a;

  font-size:6.5px;

  line-height:1.45;
}


/* =========================================================
   STOP LIST
========================================================= */

.section-head{
  display:flex;
  align-items:center;
  justify-content:space-between;

  gap:10px;

  margin-bottom:7px;

  color:#aeb6bb;

  font-size:7px;
  font-weight:900;

  letter-spacing:.08em;
}


.stop{
  display:grid;

  grid-template-columns:
    31px
    minmax(0,1fr)
    auto;

  gap:9px;

  align-items:center;

  margin-bottom:6px;

  padding:9px 10px;

  border:1px solid var(--line);
  border-radius:11px;

  background:#0f161c;

  cursor:pointer;
}


.stop.active{
  border-color:var(--red-line);

  background:var(--red-soft);
}


.num{
  width:31px;
  height:31px;

  display:grid;
  place-items:center;

  border:1px solid var(--red-line);
  border-radius:50%;

  background:var(--red-soft);

  color:#f3b7b3;

  font-size:8px;
  font-weight:900;
}


.stop-title{
  font-size:8.5px;
  font-weight:900;

  line-height:1.35;
}


.stop-meta{
  margin-top:3px;

  color:#75818a;

  font-size:6.5px;

  line-height:1.4;
}


.stop-notes{
  margin-top:3px;

  color:#65727b;

  font-size:6.2px;

  line-height:1.4;
}


.maps-link{
  color:#9fc2f1;

  text-decoration:none;

  font-size:6.5px;
  font-weight:900;

  white-space:nowrap;
}


/* =========================================================
   EMPTY / ERROR
========================================================= */

.empty,
.error{
  padding:22px 12px;

  border:
    1px dashed
    #344049;

  border-radius:12px;

  color:#7d8991;

  text-align:center;

  font-size:8px;

  line-height:1.55;
}


.error{
  border-color:var(--red-line);

  color:#ffc0bc;
}


/* =========================================================
   GOOGLE MAP
========================================================= */

.gm-style
.gm-style-iw-c{
  padding:0 !important;

  border-radius:12px !important;

  background:#11181e !important;

  box-shadow:
    0 8px 28px
    rgba(0,0,0,.55) !important;
}


.gm-style
.gm-style-iw-d{
  overflow:auto !important;
}


.gm-style
.gm-style-iw-tc::after{
  background:#11181e !important;
}


.gm-ui-hover-effect{
  filter:
    invert(1)
    grayscale(1);
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:480px){

  .header-inner,
  main{
    padding-left:12px;
    padding-right:12px;
  }


  .map-stage{
    height:57vh;

    min-height:420px;
  }


  .trip-marker{
    transform:
      translate(
        -50%,
        -50%
      )
      scale(.92);
  }

}

</style>

</head>



<body>


<!-- =========================================================
     HEADER
========================================================= -->

<header>

  <div class="header-inner">

    <div class="header-top">


      <div>

        <div
          id="tripEyebrow"
          class="eyebrow"
        >
          TRIP MAP
        </div>

        <h1>
          Trip Map
        </h1>

        <div
          id="tripName"
          class="trip-name"
        >
          Loading trip…
        </div>

      </div>


      <div
        class="mode-toggle"
        aria-label="Map mode"
      >

        <button
          id="tripModeBtn"
          class="mode-btn active"
          type="button"
        >
          TRIP MAP
        </button>

        <button
          id="googleModeBtn"
          class="mode-btn"
          type="button"
        >
          GOOGLE MAP
        </button>

      </div>


    </div>

  </div>

</header>



<!-- =========================================================
     MAIN
========================================================= -->

<main>


  <!-- DAY SUMMARY -->

  <div class="day-summary">

    <div class="day-summary-left">

      <div
        id="dayLabel"
        class="day-label"
      >
        LOADING
      </div>

      <div
        id="dayTitle"
        class="day-title"
      >
        Trip Map
      </div>

      <div
        id="dayArea"
        class="day-area"
      ></div>

    </div>


    <div
      id="dayCount"
      class="day-count"
    >
      —
    </div>

  </div>



  <!-- DATE BUTTONS -->

  <div
    id="dateScroller"
    class="date-scroller"
  ></div>



  <!-- MAP -->

  <div class="map-card">

    <div class="map-stage">


      <!-- PRETTY TRIP MAP -->

      <div id="tripMap">

        <div class="trip-land"></div>

        <div class="trip-grid"></div>

        <svg
          id="routeSvg"
          class="route-svg"
          preserveAspectRatio="none"
        ></svg>

        <div id="tripMarkers"></div>

      </div>


      <!-- REAL GOOGLE MAP -->

      <div id="googleMap"></div>


      <!-- MAP BADGE -->

      <div
        id="mapDayBadge"
        class="map-day-badge"
      >
        Loading map…
      </div>


      <!-- COMPASS -->

      <div
        id="tripCompass"
        class="map-compass"
      >
        N
      </div>


      <!-- SELECTED STOP -->

      <div
        id="selectedCard"
        class="selected-card"
      >

        <div
          id="selectedNum"
          class="selected-num"
        >
          1
        </div>


        <div>

          <div
            id="selectedTitle"
            class="selected-title"
          ></div>

          <div
            id="selectedMeta"
            class="selected-meta"
          ></div>

        </div>


        <a
          id="selectedLink"
          class="selected-link"
          target="_blank"
          rel="noopener noreferrer"
        >
          MAPS ↗
        </a>

      </div>


    </div>

  </div>



  <div
    id="mapNote"
    class="map-note"
  >
    Trip Map automatically redraws the route for the selected
    day. Tap a destination to see its details.
  </div>



  <!-- STOP LIST -->

  <section>

    <div class="section-head">

      <span id="listTitle">
        SCHEDULED STOPS
      </span>

      <span id="pinCount"></span>

    </div>


    <div id="stops">

      <div class="empty">
        Loading schedule…
      </div>

    </div>

  </section>


</main>



<!-- =========================================================
     SHARED FOOTER
========================================================= -->

<div id="footer"></div>



<!-- =========================================================
     SCRIPTS
========================================================= -->

<script
  src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>

<script src="supabase.js"></script>

<script src="google-maps.js"></script>

/* =========================================================

function text(value){

  return String(
    value ?? ""

}


function esc(value){

  return text(value)

    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}



/* =========================================================
   DATE HELPERS
========================================================= */

function parseDate(value){

  return new Date(
    value + "T12:00:00"
  );

}


function dayMonth(value){

  return new Intl
    .DateTimeFormat(
      "en-SG",
      {
        day:"numeric",
        month:"short"
      }
    )
    .format(
      parseDate(value)
    )
    .toUpperCase();

}


function fullDate(value){

  return new Intl
    .DateTimeFormat(
      "en-SG",
      {
        weekday:"long",
        day:"numeric",
        month:"long"
      }
    )
    .format(
      parseDate(value)
    );

}



/* =========================================================
   DISPLAY TIME
========================================================= */

function itemTime(item){

  if(item.time_label){

    return item.time_label;

  }


  if(item.start_time){

    const parts =
      item.start_time.split(":");


    let hour =
      Number(
        parts[0]
      );


    const minute =
      parts[1] || "00";


    const suffix =
      hour >= 12
      ?
      "PM"
      :
      "AM";


    hour =
      hour % 12 ||
      12;


    return (
      `${hour}:${minute} ${suffix}`
    );

  }


  return "Flexible";

}



/* =========================================================
   TIME SORTING
========================================================= */

function timeSortValue(value){

  if(!value){

    return null;

  }


  const parts =
    String(value)
      .split(":");


  const hours =
    Number(
      parts[0]
    );


  const minutes =
    Number(
      parts[1] || 0
    );


  const seconds =
    Number(
      parts[2] || 0
    );


  if(
    !Number.isFinite(hours) ||
    !Number.isFinite(minutes) ||
    !Number.isFinite(seconds)
  ){

    return null;

  }


  return (

    hours * 3600

    +

    minutes * 60

    +

    seconds

  );

}



/* =========================================================
   FLEXIBLE TIME LABEL SORTING
========================================================= */

function labelSortValue(value){

  const label =
    String(
      value || ""
    )
    .trim();


  if(!label){

    return null;

  }


  const match =
    label.match(
      /(\d{1,2})(?::(\d{2}))?\s*(AM|PM)/i
    );


  if(!match){

    return null;

  }


  let hour =
    Number(
      match[1]
    );


  const minute =
    Number(
      match[2] || 0
    );


  const suffix =
    match[3]
      .toUpperCase();


  if(hour === 12){

    hour = 0;

  }


  if(suffix === "PM"){

    hour += 12;

  }


  return (

    hour * 3600

    +

    minute * 60

  );

}



/* =========================================================
   ITEM SORT VALUE
========================================================= */

function itemSortValue(item){

  const exact =
    timeSortValue(
      item.start_time
    );


  if(exact !== null){

    return exact;

  }


  const labelTime =
    labelSortValue(
      item.time_label
    );


  if(labelTime !== null){

    return labelTime;

  }


  const label =
    String(
      item.time_label || ""
    )
    .toLowerCase()
    .trim();


  if(
    label.includes(
      "morning"
    )
  ){

    return 8 * 3600;

  }


  if(
    label.includes(
      "lunch"
    )
  ){

    return 12 * 3600;

  }


  if(
    label.includes(
      "afternoon"
    )
  ){

    return 15 * 3600;

  }


  if(
    label.includes(
      "evening"
    )
  ){

    return 18 * 3600;

  }


  if(
    label.includes(
      "afterward"
    )

    ||

    label.includes(
      "afterwards"
    )

    ||

    label.startsWith(
      "after "
    )
  ){

    return 30 * 3600;

  }


  return 29 * 3600;

}



/* =========================================================
   FINAL SCHEDULE SORT
========================================================= */

function compareScheduleItems(
  a,
  b
){

  const dateCompare =

    (
      a.schedule_date ||
      ""
    )
    .localeCompare(
      b.schedule_date ||
      ""
    );


  if(dateCompare !== 0){

    return dateCompare;

  }


  const timeA =
    itemSortValue(a);


  const timeB =
    itemSortValue(b);


  if(timeA !== timeB){

    return (
      timeA -
      timeB
    );

  }


  const orderA =

    Number.isFinite(
      Number(
        a.sort_order
      )
    )

    ?

    Number(
      a.sort_order
    )

    :

    999999;


  const orderB =

    Number.isFinite(
      Number(
        b.sort_order
      )
    )

    ?

    Number(
      b.sort_order
    )

    :

    999999;


  if(orderA !== orderB){

    return (
      orderA -
      orderB
    );

  }


  return (

    Number(
      a.id || 0
    )

    -

    Number(
      b.id || 0
    )

  );

}

/* =========================================================
   COORDINATES
========================================================= */

function coordinateNumber(value){

  if(
    value === null ||
    value === undefined ||
    value === ""
  ){

    return null;

  }


  const number =
    Number(value);


  return (

    Number.isFinite(number)

    ?

    number

    :

    null

  );

}


function itemCoordinates(item){

  const entity =
    itemEntity(item);


  const latitude =

    coordinateNumber(
      entity?.latitude
    )

    ??

    coordinateNumber(
      item.latitude
    );


  const longitude =

    coordinateNumber(
      entity?.longitude
    )

    ??

    coordinateNumber(
      item.longitude
    );


  if(
    latitude === null ||
    longitude === null
  ){

    return null;

  }


  if(
    latitude < -90 ||
    latitude > 90 ||
    longitude < -180 ||
    longitude > 180
  ){

    return null;

  }


  return {

    lat:latitude,
    lng:longitude

  };

}

/* =========================================================
   ACCESSIBLE TRIPS
========================================================= */

async function getAccessibleTrips(){

  const [
    ownResult,
    memberResult
  ] =

  await Promise.all([

    db
      .from("trips")
      .select("*")
      .eq(
        "owner_id",
        currentUser.id
      ),

    db
      .from("trip_members")
      .select("trip_id")
      .eq(
        "user_id",
        currentUser.id
      )

  ]);


  if(ownResult.error){

    throw ownResult.error;

  }


  if(memberResult.error){

    throw memberResult.error;

  }


  const resultMap =
    new Map();


  (
    ownResult.data ||
    []
  )
  .forEach(
    row => {

      resultMap.set(
        Number(row.id),
        row
      );

    }
  );


  const sharedIds = [

    ...new Set(

      (
        memberResult.data ||
        []
      )

      .map(
        row =>
          Number(
            row.trip_id
          )
      )

      .filter(Boolean)

    )

  ];


  if(sharedIds.length){

    const sharedResult =

      await db
        .from("trips")
        .select("*")
        .in(
          "id",
          sharedIds
        );


    if(sharedResult.error){

      throw sharedResult.error;

    }


    (
      sharedResult.data ||
      []
    )
    .forEach(
      row => {

        resultMap.set(
          Number(row.id),
          row
        );

      }
    );

  }


  return [
    ...resultMap.values()
  ];

}



/* =========================================================
   RESOLVE TRIP
========================================================= */

async function resolveTrip(){

  const authResult =
    await db.auth.getUser();


  if(authResult.error){

    throw authResult.error;

  }


  currentUser =
    authResult.data?.user ||
    null;


  if(!currentUser){

    location.href =
      "login.html";


    throw new Error(
      "Please sign in."
    );

  }


  const accessibleTrips =
    await getAccessibleTrips();


  if(
    !accessibleTrips.length
  ){

    throw new Error(
      "No accessible trips found."
    );

  }


  let resolved =

    accessibleTrips.find(
      row =>
        Number(row.id) ===
        Number(TRIP_ID)
    );


  if(!resolved){

    resolved =
      accessibleTrips[0];

  }


  TRIP_ID =
    Number(
      resolved.id
    );


  localStorage.setItem(
    "current_trip_id",
    String(TRIP_ID)
  );


  history.replaceState(
    null,
    "",
    `maps.html?trip=${TRIP_ID}`
  );

}

/* =========================================================
   TRIP MAP POSITIONING
========================================================= */

function layoutPositions(rows){

  if(!rows.length){

    return [];

  }


  const latitudes =
    rows.map(
      row =>
        row.coords.lat
    );


  const longitudes =
    rows.map(
      row =>
        row.coords.lng
    );


  let minLatitude =
    Math.min(
      ...latitudes
    );


  let maxLatitude =
    Math.max(
      ...latitudes
    );


  let minLongitude =
    Math.min(
      ...longitudes
    );


  let maxLongitude =
    Math.max(
      ...longitudes
    );


  if(
    maxLatitude -
    minLatitude <
    .002
  ){

    minLatitude -= .001;

    maxLatitude += .001;

  }


  if(
    maxLongitude -
    minLongitude <
    .002
  ){

    minLongitude -= .001;

    maxLongitude += .001;

  }


  const latitudeRange =
    maxLatitude -
    minLatitude;


  const longitudeRange =
    maxLongitude -
    minLongitude;


  const positions = [];


  rows.forEach(
    (
      row,
      index
    ) => {

      let x =

        12

        +

        (
          (
            row.coords.lng -
            minLongitude
          )

          /

          longitudeRange
        )

        *

        76;


      let y =

        14

        +

        (
          (
            maxLatitude -
            row.coords.lat
          )

          /

          latitudeRange
        )

        *

        61;


      /*
        If several places are almost
        on top of each other, fan them
        apart slightly.
      */

      let tries = 0;


      while(

        positions.some(
          position =>

            Math.abs(
              position.x -
              x
            ) < 8

            &&

            Math.abs(
              position.y -
              y
            ) < 9
        )

        &&

        tries < 8

      ){

        x +=

          tries % 2 === 0

          ?

          7

          :

          -5;


        y += 5;


        tries++;

      }


      positions.push({

        x:
          Math.max(
            7,
            Math.min(
              93,
              x
            )
          ),

        y:
          Math.max(
            9,
            Math.min(
              78,
              y
            )
          )

      });

    }
  );


  return positions;

}

      positions

        .map(
          position =>

            `${position.x},${position.y}`
        )

        .join(" ");


    routeSvg.setAttribute(
      "viewBox",
      "0 0 100 100"
    );


    routeSvg.innerHTML = `

      <polyline
        class="route-shadow"
        points="${points}"
      ></polyline>


      <polyline
        class="route-path"
        points="${points}"
      ></polyline>


      <polyline
        class="route-dash"
        points="${points}"
      ></polyline>

    `;

  }


  /*
    MARKERS
  */

  rows.forEach(
    (
      row,
      index
    ) => {

      const item =
        row.item;


      const position =
        positions[index];


      const marker =
        document.createElement(
          "button"
        );


      marker.type =
        "button";


      marker.className =

        "trip-marker " +

        (
          selectedStopIndex === index
          ?
          "active"
          :
          ""
        );


      marker.style.left =
        position.x + "%";


      marker.style.top =
        position.y + "%";


      marker.setAttribute(

        "aria-label",

        item.title

        ||

        itemLocation(item)

        ||

        `Stop ${index + 1}`

      );


      marker.innerHTML = `

        <span
          class="trip-marker-bubble"
        >

          <span
            class="trip-marker-emoji"
          >
            ${markerEmoji(item)}
          </span>


          <span
            class="trip-marker-num"
          >
            ${index + 1}
          </span>

        </span>


        <span
          class="trip-marker-label"
        >

          ${esc(
            item.title

            ||

            itemLocation(item)

            ||

            "Stop"
          )}


          <span
            class="trip-marker-time"
          >

            ${esc(
              itemTime(item)
            )}

          </span>

        </span>

      `;


      marker.onclick =
        () => {

          selectStop(
            index,
            rows
          );

        };


      tripMarkers.appendChild(
        marker
      );

    }
  );


  if(
    selectedStopIndex !== null

    &&

    rows[
      selectedStopIndex
    ]
  ){

    showSelectedCard(

      rows[
        selectedStopIndex
      ].item,

      selectedStopIndex

    );

  }

}



/* =========================================================
   SELECTED STOP CARD
========================================================= */

function showSelectedCard(
  item,
  index
){

  const location =
    itemLocation(item);


  const url =
    itemMapsUrl(item);


  selectedNum.textContent =
    String(
      index + 1
    );


  selectedTitle.textContent =

    item.title

    ||

    location

    ||

    "Schedule stop";


  selectedMeta.textContent = [

    itemTime(item),

    (
      location &&
      location !== item.title
    )

    ?

    location

    :

    null

  ]

  .filter(Boolean)

  .join(" · ");


  if(url){

    selectedLink.href =
      url;


    selectedLink.style.display =
      "";

  }


  else{

    selectedLink.removeAttribute(
      "href"
    );


    selectedLink.style.display =
      "none";

  }


  selectedCard
    .classList
    .add(
      "show"
    );

}



/* =========================================================
   SELECT STOP
========================================================= */

function selectStop(
  index,
  rows
){

  selectedStopIndex =
    index;


  renderTripMap(
    rows
  );


  document
    .querySelectorAll(
      ".stop"
    )
    .forEach(
      (
        element,
        stopIndex
      ) => {

        element
          .classList
          .toggle(

            "active",

            stopIndex ===
            index

          );

      }
    );

}



/* =========================================================
   GOOGLE MAP OBJECTS
========================================================= */

function clearGoogleMapObjects(){

  markers.forEach(
    marker => {

      marker.setMap(
        null
      );

    }
  );


  markers = [];


  if(routeLine){

    routeLine.setMap(
      null
    );


    routeLine =
      null;

  }


  if(infoWindow){

    infoWindow.close();

  }

}



/* =========================================================
   GOOGLE MARKER
========================================================= */

function createGoogleMarker(
  coords,
  number,
  title
){

  return new google.maps.Marker({

    map:
      googleMap,

    position:
      coords,

    title:
      title,

    zIndex:
      1000 + number,

    icon:{

      path:
        google.maps
          .SymbolPath
          .CIRCLE,

      fillColor:
        "#ff625f",

      fillOpacity:
        1,

      strokeColor:
        "#ffc1bd",

      strokeOpacity:
        1,

      strokeWeight:
        1.5,

      scale:
        14

    },

    label:{

      text:
        String(number),

      color:
        "#ffffff",

      fontSize:
        "10px",

      fontWeight:
        "900"

    }

  });

}



/* =========================================================
   GOOGLE POPUP
========================================================= */

function openMarkerInfo(
  marker,
  item
){

  const url =
    itemMapsUrl(item);


  const location =
    itemLocation(item);


  infoWindow.setContent(`

    <div
      style="
        min-width:180px;
        max-width:240px;
        padding:11px 12px;
        background:#11181e;
        color:#f5f3ef;
        font-family:system-ui,sans-serif;
        line-height:1.4;
      "
    >

      <div
        style="
          color:#ff7772;
          font-size:9px;
          font-weight:900;
        "
      >
        ${esc(
          itemTime(item)
        )}
      </div>


      <div
        style="
          margin-top:3px;
          font-size:13px;
          font-weight:800;
        "
      >

        ${esc(

          item.title

          ||

          location

          ||

          "Schedule stop"

        )}

      </div>


      ${
        location &&
        location !== item.title

        ?

        `

          <div
            style="
              margin-top:3px;
              color:#8b979f;
              font-size:10px;
            "
          >
            ${esc(location)}
          </div>

        `

        :

        ""
      }


      ${
        url

        ?

        `

          <div
            style="
              margin-top:9px;
            "
          >

            <a
              href="${esc(url)}"
              target="_blank"
              rel="noopener noreferrer"
              style="
                color:#9fc2f1;
                font-size:10px;
                font-weight:800;
                text-decoration:none;
              "
            >
              Open in Google Maps ↗
            </a>

          </div>

        `

        :

        ""
      }

    </div>

  `);


  infoWindow.open({

    map:
      googleMap,

    anchor:
      marker

  });

}



/* =========================================================
   RENDER GOOGLE MAP
========================================================= */

function renderGoogleMap(rows){

  if(!googleMap){

    return;

  }


  clearGoogleMapObjects();


  if(!rows.length){

    return;

  }


  const bounds =
    new google.maps
      .LatLngBounds();


  const path =
    rows.map(
      row =>
        row.coords
    );


  /*
    Draw route only on
    individual days.
  */

  if(
    selectedDate !== "all"

    &&

    path.length > 1
  ){

    routeLine =
      new google.maps
        .Polyline({

          map:
            googleMap,

          path:
            path,

          geodesic:
            true,

          clickable:
            false,

          strokeColor:
            "#ff625f",

          strokeOpacity:
            .76,

          strokeWeight:
            2.5

        });

  }


  rows.forEach(
    (
      row,
      index
    ) => {

      const item =
        row.item;


      const marker =
        createGoogleMarker(

          row.coords,

          index + 1,

          item.title

          ||

          itemLocation(item)

          ||

          "Stop"

        );


      marker.addListener(
        "click",
        () => {

          openMarkerInfo(
            marker,
            item
          );

        }
      );


      markers.push(
        marker
      );


      bounds.extend(
        row.coords
      );

    }
  );


  if(
    rows.length === 1
  ){

    googleMap.setCenter(
      rows[0].coords
    );


    googleMap.setZoom(
      15
    );

  }


  else{

    googleMap.fitBounds(
      bounds,
      55
    );


    google.maps.event
      .addListenerOnce(
        googleMap,
        "idle",
        () => {

          if(
            googleMap.getZoom() >
            16
          ){

            googleMap.setZoom(
              16
            );

          }

        }
      );

  }

}



/* =========================================================
   LIST
========================================================= */

function renderList(rows){

  pinCount.textContent =

    `${rows.length} PIN` +

    (
      rows.length === 1
      ?
      ""
      :
      "S"
    );


  listTitle.textContent =

    selectedDate === "all"

    ?

    "WHOLE TRIP"

    :

    `DAY ${dayNumber(
      selectedDate
    )} STOPS`;


  if(!rows.length){

    stops.innerHTML = `

      <div class="empty">

        No scheduled places with
        coordinates for this day.

      </div>

    `;


    return;

  }


  stops.innerHTML =

    rows
      .map(
        (
          row,
          index
        ) => {

          const item =
            row.item;


          const location =
            itemLocation(item);


          const url =
            itemMapsUrl(item);


          const meta = [

            selectedDate === "all"

            ?

            dayMonth(
              item.schedule_date
            )

            :

            null,

            itemTime(item),

            (
              location &&
              location !== item.title
            )

            ?

            location

            :

            null

          ]

          .filter(Boolean)

          .join(" · ");


          return `

            <div
              class="
                stop
                ${
                  selectedStopIndex === index
                  ?
                  "active"
                  :
                  ""
                }
              "
              data-stop="${index}"
            >


              <div class="num">

                ${index + 1}

              </div>


              <div>

                <div class="stop-title">

                  ${esc(

                    item.title

                    ||

                    location

                    ||

                    "Schedule stop"

                  )}

                </div>


                <div class="stop-meta">

                  ${esc(meta)}

                </div>


                ${
                  item.notes

                  ?

                  `

                    <div class="stop-notes">

                      ${esc(
                        item.notes
                      )}

                    </div>

                  `

                  :

                  ""
                }

              </div>


              ${
                url

                ?

                `

                  <a
                    class="maps-link"
                    href="${esc(url)}"
                    target="_blank"
                    rel="noopener noreferrer"
                  >
                    MAPS ↗
                  </a>

                `

                :

                ""
              }


            </div>

          `;

        }
      )
      .join("");


  stops
    .querySelectorAll(
      ".stop"
    )
    .forEach(
      element => {

        element.addEventListener(
          "click",
          event => {

            if(
              event.target.closest(
                "a"
              )
            ){

              return;

            }


            const index =
              Number(
                element.dataset.stop
              );


            selectStop(
              index,
              rows
            );

          }
        );

      }
    );

}



/* =========================================================
   RENDER EVERYTHING
========================================================= */

function renderEverything(){

  const rows =
    mapRowsForDate(
      selectedDate
    );


  renderDayHeader(
    rows
  );


  renderTripMap(
    rows
  );


  renderList(
    rows
  );


  if(googleMap){

    renderGoogleMap(
      rows
    );

  }

}



/* =========================================================
   CHANGE MAP MODE
========================================================= */

async function setMapMode(
  mode
){

  mapMode =
    mode;


  const isTrip =
    mode === "trip";


  tripMapEl.style.display =
    isTrip
    ?
    "block"
    :
    "none";


  googleMapEl.style.display =
    isTrip
    ?
    "none"
    :
    "block";


  document
    .getElementById(
      "tripCompass"
    )
    .style.display =

      isTrip
      ?
      "grid"
      :
      "none";


  tripModeBtn
    .classList
    .toggle(
      "active",
      isTrip
    );


  googleModeBtn
    .classList
    .toggle(
      "active",
      !isTrip
    );


  mapNote.textContent =

    isTrip

    ?

    "Trip Map automatically redraws the route for the selected day. Tap a destination to see its details."

    :

    "Google Map shows exact roads and coordinates. Your selected day uses the same itinerary order.";


  if(!isTrip){


    if(!googleMap){

      try{


        await loadMapAPI();


        googleMap =
          new google.maps.Map(

            googleMapEl,

            {

              center:{
                lat:35.0116,
                lng:135.7681
              },

              zoom:11,

              styles:
                DARK_MAP_STYLE,

              backgroundColor:
                "#10171d",

              mapTypeControl:
                false,

              streetViewControl:
                false,

              fullscreenControl:
                true,

              zoomControl:
                true,

              clickableIcons:
                false,

              gestureHandling:
                "greedy"

            }

          );


        infoWindow =
          new google.maps
            .InfoWindow();

      }


      catch(error){

        console.error(
          error
        );


        googleMapEl.innerHTML = `

          <div
            class="error"
            style="margin:20px"
          >

            ${esc(

              error.message

              ||

              "Google Maps could not be loaded."

            )}

          </div>

        `;


        return;

      }

    }


    setTimeout(
      () => {

        google.maps.event
          .trigger(
            googleMap,
            "resize"
          );


        renderGoogleMap(

          mapRowsForDate(
            selectedDate
          )

        );

      },
      30
    );

  }

}



/* =========================================================
   MODE BUTTONS
========================================================= */

tripModeBtn.onclick =
  () => {

    setMapMode(
      "trip"
    );

  };


googleModeBtn.onclick =
  () => {

    setMapMode(
      "google"
    );

  };



/* =========================================================
   LOAD DATA
========================================================= */

async function loadData(){

  try{


    await resolveTrip();


    const [
      tripResult,
      scheduleResult
    ] =

    await Promise.all([


      db
        .from("trips")
        .select("*")
        .eq(
          "id",
          TRIP_ID
        )
        .single(),


      loadScheduleQuery()

    ]);


    if(tripResult.error){

      throw tripResult.error;

    }


    if(scheduleResult.error){

      throw scheduleResult.error;

    }


    trip =
      tripResult.data;


    schedule =

      (
        scheduleResult.data ||
        []
      )

      .sort(
        compareScheduleItems
      );


    /*
      HEADER
    */

    tripName.textContent =
      trip?.name ||
      "My Trip";


    tripEyebrow.textContent =

      trip?.country

      ?

      `${trip.country} TRIP MAP`

      :

      "TRIP MAP";


    document.title =

      `Trip Map · ${
        trip?.name ||
        "Travel"
      }`;


    /*
      DEFAULT DAY
    */

    const dates =
      tripDates();


    selectedDate =

      dates[0]

      ||

      "all";


    /*
      RENDER
    */

    renderDates();

    renderEverything();


    /*
      CENTER ACTIVE DATE
    */

    setTimeout(
      () => {

        document
          .querySelector(
            ".date-btn.active"
          )
          ?.scrollIntoView({

            behavior:"smooth",

            block:"nearest",

            inline:"center"

          });

      },
      150
    );


    /*
      REDRAW PRETTY MAP
      ON SCREEN ROTATION / RESIZE
    */

    window.addEventListener(
      "resize",
      () => {

        if(
          mapMode === "trip"
        ){

          renderTripMap(

            mapRowsForDate(
              selectedDate
            )

          );

        }

      }
    );

  }


  catch(error){

    console.error(
      "Map page:",
      error
    );


    tripName.textContent =
      "Unable to load map";


    dayLabel.textContent =
      "ERROR";


    dayTitle.textContent =
      "Map unavailable";


    dayArea.textContent =
      "";


    mapDayBadge.textContent =
      "Map unavailable";


    stops.innerHTML = `

      <div class="error">

        ${esc(

          error.message

          ||

          "Could not load your trip map."

        )}

      </div>

    `;

  }

}



/* =========================================================
   START
========================================================= */

loadData();

</script>
