<!doctype html>
<html lang="en">

<head>
<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1, viewport-fit=cover"
>

<meta name="theme-color" content="#070c10">

<title>Forgot Password · Japan Trip</title>

<style>

:root{
  --bg:#070c10;
  --panel:#10161c;
  --panel2:#151c23;
  --line:#29323b;
  --text:#f5f5f3;
  --muted:#aeb5bc;
  --red:#c96f68;
  --green:#67c587;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;

  display:flex;
  align-items:center;
  justify-content:center;

  padding:
    24px
    16px
    calc(24px + env(safe-area-inset-bottom));

  background:
    radial-gradient(
      circle at 50% -10%,
      #17212a 0%,
      transparent 40%
    ),
    var(--bg);

  color:var(--text);

  font-family:
    Inter,
    ui-sans-serif,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
}

.wrap{
  width:100%;
  max-width:420px;
}

.back{
  display:inline-block;

  margin-bottom:18px;

  color:var(--muted);

  text-decoration:none;

  font-size:12px;
  font-weight:750;
}

.eyebrow{
  color:var(--red);

  font-size:10px;
  font-weight:900;

  letter-spacing:.15em;
  text-transform:uppercase;
}

h1{
  margin:7px 0 6px;

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-size:31px;
  line-height:1.08;
}

.subtitle{
  margin-bottom:20px;

  color:var(--muted);

  font-size:12px;
  line-height:1.55;
}

.card{
  padding:18px;

  border:1px solid var(--line);
  border-radius:20px;

  background:
    linear-gradient(
      145deg,
      #151d23,
      #0e1419
    );
}

label{
  display:block;

  margin-bottom:7px;

  color:#dce0e3;

  font-size:11px;
  font-weight:850;
}

input{
  width:100%;
  min-height:48px;

  padding:0 13px;

  border:1px solid var(--line);
  border-radius:12px;

  outline:none;

  background:#0b1116;
  color:#fff;

  font-size:14px;
}

input:focus{
  border-color:var(--red);
}

button{
  width:100%;
  min-height:48px;

  margin-top:12px;

  border:
    1px solid
    rgba(201,111,104,.45);

  border-radius:12px;

  background:
    rgba(201,111,104,.13);

  color:#f6dcda;

  font-weight:900;
  font-size:12px;

  cursor:pointer;
}

button:disabled{
  opacity:.5;
  cursor:default;
}

.message{
  display:none;

  margin-top:12px;

  padding:11px 12px;

  border-radius:11px;

  font-size:11px;
  line-height:1.45;
}

.message.error{
  display:block;

  color:#ffc7c3;

  border:
    1px solid
    rgba(201,111,104,.35);

  background:
    rgba(201,111,104,.08);
}

.message.success{
  display:block;

  color:#c4ebd0;

  border:
    1px solid
    rgba(103,197,135,.30);

  background:
    rgba(103,197,135,.08);
}

.login{
  margin-top:16px;

  text-align:center;

  color:var(--muted);

  font-size:11px;
}

.login a{
  color:#fff;
  font-weight:850;
  text-decoration:none;
}

</style>
</head>


<body>

<div class="wrap">

  <a
    class="back"
    href="login.html"
  >
    ← Back to login
  </a>


  <div class="eyebrow">
    JAPAN TRIP
  </div>

  <h1>
    Forgot password?
  </h1>

  <div class="subtitle">
    Enter your email address and we'll send you
    a link to choose a new password.
  </div>


  <div class="card">

    <form id="forgotForm">

      <label for="email">
        EMAIL ADDRESS
      </label>

      <input
        id="email"
        type="email"
        autocomplete="email"
        placeholder="you@example.com"
        required
      >


      <button
        id="submitBtn"
        type="submit"
      >
        SEND RESET LINK
      </button>


      <div
        id="message"
        class="message"
      ></div>

    </form>

  </div>


  <div class="login">

    Remembered your password?

    <a href="login.html">
      Sign in
    </a>

  </div>

</div>


<script
  src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>

<script src="supabase.js"></script>


<script>

const form =
  document.getElementById(
    "forgotForm"
  );

const emailInput =
  document.getElementById(
    "email"
  );

const submitBtn =
  document.getElementById(
    "submitBtn"
  );

const message =
  document.getElementById(
    "message"
  );


function showMessage(
  text,
  type
){

  message.textContent =
    text;

  message.className =
    "message " + type;

}


form.addEventListener(
  "submit",
  async event => {

    event.preventDefault();


    const email =
      emailInput.value
        .trim();


    if(!email){
      return;
    }


    submitBtn.disabled =
      true;

    submitBtn.textContent =
      "SENDING…";

    message.className =
      "message";


    try{

      const redirectTo =
        new URL(
          "reset-password.html",
          window.location.href
        ).href;


      const {
        error
      } =
        await db.auth
          .resetPasswordForEmail(
            email,
            {
              redirectTo
            }
          );


      if(error){
        throw error;
      }


      /*
        Don't reveal whether an email
        actually exists in the database.
      */

      showMessage(
        "If an account exists for this email, a password reset link has been sent. Check your inbox and spam folder.",
        "success"
      );


      emailInput.value = "";

    }

    catch(error){

      console.error(error);

      showMessage(
        error.message ||
        "Unable to send the reset email. Please try again.",
        "error"
      );

    }

    finally{

      submitBtn.disabled =
        false;

      submitBtn.textContent =
        "SEND RESET LINK";

    }

  }
);

</script>

</body>
</html>
