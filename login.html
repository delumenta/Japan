<!doctype html>
<html lang="en">

<head>
<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1, viewport-fit=cover"
>

<meta name="theme-color" content="#05090c">

<title>Sign in · Travel</title>

<style>

:root{
  --bg:#05090c;
  --panel:#0d151b;
  --line:#2b3942;
  --text:#f5f2ed;
  --muted:#8f9ca5;
  --red:#ff625f;
  --green:#67c587;

  --serif:
    Georgia,
    "Times New Roman",
    serif;
}

*{
  box-sizing:border-box;
}

html,
body{
  min-height:100%;
}

body{
  margin:0;

  min-height:100vh;

  display:flex;
  align-items:center;
  justify-content:center;

  padding:
    calc(28px + env(safe-area-inset-top))
    16px
    calc(28px + env(safe-area-inset-bottom));

  color:var(--text);

  font-family:
    Inter,
    ui-sans-serif,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

  -webkit-font-smoothing:antialiased;

  background-image:

    linear-gradient(
      180deg,
      rgba(3,7,9,.28) 0%,
      rgba(3,7,9,.36) 42%,
      rgba(3,7,9,.76) 100%
    ),

    linear-gradient(
      90deg,
      rgba(3,7,9,.30) 0%,
      rgba(3,7,9,.08) 50%,
      rgba(3,7,9,.30) 100%
    ),

    url("https://zngncasvdrrxyrkjqutj.supabase.co/storage/v1/object/sign/Photos/Login.png?token=eyJraWQiOiIzOTgxNDUwNy1mM2QwLTQ5ZGItODA4My0xODg1MWZkNGYxMmEiLCJhbGciOiJIUzUxMiJ9.eyJ1cmwiOiJQaG90b3MvTG9naW4ucG5nIiwic2NvcGUiOiJkb3dubG9hZCIsImlhdCI6MTc4OTc0NDE4OSwiZXhwIjozMTcxNDk3NDQxODl9.X7moDFBcRY_zc43Mn23R5gv4BDFcyV9r6fxCmFgiUM8pVmaYHRkzyvgI3KkNlea7qzAM8VcgHrc2MhAo6U4cZg");

  background-size:cover;
  background-position:center center;
  background-repeat:no-repeat;
  background-attachment:fixed;
}


/* =========================================
   BACKGROUND VIGNETTE
========================================= */

body::after{
  content:"";

  position:fixed;
  inset:0;

  pointer-events:none;

  background:
    radial-gradient(
      ellipse at center,
      rgba(0,0,0,0) 28%,
      rgba(0,0,0,.13) 67%,
      rgba(0,0,0,.40) 100%
    );
}

button,
input{
  font:inherit;
}


/* =========================================
   LOGIN WRAPPER
========================================= */

.login-wrap{
  position:relative;
  z-index:1;

  width:100%;
  max-width:370px;
}


/* =========================================
   CARD
========================================= */

.card{
  position:relative;

  overflow:hidden;

  padding:
    24px
    22px
    21px;

  border:
    1px solid
    rgba(73,90,101,.74);

  border-radius:19px;

  background:
    linear-gradient(
      145deg,
      rgba(17,27,34,.96),
      rgba(9,16,21,.97)
    );

  box-shadow:
    0 24px 70px rgba(0,0,0,.42),
    0 2px 8px rgba(0,0,0,.24);

  backdrop-filter:blur(13px);
  -webkit-backdrop-filter:blur(13px);
}


/* coral top line */

.card::before{
  content:"";

  position:absolute;

  top:0;
  left:17px;
  right:17px;

  height:3px;

  border-radius:
    0
    0
    4px
    4px;

  background:var(--red);
}


/* =========================================
   HEADER
========================================= */

.header{
  display:flex;
  align-items:center;

  gap:14px;

  margin-bottom:13px;
}


/* =========================================
   LOGO
========================================= */

.logo{
  width:52px;
  height:52px;

  flex:
    0
    0
    52px;

  display:grid;
  place-items:center;

  border:
    1px solid
    rgba(255,98,95,.34);

  border-radius:50%;

  background:
    rgba(5,10,13,.50);
}

.logo img{
  width:42px;
  height:42px;

  display:block;

  object-fit:contain;
}


/* =========================================
   TITLE
========================================= */

.title-block{
  min-width:0;
}

h1{
  margin:0;

  font-family:var(--serif);

  font-size:29px;
  line-height:1;

  letter-spacing:-.035em;

  white-space:nowrap;
}

h1 span{
  color:var(--red);
}


/* =========================================
   SUBTITLE
========================================= */

.subtitle{
  margin:
    0
    0
    18px;

  color:#9ba8b0;

  font-size:10px;
  line-height:1.5;
}


/* =========================================
   DIVIDER
========================================= */

.divider{
  height:1px;

  margin:
    0
    -4px
    17px;

  background:
    linear-gradient(
      90deg,
      transparent,
      rgba(255,255,255,.09) 8%,
      rgba(255,255,255,.09) 92%,
      transparent
    );
}


/* =========================================
   FORM
========================================= */

.field + .field{
  margin-top:12px;
}

label{
  display:block;

  margin-bottom:6px;

  color:#a9b6be;

  font-size:7px;
  font-weight:900;

  letter-spacing:.13em;
}

input{
  width:100%;

  min-height:51px;

  padding:
    0
    13px;

  border:
    1px solid
    #2a3943;

  border-radius:11px;

  outline:none;

  background:
    rgba(4,10,14,.73);

  color:#fff;

  font-size:12px;

  transition:
    border-color .15s ease,
    background .15s ease,
    box-shadow .15s ease;
}

input::placeholder{
  color:#61717b;
}

input:focus{
  border-color:
    rgba(255,98,95,.58);

  background:#081116;

  box-shadow:
    0
    0
    0
    3px
    rgba(255,98,95,.055);
}


/* =========================================
   PASSWORD
========================================= */

.password-wrap{
  position:relative;
}

.password-wrap input{
  padding-right:48px;
}

.eye{
  position:absolute;

  top:50%;
  right:5px;

  width:38px;
  height:38px;

  transform:
    translateY(-50%);

  display:grid;
  place-items:center;

  border:0;

  background:transparent;

  color:#829099;

  font-size:13px;

  cursor:pointer;
}


/* =========================================
   FORGOT PASSWORD
========================================= */

.forgot-row{
  display:flex;

  justify-content:flex-end;

  margin-top:7px;
}

.forgot-row a{
  color:#9ba7ae;

  text-decoration:none;

  font-size:8px;
  font-weight:750;
}

.forgot-row a:hover{
  color:#fff;
}


/* =========================================
   SIGN IN BUTTON
========================================= */

.login-button{
  width:100%;

  min-height:47px;

  margin-top:15px;

  border:
    1px solid
    rgba(255,98,95,.72);

  border-radius:11px;

  background:
    linear-gradient(
      180deg,
      rgba(255,98,95,.23),
      rgba(255,98,95,.14)
    );

  color:#ffe0dd;

  font-size:9px;
  font-weight:950;

  letter-spacing:.15em;

  cursor:pointer;

  transition:
    background .15s ease,
    transform .08s ease;
}

.login-button:hover{
  background:
    rgba(255,98,95,.23);
}

.login-button:active{
  transform:
    translateY(1px);
}

.login-button:disabled{
  opacity:.5;
  cursor:default;
}


/* =========================================
   MESSAGE
========================================= */

.message{
  display:none;

  margin-top:11px;

  padding:
    10px
    11px;

  border-radius:10px;

  font-size:9px;
  line-height:1.45;
}

.message.error{
  display:block;

  color:#ffc7c3;

  border:
    1px solid
    rgba(255,98,95,.32);

  background:
    rgba(255,98,95,.07);
}

.message.success{
  display:block;

  color:#c4ebd0;

  border:
    1px solid
    rgba(103,197,135,.28);

  background:
    rgba(103,197,135,.07);
}


/* =========================================
   SIGN UP
========================================= */

.signup{
  display:flex;

  justify-content:center;
  align-items:center;

  gap:4px;

  margin-top:16px;

  padding-top:16px;

  border-top:
    1px solid
    rgba(255,255,255,.07);

  color:#8b98a0;

  font-size:9px;
}

.signup button{
  padding:0;

  border:0;

  background:none;

  color:#fff;

  font-size:9px;
  font-weight:900;

  cursor:pointer;
}

.signup button:hover{
  color:#ff8b87;
}


/* =========================================
   FOOTER
========================================= */

.footer{
  margin-top:13px;

  color:
    rgba(139,153,162,.62);

  text-align:center;

  font-size:7px;
  font-weight:700;

  letter-spacing:.14em;

  text-transform:uppercase;

  text-shadow:
    0
    2px
    7px
    rgba(0,0,0,.9);
}


/* =========================================
   MOBILE
========================================= */

@media(max-width:480px){

  body{
    align-items:center;

    padding-left:13px;
    padding-right:13px;

    background-attachment:scroll;

    background-position:
      center
      center;
  }

  .login-wrap{
    max-width:355px;
  }

  .card{
    padding:
      22px
      18px
      19px;
  }

  .logo{
    width:48px;
    height:48px;

    flex-basis:48px;
  }

  .logo img{
    width:39px;
    height:39px;
  }

  h1{
    font-size:27px;
  }

}

@media(max-width:350px){

  h1{
    font-size:25px;
  }

  .header{
    gap:11px;
  }

  .card{
    padding-left:15px;
    padding-right:15px;
  }

}

</style>
</head>


<body>


<div class="login-wrap">


  <!-- =====================================
       LOGIN CARD
  ====================================== -->

  <div class="card">


    <!-- HEADER -->

    <div class="header">

      <div class="logo">

        <img
          src="https://zngncasvdrrxyrkjqutj.supabase.co/storage/v1/object/sign/Photos/Travel3Logo.png?token=eyJraWQiOiIzOTgxNDUwNy1mM2QwLTQ5ZGItODA4My0xODg1MWZkNGYxMmEiLCJhbGciOiJIUzUxMiJ9.eyJ1cmwiOiJQaG90b3MvVHJhdmVsM0xvZ28ucG5nIiwic2NvcGUiOiJkb3dubG9hZCIsImlhdCI6MTc4OTcwNDUwMiwiZXhwIjozMzMyNTcwNDUwMn0.ciD2sShYC95aeLTucRmbI-AvrtletO259ymPAGCURr4FXltkLRmqiKd_yzkwrLl_q4XGahAWzevvfVkWyGOlZg"
          alt="Travel logo"
        >

      </div>


      <div class="title-block">

        <h1>
          Welcome back<span>.</span>
        </h1>

      </div>

    </div>


    <!-- SUBTITLE -->

    <div class="subtitle">

      Sign in to open your trips,
      schedule, restaurants and bookings.

    </div>


    <div class="divider"></div>


    <!-- =====================================
         FORM
    ====================================== -->

    <form id="loginForm">


      <!-- EMAIL -->

      <div class="field">

        <label for="email">
          EMAIL ADDRESS
        </label>

        <input
          id="email"
          type="email"
          autocomplete="email"
          placeholder="you@example.com"
          required
        >

      </div>


      <!-- PASSWORD -->

      <div class="field">

        <label for="password">
          PASSWORD
        </label>


        <div class="password-wrap">

          <input
            id="password"
            type="password"
            autocomplete="current-password"
            placeholder="Your password"
            required
          >

          <button
            id="eyeButton"
            class="eye"
            type="button"
            aria-label="Show password"
          >
            ◉
          </button>

        </div>


        <div class="forgot-row">

          <a href="forgot-password.html">
            Forgot password?
          </a>

        </div>

      </div>


      <!-- LOGIN -->

      <button
        id="loginButton"
        class="login-button"
        type="submit"
      >
        SIGN IN
      </button>


      <!-- MESSAGE -->

      <div
        id="message"
        class="message"
      ></div>


    </form>


    <!-- =====================================
         SIGN UP
    ====================================== -->

    <div class="signup">

      <span>
        Don't have an account?
      </span>

      <button
        id="signupButton"
        type="button"
      >
        Create one
      </button>

    </div>


  </div>


  <!-- FOOTER -->

  <div class="footer">
    Your trips are linked to your account
  </div>


</div>



<!-- =========================================
     SUPABASE
========================================= -->

<script
  src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>

<script src="supabase.js"></script>


<script>

/* =========================================
   ELEMENTS
========================================= */

const loginForm =
  document.getElementById(
    "loginForm"
  );

const emailInput =
  document.getElementById(
    "email"
  );

const passwordInput =
  document.getElementById(
    "password"
  );

const loginButton =
  document.getElementById(
    "loginButton"
  );

const signupButton =
  document.getElementById(
    "signupButton"
  );

const eyeButton =
  document.getElementById(
    "eyeButton"
  );

const message =
  document.getElementById(
    "message"
  );


/* =========================================
   MESSAGE
========================================= */

function showMessage(
  text,
  type
){

  message.textContent =
    text;

  message.className =
    "message " + type;

}


function clearMessage(){

  message.textContent = "";

  message.className =
    "message";

}


/* =========================================
   SHOW / HIDE PASSWORD
========================================= */

eyeButton.addEventListener(
  "click",
  () => {

    const showing =
      passwordInput.type === "text";


    passwordInput.type =
      showing
        ? "password"
        : "text";


    eyeButton.textContent =
      showing
        ? "◉"
        : "●";


    eyeButton.setAttribute(
      "aria-label",
      showing
        ? "Show password"
        : "Hide password"
    );

  }
);


/* =========================================
   ALREADY LOGGED IN?
========================================= */

async function checkSession(){

  const {
    data,
    error
  } =
    await db.auth.getSession();


  if(error){

    console.error(error);

    return;

  }


  if(data?.session){

    window.location.replace(
      "index.html"
    );

  }

}


/* =========================================
   SIGN IN
========================================= */

loginForm.addEventListener(
  "submit",
  async event => {

    event.preventDefault();

    clearMessage();


    const email =
      emailInput.value
        .trim();

    const password =
      passwordInput.value;


    if(
      !email ||
      !password
    ){

      showMessage(
        "Enter your email and password.",
        "error"
      );

      return;

    }


    loginButton.disabled =
      true;

    signupButton.disabled =
      true;

    loginButton.textContent =
      "SIGNING IN…";


    try{

      const {
        data,
        error
      } =
        await db.auth
          .signInWithPassword({
            email,
            password
          });


      if(error){
        throw error;
      }


      if(!data?.session){

        throw new Error(
          "Unable to start your session."
        );

      }


      showMessage(
        "Signed in. Opening your trips…",
        "success"
      );


      window.location.replace(
        "index.html"
      );

    }

    catch(error){

      console.error(error);


      showMessage(
        "Email or password is incorrect.",
        "error"
      );


      loginButton.disabled =
        false;

      signupButton.disabled =
        false;

      loginButton.textContent =
        "SIGN IN";

    }

  }
);


/* =========================================
   SIGN UP
========================================= */

signupButton.addEventListener(
  "click",
  async () => {

    clearMessage();


    const email =
      emailInput.value
        .trim();

    const password =
      passwordInput.value;


    if(!email){

      showMessage(
        "Enter the email you want to use first.",
        "error"
      );

      emailInput.focus();

      return;

    }


    if(
      !password ||
      password.length < 8
    ){

      showMessage(
        "Choose a password with at least 8 characters.",
        "error"
      );

      passwordInput.focus();

      return;

    }


    loginButton.disabled =
      true;

    signupButton.disabled =
      true;

    signupButton.textContent =
      "CREATING…";


    try{

      const redirectTo =
        new URL(
          "login.html",
          window.location.href
        ).href;


      const {
        data,
        error
      } =
        await db.auth
          .signUp({
            email,
            password,

            options:{
              emailRedirectTo:
                redirectTo
            }
          });


      if(error){
        throw error;
      }


      if(
        data?.user &&
        !data?.session
      ){

        showMessage(
          "Account created. Check your email to confirm your account, then come back and sign in.",
          "success"
        );

      }

      else if(data?.session){

        showMessage(
          "Account created. Opening your trips…",
          "success"
        );


        setTimeout(() => {

          window.location.replace(
            "index.html"
          );

        },700);

      }

      else{

        showMessage(
          "Account created. You can now sign in.",
          "success"
        );

      }

    }

    catch(error){

      console.error(error);


      showMessage(
        error.message ||
        "Unable to create your account.",
        "error"
      );

    }

    finally{

      loginButton.disabled =
        false;

      signupButton.disabled =
        false;

      loginButton.textContent =
        "SIGN IN";

      signupButton.textContent =
        "Create one";

    }

  }
);


/* =========================================
   RESET SUCCESS
========================================= */

const params =
  new URLSearchParams(
    window.location.search
  );


if(
  params.get("reset") ===
  "success"
){

  showMessage(
    "Password changed successfully. Sign in with your new password.",
    "success"
  );

}


/* =========================================
   START
========================================= */

checkSession();

</script>

</body>
</html>
