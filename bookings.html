<!doctype html>
<html lang="en">

<head>
<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1, viewport-fit=cover"
>

<meta name="theme-color" content="#070c10">

<title>Bookings · Japan Trip</title>

<style>
/* Shared visual system with food.html + schedule.html */
:root{
  --bg:#070c10;
  --surface:#0d1318;
  --surface-2:#11181e;
  --surface-3:#151d24;
  --line:#263039;
  --line-soft:rgba(255,255,255,.065);
  --text:#f5f3ef;
  --muted:#929ca4;
  --muted-2:#66727b;
  --red:#ff625f;
  --red-soft:rgba(255,98,95,.09);
  --red-line:rgba(255,98,95,.30);
  --green:#79c995;
  --orange:#efa875;
  --blue:#78a9ef;
  --gold:#e4bd69;
}

*{box-sizing:border-box}
html{scroll-behavior:smooth}

body{
  margin:0;
  min-height:100vh;
  color:var(--text);
  background:
    radial-gradient(circle at 50% -8%,rgba(42,56,68,.30),transparent 28%),
    var(--bg);
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased;
}

button,input,textarea,select{font:inherit}
button{-webkit-tap-highlight-color:transparent}

/* =========================================================
   HEADER — MATCHES FOOD / PLAN
========================================================= */
header{
  position:sticky;
  top:0;
  z-index:40;
  border-bottom:1px solid var(--line-soft);
  background:rgba(7,12,16,.965);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
}

.header-inner{
  width:100%;
  max-width:760px;
  margin:0 auto;
  padding:calc(14px + env(safe-area-inset-top)) 14px 0;
}

.title-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:14px;
}

.title-row>div:first-child{min-width:0}

.eyebrow{
  margin-bottom:2px;
  color:var(--red);
  font-size:7px;
  font-weight:900;
  letter-spacing:.17em;
  text-transform:uppercase;
}

.booking-page-title{
  display:flex;
  align-items:center;
  gap:9px;
  margin:0;
}

.booking-page-title-icon{
  width:44px;
  height:44px;
  flex:0 0 44px;
  display:block;
  object-fit:contain;
}

.booking-page-title span{
  font-family:Georgia,"Times New Roman",serif;
  font-size:27px;
  font-weight:700;
  line-height:1;
}

.trip-name{
  margin:3px 0 0 53px;
  overflow:hidden;
  color:var(--muted);
  font-size:8px;
  font-weight:600;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.add-btn{
  flex:0 0 auto;
  min-height:36px;
  padding:7px 11px;
  border:1px solid var(--red-line);
  border-radius:10px;
  background:var(--red-soft);
  color:#f3b7b3;
  font-size:8px;
  font-weight:900;
  letter-spacing:.04em;
  cursor:pointer;
}

.add-btn:active{transform:scale(.95)}

/* =========================================================
   MAIN
========================================================= */
main{
  width:100%;
  max-width:760px;
  margin:0 auto;
  padding:14px 14px 100px;
}

/* =========================================================
   SUMMARY
========================================================= */
.summary{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:6px;
  margin-bottom:10px;
}

.summary-card{
  min-width:0;
  padding:10px 7px;
  border:1px solid #252f37;
  border-radius:12px;
  background:linear-gradient(145deg,rgba(20,28,34,.97),rgba(12,18,23,.98));
  text-align:center;
  box-shadow:0 5px 15px rgba(0,0,0,.10);
}

.summary-number{
  font-family:Georgia,"Times New Roman",serif;
  font-size:21px;
  font-weight:800;
  line-height:1;
}

.summary-label{
  margin-top:4px;
  color:#748089;
  font-size:6.5px;
  font-weight:900;
  letter-spacing:.05em;
}

.summary-card.action .summary-number{color:var(--orange)}
.summary-card.booked .summary-number{color:var(--green)}

/* =========================================================
   STATUS FILTERS — SAME CHIP LANGUAGE AS FOOD
========================================================= */
.filters,
.type-filters{
  display:flex;
  align-items:center;
  gap:5px;
  width:100%;
  overflow-x:auto;
  scrollbar-width:none;
  -webkit-overflow-scrolling:touch;
}

.filters::-webkit-scrollbar,
.type-filters::-webkit-scrollbar{display:none}

.filters{margin-bottom:6px}
.type-filters{
  margin-bottom:15px;
  padding-bottom:1px;
}

.filter-btn,
.type-filter{
  flex:0 0 auto;
  min-height:27px;
  padding:4px 9px;
  border:1px solid var(--line);
  border-radius:999px;
  background:rgba(17,24,30,.80);
  color:#8d979e;
  font-size:7px;
  font-weight:850;
  white-space:nowrap;
  cursor:pointer;
}

.filter-btn.active{
  border-color:var(--red-line);
  background:var(--red-soft);
  color:#f0c0bc;
}

.type-filter{
  min-height:26px;
  background:#0f161c;
  color:#77838b;
}

.type-filter.active{
  border-color:rgba(120,169,239,.25);
  background:rgba(120,169,239,.055);
  color:#a7c7f3;
}

/* =========================================================
   SECTION
========================================================= */
.section{margin-bottom:20px}

.section-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin:2px 1px 8px;
  padding-bottom:6px;
  border-bottom:1px solid var(--line-soft);
}

.section-title{
  color:#bfc5c9;
  font-size:8px;
  font-weight:900;
  letter-spacing:.07em;
}

.section-title.action{color:var(--orange)}
.section-title.booked{color:var(--green)}

.section-count{
  color:#626e76;
  font-size:7px;
  font-weight:900;
}

/* =========================================================
   DATE GROUP
========================================================= */
.date-group{margin-bottom:12px}

.date-label{
  margin:0 2px 6px;
  color:#78858d;
  font-size:6.5px;
  font-weight:900;
  letter-spacing:.08em;
}

/* =========================================================
   BOOKING CARD
========================================================= */
.booking-card{
  position:relative;
  margin-bottom:8px;
  padding:11px 11px 9px;
  overflow:hidden;
  border:1px solid #252f37;
  border-radius:14px;
  background:linear-gradient(145deg,rgba(20,28,34,.97),rgba(12,18,23,.98));
  box-shadow:0 6px 18px rgba(0,0,0,.13);
  cursor:pointer;
  transition:border-color .18s ease,transform .18s ease;
}

.booking-card::before{
  content:"";
  position:absolute;
  top:0;
  left:13px;
  right:13px;
  height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.07),transparent);
}

.booking-top{
  display:flex;
  align-items:flex-start;
  gap:9px;
}

.booking-icon{
  width:34px;
  height:34px;
  flex:0 0 34px;
  display:flex;
  align-items:center;
  justify-content:center;
  border:1px solid rgba(255,98,95,.16);
  border-radius:10px;
  background:rgba(255,98,95,.055);
  font-size:16px;
}

.booking-main{
  flex:1;
  min-width:0;
}

.booking-title{
  color:#f8f7f4;
  font-size:10px;
  font-weight:900;
  line-height:1.3;
}

.booking-meta{
  margin-top:3px;
  color:#919ba2;
  font-size:7.5px;
  line-height:1.4;
}

.booking-note{
  margin-top:6px;
  color:#8f999f;
  font-size:7.5px;
  line-height:1.5;
}

/* STATUS */
.status-badge{
  flex:0 0 auto;
  padding:2px 5px;
  border:1px solid rgba(255,255,255,.07);
  border-radius:999px;
  background:rgba(255,255,255,.025);
  font-size:6px;
  font-weight:900;
  white-space:nowrap;
}

.status-badge.planned{
  border-color:rgba(238,168,117,.22);
  background:rgba(238,168,117,.055);
  color:#efb07d;
}

.status-badge.booked{
  border-color:rgba(121,201,149,.22);
  background:rgba(121,201,149,.055);
  color:#9edab3;
}

.status-badge.cancelled{
  color:#7f8990;
}

/* DETAILS */
.detail-row{
  display:flex;
  flex-wrap:wrap;
  gap:4px;
  margin-top:8px;
}

.detail-pill{
  display:inline-flex;
  align-items:center;
  min-height:22px;
  padding:3px 6px;
  border:0;
  border-radius:6px;
  background:rgba(255,255,255,.035);
  color:#aab3b9;
  font-size:6.5px;
  font-weight:800;
}

.detail-pill.link{
  border:1px solid rgba(120,169,239,.16);
  background:rgba(120,169,239,.035);
  color:#91b9ef;
  text-decoration:none;
}

/* QUICK BOOK */
.quick-book{
  width:100%;
  min-height:29px;
  margin-top:9px;
  padding:5px 8px;
  border:1px solid rgba(121,201,149,.18);
  border-radius:8px;
  background:rgba(121,201,149,.035);
  color:#8fd0a6;
  font-size:6.5px;
  font-weight:900;
  cursor:pointer;
}

/* =========================================================
   EMPTY / STATE
========================================================= */
.empty,
.state{
  padding:36px 18px;
  border:1px dashed #303b43;
  border-radius:14px;
  background:rgba(255,255,255,.012);
  color:#77838b;
  font-size:8px;
  line-height:1.6;
  text-align:center;
}

.empty strong,
.state strong{
  display:block;
  margin-bottom:5px;
  color:#e8e7e3;
  font-family:Georgia,"Times New Roman",serif;
  font-size:14px;
  font-weight:700;
}

/* =========================================================
   ADD / EDIT SHEET — SAME AS FOOD / PLAN
========================================================= */
.sheet-backdrop{
  position:fixed;
  inset:0;
  z-index:150;
  display:none;
  align-items:flex-end;
  background:rgba(0,0,0,.72);
  backdrop-filter:blur(5px);
  -webkit-backdrop-filter:blur(5px);
}

.sheet-backdrop.open{display:flex}

.sheet{
  width:100%;
  max-width:620px;
  max-height:calc(92vh - env(safe-area-inset-top));
  margin:0 auto;
  padding:8px 14px calc(18px + env(safe-area-inset-bottom));
  overflow-y:auto;
  border:1px solid var(--line);
  border-radius:20px 20px 0 0;
  background:#0c1217;
  box-shadow:0 -20px 50px rgba(0,0,0,.35);
}

.sheet-handle{
  width:36px;
  height:4px;
  margin:2px auto 13px;
  border-radius:999px;
  background:#35414a;
}

.sheet-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:14px;
}

.sheet-title{
  font-family:Georgia,"Times New Roman",serif;
  font-size:19px;
}

.close-btn{
  width:34px;
  height:34px;
  border:1px solid var(--line);
  border-radius:9px;
  background:#131b21;
  color:#fff;
  cursor:pointer;
}

/* FORM */
.form-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
}

.field.full{grid-column:1/-1}

.field label{
  display:block;
  margin-bottom:4px;
  color:#8d989f;
  font-size:6.5px;
  font-weight:900;
  letter-spacing:.04em;
}

.field input,
.field textarea,
.field select{
  width:100%;
  min-height:40px;
  padding:8px 9px;
  border:1px solid var(--line);
  border-radius:9px;
  outline:0;
  background:#0f161c;
  color:#fff;
  font-size:9px;
}

.field textarea{
  min-height:76px;
  resize:vertical;
}

.field input:focus,
.field textarea:focus,
.field select:focus{
  border-color:var(--red-line);
}

.sheet-actions{
  display:grid;
  grid-template-columns:1fr 2fr;
  gap:6px;
  margin-top:11px;
}

.delete-btn,
.save-btn{
  min-height:43px;
  border-radius:10px;
  font-size:8px;
  font-weight:900;
  cursor:pointer;
}

.delete-btn{
  border:1px solid rgba(255,98,95,.20);
  background:rgba(255,98,95,.04);
  color:#d98a83;
}

.save-btn{
  border:1px solid rgba(121,201,149,.24);
  background:rgba(121,201,149,.07);
  color:#a7dbb8;
}

.save-btn:disabled,
.delete-btn:disabled{opacity:.5}

.form-message{
  display:none;
  margin-top:8px;
  padding:8px;
  border-radius:8px;
  font-size:8px;
}

.form-message.error{
  display:block;
  border:1px solid rgba(255,98,95,.20);
  background:rgba(255,98,95,.055);
  color:#f3aaa6;
}

/* =========================================================
   MOBILE
========================================================= */
@media(max-width:480px){
  .header-inner{padding-left:12px;padding-right:12px}
  main{padding-left:12px;padding-right:12px}

  .booking-page-title-icon{
    width:40px;
    height:40px;
    flex-basis:40px;
  }

  .booking-page-title span{font-size:25px}
  .trip-name{margin-left:49px}

  .booking-card{padding:10px}
}

/* =========================================================
   DESKTOP
========================================================= */
@media(min-width:700px){
  .booking-card:hover{
    border-color:#35414a;
    transform:translateY(-1px);
  }
}
</style>
</head>


<body>


<!-- =========================================================
     HEADER
========================================================= -->

<header>

  <div class="header-inner">

    <div class="title-row">

      <div>

        <div id="tripEyebrow" class="eyebrow">
          LOADING TRIP…
        </div>

        <h1 class="booking-page-title">
          <img class="booking-page-title-icon" src="https://zngncasvdrrxyrkjqutj.supabase.co/storage/v1/object/sign/Photos/Booking.png?token=eyJraWQiOiIzOTgxNDUwNy1mM2QwLTQ5ZGItODA4My0xODg1MWZkNGYxMmEiLCJhbGciOiJIUzUxMiJ9.eyJ1cmwiOiJQaG90b3MvQm9va2luZy5wbmciLCJzY29wZSI6ImRvd25sb2FkIiwiaWF0IjoxNzg5NjI3ODU2LCJleHAiOjIxMDQ5ODc4NTZ9.So320gSGj5TK_okESeEqmZGSK03R15D1KjrIvXnie1CCuG3av6uoiXvs54kSmfUYqcjTmkzyYQ6RkIrPeAW_-w" alt="" aria-hidden="true">
          <span>Bookings</span>
        </h1>

        <div
          id="tripName"
          class="trip-name"
        >
          Loading trip…
        </div>

      </div>


      <button
        id="addButton"
        class="add-btn"
        type="button"
      >
        ＋ ADD
      </button>

    </div>

  </div>

</header>



<!-- =========================================================
     MAIN
========================================================= -->

<main>

  <div
    id="content"
    class="state"
  >

    <strong>
      Loading bookings…
    </strong>

    Getting your booking list from Supabase.

  </div>

</main>



<!-- =========================================================
     EDIT SHEET
========================================================= -->

<div
  id="bookingSheet"
  class="sheet-backdrop"
>

  <div class="sheet">

    <div class="sheet-handle"></div>


    <div class="sheet-head">

      <div
        id="sheetTitle"
        class="sheet-title"
      >
        Add Booking
      </div>


      <button
        id="closeSheet"
        class="close-btn"
        type="button"
      >
        ✕
      </button>

    </div>


    <form id="bookingForm">

      <div class="form-grid">


        <!-- STATUS -->

        <div class="field">

          <label>
            STATUS
          </label>

          <select id="fieldStatus">

            <option value="planned">
              ⏳ To Book
            </option>

            <option value="booked">
              ✅ Booked
            </option>

            <option value="cancelled">
              ❌ Cancelled
            </option>

          </select>

        </div>


        <!-- TYPE -->

        <div class="field">

          <label>
            TYPE
          </label>

          <select id="fieldType">

            <option value="accommodation">
              🏨 Accommodation
            </option>

            <option value="restaurant">
              🍽 Restaurant
            </option>

            <option value="ticket">
              🎟 Ticket
            </option>

            <option value="transport">
              🚆 Transport
            </option>

            <option value="car">
              🚗 Car
            </option>

            <option value="activity">
              🎡 Activity
            </option>

            <option value="other">
              📌 Other
            </option>

          </select>

        </div>


        <!-- TITLE -->

        <div class="field full">

          <label>
            TITLE
          </label>

          <input
            id="fieldTitle"
            required
            placeholder="e.g. teamLab Biovortex"
          >

        </div>


        <!-- DATE -->

        <div class="field">

          <label>
            DATE
          </label>

          <input
            id="fieldDate"
            type="date"
          >

        </div>


        <!-- TIME -->

        <div class="field">

          <label>
            TIME
          </label>

          <input
            id="fieldTime"
            type="time"
          >

        </div>


        <!-- PROVIDER -->

        <div class="field full">

          <label>
            PROVIDER
          </label>

          <input
            id="fieldProvider"
            placeholder="e.g. Agoda, Klook, JR West"
          >

        </div>


        <!-- LOCATION -->

        <div class="field full">

          <label>
            LOCATION
          </label>

          <input
            id="fieldLocation"
            placeholder="e.g. Kyoto"
          >

        </div>


        <!-- ADDRESS -->

        <div class="field full">

          <label>
            ADDRESS
          </label>

          <input
            id="fieldAddress"
            placeholder="Optional"
          >

        </div>


        <!-- CONFIRMATION -->

        <div class="field full">

          <label>
            CONFIRMATION NUMBER
          </label>

          <input
            id="fieldConfirmation"
            placeholder="Optional"
          >

        </div>


        <!-- BOOKING URL -->

        <div class="field full">

          <label>
            BOOKING / TICKET LINK
          </label>

          <input
            id="fieldUrl"
            type="url"
            placeholder="https://..."
          >

        </div>


        <!-- AMOUNT -->

        <div class="field">

          <label>
            AMOUNT
          </label>

          <input
            id="fieldAmount"
            type="number"
            min="0"
            step="0.01"
            placeholder="0"
          >

        </div>


        <!-- CURRENCY -->

        <div class="field">

          <label>
            CURRENCY
          </label>

          <select id="fieldCurrency">

            <option value="JPY">
              JPY
            </option>

            <option value="SGD">
              SGD
            </option>

            <option value="USD">
              USD
            </option>

          </select>

        </div>


        <!-- NOTES -->

        <div class="field full">

          <label>
            NOTES
          </label>

          <textarea
            id="fieldNotes"
            placeholder="Anything you need to remember..."
          ></textarea>

        </div>

      </div>


      <div class="sheet-actions">

        <button
          id="deleteButton"
          class="delete-btn"
          type="button"
        >
          🗑 DELETE
        </button>


        <button
          id="saveButton"
          class="save-btn"
          type="submit"
        >
          SAVE
        </button>

      </div>


      <div
        id="formMessage"
        class="form-message"
      ></div>

    </form>

  </div>

</div>



<!-- =========================================================
     SHARED FOOTER
========================================================= -->

<div id="footer"></div>


<!-- =========================================================
     SUPABASE
========================================================= -->

<script
  src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>

<script src="supabase.js"></script>


<script>

/* =========================================================
   TRIP
========================================================= */

const params =
  new URLSearchParams(
    window.location.search
  );

const TRIP_ID =
  Number(
    params.get("trip") || 1
  );


/* =========================================================
   DATA
========================================================= */

let trip = null;

let bookings = [];

let statusFilter = "all";

let typeFilter = "all";

let editingId = null;


/* =========================================================
   ELEMENTS
========================================================= */

const content =
  document.getElementById(
    "content"
  );

const tripName =
  document.getElementById(
    "tripName"
  );

const tripEyebrow =
  document.getElementById(
    "tripEyebrow"
  );

const bookingSheet =
  document.getElementById(
    "bookingSheet"
  );

const sheetTitle =
  document.getElementById(
    "sheetTitle"
  );

const fieldStatus =
  document.getElementById(
    "fieldStatus"
  );

const fieldType =
  document.getElementById(
    "fieldType"
  );

const fieldTitle =
  document.getElementById(
    "fieldTitle"
  );

const fieldDate =
  document.getElementById(
    "fieldDate"
  );

const fieldTime =
  document.getElementById(
    "fieldTime"
  );

const fieldProvider =
  document.getElementById(
    "fieldProvider"
  );

const fieldLocation =
  document.getElementById(
    "fieldLocation"
  );

const fieldAddress =
  document.getElementById(
    "fieldAddress"
  );

const fieldConfirmation =
  document.getElementById(
    "fieldConfirmation"
  );

const fieldUrl =
  document.getElementById(
    "fieldUrl"
  );

const fieldAmount =
  document.getElementById(
    "fieldAmount"
  );

const fieldCurrency =
  document.getElementById(
    "fieldCurrency"
  );

const fieldNotes =
  document.getElementById(
    "fieldNotes"
  );

const deleteButton =
  document.getElementById(
    "deleteButton"
  );

const saveButton =
  document.getElementById(
    "saveButton"
  );

const formMessage =
  document.getElementById(
    "formMessage"
  );


/* =========================================================
   HELPERS
========================================================= */

function text(value){

  return String(
    value ?? ""
  );

}


function esc(value){

  return text(value)

    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


function parseDate(value){

  return new Date(
    value +
    "T12:00:00"
  );

}


function prettyDate(value){

  if(!value){
    return "NO DATE";
  }


  return new Intl.DateTimeFormat(
    "en-SG",
    {
      weekday:"short",
      day:"numeric",
      month:"short"
    }
  )
  .format(
    parseDate(value)
  )
  .toUpperCase();

}


function prettyTime(value){

  if(!value){
    return "";
  }


  const parts =
    value.split(":");


  let hour =
    Number(
      parts[0]
    );


  const minute =
    parts[1] || "00";


  const suffix =
    hour >= 12
    ?
    "PM"
    :
    "AM";


  hour =
    hour % 12 || 12;


  return `${hour}:${minute} ${suffix}`;

}


function bookingIcon(type){

  switch(type){

    case "accommodation":
      return "🏨";

    case "restaurant":
      return "🍽️";

    case "ticket":
      return "🎟️";

    case "transport":
      return "🚆";

    case "car":
      return "🚗";

    case "activity":
      return "🎡";

    default:
      return "📌";

  }

}


function typeLabel(type){

  switch(type){

    case "accommodation":
      return "STAY";

    case "restaurant":
      return "FOOD";

    case "ticket":
      return "TICKET";

    case "transport":
      return "TRANSPORT";

    case "car":
      return "CAR";

    case "activity":
      return "ACTIVITY";

    default:
      return "OTHER";

  }

}


function statusLabel(status){

  if(status === "booked"){
    return "BOOKED";
  }

  if(status === "cancelled"){
    return "CANCELLED";
  }

  return "TO BOOK";

}


function money(amount,currency){

  if(
    amount === null ||
    amount === undefined ||
    amount === ""
  ){
    return "";
  }


  const value =
    Number(amount);


  if(
    Number.isNaN(value)
  ){
    return "";
  }


  return (
    `${currency || "JPY"} ` +
    value.toLocaleString(
      "en-SG",
      {
        maximumFractionDigits:2
      }
    )
  );

}


/* =========================================================
   LOAD
========================================================= */

async function loadData(){

  try{


    const [
      tripResult,
      bookingResult
    ] =
      await Promise.all([


        db
          .from("trips")
          .select(`
            id,
            name,
            country,
            start_date,
            end_date
          `)
          .eq(
            "id",
            TRIP_ID
          )
          .single(),


        db
          .from("bookings")
          .select(`
            id,
            trip_id,
            booking_type,
            title,
            provider,
            booking_date,
            start_time,
            status,
            confirmation_number,
            restaurant_id,
            place_id,
            location_name,
            address,
            booking_url,
            amount,
            currency,
            notes,
            created_at,
            updated_at
          `)
          .eq(
            "trip_id",
            TRIP_ID
          )
          .order(
            "booking_date",
            {
              ascending:true,
              nullsFirst:false
            }
          )
          .order(
            "start_time",
            {
              ascending:true,
              nullsFirst:false
            }
          )

      ]);


    if(tripResult.error){
      throw tripResult.error;
    }


    if(bookingResult.error){
      throw bookingResult.error;
    }


    trip =
      tripResult.data;


    bookings =
      bookingResult.data || [];


    tripName.textContent =
      trip.name || "My Trip";


    tripEyebrow.textContent =
      trip.country
      ?
      `${trip.country.toUpperCase()} · TRIP BOOKINGS`
      :
      "TRIP BOOKINGS";


    document.title =
      `Bookings · ${trip.name || "My Trip"}`;


    render();

  }

  catch(error){

    console.error(error);


    content.className =
      "state";


    content.innerHTML = `

      <strong>
        Couldn't load bookings
      </strong>

      ${esc(
        error.message ||
        "Unknown database error."
      )}

    `;

  }

}


/* =========================================================
   FILTER
========================================================= */

function filteredBookings(){

  return bookings.filter(
    item => {

      const statusMatch =
        statusFilter === "all" ||
        item.status === statusFilter;


      const typeMatch =
        typeFilter === "all" ||
        item.booking_type === typeFilter;


      return (
        statusMatch &&
        typeMatch
      );

    }
  );

}


/* =========================================================
   RENDER
========================================================= */

function render(){

  const planned =
    bookings.filter(
      item =>
        item.status === "planned"
    );


  const booked =
    bookings.filter(
      item =>
        item.status === "booked"
    );


  const filtered =
    filteredBookings();


  content.className = "";


  content.innerHTML = `

    <div class="summary">

      <div class="summary-card">

        <div class="summary-number">
          ${bookings.length}
        </div>

        <div class="summary-label">
          TOTAL
        </div>

      </div>


      <div class="summary-card action">

        <div class="summary-number">
          ${planned.length}
        </div>

        <div class="summary-label">
          TO BOOK
        </div>

      </div>


      <div class="summary-card booked">

        <div class="summary-number">
          ${booked.length}
        </div>

        <div class="summary-label">
          BOOKED
        </div>

      </div>

    </div>


    <div class="filters">

      ${statusFilterHTML(
        "all",
        "ALL"
      )}

      ${statusFilterHTML(
        "planned",
        "⏳ TO BOOK"
      )}

      ${statusFilterHTML(
        "booked",
        "✅ BOOKED"
      )}

      ${statusFilterHTML(
        "cancelled",
        "❌ CANCELLED"
      )}

    </div>


    <div class="type-filters">

      ${typeFilterHTML(
        "all",
        "ALL TYPES"
      )}

      ${typeFilterHTML(
        "accommodation",
        "🏨 STAYS"
      )}

      ${typeFilterHTML(
        "restaurant",
        "🍽 FOOD"
      )}

      ${typeFilterHTML(
        "ticket",
        "🎟 TICKETS"
      )}

      ${typeFilterHTML(
        "transport",
        "🚆 TRANSPORT"
      )}

      ${typeFilterHTML(
        "car",
        "🚗 CAR"
      )}

      ${typeFilterHTML(
        "activity",
        "🎡 ACTIVITY"
      )}

    </div>


    ${
      filtered.length

      ?

      renderFiltered(
        filtered
      )

      :

      `

        <div class="empty">

          <strong>
            Nothing here
          </strong>

          No bookings match
          these filters.

        </div>

      `
    }

  `;


  bindFilters();

  bindCards();

}


/* =========================================================
   FILTER HTML
========================================================= */

function statusFilterHTML(
  value,
  label
){

  return `

    <button
      class="
        filter-btn
        ${
          statusFilter === value
          ?
          "active"
          :
          ""
        }
      "
      type="button"
      data-status-filter="${value}"
    >
      ${label}
    </button>

  `;

}


function typeFilterHTML(
  value,
  label
){

  return `

    <button
      class="
        type-filter
        ${
          typeFilter === value
          ?
          "active"
          :
          ""
        }
      "
      type="button"
      data-type-filter="${value}"
    >
      ${label}
    </button>

  `;

}


/* =========================================================
   RENDER FILTERED
========================================================= */

function renderFiltered(items){

  /*
    If ALL statuses are selected,
    make TO BOOK the first section.

    This makes the page act like
    a reminder list first.
  */

  if(statusFilter === "all"){

    const planned =
      items.filter(
        item =>
          item.status === "planned"
      );


    const booked =
      items.filter(
        item =>
          item.status === "booked"
      );


    const cancelled =
      items.filter(
        item =>
          item.status === "cancelled"
      );


    let html = "";


    if(planned.length){

      html +=
        renderSection(
          "⏳ NEED TO BOOK / ARRANGE",
          "action",
          planned
        );

    }


    if(booked.length){

      html +=
        renderSection(
          "✅ BOOKED",
          "booked",
          booked
        );

    }


    if(cancelled.length){

      html +=
        renderSection(
          "❌ CANCELLED",
          "",
          cancelled
        );

    }


    return html;

  }


  return renderSection(
    statusFilter === "planned"
    ?
    "⏳ NEED TO BOOK / ARRANGE"
    :
    statusFilter === "booked"
    ?
    "✅ BOOKED"
    :
    "❌ CANCELLED",
    statusFilter === "planned"
    ?
    "action"
    :
    statusFilter === "booked"
    ?
    "booked"
    :
    "",
    items
  );

}


/* =========================================================
   SECTION
========================================================= */

function renderSection(
  title,
  cssClass,
  items
){

  return `

    <section class="section">

      <div class="section-head">

        <div
          class="
            section-title
            ${cssClass}
          "
        >
          ${title}
        </div>


        <div class="section-count">

          ${items.length}

        </div>

      </div>


      ${renderDateGroups(items)}

    </section>

  `;

}


/* =========================================================
   DATE GROUPS
========================================================= */

function renderDateGroups(items){

  const groups = {};


  items.forEach(
    item => {

      const key =
        item.booking_date ||
        "undated";


      if(!groups[key]){
        groups[key] = [];
      }


      groups[key].push(item);

    }
  );


  const dates =
    Object.keys(groups)
      .sort(
        (a,b) => {

          if(a === "undated"){
            return 1;
          }

          if(b === "undated"){
            return -1;
          }

          return a.localeCompare(b);

        }
      );


  return dates
    .map(
      date => `

        <div class="date-group">

          <div class="date-label">

            ${
              date === "undated"
              ?
              "NO DATE"
              :
              esc(
                prettyDate(date)
              )
            }

          </div>


          ${
            groups[date]
              .map(
                bookingHTML
              )
              .join("")
          }

        </div>

      `
    )
    .join("");

}


/* =========================================================
   BOOKING HTML
========================================================= */

function bookingHTML(item){

  const meta = [];


  if(item.start_time){

    meta.push(
      prettyTime(
        item.start_time
      )
    );

  }


  meta.push(
    typeLabel(
      item.booking_type
    )
  );


  if(item.location_name){

    meta.push(
      item.location_name
    );

  }


  const details = [];


  if(item.provider){

    details.push(
      `
        <span class="detail-pill">
          ${esc(item.provider)}
        </span>
      `
    );

  }


  if(item.confirmation_number){

    details.push(
      `
        <span class="detail-pill">
          # ${esc(
            item.confirmation_number
          )}
        </span>
      `
    );

  }


  const amount =
    money(
      item.amount,
      item.currency
    );


  if(amount){

    details.push(
      `
        <span class="detail-pill">
          ${esc(amount)}
        </span>
      `
    );

  }


  if(item.booking_url){

    details.push(
      `
        <a
          class="detail-pill link"
          href="${esc(item.booking_url)}"
          target="_blank"
          rel="noopener noreferrer"
          onclick="event.stopPropagation()"
        >
          OPEN ↗
        </a>
      `
    );

  }


  return `

    <article
      class="booking-card"
      data-booking-id="${Number(item.id)}"
    >

      <div class="booking-top">


        <div class="booking-icon">

          ${bookingIcon(
            item.booking_type
          )}

        </div>


        <div class="booking-main">

          <div class="booking-title">

            ${esc(item.title)}

          </div>


          <div class="booking-meta">

            ${esc(
              meta.join(" · ")
            )}

          </div>


          ${
            item.notes

            ?

            `
              <div class="booking-note">

                ${esc(item.notes)}

              </div>
            `

            :

            ""
          }


          ${
            details.length

            ?

            `
              <div class="detail-row">

                ${details.join("")}

              </div>
            `

            :

            ""
          }

        </div>


        <span
          class="
            status-badge
            ${esc(item.status)}
          "
        >

          ${statusLabel(
            item.status
          )}

        </span>

      </div>


      ${
        item.status === "planned"

        ?

        `
          <button
            class="quick-book"
            type="button"
            data-mark-booked="${Number(item.id)}"
          >
            ✓ MARK AS BOOKED
          </button>
        `

        :

        ""
      }

    </article>

  `;

}


/* =========================================================
   BIND FILTERS
========================================================= */

function bindFilters(){

  document
    .querySelectorAll(
      "[data-status-filter]"
    )
    .forEach(
      button => {

        button.onclick =
          () => {

            statusFilter =
              button.dataset
                .statusFilter;


            render();

          };

      }
    );


  document
    .querySelectorAll(
      "[data-type-filter]"
    )
    .forEach(
      button => {

        button.onclick =
          () => {

            typeFilter =
              button.dataset
                .typeFilter;


            render();

          };

      }
    );

}


/* =========================================================
   BIND CARDS
========================================================= */

function bindCards(){

  document
    .querySelectorAll(
      "[data-booking-id]"
    )
    .forEach(
      card => {

        card.onclick =
          event => {

            if(
              event.target.closest(
                "[data-mark-booked]"
              )
            ){
              return;
            }


            if(
              event.target.closest(
                "a"
              )
            ){
              return;
            }


            openEdit(
              Number(
                card.dataset.bookingId
              )
            );

          };

      }
    );


  document
    .querySelectorAll(
      "[data-mark-booked]"
    )
    .forEach(
      button => {

        button.onclick =
          async event => {

            event.stopPropagation();


            await markBooked(
              Number(
                button.dataset
                  .markBooked
              )
            );

          };

      }
    );

}


/* =========================================================
   QUICK MARK BOOKED
========================================================= */

async function markBooked(id){

  const result =
    await db
      .from("bookings")
      .update({
        status:"booked"
      })
      .eq(
        "id",
        id
      )
      .eq(
        "trip_id",
        TRIP_ID
      );


  if(result.error){

    alert(
      result.error.message
    );

    return;

  }


  await reloadBookings();

}


/* =========================================================
   OPEN ADD
========================================================= */

document.getElementById(
  "addButton"
).onclick =
  openAdd;


function openAdd(){

  editingId =
    null;


  sheetTitle.textContent =
    "＋ Add Booking";


  deleteButton.style.display =
    "none";


  fieldStatus.value =
    "planned";


  fieldType.value =
    "ticket";


  fieldTitle.value =
    "";


  fieldDate.value =
    "";


  fieldTime.value =
    "";


  fieldProvider.value =
    "";


  fieldLocation.value =
    "";


  fieldAddress.value =
    "";


  fieldConfirmation.value =
    "";


  fieldUrl.value =
    "";


  fieldAmount.value =
    "";


  fieldCurrency.value =
    "JPY";


  fieldNotes.value =
    "";


  formMessage.className =
    "form-message";


  bookingSheet.classList
    .add(
      "open"
    );

}


/* =========================================================
   OPEN EDIT
========================================================= */

function openEdit(id){

  const item =
    bookings.find(
      row =>
        Number(row.id) ===
        Number(id)
    );


  if(!item){
    return;
  }


  editingId =
    item.id;


  sheetTitle.textContent =
    "Edit Booking";


  deleteButton.style.display =
    "block";


  fieldStatus.value =
    item.status ||
    "planned";


  fieldType.value =
    item.booking_type ||
    "other";


  fieldTitle.value =
    item.title ||
    "";


  fieldDate.value =
    item.booking_date ||
    "";


  fieldTime.value =
    item.start_time
    ?
    item.start_time.slice(0,5)
    :
    "";


  fieldProvider.value =
    item.provider ||
    "";


  fieldLocation.value =
    item.location_name ||
    "";


  fieldAddress.value =
    item.address ||
    "";


  fieldConfirmation.value =
    item.confirmation_number ||
    "";


  fieldUrl.value =
    item.booking_url ||
    "";


  fieldAmount.value =
    item.amount ??
    "";


  fieldCurrency.value =
    item.currency ||
    "JPY";


  fieldNotes.value =
    item.notes ||
    "";


  formMessage.className =
    "form-message";


  bookingSheet.classList
    .add(
      "open"
    );

}


/* =========================================================
   CLOSE SHEET
========================================================= */

document.getElementById(
  "closeSheet"
).onclick =
  closeSheet;


bookingSheet.onclick =
  event => {

    if(
      event.target ===
      bookingSheet
    ){

      closeSheet();

    }

  };


function closeSheet(){

  bookingSheet.classList
    .remove(
      "open"
    );

}


/* =========================================================
   SAVE
========================================================= */

document.getElementById(
  "bookingForm"
).addEventListener(
  "submit",
  async event => {

    event.preventDefault();


    saveButton.disabled =
      true;


    saveButton.textContent =
      "SAVING…";


    formMessage.className =
      "form-message";


    try{


      const title =
        fieldTitle.value.trim();


      if(!title){

        throw new Error(
          "Please enter a title."
        );

      }


      const payload = {

        trip_id:
          TRIP_ID,

        booking_type:
          fieldType.value,

        title:
          title,

        provider:
          fieldProvider.value
            .trim() ||
          null,

        booking_date:
          fieldDate.value ||
          null,

        start_time:
          fieldTime.value
          ?
          `${fieldTime.value}:00`
          :
          null,

        status:
          fieldStatus.value,

        confirmation_number:
          fieldConfirmation.value
            .trim() ||
          null,

        location_name:
          fieldLocation.value
            .trim() ||
          null,

        address:
          fieldAddress.value
            .trim() ||
          null,

        booking_url:
          fieldUrl.value
            .trim() ||
          null,

        amount:
          fieldAmount.value !== ""
          ?
          Number(
            fieldAmount.value
          )
          :
          null,

        currency:
          fieldCurrency.value,

        notes:
          fieldNotes.value
            .trim() ||
          null

      };


      /*
        ADD
      */

      if(
        editingId === null
      ){

        const result =
          await db
            .from("bookings")
            .insert(
              payload
            );


        if(result.error){
          throw result.error;
        }

      }


      /*
        EDIT
      */

      else{

        const result =
          await db
            .from("bookings")
            .update(
              payload
            )
            .eq(
              "id",
              editingId
            )
            .eq(
              "trip_id",
              TRIP_ID
            );


        if(result.error){
          throw result.error;
        }

      }


      closeSheet();


      await reloadBookings();

    }

    catch(error){

      console.error(error);


      formMessage.textContent =
        error.message ||
        "Couldn't save booking.";


      formMessage.className =
        "form-message error";

    }

    finally{

      saveButton.disabled =
        false;


      saveButton.textContent =
        "SAVE";

    }

  }
);


/* =========================================================
   DELETE
========================================================= */

deleteButton.onclick =
  async () => {

    if(
      editingId === null
    ){
      return;
    }


    const item =
      bookings.find(
        row =>
          Number(row.id) ===
          Number(editingId)
      );


    if(!item){
      return;
    }


    const okay =
      confirm(
        `Delete "${item.title}"?`
      );


    if(!okay){
      return;
    }


    deleteButton.disabled =
      true;


    try{


      const result =
        await db
          .from("bookings")
          .delete()
          .eq(
            "id",
            editingId
          )
          .eq(
            "trip_id",
            TRIP_ID
          );


      if(result.error){
        throw result.error;
      }


      closeSheet();


      await reloadBookings();

    }

    catch(error){

      console.error(error);


      formMessage.textContent =
        error.message ||
        "Couldn't delete booking.";


      formMessage.className =
        "form-message error";

    }

    finally{

      deleteButton.disabled =
        false;

    }

  };


/* =========================================================
   RELOAD
========================================================= */

async function reloadBookings(){

  const result =
    await db
      .from("bookings")
      .select(`
        id,
        trip_id,
        booking_type,
        title,
        provider,
        booking_date,
        start_time,
        status,
        confirmation_number,
        restaurant_id,
        place_id,
        location_name,
        address,
        booking_url,
        amount,
        currency,
        notes,
        created_at,
        updated_at
      `)
      .eq(
        "trip_id",
        TRIP_ID
      )
      .order(
        "booking_date",
        {
          ascending:true,
          nullsFirst:false
        }
      )
      .order(
        "start_time",
        {
          ascending:true,
          nullsFirst:false
        }
      );


  if(result.error){
    throw result.error;
  }


  bookings =
    result.data || [];


  render();

}


/* =========================================================
   START
========================================================= */

loadData();

</script>
