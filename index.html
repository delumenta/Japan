<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070c10">
<title>Japan Trip</title>

<style>
:root{
  --bg:#070c10;
  --panel:#10161c;
  --panel2:#151c23;
  --line:#29323b;
  --text:#f5f5f3;
  --muted:#aeb5bc;
  --muted2:#74818a;
  --red:#c96f68;
  --blue:#5c9dff;
  --green:#67c587;
  --gold:#e3b85c;
}

*{box-sizing:border-box}

html{scroll-behavior:smooth}

body{
  margin:0;
  min-height:100vh;
  color:var(--text);
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:
    radial-gradient(circle at 50% -10%,#17212a 0%,transparent 36%),
    var(--bg);
}

button{font:inherit}

main{
  width:100%;
  max-width:760px;
  margin:auto;
  padding:18px 13px 100px;
}


/* =========================================================
   HEADER
========================================================= */

.header{
  margin-bottom:14px;
}

.eyebrow{
  color:var(--red);
  font-size:8px;
  font-weight:900;
  letter-spacing:.14em;
  text-transform:uppercase;
}

h1{
  margin:5px 0 3px;
  font-family:Georgia,"Times New Roman",serif;
  font-size:28px;
  line-height:1.08;
  letter-spacing:-.025em;
}

.subtitle{
  color:var(--muted);
  font-size:9px;
}

.route{
  display:flex;
  align-items:center;
  gap:5px;
  margin-top:9px;
  overflow-x:auto;
  scrollbar-width:none;
}

.route::-webkit-scrollbar{display:none}

.route-chip{
  flex:0 0 auto;
  padding:4px 7px;
  border:1px solid rgba(255,255,255,.06);
  border-radius:999px;
  background:rgba(255,255,255,.025);
  color:#c5ccd1;
  font-size:7px;
  font-weight:900;
}

.route-arrow{
  color:#53606a;
  font-size:8px;
}


/* =========================================================
   COUNTDOWN
========================================================= */

.countdown-card{
  margin-bottom:17px;
  padding:13px;
  border:1px solid rgba(201,111,104,.34);
  border-radius:16px;
  background:
    linear-gradient(
      145deg,
      rgba(201,111,104,.09),
      #10161c 52%
    );
}

.countdown-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.countdown-label{
  color:var(--red);
  font-size:8px;
  font-weight:900;
  letter-spacing:.13em;
}

.countdown-date{
  color:var(--muted);
  font-size:7px;
  font-weight:800;
}

.countdown-main{
  display:flex;
  align-items:flex-end;
  gap:7px;
  margin-top:10px;
}

.countdown-number{
  font-family:Georgia,"Times New Roman",serif;
  font-size:37px;
  font-weight:800;
  line-height:.85;
}

.countdown-text{
  padding-bottom:2px;
  color:var(--muted);
  font-size:8px;
  font-weight:900;
  line-height:1.25;
}

.next-trip{
  margin-top:11px;
  padding-top:9px;
  border-top:1px solid rgba(255,255,255,.07);
}

.next-label{
  color:#7f8b94;
  font-size:7px;
  font-weight:900;
  letter-spacing:.11em;
}

.next-title{
  margin-top:4px;
  font-family:Georgia,"Times New Roman",serif;
  font-size:17px;
  font-weight:800;
}

.next-route{
  margin-top:3px;
  color:#b7c0c6;
  font-size:8px;
  line-height:1.4;
}


/* =========================================================
   SECTION
========================================================= */

.section-head{
  display:flex;
  align-items:end;
  justify-content:space-between;
  gap:10px;
  margin:0 2px 7px;
}

.section-title{
  font-family:Georgia,"Times New Roman",serif;
  font-size:18px;
  font-weight:800;
}

.section-note{
  color:#74818a;
  font-size:7px;
}


/* =========================================================
   TRIP DAY LIST
========================================================= */

.trip-days{
  display:flex;
  flex-direction:column;
  gap:5px;
}

.day-card{
  width:100%;
  display:grid;
  grid-template-columns:58px 1fr 16px;
  gap:9px;
  align-items:center;
  min-height:61px;
  padding:8px 9px;
  border:1px solid var(--line);
  border-radius:12px;
  background:
    linear-gradient(
      145deg,
      #141c22,
      #0d1318
    );
  color:inherit;
  text-align:left;
  cursor:pointer;
}

.day-card:active{
  transform:scale(.995);
}

.day-card.today{
  border-color:rgba(103,197,135,.4);
  background:
    linear-gradient(
      145deg,
      rgba(103,197,135,.08),
      #0d1318 60%
    );
}

.day-date{
  text-align:center;
  border-right:1px solid rgba(255,255,255,.07);
  padding-right:8px;
}

.day-number{
  font-family:Georgia,"Times New Roman",serif;
  font-size:21px;
  font-weight:800;
  line-height:1;
}

.day-month{
  margin-top:2px;
  color:var(--muted);
  font-size:7px;
  font-weight:900;
}

.day-weekday{
  margin-top:2px;
  color:#66747e;
  font-size:6px;
  font-weight:900;
}

.day-main{
  min-width:0;
}

.day-area{
  display:flex;
  align-items:center;
  gap:5px;
  color:#fff;
  font-size:9px;
  font-weight:900;
}

.today-tag{
  padding:2px 4px;
  border-radius:999px;
  background:rgba(103,197,135,.10);
  color:#8fe0aa;
  font-size:6px;
}

.day-places{
  margin-top:3px;
  overflow:hidden;
  color:#aeb7bd;
  font-size:8px;
  line-height:1.4;
  white-space:nowrap;
  text-overflow:ellipsis;
}

.day-count{
  margin-top:3px;
  color:#65727c;
  font-size:6px;
  font-weight:800;
}

.day-arrow{
  color:var(--red);
  font-size:15px;
}


/* =========================================================
   DAILY PREVIEW
========================================================= */

.preview-card{
  overflow:hidden;
  border:1px solid rgba(201,111,104,.35);
  border-radius:16px;
  background:var(--panel);
}

.preview-header{
  padding:12px 13px 10px;
  border-bottom:1px solid rgba(255,255,255,.065);
}

.preview-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.preview-label{
  color:var(--red);
  font-size:8px;
  font-weight:900;
  letter-spacing:.13em;
}

.preview-date{
  color:#b8c9d7;
  font-size:8px;
  font-weight:900;
}

.preview-title{
  margin-top:7px;
  font-family:Georgia,"Times New Roman",serif;
  font-size:21px;
  font-weight:800;
  line-height:1.2;
}

.preview-route{
  margin-top:3px;
  color:#aeb7bd;
  font-size:8px;
  line-height:1.4;
}


/* =========================================================
   TIMELINE
========================================================= */

.timeline{
  padding:5px 13px 7px;
}

.timeline-head{
  margin:7px 0 4px;
  color:#748793;
  font-size:7px;
  font-weight:900;
  letter-spacing:.12em;
}

.timeline-row{
  position:relative;
  display:grid;
  grid-template-columns:74px 16px 1fr;
  gap:7px;
  min-height:45px;
  padding:6px 0;
}

.timeline-row:not(:last-child)::after{
  content:"";
  position:absolute;
  left:81px;
  top:29px;
  bottom:-8px;
  width:1px;
  background:#26323a;
}

.timeline-time{
  padding-top:2px;
  color:#9bb8d0;
  font-size:8px;
  font-weight:900;
  line-height:1.25;
}

.timeline-marker{
  position:relative;
  z-index:2;
  display:flex;
  justify-content:center;
  padding-top:1px;
}

.dot{
  width:8px;
  height:8px;
  margin-top:3px;
  border:2px solid #172029;
  border-radius:50%;
  background:var(--red);
  box-shadow:0 0 0 1px rgba(201,111,104,.35);
}

.timeline-content{
  min-width:0;
}

.timeline-title{
  color:#f2f2f0;
  font-size:9px;
  font-weight:850;
  line-height:1.3;
}

.timeline-title a{
  color:inherit;
  text-decoration:none;
}

.timeline-place{
  margin-top:2px;
  color:#77858f;
  font-size:7px;
  line-height:1.3;
}

.timeline-note{
  margin-top:2px;
  color:#a7b0b6;
  font-size:7px;
  line-height:1.35;
}

.optional{
  display:inline-block;
  margin-left:4px;
  padding:1px 4px;
  border:1px solid rgba(227,184,92,.2);
  border-radius:999px;
  color:#e3b85c;
  font-size:6px;
}


/* =========================================================
   PREVIEW FOOTER
========================================================= */

.preview-footer{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:10px 13px;
  border-top:1px solid rgba(255,255,255,.06);
  background:rgba(0,0,0,.12);
}

.preview-footer button,
.preview-footer a{
  border:0;
  background:none;
  color:#aeb7bd;
  text-decoration:none;
  font-size:8px;
  font-weight:900;
  cursor:pointer;
}

.preview-footer a{
  color:var(--red);
}


/* =========================================================
   EMPTY / ERROR
========================================================= */

.state{
  padding:28px 16px;
  border:1px dashed #35414a;
  border-radius:14px;
  color:var(--muted);
  text-align:center;
  font-size:9px;
}

.state strong{
  display:block;
  margin-bottom:4px;
  color:#fff;
  font-size:12px;
}


/* =========================================================
   BOTTOM NAV
========================================================= */

.bottom-nav{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  z-index:80;
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:3px;
  padding:
    6px
    7px
    calc(6px + env(safe-area-inset-bottom));
  border-top:1px solid var(--line);
  background:rgba(7,12,16,.98);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
}

.bottom-nav a{
  min-height:46px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:2px;
  border-radius:10px;
  color:var(--muted);
  text-decoration:none;
  font-size:8px;
  font-weight:800;
}

.nav-icon{
  font-size:16px;
  line-height:1;
}

.bottom-nav a.active{
  color:#fff;
  border:1px solid rgba(201,111,104,.22);
  background:rgba(201,111,104,.08);
}


/* =========================================================
   DESKTOP
========================================================= */

@media(min-width:700px){
  main{
    padding-top:24px;
  }

  .bottom-nav{
    left:50%;
    right:auto;
    width:min(820px,100%);
    transform:translateX(-50%);
    border-left:1px solid var(--line);
    border-right:1px solid var(--line);
    border-radius:15px 15px 0 0;
  }
}

</style>
</head>

<body>

<main>

  <header class="header">

    <div id="eyebrow" class="eyebrow">
      LOADING TRIP
    </div>

    <h1 id="tripName">
      Japan Trip
    </h1>

    <div id="tripSubtitle" class="subtitle">
      Loading itinerary…
    </div>

    <div id="route" class="route"></div>

  </header>


  <section id="homeContent">

    <div class="state">
      <strong>Loading your trip…</strong>
      Getting your itinerary from Supabase.
    </div>

  </section>

</main>


<!-- =========================================================
     BOTTOM NAV
========================================================= -->

<nav class="bottom-nav" aria-label="Main navigation">

  <a id="navHome" class="active" aria-current="page">
    <span class="nav-icon">🏠</span>
    <span>HOME</span>
  </a>

  <a id="navPlan">
    <span class="nav-icon">📅</span>
    <span>PLAN</span>
  </a>

  <a id="navFood">
    <span class="nav-icon">🍽️</span>
    <span>FOOD</span>
  </a>

  <a id="navHub">
    <span class="nav-icon">⭐</span>
    <span>HUB</span>
  </a>

  <a href="#">
    <span class="nav-icon">⋯</span>
    <span>MORE</span>
  </a>

</nav>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>

<script>

/* =========================================================
   TRIP
========================================================= */

const params =
  new URLSearchParams(window.location.search);

const TRIP_ID =
  Number(params.get("trip") || 1);

let trip = null;
let schedule = [];
let groupedDays = {};


/* =========================================================
   ELEMENTS
========================================================= */

const homeContent =
  document.getElementById("homeContent");

const tripName =
  document.getElementById("tripName");

const tripSubtitle =
  document.getElementById("tripSubtitle");

const eyebrow =
  document.getElementById("eyebrow");

const route =
  document.getElementById("route");


/* =========================================================
   NAV
========================================================= */

document.getElementById("navHome").href =
  `index.html?trip=${TRIP_ID}`;

document.getElementById("navPlan").href =
  `schedule.html?trip=${TRIP_ID}`;

document.getElementById("navFood").href =
  `food.html?trip=${TRIP_ID}`;

document.getElementById("navHub").href =
  `bookings.html?trip=${TRIP_ID}`;


/* =========================================================
   HELPERS
========================================================= */

function text(value){
  return String(value ?? "");
}

function esc(value){
  return text(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}


/* =========================================================
   DATE HELPERS
========================================================= */

function parseDate(value){
  return new Date(value + "T12:00:00");
}

function localDateString(){

  const d = new Date();

  const y = d.getFullYear();

  const m =
    String(d.getMonth()+1)
    .padStart(2,"0");

  const day =
    String(d.getDate())
    .padStart(2,"0");

  return `${y}-${m}-${day}`;
}

function formatRange(){

  const start =
    parseDate(trip.start_date);

  const end =
    parseDate(trip.end_date);

  const a =
    new Intl.DateTimeFormat(
      "en-GB",
      {
        day:"numeric",
        month:"short"
      }
    ).format(start);

  const b =
    new Intl.DateTimeFormat(
      "en-GB",
      {
        day:"numeric",
        month:"short",
        year:"numeric"
      }
    ).format(end);

  return `${a} – ${b}`;
}

function formatPreviewDate(value){

  return new Intl.DateTimeFormat(
    "en-SG",
    {
      weekday:"short",
      day:"numeric",
      month:"short"
    }
  )
  .format(parseDate(value))
  .toUpperCase();
}

function dateParts(value){

  const d = parseDate(value);

  return {
    day:
      new Intl.DateTimeFormat(
        "en-SG",
        {day:"numeric"}
      ).format(d),

    month:
      new Intl.DateTimeFormat(
        "en-SG",
        {month:"short"}
      ).format(d).toUpperCase(),

    weekday:
      new Intl.DateTimeFormat(
        "en-SG",
        {weekday:"short"}
      ).format(d).toUpperCase()
  };
}

function daysUntil(value){

  const now = new Date();

  const today =
    new Date(
      now.getFullYear(),
      now.getMonth(),
      now.getDate()
    );

  const target =
    new Date(value + "T00:00:00");

  return Math.ceil(
    (target - today) / 86400000
  );
}


/* =========================================================
   LOAD DATA
========================================================= */

async function loadTrip(){

  const {data,error} =
    await db
      .from("trips")
      .select(`
        id,
        name,
        country,
        start_date,
        end_date,
        description
      `)
      .eq("id",TRIP_ID)
      .single();

  if(error){
    throw error;
  }

  trip = data;
}

async function loadSchedule(){

  const {data,error} =
    await db
      .from("schedule")
      .select(`
        id,
        trip_id,
        schedule_date,
        start_time,
        end_time,
        time_label,
        sort_order,
        title,
        item_type,
        description,
        notes,
        location_name,
        maps_url,
        place_id,
        restaurant_id,
        is_optional,
        is_locked,

        place:places(
          id,
          name,
          maps_url
        ),

        restaurant:restaurants(
          id,
          name,
          maps_url
        )
      `)
      .eq("trip_id",TRIP_ID)
      .order("schedule_date",{ascending:true})
      .order("sort_order",{ascending:true});

  if(error){
    throw error;
  }

  schedule = data || [];
}


/* =========================================================
   GROUP DAYS
========================================================= */

function buildDays(){

  groupedDays = {};

  schedule.forEach(item => {

    if(!groupedDays[item.schedule_date]){
      groupedDays[item.schedule_date] = [];
    }

    groupedDays[item.schedule_date].push(item);
  });
}


/* =========================================================
   HEADER
========================================================= */

function renderHeader(){

  tripName.textContent =
    trip.name;

  eyebrow.textContent =
    `${trip.country || "TRIP"} · ${formatRange()}`;

  if(TRIP_ID === 1){

    tripSubtitle.textContent =
      "Kyoto → Road Trip → Osaka";

    route.innerHTML = `
      <span class="route-chip">⛩️ KYOTO · 18–22</span>
      <span class="route-arrow">→</span>
      <span class="route-chip">🚗 ROAD · 23–26</span>
      <span class="route-arrow">→</span>
      <span class="route-chip">🌃 OSAKA · 26–30</span>
      <span class="route-arrow">→</span>
      <span class="route-chip">✈️ HOME</span>
    `;

  }else{

    tripSubtitle.textContent =
      trip.description || formatRange();

    route.innerHTML = "";
  }
}


/* =========================================================
   ITEM DISPLAY
========================================================= */

function itemName(item){

  /*
    Schedule title is deliberately first.

    Your schedule title often says things
    like "Arrive Kyoto", "Late Lunch",
    "Hotel Check-in", etc.

    Linked place/restaurant is used below
    as secondary information.
  */

  return (
    item.title ||
    item.place?.name ||
    item.restaurant?.name ||
    "Schedule Item"
  );
}

function linkedName(item){

  const linked =
    item.restaurant?.name ||
    item.place?.name ||
    item.location_name ||
    "";

  if(
    linked &&
    linked.toLowerCase() !==
    text(item.title).toLowerCase()
  ){
    return linked;
  }

  return "";
}

function itemTime(item){

  if(item.time_label){
    return item.time_label;
  }

  if(item.start_time){

    const parts =
      item.start_time.split(":");

    let hour = Number(parts[0]);
    const minute = parts[1] || "00";

    const suffix =
      hour >= 12 ? "PM" : "AM";

    hour = hour % 12 || 12;

    return `${hour}:${minute} ${suffix}`;
  }

  return "Flexible";
}

function itemMap(item){

  return (
    item.restaurant?.maps_url ||
    item.place?.maps_url ||
    item.maps_url ||
    null
  );
}


/* =========================================================
   ICONS
========================================================= */

function itemIcon(item){

  const type =
    text(item.item_type)
    .toLowerCase();

  const name =
    text(item.title)
    .toLowerCase();

  if(
    type.includes("restaurant") ||
    type.includes("food") ||
    name.includes("lunch") ||
    name.includes("dinner") ||
    name.includes("breakfast") ||
    name.includes("snack")
  ){
    return "🍽️";
  }

  if(
    type.includes("hotel") ||
    name.includes("check-in") ||
    name.includes("hotel")
  ){
    return "🏨";
  }

  if(
    type.includes("transport") ||
    name.includes("train") ||
    name.includes("travel") ||
    name.includes("drive") ||
    name.includes("arrive")
  ){
    return "🚆";
  }

  if(
    name.includes("shrine") ||
    name.includes("temple") ||
    type.includes("temple") ||
    type.includes("shrine")
  ){
    return "⛩️";
  }

  if(
    name.includes("mount") ||
    name.includes("highland") ||
    name.includes("viewpoint")
  ){
    return "🏔️";
  }

  if(
    name.includes("waterfall") ||
    name.includes("falls")
  ){
    return "💧";
  }

  if(
    name.includes("market")
  ){
    return "🛍️";
  }

  if(
    name.includes("airport") ||
    name.includes("flight")
  ){
    return "✈️";
  }

  return "📍";
}


/* =========================================================
   DAY AREA
========================================================= */

function dayArea(date,items){

  /*
    These labels are presentation only.
    The actual locations underneath
    still come from Supabase.
  */

  if(TRIP_ID === 1){

    if(date <= "2026-10-20"){
      return "⛩️ Kyoto";
    }

    if(date === "2026-10-21"){
      return "🌊 Ine";
    }

    if(date === "2026-10-22"){
      return "⛩️ Kyoto";
    }

    if(date === "2026-10-23"){
      return "🚗 Kyoto → Dorogawa";
    }

    if(date === "2026-10-24"){
      return "🏔️ Dorogawa → Ryujin";
    }

    if(date === "2026-10-25"){
      return "⛩️ Kumano";
    }

    if(date === "2026-10-26"){
      return "💧 Nachi → Osaka";
    }

    if(date === "2026-10-27"){
      return "🌃 Osaka";
    }

    if(date === "2026-10-28"){
      return "🚄 Aichi Day Trip";
    }

    if(date === "2026-10-29"){
      return "🦌 Nara";
    }

    if(date === "2026-10-30"){
      return "✈️ Departure";
    }
  }

  const location =
    items.find(x => x.location_name)
      ?.location_name;

  return location || "Japan";
}


/* =========================================================
   DAY SUMMARY LOCATIONS
========================================================= */

function usefulLocationNames(items){

  const ignoreWords = [
    "travel",
    "drive",
    "train",
    "check-in",
    "check out",
    "checkout",
    "arrive",
    "depart",
    "breakfast",
    "lunch",
    "dinner",
    "snack",
    "free time"
  ];

  const names = [];

  items.forEach(item => {

    let name =
      item.restaurant?.name ||
      item.place?.name ||
      item.location_name ||
      item.title;

    if(!name){
      return;
    }

    const lower =
      name.toLowerCase();

    const ignored =
      ignoreWords.some(
        word => lower.includes(word)
      );

    if(ignored && !item.place_id && !item.restaurant_id){
      return;
    }

    if(!names.includes(name)){
      names.push(name);
    }
  });

  return names;
}

function daySummary(items){

  const names =
    usefulLocationNames(items);

  if(!names.length){

    return items
      .slice(0,3)
      .map(item => item.title)
      .join(" · ");
  }

  return names
    .slice(0,4)
    .join(" · ");
}


/* =========================================================
   COUNTDOWN CARD
========================================================= */

function countdownHTML(){

  const today =
    localDateString();

  if(today > trip.end_date){

    return `
      <div class="countdown-card">

        <div class="countdown-label">
          TRIP COMPLETE
        </div>

        <div class="next-title">
          ${esc(trip.name)}
        </div>

        <div class="next-route">
          Your itinerary is saved below.
        </div>

      </div>
    `;
  }

  if(
    today >= trip.start_date &&
    today <= trip.end_date
  ){

    const items =
      groupedDays[today] || [];

    return `
      <div class="countdown-card">

        <div class="countdown-top">

          <div class="countdown-label">
            ● TODAY
          </div>

          <div class="countdown-date">
            ${esc(formatPreviewDate(today))}
          </div>

        </div>

        <div class="next-title">
          ${esc(dayArea(today,items))}
        </div>

        <div class="next-route">
          ${esc(daySummary(items))}
        </div>

      </div>
    `;
  }

  const count =
    Math.max(
      0,
      daysUntil(trip.start_date)
    );

  const firstDate =
    Object.keys(groupedDays)
      .sort()[0] ||
    trip.start_date;

  const firstItems =
    groupedDays[firstDate] || [];

  return `
    <div class="countdown-card">

      <div class="countdown-top">

        <div class="countdown-label">
          UPCOMING TRIP
        </div>

        <div class="countdown-date">
          ${esc(formatRange())}
        </div>

      </div>

      <div class="countdown-main">

        <div class="countdown-number">
          ${count}
        </div>

        <div class="countdown-text">
          DAY${count === 1 ? "" : "S"}<br>
          TO GO
        </div>

      </div>

      <div class="next-trip">

        <div class="next-label">
          FIRST DAY · ${esc(formatPreviewDate(firstDate))}
        </div>

        <div class="next-title">
          ${esc(dayArea(firstDate,firstItems))}
        </div>

        <div class="next-route">
          ${esc(daySummary(firstItems))}
        </div>

      </div>

    </div>
  `;
}


/* =========================================================
   TRIP OVERVIEW
========================================================= */

function renderHome(){

  const dates =
    Object.keys(groupedDays).sort();

  const today =
    localDateString();

  if(!dates.length){

    homeContent.innerHTML = `
      <div class="state">
        <strong>No itinerary yet</strong>
        There are no schedule items for this trip.
      </div>
    `;

    return;
  }

  homeContent.innerHTML = `

    ${countdownHTML()}

    <div class="section-head">

      <div class="section-title">
        Your Trip
      </div>

      <div class="section-note">
        TAP A DAY TO PREVIEW
      </div>

    </div>

    <div class="trip-days">

      ${dates.map(date => {

        const parts =
          dateParts(date);

        const items =
          groupedDays[date];

        return `

          <button
            class="day-card ${date === today ? "today" : ""}"
            data-date="${date}"
            type="button"
          >

            <div class="day-date">

              <div class="day-number">
                ${esc(parts.day)}
              </div>

              <div class="day-month">
                ${esc(parts.month)}
              </div>

              <div class="day-weekday">
                ${esc(parts.weekday)}
              </div>

            </div>


            <div class="day-main">

              <div class="day-area">

                ${esc(dayArea(date,items))}

                ${
                  date === today
                  ?
                  `<span class="today-tag">TODAY</span>`
                  :
                  ""
                }

              </div>

              <div class="day-places">
                ${esc(daySummary(items))}
              </div>

              <div class="day-count">
                ${items.length}
                ${items.length === 1 ? "STOP" : "STOPS"}
              </div>

            </div>


            <div class="day-arrow">
              ›
            </div>

          </button>

        `;

      }).join("")}

    </div>

  `;

  document
    .querySelectorAll(".day-card")
    .forEach(button => {

      button.onclick = () => {
        renderPreview(
          button.dataset.date
        );
      };

    });
}


/* =========================================================
   PREVIEW TITLE
========================================================= */

function previewTitle(date,items){

  return dayArea(date,items);
}

function previewRoute(items){

  const names =
    usefulLocationNames(items);

  if(!names.length){
    return "";
  }

  return names
    .slice(0,5)
    .join(" → ");
}


/* =========================================================
   TIMELINE ROW
========================================================= */

function timelineRow(item){

  const map =
    itemMap(item);

  const title =
    itemName(item);

  const linked =
    linkedName(item);

  return `

    <div class="timeline-row">

      <div class="timeline-time">
        ${esc(itemTime(item))}
      </div>


      <div class="timeline-marker">
        <span class="dot"></span>
      </div>


      <div class="timeline-content">

        <div class="timeline-title">

          ${itemIcon(item)}

          ${
            map
            ?
            `
              <a
                href="${esc(map)}"
                target="_blank"
                rel="noopener noreferrer"
              >
                ${esc(title)}
              </a>
            `
            :
            esc(title)
          }

          ${
            item.is_optional
            ?
            `<span class="optional">OPTIONAL</span>`
            :
            ""
          }

        </div>


        ${
          linked
          ?
          `
            <div class="timeline-place">
              📍 ${esc(linked)}
            </div>
          `
          :
          ""
        }


        ${
          item.description
          ?
          `
            <div class="timeline-note">
              ${esc(item.description)}
            </div>
          `
          :
          ""
        }

      </div>

    </div>

  `;
}


/* =========================================================
   DAY PREVIEW
========================================================= */

function renderPreview(date){

  const items =
    groupedDays[date] || [];

  if(!items.length){
    return;
  }

  homeContent.innerHTML = `

    <div class="preview-card">

      <div class="preview-header">

        <div class="preview-top">

          <div class="preview-label">
            DAY PREVIEW
          </div>

          <div class="preview-date">
            ${esc(formatPreviewDate(date))}
          </div>

        </div>


        <div class="preview-title">
          ${esc(previewTitle(date,items))}
        </div>


        <div class="preview-route">
          ${esc(previewRoute(items))}
        </div>

      </div>


      <div class="timeline">

        <div class="timeline-head">
          TODAY'S PLAN
        </div>

        ${items.map(timelineRow).join("")}

      </div>


      <div class="preview-footer">

        <button
          id="tripHome"
          type="button"
        >
          ← TRIP HOME
        </button>


        <a
          href="schedule.html?trip=${TRIP_ID}#${date}"
        >
          FULL PLAN →
        </a>

      </div>

    </div>

  `;


  document.getElementById("tripHome")
    .onclick = () => {

      renderHome();

      window.scrollTo({
        top:0,
        behavior:"smooth"
      });
    };


  window.scrollTo({
    top:0,
    behavior:"smooth"
  });
}


/* =========================================================
   ERROR
========================================================= */

function showError(error){

  console.error(error);

  homeContent.innerHTML = `

    <div class="state">

      <strong>
        ⚠️ Couldn't load trip
      </strong>

      ${esc(
        error?.message ||
        "Unknown database error."
      )}

    </div>

  `;
}


/* =========================================================
   START
========================================================= */

async function start(){

  try{

    await Promise.all([
      loadTrip(),
      loadSchedule()
    ]);

    buildDays();
    renderHeader();
    renderHome();

  }catch(error){

    showError(error);
  }
}

start();

</script>
