<!doctype html>
<html lang="en">

<head>
<meta charset="utf-8">
<meta
  name="viewport"
  content="width=device-width, initial-scale=1, viewport-fit=cover"
>
<meta name="theme-color" content="#070c10">

<title>Japan Trip</title>

<style>

:root{
  --bg:#070c10;
  --panel:#10161c;
  --panel2:#151c23;
  --line:#29323b;
  --text:#f5f5f3;
  --muted:#aeb5bc;
  --muted2:#74818a;
  --red:#c96f68;
  --blue:#5c9dff;
  --green:#67c587;
  --orange:#f4a34d;
}

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  min-height:100vh;

  color:var(--text);

  font-family:
    Inter,
    ui-sans-serif,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

  background:
    radial-gradient(
      circle at 50% -15%,
      #17212a 0%,
      transparent 38%
    ),
    var(--bg);
}

button{
  font:inherit;
}

main{
  width:100%;
  max-width:760px;

  margin:auto;

  padding:
    18px
    13px
    95px;
}


/* =========================================================
   HEADER
========================================================= */

.header{
  margin-bottom:14px;
}

.eyebrow{
  color:var(--red);

  font-size:9px;
  font-weight:900;

  letter-spacing:.14em;
  text-transform:uppercase;
}

h1{
  margin:5px 0 3px;

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-size:28px;
  line-height:1.08;

  letter-spacing:-.025em;
}

.subtitle{
  color:var(--muted);

  font-size:10px;
  line-height:1.4;
}


/* =========================================================
   ROUTE STRIP
========================================================= */

.route-strip{
  display:flex;

  align-items:center;

  gap:5px;

  overflow-x:auto;

  margin-top:10px;

  padding-bottom:2px;

  scrollbar-width:none;
}

.route-strip::-webkit-scrollbar{
  display:none;
}

.route-stop{
  flex:0 0 auto;

  padding:
    4px
    7px;

  border:
    1px solid
    rgba(255,255,255,.06);

  border-radius:999px;

  background:
    rgba(255,255,255,.025);

  color:#c4cbd0;

  font-size:7px;
  font-weight:900;

  white-space:nowrap;
}

.route-arrow{
  flex:0 0 auto;

  color:#53606a;

  font-size:8px;
}


/* =========================================================
   STATUS
========================================================= */

.status{
  padding:
    26px
    16px;

  border:1px solid var(--line);
  border-radius:16px;

  background:var(--panel);

  color:var(--muted);

  text-align:center;

  font-size:9px;
}

.status strong{
  display:block;

  margin-bottom:4px;

  color:#fff;

  font-size:12px;
}


/* =========================================================
   MAIN CARD
========================================================= */

.home-card{
  overflow:hidden;

  border:
    1px solid
    rgba(201,111,104,.34);

  border-radius:17px;

  background:
    linear-gradient(
      145deg,
      rgba(201,111,104,.08),
      #10161c 48%
    );

  box-shadow:
    0 12px 35px
    rgba(0,0,0,.17);
}

.card-inner{
  padding:13px;
}


/* =========================================================
   CARD TOP
========================================================= */

.card-top{
  display:flex;

  align-items:center;
  justify-content:space-between;

  gap:10px;
}

.card-label{
  color:var(--red);

  font-size:8px;
  font-weight:900;

  letter-spacing:.13em;
  text-transform:uppercase;
}

.card-date{
  color:var(--muted);

  font-size:8px;
  font-weight:800;
}


/* =========================================================
   COUNTDOWN
========================================================= */

.countdown{
  display:flex;

  align-items:flex-end;

  gap:6px;

  margin-top:10px;
}

.count-number{
  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-size:37px;
  font-weight:800;

  line-height:.85;

  letter-spacing:-.04em;
}

.count-text{
  padding-bottom:2px;

  color:var(--muted);

  font-size:8px;
  font-weight:900;

  line-height:1.3;
}

.first-day{
  margin-top:13px;

  padding-top:10px;

  border-top:
    1px solid
    rgba(255,255,255,.07);
}

.mini-label{
  color:var(--muted);

  font-size:7px;
  font-weight:900;

  letter-spacing:.12em;
  text-transform:uppercase;
}

.day-title{
  margin-top:4px;

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-size:19px;
  font-weight:800;

  line-height:1.2;
}

.day-route{
  margin-top:3px;

  overflow:hidden;

  color:#bec5ca;

  font-size:8px;
  line-height:1.4;

  white-space:nowrap;
  text-overflow:ellipsis;
}


/* =========================================================
   TODAY
========================================================= */

.today-title{
  margin-top:7px;

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-size:21px;
  font-weight:800;

  line-height:1.2;
}

.today-route{
  margin-top:3px;

  overflow:hidden;

  color:#bec5ca;

  font-size:8px;
  line-height:1.4;

  white-space:nowrap;
  text-overflow:ellipsis;
}


/* =========================================================
   PROGRESS
========================================================= */

.progress-row{
  display:flex;

  align-items:center;

  gap:8px;

  margin-top:10px;
}

.progress{
  flex:1;

  height:4px;

  overflow:hidden;

  border-radius:999px;

  background:#1d272e;
}

.progress-bar{
  height:100%;

  border-radius:999px;

  background:var(--red);
}

.progress-text{
  flex:0 0 auto;

  color:var(--muted);

  font-size:7px;
  font-weight:900;
}


/* =========================================================
   NOW
========================================================= */

.now{
  margin-top:10px;

  padding:
    10px
    11px;

  border:1px solid var(--line);
  border-radius:12px;

  background:
    rgba(7,12,16,.38);
}

.now-head{
  display:flex;

  align-items:center;
  justify-content:space-between;

  gap:8px;
}

.now-label{
  color:var(--green);

  font-size:7px;
  font-weight:900;

  letter-spacing:.13em;
}

.now-time{
  color:#91a5b3;

  font-size:8px;
  font-weight:850;
}

.now-title{
  margin-top:3px;

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-size:18px;
  font-weight:800;

  line-height:1.2;
}

.now-note{
  margin-top:3px;

  color:var(--muted);

  font-size:8px;
  line-height:1.4;
}


/* =========================================================
   BUTTONS
========================================================= */

.actions{
  display:grid;

  grid-template-columns:
    1.3fr
    1fr;

  gap:6px;

  margin-top:9px;
}

.btn{
  min-height:36px;

  display:flex;

  align-items:center;
  justify-content:center;

  padding:6px;

  border:1px solid var(--line);
  border-radius:9px;

  background:#141c22;
  color:#fff;

  text-decoration:none;

  font-size:8px;
  font-weight:900;

  cursor:pointer;
}

.btn.done{
  color:#bce8c9;

  border-color:
    rgba(103,197,135,.28);

  background:
    rgba(103,197,135,.08);
}

.btn.map{
  color:#bad2ff;

  border-color:
    rgba(92,157,255,.26);

  background:
    rgba(92,157,255,.07);
}

.btn.primary{
  color:#f4d3d0;

  border-color:
    rgba(201,111,104,.34);

  background:
    rgba(201,111,104,.09);
}

.btn.secondary{
  color:#c6cdd2;
}


/* =========================================================
   UP NEXT
========================================================= */

.up-next{
  margin-top:11px;
}

.up-title{
  margin-bottom:4px;

  color:#82909a;

  font-size:7px;
  font-weight:900;

  letter-spacing:.12em;
}

.next-row{
  display:grid;

  grid-template-columns:
    55px
    1fr;

  gap:7px;

  padding:
    6px
    0;

  border-top:
    1px solid
    rgba(255,255,255,.055);

  font-size:8px;
}

.next-time{
  color:#91a5b3;
  font-weight:850;
}

.next-name{
  overflow:hidden;

  color:#d9dde0;

  white-space:nowrap;
  text-overflow:ellipsis;
}


/* =========================================================
   CARD FOOTER
========================================================= */

.card-footer{
  display:flex;

  align-items:center;
  justify-content:space-between;

  gap:8px;

  padding:
    9px
    13px;

  border-top:
    1px solid
    rgba(255,255,255,.06);

  background:
    rgba(0,0,0,.12);
}

.card-footer button,
.card-footer a{
  border:0;

  background:none;

  color:var(--muted);

  text-decoration:none;

  font-size:8px;
  font-weight:850;

  cursor:pointer;
}

.card-footer .view{
  color:var(--red);
}


/* =========================================================
   PREVIEW DAYS
========================================================= */

.preview-wrap{
  margin-top:11px;
}

.preview-label{
  margin:
    0
    2px
    5px;

  color:#7f8c95;

  font-size:7px;
  font-weight:900;

  letter-spacing:.12em;
}

.preview-days{
  display:flex;

  gap:5px;

  overflow-x:auto;

  padding-bottom:3px;

  scrollbar-width:none;
}

.preview-days::-webkit-scrollbar{
  display:none;
}

.preview-day{
  flex:0 0 auto;

  min-width:43px;
  min-height:31px;

  padding:
    4px
    7px;

  border:1px solid var(--line);
  border-radius:8px;

  background:#10171d;
  color:#aeb7bd;

  font-size:7px;
  font-weight:900;

  cursor:pointer;
}

.preview-day.active{
  color:#fff;

  border-color:
    rgba(201,111,104,.5);

  background:
    rgba(201,111,104,.10);
}


/* =========================================================
   FREE / PAST
========================================================= */

.simple-card{
  padding:14px;

  border:1px solid var(--line);
  border-radius:16px;

  background:var(--panel);
}

.simple-label{
  color:var(--red);

  font-size:8px;
  font-weight:900;

  letter-spacing:.12em;
}

.simple-card h2{
  margin:
    6px
    0
    4px;

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-size:20px;
}

.simple-card p{
  margin:0;

  color:var(--muted);

  font-size:9px;
  line-height:1.5;
}


/* =========================================================
   BOTTOM NAV
========================================================= */

.bottom-nav{
  position:fixed;

  left:0;
  right:0;
  bottom:0;

  z-index:80;

  display:grid;

  grid-template-columns:
    repeat(5,1fr);

  gap:3px;

  padding:
    6px
    7px
    calc(6px + env(safe-area-inset-bottom));

  border-top:1px solid var(--line);

  background:
    rgba(7,12,16,.98);

  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
}

.bottom-nav a{
  min-height:46px;

  display:flex;

  flex-direction:column;

  align-items:center;
  justify-content:center;

  gap:2px;

  border-radius:10px;

  color:var(--muted);

  text-decoration:none;

  font-size:8px;
  font-weight:800;
}

.nav-icon{
  font-size:16px;
  line-height:1;
}

.bottom-nav a.active{
  color:#fff;

  border:
    1px solid
    rgba(201,111,104,.22);

  background:
    rgba(201,111,104,.08);
}


/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:380px){

  h1{
    font-size:26px;
  }

  .count-number{
    font-size:34px;
  }

}

@media(min-width:700px){

  main{
    padding-top:24px;
  }

  .bottom-nav{
    left:50%;
    right:auto;

    width:min(820px,100%);

    transform:
      translateX(-50%);

    border-left:1px solid var(--line);
    border-right:1px solid var(--line);

    border-radius:
      15px
      15px
      0
      0;
  }

}

</style>
</head>


<body>


<main>


  <!-- HEADER -->

  <header class="header">

    <div
      id="eyebrow"
      class="eyebrow"
    >
      Loading trip…
    </div>

    <h1 id="tripName">
      Japan Trip
    </h1>

    <div
      id="tripSubtitle"
      class="subtitle"
    >
      Loading…
    </div>


    <div
      id="routeStrip"
      class="route-strip"
    ></div>

  </header>



  <!-- MAIN HOME CONTENT -->

  <section id="homeContent">

    <div class="status">

      <strong>
        Loading your trip…
      </strong>

      Getting your schedule from Supabase.

    </div>

  </section>


</main>



<!-- =========================================================
     BOTTOM NAV
========================================================= -->

<nav
  class="bottom-nav"
  aria-label="Main navigation"
>

  <a
    id="navHome"
    class="active"
    aria-current="page"
  >
    <span class="nav-icon">🏠</span>
    <span>HOME</span>
  </a>


  <a id="navPlan">
    <span class="nav-icon">📅</span>
    <span>PLAN</span>
  </a>


  <a id="navFood">
    <span class="nav-icon">🍽️</span>
    <span>FOOD</span>
  </a>


  <a id="navHub">
    <span class="nav-icon">⭐</span>
    <span>HUB</span>
  </a>


  <a href="#">
    <span class="nav-icon">⋯</span>
    <span>MORE</span>
  </a>

</nav>



<!-- =========================================================
     SUPABASE
========================================================= -->

<script
  src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>

<script src="supabase.js"></script>



<script>

/* =========================================================
   TRIP
========================================================= */

const params =
  new URLSearchParams(
    window.location.search
  );

const TRIP_ID =
  Number(
    params.get("trip") || 1
  );


let trip = null;

let schedule = [];

let groupedDays = {};


/* =========================================================
   ELEMENTS
========================================================= */

const homeContent =
  document.getElementById(
    "homeContent"
  );

const tripName =
  document.getElementById(
    "tripName"
  );

const tripSubtitle =
  document.getElementById(
    "tripSubtitle"
  );

const eyebrow =
  document.getElementById(
    "eyebrow"
  );

const routeStrip =
  document.getElementById(
    "routeStrip"
  );


/* =========================================================
   NAV
========================================================= */

document.getElementById(
  "navHome"
).href =
  `index.html?trip=${TRIP_ID}`;

document.getElementById(
  "navPlan"
).href =
  `schedule.html?trip=${TRIP_ID}`;

document.getElementById(
  "navFood"
).href =
  `food.html?trip=${TRIP_ID}`;

document.getElementById(
  "navHub"
).href =
  `bookings.html?trip=${TRIP_ID}`;


/* =========================================================
   HELPERS
========================================================= */

function text(value){

  return String(
    value ?? ""
  );

}


function esc(value){

  return text(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


/* =========================================================
   DATES
========================================================= */

function parseDate(value){

  return new Date(
    value + "T12:00:00"
  );

}


function todayString(){

  const now =
    new Date();

  const year =
    now.getFullYear();

  const month =
    String(
      now.getMonth() + 1
    ).padStart(2,"0");

  const day =
    String(
      now.getDate()
    ).padStart(2,"0");

  return (
    `${year}-${month}-${day}`
  );

}


function formatRange(){

  const start =
    parseDate(
      trip.start_date
    );

  const end =
    parseDate(
      trip.end_date
    );


  const startText =
    new Intl.DateTimeFormat(
      "en-GB",
      {
        day:"numeric",
        month:"short"
      }
    )
    .format(start);


  const endText =
    new Intl.DateTimeFormat(
      "en-GB",
      {
        day:"numeric",
        month:"short",
        year:"numeric"
      }
    )
    .format(end);


  return (
    `${startText} – ${endText}`
  );

}


function formatDay(value){

  return new Intl.DateTimeFormat(
    "en-SG",
    {
      weekday:"short",
      day:"numeric",
      month:"short"
    }
  )
  .format(
    parseDate(value)
  )
  .toUpperCase();

}


function shortDay(value){

  return new Intl.DateTimeFormat(
    "en-SG",
    {
      day:"numeric",
      month:"short"
    }
  )
  .format(
    parseDate(value)
  )
  .toUpperCase();

}


function daysUntil(
  dateString
){

  const now =
    new Date();

  const today =
    new Date(
      now.getFullYear(),
      now.getMonth(),
      now.getDate()
    );


  const target =
    new Date(
      dateString +
      "T00:00:00"
    );


  return Math.ceil(
    (target - today) /
    86400000
  );

}


/* =========================================================
   DATABASE
========================================================= */

async function loadTrip(){

  const {
    data,
    error
  } =
    await db
      .from("trips")
      .select(`
        id,
        name,
        country,
        start_date,
        end_date,
        description
      `)
      .eq(
        "id",
        TRIP_ID
      )
      .single();


  if(error){
    throw error;
  }


  trip = data;

}


async function loadSchedule(){

  const {
    data,
    error
  } =
    await db
      .from("schedule")
      .select(`
        id,
        trip_id,
        schedule_date,
        start_time,
        end_time,
        time_label,
        sort_order,
        title,
        item_type,
        description,
        notes,
        place_id,
        restaurant_id,
        maps_url,
        is_optional,
        is_locked,

        place:places (
          id,
          name,
          maps_url
        ),

        restaurant:restaurants (
          id,
          name,
          maps_url,
          tabelog_url,
          booking_url
        )
      `)
      .eq(
        "trip_id",
        TRIP_ID
      )
      .order(
        "schedule_date",
        {
          ascending:true
        }
      )
      .order(
        "sort_order",
        {
          ascending:true
        }
      );


  if(error){
    throw error;
  }


  schedule =
    data || [];

}


/* =========================================================
   BUILD DAYS
========================================================= */

function buildDays(){

  groupedDays = {};


  schedule.forEach(item => {

    if(
      !groupedDays[
        item.schedule_date
      ]
    ){

      groupedDays[
        item.schedule_date
      ] = [];

    }


    groupedDays[
      item.schedule_date
    ].push(item);

  });

}


/* =========================================================
   HEADER
========================================================= */

function renderHeader(){

  tripName.textContent =
    trip.name;


  eyebrow.textContent =
    `${trip.country || "TRIP"} · ${formatRange()}`;


  /*
    Keep the subtitle short on Home.
    The full description doesn't really
    need to be displayed here.
  */

  if(TRIP_ID === 1){

    tripSubtitle.textContent =
      "Kyoto → Mountains → Osaka";


    routeStrip.innerHTML = `

      <span class="route-stop">
        ⛩️ KYOTO · 18–22
      </span>

      <span class="route-arrow">
        →
      </span>

      <span class="route-stop">
        🚗 ROAD · 23–26
      </span>

      <span class="route-arrow">
        →
      </span>

      <span class="route-stop">
        🌃 OSAKA · 26–30
      </span>

      <span class="route-arrow">
        →
      </span>

      <span class="route-stop">
        ✈️ HOME
      </span>

    `;

  }

  else{

    tripSubtitle.textContent =
      trip.description ||
      formatRange();


    routeStrip.innerHTML = "";

  }

}


/* =========================================================
   PROGRESS
========================================================= */

function progressKey(date){

  return (
    "trip_" +
    TRIP_ID +
    "_progress_" +
    date
  );

}


function getProgress(date){

  const items =
    groupedDays[date] || [];


  const stored =
    Number(
      localStorage.getItem(
        progressKey(date)
      ) || 0
    );


  return Math.max(
    0,
    Math.min(
      stored,
      items.length
    )
  );

}


function setProgress(
  date,
  value
){

  const items =
    groupedDays[date] || [];


  const safe =
    Math.max(
      0,
      Math.min(
        value,
        items.length
      )
    );


  localStorage.setItem(
    progressKey(date),
    String(safe)
  );

}


/* =========================================================
   ITEM HELPERS
========================================================= */

function itemName(item){

  return (
    item.place?.name ||
    item.restaurant?.name ||
    item.title
  );

}


function itemTime(item){

  if(item.time_label){
    return item.time_label;
  }


  if(item.start_time){

    return item.start_time
      .slice(
        0,
        5
      );

  }


  return "Flexible";

}


function mapURL(item){

  return (
    item.restaurant?.maps_url ||
    item.place?.maps_url ||
    item.maps_url ||
    null
  );

}


/* =========================================================
   DAY TITLE
========================================================= */

function dayTitle(items){

  const important =
    items
      .filter(
        item =>
          item.place_id ||
          item.restaurant_id
      )
      .slice(
        0,
        2
      );


  const source =
    important.length
    ?
    important
    :
    items.slice(0,2);


  const names =
    source
      .map(itemName)
      .filter(Boolean);


  return (
    names.join(" + ")
    ||
    "Flexible Day"
  );

}


/* =========================================================
   ROUTE
========================================================= */

function dayRoute(items){

  const names =
    items
      .filter(
        item =>
          item.place_id ||
          item.restaurant_id
      )
      .slice(
        0,
        4
      )
      .map(itemName)
      .filter(Boolean);


  if(!names.length){

    return (
      items
        .slice(0,3)
        .map(
          item =>
            item.title
        )
        .join(" → ")
    );

  }


  return names.join(
    " → "
  );

}

/* =========================================================
   PREVIEW
========================================================= */

function renderPreview(date){

  renderDayCard(
    date,
    true
  );

}


/* =========================================================
   TODAY / PREVIEW DAY
========================================================= */

function renderDayCard(
  date,
  preview=false
){

  const items =
    groupedDays[date] || [];


  if(!items.length){

    renderFreeDay();

    return;

  }


  const progress =
    getProgress(date);


  const finished =
    progress >=
    items.length;


  const current =
    finished
    ?
    items[
      items.length - 1
    ]
    :
    items[progress];


  const percent =
    finished
    ?
    100
    :
    Math.round(
      progress /
      items.length *
      100
    );


  const map =
    finished
    ?
    null
    :
    mapURL(current);


  const upcoming =
    finished
    ?
    []
    :
    items.slice(
      progress + 1,
      progress + 3
    );


  const note =
    current?.notes ||
    current?.description ||
    "";


  homeContent.innerHTML = `

    <div class="home-card">

      <div class="card-inner">


        <div class="card-top">

          <div class="card-label">

            ${
              preview
              ?
              "PREVIEW"
              :
              "● TODAY"
            }

          </div>


          <div class="card-date">

            ${esc(
              formatDay(date)
            )}

          </div>

        </div>


        <div class="today-title">

          ${esc(
            dayTitle(items)
          )}

        </div>


        <div class="today-route">

          ${esc(
            dayRoute(items)
          )}

        </div>


        <div class="progress-row">

          <div class="progress">

            <div
              class="progress-bar"
              style="width:${percent}%"
            ></div>

          </div>


          <div class="progress-text">

            ${
              finished
              ?
              "COMPLETE ✓"
              :
              `${progress}/${items.length} DONE`
            }

          </div>

        </div>


        <div class="now">

          <div class="now-head">

            <div class="now-label">

              ${
                finished
                ?
                "FINISHED"
                :
                "NOW"
              }

            </div>


            ${
              !finished

              ?

              `
                <div class="now-time">

                  ${esc(
                    itemTime(
                      current
                    )
                  )}

                </div>
              `

              :

              ""
            }

          </div>


          <div class="now-title">

            ${
              finished
              ?
              "✓ Day Complete"
              :
              esc(
                current.title
              )
            }

          </div>


          ${
            note && !finished

            ?

            `
              <div class="now-note">

                ${esc(note)}

              </div>
            `

            :

            ""
          }


          ${
            !finished

            ?

            `
              <div class="actions">

                <button
                  id="doneBtn"
                  class="btn done"
                  type="button"
                >
                  ✓ DONE · NEXT
                </button>


                ${
                  map

                  ?

                  `
                    <a
                      class="btn map"
                      href="${esc(map)}"
                      target="_blank"
                      rel="noopener noreferrer"
                    >
                      📍 MAP
                    </a>
                  `

                  :

                  `
                    <a
                      class="btn map"
                      href="food.html?trip=${TRIP_ID}"
                    >
                      🍽️ FOOD
                    </a>
                  `
                }

              </div>
            `

            :

            ""
          }

        </div>


        ${
          upcoming.length

          ?

          `
            <div class="up-next">

              <div class="up-title">
                UP NEXT
              </div>


              ${upcoming.map(item => `

                <div class="next-row">

                  <div class="next-time">

                    ${esc(
                      itemTime(item)
                    )}

                  </div>


                  <div class="next-name">

                    ${esc(
                      item.title
                    )}

                  </div>

                </div>

              `).join("")}

            </div>
          `

          :

          ""
        }

      </div>


      <div class="card-footer">


        ${
          preview

          ?

          `
            <button
              id="backHome"
              type="button"
            >
              ← TRIP HOME
            </button>
          `

          :

          `
            <button
              id="backStep"
              type="button"
              ${
                progress === 0
                ?
                "disabled"
                :
                ""
              }
            >
              ← BACK
            </button>
          `
        }


        <a
          class="view"
          href="schedule.html?trip=${TRIP_ID}#${date}"
        >
          VIEW FULL DAY →
        </a>

      </div>

    </div>

  `;


  const doneBtn =
    document.getElementById(
      "doneBtn"
    );


  if(doneBtn){

    doneBtn.onclick = () => {

      setProgress(
        date,
        getProgress(date) + 1
      );


      renderDayCard(
        date,
        preview
      );

    };

  }


  const backStep =
    document.getElementById(
      "backStep"
    );


  if(backStep){

    backStep.onclick = () => {

      if(
        getProgress(date) <= 0
      ){
        return;
      }


      setProgress(
        date,
        getProgress(date) - 1
      );


      renderDayCard(
        date,
        false
      );

    };

  }


  const backHome =
    document.getElementById(
      "backHome"
    );


  if(backHome){

    backHome.onclick =
      renderUpcoming;

  }

}

/* =========================================================
   HOME LOGIC
========================================================= */

function renderHome(){

  const today =
    todayString();


  if(
    groupedDays[today]
  ){

    renderDayCard(
      today,
      false
    );

    return;

  }


  if(
    today < trip.start_date
  ){

    renderUpcoming();

    return;

  }


  if(
    today > trip.end_date
  ){

    renderPast();

    return;

  }


  renderFreeDay();

}


/* =========================================================
   ERROR
========================================================= */

function showError(error){

  console.error(error);


  homeContent.innerHTML = `

    <div class="status">

      <strong>
        ⚠️ Couldn't load trip
      </strong>

      ${esc(
        error?.message ||
        "Unknown database error."
      )}

    </div>

  `;

}


/* =========================================================
   START
========================================================= */

async function start(){

  try{

    await Promise.all([
      loadTrip(),
      loadSchedule()
    ]);


    buildDays();

    renderHeader();

    renderHome();

  }

  catch(error){

    showError(error);

  }

}


start();

</script>
