<!doctype html>
<html lang="en">

<head>
<meta charset="utf-8">
<meta
  name="viewport"
  content="width=device-width, initial-scale=1, viewport-fit=cover"
>
<meta name="theme-color" content="#070c10">

<title>Japan Trip</title>

<style>

:root{
  --bg:#070c10;
  --panel:#10161c;
  --panel2:#151c23;
  --line:#29323b;
  --text:#f5f5f3;
  --muted:#aeb5bc;
  --muted2:#74818a;
  --red:#c96f68;
  --blue:#5c9dff;
  --green:#67c587;
  --gold:#e3b85c;
}

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  min-height:100vh;
  color:var(--text);

  font-family:
    Inter,
    ui-sans-serif,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

  background:
    radial-gradient(
      circle at 50% -10%,
      #17212a 0%,
      transparent 36%
    ),
    var(--bg);
}

button{
  font:inherit;
}

main{
  width:100%;
  max-width:760px;
  margin:auto;

  padding:
    18px
    13px
    100px;
}


/* =========================================================
   HEADER
========================================================= */

.header{
  margin-bottom:13px;
}

.eyebrow{
  color:var(--red);

  font-size:8px;
  font-weight:900;

  letter-spacing:.14em;
  text-transform:uppercase;
}

h1{
  margin:5px 0 3px;

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-size:28px;
  line-height:1.08;

  letter-spacing:-.025em;
}

.subtitle{
  color:var(--muted);

  font-size:9px;
}


/* =========================================================
   ROUTE
========================================================= */

.route{
  display:flex;
  align-items:center;

  gap:5px;

  margin-top:9px;

  overflow-x:auto;

  scrollbar-width:none;
}

.route::-webkit-scrollbar{
  display:none;
}

.route-chip{
  flex:0 0 auto;

  padding:
    4px
    7px;

  border:
    1px solid
    rgba(255,255,255,.06);

  border-radius:999px;

  background:
    rgba(255,255,255,.025);

  color:#c5ccd1;

  font-size:7px;
  font-weight:900;
}

.route-arrow{
  flex:0 0 auto;

  color:#53606a;

  font-size:8px;
}


/* =========================================================
   COUNTDOWN
========================================================= */

.countdown-card{
  margin-bottom:15px;

  padding:12px 13px;

  border:
    1px solid
    rgba(201,111,104,.34);

  border-radius:16px;

  background:
    linear-gradient(
      145deg,
      rgba(201,111,104,.09),
      #10161c 52%
    );
}

.countdown-top{
  display:flex;

  align-items:center;
  justify-content:space-between;

  gap:10px;
}

.countdown-label{
  color:var(--red);

  font-size:8px;
  font-weight:900;

  letter-spacing:.13em;
}

.countdown-date{
  color:var(--muted);

  font-size:7px;
  font-weight:800;
}

.countdown-main{
  display:flex;

  align-items:flex-end;

  gap:7px;

  margin-top:10px;
}

.countdown-number{
  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-size:36px;
  font-weight:800;

  line-height:.85;
}

.countdown-text{
  padding-bottom:2px;

  color:var(--muted);

  font-size:8px;
  font-weight:900;

  line-height:1.25;
}

.first-day{
  margin-top:10px;

  padding-top:9px;

  border-top:
    1px solid
    rgba(255,255,255,.07);
}

.first-label{
  color:#7f8b94;

  font-size:7px;
  font-weight:900;

  letter-spacing:.1em;
}

.first-title{
  margin-top:3px;

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-size:16px;
  font-weight:800;
}

.first-route{
  margin-top:3px;

  color:#b7c0c6;

  font-size:8px;
  line-height:1.4;
}


/* =========================================================
   SECTION
========================================================= */

.section-head{
  display:flex;

  align-items:center;
  justify-content:space-between;

  gap:10px;

  margin:
    0
    2px
    6px;
}

.section-title{
  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-size:17px;
  font-weight:800;
}

.section-note{
  color:#6f7c85;

  font-size:6px;
  font-weight:900;

  letter-spacing:.08em;
}


/* =========================================================
   HORIZONTAL DATES
========================================================= */

.date-scroller{
  display:flex;

  gap:6px;

  overflow-x:auto;

  padding:
    1px
    1px
    7px;

  margin-bottom:8px;

  scroll-snap-type:x proximity;

  scrollbar-width:none;
}

.date-scroller::-webkit-scrollbar{
  display:none;
}

.date-btn{
  flex:
    0
    0
    52px;

  min-height:54px;

  display:flex;

  flex-direction:column;

  align-items:center;
  justify-content:center;

  padding:5px 3px;

  border:1px solid var(--line);
  border-radius:10px;

  background:
    linear-gradient(
      145deg,
      #141c22,
      #0d1318
    );

  color:#aeb7bd;

  cursor:pointer;

  scroll-snap-align:start;
}

.date-btn .weekday{
  color:#68757e;

  font-size:6px;
  font-weight:900;
}

.date-btn .number{
  margin:2px 0 1px;

  color:#f1f2f0;

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-size:19px;
  font-weight:800;

  line-height:1;
}

.date-btn .month{
  color:#8b969e;

  font-size:6px;
  font-weight:900;
}

.date-btn.selected{
  border-color:
    rgba(201,111,104,.58);

  background:
    linear-gradient(
      145deg,
      rgba(201,111,104,.18),
      rgba(201,111,104,.06)
    );

  box-shadow:
    0 0 0 1px
    rgba(201,111,104,.08);
}

.date-btn.selected .weekday,
.date-btn.selected .month{
  color:#d99b95;
}

.date-btn.today{
  border-color:
    rgba(103,197,135,.42);
}

.date-btn.today::after{
  content:"TODAY";

  margin-top:2px;

  color:#77d498;

  font-size:5px;
  font-weight:900;
}

.date-btn.today.selected{
  border-color:
    rgba(103,197,135,.55);

  background:
    linear-gradient(
      145deg,
      rgba(103,197,135,.13),
      rgba(103,197,135,.04)
    );
}


/* =========================================================
   DAY PREVIEW
========================================================= */

.preview-card{
  overflow:hidden;

  border:1px solid var(--line);
  border-radius:15px;

  background:var(--panel);
}

.preview-header{
  padding:
    11px
    12px
    9px;

  border-bottom:
    1px solid
    rgba(255,255,255,.06);
}

.preview-top{
  display:flex;

  align-items:center;
  justify-content:space-between;

  gap:10px;
}

.preview-label{
  color:var(--red);

  font-size:7px;
  font-weight:900;

  letter-spacing:.12em;
}

.preview-date{
  color:#9fb2bf;

  font-size:7px;
  font-weight:900;
}

.preview-title{
  margin-top:5px;

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-size:19px;
  font-weight:800;

  line-height:1.2;
}

.preview-route{
  margin-top:3px;

  overflow:hidden;

  color:#9ca7ae;

  font-size:7px;
  line-height:1.4;

  white-space:nowrap;
  text-overflow:ellipsis;
}


/* =========================================================
   TIMELINE
========================================================= */

.timeline{
  padding:
    5px
    12px
    7px;
}

.timeline-head{
  margin:
    6px
    0
    3px;

  color:#748793;

  font-size:7px;
  font-weight:900;

  letter-spacing:.12em;
}

.timeline-row{
  position:relative;

  display:grid;

  grid-template-columns:
    70px
    15px
    1fr;

  gap:7px;

  min-height:40px;

  padding:
    6px
    0;
}

.timeline-row:not(:last-child)::after{
  content:"";

  position:absolute;

  left:77px;
  top:27px;
  bottom:-7px;

  width:1px;

  background:#26323a;
}

.timeline-time{
  padding-top:1px;

  color:#9bb8d0;

  font-size:8px;
  font-weight:900;

  line-height:1.25;
}

.timeline-marker{
  position:relative;

  z-index:2;

  display:flex;

  justify-content:center;
}

.dot{
  width:8px;
  height:8px;

  margin-top:3px;

  border:
    2px solid
    #172029;

  border-radius:50%;

  background:var(--red);

  box-shadow:
    0 0 0 1px
    rgba(201,111,104,.35);
}

.timeline-content{
  min-width:0;
}

.timeline-title{
  color:#f2f2f0;

  font-size:9px;
  font-weight:850;

  line-height:1.3;
}

.timeline-title a{
  color:inherit;

  text-decoration:none;
}

.timeline-place{
  margin-top:2px;

  color:#75838c;

  font-size:7px;

  line-height:1.3;
}

.optional{
  display:inline-block;

  margin-left:4px;

  padding:
    1px
    4px;

  border:
    1px solid
    rgba(227,184,92,.2);

  border-radius:999px;

  color:var(--gold);

  font-size:6px;
}


/* =========================================================
   EMPTY DAY
========================================================= */

.empty-day{
  padding:
    22px
    14px;

  color:var(--muted);

  text-align:center;

  font-size:8px;
}


/* =========================================================
   PREVIEW FOOTER
========================================================= */

.preview-footer{
  display:flex;

  align-items:center;
  justify-content:flex-end;

  padding:
    9px
    12px;

  border-top:
    1px solid
    rgba(255,255,255,.06);

  background:
    rgba(0,0,0,.12);
}

.preview-footer a{
  color:var(--red);

  text-decoration:none;

  font-size:8px;
  font-weight:900;
}


/* =========================================================
   STATE
========================================================= */

.state{
  padding:
    28px
    16px;

  border:
    1px dashed
    #35414a;

  border-radius:14px;

  color:var(--muted);

  text-align:center;

  font-size:9px;
}

.state strong{
  display:block;

  margin-bottom:4px;

  color:#fff;

  font-size:12px;
}


/* =========================================================
   BOTTOM NAV
========================================================= */

.bottom-nav{
  position:fixed;

  left:0;
  right:0;
  bottom:0;

  z-index:80;

  display:grid;

  grid-template-columns:
    repeat(5,1fr);

  gap:3px;

  padding:
    6px
    7px
    calc(6px + env(safe-area-inset-bottom));

  border-top:
    1px solid
    var(--line);

  background:
    rgba(7,12,16,.98);

  backdrop-filter:
    blur(18px);

  -webkit-backdrop-filter:
    blur(18px);
}

.bottom-nav a{
  min-height:46px;

  display:flex;

  flex-direction:column;

  align-items:center;
  justify-content:center;

  gap:2px;

  border-radius:10px;

  color:var(--muted);

  text-decoration:none;

  font-size:8px;
  font-weight:800;
}

.nav-icon{
  font-size:16px;

  line-height:1;
}

.bottom-nav a.active{
  color:#fff;

  border:
    1px solid
    rgba(201,111,104,.22);

  background:
    rgba(201,111,104,.08);
}


/* =========================================================
   DESKTOP
========================================================= */

@media(min-width:700px){

  main{
    padding-top:24px;
  }

  .bottom-nav{
    left:50%;
    right:auto;

    width:min(820px,100%);

    transform:
      translateX(-50%);

    border-left:
      1px solid
      var(--line);

    border-right:
      1px solid
      var(--line);

    border-radius:
      15px
      15px
      0
      0;
  }

}

</style>
</head>


<body>


<main>


  <!-- HEADER -->

  <header class="header">

    <div
      id="eyebrow"
      class="eyebrow"
    >
      LOADING TRIP
    </div>


    <h1 id="tripName">
      Japan Trip
    </h1>


    <div
      id="tripSubtitle"
      class="subtitle"
    >
      Loading itinerary…
    </div>


    <div
      id="route"
      class="route"
    ></div>

  </header>



  <!-- CONTENT -->

  <section id="homeContent">

    <div class="state">

      <strong>
        Loading your trip…
      </strong>

      Getting your itinerary from Supabase.

    </div>

  </section>


</main>



<!-- =========================================================
     BOTTOM NAV
========================================================= -->

<nav
  class="bottom-nav"
  aria-label="Main navigation"
>

  <a
    id="navHome"
    class="active"
    aria-current="page"
  >
    <span class="nav-icon">
      🏠
    </span>

    <span>
      HOME
    </span>
  </a>


  <a id="navPlan">

    <span class="nav-icon">
      📅
    </span>

    <span>
      PLAN
    </span>

  </a>


  <a id="navFood">

    <span class="nav-icon">
      🍽️
    </span>

    <span>
      FOOD
    </span>

  </a>


  <a id="navHub">

    <span class="nav-icon">
      ⭐
    </span>

    <span>
      HUB
    </span>

  </a>


  <a href="#">

    <span class="nav-icon">
      ⋯
    </span>

    <span>
      MORE
    </span>

  </a>

</nav>



<!-- =========================================================
     SUPABASE
========================================================= -->

<script
  src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>

<script src="supabase.js"></script>



<script>

/* =========================================================
   TRIP
========================================================= */

const params =
  new URLSearchParams(
    window.location.search
  );

const TRIP_ID =
  Number(
    params.get("trip") || 1
  );


let trip = null;

let schedule = [];

let groupedDays = {};

let selectedDate = null;


/* =========================================================
   ELEMENTS
========================================================= */

const homeContent =
  document.getElementById(
    "homeContent"
  );

const tripName =
  document.getElementById(
    "tripName"
  );

const tripSubtitle =
  document.getElementById(
    "tripSubtitle"
  );

const eyebrow =
  document.getElementById(
    "eyebrow"
  );

const route =
  document.getElementById(
    "route"
  );


/* =========================================================
   NAV
========================================================= */

document.getElementById(
  "navHome"
).href =
  `index.html?trip=${TRIP_ID}`;

document.getElementById(
  "navPlan"
).href =
  `schedule.html?trip=${TRIP_ID}`;

document.getElementById(
  "navFood"
).href =
  `food.html?trip=${TRIP_ID}`;

document.getElementById(
  "navHub"
).href =
  `bookings.html?trip=${TRIP_ID}`;


/* =========================================================
   HELPERS
========================================================= */

function text(value){

  return String(
    value ?? ""
  );

}


function esc(value){

  return text(value)

    .replaceAll(
      "&",
      "&amp;"
    )

    .replaceAll(
      "<",
      "&lt;"
    )

    .replaceAll(
      ">",
      "&gt;"
    )

    .replaceAll(
      '"',
      "&quot;"
    )

    .replaceAll(
      "'",
      "&#039;"
    );

}


/* =========================================================
   DATE HELPERS
========================================================= */

function parseDate(value){

  return new Date(
    value +
    "T12:00:00"
  );

}


function localDateString(){

  const d =
    new Date();


  const year =
    d.getFullYear();


  const month =
    String(
      d.getMonth() + 1
    )
    .padStart(
      2,
      "0"
    );


  const day =
    String(
      d.getDate()
    )
    .padStart(
      2,
      "0"
    );


  return (
    `${year}-${month}-${day}`
  );

}


function formatRange(){

  const start =
    parseDate(
      trip.start_date
    );


  const end =
    parseDate(
      trip.end_date
    );


  const startText =
    new Intl.DateTimeFormat(
      "en-GB",
      {
        day:"numeric",
        month:"short"
      }
    )
    .format(start);


  const endText =
    new Intl.DateTimeFormat(
      "en-GB",
      {
        day:"numeric",
        month:"short",
        year:"numeric"
      }
    )
    .format(end);


  return (
    `${startText} – ${endText}`
  );

}


function formatPreviewDate(value){

  return new Intl.DateTimeFormat(
    "en-SG",
    {
      weekday:"short",
      day:"numeric",
      month:"short"
    }
  )
  .format(
    parseDate(value)
  )
  .toUpperCase();

}


function dateParts(value){

  const d =
    parseDate(value);


  return {

    weekday:
      new Intl.DateTimeFormat(
        "en-SG",
        {
          weekday:"short"
        }
      )
      .format(d)
      .toUpperCase(),

    day:
      new Intl.DateTimeFormat(
        "en-SG",
        {
          day:"numeric"
        }
      )
      .format(d),

    month:
      new Intl.DateTimeFormat(
        "en-SG",
        {
          month:"short"
        }
      )
      .format(d)
      .toUpperCase()

  };

}


function daysUntil(value){

  const now =
    new Date();


  const today =
    new Date(
      now.getFullYear(),
      now.getMonth(),
      now.getDate()
    );


  const target =
    new Date(
      value +
      "T00:00:00"
    );


  return Math.ceil(
    (target - today) /
    86400000
  );

}


/* =========================================================
   LOAD TRIP
========================================================= */

async function loadTrip(){

  const {
    data,
    error
  } =
    await db
      .from("trips")
      .select(`
        id,
        name,
        country,
        start_date,
        end_date,
        description
      `)
      .eq(
        "id",
        TRIP_ID
      )
      .single();


  if(error){
    throw error;
  }


  trip = data;

}


/* =========================================================
   LOAD SCHEDULE
========================================================= */

async function loadSchedule(){

  const {
    data,
    error
  } =
    await db
      .from("schedule")
      .select(`
        id,
        trip_id,
        schedule_date,
        start_time,
        end_time,
        time_label,
        sort_order,
        title,
        item_type,
        description,
        notes,
        location_name,
        maps_url,
        place_id,
        restaurant_id,
        is_optional,
        is_locked,

        place:places(
          id,
          name,
          maps_url
        ),

        restaurant:restaurants(
          id,
          name,
          maps_url
        )
      `)
      .eq(
        "trip_id",
        TRIP_ID
      )
      .order(
        "schedule_date",
        {
          ascending:true
        }
      )
      .order(
        "sort_order",
        {
          ascending:true
        }
      );


  if(error){
    throw error;
  }


  schedule =
    data || [];

}


/* =========================================================
   GROUP DAYS
========================================================= */

function buildDays(){

  groupedDays = {};


  schedule.forEach(
    item => {

      if(
        !groupedDays[
          item.schedule_date
        ]
      ){

        groupedDays[
          item.schedule_date
        ] = [];

      }


      groupedDays[
        item.schedule_date
      ]
      .push(item);

    }
  );

}


/* =========================================================
   HEADER
========================================================= */

function renderHeader(){

  tripName.textContent =
    trip.name;


  eyebrow.textContent =
    `${trip.country || "TRIP"} · ${formatRange()}`;


  if(TRIP_ID === 1){

    tripSubtitle.textContent =
      "Kyoto → Road Trip → Osaka";


    route.innerHTML = `

      <span class="route-chip">
        ⛩️ KYOTO · 18–22
      </span>

      <span class="route-arrow">
        →
      </span>

      <span class="route-chip">
        🚗 ROAD · 23–26
      </span>

      <span class="route-arrow">
        →
      </span>

      <span class="route-chip">
        🌃 OSAKA · 26–30
      </span>

      <span class="route-arrow">
        →
      </span>

      <span class="route-chip">
        ✈️ HOME
      </span>

    `;

  }

  else{

    tripSubtitle.textContent =
      trip.description ||
      formatRange();


    route.innerHTML = "";

  }

}


/* =========================================================
   DISPLAY NAME
========================================================= */

function itemName(item){

  /*
    For Home, prefer the actual
    linked place / restaurant.

    This makes Home about WHERE
    you're going rather than
    generic schedule labels.
  */

  return (
    item.place?.name ||
    item.restaurant?.name ||
    item.location_name ||
    item.title ||
    "Location"
  );

}


/* =========================================================
   TIME
========================================================= */

function itemTime(item){

  /*
    Preserve your manually entered
    labels such as "~4:00 PM".
  */

  if(item.time_label){

    /*
      If the label contains a range,
      only show the starting time
      on Home.

      Example:
      3:15–3:45 PM -> 3:15 PM-ish

      But most location rows should
      already have simple labels.
    */

    return item.time_label;

  }


  if(item.start_time){

    const parts =
      item.start_time.split(":");


    let hour =
      Number(
        parts[0]
      );


    const minute =
      parts[1] || "00";


    const suffix =
      hour >= 12
      ?
      "PM"
      :
      "AM";


    hour =
      hour % 12 || 12;


    return (
      `${hour}:${minute} ${suffix}`
    );

  }


  return "Flexible";

}


/* =========================================================
   MAP
========================================================= */

function itemMap(item){

  return (
    item.restaurant?.maps_url ||
    item.place?.maps_url ||
    item.maps_url ||
    null
  );

}


/* =========================================================
   FILTER HOME LOCATIONS
========================================================= */

function isPreviewLocation(item){

  /*
    If linked to an actual place,
    keep it.
  */

  if(item.place_id){
    return true;
  }


  /*
    If linked to an actual named
    restaurant, keep it.

    So Takara Sushi / Setsu etc.
    can still appear.
  */

  if(item.restaurant_id){
    return true;
  }


  const name =
    text(
      item.title
    )
    .toLowerCase();


  /*
    These are useful in the FULL PLAN,
    but not in the Home location preview.
  */

  const hideWords = [

    "breakfast",

    "lunch",

    "late lunch",

    "dinner",

    "snack",

    "check-in",

    "check in",

    "check-out",

    "check out",

    "checkout",

    "leave luggage",

    "drop luggage",

    "luggage",

    "free time",

    "rest",

    "travel",

    "train",

    "drive",

    "driving",

    "depart",

    "departure",

    "arrive",

    "arrival",

    "return to hotel",

    "back to hotel",

    "head back",

    "transfer"

  ];


  if(
    hideWords.some(
      word =>
        name.includes(word)
    )
  ){

    return false;

  }


  /*
    Keep remaining custom items.

    This allows things like:
    TeamLab,
    ROUND1,
    market,
    museum,
    etc.
  */

  return true;

}


/* =========================================================
   PREVIEW ITEMS
========================================================= */

function previewItems(date){

  return (
    groupedDays[date] || []
  )
  .filter(
    isPreviewLocation
  );

}


/* =========================================================
   ICON
========================================================= */

function itemIcon(item){

  const name =
    text(
      itemName(item)
    )
    .toLowerCase();


  if(
    item.restaurant_id
  ){
    return "🍽️";
  }


  if(
    name.includes("shrine") ||
    name.includes("taisha") ||
    name.includes("temple") ||
    name.includes("ji ")
  ){
    return "⛩️";
  }


  if(
    name.includes("bamboo")
  ){
    return "🎋";
  }


  if(
    name.includes("waterfall") ||
    name.includes("falls")
  ){
    return "💧";
  }


  if(
    name.includes("mount") ||
    name.includes("highland") ||
    name.includes("viewpoint") ||
    name.includes("observatory")
  ){
    return "🏔️";
  }


  if(
    name.includes("market")
  ){
    return "🛍️";
  }


  if(
    name.includes("teamlab")
  ){
    return "✨";
  }


  if(
    name.includes("round1")
  ){
    return "🎳";
  }


  if(
    name.includes("museum")
  ){
    return "🏛️";
  }


  if(
    name.includes("park")
  ){
    return "🌿";
  }


  return "📍";

}


/* =========================================================
   DAY AREA
========================================================= */

function dayArea(
  date,
  items
){

  /*
    Current Japan trip labels.
    These are just presentation labels.
  */

  if(TRIP_ID === 1){

    if(
      date >= "2026-10-18" &&
      date <= "2026-10-20"
    ){
      return "⛩️ Kyoto";
    }


    if(
      date === "2026-10-21"
    ){
      return "🌊 Ine";
    }


    if(
      date === "2026-10-22"
    ){
      return "⛩️ Kyoto";
    }


    if(
      date === "2026-10-23"
    ){
      return "🚗 Kyoto → Dorogawa";
    }


    if(
      date === "2026-10-24"
    ){
      return "🏔️ Dorogawa → Ryujin";
    }


    if(
      date === "2026-10-25"
    ){
      return "⛩️ Kumano";
    }


    if(
      date === "2026-10-26"
    ){
      return "💧 Nachi → Osaka";
    }


    if(
      date === "2026-10-27"
    ){
      return "🌃 Osaka";
    }


    if(
      date === "2026-10-28"
    ){
      return "🚄 Aichi Day Trip";
    }


    if(
      date === "2026-10-29"
    ){
      return "🦌 Nara";
    }


    if(
      date === "2026-10-30"
    ){
      return "✈️ Departure";
    }

  }


  const location =
    items.find(
      item =>
        item.location_name
    )
    ?.location_name;


  return (
    location ||
    "Japan"
  );

}


/* =========================================================
   DAY SUMMARY
========================================================= */

function daySummary(date){

  const items =
    previewItems(date);


  const names = [];


  items.forEach(
    item => {

      const name =
        itemName(item);


      if(
        name &&
        !names.includes(name)
      ){

        names.push(name);

      }

    }
  );


  return names
    .slice(
      0,
      4
    )
    .join(" · ");

}


/* =========================================================
   PREVIEW ROUTE
========================================================= */

function previewRoute(date){

  const items =
    previewItems(date);


  const names = [];


  items.forEach(
    item => {

      const name =
        itemName(item);


      if(
        name &&
        !names.includes(name)
      ){

        names.push(name);

      }

    }
  );


  return names
    .slice(
      0,
      5
    )
    .join(" → ");

}


/* =========================================================
   COUNTDOWN
========================================================= */

function countdownHTML(){

  const today =
    localDateString();


  /*
    DURING TRIP
  */

  if(
    today >= trip.start_date &&
    today <= trip.end_date
  ){

    return `

      <div class="countdown-card">

        <div class="countdown-top">

          <div class="countdown-label">
            ● TODAY
          </div>

          <div class="countdown-date">

            ${esc(
              formatPreviewDate(
                today
              )
            )}

          </div>

        </div>


        <div class="first-title">

          ${esc(
            dayArea(
              today,
              groupedDays[today] || []
            )
          )}

        </div>


        <div class="first-route">

          ${esc(
            daySummary(today)
          )}

        </div>

      </div>

    `;

  }


  /*
    AFTER TRIP
  */

  if(
    today > trip.end_date
  ){

    return `

      <div class="countdown-card">

        <div class="countdown-label">
          TRIP COMPLETE
        </div>

        <div class="first-title">
          ${esc(trip.name)}
        </div>

        <div class="first-route">
          Your itinerary is saved below.
        </div>

      </div>

    `;

  }


  /*
    BEFORE TRIP
  */

  const count =
    Math.max(
      0,
      daysUntil(
        trip.start_date
      )
    );


  const dates =
    Object.keys(
      groupedDays
    )
    .sort();


  const firstDate =
    dates[0] ||
    trip.start_date;


  return `

    <div class="countdown-card">

      <div class="countdown-top">

        <div class="countdown-label">
          UPCOMING TRIP
        </div>

        <div class="countdown-date">
          ${esc(formatRange())}
        </div>

      </div>


      <div class="countdown-main">

        <div class="countdown-number">
          ${count}
        </div>

        <div class="countdown-text">

          DAY${
            count === 1
            ?
            ""
            :
            "S"
          }

          <br>

          TO GO

        </div>

      </div>


      <div class="first-day">

        <div class="first-label">

          FIRST DAY ·

          ${esc(
            formatPreviewDate(
              firstDate
            )
          )}

        </div>


        <div class="first-title">

          ${esc(
            dayArea(
              firstDate,
              groupedDays[firstDate] || []
            )
          )}

        </div>


        <div class="first-route">

          ${esc(
            daySummary(
              firstDate
            )
          )}

        </div>

      </div>

    </div>

  `;

}


/* =========================================================
   DATE BUTTONS
========================================================= */

function datesHTML(){

  const today =
    localDateString();


  const dates =
    Object.keys(
      groupedDays
    )
    .sort();


  return dates
    .map(
      date => {

        const parts =
          dateParts(date);


        return `

          <button
            class="
              date-btn
              ${
                date === selectedDate
                ?
                "selected"
                :
                ""
              }
              ${
                date === today
                ?
                "today"
                :
                ""
              }
            "
            type="button"
            data-date="${date}"
          >

            <span class="weekday">
              ${esc(parts.weekday)}
            </span>

            <span class="number">
              ${esc(parts.day)}
            </span>

            <span class="month">
              ${esc(parts.month)}
            </span>

          </button>

        `;

      }
    )
    .join("");

}


/* =========================================================
   TIMELINE ROW
========================================================= */

function timelineRow(item){

  const map =
    itemMap(item);


  const name =
    itemName(item);


  return `

    <div class="timeline-row">

      <div class="timeline-time">

        ${esc(
          itemTime(item)
        )}

      </div>


      <div class="timeline-marker">

        <span class="dot"></span>

      </div>


      <div class="timeline-content">

        <div class="timeline-title">

          ${itemIcon(item)}

          ${
            map

            ?

            `
              <a
                href="${esc(map)}"
                target="_blank"
                rel="noopener noreferrer"
              >
                ${esc(name)}
              </a>
            `

            :

            esc(name)
          }


          ${
            item.is_optional

            ?

            `
              <span class="optional">
                OPTIONAL
              </span>
            `

            :

            ""
          }

        </div>

      </div>

    </div>

  `;

}


/* =========================================================
   DAY PREVIEW HTML
========================================================= */

function previewHTML(date){

  const items =
    previewItems(date);


  const allItems =
    groupedDays[date] || [];


  return `

    <div class="preview-card">

      <div class="preview-header">

        <div class="preview-top">

          <div class="preview-label">
            DAY PREVIEW
          </div>

          <div class="preview-date">

            ${esc(
              formatPreviewDate(
                date
              )
            )}

          </div>

        </div>


        <div class="preview-title">

          ${esc(
            dayArea(
              date,
              allItems
            )
          )}

        </div>


        ${
          previewRoute(date)

          ?

          `
            <div class="preview-route">

              ${esc(
                previewRoute(
                  date
                )
              )}

            </div>
          `

          :

          ""
        }

      </div>


      ${
        items.length

        ?

        `
          <div class="timeline">

            <div class="timeline-head">
              TODAY'S PLACES
            </div>

            ${
              items
                .map(
                  timelineRow
                )
                .join("")
            }

          </div>
        `

        :

        `
          <div class="empty-day">

            No location stops found
            for this day.

          </div>
        `
      }


      <div class="preview-footer">

        <a
          href="schedule.html?trip=${TRIP_ID}#${date}"
        >
          FULL PLAN →
        </a>

      </div>

    </div>

  `;

}


/* =========================================================
   SELECT DEFAULT DATE
========================================================= */

function chooseDefaultDate(){

  const dates =
    Object.keys(
      groupedDays
    )
    .sort();


  if(
    !dates.length
  ){

    selectedDate = null;

    return;

  }


  const today =
    localDateString();


  /*
    During trip:
    show today.
  */

  if(
    groupedDays[today]
  ){

    selectedDate =
      today;

    return;

  }


  /*
    Before trip:
    show first day.
  */

  if(
    today <
    trip.start_date
  ){

    selectedDate =
      dates[0];

    return;

  }


  /*
    After trip:
    show last day.
  */

  selectedDate =
    dates[
      dates.length - 1
    ];

}


/* =========================================================
   RENDER HOME
========================================================= */

function renderHome(){

  const dates =
    Object.keys(
      groupedDays
    )
    .sort();


  if(
    !dates.length
  ){

    homeContent.innerHTML = `

      <div class="state">

        <strong>
          No itinerary yet
        </strong>

        There are no schedule
        items for this trip.

      </div>

    `;

    return;

  }


  homeContent.innerHTML = `

    ${countdownHTML()}


    <div class="section-head">

      <div class="section-title">
        Day Preview
      </div>

      <div class="section-note">
        SWIPE · TAP A DATE
      </div>

    </div>


    <div
      id="dateScroller"
      class="date-scroller"
    >

      ${datesHTML()}

    </div>


    <div id="previewContainer">

      ${previewHTML(
        selectedDate
      )}

    </div>

  `;


  bindDateButtons();


  /*
    Scroll selected date into view
    without moving the whole page.
  */

  requestAnimationFrame(
    () => {

      const selected =
        document.querySelector(
          ".date-btn.selected"
        );


      if(selected){

        selected.scrollIntoView({
          behavior:"smooth",
          block:"nearest",
          inline:"center"
        });

      }

    }
  );

}


/* =========================================================
   DATE BUTTON EVENTS
========================================================= */

function bindDateButtons(){

  document
    .querySelectorAll(
      ".date-btn"
    )
    .forEach(
      button => {

        button.onclick =
          () => {

            selectedDate =
              button.dataset.date;


            /*
              Update selected styling
              without rebuilding page.
            */

            document
              .querySelectorAll(
                ".date-btn"
              )
              .forEach(
                btn => {

                  btn.classList
                    .toggle(
                      "selected",
                      btn.dataset.date ===
                      selectedDate
                    );

                }
              );


            /*
              Replace only the timeline.
            */

            document
              .getElementById(
                "previewContainer"
              )
              .innerHTML =
                previewHTML(
                  selectedDate
                );


            /*
              Center selected date.
            */

            button.scrollIntoView({
              behavior:"smooth",
              block:"nearest",
              inline:"center"
            });

          };

      }
    );

}


/* =========================================================
   ERROR
========================================================= */

function showError(error){

  console.error(error);


  homeContent.innerHTML = `

    <div class="state">

      <strong>
        ⚠️ Couldn't load trip
      </strong>

      ${esc(
        error?.message ||
        "Unknown database error."
      )}

    </div>

  `;

}


/* =========================================================
   START
========================================================= */

async function start(){

  try{

    await Promise.all([
      loadTrip(),
      loadSchedule()
    ]);


    buildDays();

    renderHeader();

    chooseDefaultDate();

    renderHome();

  }

  catch(error){

    showError(error);

  }

}


start();

</script>
