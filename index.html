<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070c10">

<title>My Trip</title>

  --panel:#10161c;
  --panel2:#151c23;

html{scroll-behavior:smooth}

body{
  margin:0;
  min-height:100vh;
  color:var(--text);

}

button{font:inherit}

main{

  margin:auto;
  padding:20px 14px 94px;
}

/* =========================================================
   HEADER
========================================================= */

.eyebrow{
  color:var(--red);
  font-size:10px;
  font-weight:900;
  letter-spacing:.16em;
  text-transform:uppercase;
}

h1{
  font-family:Georgia,"Times New Roman",serif;
  font-size:31px;
  line-height:1.05;
  margin:7px 0 4px;
  letter-spacing:-.03em;
}

.sub{
  font-size:11px;
  color:var(--muted);
}

/* =========================================================
   DAY CARD
========================================================= */

.day-card{
  margin-top:18px;
  border:1px solid rgba(201,111,104,.38);
  border-radius:20px;
  padding:14px;
  background:

.day-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

.day-label{

  font-size:8px;
  font-weight:900;
  letter-spacing:.13em;
}

.day-date{

  font-size:8px;

}

  font-family:Georgia,"Times New Roman",serif;

}

  font-size:9px;

========================================================= */

.date-scroll{

  gap:5px;
  overflow-x:auto;
  margin-top:12px;
  padding-bottom:3px;
  scrollbar-width:none;
}

.date-scroll::-webkit-scrollbar{display:none}

.date-btn{
  flex:0 0 auto;
  width:42px;
  min-height:43px;
  border:1px solid var(--line);
  border-radius:10px;
  background:#11181e;
  color:var(--muted);
  cursor:pointer;
}

.date-btn .num{
  display:block;
  color:#e7e9ea;
  font-size:11px;
  font-weight:900;
}

.date-btn .dow{
  display:block;
  margin-top:1px;
  font-size:6px;
  font-weight:900;
}

.date-btn.active{
  border-color:rgba(201,111,104,.55);
  background:rgba(201,111,104,.12);
  color:#f1cbc8;
}

.date-btn.active .num{color:#fff}

/* =========================================================
   BLOCKS
========================================================= */

.plan-title{
  margin:14px 2px 6px;
  color:var(--muted-blue);
  font-size:7px;
  font-weight:900;
  letter-spacing:.13em;
}

.block{
  margin-bottom:6px;
  border:1px solid var(--line);
  border-radius:12px;
  background:linear-gradient(145deg,#141c22,#0d1318);
  overflow:hidden;
}

  width:100%;
  min-height:52px;
  display:flex;
  align-items:center;
  gap:8px;
  padding:9px 10px;
}

.block-time{
  flex:0 0 76px;
  color:#a6b7c2;
  font-size:7px;
  font-weight:900;
  line-height:1.4;
}

.block-main{
  flex:1;
  min-width:0;
}

.block-name{
  color:#f3f3f1;
  font-size:9px;
  font-weight:900;
  line-height:1.3;
}

.block-note{
  margin-top:2px;
  color:#7f8b93;

  line-height:1.4;
}

.block-map{
  flex:0 0 31px;
  width:31px;
  height:31px;

  align-items:center;
  justify-content:center;
  border:1px solid rgba(92,157,255,.18);
  border-radius:8px;
  background:rgba(92,157,255,.05);
  text-decoration:none;
  font-size:12px;
}

.block.eaten{
  opacity:.58;
}

.block.eaten .block-name{
  text-decoration:line-through;
  text-decoration-thickness:1px;
}

.block-eaten{
  flex:0 0 auto;
  min-height:29px;
  padding:0 8px;
  border:1px solid rgba(103,197,135,.26);
  border-radius:8px;
  background:rgba(103,197,135,.08);
  color:#a9e8bb;
  font-size:6px;
  font-weight:900;
  cursor:pointer;
}

.block-eaten.done{
  color:#88aa93;
  background:rgba(103,197,135,.04);
}

   FULL PLAN
========================================================= */

.full-plan{
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:38px;
  margin-top:10px;
  border:1px solid rgba(201,111,104,.32);
  border-radius:10px;
  background:rgba(201,111,104,.08);
  color:#f1cfcc;
  text-decoration:none;
  font-size:8px;
  font-weight:900;
}

   FOOD NEAR ME
========================================================= */

.food-nearby{
  width:100%;
  min-height:64px;
  margin-top:10px;
  padding:11px 14px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  border:1px solid rgba(103,197,135,.65);
  border-radius:12px;

    linear-gradient(
      135deg,
      rgba(103,197,135,.12),

  cursor:pointer;
}

.food-nearby-left{

.food-nearby-sub{

.food-nearby-arrow{

.nearby-panel{
  display:none;

  padding:10px;
  border:1px solid rgba(103,197,135,.28);
  border-radius:12px;
  background:rgba(103,197,135,.035);
}

.nearby-panel.show{display:block}

.nearby-status{
  color:#88aa93;
  font-size:7px;
  line-height:1.45;
}

.nearby-status.error{color:#ffc5c1}

.nearby-section{margin-top:10px}

.nearby-section-title{
  margin-bottom:5px;
  color:#9de6b2;
  font-size:7px;
  font-weight:900;
  letter-spacing:.08em;
}

.nearby-item{
  display:flex;
  align-items:center;
  gap:8px;
  min-height:45px;
  padding:7px 4px;
  border-top:1px solid rgba(255,255,255,.055);
}

.nearby-item-main{
  flex:1;
  min-width:0;
}

.nearby-item-name{
  color:#eef2ef;
  font-size:8px;
  font-weight:900;
  line-height:1.3;
}

.nearby-item-meta{
  margin-top:2px;
  color:#7f9487;
  font-size:6.5px;
  line-height:1.35;
}

.nearby-item-badge{
  display:inline-block;
  margin-left:4px;
  padding:1px 4px;
  border:1px solid rgba(227,184,92,.25);
  border-radius:999px;
  color:var(--gold);
  font-size:5.5px;
}

.nearby-item-map{
  flex:0 0 30px;
  width:30px;
  height:30px;
  display:flex;
  align-items:center;
  justify-content:center;
  border:1px solid rgba(92,157,255,.18);
  border-radius:8px;
  background:rgba(92,157,255,.05);
  color:#fff;
  text-decoration:none;
  font-size:11px;
}

.nearby-more{
  min-height:35px;
  margin-top:9px;
  display:flex;
  align-items:center;
  justify-content:center;
  border:1px solid rgba(103,197,135,.22);
  border-radius:9px;
  background:rgba(103,197,135,.06);
  color:#a9e8bb;
  text-decoration:none;
  font-size:7px;
  font-weight:900;
}

/* =========================================================
   TRIPLINE
========================================================= */

.tripline{
  margin-top:14px;
  padding:9px;
  border:1px solid var(--line);
  border-radius:11px;
  color:#75828a;
  background:rgba(255,255,255,.02);
  text-align:center;
  font-size:7px;
  line-height:1.5;
}

.tripline strong{color:#dce0e2}

/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:360px){
  .block-time{flex-basis:68px}
}

</style>
</head>

<body>

<main>

  <div class="eyebrow">LOADING TRIP…</div>
  <h1>My Trip</h1>
  <div class="sub">Loading trip details…</div>

  <section id="dayPreview"></section>

  <div class="tripline">
    <strong>Loading trip…</strong>
  </div>

</main>


<!-- SHARED FOOTER -->
<div id="footer"></div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script src="google-maps.js"></script>

<script>

/* =========================================================
   CONFIG
========================================================= */

const params =
  new URLSearchParams(window.location.search);

const REQUESTED_TRIP_ID =
  Number(params.get("trip")) || null;

let TRIP_ID =
  REQUESTED_TRIP_ID;


/* =========================================================
   HELPERS
========================================================= */

function mapURL(query){

  return (
    "https://www.google.com/maps/search/?api=1&query=" +
    encodeURIComponent(query)
  );

}


function escapeHTML(value){

  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


function formatTripDate(value){

  if(!value){
    return "";
  }

  const date =
    new Date(value + "T00:00:00");

  return date.toLocaleDateString(
    "en-SG",
    {
      day:"numeric",
      month:"short",
      year:"numeric"
    }
  );

}


/* =========================================================
   FOOD NEAR ME HTML
========================================================= */

function renderFoodNearby(){

  return `

    <button
      id="foodNearbyButton"
      class="food-nearby"
      type="button"
    >

      <div class="food-nearby-left">

        <div class="food-nearby-icon">
          🍴
        </div>

        <div>

          <div class="food-nearby-title">
            FOOD NEAR ME
          </div>

          <div
            id="foodNearbySubtitle"
            class="food-nearby-sub"
          >
            Tap to show your picks + restaurants around you
          </div>

        </div>

      </div>

      <div
        id="foodNearbyArrow"
        class="food-nearby-arrow"
      >
        ↓
      </div>

    </button>


    <div
      id="foodNearbyPanel"
      class="nearby-panel"
    >

      <div
        id="foodNearbyStatus"
        class="nearby-status"
      >
        Ready to find food around you.
      </div>

      <div id="foodNearbyResults"></div>

    </div>

  `;

}


/* =========================================================
   FOOD NEAR ME LOGIC
========================================================= */

let nearbyLoaded = false;
let nearbyLoading = false;


function nearbyDistanceMetres(
  lat1,
  lng1,
  lat2,
  lng2
){

  const toRad =
    value =>
      value * Math.PI / 180;

  const earth =
    6371000;

  const dLat =
    toRad(lat2-lat1);

  const dLng =
    toRad(lng2-lng1);

  const a =
    Math.sin(dLat/2) ** 2 +
    Math.cos(toRad(lat1)) *
    Math.cos(toRad(lat2)) *
    Math.sin(dLng/2) ** 2;

  return (
    earth *
    2 *
    Math.atan2(
      Math.sqrt(a),
      Math.sqrt(1-a)
    )
  );

}


function nearbyDistanceLabel(metres){

  if(!Number.isFinite(metres)){
    return "";
  }

  if(metres < 1000){

    return `${
      Math.max(
        10,
        Math.round(metres/10)*10
      )
    } m`;

  }

  return `${(metres/1000).toFixed(1)} km`;

}


function getCurrentPositionForFood(){

  return new Promise(
    (resolve,reject) => {

      if(!navigator.geolocation){

        reject(
          new Error(
            "Location is not supported by this browser."
          )
        );

        return;
      }


      navigator.geolocation.getCurrentPosition(
        resolve,
        reject,
        {
          enableHighAccuracy:true,
          timeout:12000,
          maximumAge:120000
        }
      );

    }
  );

}


function restaurantIsPick(row){

  return (
    row.is_pick === true ||
    row.pick === true ||
    row.status === "pick" ||
    row.status === "locked" ||
    row.status === "preferred"
  );

}


function restaurantCoordinates(row){

  const lat =
    Number(
      row.latitude ??
      row.lat
    );

  const lng =
    Number(
      row.longitude ??
      row.lng
    );

  if(
    Number.isFinite(lat) &&
    Number.isFinite(lng)
  ){
    return {lat,lng};
  }

  return null;

}


function savedRestaurantHTML(row){

  const distance =
    nearbyDistanceLabel(
      row.__distance
    );

  const rating =
    row.rating
      ? `Tabelog ${row.rating}`
      : "";

  const area =
    [
      row.area,
      row.city
    ]
    .filter(Boolean)
    .join(" · ");

  const meta =
    [
      distance,
      area,
      rating
    ]
    .filter(Boolean)
    .join(" · ");

  const map =
    row.maps_url ||
    mapURL(
      [
        row.name,
        row.area,
        row.city
      ]
      .filter(Boolean)
      .join(" ")
    );


  return `

    <div class="nearby-item">

      <div class="nearby-item-main">

        <div class="nearby-item-name">

          ${escapeHTML(row.name)}

          <span class="nearby-item-badge">
            ⭐ PICK
          </span>

        </div>

        <div class="nearby-item-meta">
          ${escapeHTML(meta)}
        </div>

      </div>

      <a
        class="nearby-item-map"
        href="${map}"
        target="_blank"
        rel="noopener noreferrer"
      >
        📍
      </a>

    </div>

  `;

}


function googleRestaurantHTML(
  place,
  userLat,
  userLng
){

  const data =
    window.normalizeGooglePlace(place);

  const metres =
    (
      Number.isFinite(data.latitude) &&
      Number.isFinite(data.longitude)
    )
      ?
      nearbyDistanceMetres(
        userLat,
        userLng,
        data.latitude,
        data.longitude
      )
      :
      NaN;

  const distance =
    nearbyDistanceLabel(metres);

  const area =
    [
      data.area,
      data.city
    ]
    .filter(Boolean)
    .join(" · ");

  const meta =
    [
      distance,
      area
    ]
    .filter(Boolean)
    .join(" · ");

  const map =
    data.maps_url ||
    mapURL(
      [
        data.name,
        data.address
      ]
      .filter(Boolean)
      .join(" ")
    );


  return `

    <div class="nearby-item">

      <div class="nearby-item-main">

        <div class="nearby-item-name">
          ${escapeHTML(data.name || "Restaurant")}
        </div>

        <div class="nearby-item-meta">
          ${escapeHTML(meta)}
        </div>

      </div>

      <a
        class="nearby-item-map"
        href="${map}"
        target="_blank"
        rel="noopener noreferrer"
      >
        📍
      </a>

    </div>

  `;

}


async function getSavedPicksNearby(
  userLat,
  userLng
){

  /*
    Picks and Eaten are trip-specific states stored in trip_restaurants.
    Restaurant details stay in restaurants.
  */

  const relationResult =
    await db
      .from("trip_restaurants")
      .select("*")
      .eq("trip_id",TRIP_ID)
      .eq("is_pick",true)
      .eq("is_eaten",false);


  if(relationResult.error){
    throw relationResult.error;
  }


  const relations =
    relationResult.data || [];


  const ids =
    [
      ...new Set(
        relations
          .map(row => Number(row.restaurant_id))
          .filter(Number.isFinite)
      )
    ];


  if(!ids.length){
    return [];
  }


  const restaurantResult =
    await db
      .from("restaurants")
      .select("*")
      .in("id",ids);


  if(restaurantResult.error){
    throw restaurantResult.error;
  }


  return (
    restaurantResult.data || []
  )
  .map(row => {

    const coords =
      restaurantCoordinates(row);

    if(!coords){
      return null;
    }

    return {
      ...row,

      __distance:
        nearbyDistanceMetres(
          userLat,
          userLng,
          coords.lat,
          coords.lng
        )
    };

  })
  .filter(Boolean)
  .filter(
    row =>
      row.__distance <= 3000
  )
  .sort(
    (a,b) =>
      a.__distance -
      b.__distance
  )
  .slice(0,3);

}

async function getGoogleRestaurantsNearby(
  userLat,
  userLng
){

  if(
    typeof window.getGooglePlaces !== "function" ||
    typeof window.normalizeGooglePlace !== "function"
  ){

    throw new Error(
      "google-maps.js is not available."
    );

  }


  const placesLibrary =
    await window.getGooglePlaces();

  const Place =
    placesLibrary.Place ||
    google.maps.places?.Place;


  if(
    !Place ||
    typeof Place.searchNearby !== "function"
  ){

    throw new Error(
      "Google Nearby Search is unavailable."
    );

  }


  const response =
    await Place.searchNearby({

      fields:[
        "id",
        "displayName",
        "formattedAddress",
        "addressComponents",
        "googleMapsURI",
        "location",
        "types"
      ],

      locationRestriction:{
        center:{
          lat:userLat,
          lng:userLng
        },
        radius:1500
      },

      includedPrimaryTypes:[
        "restaurant"
      ],

      maxResultCount:8,

      rankPreference:
        google.maps.places
          .SearchNearbyRankPreference
          .DISTANCE

    });


  return response.places || [];

}


function bindFoodNearby(){

  const button =
    document.getElementById(
      "foodNearbyButton"
    );

  if(!button){
    return;
  }


  button.onclick =
    async () => {

      const panel =
        document.getElementById(
          "foodNearbyPanel"
        );

      const arrow =
        document.getElementById(
          "foodNearbyArrow"
        );

      const opening =
        !panel.classList.contains("show");


      panel.classList.toggle(
        "show",
        opening
      );

      arrow.textContent =
        opening ? "↑" : "↓";


      if(
        opening &&
        !nearbyLoaded &&
        !nearbyLoading
      ){

        await loadNearbyFood();

      }

    };

}


async function loadNearbyFood(){

  const status =
    document.getElementById(
      "foodNearbyStatus"
    );

  const results =
    document.getElementById(
      "foodNearbyResults"
    );

  const subtitle =
    document.getElementById(
      "foodNearbySubtitle"
    );


  nearbyLoading = true;

  status.className =
    "nearby-status";

  status.textContent =
    "Getting your location…";

  results.innerHTML = "";


  try{

    const position =
      await getCurrentPositionForFood();

    const userLat =
      position.coords.latitude;

    const userLng =
      position.coords.longitude;


    status.textContent =
      "Finding your picks and restaurants nearby…";


    const settled =
      await Promise.allSettled([

        getSavedPicksNearby(
          userLat,
          userLng
        ),

        getGoogleRestaurantsNearby(
          userLat,
          userLng
        )

      ]);


    const picks =
      settled[0].status === "fulfilled"
        ? settled[0].value
        : [];


    const googlePlaces =
      settled[1].status === "fulfilled"
        ? settled[1].value
        : [];


    const pickNames =
      new Set(
        picks.map(
          row =>
            String(row.name || "")
              .trim()
              .toLowerCase()
        )
      );


    const more =
      googlePlaces
        .filter(place => {

          const data =
            window.normalizeGooglePlace(place);

          return !pickNames.has(
            String(data.name || "")
              .trim()
              .toLowerCase()
          );

        })
        .slice(0,4);


    let html = "";


    if(picks.length){

      html += `

        <div class="nearby-section">

          <div class="nearby-section-title">
            ⭐ YOUR PICKS NEARBY
          </div>

          ${
            picks
              .map(savedRestaurantHTML)
              .join("")
          }

        </div>

      `;

    }


    html += `

      <div class="nearby-section">

        <div class="nearby-section-title">
          🍽 MORE FOOD AROUND YOU
        </div>

        ${
          more.length

            ?

          more
            .map(
              place =>
                googleRestaurantHTML(
                  place,
                  userLat,
                  userLng
                )
            )
            .join("")

            :

          `
            <div class="nearby-status">
              No additional restaurants were returned nearby.
            </div>
          `
        }

      </div>


      <a
        class="nearby-more"
        href="food.html?trip=${TRIP_ID}&nearby=1"
      >
        SEE MORE FOOD →
      </a>

    `;


    results.innerHTML =
      html;


    if(!picks.length){

      status.textContent =
        "No saved Picks with coordinates were found close by yet. Showing nearby restaurants.";

    }
    else{

      status.textContent =
        "Using your current location.";

    }


    subtitle.textContent =
      "Your picks first + more restaurants around you";


    nearbyLoaded = true;

  }
  catch(error){

    console.error(
      "Food Near Me error:",
      error
    );


    let message =
      error.message ||
      "Couldn't find nearby food.";


    if(error.code === 1){

      message =
        "Location permission was not allowed. Allow location access and try again.";

    }


    status.textContent =
      message;

    status.className =
      "nearby-status error";

  }
  finally{

    nearbyLoading = false;

  }

}


/* =========================================================
   TRIP ACCESS FALLBACK
   Only used if index.html is opened without ?trip=
========================================================= */

async function getAccessibleTrips(){

  const { data, error } = await db.auth.getUser();

  if(error) throw error;

  const user = data?.user;

  if(!user){
    throw new Error("You are not signed in.");
  }

  const [ownedResult, memberResult] = await Promise.all([
    db.from("trips").select("*").eq("owner_id", user.id),
    db.from("trip_members").select("trip_id").eq("user_id", user.id)
  ]);

  if(ownedResult.error) throw ownedResult.error;
  if(memberResult.error) throw memberResult.error;

  const tripMap = new Map();

  (ownedResult.data || []).forEach(trip => {
    tripMap.set(Number(trip.id), trip);
  });

  const sharedIds = [
    ...new Set(
      (memberResult.data || [])
        .map(row => Number(row.trip_id))
        .filter(Number.isFinite)
    )
  ];

  if(sharedIds.length){

    const sharedResult = await db
      .from("trips")
      .select("*")
      .in("id", sharedIds);

    if(sharedResult.error) throw sharedResult.error;

    (sharedResult.data || []).forEach(trip => {
      tripMap.set(Number(trip.id), trip);
    });

  }

  return [...tripMap.values()].sort((a,b) =>
    String(a.start_date || "").localeCompare(String(b.start_date || ""))
  );
}


/* =========================================================
   LOAD TRIP
========================================================= */

async function loadTripFromDatabase(){

  const preview =
    document.getElementById(
      "dayPreview"
    );


  try{

    /* -----------------------------------------------
       Resolve trip if ?trip= is missing
    ----------------------------------------------- */

    if(!TRIP_ID){

      const accessible =
        await getAccessibleTrips();


      if(!accessible.length){

        throw new Error(
          "No trips are available for this account."
        );

      }


      TRIP_ID =
        Number(accessible[0].id);


      history.replaceState(
        {},
        "",
        `index.html?trip=${TRIP_ID}`
      );

    }




    /* -----------------------------------------------
       Load trip + schedule
    ----------------------------------------------- */

    const [
      tripResult,
      scheduleResult,
      restaurantStateResult
    ] =
      await Promise.all([

        db
          .from("trips")
          .select("*")
          .eq("id",TRIP_ID)
          .single(),

        db
          .from("schedule")
          .select("*")
          .eq("trip_id",TRIP_ID)
          .order(
            "schedule_date",
            {ascending:true}
          )
          .order(
            "sort_order",
            {ascending:true}
          ),

        db
          .from("trip_restaurants")
          .select("restaurant_id,is_eaten,eaten_at")
          .eq("trip_id",TRIP_ID)

      ]);


    if(tripResult.error){
      throw tripResult.error;
    }

    if(scheduleResult.error){
      throw scheduleResult.error;
    }

    if(restaurantStateResult.error){
      throw restaurantStateResult.error;
    }


    const trip =
      tripResult.data;

    const rows =
      scheduleResult.data || [];


    const restaurantState =
      new Map(
        (restaurantStateResult.data || [])
          .map(row => [
            Number(row.restaurant_id),
            row
          ])
      );


    function restaurantEaten(row){

      if(!row.restaurant_id){
        return false;
      }

      return Boolean(
        restaurantState
          .get(Number(row.restaurant_id))
          ?.is_eaten
      );

    }


    async function toggleRestaurantEaten(row){

      if(!row.restaurant_id){
        return;
      }

      const id =
        Number(row.restaurant_id);

      const current =
        restaurantState.get(id);

      const value =
        !Boolean(current?.is_eaten);


      const result =
        await db
          .from("trip_restaurants")
          .update({
            is_eaten:value,
            eaten_at:
              value
                ? new Date().toISOString()
                : null
          })
          .eq("trip_id",TRIP_ID)
          .eq("restaurant_id",id)
          .select("restaurant_id,is_eaten,eaten_at")
          .single();


      if(result.error){
        throw result.error;
      }


      restaurantState.set(
        id,
        result.data
      );

    }


    /* -----------------------------------------------
       Header
    ----------------------------------------------- */

    const start =
      trip.start_date
        ? new Date(
            trip.start_date +
            "T00:00:00"
          )
        : null;


    const end =
      trip.end_date
        ? new Date(
            trip.end_date +
            "T00:00:00"
          )
        : null;


    const monthYear =
      start
        ? start
            .toLocaleDateString(
              "en-SG",
              {
                month:"long",
                year:"numeric"
              }
            )
            .toUpperCase()
        : "";


    document
      .querySelector(".eyebrow")
      .textContent =
        [
          trip.country,
          monthYear
        ]
        .filter(Boolean)
        .join(" · ");


    document
      .querySelector("h1")
      .textContent =
        trip.name || "My Trip";


    document.title =
      trip.name || "My Trip";


    const fmt =
      date =>
        date
          ? date.toLocaleDateString(
              "en-SG",
              {
                day:"numeric",
                month:"long",
                year:"numeric"
              }
            )
          : "";


    document
      .querySelector(".sub")
      .textContent =
        start && end
          ? `${fmt(start)} – ${fmt(end)}`
          : (trip.description || "");


    /* -----------------------------------------------
       Group schedule
    ----------------------------------------------- */

    const byDate = {};


    rows.forEach(row => {

      if(!row.schedule_date){
        return;
      }

      (
        byDate[row.schedule_date] ||= []
      ).push(row);

    });


    const dates =
      Object.keys(byDate).sort();


    const tripline =
      document.querySelector(
        ".tripline"
      );


    if(tripline){

      if(trip.description){

        tripline.innerHTML =
          `<strong>${escapeHTML(trip.description)}</strong>`;

      }
      else{

        tripline.innerHTML =
          `<strong>${escapeHTML(trip.country || "TRIP")}</strong> · ${dates.length} planned day${dates.length === 1 ? "" : "s"}`;

      }

    }


    /* -----------------------------------------------
       No schedule
    ----------------------------------------------- */

    if(!dates.length){

      preview.innerHTML = `

        <div class="day-card">

          <div class="day-label">
            TRIP PREVIEW
          </div>

          <h2>
            No plans added yet
          </h2>

          <div class="day-area">
            ${escapeHTML(trip.country || "")}
          </div>

          <a
            class="full-plan"
            href="schedule.html?trip=${TRIP_ID}"
          >
            OPEN PLAN →
          </a>

          ${renderFoodNearby()}

        </div>

      `;


      bindFoodNearby();

      return;

    }


    /* -----------------------------------------------
       Pick initial date
    ----------------------------------------------- */

    const now =
      new Date();

    const todayISO =
      [
        now.getFullYear(),
        String(now.getMonth()+1).padStart(2,"0"),
        String(now.getDate()).padStart(2,"0")
      ].join("-");


    let selectedDate;


    if(dates.includes(todayISO)){

      selectedDate =
        todayISO;

    }
    else if(todayISO < dates[0]){

      selectedDate =
        dates[0];

    }
    else if(
      todayISO >
      dates[dates.length-1]
    ){

      selectedDate =
        dates[dates.length-1];

    }
    else{

      selectedDate =
        dates.find(
          date =>
            date > todayISO
        ) || dates[0];

    }


    /* -----------------------------------------------
       Time formatter
    ----------------------------------------------- */

    function timeText(row){

      if(row.time_label){
        return row.time_label;
      }


      const pretty =
        value => {

          if(!value){
            return "";
          }

          const [
            hh,
            mm
          ] =
            value
              .split(":")
              .map(Number);


          const date =
            new Date(
              2000,
              0,
              1,
              hh,
              mm
            );


          return date
            .toLocaleTimeString(
              "en-SG",
              {
                hour:"numeric",
                minute:"2-digit"
              }
            );

        };


      if(
        row.start_time &&
        row.end_time
      ){

        return (
          pretty(row.start_time) +
          " – " +
          pretty(row.end_time)
        );

      }


      if(row.start_time){

        return pretty(
          row.start_time
        );

      }


      return "";

    }


    function mapFor(row){

      if(row.maps_url){
        return row.maps_url;
      }


      const query =
        row.location_name ||
        row.address ||
        row.title;


      return query
        ? mapURL(query)
        : "";

    }


    function dayTitle(dayRows){

      const meaningful =
        dayRows.filter(row => {

          const type =
            String(
              row.item_type || ""
            ).toLowerCase();

          return ![
            "transport",
            "hotel"
          ].includes(type);

        });


      const source =
        meaningful.length
          ? meaningful
          : dayRows;


      const names =
        source
          .slice(0,2)
          .map(row =>
            String(row.title || "")
              .replace(
                /^[^\p{L}\p{N}]+/u,
                ""
              )
              .trim()
          )
          .filter(Boolean);


      return (
        names.join(" + ") ||
        "Trip Day"
      );

    }


    function dayArea(dayRows){

      const locationRow =
        dayRows.find(
          row =>
            row.location_name
        );


      if(locationRow?.location_name){

        return String(
          locationRow.location_name
        ).toUpperCase();

      }


      return String(
        trip.country || "TRIP"
      ).toUpperCase();

    }


    /* -----------------------------------------------
       Render selected day
    ----------------------------------------------- */

    function renderDynamic(){

      const dayRows =
        byDate[selectedDate] || [];


      const date =
        new Date(
          selectedDate +
          "T00:00:00"
        );


      const weekday =
        date
          .toLocaleDateString(
            "en-SG",
            {weekday:"long"}
          )
          .toUpperCase();


      const dayNum =
        date.getDate();


      const month =
        date
          .toLocaleDateString(
            "en-SG",
            {month:"short"}
          )
          .toUpperCase();


      const dateButtons =
        dates.map(value => {

          const d =
            new Date(
              value +
              "T00:00:00"
            );


          return `

            <button
              class="date-btn ${
                value === selectedDate
                  ? "active"
                  : ""
              }"
              data-date="${value}"
              type="button"
            >

              <span class="num">
                ${d.getDate()}
              </span>

              <span class="dow">
                ${
                  d
                    .toLocaleDateString(
                      "en-SG",
                      {weekday:"short"}
                    )
                    .toUpperCase()
                }
              </span>

            </button>

          `;

        }).join("");


      const blocks =
        dayRows.map(row => {

          const map =
            mapFor(row);

          const eaten =
            restaurantEaten(row);

          const canMarkEaten =
            Boolean(row.restaurant_id);


          return `

            <div class="block ${eaten ? "eaten" : ""}">

              <div class="block-head">

                <div class="block-time">
                  ${escapeHTML(timeText(row))}
                </div>

                <div class="block-main">

                  <div class="block-name">
                    ${escapeHTML(row.title || "")}
                  </div>

                  ${
                    row.notes
                      ?
                    `
                      <div class="block-note">
                        ${escapeHTML(row.notes)}
                      </div>
                    `
                      :
                    ""
                  }

                </div>

                ${
                  canMarkEaten
                    ?
                  `
                    <button
                      class="block-eaten ${eaten ? "done" : ""}"
                      type="button"
                      data-eaten-restaurant="${Number(row.restaurant_id)}"
                    >
                      ${eaten ? "✓ EATEN" : "EATEN"}
                    </button>
                  `
                    :
                  ""
                }

                ${
                  map
                    ?
                  `
                    <a
                      class="block-map"
                      href="${map}"
                      target="_blank"
                      rel="noopener noreferrer"
                    >
                      📍
                    </a>
                  `
                    :
                  ""
                }

              </div>

            </div>

          `;

        }).join("");


      preview.innerHTML = `

        <div class="day-card">

          <div class="day-top">

            <div class="day-label">
              TRIP PREVIEW
            </div>

            <div class="day-date">
              ${weekday} · ${dayNum} ${month}
            </div>

          </div>

          <h2>
            ${escapeHTML(dayTitle(dayRows))}
          </h2>

          <div class="day-area">
            ${escapeHTML(dayArea(dayRows))}
          </div>

          <div class="date-scroll">
            ${dateButtons}
          </div>

          <div class="plan-title">
            DAY AT A GLANCE
          </div>

          ${blocks}

          <a
            class="full-plan"
            href="schedule.html?trip=${TRIP_ID}#${selectedDate}"
          >
            FULL PLAN →
          </a>

          ${renderFoodNearby()}

        </div>

      `;


      document
        .querySelectorAll(
          "[data-date]"
        )
        .forEach(button => {

          button.onclick =
            () => {

              selectedDate =
                button.dataset.date;

              nearbyLoaded =
                false;

              renderDynamic();

            };

        });


      document
        .querySelectorAll(
          "[data-eaten-restaurant]"
        )
        .forEach(button => {

          button.onclick =
            async () => {

              const restaurantId =
                Number(
                  button.dataset.eatenRestaurant
                );

              const row =
                dayRows.find(
                  item =>
                    Number(item.restaurant_id) === restaurantId
                );


              if(!row){
                return;
              }


              button.disabled = true;


              try{

                await toggleRestaurantEaten(row);

                nearbyLoaded = false;

                renderDynamic();

              }
              catch(error){

                console.error(
                  "Eaten update error:",
                  error
                );

                alert(
                  error.message ||
                  "Couldn't update Eaten."
                );

                button.disabled = false;

              }

            };

        });


      bindFoodNearby();

    }


    renderDynamic();

  }
  catch(error){

    console.error(
      "Index load error:",
      error
    );


    preview.innerHTML = `

      <div class="day-card">

        <div class="day-label">
          TRIP PREVIEW
        </div>

        <h2>
          Could not load this trip
        </h2>

        <div class="day-area">
          ${escapeHTML(error.message || "Supabase error")}
        </div>

      </div>

    `;

  }

}

loadTripFromDatabase();
