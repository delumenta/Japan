<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070c10">

<title>My Trip</title>

<style>
:root{
  --bg:#070c10;
  --panel:#10161c;
  --panel2:#151c23;
  --line:#29323b;
  --text:#f5f5f3;
  --muted:#aeb5bc;
  --muted-blue:#91a5b3;
  --red:#c96f68;
  --blue:#5c9dff;
  --green:#67c587;
  --orange:#f4a34d;
  --gold:#e3b85c;
}

*{box-sizing:border-box}

html{scroll-behavior:smooth}

body{
  margin:0;
  min-height:100vh;
  color:var(--text);
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  background:
    radial-gradient(circle at 50% -15%,#17212a 0%,transparent 38%),
    var(--bg);
}

button{font:inherit}

main{
  max-width:760px;
  margin:auto;
  padding:20px 14px 94px;
}

/* =========================================================
   HEADER
========================================================= */

.eyebrow{
  color:var(--red);
  font-size:10px;
  font-weight:900;
  letter-spacing:.16em;
  text-transform:uppercase;
}

h1{
  font-family:Georgia,"Times New Roman",serif;
  font-size:31px;
  line-height:1.05;
  margin:7px 0 4px;
  letter-spacing:-.03em;
}

.sub{
  font-size:11px;
  color:var(--muted);
}

/* =========================================================
   DAY CARD
========================================================= */

.day-card{
  margin-top:18px;
  border:1px solid rgba(201,111,104,.38);
  border-radius:20px;
  padding:14px;
  background:
    linear-gradient(
      145deg,
      rgba(201,111,104,.08),
      #10161c 52%
    );
}

.day-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

.day-label{
  color:var(--red);
  font-size:8px;
  font-weight:900;
  letter-spacing:.13em;
}

.day-date{
  color:var(--muted);
  font-size:8px;
  font-weight:850;
}

.day-card h2{
  margin:6px 0 2px;
  font-family:Georgia,"Times New Roman",serif;
  font-size:21px;
}

.day-area{
  color:#9ca9b1;
  font-size:9px;
}

/* =========================================================
   DATE SCROLLER
========================================================= */

.date-scroll{
  display:flex;
  gap:5px;
  overflow-x:auto;
  margin-top:12px;
  padding-bottom:3px;
  scrollbar-width:none;
}

.date-scroll::-webkit-scrollbar{display:none}

.date-btn{
  flex:0 0 auto;
  width:42px;
  min-height:43px;
  border:1px solid var(--line);
  border-radius:10px;
  background:#11181e;
  color:var(--muted);
  cursor:pointer;
}

.date-btn .num{
  display:block;
  color:#e7e9ea;
  font-size:11px;
  font-weight:900;
}

.date-btn .dow{
  display:block;
  margin-top:1px;
  font-size:6px;
  font-weight:900;
}

.date-btn.active{
  border-color:rgba(201,111,104,.55);
  background:rgba(201,111,104,.12);
  color:#f1cbc8;
}

.date-btn.active .num{color:#fff}

/* =========================================================
   BLOCKS
========================================================= */

.plan-title{
  margin:14px 2px 6px;
  color:var(--muted-blue);
  font-size:7px;
  font-weight:900;
  letter-spacing:.13em;
}

.block{
  margin-bottom:6px;
  border:1px solid var(--line);
  border-radius:12px;
  background:linear-gradient(145deg,#141c22,#0d1318);
  overflow:hidden;
}

.block-head{
  width:100%;
  min-height:52px;
  display:flex;
  align-items:center;
  gap:8px;
  padding:9px 10px;
}

.block-time{
  flex:0 0 76px;
  color:#a6b7c2;
  font-size:7px;
  font-weight:900;
  line-height:1.4;
}

.block-main{
  flex:1;
  min-width:0;
}

.block-name{
  color:#f3f3f1;
  font-size:9px;
  font-weight:900;
  line-height:1.3;
}

.block-note{
  margin-top:2px;
  color:#7f8b93;
  font-size:7px;
  line-height:1.4;
}

.block-map{
  flex:0 0 31px;
  width:31px;
  height:31px;
  display:flex;
  align-items:center;
  justify-content:center;
  border:1px solid rgba(92,157,255,.18);
  border-radius:8px;
  background:rgba(92,157,255,.05);
  text-decoration:none;
  font-size:12px;
}

/* =========================================================
   FULL PLAN
========================================================= */

.full-plan{
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:38px;
  margin-top:10px;
  border:1px solid rgba(201,111,104,.32);
  border-radius:10px;
  background:rgba(201,111,104,.08);
  color:#f1cfcc;
  text-decoration:none;
  font-size:8px;
  font-weight:900;
}

/* =========================================================
   FOOD NEAR ME
========================================================= */

.food-nearby{
  width:100%;
  min-height:64px;
  margin-top:10px;
  padding:11px 14px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  border:1px solid rgba(103,197,135,.65);
  border-radius:12px;
  background:
    linear-gradient(
      135deg,
      rgba(103,197,135,.12),
      rgba(103,197,135,.035)
    );
  color:#d7f5df;
  cursor:pointer;
}

.food-nearby-left{
  display:flex;
  align-items:center;
  gap:11px;
  min-width:0;
  text-align:left;
}

.food-nearby-icon{
  flex:0 0 auto;
  color:var(--green);
  font-size:21px;
}

.food-nearby-title{
  color:#9de6b2;
  font-size:9px;
  font-weight:900;
}

.food-nearby-sub{
  margin-top:3px;
  color:#77aa86;
  font-size:6.5px;
  line-height:1.35;
}

.food-nearby-arrow{
  color:var(--green);
  font-size:19px;
}

.nearby-panel{
  display:none;
  margin-top:8px;
  padding:10px;
  border:1px solid rgba(103,197,135,.28);
  border-radius:12px;
  background:rgba(103,197,135,.035);
}

.nearby-panel.show{display:block}

.nearby-status{
  color:#88aa93;
  font-size:7px;
  line-height:1.45;
}

.nearby-status.error{color:#ffc5c1}

.nearby-section{margin-top:10px}

.nearby-section-title{
  margin-bottom:5px;
  color:#9de6b2;
  font-size:7px;
  font-weight:900;
  letter-spacing:.08em;
}

.nearby-item{
  display:flex;
  align-items:center;
  gap:8px;
  min-height:45px;
  padding:7px 4px;
  border-top:1px solid rgba(255,255,255,.055);
}

.nearby-item-main{
  flex:1;
  min-width:0;
}

.nearby-item-name{
  color:#eef2ef;
  font-size:8px;
  font-weight:900;
  line-height:1.3;
}

.nearby-item-meta{
  margin-top:2px;
  color:#7f9487;
  font-size:6.5px;
  line-height:1.35;
}

.nearby-item-badge{
  display:inline-block;
  margin-left:4px;
  padding:1px 4px;
  border:1px solid rgba(227,184,92,.25);
  border-radius:999px;
  color:var(--gold);
  font-size:5.5px;
}

.nearby-item-map{
  flex:0 0 30px;
  width:30px;
  height:30px;
  display:flex;
  align-items:center;
  justify-content:center;
  border:1px solid rgba(92,157,255,.18);
  border-radius:8px;
  background:rgba(92,157,255,.05);
  color:#fff;
  text-decoration:none;
  font-size:11px;
}

.nearby-more{
  min-height:35px;
  margin-top:9px;
  display:flex;
  align-items:center;
  justify-content:center;
  border:1px solid rgba(103,197,135,.22);
  border-radius:9px;
  background:rgba(103,197,135,.06);
  color:#a9e8bb;
  text-decoration:none;
  font-size:7px;
  font-weight:900;
}

/* =========================================================
   TRIPLINE
========================================================= */

.tripline{
  margin-top:14px;
  padding:9px;
  border:1px solid var(--line);
  border-radius:11px;
  color:#75828a;
  background:rgba(255,255,255,.02);
  text-align:center;
  font-size:7px;
  line-height:1.5;
}

.tripline strong{color:#dce0e2}

/* =========================================================
   SHEETS
========================================================= */

.sheet-backdrop{
  position:fixed;
  inset:0;
  z-index:150;
  display:none;
  align-items:flex-end;
  background:rgba(0,0,0,.68);
  backdrop-filter:blur(4px);
}

.sheet-backdrop.open{display:flex}

.sheet{
  width:100%;
  max-width:760px;
  max-height:82vh;
  overflow-y:auto;
  margin:0 auto;
  padding:8px 13px calc(18px + env(safe-area-inset-bottom));
  border:1px solid var(--line);
  border-radius:20px 20px 0 0;
  background:#0d1318;
}

.sheet-handle{
  width:38px;
  height:4px;
  margin:2px auto 13px;
  border-radius:999px;
  background:#39454d;
}

.sheet-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:9px;
}

.sheet-title{
  font-family:Georgia,"Times New Roman",serif;
  font-size:19px;
}

.sheet-close{
  width:32px;
  height:32px;
  border:1px solid var(--line);
  border-radius:8px;
  background:#151c22;
  color:#fff;
  cursor:pointer;
}

.more-link{
  width:100%;
  min-height:58px;
  display:flex;
  align-items:center;
  gap:10px;
  padding:9px 10px;
  margin-bottom:6px;
  border:1px solid var(--line);
  border-radius:11px;
  background:#11181e;
  color:#fff;
  text-decoration:none;
  text-align:left;
  cursor:pointer;
}

.more-link-icon{
  flex:0 0 31px;
  font-size:18px;
  text-align:center;
}

.more-link-main{flex:1}

.more-link-title{
  font-size:9px;
  font-weight:900;
}

.more-link-sub{
  margin-top:2px;
  color:#7f8b93;
  font-size:6.5px;
}

.more-link-arrow{
  color:#8d9aa2;
  font-size:12px;
}

/* =========================================================
   TRIP SWITCHER
========================================================= */

.trip-list{
  display:flex;
  flex-direction:column;
  gap:7px;
}

.trip-card{
  width:100%;
  min-height:70px;
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px;
  border:1px solid var(--line);
  border-radius:12px;
  background:#11181e;
  color:#fff;
  text-decoration:none;
}

.trip-card.current{
  border-color:rgba(201,111,104,.55);
  background:rgba(201,111,104,.09);
}

.trip-icon{
  flex:0 0 36px;
  font-size:21px;
  text-align:center;
}

.trip-main{
  flex:1;
  min-width:0;
}

.trip-name{
  font-size:9px;
  font-weight:900;
  line-height:1.3;
}

.trip-meta{
  margin-top:3px;
  color:#87949c;
  font-size:6.5px;
  line-height:1.4;
}

.trip-role{
  display:inline-block;
  margin-top:4px;
  padding:2px 5px;
  border:1px solid rgba(92,157,255,.22);
  border-radius:999px;
  color:#8ab9ff;
  font-size:5.5px;
  font-weight:900;
}

.trip-card.current .trip-role{
  border-color:rgba(201,111,104,.28);
  color:#e7aaa5;
}

.trip-arrow{
  color:#7f8b93;
  font-size:13px;
}

.trip-message{
  padding:18px 10px;
  color:#7f8b93;
  font-size:8px;
  text-align:center;
  line-height:1.5;
}

.trip-message.error{
  color:#ffc5c1;
}

/* =========================================================
   BOTTOM NAV — SAME 5 BUTTON FOOTER
========================================================= */

.bottom-nav{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  z-index:80;
  display:grid;
  grid-template-columns:repeat(5,1fr);
  padding:7px 8px calc(7px + env(safe-area-inset-bottom));
  border-top:1px solid var(--line);
  background:rgba(7,12,16,.97);
  backdrop-filter:blur(18px);
}

.bottom-nav a,
.bottom-nav button{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:2px;
  min-height:47px;
  border:0;
  border-radius:11px;
  background:transparent;
  color:var(--muted);
  text-decoration:none;
  font-size:8px;
  font-weight:800;
  cursor:pointer;
}

.nav-icon{font-size:16px}

.bottom-nav .active{
  color:#fff;
  border:1px solid rgba(201,111,104,.25);
  background:rgba(201,111,104,.10);
}

@media(max-width:360px){
  .block-time{flex-basis:68px}
}

@media(min-width:700px){
  .bottom-nav{
    left:50%;
    right:auto;
    width:min(820px,100%);
    transform:translateX(-50%);
    border-left:1px solid var(--line);
    border-right:1px solid var(--line);
    border-radius:16px 16px 0 0;
  }
}
</style>
</head>

<body>

<main>

  <div class="eyebrow">LOADING TRIP…</div>

  <div class="sub">Loading trip details…</div>

  <section id="dayPreview"></section>

  <div class="tripline">
    <strong>Loading trip…</strong>
  </div>

</main>


<!-- =======================================================
     MORE SHEET
======================================================= -->

<div id="moreBackdrop" class="sheet-backdrop">

  <div class="sheet">

        <div class="more-link-title">
          Profile & Sharing

<!-- =======================================================
     TRIP SWITCHER SHEET
======================================================= -->

<div id="tripBackdrop" class="sheet-backdrop">

  <div class="sheet">

    <div class="sheet-handle"></div>

    <div class="sheet-head">

      <div class="sheet-title">
        Switch Trip
      </div>

        id="closeTrips"

      >
        ✕
      </button>

      id="tripList"

    >

        Loading your trips…

<!-- =======================================================
     BOTTOM NAV
======================================================= -->

<nav class="bottom-nav">

  <a
    id="navHome"
    class="active"
  >
    <span class="nav-icon">🏠</span>
    <span>HOME</span>
  </a>

  <a id="navPlan">
    <span class="nav-icon">📅</span>
    <span>PLAN</span>
  </a>

  <a id="navFood">
    <span class="nav-icon">🍽️</span>
    <span>FOOD</span>
  </a>

  <a id="navHub">
    <span class="nav-icon">⭐</span>
    <span>HUB</span>
  </a>

  <button
    id="navMore"
    type="button"
  >
    <span class="nav-icon">⋯</span>
    <span>MORE</span>
  </button>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script src="google-maps.js"></script>

<script>

/* =========================================================
   CONFIG
========================================================= */

const params =
  new URLSearchParams(window.location.search);

const REQUESTED_TRIP_ID =
  Number(params.get("trip")) || null;

let TRIP_ID =
  REQUESTED_TRIP_ID;


/* =========================================================
   HELPERS
========================================================= */

function mapURL(query){

  return (
    "https://www.google.com/maps/search/?api=1&query=" +
    encodeURIComponent(query)
  );

}


function escapeHTML(value){

  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


function formatTripDate(value){

  if(!value){
    return "";
  }

  const date =
    new Date(value + "T00:00:00");

  return date.toLocaleDateString(
    "en-SG",
    {
      day:"numeric",
      month:"short",
      year:"numeric"
    }
  );

}


function tripIcon(country){

  const value =
    String(country || "").toLowerCase();

  if(value.includes("japan")) return "🇯🇵";
  if(value.includes("taiwan")) return "🇹🇼";
  if(value.includes("singapore")) return "🇸🇬";
  if(value.includes("korea")) return "🇰🇷";
  if(value.includes("china")) return "🇨🇳";
  if(value.includes("thailand")) return "🇹🇭";
  if(value.includes("malaysia")) return "🇲🇾";
  if(value.includes("indonesia")) return "🇮🇩";

  return "✈️";

}


/* =========================================================
   NAV LINKS
========================================================= */

function updateLinks(){

  const suffix =
    TRIP_ID
      ? `?trip=${TRIP_ID}`
      : "";

  document.getElementById("navHome").href =
    `index.html${suffix}`;

  document.getElementById("navPlan").href =
    `schedule.html${suffix}`;

  document.getElementById("navFood").href =
    `food.html${suffix}`;

  document.getElementById("navHub").href =
    `bookings.html${suffix}`;

  document.getElementById("profileLink").href =
    `profile.html${suffix}`;

  document.getElementById("placesLink").href =
    `places.html${suffix}`;

}


/* =========================================================
   MORE SHEET
========================================================= */

const moreBackdrop =
  document.getElementById("moreBackdrop");

const tripBackdrop =
  document.getElementById("tripBackdrop");


function openMore(){

  moreBackdrop.classList.add("open");

}


function closeMore(){

  moreBackdrop.classList.remove("open");

}


function openTrips(){

  closeMore();

  tripBackdrop.classList.add("open");

  loadMyTrips();

}


function closeTrips(){

  tripBackdrop.classList.remove("open");

}


document.getElementById("navMore").onclick =
  openMore;

document.getElementById("closeMore").onclick =
  closeMore;

document.getElementById("switchTripButton").onclick =
  openTrips;

document.getElementById("closeTrips").onclick =
  closeTrips;


moreBackdrop.onclick =
  event => {

    if(event.target === moreBackdrop){
      closeMore();
    }

  };


tripBackdrop.onclick =
  event => {

    if(event.target === tripBackdrop){
      closeTrips();
    }

  };


/* =========================================================
   GET LOGGED-IN USER
========================================================= */

async function getCurrentUser(){

  const {
    data,
    error
  } =
    await db.auth.getUser();

  if(error){
    throw error;
  }

  return data?.user || null;

}


/* =========================================================
   GET ACCESSIBLE TRIPS
========================================================= */

async function getAccessibleTrips(){

  const user =
    await getCurrentUser();

  if(!user){
    throw new Error("You are not signed in.");
  }


  /* Trips owned by this user */

  const ownedResult =
    await db
      .from("trips")
      .select("*")
      .eq("owner_id",user.id);

  if(ownedResult.error){
    throw ownedResult.error;
  }


  /* Membership rows for this user */

  const memberResult =
    await db
      .from("trip_members")
      .select("trip_id")
      .eq("user_id",user.id);

  if(memberResult.error){
    throw memberResult.error;
  }


  const sharedIds =
    [
      ...new Set(
        (memberResult.data || [])
          .map(row => Number(row.trip_id))
          .filter(Number.isFinite)
      )
    ];


  let sharedTrips = [];


  if(sharedIds.length){

    const sharedResult =
      await db
        .from("trips")
        .select("*")
        .in("id",sharedIds);

    if(sharedResult.error){
      throw sharedResult.error;
    }

    sharedTrips =
      sharedResult.data || [];

  }


  /* Combine without duplicates */

  const map =
    new Map();


  (ownedResult.data || [])
    .forEach(trip => {

      map.set(
        Number(trip.id),
        {
          ...trip,
          __role:"owner"
        }
      );

    });


  sharedTrips.forEach(trip => {

    const id =
      Number(trip.id);

    if(!map.has(id)){

      map.set(
        id,
        {
          ...trip,
          __role:"member"
        }
      );

    }

  });


  return [...map.values()]
    .sort((a,b) => {

      return String(a.start_date || "")
        .localeCompare(
          String(b.start_date || "")
        );

    });

}

/* =========================================================
   FOOD NEAR ME LOGIC
========================================================= */

let nearbyLoaded = false;
let nearbyLoading = false;


function nearbyDistanceMetres(
  lat1,
  lng1,
  lat2,
  lng2
){

  const toRad =
    value =>
      value * Math.PI / 180;

  const earth =
    6371000;

  const dLat =
    toRad(lat2-lat1);

  const dLng =
    toRad(lng2-lng1);

  const a =
    Math.sin(dLat/2) ** 2 +
    Math.cos(toRad(lat1)) *
    Math.cos(toRad(lat2)) *
    Math.sin(dLng/2) ** 2;

  return (
    earth *
    2 *
    Math.atan2(
      Math.sqrt(a),
      Math.sqrt(1-a)
    )
  );

}


function nearbyDistanceLabel(metres){

  if(!Number.isFinite(metres)){
    return "";
  }

  if(metres < 1000){

    return `${
      Math.max(
        10,
        Math.round(metres/10)*10
      )
    } m`;

  }

  return `${(metres/1000).toFixed(1)} km`;

}


function getCurrentPositionForFood(){

  return new Promise(
    (resolve,reject) => {

      if(!navigator.geolocation){

        reject(
          new Error(
            "Location is not supported by this browser."
          )
        );

        return;
      }


      navigator.geolocation.getCurrentPosition(
        resolve,
        reject,
        {
          enableHighAccuracy:true,
          timeout:12000,
          maximumAge:120000
        }
      );

    }
  );

}


function restaurantIsPick(row){

  return (
    row.is_pick === true ||
    row.pick === true ||
    row.status === "pick" ||
    row.status === "locked" ||
    row.status === "preferred"
  );

}


function restaurantCoordinates(row){

  const lat =
    Number(
      row.latitude ??
      row.lat
    );

  const lng =
    Number(
      row.longitude ??
      row.lng
    );

  if(
    Number.isFinite(lat) &&
    Number.isFinite(lng)
  ){
    return {lat,lng};
  }

  return null;

}


function savedRestaurantHTML(row){

  const distance =
    nearbyDistanceLabel(
      row.__distance
    );

  const rating =
    row.rating
      ? `Tabelog ${row.rating}`
      : "";

  const area =
    [
      row.area,
      row.city
    ]
    .filter(Boolean)
    .join(" · ");

  const meta =
    [
      distance,
      area,
      rating
    ]
    .filter(Boolean)
    .join(" · ");

  const map =
    row.maps_url ||
    mapURL(
      [
        row.name,
        row.area,
        row.city,
        "Japan"
      ]
      .filter(Boolean)
      .join(" ")
    );


  return `

    <div class="nearby-item">

      <div class="nearby-item-main">

        <div class="nearby-item-name">

          ${escapeHTML(row.name)}

          <span class="nearby-item-badge">
            ⭐ PICK
          </span>

        </div>

        <div class="nearby-item-meta">
          ${escapeHTML(meta)}
        </div>

      </div>

      <a
        class="nearby-item-map"
        href="${map}"
        target="_blank"
        rel="noopener noreferrer"
      >
        📍
      </a>

    </div>

  `;

}


function googleRestaurantHTML(
  place,
  userLat,
  userLng
){

  const data =
    window.normalizeGooglePlace(place);

  const metres =
    (
      Number.isFinite(data.latitude) &&
      Number.isFinite(data.longitude)
    )
      ?
      nearbyDistanceMetres(
        userLat,
        userLng,
        data.latitude,
        data.longitude
      )
      :
      NaN;

  const distance =
    nearbyDistanceLabel(metres);

  const area =
    [
      data.area,
      data.city
    ]
    .filter(Boolean)
    .join(" · ");

  const meta =
    [
      distance,
      area
    ]
    .filter(Boolean)
    .join(" · ");

  const map =
    data.maps_url ||
    mapURL(
      [
        data.name,
        data.address
      ]
      .filter(Boolean)
      .join(" ")
    );


  return `

    <div class="nearby-item">

      <div class="nearby-item-main">

        <div class="nearby-item-name">
          ${escapeHTML(data.name || "Restaurant")}
        </div>

        <div class="nearby-item-meta">
          ${escapeHTML(meta)}
        </div>

      </div>

      <a
        class="nearby-item-map"
        href="${map}"
        target="_blank"
        rel="noopener noreferrer"
      >
        📍
      </a>

    </div>

  `;

}


async function getSavedPicksNearby(
  userLat,
  userLng
){

  const result =
    await db
      .from("restaurants")
      .select("*")
      .eq("trip_id",TRIP_ID);


  if(result.error){
    throw result.error;
  }


  return (
    result.data || []
  )
  .filter(restaurantIsPick)
  .map(row => {

    const coords =
      restaurantCoordinates(row);

    if(!coords){
      return null;
    }

    return {
      ...row,

      __distance:
        nearbyDistanceMetres(
          userLat,
          userLng,
          coords.lat,
          coords.lng
        )
    };

  })
  .filter(Boolean)
  .filter(
    row =>
      row.__distance <= 3000
  )
  .sort(
    (a,b) =>
      a.__distance -
      b.__distance
  )
  .slice(0,3);

}


async function getGoogleRestaurantsNearby(
  userLat,
  userLng
){

  if(
    typeof window.getGooglePlaces !== "function" ||
    typeof window.normalizeGooglePlace !== "function"
  ){

    throw new Error(
      "google-maps.js is not available."
    );

  }


  const placesLibrary =
    await window.getGooglePlaces();

  const Place =
    placesLibrary.Place ||
    google.maps.places?.Place;


  if(
    !Place ||
    typeof Place.searchNearby !== "function"
  ){

    throw new Error(
      "Google Nearby Search is unavailable."
    );

  }


  const response =
    await Place.searchNearby({

      fields:[
        "id",
        "displayName",
        "formattedAddress",
        "addressComponents",
        "googleMapsURI",
        "location",
        "types"
      ],

      locationRestriction:{
        center:{
          lat:userLat,
          lng:userLng
        },
        radius:1500
      },

      includedPrimaryTypes:[
        "restaurant"
      ],

      maxResultCount:8,

      rankPreference:
        google.maps.places
          .SearchNearbyRankPreference
          .DISTANCE

    });


  return response.places || [];

}


function bindFoodNearby(){

  const button =
    document.getElementById(

  if(!button){

  button.onclick =

}


async function loadNearbyFood(){

  const status =
    document.getElementById(
      "foodNearbyStatus"
    );

  const results =
    document.getElementById(
      "foodNearbyResults"
    );

  const subtitle =
    document.getElementById(
      "foodNearbySubtitle"
    );


  nearbyLoading = true;

  status.className =
    "nearby-status";

  status.textContent =
    "Getting your location…";

  results.innerHTML = "";


  try{

    const position =
      await getCurrentPositionForFood();

    const userLat =
      position.coords.latitude;

    const userLng =
      position.coords.longitude;


    status.textContent =
      "Finding your picks and restaurants nearby…";


    const settled =
      await Promise.allSettled([

        getSavedPicksNearby(
          userLat,
          userLng
        ),

        getGoogleRestaurantsNearby(
          userLat,
          userLng
        )

      ]);


    const picks =
      settled[0].status === "fulfilled"
        ? settled[0].value
        : [];


    const googlePlaces =
      settled[1].status === "fulfilled"
        ? settled[1].value
        : [];


    const pickNames =
      new Set(
        picks.map(
          row =>
            String(row.name || "")
              .trim()
              .toLowerCase()
        )
      );


    const more =
      googlePlaces
        .filter(place => {

          const data =
            window.normalizeGooglePlace(place);

          return !pickNames.has(
            String(data.name || "")
              .trim()
              .toLowerCase()
          );

        })
        .slice(0,4);


    let html = "";


    if(picks.length){

      html += `

        <div class="nearby-section">

          <div class="nearby-section-title">
            ⭐ YOUR PICKS NEARBY
          </div>

          ${
            picks
              .map(savedRestaurantHTML)
              .join("")
          }

        </div>

      `;

    }


    html += `

      <div class="nearby-section">

        <div class="nearby-section-title">
          🍽 MORE FOOD AROUND YOU
        </div>

        ${
          more.length

            ?

          more
            .map(
              place =>
                googleRestaurantHTML(
                  place,
                  userLat,
                  userLng
                )
            )
            .join("")

            :

          `
            <div class="nearby-status">
              No additional restaurants were returned nearby.
            </div>
          `
        }

      </div>


      <a
        class="nearby-more"
        href="food.html?trip=${TRIP_ID}&nearby=1"
      >
        SEE MORE FOOD →
      </a>

    `;


    results.innerHTML =
      html;


    if(!picks.length){

      status.textContent =
        "No saved Picks with coordinates were found close by yet. Showing nearby restaurants.";

    }
    else{

      status.textContent =
        "Using your current location.";

    }


    subtitle.textContent =
      "Your picks first + more restaurants around you";


    nearbyLoaded = true;

  }
  catch(error){

    console.error(
      "Food Near Me error:",
      error
    );


    let message =
      error.message ||
      "Couldn't find nearby food.";


    if(error.code === 1){

      message =
        "Location permission was not allowed. Allow location access and try again.";

    }


    status.textContent =
      message;

    status.className =
      "nearby-status error";

  }
  finally{

    nearbyLoading = false;

  }

}

async function loadTripFromDatabase(){

  const preview =
    document.getElementById(
      "dayPreview"
    );


  try{

    /* -----------------------------------------------
       Resolve trip if ?trip= is missing
    ----------------------------------------------- */

    if(!TRIP_ID){

      const accessible =
        await getAccessibleTrips();


      if(!accessible.length){

        throw new Error(
          "No trips are available for this account."
        );

      }


      TRIP_ID =
        Number(accessible[0].id);


      history.replaceState(
        {},
        "",
        `index.html?trip=${TRIP_ID}`
      );

    }


    updateLinks();


    /* -----------------------------------------------
       Load trip + schedule
    ----------------------------------------------- */

    const [
      tripResult,
      scheduleResult
    ] =
      await Promise.all([

        db
          .from("trips")
          .select("*")
          .eq("id",TRIP_ID)
          .single(),

        db
          .from("schedule")
          .select("*")
          .eq("trip_id",TRIP_ID)
          .order(
            "schedule_date",
            {ascending:true}
          )
          .order(
            "sort_order",
            {ascending:true}
          )

      ]);


    if(tripResult.error){
      throw tripResult.error;
    }

    if(scheduleResult.error){
      throw scheduleResult.error;
    }


    const trip =
      tripResult.data;

    const rows =
      scheduleResult.data || [];


    /* -----------------------------------------------
       Header
    ----------------------------------------------- */

    const start =
      trip.start_date
        ? new Date(
            trip.start_date +
            "T00:00:00"
          )
        : null;


    const end =
      trip.end_date
        ? new Date(
            trip.end_date +
            "T00:00:00"
          )
        : null;


    const monthYear =
      start
        ? start
            .toLocaleDateString(
              "en-SG",
              {
                month:"long",
                year:"numeric"
              }
            )
            .toUpperCase()
        : "";


    document
      .querySelector(".eyebrow")
      .textContent =
        [
          trip.country,
          monthYear
        ]
        .filter(Boolean)
        .join(" · ");


    document
      .querySelector("h1")
      .textContent =
        trip.name || "My Trip";


    document.title =
      trip.name || "My Trip";


    const fmt =
      date =>
        date
          ? date.toLocaleDateString(
              "en-SG",
              {
                day:"numeric",
                month:"long",
                year:"numeric"
              }
            )
          : "";


    document
      .querySelector(".sub")
      .textContent =
        start && end
          ? `${fmt(start)} – ${fmt(end)}`
          : (trip.description || "");


    /* -----------------------------------------------
       Group schedule
    ----------------------------------------------- */

    const byDate = {};


    rows.forEach(row => {

      if(!row.schedule_date){
        return;
      }

      (
        byDate[row.schedule_date] ||= []
      ).push(row);

    });


    const dates =
      Object.keys(byDate).sort();


    const tripline =
      document.querySelector(
        ".tripline"
      );


    if(tripline){

      if(trip.description){

        tripline.innerHTML =
          `<strong>${escapeHTML(trip.description)}</strong>`;

      }
      else{

        tripline.innerHTML =
          `<strong>${escapeHTML(trip.country || "TRIP")}</strong> · ${dates.length} planned day${dates.length === 1 ? "" : "s"}`;

      }

    }


    /* -----------------------------------------------
       No schedule
    ----------------------------------------------- */

    if(!dates.length){

      preview.innerHTML = `

        <div class="day-card">

          <div class="day-label">
            TRIP PREVIEW
          </div>

          <h2>
            No plans added yet
          </h2>

          <div class="day-area">
            ${escapeHTML(trip.country || "")}
          </div>

          <a
            class="full-plan"
            href="schedule.html?trip=${TRIP_ID}"
          >
            OPEN PLAN →
          </a>

          ${renderFoodNearby()}

        </div>

      `;


      bindFoodNearby();

      return;

    }


    /* -----------------------------------------------
       Pick initial date
    ----------------------------------------------- */

    const now =
      new Date();

    const todayISO =
      [
        now.getFullYear(),
        String(now.getMonth()+1).padStart(2,"0"),
        String(now.getDate()).padStart(2,"0")
      ].join("-");


    let selectedDate;


    if(dates.includes(todayISO)){

      selectedDate =
        todayISO;

    }
    else if(todayISO < dates[0]){

      selectedDate =
        dates[0];

    }
    else if(
      todayISO >
      dates[dates.length-1]
    ){

      selectedDate =
        dates[dates.length-1];

    }
    else{

      selectedDate =
        dates.find(
          date =>
            date > todayISO
        ) || dates[0];

    }


    /* -----------------------------------------------
       Time formatter
    ----------------------------------------------- */

    function timeText(row){

      if(row.time_label){
        return row.time_label;
      }


      const pretty =
        value => {

          if(!value){
            return "";
          }

          const [
            hh,
            mm
          ] =
            value
              .split(":")
              .map(Number);


          const date =
            new Date(
              2000,
              0,
              1,
              hh,
              mm
            );


          return date
            .toLocaleTimeString(
              "en-SG",
              {
                hour:"numeric",
                minute:"2-digit"
              }
            );

        };


      if(
        row.start_time &&
        row.end_time
      ){

        return (
          pretty(row.start_time) +
          " – " +
          pretty(row.end_time)
        );

      }


      if(row.start_time){

        return pretty(
          row.start_time
        );

      }


      return "";

    }


    function mapFor(row){

      if(row.maps_url){
        return row.maps_url;
      }


      const query =
        row.location_name ||
        row.address ||
        row.title;


      return query
        ? mapURL(query)
        : "";

    }


    function dayTitle(dayRows){

      const meaningful =
        dayRows.filter(row => {

          const type =
            String(
              row.item_type || ""
            ).toLowerCase();

          return ![
            "transport",
            "hotel"
          ].includes(type);

        });


      const source =
        meaningful.length
          ? meaningful
          : dayRows;


      const names =
        source
          .slice(0,2)
          .map(row =>
            String(row.title || "")
              .replace(
                /^[^\p{L}\p{N}]+/u,
                ""
              )
              .trim()
          )
          .filter(Boolean);


      return (
        names.join(" + ") ||
        "Trip Day"
      );

    }


    function dayArea(dayRows){

      const locationRow =
        dayRows.find(
          row =>
            row.location_name
        );


      if(locationRow?.location_name){

        return String(
          locationRow.location_name
        ).toUpperCase();

      }


      return String(
        trip.country || "TRIP"
      ).toUpperCase();

    }


    /* -----------------------------------------------
       Render selected day
    ----------------------------------------------- */

    function renderDynamic(){

      const dayRows =
        byDate[selectedDate] || [];


      const date =
        new Date(
          selectedDate +
          "T00:00:00"
        );


      const weekday =
        date
          .toLocaleDateString(
            "en-SG",
            {weekday:"long"}
          )
          .toUpperCase();


      const dayNum =
        date.getDate();


      const month =
        date
          .toLocaleDateString(
            "en-SG",
            {month:"short"}
          )
          .toUpperCase();


      const dateButtons =
        dates.map(value => {

          const d =
            new Date(
              value +
              "T00:00:00"
            );


          return `

            <button
              class="date-btn ${
                value === selectedDate
                  ? "active"
                  : ""
              }"
              data-date="${value}"
              type="button"
            >

              <span class="num">
                ${d.getDate()}
              </span>

              <span class="dow">
                ${
                  d
                    .toLocaleDateString(
                      "en-SG",
                      {weekday:"short"}
                    )
                    .toUpperCase()
                }
              </span>

            </button>

          `;

        }).join("");


      const blocks =
        dayRows.map(row => {

          const map =
            mapFor(row);


          return `

            <div class="block">

              <div class="block-head">

                <div class="block-time">
                  ${escapeHTML(timeText(row))}
                </div>

                <div class="block-main">

                  <div class="block-name">
                    ${escapeHTML(row.title || "")}
                  </div>

                  ${
                    row.notes
                      ?
                    `
                      <div class="block-note">
                        ${escapeHTML(row.notes)}
                      </div>
                    `
                      :
                    ""
                  }

                </div>

                ${
                  map
                    ?
                  `
                    <a
                      class="block-map"
                      href="${map}"
                      target="_blank"
                      rel="noopener noreferrer"
                    >
                      📍
                    </a>
                  `
                    :
                  ""
                }

              </div>

            </div>

          `;

        }).join("");


      preview.innerHTML = `

        <div class="day-card">

          <div class="day-top">

            <div class="day-label">
              TRIP PREVIEW
            </div>

            <div class="day-date">
              ${weekday} · ${dayNum} ${month}
            </div>

          </div>

          <h2>
            ${escapeHTML(dayTitle(dayRows))}
          </h2>

          <div class="day-area">
            ${escapeHTML(dayArea(dayRows))}
          </div>

          <div class="date-scroll">
            ${dateButtons}
          </div>

          <div class="plan-title">
            DAY AT A GLANCE
          </div>

          ${blocks}

          <a
            class="full-plan"
            href="schedule.html?trip=${TRIP_ID}#${selectedDate}"
          >
            FULL PLAN →
          </a>

          ${renderFoodNearby()}

        </div>

      `;


      document
        .querySelectorAll(
          "[data-date]"
        )
        .forEach(button => {

          button.onclick =
            () => {

              selectedDate =
                button.dataset.date;

              nearbyLoaded =
                false;

              renderDynamic();

            };

        });


      bindFoodNearby();

    }


    renderDynamic();

  }
  catch(error){

    console.error(
      "Index load error:",
      error
    );


    preview.innerHTML = `

      <div class="day-card">

        <div class="day-label">
          TRIP PREVIEW
        </div>

        <h2>
          Could not load this trip
        </h2>

        <div class="day-area">
          ${escapeHTML(error.message || "Supabase error")}
        </div>

      </div>

    `;

  }

}


/* =========================================================
   START
========================================================= */

updateLinks();
loadTripFromDatabase();

</script>
