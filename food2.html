<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Google Places Direct Test</title>

  <style>
    body {
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
      padding: 30px;
    }

    .box {
      max-width: 650px;
      margin: auto;
    }

    #status {
      background: #222;
      padding: 20px;
      border-radius: 12px;
      margin: 20px 0;
      white-space: pre-wrap;
    }

    .good { color: #72e895; }
    .bad { color: #ff6b6b; }

    #search {
      margin-top: 20px;
    }

    #result {
      background: #222;
      padding: 20px;
      border-radius: 12px;
      margin-top: 20px;
      display: none;
      line-height: 1.7;
    }
  </style>
</head>

<body>

<div class="box">

  <h1>🍜 Google Places Direct Test</h1>

  <p>
    This test does NOT use google-maps.js.
  </p>

  <div id="status">
    Loading Google Maps...
  </div>

  <div id="search"></div>

  <div id="result"></div>

</div>


<script>

const API_KEY = "AIzaSyD1tFdxoch8ihGkoLA7OYoEuG2k93CGi80";


// =============================================
// SHOW STATUS
// =============================================

function setStatus(message, good = false) {

  const status = document.getElementById("status");

  status.textContent = message;

  status.className = good ? "good" : "bad";

}


// =============================================
// LOAD GOOGLE MAPS DIRECTLY
// =============================================

window.googleMapsReady = async function () {

  try {

    setStatus(
      "✓ Google Maps JavaScript loaded.\n\nLoading Places..."
    );


    // Load Places library
    const places =
      await google.maps.importLibrary("places");


    setStatus(
      "✓ Google Maps loaded\n" +
      "✓ Places library loaded\n" +
      "✓ importLibrary works",
      true
    );


    // =========================================
    // CREATE AUTOCOMPLETE
    // =========================================

    const autocomplete =
      new places.PlaceAutocompleteElement();


    autocomplete.placeholder =
      "Search Yabaton Nagoya...";


    document
      .getElementById("search")
      .appendChild(autocomplete);


    // =========================================
    // SELECT PLACE
    // =========================================

    autocomplete.addEventListener(
      "gmp-select",
      async (event) => {

        try {

          const prediction =
            event.placePrediction;


          const place =
            prediction.toPlace();


          await place.fetchFields({
            fields: [
              "displayName",
              "formattedAddress",
              "googleMapsURI",
              "websiteURI"
            ]
          });


          const result =
            document.getElementById("result");


          result.style.display = "block";


          result.innerHTML = `
            <strong>SUCCESS 🎉</strong>
            <br><br>

            <strong>Name:</strong><br>
            ${place.displayName || "-"}
            <br><br>

            <strong>Address:</strong><br>
            ${place.formattedAddress || "-"}
            <br><br>

            <strong>Google Maps:</strong><br>
            ${place.googleMapsURI || "-"}
            <br><br>

            <strong>Website:</strong><br>
            ${place.websiteURI || "-"}
          `;

        }

        catch (error) {

          setStatus(
            "PLACE SELECTION ERROR:\n\n" +
            (error.message || error)
          );

          console.error(error);

        }

      }
    );


  }

  catch (error) {

    setStatus(
      "PLACES ERROR:\n\n" +
      (error.message || error)
    );

    console.error(error);

  }

};


// =============================================
// CREATE GOOGLE SCRIPT
// =============================================

const script =
  document.createElement("script");


script.src =
  "https://maps.googleapis.com/maps/api/js" +
  "?key=" + encodeURIComponent(API_KEY) +
  "&v=weekly" +
  "&loading=async" +
  "&callback=googleMapsReady";


script.async = true;


script.onerror = function () {

  setStatus(
    "GOOGLE MAPS SCRIPT FAILED TO LOAD.\n\n" +
    "Possible causes:\n" +
    "• API key incorrect\n" +
    "• Website restriction incorrect\n" +
    "• Maps JavaScript API not enabled\n" +
    "• Billing problem"
  );

};


document.head.appendChild(script);

</script>

</body>
</html>
