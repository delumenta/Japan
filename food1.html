<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070c10">
<title>Food</title>

<style>
:root{
  --bg:#070c10;
  --surface:#0d1318;
  --surface-2:#11181e;
  --surface-3:#151d24;
  --line:#263039;
  --line-soft:rgba(255,255,255,.065);
  --text:#f5f3ef;
  --muted:#929ca4;
  --muted-2:#66727b;
  --red:#ff625f;
  --red-soft:rgba(255,98,95,.09);
  --red-line:rgba(255,98,95,.30);
  --gold:#e4bd69;
  --green:#79c995;
  --blue:#78a9ef;

  --food-hero-image:url("https://zngncasvdrrxyrkjqutj.supabase.co/storage/v1/object/sign/Photos/food1%20(1).png?token=eyJraWQiOiIzOTgxNDUwNy1mM2QwLTQ5ZGItODA4My0xODg1MWZkNGYxMmEiLCJhbGciOiJIUzUxMiJ9.eyJ1cmwiOiJQaG90b3MvZm9vZDEgKDEpLnBuZyIsInNjb3BlIjoiZG93bmxvYWQiLCJpYXQiOjE3ODk3Mzg4NDIsImV4cCI6MTg3NjEzODg0Mn0.IdOfy_yyVvK-FoUpFxN6thWF46U_cvZVcUejrZtppGxzRHAaUSmCkmJONBa7y8rtMTEMV8Iv3M1x0PBwyjmSXw");
}

*{box-sizing:border-box}

html{scroll-behavior:smooth}

body{
  margin:0;
  min-height:100vh;
  padding-top:14px;
  color:var(--text);
  background:
    radial-gradient(circle at 50% -8%,rgba(42,56,68,.30),transparent 28%),
    var(--bg);
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased;
}

button,input,textarea{font:inherit}
button{-webkit-tap-highlight-color:transparent}

/* =========================================================
   OUTER FOOD SHELL
========================================================= */

.food-shell{
  position:relative;
  width:calc(100% - 24px);
  max-width:720px;
  margin:0 auto 105px;
  overflow:hidden;
  border:1px solid #273139;
  border-radius:27px;
  background:linear-gradient(180deg,#0a1116,#070d11);
  box-shadow:0 24px 65px rgba(0,0,0,.40);
}

/* =========================================================
   HERO / HEADER
========================================================= */

header{
  position:relative;
  z-index:100;
  isolation:isolate;
  width:100%;
  margin:0;
  overflow:visible;
  border:0;
  border-top:3px solid var(--red);
  border-radius:26px 26px 0 0;

  background-image:
    linear-gradient(
      90deg,
      rgba(4,8,11,.74) 0%,
      rgba(4,8,11,.50) 52%,
      rgba(4,8,11,.35) 100%
    ),
    linear-gradient(
      0deg,
      rgba(4,8,11,.58) 0%,
      rgba(4,8,11,.06) 58%
    ),
    var(--food-hero-image);

  background-size:cover;
  background-position:center 48%;
}

header::after{
  content:"";
  position:absolute;
  inset:0;
  z-index:0;
  pointer-events:none;
  background:
    linear-gradient(
      180deg,
      transparent 68%,
      rgba(5,9,12,.34) 82%,
      rgba(5,9,12,.70) 100%
    );
}

.header-inner{
  position:relative;
  z-index:2;
  width:100%;
  padding:26px 20px 0;
  overflow:visible;
}

.title-row{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:12px;
}

.title-row>div:first-child{min-width:0}

.eyebrow{
  margin-bottom:14px;
  color:#ef7d79;
  font-size:8px;
  font-weight:900;
  letter-spacing:.18em;
  text-transform:uppercase;
  text-shadow:0 1px 12px rgba(0,0,0,.70);
}

.food-page-title{
  display:flex;
  align-items:center;
  gap:15px;
  margin:0;
}

.food-page-title-icon{
  width:65px;
  height:65px;
  flex:0 0 65px;
  display:block;
  padding:10px;
  border:1px solid rgba(255,98,95,.34);
  border-radius:50%;
  background:rgba(7,13,17,.80);
  object-fit:contain;
  opacity:.92;
  box-shadow:
    inset 0 0 0 1px rgba(255,255,255,.012),
    0 8px 24px rgba(0,0,0,.25);
}

.food-page-title span{
  color:#f8f4ee;
  font-family:Georgia,"Times New Roman",serif;
  font-size:41px;
  font-weight:700;
  line-height:1;
  letter-spacing:-.03em;
  text-shadow:0 2px 18px rgba(0,0,0,.68);
}

.trip-name{
  margin:8px 0 0 80px;
  max-width:350px;
  overflow:hidden;
  color:#9ba4aa;
  font-size:9px;
  font-weight:500;
  line-height:1.4;
  text-overflow:ellipsis;
  white-space:nowrap;
  text-shadow:0 1px 10px rgba(0,0,0,.66);
}

.add-btn{
  flex:0 0 auto;
  min-height:29px;
  padding:0 10px;
  border:1px solid rgba(255,98,95,.38);
  border-radius:9px;
  background:rgba(255,98,95,.09);
  color:#ffb3ae;
  font-size:7px;
  font-weight:900;
  letter-spacing:.04em;
  cursor:pointer;
  box-shadow:
    inset 0 0 16px rgba(255,98,95,.025),
    0 3px 14px rgba(0,0,0,.18);
}

.add-btn:active{transform:scale(.96)}

/* =========================================================
   FILTER ROW 1 — MY FOOD / DISCOVER
========================================================= */

.main-tabs{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:4px;
  margin-top:22px;
  padding:4px;
  border:1px solid #2b353d;
  border-radius:999px;
  background:rgba(5,10,14,.54);
}

.main-tab{
  min-height:42px;
  padding:8px 12px;
  border:1px solid transparent;
  border-radius:999px;
  background:transparent;
  color:#707b83;
  font-size:9px;
  font-weight:900;
  letter-spacing:.045em;
  cursor:pointer;
  transition:.16s ease;
}

.main-tab.active{
  border-color:rgba(255,98,95,.44);
  background:
    linear-gradient(
      180deg,
      rgba(255,98,95,.15),
      rgba(255,98,95,.08)
    );
  color:#fff;
  box-shadow:
    inset 0 0 18px rgba(255,98,95,.04),
    0 0 0 1px rgba(255,98,95,.04);
}

/* =========================================================
   FILTER AREA
========================================================= */

.unified-filter-panel{
  position:relative;
  z-index:500;
  margin:0 -20px;
  padding:18px 20px 15px;
  overflow:visible;
  background:
    linear-gradient(
      180deg,
      rgba(7,12,16,.10) 0%,
      rgba(7,12,16,.36) 46%,
      rgba(7,12,16,.88) 100%
    );
}

/* =========================================================
   FILTER ROW 2 — STATUS CHIPS
========================================================= */

.status-row{
  display:flex;
  align-items:center;
  gap:7px;
  width:100%;
  margin:0 0 12px;
  padding:0 0 1px;
  overflow-x:auto;
  scrollbar-width:none;
  -webkit-overflow-scrolling:touch;
}

.status-row::-webkit-scrollbar{display:none}

.status-chip{
  flex:0 0 auto;
  min-height:34px;
  padding:7px 11px;
  border:1px solid #2b353d;
  border-radius:999px;
  background:rgba(10,17,22,.72);
  color:#879198;
  font-size:7px;
  font-weight:900;
  white-space:nowrap;
  cursor:pointer;
}

.status-chip.active{
  border-color:rgba(255,98,95,.42);
  background:rgba(255,98,95,.10);
  color:#f4c5c1;
}

/* =========================================================
   FILTER ROW 3 — CITY / AREA / FOOD / SEARCH
========================================================= */

.sticky-filter-bar{
  position:relative;
  z-index:510;
  display:grid;
  grid-template-columns:
    minmax(0,.88fr)
    minmax(0,1fr)
    minmax(0,1fr)
    minmax(0,1.42fr);
  gap:6px;
  align-items:center;
  width:100%;
  overflow:visible;
}

.filter-select-wrap{
  position:relative;
  z-index:1;
  min-width:0;
  overflow:visible;
}

.filter-select-wrap.filter-open{z-index:5000}

.filter-select-btn{
  width:100%;
  min-width:0;
  height:38px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:5px;
  padding:6px 9px;
  overflow:hidden;
  border:1px solid #2b353d;
  border-radius:11px;
  background:rgba(10,17,22,.83);
  color:#aeb6bc;
  font-size:7px;
  font-weight:850;
  cursor:pointer;
}

.filter-select-btn>span:first-child{
  min-width:0;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.filter-select-btn.active{
  border-color:rgba(255,98,95,.34);
  background:rgba(255,98,95,.075);
  color:#f0c2bf;
}

.filter-chevron{
  flex:0 0 auto;
  color:#65717a;
  font-size:9px;
}

.filter-menu{
  position:absolute;
  top:calc(100% + 6px);
  left:0;
  z-index:6000;
  width:max(100%,190px);
  max-width:min(280px,calc(100vw - 36px));
  max-height:300px;
  padding:5px;
  overflow-y:auto;
  border:1px solid #2c373f;
  border-radius:12px;
  background:#0d1419;
  box-shadow:0 18px 44px rgba(0,0,0,.58);
}

.filter-menu[hidden]{display:none}

.filter-menu-item{
  width:100%;
  min-height:36px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  padding:7px 9px;
  border:0;
  border-radius:8px;
  background:transparent;
  color:#a6b0b7;
  font-size:8px;
  font-weight:800;
  text-align:left;
  cursor:pointer;
}

.filter-menu-item.active,
.filter-menu-item:hover{
  background:var(--red-soft);
  color:#fff;
}

.filter-menu-count{
  color:#626f77;
  font-size:6px;
}

.quick-filter-wrap{
  min-width:0;
  height:38px;
  display:flex;
  align-items:center;
  gap:6px;
  padding:0 9px;
  border:1px solid #2b353d;
  border-radius:11px;
  background:rgba(10,17,22,.83);
}

.quick-filter-wrap:focus-within{
  border-color:rgba(255,98,95,.34);
  background:rgba(255,98,95,.035);
}

.quick-filter-icon{
  flex:0 0 auto;
  opacity:.68;
  font-size:9px;
}

.quick-filter-input{
  width:100%;
  min-width:0;
  padding:0;
  border:0;
  outline:0;
  background:transparent;
  color:#e7e9e9;
  font-size:7px;
}

.quick-filter-input::placeholder{color:#626d75}

/* =========================================================
   RESULTS
========================================================= */

main{
  position:relative;
  z-index:1;
  isolation:isolate;
  width:100%;
  margin:0;
  padding:7px 20px 22px;
  border:0;
  border-radius:0 0 26px 26px;
  background:
    linear-gradient(
      180deg,
      rgba(9,16,21,.98) 0%,
      #081015 64px,
      #070d11 190px,
      #070d11 100%
    );
}

main::before{
  content:"";
  position:absolute;
  z-index:0;
  left:0;
  right:0;
  top:-48px;
  height:76px;
  pointer-events:none;
  background:
    linear-gradient(
      180deg,
      rgba(7,13,17,0) 0%,
      rgba(7,13,17,.24) 18%,
      rgba(7,13,17,.52) 42%,
      rgba(7,13,17,.78) 66%,
      rgba(8,15,20,.95) 86%,
      #091015 100%
    );
}

main>*{
  position:relative;
  z-index:1;
}

.result-head{display:none}

.food-section{
  margin-bottom:12px;
}

.section-title{
  display:flex;
  align-items:center;
  gap:7px;
  margin:0 1px 5px;
  padding-bottom:4px;
  border-bottom:1px solid var(--line-soft);
  color:#bfc5c9;
  font-size:7px;
  font-weight:900;
  letter-spacing:.07em;
}

.section-title span:last-child{
  margin-left:auto;
  color:#626e76;
  font-size:7px;
}

/* =========================================================
   RESTAURANT CARDS
========================================================= */

.restaurant-card{
  position:relative;
  margin-bottom:5px;
  padding:8px 9px 7px;
  overflow:hidden;
  border:1px solid #2a353d;
  border-radius:12px;
  background:
    linear-gradient(
      180deg,
      rgba(21,29,35,.98) 0%,
      rgba(13,20,25,.99) 100%
    );
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.025),
    0 6px 18px rgba(0,0,0,.11);
}

.restaurant-card::before{
  content:"";
  position:absolute;
  z-index:2;
  top:1px;
  bottom:1px;
  left:0;
  width:2px;
  border-radius:12px 0 0 12px;
  background:
    linear-gradient(
      180deg,
      rgba(255,98,95,.95) 0%,
      rgba(255,98,95,.76) 60%,
      rgba(255,98,95,.42) 100%
    );
  box-shadow:0 0 9px rgba(255,98,95,.13);
  pointer-events:none;
}

.restaurant-card::after{
  content:"";
  position:absolute;
  z-index:1;
  top:0;
  left:0;
  width:115px;
  height:1px;
  background:
    linear-gradient(
      90deg,
      rgba(255,98,95,.55),
      rgba(255,98,95,.16),
      transparent
    );
  pointer-events:none;
}

.restaurant-card.eaten-card{opacity:.62}

.card-top{
  display:flex;
  align-items:flex-start;
  gap:7px;
  padding-left:3px;
}

.food-icon{
  width:29px;
  height:29px;
  flex:0 0 29px;
  display:flex;
  align-items:center;
  justify-content:center;
  border:1px solid rgba(255,98,95,.25);
  border-radius:8px;
  background:
    linear-gradient(
      145deg,
      rgba(255,98,95,.09),
      rgba(255,255,255,.025)
    );
  font-size:14px;
}

.card-main{
  flex:1;
  min-width:0;
}

.restaurant-name{
  margin:0;
  color:#f8f7f4;
  font-size:11px;
  font-weight:850;
  line-height:1.18;
}

.japanese{
  margin-top:1px;
  color:#737f87;
  font-size:6.8px;
}

.location{
  margin-top:3px;
  color:#919ba2;
  font-size:6.8px;
  line-height:1.25;
}

.badges{
  display:flex;
  flex-wrap:wrap;
  gap:3px;
  margin-top:5px;
}

.badge{
  padding:2px 4px;
  border:1px solid rgba(255,255,255,.07);
  border-radius:999px;
  background:rgba(255,255,255,.025);
  color:#9ea8ae;
  font-size:6px;
  font-weight:800;
}

.badge.pick,
.badge.top{
  border-color:rgba(228,189,105,.22);
  background:rgba(228,189,105,.055);
  color:#e4bd69;
}

.badge.flex{
  border-color:rgba(120,169,239,.20);
  background:rgba(120,169,239,.055);
  color:#a7c7f3;
}

.badge.hot{
  border-color:rgba(238,145,87,.22);
  background:rgba(238,145,87,.055);
  color:#efa875;
}

.badge.scheduled,
.badge.eaten{
  border-color:rgba(121,201,149,.20);
  background:rgba(121,201,149,.055);
  color:#9edab3;
}

.price-badge,
.rating-badge{
  color:#e4bd69;
  border-color:rgba(228,189,105,.18);
  background:rgba(228,189,105,.045);
}

.plan-box{
  margin-top:5px;
  padding:4px 6px;
  border-left:2px solid rgba(121,201,149,.55);
  border-radius:2px 7px 7px 2px;
  background:rgba(121,201,149,.045);
  color:#9fd3b0;
  font-size:6.5px;
  font-weight:800;
}

.description{
  margin-top:5px;
  color:#8f999f;
  font-size:6.8px;
  line-height:1.35;
}

.actions{
  position:relative;
  display:flex;
  align-items:center;
  flex-wrap:wrap;
  gap:3px;
  margin-top:7px;
  padding-top:7px;
  border-top:1px solid rgba(255,255,255,.075);
}

.actions::before{
  content:"";
  position:absolute;
  top:-1px;
  left:0;
  right:0;
  height:1px;
  background:
    linear-gradient(
      90deg,
      rgba(255,255,255,.015),
      rgba(255,255,255,.055) 18%,
      rgba(255,255,255,.055) 82%,
      rgba(255,255,255,.015)
    );
  pointer-events:none;
}

.action-btn{
  min-height:23px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  padding:3px 6px;
  border:1px solid rgba(255,98,95,.17);
  border-radius:6px;
  background:rgba(255,98,95,.035);
  color:#df8b86;
  text-decoration:none;
  font-size:6px;
  font-weight:900;
  cursor:pointer;
}

.action-btn.gold{
  border-color:rgba(228,189,105,.18);
  background:rgba(228,189,105,.035);
  color:#d9b86d;
}

.action-btn.green{
  border-color:rgba(121,201,149,.18);
  background:rgba(121,201,149,.035);
  color:#8fd0a6;
}

.action-btn.blue{
  border-color:rgba(120,169,239,.18);
  background:rgba(120,169,239,.035);
  color:#91b9ef;
}

.action-btn.muted{
  border-color:rgba(255,255,255,.07);
  background:rgba(255,255,255,.025);
  color:#79858c;
}

.state{
  padding:24px 14px;
  border:1px dashed #303b43;
  border-radius:14px;
  background:rgba(255,255,255,.012);
  color:#77838b;
  font-size:8px;
  line-height:1.6;
  text-align:center;
}

.state strong{
  display:block;
  margin-bottom:5px;
  color:#e8e7e3;
  font-family:Georgia,"Times New Roman",serif;
  font-size:14px;
  font-weight:700;
}

/* =========================================================
   ADD RESTAURANT SHEET
========================================================= */

.sheet-backdrop{
  position:fixed;
  inset:0;
  z-index:15000;
  display:none;
  align-items:flex-end;
  background:rgba(0,0,0,.72);
  backdrop-filter:blur(5px);
  -webkit-backdrop-filter:blur(5px);
}

.sheet-backdrop.open{display:flex}

.sheet{
  width:100%;
  max-width:620px;
  max-height:calc(92vh - env(safe-area-inset-top));
  margin:auto auto 0;
  padding:8px 14px calc(18px + env(safe-area-inset-bottom));
  overflow-y:auto;
  border:1px solid var(--line);
  border-radius:20px 20px 0 0;
  background:#0c1217;
  box-shadow:0 -20px 50px rgba(0,0,0,.35);
}

.sheet-handle{
  width:36px;
  height:4px;
  margin:2px auto 13px;
  border-radius:999px;
  background:#35414a;
}

.sheet-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:14px;
}

.sheet-title{
  font-family:Georgia,"Times New Roman",serif;
  font-size:19px;
}

.close-btn{
  width:34px;
  height:34px;
  border:1px solid var(--line);
  border-radius:9px;
  background:#131b21;
  color:#fff;
  cursor:pointer;
}

.google-place-box{
  grid-column:1/-1;
  margin-bottom:3px;
  padding:10px;
  border:1px solid rgba(120,169,239,.18);
  border-radius:11px;
  background:rgba(120,169,239,.035);
}

.google-place-label{
  margin-bottom:7px;
  color:#8fa0ad;
  font-size:7px;
  font-weight:900;
  letter-spacing:.04em;
}

#googlePlaceSearch{width:100%}
#googlePlaceSearch gmp-place-autocomplete,
gmp-place-autocomplete{width:100%;min-height:42px}

.place-status{
  margin-top:6px;
  color:#6f7d86;
  font-size:7px;
  line-height:1.4;
}

.place-status.success{color:#96d4ab}
.place-status.error{color:#f2a4a0}

.form-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
}

.field.full{grid-column:1/-1}

.field label{
  display:block;
  margin-bottom:4px;
  color:#8d989f;
  font-size:6.5px;
  font-weight:900;
  letter-spacing:.04em;
}

.field input,
.field textarea{
  width:100%;
  min-height:40px;
  padding:8px 9px;
  border:1px solid var(--line);
  border-radius:9px;
  outline:0;
  background:#0f161c;
  color:#fff;
  font-size:9px;
}

.field textarea{
  min-height:76px;
  resize:vertical;
}

.field input:focus,
.field textarea:focus{border-color:var(--red-line)}

.checks{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:5px;
  margin-top:10px;
}

.check{
  min-height:39px;
  display:flex;
  align-items:center;
  gap:6px;
  padding:6px 8px;
  border:1px solid var(--line);
  border-radius:9px;
  background:#10171d;
  color:#aab3b9;
  font-size:7px;
  font-weight:800;
}

.check input{
  width:14px;
  height:14px;
  accent-color:var(--red);

<script>
/* =========================================================
   TRIP / DATA / STATE
========================================================= */

const params = new URLSearchParams(window.location.search);
let TRIP_ID = Number(params.get("trip")) || null;

let trip = null;
let restaurants = [];
let tripRestaurants = [];
let scheduleRows = [];
let currentUser = null;

let activeTab = "mine";
let selectedCity = "";
let myFilter = "all";
let discoverStatusFilter = "all";
let sideAreaFilter = "";
let foodGroupFilter = "";
let quickFilterTerm = "";

/* =========================================================
   ELEMENTS
========================================================= */

const tripName = document.getElementById("tripName");
const tripEyebrow = document.getElementById("tripEyebrow");
const results = document.getElementById("results");

const myFilters = document.getElementById("myFilters");
const discoverStatusRow = document.getElementById("discoverStatusRow");

const stickyFilterBar = document.getElementById("stickyFilterBar");

const cityFilterButton = document.getElementById("cityFilterButton");
const cityFilterButtonText = document.getElementById("cityFilterButtonText");
const cityFilterMenu = document.getElementById("cityFilterMenu");

const areaFilterButton = document.getElementById("areaFilterButton");
const areaFilterButtonText = document.getElementById("areaFilterButtonText");
const areaFilterMenu = document.getElementById("areaFilterMenu");

const foodFilterButton = document.getElementById("foodFilterButton");
const foodFilterButtonText = document.getElementById("foodFilterButtonText");
const foodFilterMenu = document.getElementById("foodFilterMenu");

const quickFilterInput = document.getElementById("quickFilterInput");

/* =========================================================
   BASIC HELPERS
========================================================= */

function text(value){
  return String(value ?? "");
}

function esc(value){
  return text(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function norm(value){
  return text(value).trim().toLowerCase();
}

function unique(values){
  return [
    ...new Set(
      values
        .map(value => text(value).trim())
        .filter(Boolean)
    )
  ].sort((a,b) => a.localeCompare(b));
}

/* =========================================================
   ACCESSIBLE TRIPS
========================================================= */

async function getAccessibleTrips(){

  const {data:userData,error:userError} = await db.auth.getUser();

  if(userError) throw userError;

  const user = userData?.user;

  if(!user){
    throw new Error("You are not signed in.");
  }

  currentUser = user;

  const ownedResult = await db
    .from("trips")
    .select("*")
    .eq("owner_id",user.id);

  if(ownedResult.error) throw ownedResult.error;

  const memberResult = await db
    .from("trip_members")
    .select("trip_id")
    .eq("user_id",user.id);

  if(memberResult.error) throw memberResult.error;

  const sharedIds = [
    ...new Set(
      (memberResult.data || [])
        .map(row => Number(row.trip_id))
        .filter(Number.isFinite)
    )
  ];

  let sharedTrips = [];

  if(sharedIds.length){
    const sharedResult = await db
      .from("trips")
      .select("*")
      .in("id",sharedIds);

    if(sharedResult.error) throw sharedResult.error;

    sharedTrips = sharedResult.data || [];
  }

  const tripMap = new Map();

  (ownedResult.data || []).forEach(item => {
    tripMap.set(Number(item.id),{
      ...item,
      __role:"owner"
    });
  });

  sharedTrips.forEach(item => {
    const id = Number(item.id);

    if(!tripMap.has(id)){
      tripMap.set(id,{
        ...item,
        __role:"member"
      });
    }
  });

  return [...tripMap.values()]
    .sort((a,b) =>
      String(a.start_date || "")
        .localeCompare(String(b.start_date || ""))
    );
}

async function resolveTrip(){

  const accessibleTrips = await getAccessibleTrips();

  if(!accessibleTrips.length){
    throw new Error("No trips are available for this account.");
  }

  if(!TRIP_ID){
    TRIP_ID = Number(accessibleTrips[0].id);
    history.replaceState({},"",`food.html?trip=${TRIP_ID}`);
  }

  const allowed = accessibleTrips.some(
    item => Number(item.id) === Number(TRIP_ID)
  );

  if(!allowed){
    TRIP_ID = Number(accessibleTrips[0].id);
    history.replaceState({},"",`food.html?trip=${TRIP_ID}`);
  }
}

/* =========================================================
   RESTAURANT HELPERS
========================================================= */

function rCity(r){ return r.city || ""; }
function rArea(r){ return r.area || ""; }
function rCuisine(r){ return r.cuisine || "Restaurant"; }
function rJapanese(r){ return r.name_japanese || ""; }
function rRating(r){ return r.rating ?? ""; }

function rPrice(r){
  return r.price || r.dinner_price || r.lunch_price || "";
}

function rDescription(r){
  return r.description || "";
}

function rLocation(r){
  return r.location || r.area || r.city || "";
}

/* =========================================================
   FOOD ICON
========================================================= */

function foodIcon(value){

  const v = norm(value);

  if(v.includes("ramen")) return "🍜";
  if(v.includes("sushi")) return "🍣";
  if(v.includes("yakitori")) return "🍢";
  if(v.includes("chicken")) return "🍗";
  if(v.includes("oyakodon")) return "🍳";
  if(v.includes("udon") || v.includes("soba")) return "🥢";
  if(v.includes("tonkatsu")) return "🐷";
  if(v.includes("unagi")) return "🐟";
  if(v.includes("tempura")) return "🍤";
  if(v.includes("curry")) return "🍛";
  if(v.includes("izakaya")) return "🍶";
  if(v.includes("gyoza")) return "🥟";
  if(v.includes("bakery")) return "🥐";
  if(v.includes("seafood")) return "🦐";

  return "🍽️";
}

/* =========================================================
   RELATIONS / FLAGS
========================================================= */

function relationFor(id){
  return tripRestaurants.find(
    item => Number(item.restaurant_id) === Number(id)
  );
}

function inMyFood(r){
  return Boolean(relationFor(r.id));
}

function isPick(r){
  return Boolean(relationFor(r.id)?.is_pick);
}

function isFlexible(r){
  return Boolean(relationFor(r.id)?.is_flexible);
}

function isEaten(r){
  return Boolean(relationFor(r.id)?.is_eaten);
}

function eatenDate(r){

  const value = relationFor(r.id)?.eaten_at;

  if(!value) return "";

  const d = new Date(value);

  if(Number.isNaN(d.getTime())) return "";

  return new Intl.DateTimeFormat(
    "en-SG",
    {day:"numeric",month:"short"}
  )
  .format(d)
  .toUpperCase();
}

function scheduleFor(r){

  return scheduleRows
    .filter(
      item => Number(item.restaurant_id) === Number(r.id)
    )
    .sort(
      (a,b) =>
        String(a.schedule_date)
          .localeCompare(String(b.schedule_date))
    );
}

function isScheduled(r){
  return scheduleFor(r).length > 0;
}

function isTop(r){

  if(
    r.is_tabelog_top100 === true ||
    r.is_top100 === true ||
    r.tabelog_top100 === true
  ){
    return true;
  }

  const award = norm(r.award || r.recognition);

  return (
    award.includes("top 100") ||
    award.includes("top100")
  );
}

function isHot(r){

  if(r.is_hot === true){
    return true;
  }

  return norm(r.award || r.recognition)
    .includes("hot restaurant");
}

function hasTabelog(r){
  return Boolean(
    text(r.tabelog_url).trim() ||
    r.is_tabelog ||
    r.tabelog ||
    isTop(r)
  );
}

/* =========================================================
   DATE
========================================================= */

function formatScheduleDate(value){

  if(!value) return "";

  const d = new Date(value + "T12:00:00");

  return new Intl.DateTimeFormat(
    "en-SG",
    {day:"numeric",month:"short"}
  )
  .format(d)
  .toUpperCase();
}

/* =========================================================
   NORMALIZED FOOD GROUPS
========================================================= */

const FOOD_GROUPS = [
  {key:"sushi",    label:"SUSHI",    icon:"🍣"},
  {key:"noodles",  label:"NOODLES",  icon:"🍜"},
  {key:"yakitori", label:"YAKITORI", icon:"🍢"},
  {key:"katsu",    label:"KATSU",    icon:"🐷"},
  {key:"rice",     label:"RICE",     icon:"🍚"},
  {key:"tempura",  label:"TEMPURA",  icon:"🍤"},
  {key:"seafood",  label:"SEAFOOD",  icon:"🐟"},
  {key:"curry",    label:"CURRY",    icon:"🍛"},
  {key:"izakaya",  label:"IZAKAYA",  icon:"🍶"},
  {key:"cafe",     label:"CAFE",     icon:"☕"}
];

function foodGroup(restaurant){

  const value = norm(rCuisine(restaurant));

  if(
    value.includes("sushi") ||
    value.includes("sashimi") ||
    value.includes("omakase")
  ) return "sushi";

  if(
    value.includes("ramen") ||
    value.includes("udon") ||
    value.includes("soba") ||
    value.includes("noodle")
  ) return "noodles";

  if(
    value.includes("yakitori") ||
    value.includes("kushiyaki") ||
    value.includes("chicken")
  ) return "yakitori";

  if(
    value.includes("tonkatsu") ||
    value.includes("katsu")
  ) return "katsu";

  if(
    value.includes("oyakodon") ||
    value.includes("donburi") ||
    value.includes("rice bowl") ||
    value.includes("rice")
  ) return "rice";

  if(value.includes("tempura")) return "tempura";

  if(
    value.includes("unagi") ||
    value.includes("eel") ||
    value.includes("seafood") ||
    value.includes("fish")
  ) return "seafood";

  if(value.includes("curry")) return "curry";

  if(
    value.includes("izakaya") ||
    value.includes("japanese pub")
  ) return "izakaya";

  if(
    value.includes("cafe") ||
    value.includes("coffee") ||
    value.includes("dessert") ||
    value.includes("sweet") ||
    value.includes("wagashi") ||
    value.includes("bakery") ||
    value.includes("pastry")
  ) return "cafe";

  return "";
}

/* =========================================================
   BASE FILTER SOURCES
========================================================= */

function applyModeStatus(list){

  let source = list.slice();

  if(activeTab === "mine"){

    source = source.filter(inMyFood);

    if(myFilter === "eaten"){
      source = source.filter(isEaten);
      return source;
    }

    source = source.filter(r => !isEaten(r));

    if(myFilter === "pick"){
      source = source.filter(isPick);
    }

    if(myFilter === "flexible"){
      source = source.filter(isFlexible);
    }

    if(myFilter === "scheduled"){
      source = source.filter(isScheduled);
    }

    return source;
  }

  if(discoverStatusFilter === "tabelog"){
    source = source.filter(hasTabelog);
  }

  if(discoverStatusFilter === "top100"){
    source = source.filter(isTop);
  }

  if(discoverStatusFilter === "eaten"){
    source = source.filter(isEaten);
  }

  return source;
}

function matchesQuickFilter(restaurant){

  const q = norm(quickFilterTerm);

  if(!q) return true;

  const haystack = [
    restaurant.name,
    restaurant.name_japanese,
    rCity(restaurant),
    rArea(restaurant),
    rCuisine(restaurant),
    restaurant.category,
    restaurant.description,
    restaurant.location,
    restaurant.award,
    restaurant.recognition
  ]
  .map(text)
  .join(" ");

  return norm(haystack).includes(q);
}

function filteredRestaurants(){

  let list = applyModeStatus(restaurants);

  if(selectedCity){
    list = list.filter(
      r => norm(rCity(r)) === norm(selectedCity)
    );
  }

  if(sideAreaFilter){
    list = list.filter(
      r => norm(rArea(r)) === norm(sideAreaFilter)
    );
  }

  if(foodGroupFilter){
    list = list.filter(
      r => foodGroup(r) === foodGroupFilter
    );
  }

  list = list.filter(matchesQuickFilter);

  return list;
}

/* =========================================================
   LOAD DATA
========================================================= */

async function loadData(){

  try{

    await resolveTrip();

    const tripResult = await db
      .from("trips")
      .select("*")
      .eq("id",TRIP_ID)
      .single();

    if(tripResult.error) throw tripResult.error;

    trip = tripResult.data;

    tripName.textContent = trip.name || "My Trip";

    tripEyebrow.textContent = trip.country
      ? `${trip.country} · TRIP FOOD`
      : "TRIP FOOD";

    document.title = `Food · ${trip.name || "My Trip"}`;

    const restaurantResult = await db
      .from("restaurants")
      .select("*")
      .order("name",{ascending:true});

    if(restaurantResult.error){
      throw restaurantResult.error;
    }

    restaurants = restaurantResult.data || [];

    if(trip.country){

      const country = norm(trip.country);

      restaurants = restaurants.filter(restaurant => {
        if(!restaurant.country) return true;
        return norm(restaurant.country) === country;
      });
    }

    const relationResult = await db
      .from("trip_restaurants")
      .select("*")
      .eq("trip_id",TRIP_ID);

    if(relationResult.error){
      throw relationResult.error;
    }

    tripRestaurants = relationResult.data || [];

    const scheduleResult = await db
      .from("schedule")
      .select(`
        id,
        restaurant_id,
        schedule_date,
        start_time,
        time_label,
        title,
        is_locked
      `)
      .eq("trip_id",TRIP_ID)
      .not("restaurant_id","is",null);

    if(scheduleResult.error){
      console.warn("Schedule food:",scheduleResult.error);
      scheduleRows = [];
    }else{
      scheduleRows = scheduleResult.data || [];
    }

    render();

  }catch(error){

    console.error("Food load error:",error);

    tripEyebrow.textContent = "FOOD";
    tripName.textContent = "Could not load trip";

    results.innerHTML = `
      <div class="state">
        <strong>Couldn't load Food</strong>
        ${esc(error.message || "Unknown database error.")}
      </div>
    `;
  }
}

function countValues(list,getter){

  const map = new Map();

  list.forEach(item => {

    const value = text(getter(item)).trim();

    if(!value) return;

    const key = norm(value);

    if(!map.has(key)){
      map.set(key,{
        label:value,
        count:0
      });
    }

    map.get(key).count += 1;
  });

  return [...map.values()]
    .sort((a,b) => a.label.localeCompare(b.label));
}

function renderCompactFilters(){

  /* -----------------------------------------------
     CITY
  ----------------------------------------------- */

  const citySource = applyModeStatus(restaurants);

  const cities = countValues(citySource,rCity);

  if(
    selectedCity &&
    !cities.some(city =>
      norm(city.label) === norm(selectedCity)
    )
  ){
    selectedCity = "";
    sideAreaFilter = "";
  }

  cityFilterButtonText.textContent =
    selectedCity
      ? `📍 ${selectedCity}`
      : "📍 City";

  cityFilterButton.classList.toggle(
    "active",
    Boolean(selectedCity)
  );

  cityFilterMenu.innerHTML = `
    <button
      class="filter-menu-item ${!selectedCity ? "active" : ""}"
      data-city-filter=""
      type="button"
    >
      <span>✓ All Cities</span>
      <span class="filter-menu-count">${citySource.length}</span>
    </button>

    ${cities.map(city => `
      <button
        class="filter-menu-item ${
          norm(selectedCity) === norm(city.label)
            ? "active"
            : ""
        }"
        data-city-filter="${esc(city.label)}"
        type="button"
      >
        <span>${esc(city.label)}</span>
        <span class="filter-menu-count">${city.count}</span>
      </button>
    `).join("")}
  `;

  cityFilterMenu
    .querySelectorAll("[data-city-filter]")
    .forEach(button => {

      button.onclick = () => {

        const nextCity = button.dataset.cityFilter || "";

        if(norm(nextCity) !== norm(selectedCity)){
          sideAreaFilter = "";
        }

        selectedCity = nextCity;

        closeFilterMenus();
        render();
      };

    });

  /* -----------------------------------------------
     AREA
  ----------------------------------------------- */

  let areaSource = applyModeStatus(restaurants);

  if(selectedCity){
    areaSource = areaSource.filter(
      r => norm(rCity(r)) === norm(selectedCity)
    );
  }

  const areas = countValues(areaSource,rArea);

  if(
    sideAreaFilter &&
    !areas.some(area =>
      norm(area.label) === norm(sideAreaFilter)
    )
  ){
    sideAreaFilter = "";
  }

  areaFilterButtonText.textContent =
    sideAreaFilter
      ? `📍 ${sideAreaFilter}`
      : "📍 All Areas";

  areaFilterButton.classList.toggle(
    "active",
    Boolean(sideAreaFilter)
  );

  areaFilterMenu.innerHTML = `
    <button
      class="filter-menu-item ${!sideAreaFilter ? "active" : ""}"
      data-area-filter=""
      type="button"
    >
      <span>✓ All Areas</span>
      <span class="filter-menu-count">${areaSource.length}</span>
    </button>

    ${areas.map(area => `
      <button
        class="filter-menu-item ${
          norm(sideAreaFilter) === norm(area.label)
            ? "active"
            : ""
        }"
        data-area-filter="${esc(area.label)}"
        type="button"
      >
        <span>${esc(area.label)}</span>
        <span class="filter-menu-count">${area.count}</span>
      </button>
    `).join("")}
  `;

  areaFilterMenu
    .querySelectorAll("[data-area-filter]")
    .forEach(button => {

      button.onclick = () => {
        sideAreaFilter = button.dataset.areaFilter || "";
        closeFilterMenus();
        render();
      };

    });

  /* -----------------------------------------------
     FOOD
  ----------------------------------------------- */

  let foodSource = applyModeStatus(restaurants);

  if(selectedCity){
    foodSource = foodSource.filter(
      r => norm(rCity(r)) === norm(selectedCity)
    );
  }

  if(sideAreaFilter){
    foodSource = foodSource.filter(
      r => norm(rArea(r)) === norm(sideAreaFilter)
    );
  }

  const counts = {};

  FOOD_GROUPS.forEach(group => {
    counts[group.key] = 0;
  });

  foodSource.forEach(restaurant => {

    const key = foodGroup(restaurant);

    if(key && key in counts){
      counts[key] += 1;
    }
  });

  const available = FOOD_GROUPS.filter(
    group => counts[group.key] > 0
  );

  if(
    foodGroupFilter &&
    !available.some(group => group.key === foodGroupFilter)
  ){
    foodGroupFilter = "";
  }

  const selectedFood = FOOD_GROUPS.find(
    group => group.key === foodGroupFilter
  );

  foodFilterButtonText.textContent =
    selectedFood
      ? `${selectedFood.icon} ${selectedFood.label}`
      : "🍽️ All Food";

  foodFilterButton.classList.toggle(
    "active",

  );

            : ""
        }"
        data-food-filter="${group.key}"
        type="button"
      >
        <span>${group.icon} ${group.label}</span>
        <span class="filter-menu-count">${counts[group.key]}</span>
      </button>
    `).join("")}
  `;

  foodFilterMenu
    .querySelectorAll("[data-food-filter]")
    .forEach(button => {

      button.onclick = () => {
        foodGroupFilter = button.dataset.foodFilter || "";
        closeFilterMenus();
        render();
      };

    });
}

function toggleFilterMenu(button,menu,event){

  event.stopPropagation();

  closeFilterMenus();

  if(!opening) return;

  menu.hidden = false;
  button.setAttribute("aria-expanded","true");

  button
    .closest(".filter-select-wrap")
    ?.classList.add("filter-open");
}

function badges(r){

  let html = `
    <span class="badge">
      ${foodIcon(rCuisine(r))}
      ${esc(rCuisine(r))}
    </span>
  `;

  if(isPick(r)){
    html += `<span class="badge pick">⭐ Pick</span>`;
  }

  if(isFlexible(r)){
    html += `<span class="badge flex">🌙 Flexible</span>`;
  }

  if(isTop(r)){
    html += `<span class="badge top">🏆 Top 100</span>`;
  }

  if(isHot(r)){
    html += `<span class="badge hot">🔥 Hot</span>`;
  }

  if(isScheduled(r)){
    html += `<span class="badge scheduled">📅 Scheduled</span>`;
  }

  if(isEaten(r)){

    const when = eatenDate(r);

    html += `
      <span class="badge eaten">
        ✓ Eaten${when ? ` · ${esc(when)}` : ""}
      </span>
    `;
  }

  return html;
}

function renderMine(list){

  if(!list.length){

    results.innerHTML = `
      <div class="state">
        <strong>No restaurants here yet</strong>
        ${
          myFilter === "all"
            ? `Open Discover and tap <b>＋ My Food</b> on restaurants you want to remember.`
            : myFilter === "eaten"
              ? `Nothing marked as eaten yet.`
              : `No restaurants match this filter.`
        }
      </div>
    `;

    return;
  }

  if(myFilter !== "all"){
    results.innerHTML = list.map(cardHTML).join("");
    return;
  }

  const picks = list.filter(isPick);

  const scheduled = list.filter(
    r => isScheduled(r) && !isPick(r)
  );

  const flexible = list.filter(
    r =>
      isFlexible(r) &&
      !isPick(r) &&
      !isScheduled(r)
  );

  const saved = list.filter(
    r =>
      !isPick(r) &&
      !isFlexible(r) &&
      !isScheduled(r)
  );

  let html = "";

  if(picks.length){
    html += sectionHTML("⭐ PICKS",picks);
  }

  if(scheduled.length){
    html += sectionHTML("📅 SCHEDULED",scheduled);
  }

  if(flexible.length){
    html += sectionHTML("🌙 FLEXIBLE / MAYBE",flexible);
  }

  if(saved.length){
    html += sectionHTML("❤️ SAVED",saved);
  }

  results.innerHTML = html;
}

function renderDiscover(list){

  if(!list.length){

    results.innerHTML = `
      <div class="state">
        <strong>No restaurants found</strong>
        Try another city, area, food type or search.
      </div>
    `;

    return;
  }

  results.innerHTML = list.map(cardHTML).join("");
}

function render(){

  renderStatusRows();
  renderCompactFilters();

  const list = filteredRestaurants();

  if(activeTab === "mine"){
    renderMine(list);
  }else{
    renderDiscover(list);
  }
}

async function addToMyFood(restaurantId){

  if(!currentUser){
    window.location.href = "login.html";
    return;
  }

  try{

    const result = await db
      .from("trip_restaurants")
      .insert({
        trip_id:TRIP_ID,
        restaurant_id:restaurantId,
        is_pick:false,
        is_flexible:false,
        is_eaten:false,
        eaten_at:null
      })
      .select()
      .single();

    if(result.error) throw result.error;

    tripRestaurants.push(result.data);

    render();

  }catch(error){

    console.error(error);

    alert(
      error.message ||
      "Couldn't add restaurant."
    );
  }
}

   REMOVE
========================================================= */

async function removeFromMyFood(restaurantId){

  const restaurant = restaurants.find(
    item => Number(item.id) === Number(restaurantId)
  );

  if(!restaurant) return;

  const okay = confirm(
    `Remove "${restaurant.name}" from My Food?\n\nThe restaurant will stay in the master list.`
  );

  if(!okay) return;

  try{

    const result = await db
      .from("trip_restaurants")
      .delete()
      .eq("trip_id",TRIP_ID)
      .eq("restaurant_id",restaurantId);

    if(result.error) throw result.error;

    tripRestaurants = tripRestaurants.filter(
      item =>
        Number(item.restaurant_id) !==
        Number(restaurantId)
    );

    render();

  }catch(error){

    console.error(error);

    alert(
      error.message ||
      "Couldn't remove restaurant."
    );
  }
}

/* =========================================================

========================================================= */

let googlePlaceAutocomplete = null;
let selectedGoogleLatitude = null;
let selectedGoogleLongitude = null;

function setPlaceStatus(message,type=""){

  const el = document.getElementById("googlePlaceStatus");

  if(!el) return;

  el.textContent = message;
  el.className = `place-status ${type}`.trim();
}

function guessCuisine(types){

  const values = (types || []).map(norm);

  if(values.includes("ramen_restaurant")) return "Ramen";
  if(values.includes("sushi_restaurant")) return "Sushi";
  if(values.includes("japanese_restaurant")) return "Japanese";
  if(values.includes("seafood_restaurant")) return "Seafood";
  if(values.includes("cafe")) return "Cafe";
  if(values.includes("bakery")) return "Bakery";
  if(values.includes("bar")) return "Bar";
  if(values.includes("restaurant")) return "Restaurant";

  return "";
}

async function initGooglePlaces(){

  const host = document.getElementById("googlePlaceSearch");

  if(!host) return;

  try{

    setPlaceStatus("Loading Google Places…");

    if(
      typeof window.loadGoogleMaps !== "function" ||
      typeof window.getGooglePlaces !== "function" ||
      typeof window.createGooglePlaceAutocomplete !== "function" ||
      typeof window.getGooglePlaceDetails !== "function" ||
      typeof window.normalizeGooglePlace !== "function"
    ){
      throw new Error(
        "The Google Maps helper functions were not found."
      );
    }

    await window.loadGoogleMaps();
    await window.getGooglePlaces();

    googlePlaceAutocomplete =
      await window.createGooglePlaceAutocomplete(
        host,
        {
          placeholder:
            `Search restaurant${
              trip?.country
                ? " in " + trip.country
                : ""
            }...`
        }
      );

    googlePlaceAutocomplete.addEventListener(
      "gmp-select",
      async event => {

        try{

          setPlaceStatus("Getting place details…");

          const place =
            await window.getGooglePlaceDetails(event);

          const data =
            window.normalizeGooglePlace(place);

          selectedGoogleLatitude =
            data.latitude ?? null;

          selectedGoogleLongitude =
            data.longitude ?? null;

          document.getElementById("newName").value =
            data.name || "";

          document.getElementById("newCity").value =
            data.city || selectedCity || "";

          document.getElementById("newArea").value =
            data.area || "";

          document.getElementById("newLocation").value =
            data.address || "";

          document.getElementById("newMaps").value =
            data.maps_url || "";

          document.getElementById("newWebsite").value =
            data.website_url || "";

          const cuisineInput =
            document.getElementById("newCuisine");

          if(!cuisineInput.value.trim()){
            cuisineInput.value =
              guessCuisine(place.types || []);
          }

          setPlaceStatus(
            `✓ ${data.name || "Restaurant"} selected.`,
            "success"
          );

        }catch(error){

          console.error(
            "Google Places selection:",
            error
          );

          setPlaceStatus(
            "Google place error: " +
            (error.message || String(error)),
            "error"
          );
        }

      }
    );

    setPlaceStatus(
      "Search for a restaurant and select the correct Google result."
    );

  }catch(error){

    console.error(
      "Google Places init:",
      error
    );

    setPlaceStatus(
      "Google Places error: " +
      (error.message || String(error)),
      "error"
    );
  }
}

/* =========================================================
   ADD SHEET
========================================================= */

const addSheet = document.getElementById("addSheet");

document.getElementById("openAdd").onclick = () => {

  if(!currentUser){
    window.location.href = "login.html";
    return;
  }

  selectedGoogleLatitude = null;
  selectedGoogleLongitude = null;

  document.getElementById("newCity").value =
    selectedCity || "";

  addSheet.classList.add("open");
};

document.getElementById("closeAdd").onclick =
  closeAddSheet;

addSheet.onclick = event => {
  if(event.target === addSheet){
    closeAddSheet();
  }
};

function closeAddSheet(){
  addSheet.classList.remove("open");
}

/* =========================================================
   ADD FORM
========================================================= */

const addForm = document.getElementById("addForm");
const formMessage = document.getElementById("formMessage");

function showFormMessage(message,type){
  formMessage.textContent = message;
  formMessage.className = `form-message ${type}`;
}

addForm.addEventListener("submit",async event => {

  event.preventDefault();

  if(!currentUser){
    window.location.href = "login.html";
    return;
  }

  const saveBtn = document.getElementById("saveBtn");

  saveBtn.disabled = true;
  saveBtn.textContent = "SAVING…";
  formMessage.className = "form-message";

  try{

    const name =
      document.getElementById("newName").value.trim();

    const japanese =
      document.getElementById("newJapanese").value.trim();

    const city =
      document.getElementById("newCity").value.trim();

    const area =
      document.getElementById("newArea").value.trim();

    const location =
      document.getElementById("newLocation").value.trim();

    const cuisine =
      document.getElementById("newCuisine").value.trim();

    const ratingText =
      document.getElementById("newRating").value.trim();

    const price =
      document.getElementById("newPrice").value.trim();

    const tabelog =
      document.getElementById("newTabelog").value.trim();

    const maps =
      document.getElementById("newMaps").value.trim();

    const website =
      document.getElementById("newWebsite").value.trim();

    const description =
      document.getElementById("newDescription").value.trim();

    const addTrip =
      document.getElementById("newAddTrip").checked;

    const pick =
      document.getElementById("newPick").checked;

    const flexible =
      document.getElementById("newFlexible").checked;

    const duplicate = restaurants.find(
      restaurant =>
        norm(restaurant.name) === norm(name) &&
        norm(rCity(restaurant)) === norm(city)
    );

    if(duplicate){
      throw new Error(
        "This restaurant already appears to be in the master list. Find it in Discover and tap + My Food instead."
      );
    }

    let rating = null;

    if(ratingText){

      rating = Number(ratingText);

      if(Number.isNaN(rating)){
        throw new Error(
          "Tabelog rating must be a number."
        );
      }
    }

    const restaurantResult = await db
      .from("restaurants")
      .insert({
        name:name,
        name_japanese:japanese || null,
        cuisine:cuisine || null,
        country:trip?.country || null,
        city:city,
        area:area || null,
        location:location || null,
        description:description || null,
        price:price || null,
        tabelog_url:tabelog || null,
        maps_url:maps || null,
        website_url:website || null,
        rating:rating,
        latitude:selectedGoogleLatitude,
        longitude:selectedGoogleLongitude,
        status:"active",
        created_by:currentUser.id,
        verified:false
      })
      .select()
      .single();

    if(restaurantResult.error){
      throw restaurantResult.error;
    }

    const newRestaurant = restaurantResult.data;

    if(addTrip){

      const relationResult = await db
        .from("trip_restaurants")
        .insert({
          trip_id:TRIP_ID,
          restaurant_id:newRestaurant.id,
          is_pick:pick,
          is_flexible:flexible,
          is_eaten:false,
          eaten_at:null
        })
        .select()
        .single();

      if(relationResult.error){
        throw relationResult.error;
      }

      tripRestaurants.push(relationResult.data);
    }

    restaurants.push(newRestaurant);

    restaurants.sort(
      (a,b) =>
        text(a.name)
          .localeCompare(text(b.name))
    );

    showFormMessage(
      addTrip
        ? "Added to the restaurant list and My Food."
        : "Added to the restaurant list.",
      "success"
    );

    addForm.reset();

    selectedGoogleLatitude = null;
    selectedGoogleLongitude = null;

    document.getElementById("newAddTrip").checked = true;

    render();

    setTimeout(closeAddSheet,850);

  }catch(error){

    console.error(error);

    showFormMessage(
      error.message ||
      "Couldn't save restaurant.",
      "error"
    );

  }finally{

    saveBtn.disabled = false;
    saveBtn.textContent = "SAVE RESTAURANT";
  }
});
