<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Google Places JS Test</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #111;
      color: #fff;
      font-family: Arial, sans-serif;
      padding: 40px 20px;
    }

    .box {
      max-width: 700px;
      margin: 0 auto;
    }

    h1 {
      margin-bottom: 10px;
    }

    .subtitle {
      color: #aaa;
      margin-bottom: 25px;
    }

    #status {
      background: #222;
      border: 1px solid #333;
      padding: 20px;
      border-radius: 12px;
      line-height: 1.7;
      white-space: pre-wrap;
    }

    .success {
      color: #67e88f;
    }

    .error {
      color: #ff7070;
    }

    #searchSection {
      display: none;
      margin-top: 25px;
    }

    #googlePlaceSearch {
      margin-top: 12px;
    }

    #result {
      display: none;
      margin-top: 25px;
      background: #222;
      border: 1px solid #333;
      padding: 20px;
      border-radius: 12px;
      line-height: 1.7;
    }

    .label {
      color: #999;
      font-size: 12px;
      text-transform: uppercase;
      margin-top: 15px;
    }

    .value {
      margin-top: 3px;
      word-break: break-word;
    }
  </style>
</head>

<body>

<div class="box">

  <h1>🍜 Google Places JS Test</h1>

  <div class="subtitle">
    This test IS using google-maps.js
  </div>


  <div id="status">
    Starting test...
  </div>


  <div id="searchSection">

    <h2>🔎 Search Japan</h2>

    <p>
      Try searching for <strong>Yabaton Nagoya</strong>
    </p>

    <div id="googlePlaceSearch"></div>

  </div>


  <div id="result"></div>

</div>


<!-- =====================================================
     OUR SHARED GOOGLE MAPS FILE
===================================================== -->

<script src="google-maps.js"></script>


<script>

async function startTest() {

  const status =
    document.getElementById("status");

  const searchSection =
    document.getElementById("searchSection");

  const result =
    document.getElementById("result");


  try {

    // =================================================
    // TEST FUNCTIONS FROM google-maps.js
    // =================================================

    if (
      typeof window.loadGoogleMaps !== "function"
    ) {
      throw new Error(
        "loadGoogleMaps() was not found in google-maps.js"
      );
    }


    if (
      typeof window.getGooglePlaces !== "function"
    ) {
      throw new Error(
        "getGooglePlaces() was not found in google-maps.js"
      );
    }


    if (
      typeof window.createGooglePlaceAutocomplete !== "function"
    ) {
      throw new Error(
        "createGooglePlaceAutocomplete() was not found in google-maps.js"
      );
    }


    if (
      typeof window.getGooglePlaceDetails !== "function"
    ) {
      throw new Error(
        "getGooglePlaceDetails() was not found in google-maps.js"
      );
    }


    if (
      typeof window.normalizeGooglePlace !== "function"
    ) {
      throw new Error(
        "normalizeGooglePlace() was not found in google-maps.js"
      );
    }


    status.textContent =
      "✓ google-maps.js loaded\n" +
      "✓ Helper functions found\n\n" +
      "Loading Google Maps...";

    status.className = "success";


    // =================================================
    // LOAD GOOGLE
    // =================================================

    await window.loadGoogleMaps();


    status.textContent =
      "✓ google-maps.js loaded\n" +
      "✓ Helper functions found\n" +
      "✓ Google Maps loaded\n\n" +
      "Loading Places...";


    // =================================================
    // LOAD PLACES
    // =================================================

    await window.getGooglePlaces();


    status.textContent =
      "✓ google-maps.js loaded\n" +
      "✓ Helper functions found\n" +
      "✓ Google Maps loaded\n" +
      "✓ Google Places loaded\n\n" +
      "Creating autocomplete...";


    // =================================================
    // CREATE AUTOCOMPLETE
    // =================================================

    const autocomplete =
      await window.createGooglePlaceAutocomplete(
        document.getElementById(
          "googlePlaceSearch"
        ),
        {
          placeholder:
            "Search restaurant or place in Japan..."
        }
      );


    status.textContent =
      "✓ google-maps.js loaded\n" +
      "✓ Helper functions found\n" +
      "✓ Google Maps loaded\n" +
      "✓ Google Places loaded\n" +
      "✓ Autocomplete created\n" +
      "✓ Japan restriction applied\n\n" +
      "READY 🎉";

    status.className = "success";


    searchSection.style.display =
      "block";


    // =================================================
    // PLACE SELECTED
    // =================================================

    autocomplete.addEventListener(
      "gmp-select",
      async (event) => {

        try {

          status.textContent =
            "Place selected.\nFetching Google details...";


          const place =
            await window.getGooglePlaceDetails(
              event
            );


          const data =
            window.normalizeGooglePlace(
              place
            );


          console.log(
            "Google Place:",
            place
          );


          console.log(
            "Normalized:",
            data
          );


          status.textContent =
            "✓ Google Places working\n" +
            "✓ Place details fetched\n" +
            "✓ Address parsed\n\n" +
            "SUCCESS 🎉";

          status.className =
            "success";


          // =================================================
          // DISPLAY RESULT
          // =================================================

          result.style.display =
            "block";


          result.innerHTML = `

            <h2>✅ Selected Place</h2>


            <div class="label">
              Name
            </div>

            <div class="value">
              ${data.name || "-"}
            </div>


            <div class="label">
              Google Place ID
            </div>

            <div class="value">
              ${data.google_place_id || "-"}
            </div>


            <div class="label">
              Address
            </div>

            <div class="value">
              ${data.address || "-"}
            </div>


            <div class="label">
              City
            </div>

            <div class="value">
              ${data.city || "-"}
            </div>


            <div class="label">
              Area
            </div>

            <div class="value">
              ${data.area || "-"}
            </div>


            <div class="label">
              Prefecture
            </div>

            <div class="value">
              ${data.prefecture || "-"}
            </div>


            <div class="label">
              Latitude
            </div>

            <div class="value">
              ${data.latitude ?? "-"}
            </div>


            <div class="label">
              Longitude
            </div>

            <div class="value">
              ${data.longitude ?? "-"}
            </div>


            <div class="label">
              Google Maps URL
            </div>

            <div class="value">

              ${
                data.maps_url

                ? `<a
                     href="${data.maps_url}"
                     target="_blank"
                     style="color:#8ab4f8;"
                   >
                     Open Google Maps
                   </a>`

                : "-"
              }

            </div>


            <div class="label">
              Website
            </div>

            <div class="value">

              ${
                data.website_url

                ? `<a
                     href="${data.website_url}"
                     target="_blank"
                     style="color:#8ab4f8;"
                   >
                     ${data.website_url}
                   </a>`

                : "-"
              }

            </div>

          `;


        } catch (error) {

          console.error(error);

          status.textContent =
            "❌ PLACE DETAILS ERROR\n\n" +
            (error.message || error);

          status.className =
            "error";

        }

      }
    );


  } catch (error) {

    console.error(error);

    status.textContent =
      "❌ ERROR\n\n" +
      (error.message || error) +
      "\n\n" +
      "Check the browser console for more information.";

    status.className =
      "error";

  }

}


// =====================================================
// START
// =====================================================

startTest();

</script>

</body>
</html>
