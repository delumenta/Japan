<!doctype html>
<html lang="en">

<head>
<meta charset="utf-8">
<meta
  name="viewport"
  content="width=device-width, initial-scale=1, viewport-fit=cover"
>
<meta name="theme-color" content="#070c10">

<title>Food</title>

<style>
:root{
  --bg:#070c10; --surface:#0d1318; --surface-2:#11181e; --surface-3:#151d24;
  --line:#263039; --line-soft:rgba(255,255,255,.065);
  --text:#f5f3ef; --muted:#929ca4; --muted-2:#66727b;
  --red:#ff625f; --red-soft:rgba(255,98,95,.09); --red-line:rgba(255,98,95,.30);
  --gold:#e4bd69; --green:#79c995; --blue:#78a9ef;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0; min-height:100vh; color:var(--text);
  background:radial-gradient(circle at 50% -8%,rgba(42,56,68,.30),transparent 28%),var(--bg);
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased;
}
button,input,textarea{font:inherit}
button{-webkit-tap-highlight-color:transparent}

/* HEADER */
header{
  position:relative; z-index:40;
  border-bottom:1px solid var(--line-soft);
  background:linear-gradient(180deg,rgba(12,18,23,.99),rgba(7,12,16,.98));
}
.header-inner{width:100%;max-width:760px;margin:auto;padding:calc(14px + env(safe-area-inset-top)) 14px 0}
.title-row{display:flex;align-items:center;justify-content:space-between;gap:14px}
.title-row>div:first-child{min-width:0}
.eyebrow{margin-bottom:2px;color:var(--red);font-size:7px;font-weight:900;letter-spacing:.17em;text-transform:uppercase}
.food-page-title{display:flex;align-items:center;gap:9px;margin:0}
.food-page-title-icon{width:44px;height:44px;flex:0 0 44px;display:block;object-fit:contain}
.food-page-title span{font-family:Georgia,"Times New Roman",serif;font-size:27px;font-weight:700;line-height:1}
.trip-name{margin:3px 0 0 53px;overflow:hidden;color:var(--muted);font-size:8px;font-weight:600;text-overflow:ellipsis;white-space:nowrap}
.add-btn{
  flex:0 0 auto;min-height:36px;padding:7px 11px;border:1px solid var(--red-line);border-radius:10px;
  background:var(--red-soft);color:#f3b7b3;font-size:8px;font-weight:900;letter-spacing:.04em;cursor:pointer;
}
.add-btn:active{transform:scale(.95)}

/* MAIN TABS */
.main-tabs{display:grid;grid-template-columns:1fr 1fr;gap:0;margin-top:15px;border-bottom:1px solid var(--line)}
.main-tab{
  position:relative;min-height:40px;padding:7px 5px;border:0;background:transparent;color:#737f87;
  font-size:8px;font-weight:900;letter-spacing:.05em;cursor:pointer;
}
.main-tab::after{content:"";position:absolute;left:20%;right:20%;bottom:-1px;height:2px;border-radius:999px;background:transparent}
.main-tab.active{color:#fff}
.main-tab.active::after{background:var(--red);box-shadow:0 0 8px rgba(255,98,95,.28)}

/* FILTER PANEL */
.unified-filter-panel{
  position:sticky;top:0;z-index:75;margin:0 -14px;padding:8px 14px 9px;
  border-bottom:1px solid var(--line-soft);background:rgba(7,12,16,.96);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
}
.chips{
  display:flex;align-items:center;gap:5px;width:100%;margin:0 0 6px;padding:0 0 1px;
  overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;
}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto;min-height:27px;padding:4px 9px;border:1px solid var(--line);border-radius:999px;
  background:rgba(17,24,30,.80);color:#8d979e;font-size:7px;font-weight:850;white-space:nowrap;cursor:pointer;
}
.chip.active{border-color:var(--red-line);background:var(--red-soft);color:#f0c0bc}
.sticky-filter-bar{
  display:grid;
  grid-template-columns:minmax(0,.9fr) minmax(0,.9fr) minmax(0,1.45fr) 34px;
  align-items:center;
  gap:5px;
  width:100%;
  margin-top:2px;
  padding:0;
  border:0;
  background:transparent;
}
.filter-select-wrap{position:relative;min-width:0}
.filter-select-btn{
  width:100%;
  min-width:0;
  min-height:34px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:4px;
  padding:6px 7px;
  overflow:hidden;
  border:1px solid var(--line);
  border-radius:9px;
  background:#0f161c;
  color:#aeb6bc;
  font-size:7px;
  font-weight:850;
  cursor:pointer;
}
.filter-select-btn>span:first-child{
  min-width:0;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.filter-select-btn.active{border-color:var(--red-line);background:var(--red-soft);color:#f0c2bf}
.filter-chevron{flex:0 0 auto;color:#65717a;font-size:9px}
.filter-menu{
  position:absolute;
  top:calc(100% + 6px);
  left:0;
  z-index:130;
  width:max(100%,180px);
  max-height:290px;
  padding:5px;
  overflow-y:auto;
  border:1px solid var(--line);
  border-radius:11px;
  background:#0d1419;
  box-shadow:0 16px 40px rgba(0,0,0,.52);
}
.filter-menu[hidden]{display:none}
.filter-menu-item{
  width:100%;
  min-height:34px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  padding:6px 8px;
  border:0;
  border-radius:7px;
  background:transparent;
  color:#a6b0b7;
  font-size:8px;
  font-weight:800;
  text-align:left;
  cursor:pointer;
}
.filter-menu-item.active,.filter-menu-item:hover{background:var(--red-soft);color:#fff}
.filter-menu-count{color:#626f77;font-size:6px}
.quick-filter-wrap{
  min-width:0;
  min-height:34px;
  display:flex;
  align-items:center;
  gap:5px;
  padding:0 8px;
  border:1px solid var(--line);
  border-radius:9px;
  background:#0f161c;
}
.quick-filter-wrap:focus-within{border-color:var(--red-line);background:rgba(255,98,95,.035)}
.quick-filter-icon{flex:0 0 auto;opacity:.65;font-size:8px}
.quick-filter-input{
  width:100%;
  min-width:0;
  padding:0;
  border:0;
  outline:0;
  background:transparent;
  color:#e7e9e9;
  font-size:7px;
}
.quick-filter-input::placeholder{color:#626d75}
.clear-compact-filter{
  width:34px;
  min-width:34px;
  min-height:34px;
  padding:0;
  border:1px solid var(--line);
  border-radius:9px;
  background:#0f161c;
  color:#606c74;
  font-size:0;
  font-weight:900;
  cursor:pointer;
}
.clear-compact-filter::after{content:"✕";font-size:9px}
.clear-compact-filter.active{border-color:rgba(255,98,95,.22);color:#d9948f}

/* RETIRED EXPERIMENTAL FILTERS */
.food-side-filter,#foodSideFilter,.discover-area-row,#discoverAreaRow,#discoverControls,.discover-controls,
#browseChips,#discoverModeRow,.discover-mode,.discover-modes,.mode-tabs{display:none!important}

/* RESULTS */
main{width:100%;max-width:760px;margin:auto;padding:14px 14px 100px}
.result-head{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin:2px 1px 11px}
.result-title{font-family:Georgia,"Times New Roman",serif;font-size:19px;font-weight:700}
.result-count{padding-bottom:2px;color:#69757d;font-size:7px;font-weight:750}
.food-section{margin-bottom:20px}
.section-title{
  display:flex;align-items:center;gap:7px;margin:2px 1px 8px;padding-bottom:6px;border-bottom:1px solid var(--line-soft);
  color:#bfc5c9;font-size:8px;font-weight:900;letter-spacing:.07em;
}
.section-title span:last-child{margin-left:auto;color:#626e76;font-size:7px}

/* RESTAURANT CARDS */
.restaurant-card{
  position:relative;margin-bottom:8px;padding:11px 11px 9px;overflow:hidden;border:1px solid #252f37;border-radius:14px;
  background:linear-gradient(145deg,rgba(20,28,34,.97),rgba(12,18,23,.98));box-shadow:0 6px 18px rgba(0,0,0,.13);
}
.restaurant-card::before{
  content:"";position:absolute;top:0;left:13px;right:13px;height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.07),transparent);
}
.card-top{display:flex;align-items:flex-start;gap:9px}
.food-icon{
  width:34px;height:34px;flex:0 0 34px;display:flex;align-items:center;justify-content:center;
  border:1px solid rgba(255,98,95,.16);border-radius:10px;background:rgba(255,98,95,.055);font-size:16px;
}
.card-main{flex:1;min-width:0}
.restaurant-name{margin:0;color:#f8f7f4;font-size:12px;font-weight:850;line-height:1.25}
.japanese{margin-top:2px;color:#737f87;font-size:7.5px}
.location{margin-top:4px;color:#919ba2;font-size:7.5px;line-height:1.35}
.badges{display:flex;flex-wrap:wrap;gap:4px;margin-top:7px}
.badge{
  padding:2px 5px;border:1px solid rgba(255,255,255,.07);border-radius:999px;
  background:rgba(255,255,255,.025);color:#9ea8ae;font-size:6.5px;font-weight:800;
}
.badge.pick,.badge.top{border-color:rgba(228,189,105,.22);background:rgba(228,189,105,.055);color:#e4bd69}
.badge.flex{border-color:rgba(120,169,239,.20);background:rgba(120,169,239,.055);color:#a7c7f3}
.badge.hot{border-color:rgba(238,145,87,.22);background:rgba(238,145,87,.055);color:#efa875}
.badge.scheduled,.badge.eaten{border-color:rgba(121,201,149,.20);background:rgba(121,201,149,.055);color:#9edab3}
.restaurant-card.eaten-card{opacity:.62}
.meta{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.meta-item{padding:3px 6px;border:0;border-radius:6px;background:rgba(255,255,255,.035);color:#b4bcc1;font-size:7px;font-weight:750}
.plan-box{
  margin-top:8px;padding:6px 8px;border-left:2px solid rgba(121,201,149,.55);border-radius:2px 7px 7px 2px;
  background:rgba(121,201,149,.045);color:#9fd3b0;font-size:7px;font-weight:800;
}
.description{margin-top:8px;color:#8f999f;font-size:7.5px;line-height:1.5}
.actions{display:flex;align-items:center;flex-wrap:wrap;gap:4px;margin-top:9px;padding-top:8px;border-top:1px solid var(--line-soft)}
.action-btn{
  min-height:26px;display:inline-flex;align-items:center;justify-content:center;padding:4px 7px;
  border:1px solid rgba(255,98,95,.17);border-radius:7px;background:rgba(255,98,95,.035);
  color:#df8b86;text-decoration:none;font-size:6.5px;font-weight:900;cursor:pointer;
}
.action-btn.gold{border-color:rgba(228,189,105,.18);background:rgba(228,189,105,.035);color:#d9b86d}
.action-btn.green{border-color:rgba(121,201,149,.18);background:rgba(121,201,149,.035);color:#8fd0a6}
.action-btn.blue{border-color:rgba(120,169,239,.18);background:rgba(120,169,239,.035);color:#91b9ef}
.action-btn.muted{border-color:rgba(255,255,255,.07);background:rgba(255,255,255,.025);color:#79858c}
.state{
  padding:36px 18px;border:1px dashed #303b43;border-radius:14px;background:rgba(255,255,255,.012);
  color:#77838b;font-size:8px;line-height:1.6;text-align:center;
}
.state strong{display:block;margin-bottom:5px;color:#e8e7e3;font-family:Georgia,"Times New Roman",serif;font-size:14px;font-weight:700}

/* ADD RESTAURANT SHEET */
.sheet-backdrop,.more-backdrop{
  position:fixed;inset:0;z-index:150;display:none;align-items:flex-end;background:rgba(0,0,0,.72);
  backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);
}
.sheet-backdrop.open,.more-backdrop.open{display:flex}
.sheet,.more-sheet{
  width:100%;max-width:620px;max-height:calc(92vh - env(safe-area-inset-top));margin:auto auto 0;
  padding:8px 14px calc(18px + env(safe-area-inset-bottom));overflow-y:auto;border:1px solid var(--line);
  border-radius:20px 20px 0 0;background:#0c1217;box-shadow:0 -20px 50px rgba(0,0,0,.35);
}
.sheet-handle{width:36px;height:4px;margin:2px auto 13px;border-radius:999px;background:#35414a}
.sheet-head,.more-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.sheet-title,.more-title{font-family:Georgia,"Times New Roman",serif;font-size:19px}
.close-btn,.more-close{
  width:34px;height:34px;border:1px solid var(--line);border-radius:9px;background:#131b21;color:#fff;cursor:pointer;
}
.google-place-box{
  grid-column:1/-1;margin-bottom:3px;padding:10px;border:1px solid rgba(120,169,239,.18);
  border-radius:11px;background:rgba(120,169,239,.035);
}
.google-place-label{margin-bottom:7px;color:#8fa0ad;font-size:7px;font-weight:900;letter-spacing:.04em}
#googlePlaceSearch{width:100%}
#googlePlaceSearch gmp-place-autocomplete,gmp-place-autocomplete{width:100%;min-height:42px}
.place-status{margin-top:6px;color:#6f7d86;font-size:7px;line-height:1.4}
.place-status.success{color:#96d4ab}.place-status.error{color:#f2a4a0}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.field.full{grid-column:1/-1}
.field label{display:block;margin-bottom:4px;color:#8d989f;font-size:6.5px;font-weight:900;letter-spacing:.04em}
.field input,.field textarea{
  width:100%;min-height:40px;padding:8px 9px;border:1px solid var(--line);border-radius:9px;outline:0;
  background:#0f161c;color:#fff;font-size:9px;
}
.field textarea{min-height:76px;resize:vertical}
.field input:focus,.field textarea:focus{border-color:var(--red-line)}
.checks{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-top:10px}
.check{
  min-height:39px;display:flex;align-items:center;gap:6px;padding:6px 8px;border:1px solid var(--line);
  border-radius:9px;background:#10171d;color:#aab3b9;font-size:7px;font-weight:800;
}
.check input{width:14px;height:14px;accent-color:var(--red)}
.save-btn{
  width:100%;min-height:43px;margin-top:11px;border:1px solid var(--red-line);border-radius:10px;
  background:var(--red-soft);color:#f2b5b1;font-size:8px;font-weight:900;letter-spacing:.05em;cursor:pointer;
}
.save-btn:disabled{opacity:.45}
.form-message{display:none;margin-top:8px;padding:8px;border-radius:8px;font-size:8px}
.form-message.error{display:block;border:1px solid rgba(255,98,95,.20);background:rgba(255,98,95,.055);color:#f3aaa6}
.form-message.success{display:block;border:1px solid rgba(121,201,149,.20);background:rgba(121,201,149,.055);color:#9dd8b2}

/* MOBILE */
@media(max-width:650px){
  .header-inner{padding-left:12px;padding-right:12px}
  .unified-filter-panel{margin-left:-12px;margin-right:-12px;padding-left:12px;padding-right:12px}
  main{padding-left:12px;padding-right:12px}

  /* Keep Area + Food + Search + Clear on one row */
  .sticky-filter-bar{
    grid-template-columns:minmax(0,.82fr) minmax(0,.82fr) minmax(0,1.36fr) 30px;
    gap:4px;
  }

  .filter-select-btn{
    min-height:32px;
    padding:5px 6px;
    font-size:6.5px;
  }

  .filter-chevron{
    font-size:8px;
  }

  .quick-filter-wrap{
    grid-column:auto;
    grid-row:auto;
    min-height:32px;
    padding:0 6px;
  }

  .quick-filter-icon{
    font-size:7px;
  }

  .quick-filter-input{
    font-size:6.5px;
  }

  .clear-compact-filter{
    grid-column:auto;
    grid-row:auto;
    width:30px;
    min-width:30px;
    min-height:32px;
    padding:0;
  }
}
@media(max-width:430px){
  .food-page-title-icon{width:40px;height:40px;flex-basis:40px}
  .food-page-title span{font-size:25px}
  .trip-name{margin-left:49px}
  .add-btn{min-height:34px;padding:6px 9px}
  .restaurant-card{padding:10px}
  .checks{grid-template-columns:1fr}
}
@media(min-width:700px){
  .restaurant-card:hover{border-color:#35414a;transform:translateY(-1px)}
}

/* =========================================================
   PLAN VISUAL — SAFE CSS-ONLY OVERRIDE
   No Food HTML/JS structure changed.
========================================================= */

/* Plan-like framed app surface */
body{
  padding-top:14px;
}

header{
  width:calc(100% - 24px);
  max-width:720px;
  margin:0 auto;
  overflow:visible;
  border:1px solid #273139;
  border-bottom:0;
  border-radius:27px 27px 0 0;
  background:linear-gradient(180deg,#0a1116,#070d11);
  box-shadow:0 24px 65px rgba(0,0,0,.24);
}

/* Plan's subtle Japanese watermark, without changing markup */
header::before{
  content:"食";
  position:absolute;
  z-index:0;
  right:6px;
  top:7px;
  font-family:"Yu Mincho","Hiragino Mincho ProN","Noto Serif JP",Georgia,serif;
  font-size:126px;
  font-weight:700;
  line-height:1;
  color:var(--red);
  opacity:.042;
  pointer-events:none;
  user-select:none;
}

.header-inner{
  position:relative;
  z-index:2;
  width:100%;
  max-width:none;
  margin:0;
  padding:26px 20px 0;
}

.title-row{
  align-items:flex-start;
  gap:12px;
}

.eyebrow{
  margin-bottom:14px;
  color:#df7775;
  font-size:8px;
  font-weight:900;
  letter-spacing:.18em;
}

.food-page-title{
  gap:15px;
  align-items:center;
}

.food-page-title-icon{
  width:65px;
  height:65px;
  flex:0 0 65px;
  padding:10px;
  border:1px solid rgba(255,98,95,.30);
  border-radius:50%;
  background:#0b1217;
  object-fit:contain;
  opacity:.88;
}

.food-page-title span{
  color:#f7f4ee;
  font-family:Georgia,"Times New Roman",serif;
  font-size:41px;
  font-weight:700;
  letter-spacing:-.03em;
}

.trip-name{
  margin:8px 0 0 80px;
  max-width:350px;
  color:#89949c;
  font-size:9px;
  font-weight:500;
  line-height:1.4;
}

.add-btn{
  min-height:29px;
  padding:0 10px;
  border:1px solid rgba(255,98,95,.32);
  border-radius:9px;
  background:rgba(255,98,95,.07);
  color:#efaaa6;
  font-size:7px;
  font-weight:900;
}

/* Keep Food's own tabs and filters functional, just visually compact */
.main-tabs{
  margin-top:17px;
}

.unified-filter-panel{
  margin-left:-20px;
  margin-right:-20px;
  padding-left:20px;
  padding-right:20px;
}

/* Area + Food + Search + X stay in one row */
.sticky-filter-bar{
  display:grid;
  grid-template-columns:minmax(0,.82fr) minmax(0,.82fr) minmax(0,1.36fr) 30px;
  gap:4px;
  align-items:center;
}

.filter-select-btn,
.quick-filter-wrap,
.clear-compact-filter{
  min-height:32px;
  height:32px;
  border-radius:8px;
}

.filter-select-btn{
  padding:5px 6px;
  font-size:6.5px;
}

.quick-filter-wrap{
  grid-column:auto;
  grid-row:auto;
  padding:0 6px;
}

.quick-filter-input{
  font-size:6.5px;
}

.clear-compact-filter{
  grid-column:auto;
  grid-row:auto;
  width:30px;
  min-width:30px;
}

/* Continue the same framed surface around results */
main{
  width:calc(100% - 24px);
  max-width:720px;
  margin:0 auto 105px;
  padding:14px 20px 22px;
  border:1px solid #273139;
  border-top:0;
  border-radius:0 0 27px 27px;
  background:linear-gradient(180deg,#0a1116,#070d11);
}

/* Keep modal sheets above the app frame */
.sheet-backdrop,
.more-backdrop{
  z-index:150;
}

@media(max-width:430px){
  body{padding-top:9px}

  header,
  main{
    width:calc(100% - 18px);
  }

  .header-inner{
    padding-left:17px;
    padding-right:17px;
  }

  .unified-filter-panel{
    margin-left:-17px;
    margin-right:-17px;
    padding-left:17px;
    padding-right:17px;
  }

  .food-page-title-icon{
    width:60px;
    height:60px;
    flex-basis:60px;
    padding:9px;
  }

  .food-page-title span{
    font-size:38px;
  }

  .trip-name{
    margin-left:75px;
  }

  main{
    padding-left:17px;
    padding-right:17px;
  }
}


/* =========================================================
   SAVE SPACE — HIDE MY FOOD / DISCOVER NAV ROW
   CSS ONLY: existing HTML + JavaScript stay untouched.
========================================================= */
.tabs{
  display:none !important;
}


/* =========================================================
   EXTRA COMPACT FOOD VIEW
========================================================= */

/* Remove the remaining "My Food / Discover" heading + count row */
.result-head{
  display:none !important;
}

/* Pull results upward after removing the heading */
main{
  padding-top:7px !important;
}
#results{
  margin-top:0 !important;
}
.food-section{
  margin-bottom:12px !important;
}

/* =========================================================
   BASIC HELPERS
========================================================= */

function text(value){

  return String(
    value ?? ""
  );

}


function esc(value){

  return text(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


function norm(value){

  return text(value)
    .trim()
    .toLowerCase();

}


function unique(values){

  return [
    ...new Set(
      values
        .map(
          value =>
            text(value).trim()
        )
        .filter(Boolean)
    )
  ]
  .sort(
    (a,b) =>
      a.localeCompare(b)
  );

}


/* =========================================================
   ACCESSIBLE TRIPS
========================================================= */

async function getAccessibleTrips(){

  const {
    data:userData,
    error:userError
  } =
    await db.auth.getUser();


  if(userError){
    throw userError;
  }


  const user =
    userData?.user;


  if(!user){

    throw new Error(
      "You are not signed in."
    );

  }


  currentUser =
    user;


  /* OWNED */

  const ownedResult =
    await db
      .from("trips")
      .select("*")
      .eq(
        "owner_id",
        user.id
      );


  if(ownedResult.error){
    throw ownedResult.error;
  }


  /* SHARED */

  const memberResult =
    await db
      .from("trip_members")
      .select("trip_id")
      .eq(
        "user_id",
        user.id
      );


  if(memberResult.error){
    throw memberResult.error;
  }


  const sharedIds =
    [
      ...new Set(
        (memberResult.data || [])
          .map(
            row =>
              Number(row.trip_id)
          )
          .filter(
            Number.isFinite
          )
      )
    ];


  let sharedTrips = [];


  if(sharedIds.length){

    const sharedResult =
      await db
        .from("trips")
        .select("*")
        .in(
          "id",
          sharedIds
        );


    if(sharedResult.error){
      throw sharedResult.error;
    }


    sharedTrips =
      sharedResult.data || [];

  }


  /* COMBINE */

  const tripMap =
    new Map();


  (ownedResult.data || [])
    .forEach(
      item => {

        tripMap.set(
          Number(item.id),
          {
            ...item,
            __role:"owner"
          }
        );

      }
    );


  sharedTrips.forEach(
    item => {

      const id =
        Number(item.id);


      if(!tripMap.has(id)){

        tripMap.set(
          id,
          {
            ...item,
            __role:"member"
          }
        );

      }

    }
  );


  return [
    ...tripMap.values()
  ]
  .sort(
    (a,b) =>
      String(
        a.start_date || ""
      )
      .localeCompare(
        String(
          b.start_date || ""
        )
      )
  );

}


/* =========================================================
   RESOLVE CURRENT TRIP
========================================================= */

async function resolveTrip(){

  const accessibleTrips =
    await getAccessibleTrips();


  if(!accessibleTrips.length){

    throw new Error(
      "No trips are available for this account."
    );

  }


  /* No trip in URL */

  if(!TRIP_ID){

    TRIP_ID =
      Number(
        accessibleTrips[0].id
      );


    history.replaceState(
      {},
      "",
      `food.html?trip=${TRIP_ID}`
    );

  }


  const allowed =
    accessibleTrips.some(
      item =>
        Number(item.id) ===
        Number(TRIP_ID)
    );


  if(!allowed){

    TRIP_ID =
      Number(
        accessibleTrips[0].id
      );


    history.replaceState(
      {},
      "",
      `food.html?trip=${TRIP_ID}`
    );

  }


}

function rCity(r){

/* =========================================================
   FOOD ICON
========================================================= */

function foodIcon(value){

  const v =
    norm(value);


  if(v.includes("ramen"))
    return "🍜";

  if(v.includes("sushi"))
    return "🍣";

  if(v.includes("yakitori"))
    return "🍢";

  if(v.includes("chicken"))
    return "🍗";

  if(v.includes("oyakodon"))
    return "🍳";

  if(
    v.includes("udon") ||
    v.includes("soba")
  )
    return "🥢";

  if(v.includes("tonkatsu"))
    return "🐷";

  if(v.includes("unagi"))
    return "🐟";

  if(v.includes("tempura"))
    return "🍤";

  if(v.includes("curry"))
    return "🍛";

  if(v.includes("izakaya"))
    return "🍶";

  if(v.includes("gyoza"))
    return "🥟";

  if(v.includes("bakery"))
    return "🥐";

  if(v.includes("seafood"))
    return "🦐";


  return "🍽️";

}


/* =========================================================
   RELATIONS
========================================================= */

function relationFor(id){

  return tripRestaurants.find(
    item =>
      Number(item.restaurant_id)
      ===
      Number(id)
  );

}


function inMyFood(r){

  return Boolean(
    relationFor(r.id)
  );

}


function isPick(r){

  return Boolean(
    relationFor(r.id)
      ?.is_pick
  );

}


function isFlexible(r){

  return Boolean(
    relationFor(r.id)
      ?.is_flexible
  );

}


function isEaten(r){

  return Boolean(
    relationFor(r.id)
      ?.is_eaten
  );

}


function eatenDate(r){

  const value =
    relationFor(r.id)
      ?.eaten_at;

  if(!value){
    return "";
  }

  const d = new Date(value);

  if(Number.isNaN(d.getTime())){
    return "";
  }

  return new Intl.DateTimeFormat(
    "en-SG",
    {
      day:"numeric",
      month:"short"
    }
  )
  .format(d)
  .toUpperCase();

}


function scheduleFor(r){

  return scheduleRows
    .filter(
      item =>
        Number(item.restaurant_id)
        ===
        Number(r.id)
    )
    .sort(
      (a,b) =>
        String(
          a.schedule_date
        )
        .localeCompare(
          String(
            b.schedule_date
          )
        )
    );

}


function isScheduled(r){

  return (
    scheduleFor(r).length > 0
  );

}


/* =========================================================
   MASTER FLAGS
========================================================= */

function isTop(r){

  if(
    r.is_tabelog_top100 === true
  ){
    return true;
  }


  const award =
    norm(
      r.award ||
      r.recognition
    );


  return (
    award.includes("top 100") ||
    award.includes("top100")
  );

}


function isHot(r){

  if(
    r.is_hot === true
  ){
    return true;
  }


  return norm(
    r.award ||
    r.recognition
  )
  .includes(
    "hot restaurant"
  );

}


/* =========================================================
   DATE
========================================================= */

function formatScheduleDate(
  value
){

  if(!value){
    return "";
  }


  const d =
    new Date(
      value +
      "T12:00:00"
    );


  return new Intl.DateTimeFormat(
    "en-SG",
    {
      day:"numeric",
      month:"short"
    }
  )
  .format(d)
  .toUpperCase();

}


function formatTripDate(
  value
){

  if(!value){
    return "";
  }


  const d =
    new Date(
      value +
      "T12:00:00"
    );


  return d.toLocaleDateString(
    "en-SG",
    {
      day:"numeric",
      month:"short",
      year:"numeric"
    }
  );

}


/* =========================================================
   LOAD DATA
========================================================= */

async function loadData(){

  try{


    /* -----------------------------------------------
       RESOLVE USER + TRIP
    ----------------------------------------------- */

    await resolveTrip();


    /* -----------------------------------------------
       TRIP
    ----------------------------------------------- */

    const tripResult =
      await db
        .from("trips")
        .select("*")
        .eq(
          "id",
          TRIP_ID
        )
        .single();


    if(tripResult.error){
      throw tripResult.error;
    }


    trip =
      tripResult.data;


    tripName.textContent =
      trip.name ||
      "My Trip";


    tripEyebrow.textContent =
      trip.country
      ?
      `${trip.country} · TRIP FOOD`
      :
      "TRIP FOOD";


    document.title =
      `Food · ${
        trip.name ||
        "My Trip"
      }`;


    /* -----------------------------------------------
       MASTER RESTAURANTS
    ----------------------------------------------- */

    const restaurantResult =
      await db
        .from("restaurants")
        .select("*")
        .order(
          "name",
          {
            ascending:true
          }
        );


    if(
      restaurantResult.error
    ){
      throw restaurantResult.error;
    }


    restaurants =
      restaurantResult.data || [];


    /*
      If restaurants have a country field,
      only show the current country's
      restaurants.

      Old rows without a country are kept
      visible for backwards compatibility.
    */

    if(trip.country){

      const country =
        norm(trip.country);


      const matching =
        restaurants.filter(
          restaurant => {

            if(
              !restaurant.country
            ){
              return true;
            }


            return (
              norm(
                restaurant.country
              )
              ===
              country
            );

          }
        );


      restaurants =
        matching;

    }


    /* -----------------------------------------------
       MY FOOD
    ----------------------------------------------- */

    const relationResult =
      await db
        .from(
          "trip_restaurants"
        )
        .select("*")
        .eq(
          "trip_id",
          TRIP_ID
        );


    if(
      relationResult.error
    ){
      throw relationResult.error;
    }


    tripRestaurants =
      relationResult.data || [];


    /* -----------------------------------------------
       SCHEDULED FOOD
    ----------------------------------------------- */

    const scheduleResult =
      await db
        .from("schedule")
        .select(`
          id,
          restaurant_id,
          schedule_date,
          start_time,
          time_label,
          title,
          is_locked
        `)
        .eq(
          "trip_id",
          TRIP_ID
        )
        .not(
          "restaurant_id",
          "is",
          null
        );


    if(
      scheduleResult.error
    ){

      console.warn(
        "Schedule food:",
        scheduleResult.error
      );


      scheduleRows = [];

    }

    else{

      scheduleRows =
        scheduleResult.data || [];

    }


    createCityChips();

    createDiscoverChips();

    render();

  }

  catch(error){

    console.error(
      "Food load error:",
      error
    );


    tripEyebrow.textContent =
      "FOOD";


    tripName.textContent =
      "Could not load trip";


    results.innerHTML = `

      <div class="state">

        <strong>
          Couldn't load Food
        </strong>

        ${esc(
          error.message ||
          "Unknown database error."
        )}

      </div>

    `;

  }

}

/* =========================================================
   SEARCH MATCH
========================================================= */

function matchesSearch(r){

  if(!searchTerm){
    return true;
  }


  const value =
    norm(
      [

        r.name,
        rJapanese(r),
        rCuisine(r),
        rCity(r),
        rArea(r),
        rLocation(r),
        rDescription(r),
        r.award,
        r.recognition,
        rRating(r),
        rPrice(r)

      ]
      .join(" ")
    );


  return value.includes(
    searchTerm
  );

}


/* =========================================================
   FILTER
========================================================= */

function filteredRestaurants(){

  let list =
    restaurants.slice();


  if(
    activeTab === "mine"
  ){

    list =
      list.filter(
        inMyFood
      );


    if(
      myFilter === "eaten"
    ){

      list =
        list.filter(
          isEaten
        );

    }

    else{

      /*
        Eaten restaurants are archived from normal My Food views.
        They remain available under the EATEN filter.
      */

      list =
        list.filter(
          restaurant =>
            !isEaten(restaurant)
        );


      if(
        myFilter === "pick"
      ){

        list =
          list.filter(
            isPick
          );

      }


      if(
        myFilter === "flexible"
      ){

        list =
          list.filter(
            isFlexible
          );

      }


      if(
        myFilter === "scheduled"
      ){

        list =
          list.filter(
            isScheduled
          );

      }

    }

  }


  if(selectedCity){

    list =
      list.filter(
        restaurant =>
          norm(
            rCity(restaurant)
          )
          ===
          norm(selectedCity)
      );

  }


  if(activeTab === "discover" && discoverFilter){
    list = list.filter(
      restaurant =>
        norm(rArea(restaurant)) === norm(discoverFilter)
    );
  }


  if(activeTab === "discover"){

    if(discoverStatusFilter === "tabelog"){

      list =
        list.filter(
          hasTabelog
        );

    }


    if(discoverStatusFilter === "eaten"){

      list =
        list.filter(
          isEaten
        );

    }

  }


  if(sideAreaFilter){

    list =
      list.filter(
        restaurant =>
          norm(rArea(restaurant))
          ===
          norm(sideAreaFilter)
      );

  }


  if(foodGroupFilter){

    list =
      list.filter(
        restaurant =>
          foodGroup(restaurant)
          ===
          foodGroupFilter
      );

  }


  list =
    list.filter(
      matchesQuickFilter
    );


  list =
    list.filter(
      matchesSearch
    );


  return list;

}

function renderMine(list){

        </strong>

        ${
          myFilter === "all"

          ?

          `
            Open Discover and tap
            <b>＋ My Food</b>
            on restaurants you want to remember.
          `

          :

          myFilter === "eaten"

          ?

          `
            Nothing marked as eaten yet.
          `

          :

          `
            No restaurants match this filter.
          `
        }

      </div>

    `;


    return;

  }


  if(
    myFilter !== "all"
  ){

    results.innerHTML =
      list
        .map(cardHTML)
        .join("");


    return;

  }


  const picks =
    list.filter(
      isPick
    );


  const scheduled =
    list.filter(
      restaurant =>
        isScheduled(restaurant) &&
        !isPick(restaurant)
    );


  const flexible =
    list.filter(
      restaurant =>
        isFlexible(restaurant) &&
        !isPick(restaurant) &&
        !isScheduled(restaurant)
    );


  const saved =
    list.filter(
      restaurant =>
        !isPick(restaurant) &&
        !isFlexible(restaurant) &&
        !isScheduled(restaurant)
    );


  let html = "";


  if(picks.length){

    html += sectionHTML(
      "⭐ PICKS",
      picks
    );

  }


  if(scheduled.length){

    html += sectionHTML(
      "📅 SCHEDULED",
      scheduled
    );

  }


  if(flexible.length){

    html += sectionHTML(
      "🌙 FLEXIBLE / MAYBE",
      flexible
    );

  }


  if(saved.length){

    html += sectionHTML(
      "❤️ SAVED",
      saved
    );

  }


  results.innerHTML =
    html;

}

========================================================= */

async function removeFromMyFood(
  restaurantId
){

  const restaurant =
    restaurants.find(
      item =>
        Number(item.id)
        ===
        Number(restaurantId)
    );


  if(!restaurant){
    return;
  }


  const okay =
    confirm(
      `Remove "${restaurant.name}" from My Food?\n\nThe restaurant will stay in the master list.`
    );


  if(!okay){
    return;
  }


  try{

    const result =
      await db
        .from(
          "trip_restaurants"
        )
        .delete()
        .eq(
          "trip_id",
          TRIP_ID
        )
        .eq(
          "restaurant_id",
          restaurantId
        );


    if(result.error){
      throw result.error;
    }


    tripRestaurants =
      tripRestaurants.filter(
        item =>
          Number(
            item.restaurant_id
          )
          !==
          Number(
            restaurantId
          )
      );


    render();

  }

  catch(error){

    console.error(error);


    alert(
      error.message ||
      "Couldn't remove restaurant."
    );

  }

}

function guessCuisine(types){

  const values =
    (types || [])
      .map(norm);


  if(
    values.includes(
      "ramen_restaurant"
    )
  ){
    return "Ramen";
  }


  if(
    values.includes(
      "sushi_restaurant"
    )
  ){
    return "Sushi";
  }


  if(
    values.includes(
      "japanese_restaurant"
    )
  ){
    return "Japanese";
  }


  if(
    values.includes(
      "seafood_restaurant"
    )
  ){
    return "Seafood";
  }


  if(
    values.includes("cafe")
  ){
    return "Cafe";
  }


  if(
    values.includes("bakery")
  ){
    return "Bakery";
  }


  if(
    values.includes("bar")
  ){
    return "Bar";
  }


  if(
    values.includes("restaurant")
  ){
    return "Restaurant";
  }


  return "";

}


async function initGooglePlaces(){

  const host =
    document.getElementById(
      "googlePlaceSearch"
    );


  if(!host){
    return;
  }


  try{

    setPlaceStatus(
      "Loading Google Places…"
    );


    if(
      typeof window.loadGoogleMaps !== "function" ||
      typeof window.getGooglePlaces !== "function" ||
      typeof window.createGooglePlaceAutocomplete !== "function" ||
      typeof window.getGooglePlaceDetails !== "function" ||
      typeof window.normalizeGooglePlace !== "function"
    ){

      throw new Error(
        "The Google Maps helper functions were not found."
      );

    }


    await window.loadGoogleMaps();

    await window.getGooglePlaces();


    googlePlaceAutocomplete =
      await window
        .createGooglePlaceAutocomplete(
          host,
          {
            placeholder:
              `Search restaurant${
                trip?.country
                ?
                " in " + trip.country
                :
                ""
              }...`
          }
        );


    googlePlaceAutocomplete
      .addEventListener(
        "gmp-select",
        async event => {

          try{

            setPlaceStatus(
              "Getting place details…"
            );


            const place =
              await window
                .getGooglePlaceDetails(
                  event
                );


            const data =
              window
                .normalizeGooglePlace(
                  place
                );


            selectedGoogleLatitude =
              data.latitude ??
              null;


            selectedGoogleLongitude =
              data.longitude ??
              null;


            document.getElementById(
              "newName"
            ).value =
              data.name || "";


            document.getElementById(
              "newCity"
            ).value =
              data.city ||
              selectedCity ||
              "";


            document.getElementById(
              "newArea"
            ).value =
              data.area || "";


            document.getElementById(
              "newLocation"
            ).value =
              data.address || "";


            document.getElementById(
              "newMaps"
            ).value =
              data.maps_url || "";


            document.getElementById(

            &&
            norm(

            )
            ===

        );


      if(duplicate){

        );

      }


      /* -----------------------------------------------

      ----------------------------------------------- */

      let rating =
        null;


      if(ratingText){

          Number(
            ratingText
          );


        if(
          Number.isNaN(

          )
        ){

          );

            verified:

          .single();


      if(
        restaurantResult.error

      }


      const newRestaurant =
        restaurantResult.data;


      /* -----------------------------------------------
         ADD TO CURRENT TRIP
      ----------------------------------------------- */

      if(addTrip){

            )

              restaurant_id:

/* =========================================================
   NORMALIZED FOOD GROUPS
   Keep the database cuisine specific; only the UI is grouped.
========================================================= */

const FOOD_GROUPS = [
  { key:"sushi",    label:"SUSHI",    icon:"🍣" },
  { key:"noodles",  label:"NOODLES",  icon:"🍜" },
  { key:"yakitori", label:"YAKITORI", icon:"🍢" },
  { key:"katsu",    label:"KATSU",    icon:"🐷" },
  { key:"rice",     label:"RICE",     icon:"🍚" },
  { key:"tempura",  label:"TEMPURA",  icon:"🍤" },
  { key:"seafood",  label:"SEAFOOD",  icon:"🐟" },
  { key:"curry",    label:"CURRY",    icon:"🍛" },
  { key:"izakaya",  label:"IZAKAYA",  icon:"🍶" },
  { key:"cafe",     label:"CAFE",     icon:"☕" }
];


function foodGroup(restaurant){

  const value =
    norm(
      rCuisine(restaurant)
    );


  if(
    value.includes("sushi") ||
    value.includes("sashimi") ||
    value.includes("omakase")
  ){
    return "sushi";
  }


  if(
    value.includes("ramen") ||
    value.includes("udon") ||
    value.includes("soba") ||
    value.includes("noodle")
  ){
    return "noodles";
  }


  if(
    value.includes("yakitori") ||
    value.includes("kushiyaki") ||
    value.includes("chicken")
  ){
    return "yakitori";
  }


  if(
    value.includes("tonkatsu") ||
    value.includes("katsu")
  ){
    return "katsu";
  }


  if(
    value.includes("oyakodon") ||
    value.includes("donburi") ||
    value.includes("rice bowl") ||
    value.includes("rice")
  ){
    return "rice";
  }


  if(
    value.includes("tempura")
  ){
    return "tempura";
  }


  if(
    value.includes("unagi") ||
    value.includes("eel") ||
    value.includes("seafood") ||
    value.includes("fish")
  ){
    return "seafood";
  }


  if(
    value.includes("curry")
  ){
    return "curry";
  }


  if(
    value.includes("izakaya") ||
    value.includes("japanese pub")
  ){
    return "izakaya";
  }


  if(
    value.includes("cafe") ||
    value.includes("coffee") ||
    value.includes("dessert") ||
    value.includes("sweet") ||
    value.includes("wagashi") ||
    value.includes("bakery") ||
    value.includes("pastry")
  ){
    return "cafe";
  }


  return "";
}

/* =========================================================
   QUICK FILTER
   Matches restaurant name, Japanese name, city, area,
   cuisine/category and description.
========================================================= */

function matchesQuickFilter(restaurant){

  const q =
    norm(quickFilterTerm);

  if(!q){
    return true;
  }


  const haystack =
    [
      restaurant.name,
      restaurant.name_japanese,
      rCity(restaurant),
      rArea(restaurant),
      rCuisine(restaurant),
      restaurant.category,
      restaurant.description,
      restaurant.location
    ]
    .map(text)
    .join(" ");


  return norm(haystack).includes(q);

}

);

}


function seasonFromDate(value){

  if(!value){
    return "TRIP";
  }

  const d = new Date(value + "T12:00:00");
  const month = d.getMonth() + 1;

  if(month >= 3 && month <= 5){
    return "SPRING";
  }

  if(month >= 6 && month <= 8){
    return "SUMMER";
  }

  if(month >= 9 && month <= 11){
    return "AUTUMN";
  }

  return "WINTER";

}


function heroDateRange(){

  if(!trip?.start_date){
    return trip?.name || "My Trip";
  }

  const start = new Date(trip.start_date + "T12:00:00");
  const end = trip.end_date
    ? new Date(trip.end_date + "T12:00:00")
    : null;

  const startDay = start.getDate();
  const startMonth = start.toLocaleDateString("en-SG",{month:"short"}).toUpperCase();

  let dateText = `${startDay} ${startMonth}`;

  if(end){

    const endDay = end.getDate();
    const endMonth = end.toLocaleDateString("en-SG",{month:"short"}).toUpperCase();

    dateText =
      startMonth === endMonth
      ? `${startDay}–${endDay} ${startMonth}`
      : `${startDay} ${startMonth} – ${endDay} ${endMonth}`;

  }

  const label =
    text(trip.description).trim()
    ||
    text(trip.name).trim()
    ||
    "Trip food";

  return `${dateText} · ${label}`;

}


function updateFoodHero(){

  if(!trip){
    return;
  }

  const year = trip.start_date
    ? new Date(trip.start_date + "T12:00:00").getFullYear()
    : "";

  const country = text(trip.country || "TRAVEL").toUpperCase();
  const season = seasonFromDate(trip.start_date);

  tripEyebrow.textContent =
    [country, season, year]
      .filter(Boolean)
      .join(" · ");

  tripName.textContent = heroDateRange();

  const planSwitch = document.getElementById("planSwitch");

  if(planSwitch){
    planSwitch.href = `schedule.html?trip=${TRIP_ID}`;
  }

  const hero =
    text(trip.hero_image_url || trip.hero_image).trim()
    ||
    "travel-autumn-01.webp";

  document.documentElement.style.setProperty(
    "--food-hero-image",
    `url("${hero.replaceAll('"','%22')}")`
  );

}


/* =========================================================
   LARGE CITY CARDS
========================================================= */

function createCityChips(){

  const cities = unique(
    restaurants
      .map(rCity)
      .filter(Boolean)
  );

  cityChips.innerHTML = `

    <button
      class="city-card ${!selectedCity ? "active" : ""}"
      data-city=""
      type="button"
    >
      <span class="city-jp">食</span>
      <span class="city-en">All</span>
    </button>

    ${
      cities.map(
        city => `

          <button
            class="city-card ${norm(selectedCity) === norm(city) ? "active" : ""}"
            data-city="${esc(city)}"
            type="button"
          >
            <span class="city-jp">${esc(cityJapanese(city))}</span>
            <span class="city-en">${esc(city)}</span>
          </button>

        `
      )
      .join("")
    }

  `;

  cityChips
    .querySelectorAll("[data-city]")
    .forEach(
      button => {

        button.onclick = () => {

          selectedCity = button.dataset.city || "";
          discoverFilter = "";
          sideAreaFilter = "";
          foodGroupFilter = "";

/* =========================================================
   GROUPED CITY CARDS
========================================================= */

function groupHeading(list){

  const areas = unique(
    list
      .map(
        restaurant =>
          rArea(restaurant)
          ||
          rLocation(restaurant)
      )
      .filter(Boolean)
  );

  if(!areas.length){
    return "Food stops";
  }

  if(areas.length === 1){
    return areas[0];
  }

  if(areas.length === 2){
    return `${areas[0]}, ${areas[1]}`;
  }

  return `${areas[0]}, ${areas[1]} +${areas.length - 2}`;

}


function inlineScheduleBadges(r){

  const rows = scheduleFor(r);

  if(!rows.length){
    return "";
  }

  return rows.map(
    row => {

      const date = formatScheduleDate(row.schedule_date);

      const time =
        row.time_label
        ||
        (
          row.start_time
          ? row.start_time.slice(0,5)
          : ""
        );

      return `
        <span class="badge scheduled">
          ${esc(date)}${time ? ` · ${esc(time)}` : ""}${row.is_locked ? " · 🔒" : ""}
        </span>
      `;

    }
  )
  .join("");

}


function restaurantRowHTML(r){

  const relation = relationFor(r.id);

  const mapsURL =
    r.maps_url
    ||
    `https://www.google.com/maps/search/?api=1&query=${
      encodeURIComponent(
        [
          r.name,
          rCity(r),
          trip?.country || ""
        ]
        .filter(Boolean)
        .join(" ")
      )
    }`;

  const area =
    rArea(r)
    ||
    rLocation(r)
    ||
    rCity(r)
    ||
    "";

  return `

    <div class="restaurant-row ${isEaten(r) ? "eaten-row" : ""}">

      <div class="restaurant-area">
        ${esc(area)}
      </div>

      <div class="restaurant-rail">
        <span class="restaurant-dot"></span>
      </div>

      <div class="restaurant-content">

        <div class="restaurant-title-line">
          <span class="restaurant-utensil">♜</span>
          <span class="restaurant-name-new">${esc(r.name)}</span>
        </div>

        ${
          rJapanese(r)
          ?
          `<div class="restaurant-japanese-new">${esc(rJapanese(r))}</div>`
          :
          ""
        }

        <div class="restaurant-badges-new">

          <span class="badge">
            ${esc(rCuisine(r))}
          </span>

          ${
            rPrice(r)
            ? `<span class="badge price-badge">${esc(rPrice(r))}</span>`
            : ""
          }

          ${
            rRating(r)
            ? `<span class="badge rating-badge">${esc(rRating(r))}</span>`
            : ""
          }

          ${isPick(r) ? `<span class="badge pick">Pick</span>` : ""}
          ${isFlexible(r) ? `<span class="badge flex">Flex</span>` : ""}
          ${isEaten(r) ? `<span class="badge eaten">Eaten</span>` : ""}
          ${inlineScheduleBadges(r)}

        </div>

        ${
          rDescription(r)
          ?
          `<div class="restaurant-note-new">${esc(rDescription(r))}</div>`
          :
          ""
        }

        <div class="restaurant-actions-new">

          <a
            class="restaurant-action-link map"
            href="${esc(mapsURL)}"
            target="_blank"
            rel="noopener noreferrer"
          >
            ⌖ Map
          </a>

          ${
            r.tabelog_url
            ?
            `
              <a
                class="restaurant-action-link"
                href="${esc(r.tabelog_url)}"
                target="_blank"
                rel="noopener noreferrer"
              >
                ♕ Tabelog
              </a>
            `
            :
            ""
          }

          ${
            r.booking_url
            ?
            `
              <a
                class="restaurant-action-link green"
                href="${esc(r.booking_url)}"
                target="_blank"
                rel="noopener noreferrer"
              >
                Book
              </a>
            `
            :
            ""
          }

          ${
            relation
            ?
            `
              <button
                class="restaurant-action-link ${relation.is_pick ? "active" : ""}"
                type="button"
                onclick="togglePick(${Number(r.id)})"
              >
                ${relation.is_pick ? "Picked" : "Pick"}
              </button>

              <button
                class="restaurant-action-link ${relation.is_flexible ? "active" : ""}"
                type="button"
                onclick="toggleFlexible(${Number(r.id)})"
              >
                ${relation.is_flexible ? "Flex" : "Flexible"}
              </button>

              <button
                class="restaurant-action-link ${isEaten(r) ? "active" : ""}"
                type="button"
                onclick="toggleEaten(${Number(r.id)})"
              >
                ${isEaten(r) ? "Undo eaten" : "Eaten"}
              </button>

              ${
                !isScheduled(r) && !isEaten(r)
                ?
                `
                  <button
                    class="restaurant-action-link"
                    type="button"
                    onclick="removeFromMyFood(${Number(r.id)})"
                  >
                    Remove
                  </button>
                `
                :
                ""
              }
            `
            :
            `
              <button
                class="restaurant-action-link"
                type="button"
                onclick="addToMyFood(${Number(r.id)})"
              >
                Save to My Food
              </button>
            `
          }

        </div>

      </div>

    </div>

  `;

}


function cityGroupHTML(city,list){

  return `

    <section class="city-food-card">

      <div class="city-food-head">

        <div class="city-food-kicker">
          ${esc(city || "OTHER")} · ${String(list.length).padStart(2,"0")} ${list.length === 1 ? "TABLE" : "TABLES"}
        </div>

        <div class="city-food-title">
          ${esc(groupHeading(list))}
        </div>

        <div class="city-stamp" aria-hidden="true">
          ${esc(cityJapanese(city))}
        </div>

      </div>

      <div class="city-food-list">
        ${list.map(restaurantRowHTML).join("")}
      </div>

    </section>

  `;

}


function renderGroupedRestaurants(list,emptyCopy){

  if(!list.length){

    results.innerHTML = `
      <div class="state">
        <strong>No restaurants found</strong>
        ${emptyCopy || "Try another city, area, food type or search."}
      </div>
    `;

    return;

  }

  const groups = new Map();

  list.forEach(
    restaurant => {

      const city = rCity(restaurant) || "Other";

      if(!groups.has(city)){
        groups.set(city,[]);
      }

      groups.get(city).push(restaurant);

    }
  );

  const ordered = [...groups.entries()]
    .sort(
      (a,b) =>
        a[0].localeCompare(b[0])
    );

  results.innerHTML = ordered
    .map(
      ([city,items]) =>
        cityGroupHTML(city,items)
    )
    .join("");

}


function renderMine(list){

  renderGroupedRestaurants(
    list,
    myFilter === "eaten"
    ? "Nothing has been marked as eaten yet."
    : "Save restaurants from Discover and they will appear here."
  );

}


function renderDiscover(list){

  renderGroupedRestaurants(
    list,
    "Try another city, area, food type or search."
  );

}


function render(){

  updateFoodHero();
  renderCompactFilters();
  renderDiscoverArea();
  renderDiscoverStatus();

  const list = filteredRestaurants();

  resultCount.textContent =
    `${list.length} ${list.length === 1 ? "TABLE" : "TABLES"}`;

  if(activeTab === "mine"){
    resultTitle.textContent = "My Food";
    renderMine(list);
  }

  else{
    resultTitle.textContent = "Discover";
    renderDiscover(list);
  }

}
