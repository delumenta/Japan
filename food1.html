<!doctype html>
<html lang="en">

<head>
<meta charset="utf-8">
<meta
  name="viewport"
  content="width=device-width, initial-scale=1, viewport-fit=cover"
>
<meta name="theme-color" content="#070c10">

<title>Food</title>

<style>
:root{
  --bg:#070c10; --surface:#0d1318; --surface-2:#11181e; --surface-3:#151d24;
  --line:#263039; --line-soft:rgba(255,255,255,.065);
  --text:#f5f3ef; --muted:#929ca4; --muted-2:#66727b;
  --red:#ff625f; --red-soft:rgba(255,98,95,.09); --red-line:rgba(255,98,95,.30);
  --gold:#e4bd69; --green:#79c995; --blue:#78a9ef;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0; min-height:100vh; color:var(--text);
  background:radial-gradient(circle at 50% -8%,rgba(42,56,68,.30),transparent 28%),var(--bg);
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased;
}
button,input,textarea{font:inherit}
button{-webkit-tap-highlight-color:transparent}

/* HEADER */
header{
  position:relative; z-index:40;
  border-bottom:1px solid var(--line-soft);
  background:linear-gradient(180deg,rgba(12,18,23,.99),rgba(7,12,16,.98));
}
.header-inner{position:relative;z-index:2;padding:26px 20px 0;}
.add-btn:active{transform:scale(.95)}

/* MAIN TABS */
.main-tabs{display:grid;grid-template-columns:1fr 1fr;gap:0;margin-top:15px;border-bottom:1px solid var(--line)}
.main-tab{
  position:relative;min-height:40px;padding:7px 5px;border:0;background:transparent;color:#737f87;
  font-size:8px;font-weight:900;letter-spacing:.05em;cursor:pointer;
}
.main-tab::after{content:"";position:absolute;left:20%;right:20%;bottom:-1px;height:2px;border-radius:999px;background:transparent}
.main-tab.active{color:#fff}
.main-tab.active::after{background:var(--red);box-shadow:0 0 8px rgba(255,98,95,.28)}

/* FILTER PANEL */
.unified-filter-panel{
  position:sticky;
  top:0;
  z-index:75;
  margin:0 -14px;
  padding:8px 14px 9px;
  border-bottom:1px solid var(--line-soft);
  background:rgba(7,12,16,.96);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
}
.chips{
  display:flex;
  align-items:center;
  gap:5px;
  width:100%;
  margin:0 0 6px;
  padding:0 0 1px;
  overflow-x:auto;
  scrollbar-width:none;
  -webkit-overflow-scrolling:touch;
}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto;
  min-height:27px;
  padding:4px 9px;
  border:1px solid var(--line);
  border-radius:999px;
  background:rgba(17,24,30,.80);
  color:#8d979e;
  font-size:7px;
  font-weight:850;
  white-space:nowrap;
  cursor:pointer;
}
.chip.active{
  border-color:var(--red-line);
  background:var(--red-soft);
  color:#f0c0bc;
}

/* AREA + FOOD + SEARCH + CLEAR — ALWAYS ONE ROW */
.sticky-filter-bar{
  display:grid;
  grid-template-columns:minmax(72px,.85fr) minmax(72px,.85fr) minmax(100px,1.5fr) 32px;
  align-items:center;
  gap:5px;
  width:100%;
  margin-top:2px;
  padding:0;
  border:0;
  background:transparent;
}
.filter-select-wrap{position:relative;min-width:0}
.filter-select-btn{
  width:100%;
  min-width:0;
  height:34px;
  min-height:34px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:4px;
  padding:0 8px;
  overflow:hidden;
  border:1px solid var(--line);
  border-radius:9px;
  background:#0f161c;
  color:#aeb6bc;
  font-size:7px;
  font-weight:850;
  cursor:pointer;
}
.filter-select-btn>span:first-child{
  min-width:0;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.filter-select-btn.active{
  border-color:var(--red-line);
  background:var(--red-soft);
  color:#f0c2bf;
}
.filter-chevron{flex:0 0 auto;color:#65717a;font-size:8px}
.filter-menu{
  position:absolute;
  top:calc(100% + 6px);
  left:0;
  z-index:130;
  width:max(100%,180px);
  max-height:290px;
  padding:5px;
  overflow-y:auto;
  border:1px solid var(--line);
  border-radius:11px;
  background:#0d1419;
  box-shadow:0 16px 40px rgba(0,0,0,.52);
}
.filter-menu[hidden]{display:none}
.filter-menu-item{
  width:100%;
  min-height:34px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  padding:6px 8px;
  border:0;
  border-radius:7px;
  background:transparent;
  color:#a6b0b7;
  font-size:8px;
  font-weight:800;
  text-align:left;
  cursor:pointer;
}
.filter-menu-item.active,.filter-menu-item:hover{
  background:var(--red-soft);
  color:#fff;
}
.filter-menu-count{color:#626f77;font-size:6px}
.quick-filter-wrap{
  min-width:0;
  height:34px;
  min-height:34px;
  display:flex;
  align-items:center;
  gap:5px;
  padding:0 8px;
  border:1px solid var(--line);
  border-radius:9px;
  background:#0f161c;
}
.quick-filter-wrap:focus-within{
  border-color:var(--red-line);
  background:rgba(255,98,95,.035);
}
.quick-filter-icon{flex:0 0 auto;opacity:.65;font-size:8px}
.quick-filter-input{
  width:100%;
  min-width:0;
  padding:0;
  border:0;
  outline:0;
  background:transparent;
  color:#e7e9e9;
  font-size:7px;
}
.quick-filter-input::placeholder{color:#626d75}
.clear-compact-filter{
  width:32px;
  min-width:32px;
  height:34px;
  min-height:34px;
  padding:0;
  border:1px solid var(--line);
  border-radius:9px;
  background:#0f161c;
  color:#606c74;
  font-size:0;
  font-weight:900;
  cursor:pointer;
}
.clear-compact-filter::after{content:"✕";font-size:9px}
.clear-compact-filter.active{
  border-color:rgba(255,98,95,.22);
  color:#d9948f;
}

/* RETIRED EXPERIMENTAL FILTERS */
.food-side-filter,#foodSideFilter,.discover-area-row,#discoverAreaRow,#discoverControls,.discover-controls,
#browseChips,#discoverModeRow,.discover-mode,.discover-modes,.mode-tabs{display:none!important}

/* RESULTS */
main{width:100%;max-width:760px;margin:auto;padding:14px 14px 100px}
.result-head{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin:2px 1px 11px}
.result-title{font-family:Georgia,"Times New Roman",serif;font-size:19px;font-weight:700}
.result-count{padding-bottom:2px;color:#69757d;font-size:7px;font-weight:750}
.food-section{margin-bottom:20px}
.section-title{
  display:flex;align-items:center;gap:7px;margin:2px 1px 8px;padding-bottom:6px;border-bottom:1px solid var(--line-soft);
  color:#bfc5c9;font-size:8px;font-weight:900;letter-spacing:.07em;
}
.section-title span:last-child{margin-left:auto;color:#626e76;font-size:7px}

/* RESTAURANT CARDS */
.restaurant-card{
  position:relative;margin-bottom:8px;padding:11px 11px 9px;overflow:hidden;border:1px solid #252f37;border-radius:14px;
  background:linear-gradient(145deg,rgba(20,28,34,.97),rgba(12,18,23,.98));box-shadow:0 6px 18px rgba(0,0,0,.13);
}
.restaurant-card::before{
  content:"";position:absolute;top:0;left:13px;right:13px;height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.07),transparent);
}
.card-top{display:flex;align-items:flex-start;gap:9px}
.food-icon{
  width:34px;height:34px;flex:0 0 34px;display:flex;align-items:center;justify-content:center;
  border:1px solid rgba(255,98,95,.16);border-radius:10px;background:rgba(255,98,95,.055);font-size:16px;
}
.card-main{flex:1;min-width:0}
.restaurant-name{margin:0;color:#f8f7f4;font-size:12px;font-weight:850;line-height:1.25}
.japanese{margin-top:2px;color:#737f87;font-size:7.5px}
.location{margin-top:4px;color:#919ba2;font-size:7.5px;line-height:1.35}
.badges{display:flex;flex-wrap:wrap;gap:4px;margin-top:7px}
.badge{
  padding:2px 5px;border:1px solid rgba(255,255,255,.07);border-radius:999px;
  background:rgba(255,255,255,.025);color:#9ea8ae;font-size:6.5px;font-weight:800;
}
.badge.pick,.badge.top{border-color:rgba(228,189,105,.22);background:rgba(228,189,105,.055);color:#e4bd69}
.badge.flex{border-color:rgba(120,169,239,.20);background:rgba(120,169,239,.055);color:#a7c7f3}
.badge.hot{border-color:rgba(238,145,87,.22);background:rgba(238,145,87,.055);color:#efa875}
.badge.scheduled,.badge.eaten{border-color:rgba(121,201,149,.20);background:rgba(121,201,149,.055);color:#9edab3}
.restaurant-card.eaten-card{opacity:.62}
.meta{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.meta-item{padding:3px 6px;border:0;border-radius:6px;background:rgba(255,255,255,.035);color:#b4bcc1;font-size:7px;font-weight:750}
.plan-box{
  margin-top:8px;padding:6px 8px;border-left:2px solid rgba(121,201,149,.55);border-radius:2px 7px 7px 2px;
  background:rgba(121,201,149,.045);color:#9fd3b0;font-size:7px;font-weight:800;
}
.description{margin-top:8px;color:#8f999f;font-size:7.5px;line-height:1.5}
.actions{display:flex;align-items:center;flex-wrap:wrap;gap:4px;margin-top:9px;padding-top:8px;border-top:1px solid var(--line-soft)}
.action-btn{
  min-height:26px;display:inline-flex;align-items:center;justify-content:center;padding:4px 7px;
  border:1px solid rgba(255,98,95,.17);border-radius:7px;background:rgba(255,98,95,.035);
  color:#df8b86;text-decoration:none;font-size:6.5px;font-weight:900;cursor:pointer;
}
.action-btn.gold{border-color:rgba(228,189,105,.18);background:rgba(228,189,105,.035);color:#d9b86d}
.action-btn.green{border-color:rgba(121,201,149,.18);background:rgba(121,201,149,.035);color:#8fd0a6}
.action-btn.blue{border-color:rgba(120,169,239,.18);background:rgba(120,169,239,.035);color:#91b9ef}
.action-btn.muted{border-color:rgba(255,255,255,.07);background:rgba(255,255,255,.025);color:#79858c}
.state{
  padding:36px 18px;border:1px dashed #303b43;border-radius:14px;background:rgba(255,255,255,.012);
  color:#77838b;font-size:8px;line-height:1.6;text-align:center;
}
.state strong{display:block;margin-bottom:5px;color:#e8e7e3;font-family:Georgia,"Times New Roman",serif;font-size:14px;font-weight:700}

/* ADD RESTAURANT SHEET */
.sheet-backdrop,.more-backdrop{
  position:fixed;inset:0;z-index:150;display:none;align-items:flex-end;background:rgba(0,0,0,.72);
  backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);
}
.sheet-backdrop.open,.more-backdrop.open{display:flex}
.sheet,.more-sheet{
  width:100%;max-width:620px;max-height:calc(92vh - env(safe-area-inset-top));margin:auto auto 0;
  padding:8px 14px calc(18px + env(safe-area-inset-bottom));overflow-y:auto;border:1px solid var(--line);
  border-radius:20px 20px 0 0;background:#0c1217;box-shadow:0 -20px 50px rgba(0,0,0,.35);
}
.sheet-handle{width:36px;height:4px;margin:2px auto 13px;border-radius:999px;background:#35414a}
.sheet-head,.more-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.sheet-title,.more-title{font-family:Georgia,"Times New Roman",serif;font-size:19px}
.close-btn,.more-close{
  width:34px;height:34px;border:1px solid var(--line);border-radius:9px;background:#131b21;color:#fff;cursor:pointer;
}
.google-place-box{
  grid-column:1/-1;margin-bottom:3px;padding:10px;border:1px solid rgba(120,169,239,.18);
  border-radius:11px;background:rgba(120,169,239,.035);
}
.google-place-label{margin-bottom:7px;color:#8fa0ad;font-size:7px;font-weight:900;letter-spacing:.04em}
#googlePlaceSearch{width:100%}
#googlePlaceSearch gmp-place-autocomplete,gmp-place-autocomplete{width:100%;min-height:42px}
.place-status{margin-top:6px;color:#6f7d86;font-size:7px;line-height:1.4}
.place-status.success{color:#96d4ab}.place-status.error{color:#f2a4a0}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.field.full{grid-column:1/-1}
.field label{display:block;margin-bottom:4px;color:#8d989f;font-size:6.5px;font-weight:900;letter-spacing:.04em}
.field input,.field textarea{
  width:100%;min-height:40px;padding:8px 9px;border:1px solid var(--line);border-radius:9px;outline:0;
  background:#0f161c;color:#fff;font-size:9px;
}
.field textarea{min-height:76px;resize:vertical}
.field input:focus,.field textarea:focus{border-color:var(--red-line)}
.checks{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-top:10px}
.check{
  min-height:39px;display:flex;align-items:center;gap:6px;padding:6px 8px;border:1px solid var(--line);
  border-radius:9px;background:#10171d;color:#aab3b9;font-size:7px;font-weight:800;
}
.check input{width:14px;height:14px;accent-color:var(--red)}
.save-btn{
  width:100%;min-height:43px;margin-top:11px;border:1px solid var(--red-line);border-radius:10px;
  background:var(--red-soft);color:#f2b5b1;font-size:8px;font-weight:900;letter-spacing:.05em;cursor:pointer;
}
.save-btn:disabled{opacity:.45}
.form-message{display:none;margin-top:8px;padding:8px;border-radius:8px;font-size:8px}
.form-message.error{display:block;border:1px solid rgba(255,98,95,.20);background:rgba(255,98,95,.055);color:#f3aaa6}
.form-message.success{display:block;border:1px solid rgba(121,201,149,.20);background:rgba(121,201,149,.055);color:#9dd8b2}

/* MOBILE */
@media(max-width:650px){
  .header-inner{padding-left:12px;padding-right:12px}
  .unified-filter-panel{
    margin-left:-12px;
    margin-right:-12px;
    padding-left:12px;
    padding-right:12px;
  }
  main{padding-left:12px;padding-right:12px}

  .sticky-filter-bar{
    grid-template-columns:minmax(64px,.78fr) minmax(64px,.78fr) minmax(90px,1.45fr) 29px;
    gap:4px;
  }
  .filter-select-btn{
    height:32px;
    min-height:32px;
    padding:0 6px;
    font-size:6.4px;
    border-radius:8px;
  }
  .filter-chevron{font-size:7px}
  .quick-filter-wrap{
    grid-column:auto;
    grid-row:auto;
    height:32px;
    min-height:32px;
    padding:0 6px;
    gap:4px;
    border-radius:8px;
  }
  .quick-filter-icon{font-size:7px}
  .quick-filter-input{font-size:6.4px}
  .clear-compact-filter{
    grid-column:auto;
    grid-row:auto;
    width:29px;
    min-width:29px;
    height:32px;
    min-height:32px;
    border-radius:8px;
  }
  .clear-compact-filter::after{font-size:8px}
}
@media(max-width:430px){
  .food-page-title-icon{width:40px;height:40px;flex-basis:40px}
  .food-page-title span{color:#f7f4ee;font-size:41px;font-weight:700;letter-spacing:-.03em;}
@media(max-width:380px){
  .sticky-filter-bar{
    grid-template-columns:minmax(58px,.75fr) minmax(58px,.75fr) minmax(78px,1.35fr) 27px;
    gap:3px;
  }
  .filter-select-btn{padding:0 5px;font-size:6px}
  .quick-filter-wrap{padding:0 5px}
  .quick-filter-input{font-size:6px}
  .clear-compact-filter{width:27px;min-width:27px}
}
@media(min-width:700px){
  .restaurant-card:hover{border-color:#35414a;transform:translateY(-1px)}
}

@media(max-width:390px){
  .food-shell{width:calc(100% - 18px)}
  .header-inner{padding-left:17px;padding-right:17px}
  .food-page-title span{font-size:38px}
  .food-icon-wrap{width:60px;height:60px;flex-basis:60px}
  .food-page-title-icon{width:42px;height:42px}
  main{padding-left:14px;padding-right:14px}
}

</style>
</head>

<!-- =========================================================
     HEADER
========================================================= -->

<header>

<div class="header-inner">

  <div class="title-row">

    <div>

      <div
        id="tripEyebrow"
        class="eyebrow"
      >
        LOADING TRIP…
      </div>

      <h1 class="food-page-title">

        <span>Food</span>
      </h1>

      <div
        id="tripName"
        class="trip-name"
      >
        Loading trip…
      </div>

    </div>


    <button
      id="openAdd"
      class="add-btn"
      type="button"
    >
      ＋ ADD
    </button>

  </div>


  <div class="main-tabs">

    <button
      class="main-tab active"
      data-tab="mine"

    >

    </button>

    <button
      class="main-tab"
      data-tab="discover"
      type="button"
    >
      🔎 DISCOVER
    </button>

  </div>


  


  
<!-- =========================================================
     UNIFIED STICKY FILTER PANEL
========================================================= -->
<div id="unifiedFilterPanel" class="unified-filter-panel">
  <div
    id="cityChips"
    class="chips"
  ></div>

  <div
    id="myFilters"
    class="chips"
  >

    <button
      class="chip active"
      data-myfilter="all"
      type="button"
    >
      ALL
    </button>

    <button
      class="chip"
      data-myfilter="pick"
      type="button"

    </button>

    <button
      class="chip"
      data-myfilter="flexible"
      type="button"
    >
      🌙 FLEXIBLE
    </button>

    <button
      class="chip"
      data-myfilter="scheduled"
      type="button"

      📅 SCHEDULED

>

  </button>

  <button class="chip" data-discover-status="tabelog" type="button">

  </button>

  <button class="chip" data-discover-status="eaten" type="button">
    ✓ EATEN
  </button>
</div>

  <div
  id="stickyFilterBar"
  class="sticky-filter-bar"
>
  <div class="filter-select-wrap">

    <button
      id="areaFilterButton"
      class="filter-select-btn"
      type="button"
      aria-expanded="false"

  <div class="filter-select-wrap">

    >
      <span id="foodFilterButtonText">🍽️ All Food</span>
      <span class="filter-chevron">⌄</span>

    <div
      id="foodFilterMenu"
      class="filter-menu"
      hidden
    ></div>

  </div>


  <div class="quick-filter-wrap">

    <input
      id="quickFilterInput"

      autocomplete="off"
      placeholder="Search..."
      aria-label="Quick filter by restaurant, area, food or category"

  </div>


  <button
    id="clearCompactFilters"
    class="clear-compact-filter"
    type="button"
    title="Clear area, food and search filters"
  ></button>
</div>
</div>






  


  <div
    id="discoverControls"
    class="discover-controls"
    style="display:none !important"
    aria-hidden="true"
  >
    <div
      id="browseChips"
      class="chips"
      style="display:none !important"
    ></div>
  </div>

<div
  id="discoverAreaRow"
  class="chips discover-area-row"
  aria-hidden="true"
  style="display:none"
  aria-label="Area filter"
></div>


</div>

</header>


<!-- =========================================================
     RESULTS

/* =========================================================
   BASIC HELPERS
========================================================= */

function text(value){

  return String(
    value ?? ""
  );

}


function esc(value){

  return text(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


function norm(value){

  return text(value)
    .trim()
    .toLowerCase();

}


function unique(values){

  return [
    ...new Set(
      values
        .map(
          value =>
            text(value).trim()
        )
        .filter(Boolean)
    )
  ]
  .sort(
    (a,b) =>
      a.localeCompare(b)
  );

}


/* =========================================================
   ACCESSIBLE TRIPS
========================================================= */

async function getAccessibleTrips(){

  const {
    data:userData,
    error:userError
  } =
    await db.auth.getUser();


  if(userError){
    throw userError;
  }


  const user =
    userData?.user;


  if(!user){

    throw new Error(
      "You are not signed in."
    );

  }


  currentUser =
    user;


  /* OWNED */

  const ownedResult =
    await db
      .from("trips")
      .select("*")
      .eq(
        "owner_id",
        user.id
      );


  if(ownedResult.error){
    throw ownedResult.error;
  }


  /* SHARED */

  const memberResult =
    await db
      .from("trip_members")
      .select("trip_id")
      .eq(
        "user_id",
        user.id
      );


  if(memberResult.error){
    throw memberResult.error;
  }


  const sharedIds =
    [
      ...new Set(
        (memberResult.data || [])
          .map(
            row =>
              Number(row.trip_id)
          )
          .filter(
            Number.isFinite
          )
      )
    ];


  let sharedTrips = [];


  if(sharedIds.length){

    const sharedResult =
      await db
        .from("trips")
        .select("*")
        .in(
          "id",
          sharedIds
        );


    if(sharedResult.error){
      throw sharedResult.error;
    }


    sharedTrips =
      sharedResult.data || [];

  }


  /* COMBINE */

  const tripMap =
    new Map();


  (ownedResult.data || [])
    .forEach(
      item => {

        tripMap.set(
          Number(item.id),
          {
            ...item,
            __role:"owner"
          }
        );

      }
    );


  sharedTrips.forEach(
    item => {

      const id =
        Number(item.id);


      if(!tripMap.has(id)){

        tripMap.set(
          id,
          {
            ...item,
            __role:"member"
          }
        );

      }

    }
  );


  return [
    ...tripMap.values()
  ]
  .sort(
    (a,b) =>
      String(
        a.start_date || ""
      )
      .localeCompare(
        String(
          b.start_date || ""
        )
      )
  );

}


/* =========================================================
   RESOLVE CURRENT TRIP
========================================================= */

async function resolveTrip(){

  const accessibleTrips =
    await getAccessibleTrips();


  if(!accessibleTrips.length){

    throw new Error(
      "No trips are available for this account."
    );

  }


  /* No trip in URL */

  if(!TRIP_ID){

    TRIP_ID =
      Number(
        accessibleTrips[0].id
      );


    history.replaceState(
      {},
      "",
      `food.html?trip=${TRIP_ID}`
    );

  }


  const allowed =
    accessibleTrips.some(
      item =>
        Number(item.id) ===
        Number(TRIP_ID)
    );


  if(!allowed){

    TRIP_ID =
      Number(
        accessibleTrips[0].id
      );


    history.replaceState(
      {},
      "",
      `food.html?trip=${TRIP_ID}`
    );

  }


}


/* =========================================================
   RESTAURANT HELPERS
========================================================= */

function rCity(r){
  return r.city || "";
}

function rArea(r){
  return r.area || "";
}

function rCuisine(r){
  return r.cuisine || "Restaurant";
}

function rJapanese(r){
  return r.name_japanese || "";
}

function rRating(r){
  return r.rating ?? "";
}

function rPrice(r){

  return (
    r.price ||
    r.dinner_price ||
    r.lunch_price ||
    ""
  );

}

function rDescription(r){
  return r.description || "";
}

function rLocation(r){

  return (
    r.location ||
    r.area ||
    r.city ||
    ""
  );

}


/* =========================================================
   FOOD ICON
========================================================= */

function foodIcon(value){

  const v =
    norm(value);


  if(v.includes("ramen"))
    return "🍜";

  if(v.includes("sushi"))
    return "🍣";

  if(v.includes("yakitori"))
    return "🍢";

  if(v.includes("chicken"))
    return "🍗";

  if(v.includes("oyakodon"))
    return "🍳";

  if(
    v.includes("udon") ||
    v.includes("soba")
  )
    return "🥢";

  if(v.includes("tonkatsu"))
    return "🐷";

  if(v.includes("unagi"))
    return "🐟";

  if(v.includes("tempura"))
    return "🍤";

  if(v.includes("curry"))
    return "🍛";

  if(v.includes("izakaya"))
    return "🍶";

  if(v.includes("gyoza"))
    return "🥟";

  if(v.includes("bakery"))
    return "🥐";

  if(v.includes("seafood"))
    return "🦐";


  return "🍽️";

}


/* =========================================================
   RELATIONS
========================================================= */

function relationFor(id){

  return tripRestaurants.find(
    item =>
      Number(item.restaurant_id)
      ===
      Number(id)
  );

}


function inMyFood(r){

  return Boolean(
    relationFor(r.id)
  );

}


function isPick(r){

  return Boolean(
    relationFor(r.id)
      ?.is_pick
  );

}


function isFlexible(r){

  return Boolean(
    relationFor(r.id)
      ?.is_flexible
  );

}


function isEaten(r){

  return Boolean(
    relationFor(r.id)
      ?.is_eaten
  );

}


function eatenDate(r){

  const value =
    relationFor(r.id)
      ?.eaten_at;

  if(!value){
    return "";
  }

  const d = new Date(value);

  if(Number.isNaN(d.getTime())){
    return "";
  }

  return new Intl.DateTimeFormat(
    "en-SG",
    {
      day:"numeric",
      month:"short"
    }
  )
  .format(d)
  .toUpperCase();

}


function scheduleFor(r){

  return scheduleRows
    .filter(
      item =>
        Number(item.restaurant_id)
        ===
        Number(r.id)
    )
    .sort(
      (a,b) =>
        String(
          a.schedule_date
        )
        .localeCompare(
          String(
            b.schedule_date
          )
        )
    );

}


function isScheduled(r){

  return (
    scheduleFor(r).length > 0
  );

}


/* =========================================================
   MASTER FLAGS
========================================================= */

function isTop(r){

  if(
    r.is_tabelog_top100 === true
  ){
    return true;
  }


  const award =
    norm(
      r.award ||
      r.recognition
    );


  return (
    award.includes("top 100") ||
    award.includes("top100")
  );

}


function isHot(r){

  if(
    r.is_hot === true
  ){
    return true;
  }


  return norm(
    r.award ||
    r.recognition
  )
  .includes(
    "hot restaurant"
  );

}


/* =========================================================
   DATE
========================================================= */

function formatScheduleDate(
  value
){

  if(!value){
    return "";
  }


  const d =
    new Date(
      value +
      "T12:00:00"
    );


  return new Intl.DateTimeFormat(
    "en-SG",
    {
      day:"numeric",
      month:"short"
    }
  )
  .format(d)
  .toUpperCase();

}


function formatTripDate(
  value
){

  if(!value){
    return "";
  }


  const d =
    new Date(
      value +
      "T12:00:00"
    );


  return d.toLocaleDateString(
    "en-SG",
    {
      day:"numeric",
      month:"short",
      year:"numeric"
    }
  );

}


/* =========================================================
   LOAD DATA
========================================================= */

async function loadData(){

  try{


    /* -----------------------------------------------
       RESOLVE USER + TRIP
    ----------------------------------------------- */

    await resolveTrip();


    /* -----------------------------------------------
       TRIP
    ----------------------------------------------- */

    const tripResult =
      await db
        .from("trips")
        .select("*")
        .eq(
          "id",
          TRIP_ID
        )
        .single();


    if(tripResult.error){
      throw tripResult.error;
    }


    trip =
      tripResult.data;


    tripName.textContent =
      trip.name ||
      "My Trip";


    tripEyebrow.textContent =
      trip.country
      ?
      `${trip.country} · TRIP FOOD`
      :
      "TRIP FOOD";


    document.title =
      `Food · ${
        trip.name ||
        "My Trip"
      }`;


    /* -----------------------------------------------
       MASTER RESTAURANTS
    ----------------------------------------------- */

    const restaurantResult =
      await db
        .from("restaurants")
        .select("*")
        .order(
          "name",
          {
            ascending:true
          }
        );


    if(
      restaurantResult.error
    ){
      throw restaurantResult.error;
    }


    restaurants =
      restaurantResult.data || [];


    /*
      If restaurants have a country field,
      only show the current country's
      restaurants.

      Old rows without a country are kept
      visible for backwards compatibility.
    */

    if(trip.country){

      const country =
        norm(trip.country);


      const matching =
        restaurants.filter(
          restaurant => {

            if(
              !restaurant.country
            ){
              return true;
            }


            return (
              norm(
                restaurant.country
              )
              ===
              country
            );

          }
        );


      restaurants =
        matching;

    }


    /* -----------------------------------------------
       MY FOOD
    ----------------------------------------------- */

    const relationResult =
      await db
        .from(
          "trip_restaurants"
        )
        .select("*")
        .eq(
          "trip_id",
          TRIP_ID
        );


    if(
      relationResult.error
    ){
      throw relationResult.error;
    }


    tripRestaurants =
      relationResult.data || [];


    /* -----------------------------------------------
       SCHEDULED FOOD
    ----------------------------------------------- */

    const scheduleResult =
      await db
        .from("schedule")
        .select(`
          id,
          restaurant_id,
          schedule_date,
          start_time,
          time_label,
          title,
          is_locked
        `)
        .eq(
          "trip_id",
          TRIP_ID
        )
        .not(
          "restaurant_id",
          "is",
          null
        );


    if(
      scheduleResult.error
    ){

      console.warn(
        "Schedule food:",
        scheduleResult.error
      );


      scheduleRows = [];

    }

    else{

      scheduleRows =
        scheduleResult.data || [];

    }


    createCityChips();

    createDiscoverChips();

    render();

  }

  catch(error){

    console.error(
      "Food load error:",
      error
    );


    tripEyebrow.textContent =
      "FOOD";


    tripName.textContent =
      "Could not load trip";


    results.innerHTML = `

      <div class="state">

        <strong>
          Couldn't load Food
        </strong>

        ${esc(
          error.message ||
          "Unknown database error."
        )}

      </div>

    `;

  }

}

/* =========================================================
   DISCOVER CHIPS
========================================================= */

function discoverSource(){

  if(!selectedCity){
    return restaurants;
  }


  return restaurants.filter(
    restaurant =>
      norm(
        rCity(restaurant)
      )
      ===
      norm(selectedCity)
  );

}


function createDiscoverChips(){
  discoverFilter = "";
  if(browseChips){
    browseChips.innerHTML = "";
    browseChips.style.display = "none";
  }
}


/* =========================================================
   SEARCH MATCH
========================================================= */

function matchesSearch(r){

  if(!searchTerm){
    return true;
  }


  const value =
    norm(
      [

        r.name,
        rJapanese(r),
        rCuisine(r),
        rCity(r),
        rArea(r),
        rLocation(r),
        rDescription(r),
        r.award,
        r.recognition,
        rRating(r),
        rPrice(r)

      ]
      .join(" ")
    );


  return value.includes(
    searchTerm
  );

}


/* =========================================================
   FILTER
========================================================= */

function filteredRestaurants(){

  let list =
    restaurants.slice();


  if(
    activeTab === "mine"
  ){

    list =
      list.filter(
        inMyFood
      );


    if(
      myFilter === "eaten"
    ){

      list =
        list.filter(
          isEaten
        );

    }

    else{

      /*
        Eaten restaurants are archived from normal My Food views.
        They remain available under the EATEN filter.
      */

      list =
        list.filter(
          restaurant =>
            !isEaten(restaurant)
        );


      if(
        myFilter === "pick"
      ){

        list =
          list.filter(
            isPick
          );

      }


      if(
        myFilter === "flexible"
      ){

        list =
          list.filter(
            isFlexible
          );

      }


      if(
        myFilter === "scheduled"
      ){

        list =
          list.filter(
            isScheduled
          );

      }

    }

  }


  if(selectedCity){

    list =
      list.filter(
        restaurant =>
          norm(
            rCity(restaurant)
          )
          ===
          norm(selectedCity)
      );

  }


  if(activeTab === "discover" && discoverFilter){
    list = list.filter(
      restaurant =>
        norm(rArea(restaurant)) === norm(discoverFilter)
    );
  }


  if(activeTab === "discover"){

    if(discoverStatusFilter === "tabelog"){

      list =
        list.filter(
          hasTabelog
        );

    }


    if(discoverStatusFilter === "eaten"){

      list =
        list.filter(
          isEaten
        );

    }

  }


  if(sideAreaFilter){

    list =
      list.filter(
        restaurant =>
          norm(rArea(restaurant))
          ===
          norm(sideAreaFilter)
      );

  }


  if(foodGroupFilter){

    list =
      list.filter(
        restaurant =>
          foodGroup(restaurant)
          ===
          foodGroupFilter
      );

  }


  list =
    list.filter(
      matchesQuickFilter
    );


  list =
    list.filter(
      matchesSearch
    );


  return list;

}

  return rows.map(

        row.time_label ||

            5

      return `

function renderMine(list){

  if(!list.length){

    results.innerHTML = `

      <div class="state">

        <strong>
          No restaurants here yet
        </strong>

        ${
          myFilter === "all"

          ?

          `
            Open Discover and tap
            <b>＋ My Food</b>
            on restaurants you want to remember.
          `

          :

          myFilter === "eaten"

          ?

          `
            Nothing marked as eaten yet.
          `

          :

          `
            No restaurants match this filter.
          `
        }

      </div>

    `;


    return;

  }


  if(
    myFilter !== "all"
  ){

    results.innerHTML =
      list
        .map(cardHTML)
        .join("");


    return;

  }


  const picks =
    list.filter(
      isPick
    );


  const scheduled =
    list.filter(
      restaurant =>
        isScheduled(restaurant) &&
        !isPick(restaurant)
    );


  const flexible =
    list.filter(
      restaurant =>
        isFlexible(restaurant) &&
        !isPick(restaurant) &&
        !isScheduled(restaurant)
    );


  const saved =
    list.filter(
      restaurant =>
        !isPick(restaurant) &&
        !isFlexible(restaurant) &&
        !isScheduled(restaurant)
    );


  let html = "";


  if(picks.length){

    html += sectionHTML(
      "⭐ PICKS",
      picks
    );

  }


  if(scheduled.length){

    html += sectionHTML(
      "📅 SCHEDULED",
      scheduled
    );

  }


  if(flexible.length){

    html += sectionHTML(
      "🌙 FLEXIBLE / MAYBE",
      flexible
    );

  }


  if(saved.length){

    html += sectionHTML(
      "❤️ SAVED",
      saved
    );

  }


  results.innerHTML =
    html;

}

   REMOVE
========================================================= */

async function removeFromMyFood(
  restaurantId
){

  const restaurant =
    restaurants.find(
      item =>
        Number(item.id)
        ===
        Number(restaurantId)
    );


  if(!restaurant){
    return;
  }


  const okay =
    confirm(
      `Remove "${restaurant.name}" from My Food?\n\nThe restaurant will stay in the master list.`
    );


  if(!okay){
    return;
  }


  try{

    const result =
      await db
        .from(
          "trip_restaurants"
        )
        .delete()
        .eq(
          "trip_id",
          TRIP_ID
        )
        .eq(
          "restaurant_id",
          restaurantId
        );


    if(result.error){
      throw result.error;
    }


    tripRestaurants =
      tripRestaurants.filter(
        item =>
          Number(
            item.restaurant_id
          )
          !==
          Number(
            restaurantId
          )
      );


    render();

  }

  catch(error){

    console.error(error);


    alert(
      error.message ||
      "Couldn't remove restaurant."
    );

  }

}

let googlePlaceAutocomplete =
  null;

let selectedGoogleLatitude =
  null;

let selectedGoogleLongitude =
  null;


function setPlaceStatus(
  message,
  type=""
){

  const el =
    document.getElementById(
      "googlePlaceStatus"
    );


  if(!el){
    return;
  }


  el.textContent =
    message;


  el.className =
    `place-status ${type}`
      .trim();

}


function guessCuisine(types){

  const values =
    (types || [])
      .map(norm);


  if(
    values.includes(
      "ramen_restaurant"
    )
  ){
    return "Ramen";
  }


  if(
    values.includes(
      "sushi_restaurant"
    )
  ){
    return "Sushi";
  }


  if(
    values.includes(
      "japanese_restaurant"
    )
  ){
    return "Japanese";
  }


  if(
    values.includes(
      "seafood_restaurant"
    )
  ){
    return "Seafood";
  }


  if(
    values.includes("cafe")
  ){
    return "Cafe";
  }


  if(
    values.includes("bakery")
  ){
    return "Bakery";
  }


  if(
    values.includes("bar")
  ){
    return "Bar";
  }


  if(
    values.includes("restaurant")
  ){
    return "Restaurant";
  }


  return "";

}


async function initGooglePlaces(){

  const host =
    document.getElementById(
      "googlePlaceSearch"
    );


  if(!host){
    return;
  }


  try{

    setPlaceStatus(
      "Loading Google Places…"
    );


    if(
      typeof window.loadGoogleMaps !== "function" ||
      typeof window.getGooglePlaces !== "function" ||
      typeof window.createGooglePlaceAutocomplete !== "function" ||
      typeof window.getGooglePlaceDetails !== "function" ||
      typeof window.normalizeGooglePlace !== "function"
    ){

      throw new Error(
        "The Google Maps helper functions were not found."
      );

    }


    await window.loadGoogleMaps();

    await window.getGooglePlaces();


    googlePlaceAutocomplete =
      await window
        .createGooglePlaceAutocomplete(
          host,
          {
            placeholder:
              `Search restaurant${
                trip?.country
                ?
                " in " + trip.country
                :
                ""
              }...`
          }
        );


    googlePlaceAutocomplete
      .addEventListener(
        "gmp-select",
        async event => {

          try{

            setPlaceStatus(
              "Getting place details…"
            );


            const place =
              await window
                .getGooglePlaceDetails(
                  event
                );


            const data =
              window
                .normalizeGooglePlace(
                  place
                );


            selectedGoogleLatitude =
              data.latitude ??
              null;


            selectedGoogleLongitude =
              data.longitude ??
              null;


            document.getElementById(
              "newName"
            ).value =
              data.name || "";


            document.getElementById(
              "newCity"
            ).value =
              data.city ||
              selectedCity ||
              "";


            document.getElementById(
              "newArea"
            ).value =
              data.area || "";


            document.getElementById(
              "newLocation"
            ).value =
              data.address || "";


            document.getElementById(
              "newMaps"
            ).value =
              data.maps_url || "";


            document.getElementById(
              "newWebsite"
            ).value =
              data.website_url || "";


            const cuisineInput =
              document.getElementById(
                "newCuisine"
              );


            if(
              !cuisineInput
                .value
                .trim()
            ){

              cuisineInput.value =
                guessCuisine(
                  place.types || []
                );

            }


            setPlaceStatus(
              `✓ ${
                data.name ||
                "Restaurant"
              } selected.`,
              "success"
            );

          }

          catch(error){

            console.error(
              "Google Places selection:",
              error
            );


            setPlaceStatus(
              "Google place error: " +
              (
                error.message ||
                String(error)
              ),
              "error"
            );

          }

        }
      );


    setPlaceStatus(
      "Search for a restaurant and select the correct Google result."
    );

  }

  catch(error){

    console.error(
      "Google Places init:",
      error
    );


    setPlaceStatus(
      "Google Places error: " +
      (
        error.message ||
        String(error)
      ),
      "error"
    );

  }

}

            location:
              location || null,

            description:
              description || null,

            price:
              price || null,

            tabelog_url:
              tabelog || null,

            maps_url:
              maps || null,

            website_url:
              website || null,

            rating:
              rating,

            latitude:
              selectedGoogleLatitude,

            longitude:
              selectedGoogleLongitude,

            status:
              "active",

            created_by:
              currentUser.id,

            verified:
              false

          })
          .select()
          .single();


      if(
        restaurantResult.error
      ){

        throw restaurantResult.error;

      }


      const newRestaurant =
        restaurantResult.data;


      /* -----------------------------------------------
         ADD TO CURRENT TRIP
      ----------------------------------------------- */

      if(addTrip){

        const relationResult =
          await db
            .from(
              "trip_restaurants"
            )
            .insert({

              trip_id:
                TRIP_ID,

              restaurant_id:
                newRestaurant.id,

              is_pick:
                pick,

              is_flexible:
                flexible,

              is_eaten:
                false,

              eaten_at:
                null

            })
            .select()
            .single();


        if(
          relationResult.error
        ){

          throw relationResult.error;

        }


        tripRestaurants.push(
          relationResult.data
        );

      }


      restaurants.push(
        newRestaurant
      );


      restaurants.sort(
        (a,b) =>
          text(a.name)
            .localeCompare(
              text(b.name)
            )
      );


      showFormMessage(
        addTrip
        ?
        "Added to the restaurant list and My Food."
        :
        "Added to the restaurant list.",
        "success"
      );


      addForm.reset();


      selectedGoogleLatitude =
        null;


      selectedGoogleLongitude =
        null;


      document.getElementById(
        "newAddTrip"
      ).checked =
        true;


      createCityChips();

      createDiscoverChips();

      render();


      setTimeout(
        closeAddSheet,
        850
      );

    }

    catch(error){

      console.error(error);


      showFormMessage(
        error.message ||
        "Couldn't save restaurant.",
        "error"
      );

    }

    finally{

      saveBtn.disabled =
        false;


      saveBtn.textContent =
        "SAVE RESTAURANT";

    }

  }
);



/* =========================================================
   NORMALIZED FOOD GROUPS
   Keep the database cuisine specific; only the UI is grouped.
========================================================= */

const FOOD_GROUPS = [
  { key:"sushi",    label:"SUSHI",    icon:"🍣" },
  { key:"noodles",  label:"NOODLES",  icon:"🍜" },
  { key:"yakitori", label:"YAKITORI", icon:"🍢" },
  { key:"katsu",    label:"KATSU",    icon:"🐷" },
  { key:"rice",     label:"RICE",     icon:"🍚" },
  { key:"tempura",  label:"TEMPURA",  icon:"🍤" },
  { key:"seafood",  label:"SEAFOOD",  icon:"🐟" },
  { key:"curry",    label:"CURRY",    icon:"🍛" },
  { key:"izakaya",  label:"IZAKAYA",  icon:"🍶" },
  { key:"cafe",     label:"CAFE",     icon:"☕" }
];


function foodGroup(restaurant){

  const value =
    norm(
      rCuisine(restaurant)
    );


  if(
    value.includes("sushi") ||
    value.includes("sashimi") ||
    value.includes("omakase")
  ){
    return "sushi";
  }


  if(
    value.includes("ramen") ||
    value.includes("udon") ||
    value.includes("soba") ||
    value.includes("noodle")
  ){
    return "noodles";
  }


  if(
    value.includes("yakitori") ||
    value.includes("kushiyaki") ||
    value.includes("chicken")
  ){
    return "yakitori";
  }


  if(
    value.includes("tonkatsu") ||
    value.includes("katsu")
  ){
    return "katsu";
  }


  if(
    value.includes("oyakodon") ||
    value.includes("donburi") ||
    value.includes("rice bowl") ||
    value.includes("rice")
  ){
    return "rice";
  }


  if(
    value.includes("tempura")
  ){
    return "tempura";
  }


  if(
    value.includes("unagi") ||
    value.includes("eel") ||
    value.includes("seafood") ||
    value.includes("fish")
  ){
    return "seafood";
  }


  if(
    value.includes("curry")
  ){
    return "curry";
  }


  if(
    value.includes("izakaya") ||
    value.includes("japanese pub")
  ){
    return "izakaya";
  }


  if(
    value.includes("cafe") ||
    value.includes("coffee") ||
    value.includes("dessert") ||
    value.includes("sweet") ||
    value.includes("wagashi") ||
    value.includes("bakery") ||
    value.includes("pastry")
  ){
    return "cafe";
  }


  return "";
}

/* =========================================================
   DISCOVER AREA FILTER
   Area choices follow the selected city.
========================================================= */

function discoverAreaSource(){

  let source = restaurants.slice();


  if(selectedCity){

    source =
      source.filter(
        restaurant =>
          norm(rCity(restaurant))
          ===
          norm(selectedCity)
      );

  }


  if(discoverStatusFilter === "tabelog"){
    source = source.filter(hasTabelog);
  }


  if(discoverStatusFilter === "eaten"){
    source = source.filter(isEaten);
  }


  return source;

}


function renderDiscoverArea(){

  if(activeTab !== "discover"){

    discoverAreaRow.style.display = "none";
    sideAreaFilter = "";
    return;

  }


  const source =
    discoverAreaSource();


  const counts =
    new Map();


  source.forEach(
    restaurant => {

      const area =
        text(rArea(restaurant)).trim();


      if(!area){
        return;
      }


      const key =
        norm(area);


      if(!counts.has(key)){
        counts.set(
          key,
          {
            label:area,
            count:0
          }
        );
      }


      counts.get(key).count += 1;

    }
  );


  const areas =
    [...counts.values()]
      .sort(
        (a,b) =>
          a.label.localeCompare(b.label)
      );


  if(
    sideAreaFilter &&
    !areas.some(
      area =>
        norm(area.label)
        ===
        norm(sideAreaFilter)
    )
  ){
    sideAreaFilter = "";
  }


  discoverAreaRow.style.display = "none";


  discoverAreaRow.innerHTML = `

    <button
      class="chip ${!sideAreaFilter ? "active" : ""}"
      data-discover-area=""
      type="button"
    >
      📍 ALL AREAS
    </button>

    ${
      areas.map(
        area => `

          <button
            class="chip ${
              norm(sideAreaFilter)
              ===
              norm(area.label)
              ?
              "active"
              :
              ""
            }"
            data-discover-area="${esc(area.label)}"
            type="button"
            title="${esc(area.label)} · ${area.count}"
          >
            ${esc(area.label)}
          </button>

        `
      )
      .join("")
    }

  `;


  discoverAreaRow
    .querySelectorAll(
      "[data-discover-area]"
    )
    .forEach(
      button => {

        button.onclick =
          () => {

            sideAreaFilter =
              button.dataset.discoverArea
              ||
              "";


            render();

          };

      }
    );

}




/* =========================================================
   QUICK FILTER
   Matches restaurant name, Japanese name, city, area,
   cuisine/category and description.
========================================================= */

function matchesQuickFilter(restaurant){

  const q =
    norm(quickFilterTerm);

  if(!q){
    return true;
  }


  const haystack =
    [
      restaurant.name,
      restaurant.name_japanese,
      rCity(restaurant),
      rArea(restaurant),
      rCuisine(restaurant),
      restaurant.category,
      restaurant.description,
      restaurant.location
    ]
    .map(text)
    .join(" ");


  return norm(haystack).includes(q);

}


quickFilterInput.addEventListener(
  "input",
  () => {

    quickFilterTerm =
      quickFilterInput.value
        .trim();

    render();

  }
);



/* =========================================================
   COMPACT STICKY FILTER MENUS
========================================================= */

function compactAreaSource(){

  let source =
    activeTab === "mine"
    ?
    restaurants.filter(inMyFood)
    :
    restaurants.slice();


  if(selectedCity){

    source =
      source.filter(
        restaurant =>
          norm(rCity(restaurant))
          ===
          norm(selectedCity)
      );

  }


  if(activeTab === "mine"){

    if(myFilter === "eaten"){
      source = source.filter(isEaten);
    }

    else{

      source = source.filter(
        restaurant => !isEaten(restaurant)
      );

      if(myFilter === "pick"){
        source = source.filter(isPick);
      }

      if(myFilter === "flexible"){
        source = source.filter(isFlexible);
      }

      if(myFilter === "scheduled"){
        source = source.filter(isScheduled);
      }

    }

  }


  if(activeTab === "discover"){

    if(discoverStatusFilter === "tabelog"){
      source = source.filter(hasTabelog);
    }

    if(discoverStatusFilter === "eaten"){
      source = source.filter(isEaten);
    }

  }


  if(quickFilterTerm){
    source = source.filter(matchesQuickFilter);
  }


  return source;

}


function compactFoodSource(){

  let source =
    compactAreaSource();


  if(sideAreaFilter){

    source =
      source.filter(
        restaurant =>
          norm(rArea(restaurant))
          ===
          norm(sideAreaFilter)
      );

  }


  return source;

}


function renderCompactFilters(){

  const areaSource =
    compactAreaSource();


  const areaMap =
    new Map();


  areaSource.forEach(
    restaurant => {

      const area =
        text(rArea(restaurant)).trim();

      if(!area){
        return;
      }

      const key = norm(area);

      if(!areaMap.has(key)){
        areaMap.set(
          key,
          {label:area,count:0}
        );
      }

      areaMap.get(key).count += 1;

    }
  );


  const areas =
    [...areaMap.values()]
      .sort(
        (a,b) =>
          a.label.localeCompare(b.label)
      );


  if(
    sideAreaFilter &&
    !areas.some(
      area =>
        norm(area.label)
        ===
        norm(sideAreaFilter)
    )
  ){
    sideAreaFilter = "";
  }


  areaFilterButtonText.textContent =
    sideAreaFilter
    ?
    `📍 ${sideAreaFilter}`
    :
    "📍 All Areas";


  areaFilterButton.classList.toggle(
    "active",
    Boolean(sideAreaFilter)
  );


  areaFilterMenu.innerHTML = `

    <button
      class="filter-menu-item ${!sideAreaFilter ? "active" : ""}"
      data-compact-area=""
      type="button"
    >
      <span>✓ All Areas</span>
      <span class="filter-menu-count">${areaSource.length}</span>
    </button>

    ${
      areas.map(
        area => `

          <button
            class="filter-menu-item ${
              norm(sideAreaFilter)
              ===
              norm(area.label)
              ?
              "active"
              :
              ""
            }"
            data-compact-area="${esc(area.label)}"
            type="button"
          >
            <span>${esc(area.label)}</span>
            <span class="filter-menu-count">${area.count}</span>
          </button>

        `
      )
      .join("")
    }

  `;


  areaFilterMenu
    .querySelectorAll(
      "[data-compact-area]"
    )
    .forEach(
      button => {

        button.onclick =
          () => {

            sideAreaFilter =
              button.dataset.compactArea
              ||
              "";

            areaFilterMenu.hidden = true;
            areaFilterButton.setAttribute(
              "aria-expanded",
              "false"
            );

            render();

          };

      }
    );


  const foodSource =
    compactFoodSource();


  const counts = {};

  FOOD_GROUPS.forEach(
    group =>
      counts[group.key] = 0
  );


  foodSource.forEach(
    restaurant => {

      const key =
        foodGroup(restaurant);

      if(key && key in counts){
        counts[key] += 1;
      }

    }
  );


  const available =
    FOOD_GROUPS.filter(
      group =>
        counts[group.key] > 0
    );


  if(
    foodGroupFilter &&
    !available.some(
      group =>
        group.key === foodGroupFilter
    )
  ){
    foodGroupFilter = "";
  }


  const selectedFood =
    FOOD_GROUPS.find(
      group =>
        group.key === foodGroupFilter
    );


  foodFilterButtonText.textContent =
    selectedFood
    ?
    `${selectedFood.icon} ${selectedFood.label}`
    :
    "🍽️ All Food";


  foodFilterButton.classList.toggle(
    "active",
    Boolean(foodGroupFilter)
  );


  foodFilterMenu.innerHTML = `

    <button
      class="filter-menu-item ${!foodGroupFilter ? "active" : ""}"
      data-compact-food=""
      type="button"
    >
      <span>✓ All Food</span>
      <span class="filter-menu-count">${foodSource.length}</span>
    </button>

    ${
      available.map(
        group => `

          <button
            class="filter-menu-item ${
              foodGroupFilter === group.key
              ?
              "active"
              :
              ""
            }"
            data-compact-food="${group.key}"
            type="button"
          >
            <span>${group.icon} ${group.label}</span>
            <span class="filter-menu-count">${counts[group.key]}</span>
          </button>

        `
      )
      .join("")
    }

  `;


  foodFilterMenu
    .querySelectorAll(
      "[data-compact-food]"
    )
    .forEach(
      button => {

        button.onclick =
          () => {

            foodGroupFilter =
              button.dataset.compactFood
              ||
              "";

            foodFilterMenu.hidden = true;
            foodFilterButton.setAttribute(
              "aria-expanded",
              "false"
            );

            render();

          };

      }
    );


  clearCompactFilters.classList.toggle(
    "active",
    Boolean(
      sideAreaFilter ||
      foodGroupFilter ||
      quickFilterTerm
    )
  );

}


function closeCompactMenus(){

  areaFilterMenu.hidden = true;
  foodFilterMenu.hidden = true;

  areaFilterButton.setAttribute(
    "aria-expanded",
    "false"
  );

  foodFilterButton.setAttribute(
    "aria-expanded",
    "false"
  );

}


areaFilterButton.onclick =
  event => {

    event.stopPropagation();

    const opening =
      areaFilterMenu.hidden;

    closeCompactMenus();

    areaFilterMenu.hidden =
      !opening;

    areaFilterButton.setAttribute(
      "aria-expanded",
      String(opening)
    );

  };


foodFilterButton.onclick =
  event => {

    event.stopPropagation();

    const opening =
      foodFilterMenu.hidden;

    closeCompactMenus();

    foodFilterMenu.hidden =
      !opening;

    foodFilterButton.setAttribute(
      "aria-expanded",
      String(opening)
    );

  };


clearCompactFilters.onclick =
  () => {

    sideAreaFilter = "";
    foodGroupFilter = "";
    quickFilterTerm = "";
    quickFilterInput.value = "";

    closeCompactMenus();
    render();

  };


document.addEventListener(
  "click",
  event => {

    if(
      !stickyFilterBar.contains(
        event.target
      )
    ){
      closeCompactMenus();
    }

  }
);


document.addEventListener(
  "keydown",
  event => {

    if(event.key === "Escape"){
      closeCompactMenus();
    }

  }
);
