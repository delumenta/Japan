<!doctype html>
<html lang="en">

<head>
<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1, viewport-fit=cover"
>

<meta name="theme-color" content="#070c10">

<title>Plan · Travel</title>

<style>

:root{
  --bg:#070c10;
  --panel:#10161c;
  --panel2:#151c23;
  --line:#29323b;
  --text:#f5f5f3;
  --muted:#aeb5bc;
  --muted2:#74818a;
  --red:#c96f68;
  --blue:#5c9dff;
  --green:#67c587;
  --gold:#e3b85c;
}

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  min-height:100vh;

  background:
    radial-gradient(
      circle at 50% -10%,
      #17212a 0%,
      transparent 36%
    ),
    var(--bg);

  color:var(--text);

  font-family:
    Inter,
    ui-sans-serif,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
}

button,
input,
textarea,
select{
  font:inherit;
}


/* =========================================================
   HEADER
========================================================= */

header{
  position:sticky;
  top:0;
  z-index:40;

  padding:
    calc(10px + env(safe-area-inset-top))
    12px
    8px;

  border-bottom:1px solid var(--line);

  background:rgba(7,12,16,.97);

  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
}

.header-inner{
  max-width:760px;
  margin:auto;
}

.title-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.eyebrow{
  color:var(--red);
  font-size:8px;
  font-weight:900;
  letter-spacing:.14em;
  text-transform:uppercase;
}

h1{
  margin:2px 0 0;

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-size:23px;
  line-height:1.1;
}

.trip-name{
  margin-top:3px;
  color:var(--muted);
  font-size:8px;
}

.edit-btn{
  min-height:35px;
  padding:6px 10px;

  border:1px solid rgba(201,111,104,.35);
  border-radius:10px;

  background:rgba(201,111,104,.10);

  color:#f4d4d1;

  font-size:9px;
  font-weight:900;

  cursor:pointer;
}

.edit-btn.active{
  border-color:rgba(103,197,135,.35);
  background:rgba(103,197,135,.09);
  color:#aee5bf;
}


/* =========================================================
   DATE SCROLLER
========================================================= */

.date-scroller{
  display:flex;
  gap:5px;

  margin-top:9px;

  overflow-x:auto;
  padding-bottom:2px;

  scrollbar-width:none;
}

.date-scroller::-webkit-scrollbar{
  display:none;
}

.date-btn{
  flex:0 0 48px;

  min-height:49px;

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  padding:4px 2px;

  border:1px solid var(--line);
  border-radius:9px;

  background:#10171d;

  color:var(--muted);

  cursor:pointer;
}

.date-weekday{
  color:#6f7c85;
  font-size:6px;
  font-weight:900;
}

.date-number{
  margin:2px 0 1px;

  color:#fff;

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-size:18px;
  font-weight:800;

  line-height:1;
}

.date-month{
  font-size:6px;
  font-weight:900;
}

.date-btn.active{
  border-color:var(--red);
  background:rgba(201,111,104,.12);
}

.date-btn.active .date-weekday,
.date-btn.active .date-month{
  color:#d99b95;
}


/* =========================================================
   MAIN
========================================================= */

main{
  max-width:760px;
  margin:auto;

  padding:
    12px
    12px
    100px;
}


/* =========================================================
   DAY HEADER
========================================================= */

.day-head{
  margin-bottom:10px;
}

.day-date{
  color:var(--red);

  font-size:7px;
  font-weight:900;

  letter-spacing:.12em;
}

.day-title{
  margin-top:4px;

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-size:21px;
  font-weight:800;
}

.day-summary{
  margin-top:3px;

  color:var(--muted);

  font-size:8px;
}


/* =========================================================
   TIMELINE
========================================================= */

.timeline{
  border:1px solid var(--line);
  border-radius:14px;

  padding:7px 11px;

  background:
    linear-gradient(
      145deg,
      #121a20,
      #0c1217
    );
}

.timeline-row{
  position:relative;

  display:grid;

  grid-template-columns:
    72px
    16px
    1fr
    auto;

  gap:7px;

  min-height:47px;

  padding:7px 0;
}

.timeline-row:not(:last-child)::after{
  content:"";

  position:absolute;

  left:80px;
  top:30px;
  bottom:-8px;

  width:1px;

  background:#26323a;
}

.timeline-time{
  padding-top:2px;

  color:#9bb8d0;

  font-size:8px;
  font-weight:900;

  line-height:1.25;
}

.marker{
  position:relative;
  z-index:2;

  display:flex;
  justify-content:center;
}

.dot{
  width:8px;
  height:8px;

  margin-top:4px;

  border:2px solid #172029;
  border-radius:50%;

  background:var(--red);

  box-shadow:
    0 0 0 1px
    rgba(201,111,104,.35);
}

.item-main{
  min-width:0;
}

.item-title{
  color:#f2f2f0;

  font-size:9px;
  font-weight:900;

  line-height:1.3;
}

.item-title a{
  color:inherit;
  text-decoration:none;
}

.item-location{
  margin-top:2px;

  color:#77858f;

  font-size:7px;
}

.item-note{
  margin-top:3px;

  color:#9fa9af;

  font-size:7px;
  line-height:1.4;
}

.optional{
  display:inline-block;

  margin-left:4px;

  padding:1px 4px;

  border:1px solid rgba(227,184,92,.22);
  border-radius:999px;

  color:var(--gold);

  font-size:6px;
}

.locked{
  display:inline-block;

  margin-left:4px;

  padding:1px 4px;

  border:1px solid rgba(103,197,135,.22);
  border-radius:999px;

  color:#aee5bf;

  font-size:6px;
}

.row-edit{
  display:none;

  width:28px;
  height:28px;

  align-items:center;
  justify-content:center;

  border:1px solid var(--line);
  border-radius:8px;

  background:#151c22;

  color:#c6cdd2;

  cursor:pointer;
}

.editing .row-edit{
  display:flex;
}


/* =========================================================
   ADD
========================================================= */

.add-row{
  display:none;
  margin-top:8px;
}

.editing .add-row{
  display:block;
}

.add-item-btn{
  width:100%;

  min-height:41px;

  border:1px dashed rgba(201,111,104,.42);
  border-radius:11px;

  background:rgba(201,111,104,.06);

  color:#e2a19b;

  font-size:8px;
  font-weight:900;

  cursor:pointer;
}


/* =========================================================
   STATE
========================================================= */

.state{
  padding:28px 16px;

  border:1px dashed #35414a;
  border-radius:14px;

  text-align:center;

  color:var(--muted);

  font-size:9px;
  line-height:1.55;
}

.state strong{
  display:block;

  margin-bottom:4px;

  color:#fff;

  font-size:12px;
}


/* =========================================================
   SHEETS
========================================================= */

.sheet-backdrop,
.more-backdrop,
.trip-backdrop{
  position:fixed;

  inset:0;

  display:none;
  align-items:flex-end;

  background:rgba(0,0,0,.70);

  backdrop-filter:blur(4px);
  -webkit-backdrop-filter:blur(4px);
}

.sheet-backdrop{
  z-index:100;
}

.more-backdrop{
  z-index:150;
}

.trip-backdrop{
  z-index:170;
}

.sheet-backdrop.open,
.more-backdrop.open,
.trip-backdrop.open{
  display:flex;
}

.sheet,
.more-sheet,
.trip-sheet{
  width:100%;

  max-height:
    calc(92vh - env(safe-area-inset-top));

  overflow-y:auto;

  padding:
    8px
    14px
    calc(18px + env(safe-area-inset-bottom));

  border:1px solid var(--line);

  border-radius:
    20px
    20px
    0
    0;

  background:#0d1318;
}

.more-sheet,
.trip-sheet{
  max-width:760px;
  margin:0 auto;
}

.sheet-handle{
  width:38px;
  height:4px;

  margin:
    2px
    auto
    12px;

  border-radius:999px;

  background:#39454d;
}

.sheet-head,
.more-head{
  display:flex;
  align-items:center;
  justify-content:space-between;

  gap:10px;

  margin-bottom:12px;
}

.sheet-title,
.more-title{
  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-size:19px;
}

.close-btn,
.more-close{
  width:34px;
  height:34px;

  border:1px solid var(--line);
  border-radius:9px;

  background:#151c22;

  color:#fff;

  cursor:pointer;
}


/* =========================================================
   TYPE
========================================================= */

.type-grid{
  display:grid;

  grid-template-columns:
    repeat(3,1fr);

  gap:5px;

  margin-bottom:11px;
}

.type-btn{
  min-height:42px;

  border:1px solid var(--line);
  border-radius:9px;

  background:#11181e;

  color:var(--muted);

  font-size:8px;
  font-weight:900;

  cursor:pointer;
}

.type-btn.active{
  border-color:rgba(201,111,104,.5);
  background:rgba(201,111,104,.11);
  color:#fff;
}


/* =========================================================
   ENTITY PICKER
========================================================= */

.entity-picker{
  grid-column:1/-1;

  border:1px solid rgba(92,157,255,.20);
  border-radius:12px;

  padding:10px;

  background:rgba(92,157,255,.045);
}

.entity-picker-title{
  color:#dce9f6;

  font-size:8px;
  font-weight:900;

  margin-bottom:3px;
}

.entity-picker-sub{
  color:#74818a;

  font-size:6.5px;
  line-height:1.45;

  margin-bottom:8px;
}

.entity-search-wrap{
  position:relative;
}

.entity-search{
  width:100%;

  min-height:43px;

  padding:
    9px
    38px
    9px
    10px;

  border:1px solid var(--line);
  border-radius:10px;

  outline:none;

  background:#0d1419;

  color:#fff;

  font-size:10px;
}

.entity-search:focus{
  border-color:var(--blue);
}

.search-icon{
  position:absolute;

  right:12px;
  top:50%;

  transform:translateY(-50%);

  color:#76838d;

  pointer-events:none;
}

.entity-results{
  display:none;

  margin-top:6px;

  overflow:hidden;

  border:1px solid var(--line);
  border-radius:10px;

  background:#0d1419;
}

.entity-results.show{
  display:block;
}

.entity-result{
  width:100%;

  display:flex;
  align-items:center;

  gap:9px;

  padding:10px;

  border:0;
  border-bottom:1px solid rgba(255,255,255,.055);

  background:transparent;

  color:#fff;

  text-align:left;

  cursor:pointer;
}

.entity-result:last-child{
  border-bottom:0;
}

.entity-result:active{
  background:rgba(255,255,255,.04);
}

.entity-result-icon{
  flex:0 0 27px;

  width:27px;
  height:27px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:8px;

  background:#151d23;

  font-size:14px;
}

.entity-result-main{
  min-width:0;
  flex:1;
}

.entity-result-name{
  font-size:9px;
  font-weight:900;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.entity-result-japanese{
  margin-top:1px;

  color:#9ca6ad;

  font-size:7px;
}

.entity-result-meta{
  margin-top:2px;

  color:#6f7c85;

  font-size:6.5px;
}

.entity-result-arrow{
  color:#77858e;
  font-size:12px;
}

.entity-empty{
  padding:14px 10px;

  color:#7d8992;

  text-align:center;

  font-size:8px;
  line-height:1.5;
}


/* =========================================================
   SELECTED ENTITY
========================================================= */

.selected-entity{
  display:none;

  grid-column:1/-1;

  align-items:center;

  gap:9px;

  padding:9px 10px;

  border:1px solid rgba(103,197,135,.25);
  border-radius:10px;

  background:rgba(103,197,135,.06);
}

.selected-entity.show{
  display:flex;
}

.selected-icon{
  flex:0 0 28px;

  width:28px;
  height:28px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:8px;

  background:rgba(103,197,135,.08);

  font-size:15px;
}

.selected-main{
  min-width:0;
  flex:1;
}

.selected-label{
  color:#7f9387;

  font-size:6px;
  font-weight:900;

  letter-spacing:.08em;
}

.selected-name{
  margin-top:1px;

  color:#b7edc8;

  font-size:9px;
  font-weight:900;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.selected-meta{
  margin-top:2px;

  color:#71847a;

  font-size:6.5px;
}

.change-entity{
  min-height:28px;

  padding:5px 8px;

  border:1px solid rgba(103,197,135,.22);
  border-radius:8px;

  background:rgba(103,197,135,.05);

  color:#9dd9b0;

  font-size:7px;
  font-weight:900;

  cursor:pointer;
}


/* =========================================================
   MASTER HELP
========================================================= */

.master-help{
  display:none;

  grid-column:1/-1;

  align-items:center;
  justify-content:space-between;

  gap:8px;

  padding:8px 9px;

  border:1px dashed #35414a;
  border-radius:9px;

  color:#7f8b93;

  font-size:7px;
}

.master-help.show{
  display:flex;
}

.master-help button{
  min-height:29px;

  padding:5px 8px;

  border:1px solid rgba(92,157,255,.25);
  border-radius:8px;

  background:rgba(92,157,255,.06);

  color:#9bc4ff;

  font-size:7px;
  font-weight:900;

  cursor:pointer;
}


/* =========================================================
   FORM
========================================================= */

.form-grid{
  display:grid;

  grid-template-columns:
    1fr
    1fr;

  gap:9px;
}

.field.full{
  grid-column:1/-1;
}

.field label{
  display:block;

  margin-bottom:4px;

  color:#aeb5bc;

  font-size:7px;
  font-weight:900;
}

.field input,
.field textarea,
.field select{
  width:100%;

  min-height:40px;

  padding:8px 9px;

  border:1px solid var(--line);
  border-radius:9px;

  outline:none;

  background:#10171d;

  color:#fff;

  font-size:10px;
}

.field textarea{
  min-height:65px;
  resize:vertical;
}

.field input:focus,
.field textarea:focus,
.field select:focus{
  border-color:var(--red);
}

.check-row{
  display:flex;
  align-items:center;

  gap:7px;

  min-height:40px;

  margin-top:9px;

  padding:7px 9px;

  border:1px solid var(--line);
  border-radius:9px;

  background:#11181e;

  color:#d1d6da;

  font-size:8px;
  font-weight:800;
}

.check-row input{
  width:15px;
  height:15px;
}

.sheet-actions{
  display:grid;

  grid-template-columns:
    1fr
    2fr;

  gap:6px;

  margin-top:11px;
}

.delete-btn,
.save-btn{
  min-height:43px;

  border-radius:10px;

  font-size:8px;
  font-weight:900;

  cursor:pointer;
}

.delete-btn{
  border:1px solid rgba(201,111,104,.25);
  background:rgba(201,111,104,.05);
  color:#d98a83;
}

.save-btn{
  border:1px solid rgba(103,197,135,.32);
  background:rgba(103,197,135,.10);
  color:#aee5bf;
}

.save-btn:disabled,
.delete-btn:disabled{
  opacity:.5;
}

.form-message{
  display:none;

  margin-top:8px;

  padding:8px;

  border-radius:8px;

  font-size:8px;
}

.form-message.error{
  display:block;

  border:1px solid rgba(201,111,104,.25);

  background:rgba(201,111,104,.07);

  color:#ffc5c1;
}


/* =========================================================
   DESKTOP
========================================================= */

@media(min-width:700px){

  .sheet{
    max-width:620px;
    margin:auto;
  }

}

</style>
</head>


<body>


<!-- =========================================================
     HEADER
========================================================= -->

<header>

<div class="header-inner">

  <div class="title-row">

    <div>

      <div
        id="tripEyebrow"
        class="eyebrow"
      >
        TRIP PLAN
      </div>

      <h1>
        📅 Plan
      </h1>

      <div
        id="tripName"
        class="trip-name"
      >
        Loading trip…
      </div>

    </div>


    <button
      id="editButton"
      class="edit-btn"
      type="button"
    >
      ✏️ EDIT
    </button>

  </div>


  <div
    id="dateScroller"
    class="date-scroller"
  ></div>

</div>

</header>



<!-- =========================================================
     MAIN
========================================================= -->

<main id="main">

  <div class="state">

    <strong>
      Loading plan…
    </strong>

    Getting your itinerary from Supabase.

  </div>

</main>



<!-- =========================================================
     EDIT SHEET
========================================================= -->

<div
  id="editSheet"
  class="sheet-backdrop"
>

  <div class="sheet">

    <div class="sheet-handle"></div>

    <div class="sheet-head">

      <div
        id="sheetTitle"
        class="sheet-title"
      >
        Edit Schedule
      </div>

      <button
        id="closeSheet"
        class="close-btn"
        type="button"
      >
        ✕
      </button>

    </div>


    <div
      id="typeGrid"
      class="type-grid"
    >

      <button
        class="type-btn active"
        type="button"
        data-type="place"
      >
        📍 PLACE
      </button>

      <button
        class="type-btn"
        type="button"
        data-type="restaurant"
      >
        🍽 FOOD
      </button>

      <button
        class="type-btn"
        type="button"
        data-type="custom"
      >
        ✏️ CUSTOM
      </button>

    </div>


    <form id="editForm">

      <div class="form-grid">

        <div
          id="entityPicker"
          class="entity-picker"
        >

          <div
            id="entityPickerTitle"
            class="entity-picker-title"
          >
            📍 CHOOSE FROM SAVED PLACES
          </div>

          <div
            id="entityPickerSub"
            class="entity-picker-sub"
          >
            Search your saved places.
          </div>

          <div class="entity-search-wrap">

            <input
              id="entitySearch"
              class="entity-search"
              type="search"
              placeholder="Search places..."
              autocomplete="off"
            >

            <span class="search-icon">
              🔎
            </span>

          </div>

          <div
            id="entityResults"
            class="entity-results"
          ></div>

        </div>


        <div
          id="selectedEntity"
          class="selected-entity"
        >

          <div
            id="selectedEntityIcon"
            class="selected-icon"
          >
            📍
          </div>

          <div class="selected-main">

            <div
              id="selectedEntityLabel"
              class="selected-label"
            >
              SELECTED PLACE
            </div>

            <div
              id="selectedEntityName"
              class="selected-name"
            ></div>

            <div
              id="selectedEntityMeta"
              class="selected-meta"
            ></div>

          </div>

          <button
            id="changeEntityButton"
            class="change-entity"
            type="button"
          >
            CHANGE
          </button>

        </div>


        <div
          id="masterHelp"
          class="master-help"
        >

          <span id="masterHelpText">
            Can't find the place?
          </span>

          <button
            id="masterHelpButton"
            type="button"
          >
            ＋ ADD NEW PLACE
          </button>

        </div>


        <div class="field">

          <label>
            DATE
          </label>

          <input
            id="fieldDate"
            type="date"
            required
          >

        </div>


        <div class="field">

          <label>
            TIME
          </label>

          <input
            id="fieldTime"
            type="time"
          >

        </div>


        <div class="field full">

          <label>
            FLEXIBLE TIME LABEL
          </label>

          <input
            id="fieldTimeLabel"
            placeholder="e.g. Morning, ~3 PM, After lunch"
          >

        </div>


        <div class="field full">

          <label>
            TITLE
          </label>

          <input
            id="fieldTitle"
            required
            placeholder="Schedule item"
          >

        </div>


        <div class="field full">

          <label>
            LOCATION
          </label>

          <input
            id="fieldLocation"
            placeholder="Optional location"
          >

        </div>


        <div class="field full">

          <label>
            NOTES
          </label>

          <textarea
            id="fieldNotes"
            placeholder="Optional notes"
          ></textarea>

        </div>

      </div>


      <label class="check-row">

/* =========================================================
   HELPERS
========================================================= */

function text(value){

  return String(
    value ?? ""
  );

}


function esc(value){

  return text(value)

    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


function norm(value){

  return text(value)
    .trim()
    .toLowerCase();

}


function parseDate(value){

  return new Date(
    value + "T12:00:00"
  );

}


function localDateString(){

  const d = new Date();

  return [
    d.getFullYear(),
    String(d.getMonth()+1).padStart(2,"0"),
    String(d.getDate()).padStart(2,"0")
  ].join("-");

}


function formatDate(value){

  return new Intl.DateTimeFormat(
    "en-SG",
    {
      weekday:"long",
      day:"numeric",
      month:"long"
    }
  )
  .format(
    parseDate(value)
  )
  .toUpperCase();

}


function shortTripDate(value){

  if(!value){
    return "";
  }

  return new Intl.DateTimeFormat(
    "en-SG",
    {
      day:"numeric",
      month:"short",
      year:"numeric"
    }
  ).format(
    parseDate(value)
  );

}


function dateParts(value){

  const d =
    parseDate(value);

  return {

    weekday:
      new Intl.DateTimeFormat(
        "en-SG",
        {
          weekday:"short"
        }
      )
      .format(d)
      .toUpperCase(),

    day:
      new Intl.DateTimeFormat(
        "en-SG",
        {
          day:"numeric"
        }
      )
      .format(d),

    month:
      new Intl.DateTimeFormat(
        "en-SG",
        {
          month:"short"
        }
      )
      .format(d)
      .toUpperCase()

  };

}


function entityMeta(item){

  return [
    item.area,
    item.city,
    item.prefecture
  ]
  .filter(Boolean)
  .join(" · ");

}


/* =========================================================
   ACCESSIBLE TRIPS
========================================================= */

async function getAccessibleTrips(){

  if(!currentUser){
    return [];
  }


  const [
    ownResult,
    memberResult
  ] =
    await Promise.all([

      db
        .from("trips")
        .select("*")
        .eq(
          "owner_id",
          currentUser.id
        )
        .order(
          "start_date",
          {
            ascending:true
          }
        ),

      db
        .from("trip_members")
        .select("trip_id")
        .eq(
          "user_id",
          currentUser.id
        )

    ]);


  if(ownResult.error){
    throw ownResult.error;
  }


  if(memberResult.error){
    throw memberResult.error;
  }


  const ownTrips =
    (ownResult.data || [])
      .map(
        row => ({
          ...row,
          access_type:"owner"
        })
      );


  const sharedIds =
    [
      ...new Set(
        (memberResult.data || [])
          .map(
            row => Number(row.trip_id)
          )
          .filter(Boolean)
      )
    ];


  let sharedTrips = [];


  if(sharedIds.length){

    const sharedResult =
      await db
        .from("trips")
        .select("*")
        .in(
          "id",
          sharedIds
        )
        .order(
          "start_date",
          {
            ascending:true
          }
        );


    if(sharedResult.error){
      throw sharedResult.error;
    }


    sharedTrips =
      (sharedResult.data || [])
        .map(
          row => ({
            ...row,
            access_type:
              row.owner_id === currentUser.id
              ?
              "owner"
              :
              "shared"
          })
        );

  }


  const map =
    new Map();


  [
    ...ownTrips,
    ...sharedTrips
  ]
  .forEach(
    row => {

      const id =
        Number(row.id);


      if(
        !map.has(id) ||
        row.access_type === "owner"
      ){

        map.set(
          id,
          row
        );

      }

    }
  );


  return [
    ...map.values()
  ]
  .sort(
    (a,b) => {

      const ad =
        a.start_date || "";

      const bd =
        b.start_date || "";

      return ad.localeCompare(bd);

    }
  );

}


/* =========================================================
   RESOLVE CURRENT TRIP
========================================================= */

async function resolveTrip(){

  const authResult =
    await db.auth.getUser();


  if(authResult.error){
    throw authResult.error;
  }


  currentUser =
    authResult.data?.user || null;


  if(!currentUser){

    throw new Error(
      "Please sign in to view your trips."
    );

  }


  accessibleTrips =
    await getAccessibleTrips();


  if(!accessibleTrips.length){

    throw new Error(
      "You do not have any accessible trips yet."
    );

  }


  let resolved =
    accessibleTrips.find(
      row =>
        Number(row.id) ===
        Number(TRIP_ID)
    );


  if(!resolved){

    resolved =
      accessibleTrips[0];

  }


  TRIP_ID =
    Number(
      resolved.id
    );


  localStorage.setItem(
    "current_trip_id",
    String(TRIP_ID)
  );


  const hash =
    window.location.hash || "";


  history.replaceState(
    null,
    "",
    `?trip=${TRIP_ID}${hash}`
  );


}

async function loadData(){

      `Plan · ${trip.name || "Travel"}`;

      We load them separately so the page
      still uses your saved Places and
      Restaurants database.
    */

    */

        );

    const [

      throw scheduleResult.error;
    }


    if(placeResult.error){
      throw placeResult.error;
    }

      throw restaurantResult.error;

    schedule =

   SCHEDULE QUERY

/* =========================================================
   GROUP DAYS
========================================================= */

function buildDays(){

  groupedDays = {};


  schedule.forEach(
    item => {

      if(
        !groupedDays[
          item.schedule_date
        ]
      ){

        groupedDays[
          item.schedule_date
        ] = [];

      }


      groupedDays[
        item.schedule_date
      ]
      .push(item);

    }
  );

}


/* =========================================================
   CHOOSE DATE
========================================================= */

function chooseDate(){

  const hash =
    window.location.hash
      .replace("#","");


  if(
    hash &&
    trip.start_date &&
    trip.end_date &&
    hash >= trip.start_date &&
    hash <= trip.end_date
  ){

    selectedDate =
      hash;

    return;

  }


  const today =
    localDateString();


  if(
    trip.start_date &&
    trip.end_date &&
    today >= trip.start_date &&
    today <= trip.end_date
  ){

    selectedDate =
      today;

    return;

  }


  if(
    trip.start_date &&
    today < trip.start_date
  ){

    selectedDate =
      trip.start_date;

    return;

  }


  if(trip.end_date){

    selectedDate =
      trip.end_date;

    return;

  }


  const dates =
    Object.keys(
      groupedDays
    )
    .sort();


  selectedDate =
    dates[0] ||
    today;

}


/* =========================================================
   DATE SCROLLER
========================================================= */

function renderDates(){

  if(
    !trip.start_date ||
    !trip.end_date
  ){

    dateScroller.innerHTML = "";

    return;

  }


  const dates = [];


  let cursor =
    parseDate(
      trip.start_date
    );


  const end =
    parseDate(
      trip.end_date
    );


  while(
    cursor <= end
  ){

    const value = [

      cursor.getFullYear(),

      String(
        cursor.getMonth()+1
      )
      .padStart(
        2,
        "0"
      ),

      String(
        cursor.getDate()
      )
      .padStart(
        2,
        "0"
      )

    ].join("-");


    dates.push(value);


    cursor.setDate(
      cursor.getDate()+1
    );

  }


  dateScroller.innerHTML =
    dates
      .map(
        date => {

          const parts =
            dateParts(date);


          return `

            <button
              class="
                date-btn
                ${
                  date === selectedDate
                  ?
                  "active"
                  :
                  ""
                }
              "
              type="button"
              data-date="${date}"
            >

              <span class="date-weekday">
                ${esc(parts.weekday)}
              </span>

              <span class="date-number">
                ${esc(parts.day)}
              </span>

              <span class="date-month">
                ${esc(parts.month)}
              </span>

            </button>

          `;

        }
      )
      .join("");


  dateScroller
    .querySelectorAll(
      ".date-btn"
    )
    .forEach(
      button => {

        button.onclick =
          () => {

            selectedDate =
              button.dataset.date;


            history.replaceState(
              null,
              "",
              `?trip=${TRIP_ID}#${selectedDate}`
            );


            renderDates();

            renderDay();

          };

      }
    );


  requestAnimationFrame(
    () => {

      const active =
        dateScroller.querySelector(
          ".date-btn.active"
        );


      active?.scrollIntoView({
        behavior:"smooth",
        block:"nearest",
        inline:"center"
      });

    }
  );

}


/* =========================================================
   ITEM HELPERS
========================================================= */

function itemTime(item){

  if(item.time_label){

    return item.time_label;

  }


  if(item.start_time){

    const parts =
      item.start_time
        .split(":");


    let hour =
      Number(parts[0]);


    const minute =
      parts[1] || "00";


    const suffix =
      hour >= 12
      ?
      "PM"
      :
      "AM";


    hour =
      hour % 12 || 12;


    return `${hour}:${minute} ${suffix}`;

  }


  return "Flexible";

}


function itemLocation(item){

  return (
    item.restaurant?.name ||
    item.place?.name ||
    item.location_name ||
    ""
  );

}


function itemMap(item){

  return (
    item.restaurant?.maps_url ||
    item.place?.maps_url ||
    item.maps_url ||
    null
  );

}


function itemIcon(item){

  const type =
    norm(item.item_type);


  const title =
    norm(item.title);


  if(
    item.restaurant_id ||
    type.includes("food") ||
    type.includes("restaurant") ||
    title.includes("lunch") ||
    title.includes("dinner") ||
    title.includes("breakfast")
  ){
    return "🍽️";
  }


  if(
    type.includes("hotel") ||
    title.includes("hotel") ||
    title.includes("check-in") ||
    title.includes("check in")
  ){
    return "🏨";
  }


  if(
    type.includes("transport") ||
    title.includes("train") ||
    title.includes("drive") ||
    title.includes("travel") ||
    title.includes("arrive") ||
    title.includes("depart") ||
    title.includes("head to") ||
    title.includes("return")
  ){
    return "🚆";
  }


  if(
    title.includes("shrine") ||
    title.includes("temple") ||
    title.includes("taisha")
  ){
    return "⛩️";
  }


  if(
    title.includes("waterfall") ||
    title.includes("falls")
  ){
    return "💧";
  }


  if(
    title.includes("mount") ||
    title.includes("highland") ||
    title.includes("viewpoint")
  ){
    return "🏔️";
  }


  if(
    title.includes("market")
  ){
    return "🛍️";
  }


  return "📍";

}


/* =========================================================
   DYNAMIC DAY AREA
========================================================= */

function dayArea(date){

  const items =
    groupedDays[date] || [];


  /*
    Try to determine the area from
    the actual saved place / restaurant.

    This means changing the itinerary
    also changes the day heading.
  */

  const areas = [];


  items.forEach(
    item => {

      const values = [

        item.place?.city,
        item.restaurant?.city,
        item.place?.area,
        item.restaurant?.area

      ]
      .filter(Boolean);


      values.forEach(
        value => {

          if(
            !areas.some(
              existing =>
                norm(existing) ===
                norm(value)
            )
          ){

            areas.push(value);

          }

        }
      );

    }
  );


  /*
    Prefer city names.
  */

  const cities = [];


  items.forEach(
    item => {

      const city =
        item.place?.city ||
        item.restaurant?.city;


      if(
        city &&
        !cities.some(
          existing =>
            norm(existing) ===
            norm(city)
        )
      ){

        cities.push(city);

      }

    }
  );


  if(cities.length === 1){

    return `📍 ${cities[0]}`;

  }


  if(cities.length >= 2){

    return `📍 ${cities[0]} → ${cities[cities.length - 1]}`;

  }


  if(areas.length === 1){

    return `📍 ${areas[0]}`;

  }


  if(areas.length >= 2){

    return `📍 ${areas[0]} → ${areas[areas.length - 1]}`;

  }


  /*
    If the schedule rows themselves
    have location_name, use that.
  */

  const locations =
    items
      .map(
        item =>
          item.location_name
      )
      .filter(Boolean);


  if(locations.length){

    return `📍 ${locations[0]}`;

  }


  /*
    Final fallback.
  */

  return (
    trip.country
    ?
    `📍 ${trip.country}`
    :
    "📍 Trip Day"
  );

}


/* =========================================================

}


/* =========================================================
   TIMELINE HTML
========================================================= */

function timelineHTML(item){

  const map =
    itemMap(item);


  const location =
    itemLocation(item);


  return `

    <div class="timeline-row">

      <div class="timeline-time">

        ${esc(
          itemTime(item)
        )}

      </div>


      <div class="marker">

        <span class="dot"></span>

      </div>


      <div class="item-main">

        <div class="item-title">

          ${itemIcon(item)}

          ${
            map

            ?

            `
              <a
                href="${esc(map)}"
                target="_blank"
                rel="noopener noreferrer"
              >
                ${esc(item.title)}
              </a>
            `

            :

            esc(item.title)
          }


          ${
            item.is_optional

            ?

            `
              <span class="optional">
                OPTIONAL
              </span>
            `

            :

            ""
          }


          ${
            item.is_locked

            ?

            `
              <span class="locked">
                LOCKED
              </span>
            `

            :

            ""
          }

        </div>


        ${
          location &&
          norm(location) !==
          norm(item.title)

          ?

          `
            <div class="item-location">

              📍 ${esc(location)}

            </div>
          `

          :

          ""
        }


        ${
          item.notes ||
          item.description

          ?

          `
            <div class="item-note">

              ${esc(
                item.notes ||
                item.description
              )}

            </div>
          `

          :

          ""
        }

      </div>


      <button
        class="row-edit"
        type="button"
        onclick="openEditItem(${Number(item.id)})"
        aria-label="Edit"
      >
        ✏️
      </button>

    </div>

  `;

}

      "✏️ EDIT";


    renderDay();

  };


/* =========================================================
   EDIT SHEET
========================================================= */

document.getElementById(
  "closeSheet"
).onclick =
  closeEditSheet;


editSheet.onclick =
  event => {

    if(
      event.target ===
      editSheet
    ){

      closeEditSheet();

    }

  };


function closeEditSheet(){

  editSheet.classList.remove(
    "open"
  );


  entityResults.classList.remove(
    "show"
  );

}


/* =========================================================
   FORM TYPE
========================================================= */

typeGrid
  .querySelectorAll(
    "[data-type]"
  )
  .forEach(
    button => {

      button.onclick =
        () => {

          setFormType(
            button.dataset.type
          );

        };

    }
  );


function setFormType(type){

  formType =
    type;


  typeGrid
    .querySelectorAll(
      "[data-type]"
    )
    .forEach(
      button => {

        button.classList.toggle(
          "active",
          button.dataset.type === type
        );

      }
    );


  entityResults.classList.remove(
    "show"
  );


  if(type === "custom"){

    selectedPlaceId = null;

    selectedRestaurantId = null;


    entityPicker.style.display =
      "none";


    selectedEntity.classList.remove(
      "show"
    );


    masterHelp.classList.remove(
      "show"
    );


    return;

  }


  entityPicker.style.display =
    "block";


  masterHelp.classList.add(
    "show"
  );


  if(type === "place"){

    selectedRestaurantId = null;


    entityPickerTitle.textContent =
      "📍 CHOOSE FROM SAVED PLACES";


    entityPickerSub.textContent =
      trip?.country
      ?
      `Showing saved places for ${trip.country}.`
      :
      "Search your saved places.";


    entitySearch.placeholder =
      "Search places...";


    masterHelpText.textContent =
      "Can't find the place?";


    masterHelpButton.textContent =
      "＋ ADD NEW PLACE";

  }


  else{

    selectedPlaceId = null;


    entityPickerTitle.textContent =
      "🍽 CHOOSE FROM SAVED RESTAURANTS";


    entityPickerSub.textContent =
      trip?.country
      ?
      `Showing restaurants for ${trip.country}.`
      :
      "Search your saved restaurants.";


    entitySearch.placeholder =
      "Search restaurants...";


    masterHelpText.textContent =
      "Can't find the restaurant?";


    masterHelpButton.textContent =
      "＋ ADD RESTAURANT";

  }


  updateSelectedEntity();

}


/* =========================================================
   MASTER HELP
========================================================= */

masterHelpButton.onclick =
  () => {

    if(formType === "place"){

      location.href =
        `places-setup.html?trip=${TRIP_ID}`;

    }


    else if(
      formType === "restaurant"
    ){

      location.href =
        `food.html?trip=${TRIP_ID}`;

    }

  };


/* =========================================================
   OPEN NEW ITEM
========================================================= */

function openNewItem(){

  editingId = null;

  selectedPlaceId = null;

  selectedRestaurantId = null;


  sheetTitle.textContent =
    "＋ Add Schedule Item";


  deleteButton.style.display =
    "none";


  fieldDate.value =
    selectedDate;


  fieldTime.value = "";

  fieldTimeLabel.value = "";

  fieldTitle.value = "";

  fieldLocation.value = "";

  fieldNotes.value = "";

  fieldOptional.checked = false;

  entitySearch.value = "";


  setFormType(
    "place"
  );


  updateSelectedEntity();


  formMessage.className =
    "form-message";


  editSheet.classList.add(
    "open"
  );


  renderEntityResults("");

}


/* =========================================================
   OPEN EDIT ITEM
========================================================= */

function openEditItem(id){

  const item =
    schedule.find(
      row =>
        Number(row.id) ===
        Number(id)
    );


  if(!item){
    return;
  }


  editingId =
    item.id;


  selectedPlaceId =
    item.place_id || null;


  selectedRestaurantId =
    item.restaurant_id || null;


  sheetTitle.textContent =
    "Edit Schedule Item";


  deleteButton.style.display =
    "block";


  fieldDate.value =
    item.schedule_date;


  fieldTime.value =
    item.start_time
    ?
    item.start_time.slice(0,5)
    :
    "";


  fieldTimeLabel.value =
    item.time_label || "";


  fieldTitle.value =
    item.title || "";


  fieldLocation.value =
    item.location_name || "";


  fieldNotes.value =
    item.notes ||
    item.description ||
    "";


  fieldOptional.checked =
    Boolean(
      item.is_optional
    );


  if(item.restaurant_id){

    setFormType(
      "restaurant"
    );


    entitySearch.value =
      item.restaurant?.name || "";

  }


  else if(item.place_id){

    setFormType(
      "place"
    );


    entitySearch.value =
      item.place?.name || "";

  }


  else{

    setFormType(
      "custom"
    );


    entitySearch.value = "";

  }


  updateSelectedEntity();


  formMessage.className =
    "form-message";


  editSheet.classList.add(
    "open"
  );

}


/* =========================================================
   ENTITY SEARCH
========================================================= */

entitySearch.addEventListener(
  "focus",
  () => {

    if(formType !== "custom"){

      renderEntityResults(
        entitySearch.value
      );

    }

  }
);


entitySearch.addEventListener(
  "input",
  () => {

    if(formType === "custom"){
      return;
    }


    renderEntityResults(
      entitySearch.value
    );

  }
);


/* =========================================================
   ENTITY RESULTS
========================================================= */

function renderEntityResults(queryValue){

  const query =
    norm(queryValue);


  const source =
    formType === "restaurant"
    ?
    restaurants
    :
    places;


  let matches =
    source.filter(
      item => {

        if(!query){
          return true;
        }


        const haystack =
          norm([
            item.name,
            item.name_japanese,
            item.country,
            item.prefecture,
            item.city,
            item.area,
            item.location,
            item.address
          ].join(" "));


        return haystack.includes(
          query
        );

      }
    );


  matches =
    matches.slice(
      0,
      12
    );


  if(!matches.length){

    entityResults.innerHTML = `

      <div class="entity-empty">

        No ${
          formType === "restaurant"
          ?
          "restaurants"
          :
          "places"
        } found.

        <br><br>

        Add it to your master database first.

      </div>

    `;


    entityResults.classList.add(
      "show"
    );


    return;

  }


  entityResults.innerHTML =
    matches
      .map(
        item => {

          const meta =
            entityMeta(item);


          return `

            <button
              class="entity-result"
              type="button"
              data-id="${Number(item.id)}"
            >

              <div class="entity-result-icon">

                ${
                  formType === "restaurant"
                  ?
                  "🍽️"
                  :
                  "📍"
                }

              </div>


              <div class="entity-result-main">

                <div class="entity-result-name">

                  ${esc(item.name)}

                </div>


                ${
                  item.name_japanese

                  ?

                  `
                    <div class="entity-result-japanese">

                      ${esc(item.name_japanese)}

                    </div>
                  `

                  :

                  ""
                }


                ${
                  meta

                  ?

                  `
                    <div class="entity-result-meta">

                      ${esc(meta)}

                    </div>
                  `

                  :

                  ""
                }

              </div>


              <div class="entity-result-arrow">
                ＋
              </div>

            </button>

          `;

        }
      )
      .join("");


  entityResults.classList.add(
    "show"
  );


  entityResults
    .querySelectorAll(
      "[data-id]"
    )
    .forEach(
      button => {

        button.onclick =
          () => {

            chooseEntity(
              Number(
                button.dataset.id
              )
            );

          };

      }
    );

}


/* =========================================================
   CHOOSE ENTITY
========================================================= */

function chooseEntity(id){

  const source =
    formType === "restaurant"
    ?
    restaurants
    :
    places;


  const item =
    source.find(
      row =>
        Number(row.id) ===
        Number(id)
    );


  if(!item){
    return;
  }


  if(
    formType === "restaurant"
  ){

    selectedRestaurantId =
      item.id;


    selectedPlaceId =
      null;

  }


  else{

    selectedPlaceId =
      item.id;


    selectedRestaurantId =
      null;

  }


  entitySearch.value =
    item.name || "";


  fieldTitle.value =
    item.name || "";


  fieldLocation.value =
    [
      item.area,
      item.city
    ]
    .filter(Boolean)
    .join(", ");


  entityResults.classList.remove(
    "show"
  );


  updateSelectedEntity();

}


/* =========================================================
   SELECTED ENTITY
========================================================= */

function updateSelectedEntity(){

  let item = null;


  if(
    formType === "place" &&
    selectedPlaceId
  ){

    item =
      places.find(
        row =>
          Number(row.id) ===
          Number(selectedPlaceId)
      );

  }


  else if(
    formType === "restaurant" &&
    selectedRestaurantId
  ){

    item =
      restaurants.find(
        row =>
          Number(row.id) ===
          Number(selectedRestaurantId)
      );

  }


  if(!item){

    selectedEntity.classList.remove(
      "show"
    );

    return;

  }


  selectedEntityIcon.textContent =
    formType === "restaurant"
    ?
    "🍽️"
    :
    "📍";


  selectedEntityLabel.textContent =
    formType === "restaurant"
    ?
    "SELECTED RESTAURANT"
    :
    "SELECTED PLACE";


  selectedEntityName.textContent =
    item.name || "";


  selectedEntityMeta.textContent =
    entityMeta(item);


  selectedEntity.classList.add(
    "show"
  );

}


/* =========================================================
   CHANGE ENTITY
========================================================= */

document.getElementById(
  "changeEntityButton"
).onclick =
  () => {

    if(
      formType === "place"
    ){

      selectedPlaceId = null;

    }


    else if(
      formType === "restaurant"
    ){

      selectedRestaurantId = null;

    }


    entitySearch.value = "";


    updateSelectedEntity();


    renderEntityResults("");


    entitySearch.focus();

  };


/* =========================================================
   TIME
========================================================= */

fieldTime.addEventListener(
  "input",
  () => {

    if(fieldTime.value){

      fieldTimeLabel.value = "";

    }

  }
);


fieldTimeLabel.addEventListener(
  "input",
  () => {

    if(
      fieldTimeLabel.value.trim()
    ){

      fieldTime.value = "";

    }

  }
);


/* =========================================================
   SORT ORDER
========================================================= */

function nextSortOrder(date){

  const rows =
    groupedDays[date] || [];


  if(!rows.length){
    return 10;
  }


  const max =
    Math.max(
      ...rows.map(
        row =>
          Number(
            row.sort_order || 0
          )
      )
    );


  return max + 10;

}


/* =========================================================
   SAVE ITEM
========================================================= */

document.getElementById(
  "editForm"
).addEventListener(
  "submit",
  async event => {

    event.preventDefault();


    saveButton.disabled = true;

    saveButton.textContent =
      "SAVING…";


    formMessage.className =
      "form-message";


    try{

      const date =
        fieldDate.value;


      const time =
        fieldTime.value;


      const timeLabel =
        fieldTimeLabel.value.trim();


      const title =
        fieldTitle.value.trim();


      const locationName =
        fieldLocation.value.trim();


      const notes =
        fieldNotes.value.trim();


      if(!date){

        throw new Error(
          "Please choose a date."
        );

      }


      if(!title){

        throw new Error(
          "Please enter a title."
        );

      }


      if(
        formType === "place" &&
        !selectedPlaceId
      ){

        throw new Error(
          "Please choose a saved place."
        );

      }


      if(
        formType === "restaurant" &&
        !selectedRestaurantId
      ){

        throw new Error(
          "Please choose a saved restaurant."
        );

      }


      const payload = {

        trip_id:
          TRIP_ID,

        schedule_date:
          date,

        start_time:
          time
          ?
          `${time}:00`
          :
          null,

        time_label:
          time
          ?
          null
          :
          (
            timeLabel ||
            null
          ),

        title:
          title,

        item_type:
          formType === "restaurant"
          ?
          "restaurant"
          :
          formType === "place"
          ?
          "attraction"
          :
          "custom",

        notes:
          notes || null,

        location_name:
          locationName || null,

        place_id:
          formType === "place"
          ?
          selectedPlaceId
          :
          null,

        restaurant_id:
          formType === "restaurant"
          ?
          selectedRestaurantId
          :
          null,

        is_optional:
          fieldOptional.checked

      };


      if(
        editingId === null
      ){

        payload.sort_order =
          nextSortOrder(
            date
          );


        const result =
          await db
            .from("schedule")
            .insert(
              payload
            )
            .select()
            .single();


        if(result.error){
          throw result.error;
        }

      }


      else{

        const result =
          await db
            .from("schedule")
            .update(
              payload
            )
            .eq(
              "id",
              editingId
            )
            .eq(
              "trip_id",
              TRIP_ID
            )
            .select();


        if(result.error){
          throw result.error;
        }


        if(
          !result.data ||
          !result.data.length
        ){

          throw new Error(
            "The item was not updated. Check your editing permission."
          );

        }

      }


      selectedDate =
        date;


      closeEditSheet();


      await reloadSchedule();

    }


    catch(error){

      console.error(error);


      formMessage.textContent =
        error.message ||
        "Couldn't save schedule item.";


      formMessage.className =
        "form-message error";

    }


    finally{

      saveButton.disabled = false;

      saveButton.textContent =
        "SAVE";

    }

  }
);


/* =========================================================
   DELETE ITEM
========================================================= */

deleteButton.onclick =
  async () => {

    if(
      editingId === null
    ){
      return;
    }


    const item =
      schedule.find(
        row =>
          Number(row.id) ===
          Number(editingId)
      );


    if(!item){
      return;
    }


    const okay =
      confirm(
        `Delete "${item.title}" from the schedule?`
      );


    if(!okay){
      return;
    }


    deleteButton.disabled =
      true;


    try{

      const result =
        await db
          .from("schedule")
          .delete()
          .eq(
            "id",
            editingId
          )
          .eq(
            "trip_id",
            TRIP_ID
          );


      if(result.error){
        throw result.error;
      }


      closeEditSheet();


      await reloadSchedule();

    }


    catch(error){

      console.error(error);


      formMessage.textContent =
        error.message ||
        "Couldn't delete item.";


      formMessage.className =
        "form-message error";

    }


    finally{

      deleteButton.disabled =
        false;

    }

  };


/* =========================================================
   RELOAD SCHEDULE
========================================================= */

async function reloadSchedule(){

  const result =
    await loadScheduleQuery();


  if(result.error){
    throw result.error;
  }


  schedule =
    result.data || [];


  buildDays();

  renderDates();

  renderDay();

}

   START
========================================================= */

loadData();
