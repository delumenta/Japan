<!doctype html>
<html lang="en">

<head>
<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1, viewport-fit=cover"
>

<meta name="theme-color" content="#070c10">

<title>Trip Schedule</title>

<style>

/* =========================================
   COLORS
========================================= */

:root{
  --bg:#070c10;

  --panel:#10161c;
  --panel-light:#151c23;
  --panel-active:#172027;

  --line:#29323b;
  --line-soft:rgba(255,255,255,.07);

  --text:#f5f5f3;
  --muted:#aeb5bc;
  --muted-blue:#91a5b3;

  --red:#c96f68;
  --blue:#5c9dff;
  --green:#67c587;
  --orange:#f4a34d;
  --gold:#e3b85c;
}


/* =========================================
   GLOBAL
========================================= */

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;

  background:
    radial-gradient(
      circle at 50% -20%,
      #17202a 0%,
      transparent 38%
    ),
    var(--bg);

  color:var(--text);

  font-family:
    Inter,
    ui-sans-serif,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

  line-height:1.5;
}

button,
input{
  font:inherit;
}


/* =========================================
   HEADER
========================================= */

header{
  position:sticky;
  top:0;
  z-index:30;

  background:rgba(7,12,16,.94);
  border-bottom:1px solid var(--line);

  padding:
    calc(12px + env(safe-area-inset-top))
    12px
    11px;

  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
}

.header-top{
  max-width:820px;
  margin:0 auto 11px;

  display:flex;
  align-items:center;
  gap:11px;
}

.home-button{
  display:flex;
  align-items:center;
  justify-content:center;

  min-height:39px;

  padding:7px 11px;

  border:1px solid var(--line);
  border-radius:11px;

  background:#121a20;

  color:var(--muted);

  text-decoration:none;

  font-size:12px;
  font-weight:750;

  white-space:nowrap;
}

.home-button:active{
  border-color:var(--red);
  color:#fff;
}

.header-title{
  min-width:0;
  flex:1;
}

.header-title h1{
  margin:0;

  color:#fff;

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-size:23px;
  line-height:1.1;

  letter-spacing:-.025em;
}

.header-title div{
  margin-top:3px;

  color:var(--muted);

  font-size:11px;
}


/* =========================================
   TRIP FILTER
========================================= */

.trip-filter{
  max-width:820px;
  margin:auto;

  display:grid;

  grid-template-columns:
    .65fr
    1fr
    1.3fr
    1fr;

  gap:6px;
}

.trip-filter button{
  appearance:none;

  min-height:40px;

  border:1px solid #26333d;
  border-radius:11px;

  background:#121a20;
  color:#cdd4d9;

  padding:7px 5px;

  font-size:10px;
  font-weight:800;

  cursor:pointer;
}

.trip-filter button.active{
  color:#fff;

  border-color:var(--red);

  background:
    rgba(201,111,104,.10);
}


/* =========================================
   PAGE
========================================= */

main{
  max-width:820px;
  margin:auto;

  padding:
    15px
    12px
    105px;
}


/* =========================================
   STATUS / ERROR
========================================= */

.status-card{
  margin-top:15px;

  padding:25px 18px;

  border:1px solid var(--line);
  border-radius:18px;

  background:var(--panel);

  text-align:center;
}

.status-icon{
  font-size:28px;
  margin-bottom:8px;
}

.status-title{
  color:#fff;
  font-weight:850;
  font-size:15px;
}

.status-text{
  margin-top:5px;

  color:var(--muted);

  font-size:12px;
}


/* =========================================
   DATE SCROLLER
========================================= */

.date-section{
  margin-bottom:18px;
}

.section-label{
  color:var(--red);

  font-size:10px;
  font-weight:850;

  letter-spacing:.13em;
  text-transform:uppercase;

  margin:
    2px
    2px
    9px;
}

.date-scroll{
  display:flex;

  gap:9px;

  overflow-x:auto;

  padding:
    2px
    2px
    10px;

  scrollbar-width:none;

  scroll-snap-type:x proximity;
}

.date-scroll::-webkit-scrollbar{
  display:none;
}


/* =========================================
   DATE CARDS
========================================= */

.day-card{
  appearance:none;

  flex:0 0 142px;

  min-height:112px;

  text-align:left;

  border:1px solid var(--line);
  border-radius:17px;

  background:
    linear-gradient(
      145deg,
      #151d23,
      #0e1419
    );

  padding:12px;

  color:var(--text);

  cursor:pointer;

  scroll-snap-align:start;
}

.day-card.active{
  border-color:var(--red);

  background:
    linear-gradient(
      145deg,
      #1d2024,
      #141719
    );

  box-shadow:
    0 0 0 1px
    rgba(201,111,104,.08);
}

.day-number{
  color:var(--red);

  font-size:12px;
  font-weight:850;
}

.day-area{
  margin-top:4px;

  color:var(--muted-blue);

  font-size:10px;

  text-transform:uppercase;

  font-weight:750;
}

.day-summary{
  margin-top:8px;

  color:#fff;

  font-size:13px;
  font-weight:750;

  line-height:1.25;
}

.day-count{
  margin-top:8px;

  color:var(--muted);

  font-size:10px;
  font-weight:700;
}


/* =========================================
   DAY HERO
========================================= */

.day-hero{
  margin-bottom:13px;

  padding:
    17px
    15px;

  border:1px solid var(--line);
  border-radius:20px;

  background:
    linear-gradient(
      145deg,
      #171f25,
      #0e1419
    );
}

.day-date{
  color:var(--red);

  font-size:10px;
  font-weight:850;

  text-transform:uppercase;

  letter-spacing:.13em;
}

.day-hero h2{
  margin:
    7px
    0
    5px;

  color:#fff;

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-size:25px;
  line-height:1.08;
}

.day-route{
  color:var(--muted);

  font-size:12px;
}

.stats{
  display:flex;

  flex-wrap:wrap;

  gap:7px;

  margin-top:13px;
}

.stat{
  border:1px solid var(--line);

  background:
    rgba(255,255,255,.035);

  border-radius:999px;

  padding:6px 9px;

  color:#cbd2d7;

  font-size:10px;
  font-weight:700;
}


/* =========================================
   SCHEDULE
========================================= */

.schedule-title{
  color:var(--red);

  font-size:10px;
  font-weight:850;

  letter-spacing:.13em;
  text-transform:uppercase;

  margin:
    19px
    2px
    7px;
}

.timeline{
  position:relative;
}

.schedule-item{
  display:grid;

  grid-template-columns:
    76px
    1fr;

  gap:10px;

  padding:
    14px
    0;

  border-bottom:
    1px solid var(--line-soft);
}

.schedule-item:last-child{
  border-bottom:0;
}

.schedule-time{
  color:var(--muted-blue);

  font-size:11px;
  font-weight:800;

  line-height:1.35;
}

.schedule-main{
  min-width:0;
}

.schedule-top{
  display:flex;

  align-items:flex-start;

  justify-content:space-between;

  gap:8px;
}

.schedule-place{
  min-width:0;

  color:#fff;

  font-size:15px;
  font-weight:800;

  line-height:1.35;
}

.schedule-note{
  margin-top:4px;

  color:var(--muted);

  font-size:12px;

  line-height:1.5;
}


/* =========================================
   BADGES
========================================= */

.badges{
  display:flex;

  flex-wrap:wrap;

  gap:5px;

  margin-top:7px;
}

.badge{
  display:inline-flex;

  align-items:center;

  min-height:23px;

  padding:
    3px
    7px;

  border-radius:999px;

  border:1px solid var(--line);

  color:var(--muted);

  background:
    rgba(255,255,255,.035);

  font-size:9px;
  font-weight:850;
}

.badge.optional{
  color:var(--orange);

  border-color:
    rgba(244,163,77,.25);

  background:
    rgba(244,163,77,.07);
}

.badge.locked{
  color:var(--green);

  border-color:
    rgba(103,197,135,.25);

  background:
    rgba(103,197,135,.07);
}

.badge.restaurant{
  color:var(--blue);

  border-color:
    rgba(92,157,255,.25);

  background:
    rgba(92,157,255,.07);
}

.badge.rating{
  color:var(--gold);

  border-color:
    rgba(227,184,92,.25);

  background:
    rgba(227,184,92,.07);
}


/* =========================================
   ACTIONS
========================================= */

.actions{
  display:flex;

  flex-wrap:wrap;

  gap:7px;

  margin-top:9px;
}

.action{
  display:inline-flex;

  align-items:center;
  justify-content:center;

  min-height:37px;

  padding:
    7px
    10px;

  border-radius:10px;

  border:
    1px solid
    rgba(201,111,104,.26);

  background:
    rgba(201,111,104,.08);

  color:var(--red);

  text-decoration:none;

  font-size:10px;
  font-weight:850;
}

.action.food{
  color:var(--blue);

  border-color:
    rgba(92,157,255,.25);

  background:
    rgba(92,157,255,.08);
}

.action.booking{
  color:var(--green);

  border-color:
    rgba(103,197,135,.25);

  background:
    rgba(103,197,135,.08);
}


/* =========================================
   EMPTY DAY
========================================= */

.empty-day{
  padding:25px 16px;

  border:
    1px dashed
    #34414b;

  border-radius:18px;

  text-align:center;

  color:var(--muted);
}

.empty-day strong{
  display:block;

  color:#fff;

  margin-bottom:5px;
}


/* =========================================
   BOTTOM NAV
========================================= */

.bottom-nav{
  position:fixed;

  left:0;
  right:0;
  bottom:0;

  z-index:50;

  display:grid;

  grid-template-columns:
    repeat(5,1fr);

  padding:
    7px
    8px
    calc(7px + env(safe-area-inset-bottom));

  background:
    rgba(7,12,16,.96);

  border-top:
    1px solid var(--line);

  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
}

.bottom-nav a{
  display:flex;

  flex-direction:column;

  align-items:center;
  justify-content:center;

  gap:2px;

  min-height:47px;

  color:var(--muted);

  text-decoration:none;

  font-size:9px;
  font-weight:800;

  letter-spacing:.02em;

  border-radius:11px;
}

.bottom-nav .nav-icon{
  font-size:17px;
  line-height:1;
}

.bottom-nav a.active{
  color:#fff;

  background:
    rgba(201,111,104,.10);

  border:
    1px solid
    rgba(201,111,104,.25);
}


/* =========================================
   DESKTOP
========================================= */

@media(min-width:700px){

  main{
    padding-top:20px;
  }

  .day-card{
    flex-basis:160px;
  }

  .schedule-item{
    grid-template-columns:
      115px
      1fr;
  }

  .bottom-nav{
    left:50%;
    right:auto;

    width:min(820px,100%);

    transform:
      translateX(-50%);

    border-left:
      1px solid var(--line);

    border-right:
      1px solid var(--line);

    border-radius:
      16px
      16px
      0
      0;
  }

}

</style>

<script>

/* =========================================
   CONFIG
========================================= */

const params =
  new URLSearchParams(
    window.location.search
  );


const TRIP_ID =
  Number(
    params.get("trip") || 1
  );


/* =========================================
   STATE
========================================= */

let trip = null;

let scheduleRows = [];

let days = [];

let currentFilter = "all";

let currentDate = null;


/* =========================================
   ELEMENTS
========================================= */

const loadingState =
  document.getElementById(
    "loadingState"
  );

const app =
  document.getElementById(
    "app"
  );

const tripSubtitle =
  document.getElementById(
    "tripSubtitle"
  );

const dateScroll =
  document.getElementById(
    "dateScroll"
  );

const dateLabel =
  document.getElementById(
    "dateLabel"
  );

const scheduleContent =
  document.getElementById(
    "scheduleContent"
  );

const tripButtons =
  document.querySelectorAll(
    ".trip-btn"
  );


/* =========================================
   HELPERS
========================================= */

function escapeHTML(value){

  if(value === null ||
     value === undefined){

    return "";

  }

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


function prettyDate(dateString){

  const date =
    new Date(
      dateString + "T12:00:00"
    );

  return new Intl.DateTimeFormat(
    "en-GB",
    {
      day:"numeric",
      month:"short"
    }
  )
  .format(date)
  .toUpperCase();

}


function longDate(dateString){

  const date =
    new Date(
      dateString + "T12:00:00"
    );

  return new Intl.DateTimeFormat(
    "en-GB",
    {
      weekday:"long",
      day:"numeric",
      month:"long"
    }
  )
  .format(date)
  .toUpperCase();

}


function tripDateRange(){

  if(!trip){
    return "";
  }

  const start =
    new Date(
      trip.start_date +
      "T12:00:00"
    );

  const end =
    new Date(
      trip.end_date +
      "T12:00:00"
    );

  const startText =
    new Intl.DateTimeFormat(
      "en-GB",
      {
        day:"numeric",
        month:"short"
      }
    ).format(start);

  const endText =
    new Intl.DateTimeFormat(
      "en-GB",
      {
        day:"numeric",
        month:"short",
        year:"numeric"
      }
    ).format(end);

  return `${startText} – ${endText}`;

}


/* =========================================
   CATEGORY / REGION
========================================= */

function regionForDate(dateString){

  /*
    Your current Japan Autumn 2026
    trip structure.

    For other future trips,
    unknown dates simply fall under ALL.
  */

  if(
    dateString >= "2026-10-18" &&
    dateString <= "2026-10-22"
  ){
    return "kyoto";
  }

  if(
    dateString >= "2026-10-23" &&
    dateString <= "2026-10-26"
  ){
    return "road";
  }

  if(
    dateString >= "2026-10-27" &&
    dateString <= "2026-10-30"
  ){
    return "osaka";
  }

  return "other";

}


function regionLabel(dateString){

  const region =
    regionForDate(dateString);

  if(region === "kyoto"){
    return "Kyoto";
  }

  if(region === "road"){
    return "Road Trip";
  }

  if(region === "osaka"){
    return "Osaka";
  }

  return "Trip";
}


/* =========================================
   ICONS
========================================= */

function iconForItem(row){

  const title =
    (row.title || "")
      .toLowerCase();

  if(
    row.restaurant_id ||
    row.item_type === "food"
  ){
    return "🍽️";
  }

  if(row.item_type === "hotel"){
    return "🏨";
  }

  if(row.item_type === "transport"){

    if(title.includes("flight") ||
       title.includes("fly ")){
      return "✈️";
    }

    if(title.includes("car") ||
       title.includes("drive")){
      return "🚗";
    }

    if(title.includes("taxi")){
      return "🚕";
    }

    return "🚆";
  }

  if(
    title.includes("shrine") ||
    title.includes("taisha") ||
    title.includes("temple") ||
    title.includes("ji ")
  ){
    return "⛩️";
  }

  if(title.includes("museum")){
    return "🏛️";
  }

  if(title.includes("onsen")){
    return "♨️";
  }

  if(title.includes("sunset")){
    return "🌅";
  }

  if(title.includes("shopping")){
    return "🛍️";
  }

  if(title.includes("walk")){
    return "🚶";
  }

  if(title.includes("teamlab")){
    return "✨";
  }

  return "📍";

}


/* =========================================
   CLEAN TITLE
========================================= */

function cleanTitle(title){

  /*
    Your imported schedule titles already
    contain emojis.

    If they do, don't add another icon.
  */

  return title || "Untitled";

}


function titleHasEmoji(title){

  return /[\p{Extended_Pictographic}]/u
    .test(title || "");

}


/* =========================================
   DAY SUMMARY
========================================= */

function buildDaySummary(rows){

  const important =
    rows.filter(row => {

      return (
        row.place_id ||
        row.restaurant_id
      );

    });


  const source =
    important.length
      ? important
      : rows;


  const names =
    source
      .slice(0,2)
      .map(row => {

        let name =
          row.place?.name ||
          row.restaurant?.name ||
          row.title ||
          "";

        name =
          name.replace(
            /^[^\p{L}\p{N}]+/u,
            ""
          );

        return name;

      })
      .filter(Boolean);


  if(!names.length){
    return "Flexible Day";
  }


  if(names.length === 1){
    return names[0];
  }


  return (
    names[0] +
    " + " +
    names[1]
  );

}


/* =========================================
   LOAD TRIP
========================================= */

async function loadTrip(){

  const {
    data,
    error
  } =
    await db
      .from("trips")
      .select(`
        id,
        name,
        country,
        start_date,
        end_date,
        description
      `)
      .eq("id",TRIP_ID)
      .single();


  if(error){
    throw error;
  }


  trip = data;

}


/* =========================================
   LOAD SCHEDULE
========================================= */

async function loadSchedule(){

  const {
    data,
    error
  } =
    await db
      .from("schedule")
      .select(`
        id,
        trip_id,
        schedule_date,
        start_time,
        end_time,
        time_label,
        sort_order,
        title,
        item_type,
        description,
        notes,
        place_id,
        restaurant_id,
        location_name,
        address,
        latitude,
        longitude,
        maps_url,
        is_optional,
        is_locked,

        place:places (
          id,
          name,
          name_japanese,
          place_type,
          city,
          area,
          address,
          maps_url,
          website_url
        ),

        restaurant:restaurants (
          id,
          name,
          name_japanese,
          cuisine,
          city,
          area,
          location,
          address,
          maps_url,
          tabelog_url,
          tabelog_rating,
          tabelog_award,
          is_tabelog_top100,
          is_hot,
          accepts_online_booking,
          accepts_walk_in,
          booking_url,
          booking_notes
        )
      `)
      .eq("trip_id",TRIP_ID)
      .order(
        "schedule_date",
        {ascending:true}
      )
      .order(
        "sort_order",
        {ascending:true}
      );


  if(error){
    throw error;
  }


  scheduleRows =
    data || [];

}


/* =========================================
   BUILD DAYS
========================================= */

function buildDays(){

  const grouped = {};


  scheduleRows.forEach(row => {

    if(!grouped[row.schedule_date]){

      grouped[
        row.schedule_date
      ] = [];

    }

    grouped[
      row.schedule_date
    ].push(row);

  });


  days =
    Object.keys(grouped)
      .sort()
      .map(date => ({

        date,

        region:
          regionForDate(date),

        rows:
          grouped[date],

        summary:
          buildDaySummary(
            grouped[date]
          )

      }));

}


/* =========================================
   FILTERED DAYS
========================================= */

function visibleDays(){

  if(currentFilter === "all"){
    return days;
  }

  return days.filter(
    day =>
      day.region === currentFilter
  );

}


/* =========================================
   DATE CARDS
========================================= */

function renderDateCards(){

  const filtered =
    visibleDays();


  dateScroll.innerHTML =
    filtered.map(day => {

      const active =
        day.date === currentDate
          ? "active"
          : "";

      return `
        <button
          class="day-card ${active}"
          data-date="${day.date}"
        >

          <div class="day-number">
            ${prettyDate(day.date)}
          </div>

          <div class="day-area">
            ${escapeHTML(
              regionLabel(day.date)
            )}
          </div>

          <div class="day-summary">
            ${escapeHTML(
              day.summary
            )}
          </div>

          <div class="day-count">
            ${day.rows.length}
            schedule items
          </div>

        </button>
      `;

    }).join("");


  document
    .querySelectorAll(
      ".day-card"
    )
    .forEach(card => {

      card.addEventListener(
        "click",
        () => {

          selectDate(
            card.dataset.date
          );

        }
      );

    });

}


/* =========================================
   MAP URL
========================================= */

function mapURL(row){

  if(row.restaurant?.maps_url){
    return row.restaurant.maps_url;
  }

  if(row.place?.maps_url){
    return row.place.maps_url;
  }

  if(row.maps_url){
    return row.maps_url;
  }

  return null;

}


/* =========================================
   ACTION BUTTONS
========================================= */

function renderActions(row){

  const buttons = [];


  const maps =
    mapURL(row);


  if(maps){

    buttons.push(`
      <a
        class="action"
        href="${escapeHTML(maps)}"
        target="_blank"
        rel="noopener noreferrer"
      >
        📍 Maps
      </a>
    `);

  }


  if(
    row.restaurant?.tabelog_url
  ){

    buttons.push(`
      <a
        class="action food"
        href="${escapeHTML(
          row.restaurant.tabelog_url
        )}"
        target="_blank"
        rel="noopener noreferrer"
      >
        ⭐ Tabelog
      </a>
    `);

  }


  if(
    row.restaurant?.booking_url
  ){

    buttons.push(`
      <a
        class="action booking"
        href="${escapeHTML(
          row.restaurant.booking_url
        )}"
        target="_blank"
        rel="noopener noreferrer"
      >
        🌐 Booking
      </a>
    `);

  }


  if(
    row.place?.website_url
  ){

    buttons.push(`
      <a
        class="action"
        href="${escapeHTML(
          row.place.website_url
        )}"
        target="_blank"
        rel="noopener noreferrer"
      >
        🌐 Website
      </a>
    `);

  }


  if(!buttons.length){
    return "";
  }


  return `
    <div class="actions">
      ${buttons.join("")}
    </div>
  `;

}


/* =========================================
   BADGES
========================================= */

function renderBadges(row){

  const badges = [];


  if(row.is_locked){

    badges.push(`
      <span class="badge locked">
        🔒 LOCKED
      </span>
    `);

  }


  if(row.is_optional){

    badges.push(`
      <span class="badge optional">
        OPTIONAL
      </span>
    `);

  }


  if(row.restaurant_id){

    badges.push(`
      <span class="badge restaurant">
        🍽️ RESTAURANT
      </span>
    `);

  }


  if(
    row.restaurant
    &&
    row.restaurant.tabelog_rating
  ){

    badges.push(`
      <span class="badge rating">
        ⭐ ${escapeHTML(
          row.restaurant.tabelog_rating
        )}
      </span>
    `);

  }


  if(
    row.restaurant
    &&
    row.restaurant.is_tabelog_top100
  ){

    badges.push(`
      <span class="badge rating">
        TOP 100
      </span>
    `);

  }


  if(
    row.restaurant
    &&
    row.restaurant.is_hot
  ){

    badges.push(`
      <span class="badge rating">
        🔥 HOT
      </span>
    `);

  }


  if(!badges.length){
    return "";
  }


  return `
    <div class="badges">
      ${badges.join("")}
    </div>
  `;

}


/* =========================================
   SCHEDULE ITEM
========================================= */

function renderScheduleItem(row){

  const title =
    cleanTitle(
      row.title
    );


  const icon =
    titleHasEmoji(title)
      ? ""
      : iconForItem(row) + " ";


  const note =
    row.notes ||
    row.description ||
    "";


  const time =
    row.time_label ||
    formatDatabaseTime(
      row.start_time,
      row.end_time
    );


  return `
    <div
      class="schedule-item"
      data-id="${row.id}"
    >

      <div class="schedule-time">
        ${escapeHTML(time || "Flexible")}
      </div>


      <div class="schedule-main">

        <div class="schedule-top">

          <div class="schedule-place">
            ${icon}${escapeHTML(title)}
          </div>

        </div>


        ${
          note
          ?
          `
            <div class="schedule-note">
              ${escapeHTML(note)}
            </div>
          `
          :
          ""
        }


        ${renderBadges(row)}

        ${renderActions(row)}

      </div>

    </div>
  `;

}


/* =========================================
   FALLBACK TIME FORMAT
========================================= */

function formatDatabaseTime(
  startTime,
  endTime
){

  if(!startTime){
    return "";
  }


  function format(time){

    const parts =
      time.split(":");

    let hour =
      Number(parts[0]);

    const minute =
      parts[1];

    const period =
      hour >= 12
        ? "PM"
        : "AM";

    hour =
      hour % 12 || 12;

    return minute === "00"
      ? `${hour}:00 ${period}`
      : `${hour}:${minute} ${period}`;

  }


  const start =
    format(startTime);


  if(!endTime){
    return start;
  }


  return (
    start +
    "–" +
    format(endTime)
  );

}


/* =========================================
   RENDER DAY
========================================= */

function renderDay(){

  const day =
    days.find(
      item =>
        item.date === currentDate
    );


  if(!day){

    scheduleContent.innerHTML = `
      <div class="empty-day">

        <strong>
          No schedule
        </strong>

        Nothing has been added
        to this day yet.

      </div>
    `;

    return;

  }


  const mainItems =
    day.rows.filter(
      row =>
        row.place_id ||
        row.restaurant_id
    );


  const routeNames =
    mainItems
      .slice(0,5)
      .map(row => {

        return (
          row.place?.name ||
          row.restaurant?.name ||
          row.title
        );

      })
      .filter(Boolean);


  const route =
    routeNames.length
      ? routeNames.join(" → ")
      : "Flexible itinerary";


  scheduleContent.innerHTML = `

    <div class="day-hero">

      <div class="day-date">
        ${longDate(day.date)}
        ·
        ${escapeHTML(
          regionLabel(day.date)
        )}
      </div>


      <h2>
        ${escapeHTML(day.summary)}
      </h2>


      <div class="day-route">
        ${escapeHTML(route)}
      </div>


      <div class="stats">

        <span class="stat">
          📅 ${day.rows.length} items
        </span>

        ${
          day.rows.some(
            row => row.is_locked
          )
          ?
          `
            <span class="stat">
              🔒 Fixed booking
            </span>
          `
          :
          ""
        }

        ${
          day.rows.some(
            row => row.is_optional
          )
          ?
          `
            <span class="stat">
              🟠 Optional stops
            </span>
          `
          :
          ""
        }

      </div>

    </div>


    <div class="schedule-title">
      Today's Schedule
    </div>


    <div class="timeline">

      ${
        day.rows
          .map(
            renderScheduleItem
          )
          .join("")
      }

    </div>

  `;

}


/* =========================================
   SELECT DATE
========================================= */

function selectDate(date){

  currentDate = date;


  renderDateCards();

  renderDay();


  const card =
    document.querySelector(
      `.day-card[data-date="${date}"]`
    );


  if(card){

    card.scrollIntoView({
      behavior:"smooth",
      block:"nearest",
      inline:"center"
    });

  }


  history.replaceState(
    null,
    "",
    `?trip=${TRIP_ID}#${date}`
  );

}


/* =========================================
   FILTER
========================================= */

function setFilter(filter){

  currentFilter = filter;


  tripButtons.forEach(
    button => {

      button.classList.toggle(
        "active",
        button.dataset.filter === filter
      );

    }
  );


  const filtered =
    visibleDays();


  if(filter === "kyoto"){

    dateLabel.textContent =
      "Kyoto";

  }

  else if(filter === "road"){

    dateLabel.textContent =
      "Road Trip";

  }

  else if(filter === "osaka"){

    dateLabel.textContent =
      "Osaka";

  }

  else{

    dateLabel.textContent =
      "All Trip Dates";

  }


  if(
    !filtered.some(
      day =>
        day.date === currentDate
    )
  ){

    currentDate =
      filtered[0]?.date ||
      null;

  }


  renderDateCards();

  renderDay();


  dateScroll.scrollLeft = 0;

}


/* =========================================
   FILTER BUTTONS
========================================= */

tripButtons.forEach(
  button => {

    button.addEventListener(
      "click",
      () => {

        setFilter(
          button.dataset.filter
        );

      }
    );

  }
);


/* =========================================
   NAV LINKS
========================================= */

function updateNavigation(){

  const suffix =
    `?trip=${TRIP_ID}`;


  document.getElementById(
    "navSchedule"
  ).href =
    "schedule.html" + suffix;


  /*
    Keep Home and Hub aware of
    the selected trip too.

    They can ignore ?trip for now
    if those pages haven't been
    upgraded yet.
  */

  document.getElementById(
    "navHome"
  ).href =
    "index.html" + suffix;


  document.getElementById(
    "homeButton"
  ).href =
    "index.html" + suffix;


  document.getElementById(
    "navBookings"
  ).href =
    "bookings.html" + suffix;

}


/* =========================================
   INITIAL DATE
========================================= */

function chooseInitialDate(){

  const hash =
    window.location.hash
      .replace("#","");


  if(
    hash &&
    days.some(
      day =>
        day.date === hash
    )
  ){

    return hash;

  }


  /*
    During the actual trip,
    automatically open today.
  */

  const today =
    new Date();

  const yyyy =
    today.getFullYear();

  const mm =
    String(
      today.getMonth() + 1
    ).padStart(2,"0");

  const dd =
    String(
      today.getDate()
    ).padStart(2,"0");

  const todayString =
    `${yyyy}-${mm}-${dd}`;


  if(
    days.some(
      day =>
        day.date === todayString
    )
  ){

    return todayString;

  }


  return days[0]?.date || null;

}


/* =========================================
   ERROR
========================================= */

function showError(error){

  console.error(error);


  loadingState.innerHTML = `

    <div class="status-icon">
      ⚠️
    </div>

    <div class="status-title">
      Couldn't load schedule
    </div>

    <div class="status-text">
      ${escapeHTML(
        error?.message ||
        "Unknown database error."
      )}
    </div>

  `;

}


/* =========================================
   START APP
========================================= */

async function start(){

  try{

    updateNavigation();


    await Promise.all([
      loadTrip(),
      loadSchedule()
    ]);


    tripSubtitle.textContent =
      `${trip.name} · ${tripDateRange()}`;


    buildDays();


    if(!days.length){

      loadingState.innerHTML = `

        <div class="status-icon">
          📭
        </div>

        <div class="status-title">
          No schedule yet
        </div>

        <div class="status-text">
          This trip does not have
          any schedule items yet.
        </div>

      `;

      return;

    }


    currentDate =
      chooseInitialDate();


    loadingState.hidden = true;

    app.hidden = false;


    renderDateCards();

    renderDay();

  }

  catch(error){

    showError(error);

  }

}


start();

</script>
