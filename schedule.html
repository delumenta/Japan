const dates=document.getElementById('dates'),content=document.getElementById('content'),dateLabel=document.getElementById('dateLabel');let active=18,filter='all';
const mapLink=q=>'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(q);
const dirLink=(a,b,m)=>'https://www.google.com/maps/dir/?api=1&origin='+encodeURIComponent(a)+'&destination='+encodeURIComponent(b)+'&travelmode='+m;
function actions(spec){if(!spec)return'';return '<div class="actions">'+spec.split('|').map(x=>{const i=x.indexOf(':'),t=x.slice(0,i),v=x.slice(i+1);if(t==='map')return `<a class="action" target="_blank" href="${mapLink(v)}">📍 Maps</a>`;if(t==='food')return `<a class="action food" href="${v}">🍽️ Food</a>`;return''}).join('')+'</div>'}
function renderCards(){dates.innerHTML='';days.filter(x=>filter==='all'||x.trip===filter).forEach(x=>{let b=document.createElement('button');b.className='card'+(x.d===active?' active':'');b.innerHTML=`<div class="num">${x.d} OCT</div><div class="area">${x.area}</div><div class="sum">${x.summary}</div><div class="lvl">${x.level}</div>`;b.onclick=()=>{active=x.d;renderCards();renderDay();history.replaceState(null,'','#day-'+x.d)};dates.appendChild(b)})}
function renderDay(){const x=days.find(v=>v.d===active);let h=`<section class="hero"><div class="hero-date">${x.d} OCTOBER · ${x.area}</div><h2>${x.title}</h2><div class="route">${x.route||''}</div><div class="stats"><span class="stat">${x.level}</span>${(x.stats||[]).map(s=>`<span class="stat">${s}</span>`).join('')}</div></section>`;if(x.flex){h+=`<div class="flex"><strong>Schedule not locked yet</strong>${x.flex}<div class="actions" style="justify-content:center"><a class="action food" href="osakafood.html">🌃 Osaka Food Finder</a></div></div>`}else{h+='<div class="label">Today\'s Schedule</div>';(x.stops||[]).forEach((s,i)=>{h+=`<div class="stop"><div class="time">${s[0]}</div><div><div class="place">${s[1]}</div>${s[2]?`<div class="note">${s[2]}</div>`:''}${actions(s[3])}</div></div>`;(x.moves||[]).filter(m=>m[0]===i).forEach(m=>{let mode=m[1].includes('🚗')?'driving':m[1].includes('🚶')?'walking':'transit',p=m[2].split('→').map(v=>v.trim()),link=p.length===2?`<a target="_blank" href="${dirLink(p[0],p[1],mode)}">Route ↗</a>`:'';h+=`<div class="move"><strong>${m[1]} ${m[2]}</strong> · ${m[3]} ${link}</div>`})})}if(x.optional)h+=`<div class="optional">${x.optional}</div>`;if(x.highlight)h+=`<div class="highlight">${x.highlight}</div>`;content.innerHTML=h}
document.querySelectorAll('.trip').forEach(btn=>btn.onclick=()=>{filter=btn.dataset.trip;document.querySelectorAll('.trip').forEach(b=>b.classList.toggle('active',b===btn));let v=days.filter(x=>filter==='all'||x.trip===filter);if(!v.some(x=>x.d===active))active=v[0].d;dateLabel.textContent=filter==='kyoto'?'Kyoto · 18–22 October':filter==='road'?'Road Trip · 23–26 October':filter==='osaka'?'Osaka Base · 27–31 October':'All Trip Dates';renderCards();renderDay();dates.scrollLeft=0});
const hash=location.hash.match(/day-(\d+)/);if(hash&&days.some(x=>x.d===Number(hash[1])))active=Number(hash[1]);renderCards();renderDay();
