<!doctype html>
<html lang="en">

<head>
<meta charset="utf-8">
<meta
  name="viewport"
  content="width=device-width, initial-scale=1, viewport-fit=cover"
>
<meta name="theme-color" content="#070c10">

<title>Food</title>

<style>

:root{
  --bg:#070c10;
  --panel:#10161c;
  --panel2:#151c23;
  --line:#29323b;
  --text:#f5f5f3;
  --muted:#aeb5bc;

  --red:#c96f68;
  --blue:#5c9dff;
  --green:#67c587;
  --orange:#f4a34d;
  --gold:#e3b85c;
  --purple:#ad8cff;
}

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  min-height:100vh;

  background:
    radial-gradient(
      circle at 50% -15%,
      #17212a 0%,
      transparent 38%
    ),
    var(--bg);

  color:var(--text);

  font-family:
    Inter,
    ui-sans-serif,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
}

button,
input{
  font:inherit;
}


/* =========================================================
   HEADER
========================================================= */

header{
  position:sticky;
  top:0;
  z-index:40;

  padding:
    calc(9px + env(safe-area-inset-top))
    12px
    8px;

  border-bottom:1px solid var(--line);

  background:rgba(7,12,16,.97);

  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
}

.header-inner{
  max-width:760px;
  margin:auto;
}

.title-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.eyebrow{
  color:var(--red);
  font-size:8px;
  font-weight:900;
  letter-spacing:.14em;
  text-transform:uppercase;
}

h1{
  margin:2px 0 0;

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-size:23px;
  line-height:1.1;
}

.trip-name{
  margin-top:2px;
  color:var(--muted);
  font-size:8px;
}

.add-btn{
  flex:0 0 auto;
  min-height:35px;
  padding:6px 10px;

  border:
    1px solid
    rgba(201,111,104,.35);

  border-radius:10px;

  background:
    rgba(201,111,104,.10);

  color:#f4d4d1;

  font-size:9px;
  font-weight:900;

  cursor:pointer;
}


/* =========================================================
   MAIN TABS
========================================================= */

.main-tabs{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:5px;
  margin-top:9px;
}

.main-tab{
  min-height:37px;

  border:1px solid var(--line);
  border-radius:10px;

  background:#11181e;
  color:var(--muted);

  font-size:9px;
  font-weight:900;

  cursor:pointer;
}

.main-tab.active{
  color:#fff;

  border-color:
    rgba(201,111,104,.5);

  background:
    rgba(201,111,104,.12);
}


/* =========================================================
   SEARCH
========================================================= */

.search{
  width:100%;
  min-height:38px;
  margin-top:7px;
  padding:8px 11px;

  border:1px solid var(--line);
  border-radius:10px;

  outline:none;

  background:#10171d;
  color:#fff;

  font-size:10px;
}

.search::placeholder{
  color:#748089;
}

.search:focus{
  border-color:var(--red);
}


/* =========================================================
   CHIPS
========================================================= */

.chips{
  display:flex;
  gap:5px;
  overflow-x:auto;
  margin-top:6px;
  padding-bottom:2px;
  scrollbar-width:none;
}

.chips::-webkit-scrollbar{
  display:none;
}

.chip{
  flex:0 0 auto;
  min-height:28px;
  padding:4px 9px;

  border:1px solid var(--line);
  border-radius:999px;

  background:#10171d;
  color:#b8c0c6;

  font-size:8px;
  font-weight:800;

  white-space:nowrap;
  cursor:pointer;
}

.chip.active{
  color:#fff;
  border-color:var(--red);

  background:
    rgba(201,111,104,.12);
}


/* =========================================================
   DISCOVER
========================================================= */

.discover-controls{
  display:none;
}

.discover-controls.show{
  display:block;
}

.mode-switch{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:5px;
  margin-top:6px;
}

.mode-btn{
  min-height:30px;

  border:1px solid var(--line);
  border-radius:9px;

  background:#11181e;
  color:var(--muted);

  font-size:8px;
  font-weight:850;

  cursor:pointer;
}

.mode-btn.active{
  color:#fff;

  border-color:
    rgba(201,111,104,.45);

  background:
    rgba(201,111,104,.10);
}


/* =========================================================
   MAIN
========================================================= */

main{
  max-width:760px;
  margin:auto;

  padding:
    11px
    12px
    95px;
}

.result-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;

  margin:
    1px
    2px
    9px;
}

.result-title{
  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-size:18px;
  font-weight:800;
}

.result-count{
  color:var(--muted);
  font-size:8px;
}


/* =========================================================
   SECTION
========================================================= */

.food-section{
  margin-bottom:17px;
}

.section-title{
  display:flex;
  align-items:center;
  gap:6px;

  margin:
    4px
    2px
    7px;

  padding-bottom:5px;

  border-bottom:
    1px solid
    rgba(255,255,255,.07);

  color:#fff;

  font-size:10px;
  font-weight:900;
}

.section-title span:last-child{
  margin-left:auto;
  color:#74818a;
  font-size:7px;
}


/* =========================================================
   RESTAURANT CARD
========================================================= */

.restaurant-card{
  margin-bottom:6px;
  padding:9px 10px;

  border:1px solid var(--line);
  border-radius:12px;

  background:
    linear-gradient(
      145deg,
      #141c22,
      #0d1318
    );
}

.card-top{
  display:flex;
  align-items:flex-start;
  gap:8px;
}

.food-icon{
  flex:0 0 auto;

  width:28px;
  height:28px;

  display:flex;
  align-items:center;
  justify-content:center;

  border:
    1px solid
    rgba(201,111,104,.16);

  border-radius:8px;

  background:
    rgba(201,111,104,.07);

  font-size:14px;
}

.card-main{
  flex:1;
  min-width:0;
}

.restaurant-name{
  margin:0;
  color:#fff;
  font-size:12px;
  font-weight:900;
  line-height:1.25;
}

.japanese{
  margin-top:1px;
  color:#7f8a93;
  font-size:8px;
}

.location{
  margin-top:2px;
  color:var(--muted);
  font-size:8px;
}


/* =========================================================
   BADGES
========================================================= */

.badges{
  display:flex;
  flex-wrap:wrap;
  gap:3px;
  margin-top:5px;
}

.badge{
  padding:2px 5px;

  border:1px solid var(--line);
  border-radius:999px;

  background:
    rgba(255,255,255,.03);

  color:#c9d0d5;

  font-size:7px;
  font-weight:850;
}

.badge.pick{
  color:#f0cb6b;

  border-color:
    rgba(227,184,92,.25);

  background:
    rgba(227,184,92,.08);
}

.badge.flex{
  color:#aebdff;

  border-color:
    rgba(92,157,255,.22);

  background:
    rgba(92,157,255,.08);
}

.badge.top{
  color:#e5c46d;

  border-color:
    rgba(227,184,92,.22);

  background:
    rgba(227,184,92,.07);
}

.badge.hot{
  color:#ffab7f;

  border-color:
    rgba(244,163,77,.22);

  background:
    rgba(244,163,77,.07);
}

.badge.scheduled{
  color:#9fe1b5;

  border-color:
    rgba(103,197,135,.22);

  background:
    rgba(103,197,135,.07);
}

.badge.eaten{
  color:#b9e4c7;
  border-color:rgba(103,197,135,.28);
  background:rgba(103,197,135,.10);
}

.restaurant-card.eaten-card{
  opacity:.72;
}


/* =========================================================
   META
========================================================= */

.meta{
  display:flex;
  flex-wrap:wrap;
  gap:4px;
  margin-top:6px;
}

.meta-item{
  padding:3px 6px;

  border:
    1px solid
    rgba(255,255,255,.06);

  border-radius:6px;

  background:
    rgba(255,255,255,.025);

  color:#c7cdd1;

  font-size:7px;
  font-weight:800;
}


/* =========================================================
   PLAN
========================================================= */

.plan-box{
  margin-top:6px;
  padding:6px 8px;

  border:
    1px solid
    rgba(103,197,135,.18);

  border-radius:8px;

  background:
    rgba(103,197,135,.05);

  color:#b8ddc4;

  font-size:8px;
  font-weight:800;
}


/* =========================================================
   DESCRIPTION
========================================================= */

.description{
  margin-top:6px;
  color:var(--muted);
  font-size:8px;
  line-height:1.4;
}


/* =========================================================
   ACTIONS
========================================================= */

.actions{
  display:flex;
  flex-wrap:wrap;
  gap:4px;
  margin-top:7px;
}

.action-btn{
  min-height:28px;

  display:inline-flex;
  align-items:center;
  justify-content:center;

  padding:4px 8px;

  border:
    1px solid
    rgba(201,111,104,.25);

  border-radius:7px;

  background:
    rgba(201,111,104,.06);

  color:var(--red);

  text-decoration:none;

  font-size:7px;
  font-weight:900;

  cursor:pointer;
}

.action-btn.gold{
  color:var(--gold);

  border-color:
    rgba(227,184,92,.22);

  background:
    rgba(227,184,92,.05);
}

.action-btn.green{
  color:var(--green);

  border-color:
    rgba(103,197,135,.22);

  background:
    rgba(103,197,135,.05);
}

.action-btn.blue{
  color:var(--blue);

  border-color:
    rgba(92,157,255,.22);

  background:
    rgba(92,157,255,.05);
}

.action-btn.muted{
  color:#9ca6ad;
  border-color:var(--line);
  background:#11181e;
}


/* =========================================================
   STATES
========================================================= */

.state{
  padding:28px 16px;

  border:
    1px dashed
    #35414a;

  border-radius:14px;

  text-align:center;
  color:var(--muted);

  font-size:9px;
  line-height:1.5;
}

.state strong{
  display:block;
  margin-bottom:4px;
  color:#fff;
  font-size:12px;
}


/* =========================================================
   SHEETS
========================================================= */

.sheet-backdrop,
.more-backdrop{
  position:fixed;
  inset:0;

  z-index:150;

  display:none;
  align-items:flex-end;

  background:
    rgba(0,0,0,.68);

  backdrop-filter:blur(4px);
}

.sheet-backdrop.open,
.more-backdrop.open{
  display:flex;
}

.sheet,
.more-sheet{
  width:100%;
  max-width:760px;

  max-height:
    calc(92vh - env(safe-area-inset-top));

  overflow-y:auto;

  margin:0 auto;

  padding:
    8px
    14px
    calc(18px + env(safe-area-inset-bottom));

  border:1px solid var(--line);

  border-radius:
    20px
    20px
    0
    0;

  background:#0d1318;
}

.sheet-handle{
  width:38px;
  height:4px;

  margin:
    2px
    auto
    12px;

  border-radius:999px;

  background:#39454d;
}

.sheet-head,
.more-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:12px;
}

.sheet-title,
.more-title{
  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-size:19px;
}

.close-btn,
.more-close{
  width:34px;
  height:34px;

  border:1px solid var(--line);
  border-radius:9px;

  background:#151c22;
  color:#fff;

  cursor:pointer;
}


/* =========================================================
   GOOGLE PLACES
========================================================= */

.google-place-box{
  grid-column:1/-1;

  margin-bottom:2px;
  padding:10px;

  border:
    1px solid
    rgba(92,157,255,.22);

  border-radius:11px;

  background:
    rgba(92,157,255,.05);
}

.google-place-label{
  margin-bottom:6px;
  color:#aeb5bc;
  font-size:7px;
  font-weight:900;
}

#googlePlaceSearch{
  width:100%;
}

#googlePlaceSearch gmp-place-autocomplete,
gmp-place-autocomplete{
  width:100%;
  min-height:42px;
}

.place-status{
  margin-top:6px;
  color:#81909a;
  font-size:7px;
  line-height:1.4;
}

.place-status.success{
  color:#9fe1b5;
}

.place-status.error{
  color:#ffc5c1;
}


/* =========================================================
   FORM
========================================================= */

.form-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
}

.field.full{
  grid-column:1/-1;
}

.field label{
  display:block;
  margin-bottom:4px;
  color:#aeb5bc;
  font-size:7px;
  font-weight:900;
}

.field input,
.field textarea{
  width:100%;
  min-height:40px;
  padding:8px 9px;

  border:1px solid var(--line);
  border-radius:9px;

  outline:none;

  background:#10171d;
  color:#fff;

  font-size:10px;
}

.field textarea{
  min-height:70px;
  resize:vertical;
}

.field input:focus,
.field textarea:focus{
  border-color:var(--red);
}

.checks{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:5px;
  margin-top:10px;
}

.check{
  display:flex;
  align-items:center;
  gap:6px;

  min-height:39px;
  padding:6px 8px;

  border:1px solid var(--line);
  border-radius:9px;

  background:#11181e;
  color:#d1d6da;

  font-size:8px;
  font-weight:800;
}

.check input{
  width:15px;
  height:15px;
}

.save-btn{
  width:100%;
  min-height:44px;
  margin-top:11px;

  border:
    1px solid
    rgba(201,111,104,.4);

  border-radius:10px;

  background:
    rgba(201,111,104,.13);

  color:#f4d4d1;

  font-size:9px;
  font-weight:900;

  cursor:pointer;
}

.save-btn:disabled{
  opacity:.5;
}

.form-message{
  display:none;
  margin-top:8px;
  padding:8px;
  border-radius:8px;
  font-size:8px;
}

.form-message.error{
  display:block;

  color:#ffc5c1;

  border:
    1px solid
    rgba(201,111,104,.25);

  background:
    rgba(201,111,104,.07);
}

.form-message.success{
  display:block;

  color:#b9e4c7;

  border:
    1px solid
    rgba(103,197,135,.25);

  background:
    rgba(103,197,135,.07);
}



/* =========================================================
   PERMANENT RIGHT-SIDE FOOD FILTER
========================================================= */

.food-side-filter{
  position:fixed;
  top:50%;
  right:6px;
  z-index:82;

  width:74px;
  max-height:72vh;
  padding:5px;

  transform:translateY(-50%);

  overflow-y:auto;
  scrollbar-width:none;

  border:1px solid rgba(255,255,255,.08);
  border-radius:12px;

  background:rgba(9,14,18,.93);
  box-shadow:0 8px 28px rgba(0,0,0,.28);

  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
}

.food-side-filter::-webkit-scrollbar{
  display:none;
}

.food-side-title{
  padding:2px 2px 5px;

  color:#707b84;

  font-size:6px;
  font-weight:950;
  letter-spacing:.12em;
  text-align:center;
}

.food-side-btn{
  width:100%;
  min-height:34px;
  margin:0 0 3px;
  padding:4px 3px;

  display:flex;
  align-items:center;
  gap:4px;

  border:1px solid transparent;
  border-radius:8px;

  background:transparent;
  color:#a6afb6;

  font-size:6px;
  font-weight:900;
  text-align:left;

  cursor:pointer;
}

.food-side-btn:last-child{
  margin-bottom:0;
}

.food-side-btn .side-food-icon{
  width:17px;
  flex:0 0 17px;

  font-size:13px;
  line-height:1;
  text-align:center;
}

.food-side-btn .side-food-label{
  min-width:0;
  overflow:hidden;

  text-overflow:ellipsis;
  white-space:nowrap;
}

.food-side-btn.active{
  border-color:rgba(201,111,104,.40);
  background:rgba(201,111,104,.13);
  color:#fff;
}

.food-side-btn.active .side-food-label{
  color:#f1cbc7;
}

/* Keep cards clear of the permanent filter on small screens. */
@media(max-width:799px){
  main{
    padding-right:84px;
  }
}

@media(min-width:800px){
  .food-side-filter{
    right:max(8px, calc((100vw - 760px)/2 - 84px));
  }
}


/* =========================================================
   DESKTOP
========================================================= */

@media(min-width:700px){

  .sheet{
    max-width:620px;
  }

}


/* Discover is now: City -> Area. Food type lives only in the fixed right filter. */
#discoverModeRow,
.discover-mode,
.discover-modes,
.mode-tabs{
  display:none !important;
}

/* Keep the permanent right food filter slimmer and closer to the outer edge. */
.food-side-filter{
  width:66px !important;
  right:3px !important;
  padding:4px !important;
}

.food-side-btn{
  min-height:32px !important;
  padding:3px 2px !important;
}

.food-side-btn .side-food-icon{
  width:15px !important;
  flex-basis:15px !important;
  font-size:12px !important;
}

.food-side-btn .side-food-label{
  font-size:5.5px !important;
}

@media(max-width:799px){
  main{
    padding-right:73px !important;
  }
}

@media(min-width:800px){
  .food-side-filter{
    right:max(3px, calc((100vw - 760px)/2 - 72px)) !important;
  }
}


/* Discover header now follows My Food:
   tabs -> search -> city only.
   Food type is handled by the permanent right-side filter. */
#discoverModeRow,
.discover-mode,
.discover-modes,
.mode-tabs,
#browseChips{
  display:none !important;
}


#discoverControls,
.discover-controls{
  display:none !important;
}

/* =========================================================
   FINAL FOOD FILTER POSITION
   Always visible while scrolling, aligned to the site's
   right edge rather than the browser's far-right edge.
========================================================= */

.food-side-filter{
  position:fixed !important;
  top:50% !important;
  right:max(8px, calc((100vw - 760px)/2 - 76px)) !important;

  width:68px !important;
  max-height:76vh;

  transform:translateY(-50%) !important;

  overflow-y:auto;
  scrollbar-width:none;

  z-index:90;
}

.food-side-filter::-webkit-scrollbar{
  display:none;
}

/* The filter floats outside the main 760px content on wide screens,
   so it must not reserve/squeeze card width. */
main{
  padding-right:inherit !important;
}

/* Discover gets one compact second filter row only. */
.discover-status-row{
  margin-top:8px;
}

@media(max-width:900px){
  .food-side-filter{
    right:4px !important;
    width:62px !important;
  }

  main{
    padding-right:70px !important;
  }
}


#discoverControls,
.discover-controls,
#browseChips{
  display:none !important;
}




/* =========================================================
   CLEAN HEADER + FIXED FOOD RAIL
========================================================= */

/* Never squeeze the whole page/header for the rail. */
main{
  padding-right:0 !important;
}

/* Discover area lives in the header and scrolls horizontally. */
.discover-area-row{
  margin-top:7px;
  flex-wrap:nowrap !important;
  overflow-x:auto;
  overflow-y:hidden;
  scrollbar-width:none;
  -webkit-overflow-scrolling:touch;
}

.discover-area-row::-webkit-scrollbar{
  display:none;
}

.discover-area-row .chip{
  flex:0 0 auto;
}

/* FOOD only stays fixed and visible at restaurant 1, 10, 30, etc. */
.food-side-filter{
  position:fixed !important;
  top:50% !important;
  right:max(6px, calc((100vw - 760px)/2 - 74px)) !important;

  width:66px !important;
  max-height:72vh;

  transform:translateY(-50%) !important;

  z-index:90;
}

/* Reserve room only around the restaurant-results region, never the header. */
.results-section,
.results-wrap,
#results,
#restaurantList,
#foodList{
  padding-right:0;
}

@media(max-width:900px){
  .food-side-filter{
    right:3px !important;
    width:60px !important;
  }

  /* Only cards/results need breathing room on narrow screens. */
  .restaurant-list,
  .cards,
  #restaurantList,
  #foodList{
    padding-right:64px !important;
  }

  main{
    padding-right:0 !important;
  }
}


/* =========================================================
   COMPACT STICKY FILTER BAR
========================================================= */

/* Retire previous side-rail / area-chip experiments. */
.food-side-filter,
#foodSideFilter,
.discover-area-row,
#discoverAreaRow{
  display:none !important;
}

main{
  padding-right:0 !important;
}

/* =========================================================
   TRIP
========================================================= */

const params =
  new URLSearchParams(
    window.location.search
  );

let TRIP_ID =
  Number(
    params.get("trip")
  ) || null;


/* =========================================================
   DATA
========================================================= */

let trip = null;

let restaurants = [];

let tripRestaurants = [];

let scheduleRows = [];

let currentUser = null;


/* =========================================================
   STATE
========================================================= */

let activeTab = "mine";

let selectedCity = "";

let myFilter = "all";

let discoverMode = "area"; // retained for compatibility; Discover now uses area only

let discoverFilter = "";

let searchTerm = "";

let foodGroupFilter = "";
let discoverStatusFilter = "all";
let sideAreaFilter = "";


/* =========================================================
   ELEMENTS
========================================================= */

const tripName =
  document.getElementById(
    "tripName"
  );

const tripEyebrow =
  document.getElementById(
    "tripEyebrow"
  );

const results =
  document.getElementById(
    "results"
  );

const resultTitle =
  document.getElementById(
    "resultTitle"
  );

const resultCount =
  document.getElementById(
    "resultCount"
  );

const searchInput =
  document.getElementById(
    "searchInput"
  );

const cityChips =
  document.getElementById(
    "cityChips"
  );

const myFilters =
  document.getElementById(
    "myFilters"
  );

  document.getElementById(
    "discoverControls"
  );

const browseChips =
  document.getElementById(
    "browseChips"

/* =========================================================
   BASIC HELPERS
========================================================= */

function text(value){

  return String(
    value ?? ""
  );

}


function esc(value){

  return text(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


function norm(value){

  return text(value)
    .trim()
    .toLowerCase();

}


function unique(values){

  return [
    ...new Set(
      values
        .map(
          value =>
            text(value).trim()
        )
        .filter(Boolean)
    )
  ]
  .sort(
    (a,b) =>
      a.localeCompare(b)
  );

}


/* =========================================================
   ACCESSIBLE TRIPS
========================================================= */

async function getAccessibleTrips(){

  const {
    data:userData,
    error:userError
  } =
    await db.auth.getUser();


  if(userError){
    throw userError;
  }


  const user =
    userData?.user;


  if(!user){

    throw new Error(
      "You are not signed in."
    );

  }


  currentUser =
    user;


  /* OWNED */

  const ownedResult =
    await db
      .from("trips")
      .select("*")
      .eq(
        "owner_id",
        user.id
      );


  if(ownedResult.error){
    throw ownedResult.error;
  }


  /* SHARED */

  const memberResult =
    await db
      .from("trip_members")
      .select("trip_id")
      .eq(
        "user_id",
        user.id
      );


  if(memberResult.error){
    throw memberResult.error;
  }


  const sharedIds =
    [
      ...new Set(
        (memberResult.data || [])
          .map(
            row =>
              Number(row.trip_id)
          )
          .filter(
            Number.isFinite
          )
      )
    ];


  let sharedTrips = [];


  if(sharedIds.length){

    const sharedResult =
      await db
        .from("trips")
        .select("*")
        .in(
          "id",
          sharedIds
        );


    if(sharedResult.error){
      throw sharedResult.error;
    }


    sharedTrips =
      sharedResult.data || [];

  }


  /* COMBINE */

  const tripMap =
    new Map();


  (ownedResult.data || [])
    .forEach(
      item => {

        tripMap.set(
          Number(item.id),
          {
            ...item,
            __role:"owner"
          }
        );

      }
    );


  sharedTrips.forEach(
    item => {

      const id =
        Number(item.id);


      if(!tripMap.has(id)){

        tripMap.set(
          id,
          {
            ...item,
            __role:"member"
          }
        );

      }

    }
  );


  return [
    ...tripMap.values()
  ]
  .sort(
    (a,b) =>
      String(
        a.start_date || ""
      )
      .localeCompare(
        String(
          b.start_date || ""
        )
      )
  );

}


/* =========================================================
   RESOLVE CURRENT TRIP
========================================================= */

async function resolveTrip(){

  const accessibleTrips =
    await getAccessibleTrips();


  if(!accessibleTrips.length){

    throw new Error(
      "No trips are available for this account."
    );

  }


  /* No trip in URL */

  if(!TRIP_ID){

    TRIP_ID =
      Number(
        accessibleTrips[0].id
      );


    history.replaceState(
      {},
      "",
      `food.html?trip=${TRIP_ID}`
    );

  }


  const allowed =
    accessibleTrips.some(
      item =>
        Number(item.id) ===
        Number(TRIP_ID)
    );


  if(!allowed){

    TRIP_ID =
      Number(
        accessibleTrips[0].id
      );


    history.replaceState(
      {},
      "",
      `food.html?trip=${TRIP_ID}`
    );

  }


}


/* =========================================================
   RESTAURANT HELPERS
========================================================= */

function rCity(r){
  return r.city || "";
}

function rArea(r){
  return r.area || "";
}

function rCuisine(r){
  return r.cuisine || "Restaurant";
}

function rJapanese(r){
  return r.name_japanese || "";
}

function rRating(r){
  return r.rating ?? "";
}

function rPrice(r){

  return (
    r.price ||
    r.dinner_price ||
    r.lunch_price ||
    ""
  );

}

function rDescription(r){
  return r.description || "";
}

function rLocation(r){

  return (
    r.location ||
    r.area ||
    r.city ||
    ""
  );

}


/* =========================================================
   FOOD ICON
========================================================= */

function foodIcon(value){

  const v =
    norm(value);


  if(v.includes("ramen"))
    return "🍜";

  if(v.includes("sushi"))
    return "🍣";

  if(v.includes("yakitori"))
    return "🍢";

  if(v.includes("chicken"))
    return "🍗";

  if(v.includes("oyakodon"))
    return "🍳";

  if(
    v.includes("udon") ||
    v.includes("soba")
  )
    return "🥢";

  if(v.includes("tonkatsu"))
    return "🐷";

  if(v.includes("unagi"))
    return "🐟";

  if(v.includes("tempura"))
    return "🍤";

  if(v.includes("curry"))
    return "🍛";

  if(v.includes("izakaya"))
    return "🍶";

  if(v.includes("gyoza"))
    return "🥟";

  if(v.includes("bakery"))
    return "🥐";

  if(v.includes("seafood"))
    return "🦐";


  return "🍽️";

}


/* =========================================================
   RELATIONS
========================================================= */

function relationFor(id){

  return tripRestaurants.find(
    item =>
      Number(item.restaurant_id)
      ===
      Number(id)
  );

}


function inMyFood(r){

  return Boolean(
    relationFor(r.id)
  );

}


function isPick(r){

  return Boolean(
    relationFor(r.id)
      ?.is_pick
  );

}


function isFlexible(r){

  return Boolean(
    relationFor(r.id)
      ?.is_flexible
  );

}


function isEaten(r){

  return Boolean(
    relationFor(r.id)
      ?.is_eaten
  );

}


function eatenDate(r){

  const value =
    relationFor(r.id)
      ?.eaten_at;

  if(!value){
    return "";
  }

  const d = new Date(value);

  if(Number.isNaN(d.getTime())){
    return "";
  }

  return new Intl.DateTimeFormat(
    "en-SG",
    {
      day:"numeric",
      month:"short"
    }
  )
  .format(d)
  .toUpperCase();

}


function scheduleFor(r){

  return scheduleRows
    .filter(
      item =>
        Number(item.restaurant_id)
        ===
        Number(r.id)
    )
    .sort(
      (a,b) =>
        String(
          a.schedule_date
        )
        .localeCompare(
          String(
            b.schedule_date
          )
        )
    );

}


function isScheduled(r){

  return (
    scheduleFor(r).length > 0
  );

}


/* =========================================================
   MASTER FLAGS
========================================================= */

function isTop(r){

  if(
    r.is_tabelog_top100 === true
  ){
    return true;
  }


  const award =
    norm(
      r.award ||
      r.recognition
    );


  return (
    award.includes("top 100") ||
    award.includes("top100")
  );

}


function isHot(r){

  if(
    r.is_hot === true
  ){
    return true;
  }


  return norm(
    r.award ||
    r.recognition
  )
  .includes(
    "hot restaurant"
  );

}


/* =========================================================
   DATE
========================================================= */

function formatScheduleDate(
  value
){

  if(!value){
    return "";
  }


  const d =
    new Date(
      value +
      "T12:00:00"
    );


  return new Intl.DateTimeFormat(
    "en-SG",
    {
      day:"numeric",
      month:"short"
    }
  )
  .format(d)
  .toUpperCase();

}


function formatTripDate(
  value
){

  if(!value){
    return "";
  }


  const d =
    new Date(
      value +
      "T12:00:00"
    );


  return d.toLocaleDateString(
    "en-SG",
    {
      day:"numeric",
      month:"short",
      year:"numeric"
    }
  );

}


/* =========================================================
   LOAD DATA
========================================================= */

async function loadData(){

  try{


    /* -----------------------------------------------
       RESOLVE USER + TRIP
    ----------------------------------------------- */

    await resolveTrip();


    /* -----------------------------------------------
       TRIP
    ----------------------------------------------- */

    const tripResult =
      await db
        .from("trips")
        .select("*")
        .eq(
          "id",
          TRIP_ID
        )
        .single();


    if(tripResult.error){
      throw tripResult.error;
    }


    trip =
      tripResult.data;


    tripName.textContent =
      trip.name ||
      "My Trip";


    tripEyebrow.textContent =
      trip.country
      ?
      `${trip.country} · TRIP FOOD`
      :
      "TRIP FOOD";


    document.title =
      `Food · ${
        trip.name ||
        "My Trip"
      }`;


    /* -----------------------------------------------
       MASTER RESTAURANTS
    ----------------------------------------------- */

    const restaurantResult =
      await db
        .from("restaurants")
        .select("*")
        .order(
          "name",
          {
            ascending:true
          }
        );


    if(
      restaurantResult.error
    ){
      throw restaurantResult.error;
    }


    restaurants =
      restaurantResult.data || [];


    /*
      If restaurants have a country field,
      only show the current country's
      restaurants.

      Old rows without a country are kept
      visible for backwards compatibility.
    */

    if(trip.country){

      const country =
        norm(trip.country);


      const matching =
        restaurants.filter(
          restaurant => {

            if(
              !restaurant.country
            ){
              return true;
            }


            return (
              norm(
                restaurant.country
              )
              ===
              country
            );

          }
        );


      restaurants =
        matching;

    }


    /* -----------------------------------------------
       MY FOOD
    ----------------------------------------------- */

    const relationResult =
      await db
        .from(
          "trip_restaurants"
        )
        .select("*")
        .eq(
          "trip_id",
          TRIP_ID
        );


    if(
      relationResult.error
    ){
      throw relationResult.error;
    }


    tripRestaurants =
      relationResult.data || [];


    /* -----------------------------------------------
       SCHEDULED FOOD
    ----------------------------------------------- */

    const scheduleResult =
      await db
        .from("schedule")
        .select(`
          id,
          restaurant_id,
          schedule_date,
          start_time,
          time_label,
          title,
          is_locked
        `)
        .eq(
          "trip_id",
          TRIP_ID
        )
        .not(
          "restaurant_id",
          "is",
          null
        );


    if(
      scheduleResult.error
    ){

      console.warn(
        "Schedule food:",
        scheduleResult.error
      );


      scheduleRows = [];

    }

    else{

      scheduleRows =
        scheduleResult.data || [];

    }


    createCityChips();

    createDiscoverChips();

    render();

  }

  catch(error){

    console.error(
      "Food load error:",
      error
    );


    tripEyebrow.textContent =
      "FOOD";


    tripName.textContent =
      "Could not load trip";


    results.innerHTML = `

      <div class="state">

        <strong>
          Couldn't load Food
        </strong>

        ${esc(
          error.message ||
          "Unknown database error."
        )}

      </div>

    `;

  }

}

   SEARCH MATCH
========================================================= */

function matchesSearch(r){

  if(!searchTerm){
    return true;
  }


  const value =
    norm(
      [

        r.name,
        rJapanese(r),
        rCuisine(r),
        rCity(r),
        rArea(r),
        rLocation(r),
        rDescription(r),
        r.award,
        r.recognition,
        rRating(r),
        rPrice(r)

      ]
      .join(" ")
    );


  return value.includes(
    searchTerm
  );

}


/* =========================================================
   FILTER
========================================================= */

function filteredRestaurants(){

  let list =
    restaurants.slice();


  if(
    activeTab === "mine"
  ){

    list =
      list.filter(
        inMyFood
      );


    if(
      myFilter === "eaten"
    ){

      list =
        list.filter(
          isEaten
        );

    }

    else{

      /*
        Eaten restaurants are archived from normal My Food views.
        They remain available under the EATEN filter.
      */

      list =
        list.filter(
          restaurant =>
            !isEaten(restaurant)
        );


      if(
        myFilter === "pick"
      ){

        list =
          list.filter(
            isPick
          );

      }


      if(
        myFilter === "flexible"
      ){

        list =
          list.filter(
            isFlexible
          );

      }


      if(
        myFilter === "scheduled"
      ){

        list =
          list.filter(
            isScheduled
          );

      }

    }

  }


  if(selectedCity){

    list =
      list.filter(
        restaurant =>
          norm(
            rCity(restaurant)
          )
          ===
          norm(selectedCity)
      );

  }


  if(activeTab === "discover" && discoverFilter){
    list = list.filter(
      restaurant =>
        norm(rArea(restaurant)) === norm(discoverFilter)
    );
  }


  if(activeTab === "discover"){

    if(discoverStatusFilter === "tabelog"){

      list =
        list.filter(
          hasTabelog
        );

    }


    if(discoverStatusFilter === "eaten"){

      list =
        list.filter(
          isEaten
        );

    }

  }


  if(sideAreaFilter){

    list =
      list.filter(
        restaurant =>
          norm(rArea(restaurant))
          ===
          norm(sideAreaFilter)
      );

  }


  if(foodGroupFilter){

    list =
      list.filter(
        restaurant =>
          foodGroup(restaurant)
          ===
          foodGroupFilter
      );

  }


  list =
    list.filter(
      matchesSearch
    );


  return list;

}

function renderMine(list){

        </strong>

        ${
          myFilter === "all"

          ?

          `

            <b>＋ My Food</b>
            on restaurants you want to remember.
          `

          myFilter === "eaten"

          ?

          `
            Nothing marked as eaten yet.
          `

          :

          `
            No restaurants match this filter.
          `
        }

      </div>

    `;


    return;

  }


  if(
    myFilter !== "all"
  ){

    results.innerHTML =
      list
        .map(cardHTML)
        .join("");


    return;

  }


  const picks =
    list.filter(
      isPick
    );


  const scheduled =
    list.filter(
      restaurant =>
        isScheduled(restaurant) &&
        !isPick(restaurant)
    );


  const flexible =
    list.filter(
      restaurant =>
        isFlexible(restaurant) &&
        !isPick(restaurant) &&
        !isScheduled(restaurant)
    );


  const saved =
    list.filter(
      restaurant =>
        !isPick(restaurant) &&
        !isFlexible(restaurant) &&
        !isScheduled(restaurant)
    );


  let html = "";


  if(picks.length){

    html += sectionHTML(
      "⭐ PICKS",
      picks
    );

  }


  if(scheduled.length){

    html += sectionHTML(
      "📅 SCHEDULED",
      scheduled
    );

  }


  if(flexible.length){

    html += sectionHTML(
      "🌙 FLEXIBLE / MAYBE",
      flexible
    );

  }


  if(saved.length){

    html += sectionHTML(
      "❤️ SAVED",
      saved
    );

  }


  results.innerHTML =
    html;

}

/* =========================================================
   REMOVE
========================================================= */

async function removeFromMyFood(
  restaurantId
){

  const restaurant =
    restaurants.find(
      item =>
        Number(item.id)
        ===
        Number(restaurantId)
    );


  if(!restaurant){
    return;
  }


  const okay =
    confirm(
      `Remove "${restaurant.name}" from My Food?\n\nThe restaurant will stay in the master list.`
    );


  if(!okay){
    return;
  }


  try{

    const result =
      await db
        .from(
          "trip_restaurants"
        )
        .delete()
        .eq(
          "trip_id",
          TRIP_ID
        )
        .eq(
          "restaurant_id",
          restaurantId
        );


    if(result.error){
      throw result.error;
    }


    tripRestaurants =
      tripRestaurants.filter(
        item =>
          Number(
            item.restaurant_id
          )
          !==
          Number(
            restaurantId
          )
      );


    render();

  }

  catch(error){

    console.error(error);


    alert(
      error.message ||
      "Couldn't remove restaurant."
    );

  }

}

async function initGooglePlaces(){

  const host =
    document.getElementById(
      "googlePlaceSearch"
    );


  if(!host){
    return;
  }


  try{

    setPlaceStatus(
      "Loading Google Places…"
    );


    if(
      typeof window.loadGoogleMaps !== "function" ||
      typeof window.getGooglePlaces !== "function" ||
      typeof window.createGooglePlaceAutocomplete !== "function" ||
      typeof window.getGooglePlaceDetails !== "function" ||
      typeof window.normalizeGooglePlace !== "function"
    ){

      throw new Error(
        "The Google Maps helper functions were not found."
      );

    }


    await window.loadGoogleMaps();

    await window.getGooglePlaces();


    googlePlaceAutocomplete =
      await window
        .createGooglePlaceAutocomplete(
          host,
          {
            placeholder:
              `Search restaurant${
                trip?.country
                ?
                " in " + trip.country
                :
                ""
              }...`
          }
        );


    googlePlaceAutocomplete
      .addEventListener(
        "gmp-select",
        async event => {

          try{

            setPlaceStatus(
              "Getting place details…"
            );


            const place =
              await window
                .getGooglePlaceDetails(
                  event
                );


            const data =
              window
                .normalizeGooglePlace(
                  place
                );


            selectedGoogleLatitude =
              data.latitude ??
              null;


            selectedGoogleLongitude =
              data.longitude ??
              null;


            document.getElementById(
              "newName"
            ).value =
              data.name || "";


            document.getElementById(
              "newCity"
            ).value =
              data.city ||
              selectedCity ||
              "";


            document.getElementById(
              "newArea"
            ).value =
              data.area || "";


            document.getElementById(
              "newLocation"
            ).value =
              data.address || "";


            document.getElementById(
              "newMaps"
            ).value =
              data.maps_url || "";


            document.getElementById(
              "newWebsite"
            ).value =
              data.website_url || "";


            const cuisineInput =
              document.getElementById(
                "newCuisine"
              );


            if(
              !cuisineInput
                .value
                .trim()
            ){

              cuisineInput.value =
                guessCuisine(
                  place.types || []
                );

            }


            setPlaceStatus(
              `✓ ${
                data.name ||
                "Restaurant"
              } selected.`,
              "success"
            );

          }

          catch(error){

            console.error(
              "Google Places selection:",
              error
            );


            setPlaceStatus(
              "Google place error: " +
              (
                error.message ||
                String(error)
              ),
              "error"
            );

          }

        }
      );


    setPlaceStatus(
      "Search for a restaurant and select the correct Google result."
    );

  }

  catch(error){

    console.error(
      "Google Places init:",
      error
    );


    setPlaceStatus(
      "Google Places error: " +
      (
        error.message ||
        String(error)
      ),
      "error"
    );

  }

}

            )
            ===
            norm(name)
            &&
            norm(
              rCity(restaurant)
            )
            ===

        );


      if(duplicate){

        throw new Error(
          "This restaurant already appears to be in the master list. Find it in Discover and tap + My Food instead."
        );

      }


      /* -----------------------------------------------
         RATING
      ----------------------------------------------- */

      let rating =
        null;


      if(ratingText){

            ratingText
          );


        if(

          )
        ){

          throw new Error(

          );

      const newRestaurant =
        restaurantResult.data;


      /* -----------------------------------------------

      ----------------------------------------------- */

      if(addTrip){

        const relationResult =
          await db

              "trip_restaurants"
            )
            .insert({

              restaurant_id:

/* =========================================================
   NORMALIZED FOOD GROUPS
   Keep the database cuisine specific; only the UI is grouped.
========================================================= */

const FOOD_GROUPS = [
  { key:"sushi",    label:"SUSHI",    icon:"🍣" },
  { key:"noodles",  label:"NOODLES",  icon:"🍜" },
  { key:"yakitori", label:"YAKITORI", icon:"🍢" },
  { key:"katsu",    label:"KATSU",    icon:"🐷" },
  { key:"rice",     label:"RICE",     icon:"🍚" },
  { key:"tempura",  label:"TEMPURA",  icon:"🍤" },
  { key:"seafood",  label:"SEAFOOD",  icon:"🐟" },
  { key:"curry",    label:"CURRY",    icon:"🍛" },
  { key:"izakaya",  label:"IZAKAYA",  icon:"🍶" },
  { key:"cafe",     label:"CAFE",     icon:"☕" }
];


function foodGroup(restaurant){

  const value =
    norm(
      rCuisine(restaurant)
    );


  if(
    value.includes("sushi") ||
    value.includes("sashimi") ||
    value.includes("omakase")
  ){
    return "sushi";
  }


  if(
    value.includes("ramen") ||
    value.includes("udon") ||
    value.includes("soba") ||
    value.includes("noodle")
  ){
    return "noodles";
  }


  if(
    value.includes("yakitori") ||
    value.includes("kushiyaki") ||
    value.includes("chicken")
  ){
    return "yakitori";
  }


  if(
    value.includes("tonkatsu") ||
    value.includes("katsu")
  ){
    return "katsu";
  }


  if(
    value.includes("oyakodon") ||
    value.includes("donburi") ||
    value.includes("rice bowl") ||
    value.includes("rice")
  ){
    return "rice";
  }


  if(
    value.includes("tempura")
  ){
    return "tempura";
  }


  if(
    value.includes("unagi") ||
    value.includes("eel") ||
    value.includes("seafood") ||
    value.includes("fish")
  ){
    return "seafood";
  }


  if(
    value.includes("curry")
  ){
    return "curry";
  }


  if(
    value.includes("izakaya") ||
    value.includes("japanese pub")
  ){
    return "izakaya";
  }


  if(
    value.includes("cafe") ||
    value.includes("coffee") ||
    value.includes("dessert") ||
    value.includes("sweet") ||
    value.includes("wagashi") ||
    value.includes("bakery") ||
    value.includes("pastry")
  ){
    return "cafe";
  }


  return "";
}

function renderDiscoverArea(){

  if(activeTab !== "discover"){

    discoverAreaRow.style.display = "none";
    sideAreaFilter = "";
    return;

  }


  const source =
    discoverAreaSource();


  const counts =
    new Map();


  source.forEach(
    restaurant => {

      const area =
        text(rArea(restaurant)).trim();


      if(!area){
        return;
      }


      const key =
        norm(area);


      if(!counts.has(key)){
        counts.set(
          key,
          {
            label:area,
            count:0
          }
        );
      }


      counts.get(key).count += 1;

    }
  );


  const areas =
    [...counts.values()]
      .sort(
        (a,b) =>
          a.label.localeCompare(b.label)
      );


  if(
    sideAreaFilter &&
    !areas.some(
      area =>
        norm(area.label)
        ===
        norm(sideAreaFilter)
    )
  ){
    sideAreaFilter = "";
  }


  discoverAreaRow.style.display = "none";


  discoverAreaRow.innerHTML = `

    <button
      class="chip ${!sideAreaFilter ? "active" : ""}"
      data-discover-area=""
      type="button"
    >
      📍 ALL AREAS

      areas.map(
        area => `

          <button
            class="chip ${
              norm(sideAreaFilter)
              ===
              norm(area.label)
              ?
              "active"
              :
              ""
            }"
            data-discover-area="${esc(area.label)}"
            type="button"
            title="${esc(area.label)} · ${area.count}"
          >
            ${esc(area.label)}
          </button>

      )
      .join("")
    }

  `;


  discoverAreaRow
    .querySelectorAll(
      "[data-discover-area]"
    )

      button => {

        button.onclick =
          () => {

            sideAreaFilter =
              button.dataset.discoverArea

    );

}

function renderCompactFilters(){

  const areaSource =
    compactAreaSource();


  const areaMap =
    new Map();


  areaSource.forEach(
    restaurant => {

      const area =
        text(rArea(restaurant)).trim();

      if(!area){
        return;
      }

      const key = norm(area);

      if(!areaMap.has(key)){
        areaMap.set(
          key,
          {label:area,count:0}
        );
      }

      areaMap.get(key).count += 1;

    }
  );


  const areas =
    [...areaMap.values()]
      .sort(
        (a,b) =>
          a.label.localeCompare(b.label)
      );


  if(
    sideAreaFilter &&
    !areas.some(
      area =>
        norm(area.label)
        ===
        norm(sideAreaFilter)
    )
  ){
    sideAreaFilter = "";
  }


  areaFilterButtonText.textContent =
    sideAreaFilter
    ?
    `📍 ${sideAreaFilter}`
    :
    "📍 All Areas";


  areaFilterButton.classList.toggle(
    "active",
    Boolean(sideAreaFilter)
  );


  areaFilterMenu.innerHTML = `

    <button
      class="filter-menu-item ${!sideAreaFilter ? "active" : ""}"
      data-compact-area=""
      type="button"
    >
      <span>✓ All Areas</span>
      <span class="filter-menu-count">${areaSource.length}</span>
    </button>

    ${
      areas.map(
        area => `

          <button
            class="filter-menu-item ${
              norm(sideAreaFilter)
              ===
              norm(area.label)
              ?
              "active"
              :
              ""
            }"
            data-compact-area="${esc(area.label)}"
            type="button"
          >
            <span>${esc(area.label)}</span>
            <span class="filter-menu-count">${area.count}</span>
          </button>

        `
      )
      .join("")
    }

  `;


  areaFilterMenu
    .querySelectorAll(
      "[data-compact-area]"
    )

      button => {

        button.onclick =
          () => {

            sideAreaFilter =
              button.dataset.compactArea
              ||
              "";

            areaFilterButton.setAttribute(
              "aria-expanded",
              "false"
            );

            render();

          };

      }
    );


  const foodSource =
    compactFoodSource();

  FOOD_GROUPS.forEach(
    group =>
      counts[group.key] = 0
  );


  foodSource.forEach(
    restaurant => {

      const key =
        foodGroup(restaurant);

      if(key && key in counts){
        counts[key] += 1;
      }

    }
  );


  const available =
    FOOD_GROUPS.filter(
      group =>
        counts[group.key] > 0
    );


  if(
    foodGroupFilter &&
    !available.some(
      group =>
        group.key === foodGroupFilter
    )
  ){
    foodGroupFilter = "";
  }


  const selectedFood =
    FOOD_GROUPS.find(
      group =>
        group.key === foodGroupFilter
    );


  foodFilterButtonText.textContent =
    selectedFood
    ?
    `${selectedFood.icon} ${selectedFood.label}`
    :
    "🍽️ All Food";


  foodFilterButton.classList.toggle(
    "active",
    Boolean(foodGroupFilter)
  );


  foodFilterMenu.innerHTML = `

    <button
      class="filter-menu-item ${!foodGroupFilter ? "active" : ""}"
      data-compact-food=""
      type="button"
    >
      <span>✓ All Food</span>
      <span class="filter-menu-count">${foodSource.length}</span>
    </button>

    ${
      available.map(
        group => `

          <button
            class="filter-menu-item ${
              foodGroupFilter === group.key
              ?
              "active"
              :
              ""
            }"
            data-compact-food="${group.key}"
            type="button"
          >
            <span>${group.icon} ${group.label}</span>
            <span class="filter-menu-count">${counts[group.key]}</span>
          </button>

        `
      )
      .join("")
    }

  `;


  foodFilterMenu
    .querySelectorAll(
      "[data-compact-food]"
    )

        button.onclick =
          () => {

            foodGroupFilter =
              button.dataset.compactFood

              "";

            foodFilterButton.setAttribute(
              "aria-expanded",
              "false"
            );

            render();

          };

      }
    );


  clearCompactFilters.classList.toggle(

      foodGroupFilter
    )
  );

    );

  };


foodFilterButton.onclick =
  event => {

    event.stopPropagation();

    const opening =
      foodFilterMenu.hidden;

    closeCompactMenus();

    foodFilterMenu.hidden =
      !opening;

    foodFilterButton.setAttribute(
      "aria-expanded",
      String(opening)
    );

  };


clearCompactFilters.onclick =
  () => {

    sideAreaFilter = "";
    foodGroupFilter = "";

    closeCompactMenus();
    render();

  };


document.addEventListener(
  "click",
  event => {

    if(
      !stickyFilterBar.contains(
        event.target
      )
    ){
      closeCompactMenus();
    }

  }
);


document.addEventListener(
  "keydown",
  event => {

    if(event.key === "Escape"){
      closeCompactMenus();
    }

  }
);



/* =========================================================
   START
========================================================= */

async function start(){

  await loadData();

  /*
    Load Google Places after the trip has loaded,
    so the autocomplete can use the trip country.
  */

  await initGooglePlaces();

}


start();

</script>
