<!doctype html>
<html lang="en">

<head>
<meta charset="utf-8">
<meta
  name="viewport"
  content="width=device-width, initial-scale=1, viewport-fit=cover"
>
<meta name="theme-color" content="#070c10">

<title>Food</title>

<style>

:root{
  --bg:#070c10;
  --panel:#10161c;
  --panel2:#151c23;
  --line:#29323b;
  --text:#f5f5f3;
  --muted:#aeb5bc;

  --red:#c96f68;
  --blue:#5c9dff;
  --green:#67c587;
  --orange:#f4a34d;
  --gold:#e3b85c;
  --purple:#ad8cff;
}

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  min-height:100vh;

  background:
    radial-gradient(
      circle at 50% -15%,
      #17212a 0%,
      transparent 38%
    ),
    var(--bg);

  color:var(--text);

  font-family:
    Inter,
    ui-sans-serif,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
}

button,
input{
  font:inherit;
}


/* =========================================================
   HEADER
========================================================= */

header{
  position:sticky;
  top:0;
  z-index:40;

  padding:
    calc(9px + env(safe-area-inset-top))
    12px
    8px;

  border-bottom:1px solid var(--line);

  background:rgba(7,12,16,.97);

  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
}

.header-inner{
  max-width:760px;
  margin:auto;
}

.title-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.eyebrow{
  color:var(--red);
  font-size:8px;
  font-weight:900;
  letter-spacing:.14em;
  text-transform:uppercase;
}

h1{
  margin:2px 0 0;

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-size:23px;
  line-height:1.1;
}

.trip-name{
  margin-top:2px;
  color:var(--muted);
  font-size:8px;
}

.add-btn{
  flex:0 0 auto;
  min-height:35px;
  padding:6px 10px;

  border:
    1px solid
    rgba(201,111,104,.35);

  border-radius:10px;

  background:
    rgba(201,111,104,.10);

  color:#f4d4d1;

  font-size:9px;
  font-weight:900;

  cursor:pointer;
}


/* =========================================================
   MAIN TABS
========================================================= */

.main-tabs{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:5px;
  margin-top:9px;
}

.main-tab{
  min-height:37px;

  border:1px solid var(--line);
  border-radius:10px;

  background:#11181e;
  color:var(--muted);

  font-size:9px;
  font-weight:900;

  cursor:pointer;
}

.main-tab.active{
  color:#fff;

  border-color:
    rgba(201,111,104,.5);

  background:
    rgba(201,111,104,.12);
}


/* =========================================================
   SEARCH
========================================================= */

.search{
  width:100%;
  min-height:38px;
  margin-top:7px;
  padding:8px 11px;

  border:1px solid var(--line);
  border-radius:10px;

  outline:none;

  background:#10171d;
  color:#fff;

  font-size:10px;
}

.search::placeholder{
  color:#748089;
}

.search:focus{
  border-color:var(--red);
}


/* =========================================================
   CHIPS
========================================================= */

.chips{
  display:flex;
  gap:5px;
  overflow-x:auto;
  margin-top:6px;
  padding-bottom:2px;
  scrollbar-width:none;
}

.chips::-webkit-scrollbar{
  display:none;
}

.chip{
  flex:0 0 auto;
  min-height:28px;
  padding:4px 9px;

  border:1px solid var(--line);
  border-radius:999px;

  background:#10171d;
  color:#b8c0c6;

  font-size:8px;
  font-weight:800;

  white-space:nowrap;
  cursor:pointer;
}

.chip.active{
  color:#fff;
  border-color:var(--red);

  background:
    rgba(201,111,104,.12);
}

.food-filter-chip.active-food{
  color:#f0cb6b;

  border-color:
    rgba(227,184,92,.38);

  background:
    rgba(227,184,92,.09);
}


/* =========================================================
   DISCOVER
========================================================= */

.discover-controls{
  display:none;
}

.discover-controls.show{
  display:block;
}

.mode-switch{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:5px;
  margin-top:6px;
}

.mode-btn{
  min-height:30px;

  border:1px solid var(--line);
  border-radius:9px;

  background:#11181e;
  color:var(--muted);

  font-size:8px;
  font-weight:850;

  cursor:pointer;
}

.mode-btn.active{
  color:#fff;

  border-color:
    rgba(201,111,104,.45);

  background:
    rgba(201,111,104,.10);
}


/* =========================================================
   MAIN
========================================================= */

main{
  max-width:760px;
  margin:auto;

  padding:
    11px
    12px
    95px;
}

.result-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;

  margin:
    1px
    2px
    9px;
}

.result-title{
  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-size:18px;
  font-weight:800;
}

.result-count{
  color:var(--muted);
  font-size:8px;
}


/* =========================================================
   SECTION
========================================================= */

.food-section{
  margin-bottom:17px;
}

.section-title{
  display:flex;
  align-items:center;
  gap:6px;

  margin:
    4px
    2px
    7px;

  padding-bottom:5px;

  border-bottom:
    1px solid
    rgba(255,255,255,.07);

  color:#fff;

  font-size:10px;
  font-weight:900;
}

.section-title span:last-child{
  margin-left:auto;
  color:#74818a;
  font-size:7px;
}


/* =========================================================
   RESTAURANT CARD
========================================================= */

.restaurant-card{
  margin-bottom:6px;
  padding:9px 10px;

  border:1px solid var(--line);
  border-radius:12px;

  background:
    linear-gradient(
      145deg,
      #141c22,
      #0d1318
    );
}

.restaurant-card.eaten-card{
  opacity:.72;
}

.card-top{
  display:flex;
  align-items:flex-start;
  gap:8px;
}

.food-icon{
  flex:0 0 auto;

  width:28px;
  height:28px;

  display:flex;
  align-items:center;
  justify-content:center;

  border:
    1px solid
    rgba(201,111,104,.16);

  border-radius:8px;

  background:
    rgba(201,111,104,.07);

  font-size:14px;
}

.card-main{
  flex:1;
  min-width:0;
}

.restaurant-name{
  margin:0;
  color:#fff;
  font-size:12px;
  font-weight:900;
  line-height:1.25;
}

.japanese{
  margin-top:1px;
  color:#7f8a93;
  font-size:8px;
}

.location{
  margin-top:2px;
  color:var(--muted);
  font-size:8px;
}


/* =========================================================
   BADGES
========================================================= */

.badges{
  display:flex;
  flex-wrap:wrap;
  gap:3px;
  margin-top:5px;
}

.badge{
  padding:2px 5px;

  border:1px solid var(--line);
  border-radius:999px;

  background:
    rgba(255,255,255,.03);

  color:#c9d0d5;

  font-size:7px;
  font-weight:850;
}

.badge.pick{
  color:#f0cb6b;
  border-color:rgba(227,184,92,.25);
  background:rgba(227,184,92,.08);
}

.badge.flex{
  color:#aebdff;
  border-color:rgba(92,157,255,.22);
  background:rgba(92,157,255,.08);
}

.badge.top{
  color:#e5c46d;
  border-color:rgba(227,184,92,.22);
  background:rgba(227,184,92,.07);
}

.badge.hot{
  color:#ffab7f;
  border-color:rgba(244,163,77,.22);
  background:rgba(244,163,77,.07);
}

.badge.scheduled{
  color:#9fe1b5;
  border-color:rgba(103,197,135,.22);
  background:rgba(103,197,135,.07);
}

.badge.eaten{
  color:#b9e4c7;
  border-color:rgba(103,197,135,.28);
  background:rgba(103,197,135,.10);
}


/* =========================================================
   META
========================================================= */

.meta{
  display:flex;
  flex-wrap:wrap;
  gap:4px;
  margin-top:6px;
}

.meta-item{
  padding:3px 6px;

  border:
    1px solid
    rgba(255,255,255,.06);

  border-radius:6px;

  background:
    rgba(255,255,255,.025);

  color:#c7cdd1;

  font-size:7px;
  font-weight:800;
}


/* =========================================================
   PLAN
========================================================= */

.plan-box{
  margin-top:6px;
  padding:6px 8px;

  border:
    1px solid
    rgba(103,197,135,.18);

  border-radius:8px;

  background:
    rgba(103,197,135,.05);

  color:#b8ddc4;

  font-size:8px;
  font-weight:800;
}


/* =========================================================
   DESCRIPTION
========================================================= */

.description{
  margin-top:6px;
  color:var(--muted);
  font-size:8px;
  line-height:1.4;
}


/* =========================================================
   ACTIONS
========================================================= */

.actions{
  display:flex;
  flex-wrap:wrap;
  gap:4px;
  margin-top:7px;
}

.action-btn{
  min-height:28px;

  display:inline-flex;
  align-items:center;
  justify-content:center;

  padding:4px 8px;

  border:
    1px solid
    rgba(201,111,104,.25);

  border-radius:7px;

  background:
    rgba(201,111,104,.06);

  color:var(--red);

  text-decoration:none;

  font-size:7px;
  font-weight:900;

  cursor:pointer;
}

.action-btn.gold{
  color:var(--gold);
  border-color:rgba(227,184,92,.22);
  background:rgba(227,184,92,.05);
}

.action-btn.green{
  color:var(--green);
  border-color:rgba(103,197,135,.22);
  background:rgba(103,197,135,.05);
}

.action-btn.blue{
  color:var(--blue);
  border-color:rgba(92,157,255,.22);
  background:rgba(92,157,255,.05);
}

.action-btn.muted{
  color:#9ca6ad;
  border-color:var(--line);
  background:#11181e;
}


/* =========================================================
   STATES
========================================================= */

.state{
  padding:28px 16px;
  border:1px dashed #35414a;
  border-radius:14px;
  text-align:center;
  color:var(--muted);
  font-size:9px;
  line-height:1.5;
}

.state strong{
  display:block;
  margin-bottom:4px;
  color:#fff;
  font-size:12px;
}


/* =========================================================
   SHEETS
========================================================= */

.sheet-backdrop{
  position:fixed;
  inset:0;
  z-index:150;

  display:none;
  align-items:flex-end;

  background:rgba(0,0,0,.68);

  backdrop-filter:blur(4px);
}

.sheet-backdrop.open{
  display:flex;
}

.sheet{
  width:100%;
  max-width:760px;

  max-height:
    calc(92vh - env(safe-area-inset-top));

  overflow-y:auto;

  margin:0 auto;

  padding:
    8px
    14px
    calc(18px + env(safe-area-inset-bottom));

  border:1px solid var(--line);

  border-radius:
    20px
    20px
    0
    0;

  background:#0d1318;
}

.sheet-handle{
  width:38px;
  height:4px;

  margin:
    2px
    auto
    12px;

  border-radius:999px;

  background:#39454d;
}

.sheet-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:12px;
}

.sheet-title{
  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-size:19px;
}

.close-btn{
  width:34px;
  height:34px;

  border:1px solid var(--line);
  border-radius:9px;

  background:#151c22;
  color:#fff;

  cursor:pointer;
}


/* =========================================================
   FOOD CATEGORY SHEET
========================================================= */

.food-category-sheet{
  width:100%;
  max-width:520px;
  max-height:72vh;

  overflow:hidden;

  margin:0 auto;

  padding:
    8px
    12px
    calc(14px + env(safe-area-inset-bottom));

  border:1px solid var(--line);

  border-radius:
    20px
    20px
    0
    0;

  background:#0d1318;
}

.food-category-list{
  max-height:52vh;
  overflow-y:auto;
  padding:2px 0 6px;
}

.food-category-option{
  width:100%;
  min-height:39px;

  display:flex;
  align-items:center;
  gap:8px;

  margin-bottom:4px;
  padding:7px 9px;

  border:1px solid var(--line);
  border-radius:9px;

  background:#11181e;
  color:#d1d6da;

  text-align:left;

  font-size:9px;
  font-weight:850;

  cursor:pointer;
}

.food-category-option.active{
  color:#fff;

  border-color:
    rgba(201,111,104,.45);

  background:
    rgba(201,111,104,.10);
}

.food-category-icon{
  width:21px;
  text-align:center;
  font-size:14px;
}

.food-category-name{
  flex:1;
}

.food-category-count{
  color:#77838c;
  font-size:7px;
}


/* =========================================================
   GOOGLE PLACES
========================================================= */

.google-place-box{
  grid-column:1/-1;

  margin-bottom:2px;
  padding:10px;

  border:
    1px solid
    rgba(92,157,255,.22);

  border-radius:11px;

  background:
    rgba(92,157,255,.05);
}

.google-place-label{
  margin-bottom:6px;
  color:#aeb5bc;
  font-size:7px;
  font-weight:900;
}

#googlePlaceSearch{
  width:100%;
}

#googlePlaceSearch gmp-place-autocomplete,
gmp-place-autocomplete{
  width:100%;
  min-height:42px;
}

.place-status{
  margin-top:6px;
  color:#81909a;
  font-size:7px;
  line-height:1.4;
}

.place-status.success{
  color:#9fe1b5;
}

.place-status.error{
  color:#ffc5c1;
}


/* =========================================================
   FORM
========================================================= */

.form-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
}

.field.full{
  grid-column:1/-1;
}

.field label{
  display:block;
  margin-bottom:4px;
  color:#aeb5bc;
  font-size:7px;
  font-weight:900;
}

.field input,
.field textarea{
  width:100%;
  min-height:40px;
  padding:8px 9px;

  border:1px solid var(--line);
  border-radius:9px;

  outline:none;

  background:#10171d;
  color:#fff;

  font-size:10px;
}

.field textarea{
  min-height:70px;
  resize:vertical;
}

.field input:focus,
.field textarea:focus{
  border-color:var(--red);
}

.checks{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:5px;
  margin-top:10px;
}

.check{
  display:flex;
  align-items:center;
  gap:6px;

  min-height:39px;
  padding:6px 8px;

  border:1px solid var(--line);
  border-radius:9px;

  background:#11181e;
  color:#d1d6da;

  font-size:8px;
  font-weight:800;
}

.check input{
  width:15px;
  height:15px;
}

.save-btn{
  width:100%;
  min-height:44px;
  margin-top:11px;

  border:
    1px solid
    rgba(201,111,104,.4);

  border-radius:10px;

  background:
    rgba(201,111,104,.13);

  color:#f4d4d1;

  font-size:9px;
  font-weight:900;

  cursor:pointer;
}

.save-btn:disabled{
  opacity:.5;
}

.form-message{
  display:none;
  margin-top:8px;
  padding:8px;
  border-radius:8px;
  font-size:8px;
}

.form-message.error{
  display:block;
  color:#ffc5c1;
  border:1px solid rgba(201,111,104,.25);
  background:rgba(201,111,104,.07);
}

.form-message.success{
  display:block;
  color:#b9e4c7;
  border:1px solid rgba(103,197,135,.25);
  background:rgba(103,197,135,.07);
}

</style>
</head>


<body>

<header>

<div class="header-inner">

  <div class="title-row">

    <div>

      <div
        id="tripEyebrow"
        class="eyebrow"
      >
        LOADING TRIP…
      </div>

      <h1>🍽️ Food</h1>

      <div
        id="tripName"
        class="trip-name"
      >
        Loading trip…
      </div>

    </div>

    <button
      id="openAdd"
      class="add-btn"
      type="button"
    >
      ＋ ADD
    </button>

  </div>


  <div class="main-tabs">

    <button
      class="main-tab active"
      data-tab="mine"
      type="button"
    >
      ❤️ MY FOOD
    </button>

    <button
      class="main-tab"
      data-tab="discover"
      type="button"
    >
      🔎 DISCOVER
    </button>

  </div>


  <input
    id="searchInput"
    class="search"
    type="search"
    placeholder="Search your restaurants..."
    autocomplete="off"
  >


  <div
    id="cityChips"
    class="chips"
  ></div>


  <div
    id="myFilters"
    class="chips"
  >

    <button
      class="chip active"
      data-myfilter="all"
      type="button"
    >
      ALL
    </button>

    <button
      class="chip"
      data-myfilter="pick"
      type="button"
    >
      ⭐ PICKS
    </button>

    <button
      class="chip"
      data-myfilter="flexible"
      type="button"
    >
      🌙 FLEXIBLE
    </button>

    <button
      class="chip"
      data-myfilter="scheduled"
      type="button"
    >
      📅 SCHEDULED
    </button>

    <button
      class="chip"
      data-myfilter="eaten"
      type="button"
    >
      ✓ EATEN
    </button>

    <button
      id="myFoodCategoryButton"
      class="chip food-filter-chip"
      type="button"
    >
      🍜 FOOD ▾
    </button>

  </div>


  <div
    id="discoverControls"
    class="discover-controls"
  >

    <div class="mode-switch">

      <button
        class="mode-btn active"
        data-mode="area"
        type="button"
      >
        📍 BY AREA
      </button>

      <button
        class="mode-btn"
        data-mode="food"
        type="button"
      >
        🍜 BY FOOD
      </button>

    </div>

    <div
      id="browseChips"
      class="chips"
    ></div>

  </div>

</div>

</header>


<main>

  <div class="result-head">

    <div
      id="resultTitle"
      class="result-title"
    >
      ❤️ My Food
    </div>

    <div
      id="resultCount"
      class="result-count"
    ></div>

  </div>

  <div id="results">

    <div class="state">

      <strong>
        Loading restaurants…
      </strong>

      Getting your food list from Supabase.

    </div>

  </div>

</main>


<!-- FOOD CATEGORY SHEET -->

<div
  id="foodCategorySheet"
  class="sheet-backdrop"
>

  <div class="food-category-sheet">

    <div class="sheet-handle"></div>

    <div class="sheet-head">

      <div class="sheet-title">
        🍜 Food Category
      </div>

      <button
        id="closeFoodCategory"
        class="close-btn"
        type="button"
      >
        ✕
      </button>

    </div>

    <div
      id="foodCategoryList"
      class="food-category-list"
    ></div>

  </div>

</div>


<!-- ADD RESTAURANT -->

<div
  id="addSheet"
  class="sheet-backdrop"
>

  <div class="sheet">

    <div class="sheet-handle"></div>

    <div class="sheet-head">

      <div class="sheet-title">
        ＋ Add Restaurant
      </div>

      <button
        id="closeAdd"
        class="close-btn"
        type="button"
      >
        ✕
      </button>

    </div>


    <form id="addForm">

      <div class="form-grid">


        <div class="google-place-box">

          <div class="google-place-label">
            🔎 GOOGLE PLACES AUTOFILL
          </div>

          <div id="googlePlaceSearch"></div>

          <div
            id="googlePlaceStatus"
            class="place-status"
          >
            Search a restaurant, then choose the correct Google result.
          </div>

        </div>


        <div class="field full">

          <label>RESTAURANT NAME *</label>

          <input
            id="newName"
            required
            placeholder="Restaurant name"
          >

        </div>


        <div class="field full">

          <label>LOCAL / JAPANESE NAME</label>

          <input
            id="newJapanese"
            placeholder="Local name"
          >

        </div>


        <div class="field">

          <label>CITY *</label>

          <input
            id="newCity"
            required
            placeholder="Kyoto"
          >

        </div>


        <div class="field">

          <label>AREA</label>

          <input
            id="newArea"
            placeholder="Gion"
          >

        </div>


        <div class="field">

          <label>LOCATION</label>

          <input
            id="newLocation"
            placeholder="Pontocho"
          >

        </div>


        <div class="field">

          <label>CUISINE</label>

          <input
            id="newCuisine"
            placeholder="Yakitori"

/* =========================================================
   HELPERS
========================================================= */

function text(value){

  return String(
    value ?? ""
  );

}


function esc(value){

  return text(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


function norm(value){

  return text(value)
    .trim()
    .toLowerCase();

}


function unique(values){

  return [
    ...new Set(
      values
        .map(
          value =>
            text(value).trim()
        )
        .filter(Boolean)
    )
  ]
  .sort(
    (a,b) =>
      a.localeCompare(b)
  );

}


/* =========================================================
   ACCESSIBLE TRIPS
========================================================= */

async function getAccessibleTrips(){

  const {
    data:userData,
    error:userError
  } =
    await db.auth.getUser();


  if(userError){
    throw userError;
  }


  const user =
    userData?.user;


  if(!user){

    throw new Error(
      "You are not signed in."
    );

  }


  currentUser =
    user;


  const ownedResult =
    await db
      .from("trips")
      .select("*")
      .eq(
        "owner_id",
        user.id
      );


  if(ownedResult.error){
    throw ownedResult.error;
  }


  const memberResult =
    await db
      .from("trip_members")
      .select("trip_id")
      .eq(
        "user_id",
        user.id
      );


  if(memberResult.error){
    throw memberResult.error;
  }


  const sharedIds =
    [
      ...new Set(
        (memberResult.data || [])
          .map(
            row =>
              Number(row.trip_id)
          )
          .filter(
            Number.isFinite
          )
      )
    ];


  let sharedTrips = [];


  if(sharedIds.length){

    const sharedResult =
      await db
        .from("trips")
        .select("*")
        .in(
          "id",
          sharedIds
        );


    if(sharedResult.error){
      throw sharedResult.error;
    }


    sharedTrips =
      sharedResult.data || [];

  }


  const tripMap =
    new Map();


  (ownedResult.data || [])
    .forEach(
      item => {

        tripMap.set(
          Number(item.id),
          {
            ...item,
            __role:"owner"
          }
        );

      }
    );


  sharedTrips.forEach(
    item => {

      const id =
        Number(item.id);


      if(!tripMap.has(id)){

        tripMap.set(
          id,
          {
            ...item,
            __role:"member"
          }
        );

      }

    }
  );


  return [
    ...tripMap.values()
  ]
  .sort(
    (a,b) =>
      String(
        a.start_date || ""
      )
      .localeCompare(
        String(
          b.start_date || ""
        )
      )
  );

}


/* =========================================================
   RESOLVE CURRENT TRIP
========================================================= */

async function resolveTrip(){

  const accessibleTrips =
    await getAccessibleTrips();


  if(!accessibleTrips.length){

    throw new Error(
      "No trips are available for this account."
    );

  }


  if(!TRIP_ID){

    TRIP_ID =
      Number(
        accessibleTrips[0].id
      );


    history.replaceState(
      {},
      "",
      `food.html?trip=${TRIP_ID}`
    );

  }


  const allowed =
    accessibleTrips.some(
      item =>
        Number(item.id) ===
        Number(TRIP_ID)
    );


  if(!allowed){

    TRIP_ID =
      Number(
        accessibleTrips[0].id
      );


    history.replaceState(
      {},
      "",
      `food.html?trip=${TRIP_ID}`
    );

  }

}

}

function rJapanese(r){

}

}

function rPrice(r){

    r.price ||
    r.dinner_price ||
    r.lunch_price ||
    ""
  );

}

function rDescription(r){
  return r.description || "";
}

function rLocation(r){

  return (

    r.area ||
    r.city ||

  );

}


/* =========================================================
   FOOD ICON
========================================================= */

function foodIcon(value){

  const v =
    norm(value);


  if(v.includes("ramen"))
    return "🍜";

  if(v.includes("sushi"))
    return "🍣";

  if(v.includes("yakitori"))
    return "🍢";

  if(v.includes("chicken"))
    return "🍗";

  if(v.includes("oyakodon"))
    return "🍳";

  if(
    v.includes("udon") ||
    v.includes("soba")
  )
    return "🥢";

  if(v.includes("tonkatsu"))
    return "🐷";

  if(v.includes("unagi"))
    return "🐟";

  if(v.includes("tempura"))
    return "🍤";

  if(v.includes("curry"))
    return "🍛";

  if(v.includes("izakaya"))
    return "🍶";

  if(v.includes("gyoza"))
    return "🥟";

  if(v.includes("bakery"))
    return "🥐";

  if(v.includes("seafood"))
    return "🦐";


  return "🍽️";

}


/* =========================================================
   RELATIONS
========================================================= */

function relationFor(id){

  return tripRestaurants.find(
    item =>
      Number(item.restaurant_id)
      ===
      Number(id)
  );

}


function inMyFood(r){

  return Boolean(
    relationFor(r.id)
  );

}


function isPick(r){

  return Boolean(
    relationFor(r.id)
      ?.is_pick
  );

}


function isFlexible(r){

  return Boolean(
    relationFor(r.id)
      ?.is_flexible
  );

}


function isEaten(r){

  return Boolean(
    relationFor(r.id)
      ?.is_eaten
  );

}


function eatenDate(r){

  const value =
    relationFor(r.id)
      ?.eaten_at;


  if(!value){
    return "";
  }


  const d =
    new Date(value);


  if(Number.isNaN(d.getTime())){
    return "";
  }


  return new Intl.DateTimeFormat(
    "en-SG",
    {
      day:"numeric",
      month:"short"
    }
  )
  .format(d)
  .toUpperCase();

}


function scheduleFor(r){

  return scheduleRows
    .filter(
      item =>
        Number(item.restaurant_id)
        ===
        Number(r.id)
    )
    .sort(
      (a,b) =>
        String(
          a.schedule_date
        )
        .localeCompare(
          String(
            b.schedule_date
          )
        )
    );

}


function isScheduled(r){

  return (
    scheduleFor(r).length > 0

}


/* =========================================================

function isTop(r){

  if(
    r.is_tabelog_top100 === true

    return true;

  const award =

      r.recognition

function isHot(r){

function formatScheduleDate(

){

async function loadData(){

  try{

    await resolveTrip();


    const tripResult =
      await db
        .from("trips")
        .select("*")
        .eq(
          "id",
          TRIP_ID
        )
        .single();


    if(tripResult.error){
      throw tripResult.error;
    }


    trip =
      tripResult.data;


    tripName.textContent =
      trip.name ||
      "My Trip";


    tripEyebrow.textContent =
      trip.country
      ?
      `${trip.country} · TRIP FOOD`
      :
      "TRIP FOOD";


    document.title =
      `Food · ${
        trip.name ||
        "My Trip"
      }`;


    const restaurantResult =
      await db
        .from("restaurants")
        .select("*")
        .order(
          "name",
          {
            ascending:true
          }
        );


    if(
      restaurantResult.error
    ){
      throw restaurantResult.error;
    }


    restaurants =
      restaurantResult.data || [];


    if(trip.country){

      const country =
        norm(trip.country);


      restaurants =
        restaurants.filter(
          restaurant => {

            if(
              !restaurant.country
            ){
              return true;
            }


            return (
              norm(
                restaurant.country
              )
              ===
              country
            );

          }
        );

    }


    const relationResult =
      await db
        .from(
          "trip_restaurants"
        )
        .select("*")
        .eq(
          "trip_id",
          TRIP_ID
        );


    if(
      relationResult.error
    ){
      throw relationResult.error;
    }


    tripRestaurants =
      relationResult.data || [];


    const scheduleResult =
      await db
        .from("schedule")
        .select(`
          id,
          restaurant_id,
          schedule_date,
          start_time,
          time_label,
          title,
          is_locked
        `)
        .eq(
          "trip_id",
          TRIP_ID
        )
        .not(
          "restaurant_id",
          "is",
          null
        );


    if(
      scheduleResult.error
    ){

      console.warn(
        "Schedule food:",
        scheduleResult.error
      );


      scheduleRows = [];

    }

    else{

      scheduleRows =
        scheduleResult.data || [];

    }


    createCityChips();

    createDiscoverChips();

    updateFoodCategoryButton();

    render();

  }

  catch(error){

    console.error(
      "Food load error:",
      error
    );


    results.innerHTML = `

      <div class="state">

        <strong>
          Couldn't load Food
        </strong>

        ${esc(
          error.message ||
          "Unknown database error."
        )}

      </div>

    `;

  }

}

========================================================= */

function foodCategorySource(){

  let source =
    activeTab === "mine"
    ?
    restaurants.filter(inMyFood)
    :
    restaurants.slice();


  if(selectedCity){

    source =
      source.filter(
        restaurant =>
          norm(rCity(restaurant))
          ===
          norm(selectedCity)
      );

  }


  return source;

}


function updateFoodCategoryButton(){

  if(foodCategoryFilter){

    myFoodCategoryButton.textContent =
      `${foodIcon(foodCategoryFilter)} ${foodCategoryFilter.toUpperCase()} ×`;


    myFoodCategoryButton
      .classList.add(
        "active-food"
      );

  }

  else{

    myFoodCategoryButton.textContent =
      "🍜 FOOD ▾";


    myFoodCategoryButton
      .classList.remove(
        "active-food"
      );

  }

}


function renderFoodCategorySheet(){

  const source =
    foodCategorySource();


  const counts =
    new Map();


  source.forEach(
    restaurant => {

      const label =
        rCuisine(restaurant);


      const key =
        norm(label);


      if(!counts.has(key)){

        counts.set(
          key,
          {
            label,
            count:0
          }
        );

      }


      counts.get(key).count++;

    }
  );


  const categories =
    [...counts.values()]
      .sort(
        (a,b) =>
          a.label.localeCompare(
            b.label
          )
      );


  foodCategoryList.innerHTML = `

    <button
      class="food-category-option ${
        !foodCategoryFilter
        ?
        "active"
        :
        ""
      }"
      data-food-category=""
      type="button"
    >

      <span class="food-category-icon">
        🍽️
      </span>

      <span class="food-category-name">
        All Food
      </span>

      <span class="food-category-count">
        ${source.length}
      </span>

    </button>


    ${
      categories.map(
        item => `

          <button
            class="food-category-option ${
              norm(foodCategoryFilter)
              ===
              norm(item.label)
              ?
              "active"
              :
              ""

            data-food-category="${esc(item.label)}"
            type="button"

            <span class="food-category-icon">

            <span class="food-category-name">

            </span>

            <span class="food-category-count">
              ${item.count}
            </span>

          </button>

      .join("")

            render();

    );

}

/* =========================================================
   SEARCH MATCH
========================================================= */

function matchesSearch(r){

  if(!searchTerm){
    return true;
  }


  const value =
    norm(
      [

        r.name,
        rJapanese(r),
        rCuisine(r),
        rCity(r),
        rArea(r),
        rLocation(r),
        rDescription(r),
        r.award,
        r.recognition,
        rRating(r),
        rPrice(r)

      ]
      .join(" ")
    );


  return value.includes(
    searchTerm
  );

}


/* =========================================================
   FILTER
========================================================= */

function filteredRestaurants(){

  let list =
    restaurants.slice();


  if(
    activeTab === "mine"
  ){

    list =
      list.filter(
        inMyFood
      );


    if(
      myFilter === "eaten"
    ){

      list =
        list.filter(
          isEaten
        );

    }

    else{

      list =
        list.filter(
          restaurant =>
            !isEaten(restaurant)
        );


      if(
        myFilter === "pick"
      ){

        list =
          list.filter(
            isPick
          );

      }


      if(
        myFilter === "flexible"
      ){

        list =
          list.filter(
            isFlexible
          );

      }


      if(
        myFilter === "scheduled"
      ){

        list =
          list.filter(
            isScheduled
          );

      }

    }

  }


  if(selectedCity){

    list =
      list.filter(
        restaurant =>
          norm(
            rCity(restaurant)
          )
          ===
          norm(selectedCity)
      );

  }


  if(
    activeTab === "discover" &&
    discoverFilter
  ){

    if(
      discoverMode === "area"
    ){

      list =
        list.filter(
          restaurant =>
            norm(
              rArea(restaurant)
            )
            ===
            norm(discoverFilter)
        );

    }

    else{

      list =
        list.filter(
          restaurant =>
            norm(
              rCuisine(restaurant)
            )
            ===
            norm(discoverFilter)
        );

    }

  }


  if(foodCategoryFilter){

    list =
      list.filter(
        restaurant =>
          norm(
            rCuisine(restaurant)
          )
          ===
          norm(foodCategoryFilter)
      );

  }


  list =
    list.filter(
      matchesSearch
    );


  return list;

}


/* =========================================================
   BADGES
========================================================= */

function badges(r){

  let html = `

    <span class="badge">

      ${foodIcon(
        rCuisine(r)
      )}

      ${esc(
        rCuisine(r)
      )}

    </span>

  `;


  if(isPick(r)){

    html += `
      <span class="badge pick">
        ⭐ Pick
      </span>
    `;

  }


  if(isFlexible(r)){

    html += `
      <span class="badge flex">
        🌙 Flexible
      </span>
    `;

  }


  if(isTop(r)){

    html += `
      <span class="badge top">
        🏆 Top 100
      </span>
    `;

  }


  if(isHot(r)){

    html += `
      <span class="badge hot">
        🔥 Hot
      </span>
    `;

  }


  if(isScheduled(r)){

    html += `
      <span class="badge scheduled">
        📅 Scheduled
      </span>
    `;

  }


  if(isEaten(r)){

    const when =
      eatenDate(r);


    html += `

      <span class="badge eaten">

        ✓ Eaten${
          when
          ?
          ` · ${esc(when)}`
          :
          ""
        }

      </span>

    `;

  }


  return html;

}


/* =========================================================
   PLAN
========================================================= */

function planHTML(r){

  const rows =
    scheduleFor(r);


  if(!rows.length){
    return "";
  }


  return rows.map(
    row => {

      const time =
        row.time_label ||
        (
          row.start_time
          ?
          row.start_time.slice(
            0,
            5
          )
          :
          ""
        );


      return `

        <div class="plan-box">

          📅
          ${esc(
            formatScheduleDate(
              row.schedule_date
            )
          )}

          ${
            time
            ?
            ` · ${esc(time)}`
            :
            ""
          }

          ${
            row.is_locked
            ?
            " · 🔒 Locked"
            :
            ""
          }

        </div>

      `;

    }
  )
  .join("");

}


/* =========================================================
   CARD
========================================================= */

function cardHTML(r){

  const relation =
    relationFor(r.id);


  const mapsURL =
    r.maps_url
    ||
    `https://www.google.com/maps/search/?api=1&query=${
      encodeURIComponent(
        [
          r.name,
          rCity(r),
          trip?.country || ""
        ]
        .filter(Boolean)
        .join(" ")
      )
    }`;


  return `

    <article class="restaurant-card ${isEaten(r) ? "eaten-card" : ""}">

      <div class="card-top">

        <div class="food-icon">

          ${foodIcon(
            rCuisine(r)
          )}

        </div>


        <div class="card-main">

          <h3 class="restaurant-name">
            ${esc(r.name)}
          </h3>


          ${
            rJapanese(r)

            ?

            `
              <div class="japanese">
                ${esc(
                  rJapanese(r)
                )}
              </div>
            `

            :

            ""
          }


          <div class="location">

            📍
            ${esc(
              rLocation(r)
            )}

            ${
              rCity(r)
              ?
              ` · ${esc(rCity(r))}`
              :
              ""
            }

          </div>


          <div class="badges">
            ${badges(r)}
          </div>

        </div>

      </div>


      ${
        rRating(r) ||
        rPrice(r)

        ?

        `

          <div class="meta">

            ${
              rRating(r)

              ?

              `
                <span class="meta-item">
                  ⭐ Tabelog
                  ${esc(
                    rRating(r)
                  )}
                </span>
              `

              :

              ""
            }


            ${
              rPrice(r)

              ?

              `
                <span class="meta-item">
                  💴
                  ${esc(
                    rPrice(r)
                  )}
                </span>
              `

              :

              ""
            }

          </div>

        `

        :

        ""
      }


      ${planHTML(r)}


      ${
        rDescription(r)

        ?

        `
          <div class="description">
            ${esc(
              rDescription(r)
            )}
          </div>
        `

        :

        ""
      }


      <div class="actions">

        <a
          class="action-btn"
          href="${esc(mapsURL)}"
          target="_blank"
          rel="noopener noreferrer"
        >
          📍 MAP
        </a>


        ${
          r.tabelog_url

          ?

          `
            <a
              class="action-btn gold"
              href="${esc(
                r.tabelog_url
              )}"
              target="_blank"
              rel="noopener noreferrer"
            >
              🏆 TABELOG
            </a>
          `

          :

          ""
        }


        ${
          relation

          ?

          `

            <button
              class="action-btn blue"
              type="button"
              onclick="togglePick(${Number(r.id)})"
            >
              ${
                relation.is_pick
                ?
                "★ PICK"
                :
                "☆ PICK"
              }
            </button>


            <button
              class="action-btn blue"
              type="button"
              onclick="toggleFlexible(${Number(r.id)})"
            >
              ${
                relation.is_flexible
                ?
                "🌙 FLEX"
                :
                "＋ FLEX"
              }
            </button>


            <button
              class="action-btn ${isEaten(r) ? "muted" : "green"}"
              type="button"
              onclick="toggleEaten(${Number(r.id)})"
            >
              ${
                isEaten(r)
                ?
                "↶ UNDO EATEN"
                :
                "✓ EATEN"
              }
            </button>


            ${
              !isScheduled(r) &&
              !isEaten(r)

              ?

              `
                <button
                  class="action-btn muted"
                  type="button"
                  onclick="removeFromMyFood(${Number(r.id)})"
                >
                  REMOVE
                </button>
              `

              :

              ""
            }

          `

          :

          `

            <button
              class="action-btn green"
              type="button"
              onclick="addToMyFood(${Number(r.id)})"
            >
              ＋ MY FOOD
            </button>

          `
        }

      </div>

    </article>

  `;

}


/* =========================================================
   SECTION
========================================================= */

function sectionHTML(
  title,
  list
){

  return `

    <section class="food-section">

      <div class="section-title">

        <div>
          ${title}
        </div>

        <span>
          ${list.length}
        </span>

      </div>


      ${
        list
          .map(cardHTML)
          .join("")
      }

    </section>

  `;

}


/* =========================================================
   RENDER
========================================================= */

function renderMine(list){

  if(!list.length){

    results.innerHTML = `

      <div class="state">

        <strong>
          No restaurants here
        </strong>

        No restaurants match the current filters.

      </div>

    `;

    return;

  }


  if(
    myFilter !== "all"
  ){

    results.innerHTML =
      list
        .map(cardHTML)
        .join("");

    return;

  }


  const picks =
    list.filter(
      isPick
    );


  const scheduled =
    list.filter(
      restaurant =>
        isScheduled(restaurant) &&
        !isPick(restaurant)
    );


  const flexible =
    list.filter(
      restaurant =>
        isFlexible(restaurant) &&
        !isPick(restaurant) &&
        !isScheduled(restaurant)
    );


  const saved =
    list.filter(
      restaurant =>
        !isPick(restaurant) &&
        !isFlexible(restaurant) &&
        !isScheduled(restaurant)
    );


  let html = "";


  if(picks.length){

    html += sectionHTML(
      "⭐ PICKS",
      picks
    );

  }


  if(scheduled.length){

    html += sectionHTML(
      "📅 SCHEDULED",
      scheduled
    );

  }


  if(flexible.length){

    html += sectionHTML(
      "🌙 FLEXIBLE / MAYBE",
      flexible
    );

  }


  if(saved.length){

    html += sectionHTML(
      "❤️ SAVED",
      saved
    );

  }


  results.innerHTML =
    html;

}


function renderDiscover(list){

  if(!list.length){

    results.innerHTML = `

      <div class="state">

        <strong>
          No restaurants found
        </strong>

        Try another area,
        cuisine or search.

      </div>

    `;

    return;

  }


  results.innerHTML =
    list
      .map(cardHTML)
      .join("");

}


function render(){

  const list =
    filteredRestaurants();


  resultCount.textContent =
    `${list.length} ${
      list.length === 1
      ?
      "restaurant"
      :
      "restaurants"
    }`;


  if(
    activeTab === "mine"
  ){

    resultTitle.textContent =
      "❤️ My Food";

    renderMine(
      list
    );

  }

  else{

    resultTitle.textContent =
      "🔎 Discover";

    renderDiscover(
      list
    );

  }

}


/* =========================================================
   MY FOOD ACTIONS
========================================================= */

async function addToMyFood(
  restaurantId
){

  if(!currentUser){
    return;
  }


  try{

    const result =
      await db
        .from(
          "trip_restaurants"
        )
        .insert({

          trip_id:
            TRIP_ID,

          restaurant_id:
            restaurantId,

          is_pick:
            false,

          is_flexible:
            false,

          is_eaten:
            false,

          eaten_at:
            null

        })
        .select()
        .single();


    if(result.error){
      throw result.error;
    }


    tripRestaurants.push(
      result.data
    );


    render();

  }

  catch(error){

    alert(
      error.message ||
      "Couldn't add restaurant."
    );

  }

}


async function togglePick(
  restaurantId
){

  const relation =
    relationFor(
      restaurantId
    );


  if(!relation){
    return;
  }


  const value =
    !relation.is_pick;


  const result =
    await db
      .from(
        "trip_restaurants"
      )
      .update({
        is_pick:value
      })
      .eq(
        "trip_id",
        TRIP_ID
      )
      .eq(
        "restaurant_id",
        restaurantId
      );


  if(result.error){

    alert(
      result.error.message
    );

    return;

  }


  relation.is_pick =
    value;


  render();

}


async function toggleFlexible(
  restaurantId
){

  const relation =
    relationFor(
      restaurantId
    );


  if(!relation){
    return;
  }


  const value =
    !relation.is_flexible;


  const result =
    await db

      )
      .update({

      })
      .eq(
        "trip_id",
        TRIP_ID
      )
      .eq(
        "restaurant_id",

      );


  if(result.error){

    alert(
      result.error.message
    );

    return;

  }


  relation.is_flexible =

  render();

}


async function toggleEaten(
  restaurantId
){

  const relation =
    relationFor(
      restaurantId
    );


  if(!relation){
    return;
  }


  const value =
    !relation.is_eaten;


  const result =
    await db
      .from(
        "trip_restaurants"
      )
      .update({

        is_eaten:
          value,

        eaten_at:
          value
          ?
          new Date().toISOString()
          :
          null

      })
      .eq(
        "trip_id",
        TRIP_ID
      )
      .eq(
        "restaurant_id",
        restaurantId
      )
      .select()
      .single();


  if(result.error){

    alert(
      result.error.message
    );

    return;

  }


  relation.is_eaten =
    result.data.is_eaten;


  relation.eaten_at =
    result.data.eaten_at;


  render();

}


async function removeFromMyFood(
  restaurantId
){

  const restaurant =
    restaurants.find(
      item =>
        Number(item.id)
        ===
        Number(restaurantId)
    );


  if(!restaurant){
    return;
  }


  if(
    !confirm(
      `Remove "${restaurant.name}" from My Food?`
    )
  ){
    return;
  }


  const result =
    await db
      .from(
        "trip_restaurants"
      )
      .delete()
      .eq(
        "trip_id",
        TRIP_ID
      )
      .eq(
        "restaurant_id",
        restaurantId
      );


  if(result.error){

    alert(
      result.error.message
    );

    return;

  }


  tripRestaurants =
    tripRestaurants.filter(
      item =>
        Number(
          item.restaurant_id
        )
        !==
        Number(
          restaurantId
        )
    );


  render();

}


/* =========================================================
   GOOGLE PLACES
========================================================= */

let googlePlaceAutocomplete =
  null;

let selectedGoogleLatitude =
  null;

let selectedGoogleLongitude =
  null;


function setPlaceStatus(
  message,
  type=""
){

  const el =
    document.getElementById(
      "googlePlaceStatus"
    );


  if(!el){
    return;
  }


  el.textContent =
    message;


  el.className =
    `place-status ${type}`
      .trim();

}


function guessCuisine(types){

  const values =
    (types || [])
      .map(norm);


  if(
    values.includes(
      "ramen_restaurant"
    )
  ){
    return "Ramen";
  }


  if(
    values.includes(
      "sushi_restaurant"
    )
  ){
    return "Sushi";
  }


  if(
    values.includes(
      "japanese_restaurant"
    )
  ){
    return "Japanese";
  }


  if(
    values.includes(
      "seafood_restaurant"
    )
  ){
    return "Seafood";
  }


  if(
    values.includes("cafe")
  ){
    return "Cafe";
  }


  if(
    values.includes("bakery")
  ){
    return "Bakery";
  }


  return "";

}


async function initGooglePlaces(){

  const host =
    document.getElementById(
      "googlePlaceSearch"
    );


  if(!host){
    return;
  }


  try{

    await window.loadGoogleMaps();

    await window.getGooglePlaces();


    googlePlaceAutocomplete =
      await window
        .createGooglePlaceAutocomplete(
          host,
          {
            placeholder:
              `Search restaurant${
                trip?.country
                ?
                " in " + trip.country
                :
                ""
              }...`
          }
        );


    googlePlaceAutocomplete
      .addEventListener(
        "gmp-select",
        async event => {

          const place =
            await window
              .getGooglePlaceDetails(
                event
              );


          const data =
            window
              .normalizeGooglePlace(
                place
              );


          selectedGoogleLatitude =
            data.latitude ??
            null;


          selectedGoogleLongitude =
            data.longitude ??
            null;


          document.getElementById(
            "newName"
          ).value =
            data.name || "";


          document.getElementById(
            "newCity"
          ).value =
            data.city ||
            selectedCity ||
            "";


          document.getElementById(
            "newArea"
          ).value =
            data.area || "";


          document.getElementById(
            "newLocation"
          ).value =
            data.address || "";


          document.getElementById(
            "newMaps"
          ).value =
            data.maps_url || "";


          document.getElementById(
            "newWebsite"
          ).value =
            data.website_url || "";


          const cuisineInput =
            document.getElementById(
              "newCuisine"
            );


          if(
            !cuisineInput
              .value
              .trim()
          ){

            cuisineInput.value =
              guessCuisine(
                place.types || []
              );

          }


          setPlaceStatus(
            `✓ ${
              data.name ||
              "Restaurant"
            } selected.`,
            "success"
          );

        }
      );

  }

  catch(error){

    console.error(error);


    setPlaceStatus(
      error.message ||
      "Google Places error.",
      "error"
    );

  }

}

/* =========================================================
   ADD FORM
========================================================= */

const addForm =
  document.getElementById(
    "addForm"
  );

const formMessage =
  document.getElementById(
    "formMessage"
  );


function showFormMessage(
  message,
  type
){

  formMessage.textContent =
    message;


  formMessage.className =
    `form-message ${type}`;

}


addForm.addEventListener(
  "submit",
  async event => {

    event.preventDefault();


    const saveBtn =
      document.getElementById(
        "saveBtn"
      );


    saveBtn.disabled =
      true;


    saveBtn.textContent =
      "SAVING…";


    try{

      const name =
        document.getElementById(
          "newName"
        ).value.trim();


      const city =
        document.getElementById(
          "newCity"
        ).value.trim();


      const duplicate =
        restaurants.find(
          restaurant =>
            norm(
              restaurant.name
            )
            ===
            norm(name)
            &&
            norm(
              rCity(restaurant)
            )
            ===
            norm(city)
        );


      if(duplicate){

        throw new Error(
          "This restaurant already exists. Find it in Discover and add it to My Food."
        );

      }


      const ratingText =
        document.getElementById(
          "newRating"
        ).value.trim();


      let rating =
        null;


      if(ratingText){

        rating =
          Number(
            ratingText
          );


        if(
          Number.isNaN(
            rating
          )
        ){

          throw new Error(
            "Tabelog rating must be a number."
          );

        }

      }


      const restaurantResult =
        await db
          .from(
            "restaurants"
          )
          .insert({

            name,

            name_japanese:
              document.getElementById(
                "newJapanese"
              ).value.trim()
              || null,

            cuisine:
              document.getElementById(
                "newCuisine"
              ).value.trim()
              || null,

            country:
              trip?.country || null,

            city,

            area:
              document.getElementById(
                "newArea"
              ).value.trim()
              || null,

            location:
              document.getElementById(
                "newLocation"
              ).value.trim()
              || null,

            description:
              document.getElementById(
                "newDescription"
              ).value.trim()
              || null,

            price:
              document.getElementById(
                "newPrice"
              ).value.trim()
              || null,

            tabelog_url:
              document.getElementById(
                "newTabelog"
              ).value.trim()
              || null,

            maps_url:
              document.getElementById(
                "newMaps"
              ).value.trim()
              || null,

            website_url:
              document.getElementById(
                "newWebsite"
              ).value.trim()
              || null,

            rating,

            latitude:
              selectedGoogleLatitude,

            longitude:
              selectedGoogleLongitude,

            status:
              "active",

            created_by:
              currentUser.id,

            verified:
              false

          })
          .select()
          .single();


      if(
        restaurantResult.error
      ){

        throw restaurantResult.error;

      }


      const newRestaurant =
        restaurantResult.data;


      if(
        document.getElementById(
          "newAddTrip"
        ).checked
      ){

        const relationResult =
          await db
            .from(
              "trip_restaurants"
            )
            .insert({

              trip_id:
                TRIP_ID,

              restaurant_id:
                newRestaurant.id,

              is_pick:
                document.getElementById(
                  "newPick"
                ).checked,

              is_flexible:
                document.getElementById(
                  "newFlexible"
                ).checked,

              is_eaten:
                false,

              eaten_at:
                null

            })
            .select()
            .single();


        if(
          relationResult.error
        ){

          throw relationResult.error;

        }


        tripRestaurants.push(
          relationResult.data
        );

      }


      restaurants.push(
        newRestaurant
      );


      showFormMessage(
        "Restaurant added.",
        "success"
      );


      addForm.reset();


      document.getElementById(
        "newAddTrip"
      ).checked =
        true;


      createCityChips();

      createDiscoverChips();

      render();


      setTimeout(
        () => {

          addSheet.classList.remove(
            "open"
          );

        },
        700
      );

    }

    catch(error){

      console.error(error);


      showFormMessage(
        error.message ||
        "Couldn't save restaurant.",
        "error"
      );

    }

    finally{

      saveBtn.disabled =
        false;


      saveBtn.textContent =
        "SAVE RESTAURANT";

    }

  }
);


/* =========================================================
   START
========================================================= */

async function start(){

  await loadData();

  await initGooglePlaces();

}


start();
