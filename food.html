<!doctype html>
<html lang="en">

<head>
<meta charset="utf-8">
<meta
  name="viewport"
  content="width=device-width, initial-scale=1, viewport-fit=cover"
>
<meta name="theme-color" content="#070c10">

<title>Food · Japan Trip</title>

<style>

:root{
  --bg:#070c10;
  --panel:#10161c;
  --panel2:#151c23;
  --line:#29323b;
  --text:#f5f5f3;
  --muted:#aeb5bc;

  --red:#c96f68;
  --blue:#5c9dff;
  --green:#67c587;
  --orange:#f4a34d;
  --gold:#e3b85c;
  --purple:#ad8cff;
}

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  min-height:100vh;

  background:
    radial-gradient(
      circle at 50% -15%,
      #17212a 0%,
      transparent 38%
    ),
    var(--bg);

  color:var(--text);

  font-family:
    Inter,
    ui-sans-serif,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
}

button,
input{
  font:inherit;
}


/* =========================================================
   HEADER
========================================================= */

header{
  position:sticky;
  top:0;
  z-index:40;

  padding:
    calc(9px + env(safe-area-inset-top))
    12px
    8px;

  border-bottom:1px solid var(--line);

  background:rgba(7,12,16,.97);

  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
}

.header-inner{
  max-width:760px;
  margin:auto;
}

.title-row{
  display:flex;
  align-items:center;
  justify-content:space-between;

  gap:10px;
}

.eyebrow{
  color:var(--red);

  font-size:8px;
  font-weight:900;

  letter-spacing:.14em;
}

h1{
  margin:2px 0 0;

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-size:23px;
  line-height:1.1;
}

.trip-name{
  margin-top:2px;

  color:var(--muted);

  font-size:8px;
}

.add-btn{
  flex:0 0 auto;

  min-height:35px;

  padding:6px 10px;

  border:
    1px solid
    rgba(201,111,104,.35);

  border-radius:10px;

  background:
    rgba(201,111,104,.10);

  color:#f4d4d1;

  font-size:9px;
  font-weight:900;

  cursor:pointer;
}


/* =========================================================
   MAIN TABS
========================================================= */

.main-tabs{
  display:grid;

  grid-template-columns:
    1fr
    1fr;

  gap:5px;

  margin-top:9px;
}

.main-tab{
  min-height:37px;

  border:1px solid var(--line);
  border-radius:10px;

  background:#11181e;

  color:var(--muted);

  font-size:9px;
  font-weight:900;

  cursor:pointer;
}

.main-tab.active{
  color:#fff;

  border-color:
    rgba(201,111,104,.5);

  background:
    rgba(201,111,104,.12);
}


/* =========================================================
   SEARCH
========================================================= */

.search{
  width:100%;

  min-height:38px;

  margin-top:7px;

  padding:8px 11px;

  border:1px solid var(--line);
  border-radius:10px;

  outline:none;

  background:#10171d;
  color:#fff;

  font-size:10px;
}

.search::placeholder{
  color:#748089;
}

.search:focus{
  border-color:var(--red);
}


/* =========================================================
   CHIPS
========================================================= */

.chips{
  display:flex;

  gap:5px;

  overflow-x:auto;

  margin-top:6px;

  padding-bottom:2px;

  scrollbar-width:none;
}

.chips::-webkit-scrollbar{
  display:none;
}

.chip{
  flex:0 0 auto;

  min-height:28px;

  padding:4px 9px;

  border:1px solid var(--line);
  border-radius:999px;

  background:#10171d;

  color:#b8c0c6;

  font-size:8px;
  font-weight:800;

  white-space:nowrap;

  cursor:pointer;
}

.chip.active{
  color:#fff;

  border-color:var(--red);

  background:
    rgba(201,111,104,.12);
}


/* =========================================================
   DISCOVER MODE
========================================================= */

.discover-controls{
  display:none;
}

.discover-controls.show{
  display:block;
}

.mode-switch{
  display:grid;

  grid-template-columns:
    1fr
    1fr;

  gap:5px;

  margin-top:6px;
}

.mode-btn{
  min-height:30px;

  border:1px solid var(--line);
  border-radius:9px;

  background:#11181e;

  color:var(--muted);

  font-size:8px;
  font-weight:850;

  cursor:pointer;
}

.mode-btn.active{
  color:#fff;

  border-color:
    rgba(201,111,104,.45);

  background:
    rgba(201,111,104,.10);
}


/* =========================================================
   MAIN
========================================================= */

main{
  max-width:760px;

  margin:auto;

  padding:
    11px
    12px
    95px;
}

.result-head{
  display:flex;

  align-items:center;
  justify-content:space-between;

  gap:10px;

  margin:
    1px
    2px
    9px;
}

.result-title{
  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-size:18px;
  font-weight:800;
}

.result-count{
  color:var(--muted);

  font-size:8px;
}


/* =========================================================
   SECTION
========================================================= */

.food-section{
  margin-bottom:17px;
}

.section-title{
  display:flex;

  align-items:center;

  gap:6px;

  margin:
    4px
    2px
    7px;

  padding-bottom:5px;

  border-bottom:
    1px solid
    rgba(255,255,255,.07);

  color:#fff;

  font-size:10px;
  font-weight:900;
}

.section-title span:last-child{
  margin-left:auto;

  color:#74818a;

  font-size:7px;
}


/* =========================================================
   CARD
========================================================= */

.restaurant-card{
  margin-bottom:6px;

  padding:9px 10px;

  border:1px solid var(--line);
  border-radius:12px;

  background:
    linear-gradient(
      145deg,
      #141c22,
      #0d1318
    );
}

.card-top{
  display:flex;

  align-items:flex-start;

  gap:8px;
}

.food-icon{
  flex:0 0 auto;

  width:28px;
  height:28px;

  display:flex;

  align-items:center;
  justify-content:center;

  border:
    1px solid
    rgba(201,111,104,.16);

  border-radius:8px;

  background:
    rgba(201,111,104,.07);

  font-size:14px;
}

.card-main{
  flex:1;
  min-width:0;
}

.restaurant-name{
  margin:0;

  color:#fff;

  font-size:12px;
  font-weight:900;

  line-height:1.25;
}

.japanese{
  margin-top:1px;

  color:#7f8a93;

  font-size:8px;
}

.location{
  margin-top:2px;

  color:var(--muted);

  font-size:8px;
}


/* =========================================================
   BADGES
========================================================= */

.badges{
  display:flex;

  flex-wrap:wrap;

  gap:3px;

  margin-top:5px;
}

.badge{
  padding:2px 5px;

  border:1px solid var(--line);
  border-radius:999px;

  background:
    rgba(255,255,255,.03);

  color:#c9d0d5;

  font-size:7px;
  font-weight:850;
}

.badge.pick{
  color:#f0cb6b;

  border-color:
    rgba(227,184,92,.25);

  background:
    rgba(227,184,92,.08);
}

.badge.flex{
  color:#aebdff;

  border-color:
    rgba(92,157,255,.22);

  background:
    rgba(92,157,255,.08);
}

.badge.top{
  color:#e5c46d;

  border-color:
    rgba(227,184,92,.22);

  background:
    rgba(227,184,92,.07);
}

.badge.hot{
  color:#ffab7f;

  border-color:
    rgba(244,163,77,.22);

  background:
    rgba(244,163,77,.07);
}

.badge.scheduled{
  color:#9fe1b5;

  border-color:
    rgba(103,197,135,.22);

  background:
    rgba(103,197,135,.07);
}


/* =========================================================
   META
========================================================= */

.meta{
  display:flex;

  flex-wrap:wrap;

  gap:4px;

  margin-top:6px;
}

.meta-item{
  padding:
    3px
    6px;

  border:
    1px solid
    rgba(255,255,255,.06);

  border-radius:6px;

  background:
    rgba(255,255,255,.025);

  color:#c7cdd1;

  font-size:7px;
  font-weight:800;
}


/* =========================================================
   PLAN BOX
========================================================= */

.plan-box{
  margin-top:6px;

  padding:
    6px
    8px;

  border:
    1px solid
    rgba(103,197,135,.18);

  border-radius:8px;

  background:
    rgba(103,197,135,.05);

  color:#b8ddc4;

  font-size:8px;
  font-weight:800;
}


/* =========================================================
   DESCRIPTION
========================================================= */

.description{
  margin-top:6px;

  color:var(--muted);

  font-size:8px;
  line-height:1.4;
}


/* =========================================================
   ACTIONS
========================================================= */

.actions{
  display:flex;

  flex-wrap:wrap;

  gap:4px;

  margin-top:7px;
}

.action-btn{
  min-height:28px;

  display:inline-flex;

  align-items:center;
  justify-content:center;

  padding:4px 8px;

  border:
    1px solid
    rgba(201,111,104,.25);

  border-radius:7px;

  background:
    rgba(201,111,104,.06);

  color:var(--red);

  text-decoration:none;

  font-size:7px;
  font-weight:900;

  cursor:pointer;
}

.action-btn.gold{
  color:var(--gold);

  border-color:
    rgba(227,184,92,.22);

  background:
    rgba(227,184,92,.05);
}

.action-btn.green{
  color:var(--green);

  border-color:
    rgba(103,197,135,.22);

  background:
    rgba(103,197,135,.05);
}

.action-btn.blue{
  color:var(--blue);

  border-color:
    rgba(92,157,255,.22);

  background:
    rgba(92,157,255,.05);
}

.action-btn.muted{
  color:#9ca6ad;

  border-color:var(--line);

  background:#11181e;
}


/* =========================================================
   EMPTY / LOADING
========================================================= */

.state{
  padding:
    28px
    16px;

  border:
    1px dashed
    #35414a;

  border-radius:14px;

  text-align:center;

  color:var(--muted);

  font-size:9px;
}

.state strong{
  display:block;

  margin-bottom:4px;

  color:#fff;

  font-size:12px;
}


/* =========================================================
   ADD SHEET
========================================================= */

.sheet-backdrop{
  position:fixed;

  inset:0;

  z-index:100;

  display:none;

  align-items:flex-end;

  background:
    rgba(0,0,0,.68);

  backdrop-filter:blur(4px);
}

.sheet-backdrop.open{
  display:flex;
}

.sheet{
  width:100%;

  max-height:
    calc(92vh - env(safe-area-inset-top));

  overflow-y:auto;

  padding:
    8px
    14px
    calc(18px + env(safe-area-inset-bottom));

  border:
    1px solid var(--line);

  border-radius:
    20px
    20px
    0
    0;

  background:#0d1318;
}

.sheet-handle{
  width:38px;
  height:4px;

  margin:
    2px
    auto
    12px;

  border-radius:999px;

  background:#39454d;
}

.sheet-head{
  display:flex;

  align-items:center;
  justify-content:space-between;

  gap:10px;

  margin-bottom:12px;
}

.sheet-title{
  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-size:19px;
}

.close-btn{
  width:34px;
  height:34px;

  border:1px solid var(--line);
  border-radius:9px;

  background:#151c22;

  color:#fff;

  cursor:pointer;
}


/* =========================================================
   FORM
========================================================= */

.form-grid{
  display:grid;

  grid-template-columns:
    1fr
    1fr;

  gap:9px;
}

.field.full{
  grid-column:1/-1;
}

.field label{
  display:block;

  margin-bottom:4px;

  color:#aeb5bc;

  font-size:7px;
  font-weight:900;
}

.field input,
.field textarea{
  width:100%;

  min-height:40px;

  padding:
    8px
    9px;

  border:1px solid var(--line);
  border-radius:9px;

  outline:none;

  background:#10171d;
  color:#fff;

  font-size:10px;
}

.field textarea{
  min-height:70px;

  resize:vertical;
}

.field input:focus,
.field textarea:focus{
  border-color:var(--red);
}

.checks{
  display:grid;

  grid-template-columns:
    1fr
    1fr;

  gap:5px;

  margin-top:10px;
}

.check{
  display:flex;

  align-items:center;

  gap:6px;

  min-height:39px;

  padding:
    6px
    8px;

  border:1px solid var(--line);
  border-radius:9px;

  background:#11181e;

  color:#d1d6da;

  font-size:8px;
  font-weight:800;
}

.check input{
  width:15px;
  height:15px;
}

.save-btn{
  width:100%;

  min-height:44px;

  margin-top:11px;

  border:
    1px solid
    rgba(201,111,104,.4);

  border-radius:10px;

  background:
    rgba(201,111,104,.13);

  color:#f4d4d1;

  font-size:9px;
  font-weight:900;

  cursor:pointer;
}

.save-btn:disabled{
  opacity:.5;
}

.form-message{
  display:none;

  margin-top:8px;

  padding:8px;

  border-radius:8px;

  font-size:8px;
}

.form-message.error{
  display:block;

  color:#ffc5c1;

  border:
    1px solid
    rgba(201,111,104,.25);

  background:
    rgba(201,111,104,.07);
}

.form-message.success{
  display:block;

  color:#b9e4c7;

  border:
    1px solid
    rgba(103,197,135,.25);

  background:
    rgba(103,197,135,.07);
}


/* =========================================================
   BOTTOM NAV
========================================================= */

.bottom-nav{
  position:fixed;

  left:0;
  right:0;
  bottom:0;

  z-index:80;

  display:grid;

  grid-template-columns:
    repeat(5,1fr);

  padding:
    7px
    8px
    calc(7px + env(safe-area-inset-bottom));

  border-top:1px solid var(--line);

  background:
    rgba(7,12,16,.98);

  backdrop-filter:blur(18px);
}

.bottom-nav a{
  min-height:47px;

  display:flex;

  flex-direction:column;

  align-items:center;
  justify-content:center;

  gap:2px;

  border-radius:10px;

  color:var(--muted);

  text-decoration:none;

  font-size:8px;
  font-weight:800;
}

.nav-icon{
  font-size:16px;
  line-height:1;
}

.bottom-nav a.active{
  color:#fff;

  border:
    1px solid
    rgba(201,111,104,.24);

  background:
    rgba(201,111,104,.09);
}


/* =========================================================
   DESKTOP
========================================================= */

@media(min-width:700px){

  .sheet{
    max-width:620px;

    margin:auto;
  }

  .bottom-nav{
    left:50%;
    right:auto;

    width:min(820px,100%);

    transform:
      translateX(-50%);
  }

}

</style>
</head>


<body>


<!-- =========================================================
     HEADER
========================================================= -->

<header>

<div class="header-inner">

  <div class="title-row">

    <div>

      <div class="eyebrow">
        JAPAN TRIP
      </div>

      <h1>
        🍽️ Food
      </h1>

      <div
        id="tripName"
        class="trip-name"
      >
        Loading trip…
      </div>

    </div>


    <button
      id="openAdd"
      class="add-btn"
      type="button"
    >
      ＋ ADD
    </button>

  </div>


  <!-- MAIN FOOD TABS -->

  <div class="main-tabs">

    <button
      class="main-tab active"
      data-tab="mine"
    >
      ❤️ MY FOOD
    </button>

    <button
      class="main-tab"
      data-tab="discover"
    >
      🔎 DISCOVER
    </button>

  </div>


  <!-- SEARCH -->

  <input
    id="searchInput"
    class="search"
    type="search"
    placeholder="Search your restaurants..."
    autocomplete="off"
  >


  <!-- CITY -->

  <div
    id="cityChips"
    class="chips"
  ></div>


  <!-- MY FOOD FILTERS -->

  <div
    id="myFilters"
    class="chips"
  >

    <button
      class="chip active"
      data-myfilter="all"
    >
      ALL
    </button>

    <button
      class="chip"
      data-myfilter="pick"
    >
      ⭐ PICKS
    </button>

    <button
      class="chip"
      data-myfilter="flexible"
    >
      🌙 FLEXIBLE
    </button>

    <button
      class="chip"
      data-myfilter="scheduled"
    >
      📅 SCHEDULED
    </button>

  </div>


  <!-- DISCOVER CONTROLS -->

  <div
    id="discoverControls"
    class="discover-controls"
  >

    <div class="mode-switch">

      <button
        class="mode-btn active"
        data-mode="area"
      >
        📍 BY AREA
      </button>

      <button
        class="mode-btn"
        data-mode="food"
      >
        🍜 BY FOOD
      </button>

    </div>


    <div
      id="browseChips"
      class="chips"
    ></div>

  </div>

</div>

</header>



<!-- =========================================================
     RESULTS
========================================================= -->

<main>

  <div class="result-head">

    <div
      id="resultTitle"
      class="result-title"
    >
      ❤️ My Food
    </div>

    <div
      id="resultCount"
      class="result-count"
    ></div>

  </div>


  <div id="results">

    <div class="state">

      <strong>
        Loading restaurants…
      </strong>

      Getting your food list from Supabase.

    </div>

  </div>

</main>



<!-- =========================================================
     ADD RESTAURANT
========================================================= -->

<div
  id="addSheet"
  class="sheet-backdrop"
>

  <div class="sheet">

    <div class="sheet-handle"></div>


    <div class="sheet-head">

      <div class="sheet-title">
        ＋ Add Restaurant
      </div>

      <button
        id="closeAdd"
        class="close-btn"
        type="button"
      >
        ✕
      </button>

    </div>


    <form id="addForm">

      <div class="form-grid">


        <div class="field full">

          <label>
            RESTAURANT NAME *
          </label>

          <input
            id="newName"
            required
            placeholder="Restaurant name"
          >

        </div>


        <div class="field full">

          <label>
            JAPANESE NAME
          </label>

          <input
            id="newJapanese"
            placeholder="Japanese name"
          >

        </div>


        <div class="field">

          <label>
            CITY *
          </label>

          <input
            id="newCity"
            required
            placeholder="Kyoto"
          >

        </div>


        <div class="field">

          <label>
            AREA
          </label>

          <input
            id="newArea"
            placeholder="Gion"
          >

        </div>


        <div class="field">

          <label>
            LOCATION
          </label>

          <input
            id="newLocation"
            placeholder="Pontocho"
          >

        </div>


        <div class="field">

          <label>
            CUISINE
          </label>

          <input
            id="newCuisine"
            placeholder="Yakitori"
          >

        </div>


        <div class="field">

          <label>
            TABELOG RATING
          </label>

          <input
            id="newRating"
            inputmode="decimal"
            placeholder="3.70"
          >

        </div>


        <div class="field">

          <label>
            BUDGET / PERSON
          </label>

          <input
            id="newPrice"
            placeholder="¥3K–5K"
          >

        </div>


        <div class="field full">

          <label>
            TABELOG URL
          </label>

          <input
            id="newTabelog"
            type="url"
            placeholder="https://tabelog.com/..."
          >

        </div>


        <div class="field full">

          <label>
            GOOGLE MAPS URL
          </label>

          <input
            id="newMaps"
            type="url"
            placeholder="https://maps.google.com/..."
          >

        </div>


        <div class="field full">

          <label>
            WEBSITE
          </label>

          <input
            id="newWebsite"
            type="url"
            placeholder="https://..."
          >

        </div>


        <div class="field full">

          <label>
            WHY / NOTES
          </label>

          <textarea
            id="newDescription"
            placeholder="Why do you want to try this?"
          ></textarea>

        </div>

      </div>


      <div class="checks">

        <label class="check">

          <input
            id="newAddTrip"
            type="checkbox"
            checked
          >

          ❤️ My Food

        </label>


        <label class="check">

          <input
            id="newPick"
            type="checkbox"
          >

          ⭐ Pick

        </label>


        <label class="check">

          <input
            id="newFlexible"
            type="checkbox"
          >

          🌙 Flexible

        </label>

      </div>


      <button
        id="saveBtn"
        class="save-btn"
        type="submit"
      >
        SAVE RESTAURANT
      </button>


      <div
        id="formMessage"
        class="form-message"
      ></div>

    </form>

  </div>

</div>



<!-- =========================================================
     BOTTOM NAV
========================================================= -->

<nav
  class="bottom-nav"
  aria-label="Main navigation"
>

<script>

/* =========================================================
   TRIP

const params =
  new URLSearchParams(

/* =========================================================
   DATA

let trip = null;

let restaurants = [];

let tripRestaurants = [];

let scheduleRows = [];

let currentUser = null;


/* =========================================================
   STATE
========================================================= */

let activeTab = "mine";

let selectedCity = "";

let myFilter = "all";

let discoverMode = "area";

let discoverFilter = "";

let searchTerm = "";


/* =========================================================
   ELEMENTS
========================================================= */

const tripName =
  document.getElementById(
    "tripName"
  );

  document.getElementById(
    "results"

  document.getElementById(
    "resultTitle"

  );

  );

  document.getElementById(
    "browseChips"

/* =========================================================
   NAV
========================================================= */

document.getElementById(
  "navHome"
).href =
  `index.html?trip=${TRIP_ID}`;

document.getElementById(
  "navPlan"
).href =
  `schedule.html?trip=${TRIP_ID}`;

document.getElementById(
  "navFood"
).href =

document.getElementById(

).href =
  `bookings.html?trip=${TRIP_ID}`;


/* =========================================================
   HELPERS
========================================================= */

function text(value){

  return String(
    value ?? ""
  );

}


function esc(value){

  return text(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


function norm(value){

  return text(value)
    .trim()
    .toLowerCase();

}


function unique(values){

  return [
    ...new Set(
      values
        .map(v => text(v).trim())
        .filter(Boolean)
    )
  ]
  .sort(
    (a,b) =>
      a.localeCompare(b)
  );

}


/* =========================================================
   RESTAURANT HELPERS
========================================================= */

function rCity(r){
  return r.city || "";
}

function rArea(r){
  return r.area || "";
}

function rCuisine(r){
  return r.cuisine || "Restaurant";
}

function rJapanese(r){
  return r.name_japanese || "";
}

function rRating(r){
  return r.rating ?? "";
}

function rPrice(r){

  return (
    r.price ||
    r.dinner_price ||
    r.lunch_price ||
    ""
  );

}

function rDescription(r){
  return r.description || "";
}

function rLocation(r){

  return (
    r.location ||
    r.area ||
    r.city ||
    ""
  );

}


/* =========================================================
   FOOD ICON
========================================================= */

function foodIcon(value){

  const v =
    norm(value);

  if(v.includes("ramen"))
    return "🍜";

  if(v.includes("sushi"))
    return "🍣";

  if(v.includes("yakitori"))
    return "🍢";

  if(v.includes("chicken"))
    return "🍗";

  if(v.includes("oyakodon"))
    return "🍳";

  if(
    v.includes("udon") ||
    v.includes("soba")
  )
    return "🥢";

  if(v.includes("tonkatsu"))
    return "🐷";

  if(v.includes("unagi"))
    return "🐟";

  if(v.includes("tempura"))
    return "🍤";

  if(v.includes("curry"))
    return "🍛";

  if(v.includes("izakaya"))
    return "🍶";

  if(v.includes("gyoza"))
    return "🥟";

  if(v.includes("bakery"))
    return "🥐";

  if(v.includes("seafood"))
    return "🦐";

  return "🍽️";

}


/* =========================================================
   RELATIONS
========================================================= */

function relationFor(id){

  return tripRestaurants.find(
    x =>
      Number(x.restaurant_id)
      ===
      Number(id)
  );

}


function inMyFood(r){

  return Boolean(
    relationFor(r.id)
  );

}


function isPick(r){

  return Boolean(
    relationFor(r.id)
      ?.is_pick
  );

}


function isFlexible(r){

  return Boolean(
    relationFor(r.id)
      ?.is_flexible
  );

}


function scheduleFor(r){

  return scheduleRows
    .filter(
      x =>
        Number(x.restaurant_id)
        ===
        Number(r.id)
    )
    .sort(
      (a,b) =>
        String(a.schedule_date)
          .localeCompare(
            String(b.schedule_date)
          )
    );

}


function isScheduled(r){

  return (
    scheduleFor(r).length > 0
  );

}


/* =========================================================
   MASTER FLAGS
========================================================= */

function isTop(r){

  if(
    r.is_tabelog_top100 === true
  ){
    return true;
  }

  const award =
    norm(
      r.award ||
      r.recognition
    );

  return (
    award.includes("top 100") ||
    award.includes("top100")
  );

}


function isHot(r){

  if(r.is_hot === true){
    return true;
  }

  return norm(
    r.award ||
    r.recognition
  )
  .includes(
    "hot restaurant"
  );

}


/* =========================================================
   DATE
========================================================= */

function formatScheduleDate(
  value
){

  if(!value){
    return "";
  }

  const d =
    new Date(
      value +
      "T12:00:00"
    );

  return new Intl.DateTimeFormat(
    "en-SG",
    {
      day:"numeric",
      month:"short"
    }
  )
  .format(d)
  .toUpperCase();

}


/* =========================================================
   LOAD
========================================================= */

async function loadData(){

  try{


    /* USER */

    const userResult =
      await db.auth.getUser();

    currentUser =
      userResult.data?.user ||
      null;



    /* TRIP */

    const tripResult =
      await db
        .from("trips")
        .select(
          "id,name,start_date,end_date"
        )
        .eq(
          "id",
          TRIP_ID
        )
        .single();


    if(tripResult.error){
      throw tripResult.error;
    }


    trip =
      tripResult.data;


    tripName.textContent =
      trip.name;



    /* RESTAURANTS */

    const restaurantResult =
      await db
        .from("restaurants")
        .select("*")
        .order(
          "name",
          {
            ascending:true
          }
        );


    if(
      restaurantResult.error
    ){
      throw restaurantResult.error;
    }


    restaurants =
      restaurantResult.data || [];



    /* MY FOOD */

    const relationResult =
      await db
        .from(
          "trip_restaurants"
        )
        .select("*")
        .eq(
          "trip_id",
          TRIP_ID
        );


    if(
      relationResult.error
    ){
      throw relationResult.error;
    }


    tripRestaurants =
      relationResult.data || [];



    /* SCHEDULED RESTAURANTS */

    const scheduleResult =
      await db
        .from("schedule")
        .select(`
          id,
          restaurant_id,
          schedule_date,
          start_time,
          time_label,
          title,
          is_locked
        `)
        .eq(
          "trip_id",
          TRIP_ID
        )
        .not(
          "restaurant_id",
          "is",
          null
        );


    if(
      scheduleResult.error
    ){

      console.warn(
        scheduleResult.error
      );

      scheduleRows = [];

    }

    else{

      scheduleRows =
        scheduleResult.data || [];

    }


    createCityChips();

    createDiscoverChips();

    render();

  }

  catch(error){

    console.error(error);

    results.innerHTML = `

      <div class="state">

        <strong>
          Couldn't load Food
        </strong>

        ${esc(
          error.message ||
          "Unknown database error."
        )}

      </div>

    `;

  }

}


/* =========================================================
   TABS
========================================================= */

document
  .querySelectorAll(
    ".main-tab"
  )
  .forEach(button => {

    button.addEventListener(
      "click",
      () => {

        activeTab =
          button.dataset.tab;


        document
          .querySelectorAll(
            ".main-tab"
          )
          .forEach(x => {

            x.classList.toggle(
              "active",
              x === button
            );

          });


        if(
          activeTab === "mine"
        ){

          myFilters.style.display =
            "flex";

          discoverControls
            .classList.remove(
              "show"
            );

          searchInput.placeholder =
            "Search your restaurants...";

        }

        else{

          myFilters.style.display =
            "none";

          discoverControls
            .classList.add(
              "show"
            );

          searchInput.placeholder =
            "Search master restaurant list...";

        }


        render();

      }
    );

  });


/* =========================================================
   SEARCH
========================================================= */

searchInput.addEventListener(
  "input",
  () => {

    searchTerm =
      norm(
        searchInput.value
      );

    render();

  }
);


/* =========================================================
   CITY CHIPS
========================================================= */

function createCityChips(){

  const cities =
    unique(
      restaurants.map(rCity)
    );


  cityChips.innerHTML = `

    <button
      class="chip active"
      data-city=""
    >
      🇯🇵 ALL
    </button>

    ${cities.map(city => {

      let icon = "📍";

      if(
        norm(city)
          .includes("kyoto")
      ){
        icon = "⛩️";
      }

      else if(
        norm(city)
          .includes("osaka")
      ){
        icon = "🌃";
      }

      else if(
        norm(city)
          .includes("nara")
      ){
        icon = "🦌";
      }

      else if(
        norm(city)
          .includes("nagoya")
      ){
        icon = "🏯";
      }

      return `

        <button
          class="chip"
          data-city="${esc(city)}"
        >
          ${icon}
          ${esc(city)}
        </button>

      `;

    }).join("")}

  `;


  cityChips
    .querySelectorAll(
      "[data-city]"
    )
    .forEach(button => {

      button.onclick = () => {

        selectedCity =
          button.dataset.city;

        discoverFilter = "";


        cityChips
          .querySelectorAll(
            "[data-city]"
          )
          .forEach(x => {

            x.classList.toggle(
              "active",
              x === button
            );

          });


        createDiscoverChips();

        render();

      };

    });

}


/* =========================================================
   MY FOOD FILTER
========================================================= */

myFilters
  .querySelectorAll(
    "[data-myfilter]"
  )
  .forEach(button => {

    button.onclick = () => {

      myFilter =
        button.dataset.myfilter;


      myFilters
        .querySelectorAll(
          "[data-myfilter]"
        )
        .forEach(x => {

          x.classList.toggle(
            "active",
            x === button
          );

        });


      render();

    };

  });


/* =========================================================
   DISCOVER MODE
========================================================= */

document
  .querySelectorAll(
    "[data-mode]"
  )
  .forEach(button => {

    button.onclick = () => {

      discoverMode =
        button.dataset.mode;

      discoverFilter = "";


      document
        .querySelectorAll(

          );

        });


      createDiscoverChips();

    };

/* =========================================================
   DISCOVER CHIPS
========================================================= */

function discoverSource(){

  if(!selectedCity){
    return restaurants;
  }

  return restaurants.filter(
    r =>
      norm(rCity(r))
      ===
      norm(selectedCity)
  );

}


function createDiscoverChips(){

  const source =
    discoverSource();


  const values =
    discoverMode === "area"

    ?

    unique(
      source.map(rArea)
    )

    :

    unique(
      source.map(rCuisine)
    );


  browseChips.innerHTML = `

    <button
      class="chip active"
      data-discover=""
    >

      ${
        discoverMode === "area"
        ?
        "ALL AREAS"
        :
        "ALL FOOD"
      }

    </button>


    ${values.map(value => `

      <button
        class="chip"
        data-discover="${esc(value)}"
      >

        ${
          discoverMode === "food"
          ?
          foodIcon(value) + " "
          :
          ""
        }

        ${esc(value)}

      </button>

    `).join("")}

  `;


  browseChips
    .querySelectorAll(
      "[data-discover]"
    )
    .forEach(button => {

      button.onclick = () => {

        discoverFilter =
          button.dataset.discover;


        browseChips
          .querySelectorAll(
            "[data-discover]"
          )
          .forEach(x => {

            x.classList.toggle(
              "active",
              x === button
            );

          });


        render();

      };

    });

}


/* =========================================================
   SEARCH MATCH
========================================================= */

function matchesSearch(r){

  if(!searchTerm){
    return true;
  }


  const value =
    norm([

      r.name,
      rJapanese(r),
      rCuisine(r),
      rCity(r),
      rArea(r),
      rLocation(r),
      rDescription(r),
      r.award,
      r.recognition,
      rRating(r),
      rPrice(r)

    ].join(" "));


  return value.includes(
    searchTerm
  );

}


/* =========================================================
   FILTERED
========================================================= */

function filteredRestaurants(){

  let list =
    restaurants.slice();


  /* MY FOOD */

  if(activeTab === "mine"){

    list =
      list.filter(
        inMyFood
      );


    if(
      myFilter === "pick"
    ){

      list =
        list.filter(
          isPick
        );

    }


    if(
      myFilter === "flexible"
    ){

      list =
        list.filter(
          isFlexible
        );

    }


    if(
      myFilter === "scheduled"
    ){

      list =
        list.filter(
          isScheduled
        );

    }

  }


  /* CITY */

  if(selectedCity){

    list =
      list.filter(
        r =>
          norm(rCity(r))
          ===
          norm(selectedCity)
      );

  }


  /* DISCOVER */

  if(
    activeTab === "discover"
    &&
    discoverFilter
  ){

    if(
      discoverMode === "area"
    ){

      list =
        list.filter(
          r =>
            norm(rArea(r))
            ===
            norm(discoverFilter)
        );

    }

    else{

      list =
        list.filter(
          r =>
            norm(rCuisine(r))
            ===
            norm(discoverFilter)
        );

    }

  }


  /* SEARCH */

  list =
    list.filter(
      matchesSearch
    );


  return list;

}


/* =========================================================
   BADGES
========================================================= */

function badges(r){

  let html = `

    <span class="badge">
      ${foodIcon(rCuisine(r))}
      ${esc(rCuisine(r))}
    </span>

  `;


  if(isPick(r)){

    html += `

      <span class="badge pick">
        ⭐ Pick
      </span>

    `;

  }


  if(isFlexible(r)){

    html += `

      <span class="badge flex">
        🌙 Flexible
      </span>

    `;

  }


  if(isTop(r)){

    html += `

      <span class="badge top">
        🏆 Top 100
      </span>

    `;

  }


  if(isHot(r)){

    html += `

      <span class="badge hot">
        🔥 Hot
      </span>

    `;

  }


  if(isScheduled(r)){

    html += `

      <span class="badge scheduled">
        📅 Scheduled
      </span>

    `;

  }


  return html;

}


/* =========================================================
   SCHEDULE BOX
========================================================= */

function planHTML(r){

  const rows =
    scheduleFor(r);


  if(!rows.length){
    return "";
  }


  return rows.map(row => {

    const time =
      row.time_label ||
      (
        row.start_time
        ?
        row.start_time.slice(0,5)
        :
        ""
      );


    return `

      <div class="plan-box">

        📅
        ${esc(
          formatScheduleDate(
            row.schedule_date
          )
        )}

        ${
          time
          ?
          ` · ${esc(time)}`
          :
          ""
        }

        ${
          row.is_locked
          ?
          " · 🔒 Locked"
          :
          ""
        }

      </div>

    `;

  }).join("");

}


/* =========================================================
   CARD
========================================================= */

function cardHTML(r){

  const relation =
    relationFor(r.id);


  const mapsURL =
    r.maps_url
    ||
    `https://www.google.com/maps/search/?api=1&query=${
      encodeURIComponent(
        `${r.name} ${rCity(r)} Japan`
      )
    }`;


  return `

    <article class="restaurant-card">


      <div class="card-top">


        <div class="food-icon">

          ${foodIcon(
            rCuisine(r)
          )}

        </div>


        <div class="card-main">


          <h3 class="restaurant-name">

            ${esc(r.name)}

          </h3>


          ${
            rJapanese(r)

            ?

            `
              <div class="japanese">
                ${esc(
                  rJapanese(r)
                )}
              </div>
            `

            :

            ""
          }


          <div class="location">

            📍
            ${esc(
              rLocation(r)
            )}

            ${
              rCity(r)
              ?
              ` · ${esc(rCity(r))}`
              :
              ""
            }

          </div>


          <div class="badges">

            ${badges(r)}

          </div>


        </div>

      </div>


      ${
        rRating(r) ||
        rPrice(r)

        ?

        `

          <div class="meta">

            ${
              rRating(r)

              ?

              `
                <span class="meta-item">
                  ⭐ Tabelog
                  ${esc(rRating(r))}
                </span>
              `

              :

              ""
            }


            ${
              rPrice(r)

              ?

              `
                <span class="meta-item">
                  💴 ${esc(rPrice(r))}
                </span>
              `

              :

              ""
            }

          </div>

        `

        :

        ""
      }


      ${planHTML(r)}


      ${
        rDescription(r)

        ?

        `
          <div class="description">

            ${esc(
              rDescription(r)
            )}

          </div>
        `

        :

        ""
      }


      <div class="actions">


        <a
          class="action-btn"
          href="${esc(mapsURL)}"
          target="_blank"
          rel="noopener noreferrer"
        >
          📍 MAP
        </a>


        ${
          r.tabelog_url

          ?

          `
            <a
              class="action-btn gold"
              href="${esc(
                r.tabelog_url
              )}"
              target="_blank"
              rel="noopener noreferrer"
            >
              🏆 TABELOG
            </a>
          `

          :

          ""
        }


        ${
          r.booking_url

          ?

          `
            <a
              class="action-btn green"
              href="${esc(
                r.booking_url
              )}"
              target="_blank"
              rel="noopener noreferrer"
            >
              🌐 BOOK
            </a>
          `

          :

          ""
        }


        ${
          relation

          ?

          `

            <button
              class="action-btn blue"
              type="button"
              onclick="togglePick(${Number(r.id)})"
            >

              ${
                relation.is_pick
                ?
                "★ PICK"
                :
                "☆ PICK"
              }

            </button>


            <button
              class="action-btn blue"
              type="button"
              onclick="toggleFlexible(${Number(r.id)})"
            >

              ${
                relation.is_flexible
                ?
                "🌙 FLEX"
                :
                "＋ FLEX"
              }

            </button>


            ${
              !isScheduled(r)

              ?

              `
                <button
                  class="action-btn muted"
                  type="button"
                  onclick="removeFromMyFood(${Number(r.id)})"
                >
                  REMOVE
                </button>
              `

              :

              ""
            }

          `

          :

          `

            <button
              class="action-btn green"
              type="button"
              onclick="addToMyFood(${Number(r.id)})"
            >
              ＋ MY FOOD
            </button>

          `
        }


      </div>


    </article>

  `;

}


/* =========================================================
   RENDER MY FOOD
========================================================= */

function renderMine(list){

  if(!list.length){

    results.innerHTML = `

      <div class="state">

        <strong>
          No restaurants here yet
        </strong>

        ${
          myFilter === "all"

          ?

          `
            Open Discover and tap
            <b>＋ My Food</b>
            on restaurants you want to remember.
          `

          :

          `
            No restaurants match this filter.
          `
        }

      </div>

    `;

    return;

  }


  /*
    ALL view gets useful sections.
    A specific filter stays as one clean list.
  */

  if(
    myFilter !== "all"
  ){

    results.innerHTML =
      list
        .map(cardHTML)
        .join("");

    return;

  }


  const picks =
    list.filter(
      isPick
    );


  const scheduled =
    list.filter(
      r =>
        isScheduled(r) &&
        !isPick(r)
    );


  const flexible =
    list.filter(
      r =>
        isFlexible(r) &&
        !isPick(r) &&
        !isScheduled(r)
    );


  const saved =
    list.filter(
      r =>
        !isPick(r) &&
        !isFlexible(r) &&
        !isScheduled(r)
    );


  let html = "";


  if(picks.length){

    html += sectionHTML(
      "⭐ PICKS",
      picks
    );

  }


  if(scheduled.length){

    html += sectionHTML(
      "📅 SCHEDULED",
      scheduled
    );

  }


  if(flexible.length){

    html += sectionHTML(
      "🌙 FLEXIBLE / MAYBE",
      flexible
    );

  }


  if(saved.length){

    html += sectionHTML(
      "❤️ SAVED",
      saved
    );

  }


  results.innerHTML =
    html;

}


/* =========================================================
   SECTION HTML
========================================================= */

function sectionHTML(
  title,
  list
){

  return `

    <section class="food-section">

      <div class="section-title">

        <div>
          ${title}
        </div>

        <span>
          ${list.length}
        </span>

      </div>


      ${
        list
          .map(cardHTML)
          .join("")
      }

    </section>

  `;

}


/* =========================================================
   RENDER DISCOVER
========================================================= */

function renderDiscover(list){

  if(!list.length){

    results.innerHTML = `

      <div class="state">

        <strong>
          No restaurants found
        </strong>

        Try another area,
        cuisine or search.

      </div>

    `;

    return;

  }


  /*
    Restaurants already in My Food stay
    visible in Discover, but their card
    shows their Pick/Flexible controls
    instead of + My Food.
  */

  results.innerHTML =
    list
      .map(cardHTML)
      .join("");

}


/* =========================================================
   MAIN RENDER
========================================================= */

function render(){

  const list =
    filteredRestaurants();


  resultCount.textContent =
    `${list.length} ${
      list.length === 1
      ?
      "restaurant"
      :
      "restaurants"
    }`;


  if(activeTab === "mine"){

    resultTitle.textContent =
      "❤️ My Food";

    renderMine(list);

  }

  else{

    resultTitle.textContent =
      "🔎 Discover";

    renderDiscover(list);

  }

}

/* =========================================================
   REMOVE FROM MY FOOD
========================================================= */

async function removeFromMyFood(
  restaurantId
){

  /*
    Scheduled restaurants aren't given
    this button, which helps avoid
    accidentally removing something
    you're already planning to visit.
  */

  const restaurant =
    restaurants.find(
      r =>
        Number(r.id)
        ===
        Number(restaurantId)
    );


  if(!restaurant){
    return;
  }


  const okay =
    confirm(
      `Remove "${restaurant.name}" from My Food?\n\nThe restaurant will stay in the master list.`
    );


  if(!okay){
    return;
  }


  try{

    const result =
      await db
        .from(
          "trip_restaurants"
        )
        .delete()
        .eq(
          "trip_id",
          TRIP_ID
        )
        .eq(
          "restaurant_id",
          restaurantId
        );


    if(result.error){
      throw result.error;
    }


    tripRestaurants =
      tripRestaurants.filter(
        x =>
          Number(x.restaurant_id)
          !==
          Number(restaurantId)
      );


    render();

  }

  catch(error){

    console.error(error);

    alert(
      error.message ||
      "Couldn't remove restaurant."
    );

  }

}

/* =========================================================
   ADD FORM
========================================================= */

const addForm =
  document.getElementById(
    "addForm"
  );

const formMessage =
  document.getElementById(
    "formMessage"
  );


function showFormMessage(
  message,
  type
){

  formMessage.textContent =
    message;

  formMessage.className =
    `form-message ${type}`;

}


addForm.addEventListener(
  "submit",
  async event => {

    event.preventDefault();


    if(!currentUser){

      window.location.href =
        "login.html";

      return;

    }


    const saveBtn =
      document.getElementById(
        "saveBtn"
      );


    saveBtn.disabled =
      true;

    saveBtn.textContent =
      "SAVING…";


    formMessage.className =
      "form-message";


    try{

      const name =
        document.getElementById(
          "newName"
        ).value.trim();

      const japanese =
        document.getElementById(
          "newJapanese"
        ).value.trim();

      const city =
        document.getElementById(
          "newCity"
        ).value.trim();

      const area =
        document.getElementById(
          "newArea"
        ).value.trim();

      const location =
        document.getElementById(
          "newLocation"
        ).value.trim();

      const cuisine =
        document.getElementById(
          "newCuisine"
        ).value.trim();

      const ratingText =
        document.getElementById(
          "newRating"
        ).value.trim();

      const price =
        document.getElementById(
          "newPrice"
        ).value.trim();

      const tabelog =
        document.getElementById(
          "newTabelog"
        ).value.trim();

      const maps =
        document.getElementById(
          "newMaps"
        ).value.trim();

      const website =
        document.getElementById(
          "newWebsite"
        ).value.trim();

      const description =
        document.getElementById(
          "newDescription"
        ).value.trim();

      const addTrip =
        document.getElementById(
          "newAddTrip"
        ).checked;

      const pick =
        document.getElementById(
          "newPick"
        ).checked;

      const flexible =
        document.getElementById(
          "newFlexible"
        ).checked;


      /* DUPLICATE CHECK */

      const duplicate =
        restaurants.find(
          r =>
            norm(r.name)
            ===
            norm(name)
            &&
            norm(rCity(r))
            ===
            norm(city)
        );


      if(duplicate){

        throw new Error(
          "This restaurant already appears to be in the master list. Find it in Discover and tap + My Food instead."
        );

      }


      /* RATING */

      let rating = null;


      if(ratingText){

        rating =
          Number(ratingText);


        if(
          Number.isNaN(rating)
        ){

          throw new Error(
            "Tabelog rating must be a number."
          );

        }

      }


      /* MASTER RECORD */

      const restaurantResult =
        await db
          .from(
            "restaurants"
          )
          .insert({

            name:name,

            name_japanese:
              japanese || null,

            cuisine:
              cuisine || null,

            country:
              "Japan",

            city:city,

            area:
              area || null,

            location:
              location || null,

            description:
              description || null,

            price:
              price || null,

            tabelog_url:
              tabelog || null,

            maps_url:
              maps || null,

            website_url:
              website || null,

            rating:rating,

            status:
              "active",

            created_by:
              currentUser.id,

            verified:
              false

          })
          .select()
          .single();


      if(
        restaurantResult.error
      ){
        throw restaurantResult.error;
      }


      const newRestaurant =
        restaurantResult.data;


      /* ADD TO MY FOOD */

      if(addTrip){

        const relationResult =
          await db
            .from(
              "trip_restaurants"
            )
            .insert({

              trip_id:
                TRIP_ID,

              restaurant_id:
                newRestaurant.id,

              is_pick:
                pick,

              is_flexible:
                flexible

            })
            .select()
            .single();


        if(
          relationResult.error
        ){
          throw relationResult.error;
        }


        tripRestaurants.push(
          relationResult.data
        );

      }


      restaurants.push(
        newRestaurant
      );


      restaurants.sort(
        (a,b) =>
          text(a.name)
            .localeCompare(
              text(b.name)
            )
      );


      showFormMessage(
        addTrip
        ?
        "Added to the master list and My Food."
        :
        "Added to the master restaurant list.",
        "success"
      );


      addForm.reset();


      document.getElementById(
        "newAddTrip"
      ).checked =
        true;


      createCityChips();

      createDiscoverChips();

      render();


      setTimeout(
        closeAddSheet,
        850
      );

    }

    catch(error){

      console.error(error);


      showFormMessage(
        error.message ||
        "Couldn't save restaurant.",
        "error"
      );

    }

    finally{

      saveBtn.disabled =
        false;

      saveBtn.textContent =
        "SAVE RESTAURANT";

    }

  }
);
