<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f2747">
<title>Kyoto Food Finder</title>
<style>

:root{
  --bg:#070c10;
  --panel:#10161c;
  --panel-light:#151c23;
  --panel-active:#172027;
  --line:#29323b;
  --line-soft:rgba(255,255,255,.07);
  --text:#f5f5f3;
  --muted:#aeb5bc;
  --muted-blue:#91a5b3;
  --red:#c96f68;
  --blue:#5c9dff;
  --green:#67c587;
  --orange:#f4a34d;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  background:radial-gradient(circle at 50% -20%,#17202a 0%,transparent 38%),var(--bg);
  color:var(--text);
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  line-height:1.5;
}
header{
  position:sticky;top:0;z-index:20;
  background:rgba(7,12,16,.92);
  border-bottom:1px solid var(--line);
  padding:14px 14px 13px;
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
  box-shadow:0 10px 30px rgba(0,0,0,.20);
}
header h1{
  max-width:760px;margin:0 auto 10px;
  color:#fff;
  font-family:Georgia,"Times New Roman",serif;
  font-size:25px;letter-spacing:-.025em;
}
.search{
  display:block;max-width:760px;width:100%;margin:auto;
  border:1px solid var(--line);border-radius:14px;
  padding:12px 14px;font-size:16px;outline:none;
  background:#10161c;color:#fff;
}
.search::placeholder{color:#77838d}
.search:focus{border-color:#536673;box-shadow:0 0 0 3px rgba(92,157,255,.10)}
main{max-width:760px;margin:auto;padding:16px 12px 96px}
.mode{
  display:grid;grid-template-columns:1fr 1fr;gap:9px;
  padding:7px;background:#10171d;border:1px solid #26333d;border-radius:17px;margin-bottom:17px
}
.mode button,.chip{
  appearance:none;border:1px solid #26333d;background:#121a20;
  border-radius:13px;padding:11px 13px;font-size:14px;font-weight:700;color:#dce2e6;
  cursor:pointer;transition:.2s ease;
}
.mode button.active,.chip.active{
  background:var(--panel-active);color:#fff;border-color:var(--red);
  box-shadow:inset 0 0 0 1px rgba(201,111,104,.06)
}
.chips{display:flex;flex-wrap:wrap;gap:8px;overflow:visible;padding:2px 0 14px}

.chip{border-radius:999px;white-space:nowrap;padding:9px 13px}
.section-title{
  font-size:11px;color:var(--red);font-weight:800;text-transform:uppercase;
  letter-spacing:.12em;margin:4px 2px 9px
}
.count{font-size:12px;color:var(--muted);margin:0 2px 11px}
.card{
  background:linear-gradient(145deg,#151c22,#0f151a);
  border:1px solid var(--line);border-radius:20px;padding:15px;margin:0 0 11px;
  box-shadow:0 12px 30px rgba(0,0,0,.16);
}
.top{display:flex;align-items:flex-start;gap:12px}
.rank{
  min-width:48px;height:48px;border-radius:14px;
  background:rgba(92,157,255,.14);display:flex;align-items:center;justify-content:center;
  font-weight:800;color:var(--blue);font-size:14px;border:1px solid rgba(92,157,255,.10)
}
.rank.star{background:rgba(201,111,104,.13);color:var(--red);border-color:rgba(201,111,104,.11)}
.info{flex:1;min-width:0}
.name{font-weight:750;font-size:17px;line-height:1.3;color:#fff}
.meta{color:var(--muted-blue);font-size:12px;margin-top:5px;line-height:1.5}
.why{font-size:14px;margin-top:9px;line-height:1.5;color:#e4e7e9}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.badge{
  font-size:11px;padding:4px 8px;border-radius:999px;
  background:rgba(255,255,255,.06);color:#cbd2d7;border:1px solid rgba(255,255,255,.07)
}
.actions{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:12px}
.map{
  display:block;text-align:center;background:rgba(201,111,104,.10);color:var(--red);
  border:1px solid rgba(201,111,104,.28);text-decoration:none;border-radius:11px;
  padding:9px 12px;font-weight:800;font-size:13px
}
.details{
  border:1px solid var(--line);background:#121a20;border-radius:11px;padding:8px 12px;
  font-weight:700;color:#c6ced4
}
.extra{
  display:none;margin-top:10px;padding-top:10px;border-top:1px solid var(--line-soft);
  font-size:12px;color:var(--muted);line-height:1.6
}
.empty{text-align:center;color:var(--muted);padding:50px 20px}
.bottom{
  position:fixed;bottom:0;left:0;right:0;z-index:25;
  background:rgba(15,20,26,.94);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border-top:1px solid var(--line);
  padding:8px 12px calc(8px + env(safe-area-inset-bottom))
}
.bottom-inner{max-width:760px;margin:auto;display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.bottom button{
  border:1px solid #26333d;border-radius:12px;padding:10px 7px;
  background:#121a20;font-weight:750;color:#cbd2d7
}
.bottom button.active{background:rgba(201,111,104,.08);color:var(--red);border-color:var(--red)}
@media(min-width:650px){
  header{padding-top:18px}
  header h1{font-size:30px}
  .card{padding:18px}
}

</style>
</head>

const areaOptions=["Arashiyama", "Downtown", "Fushimi", "Higashiyama", "Kyoto Station", "North Kyoto", "Okazaki", "Other Kyoto"];
const foodOptions=["Sushi / Omakase", "Ramen / Tsukemen", "Yakitori / Chicken", "Udon / Soba", "Oyakodon", "Tonkatsu", "Unagi", "Kaisendon", "Tempura", "Curry", "Izakaya", "Washoku", "Seafood", "Gyoza", "Bakery / Pâtisserie"];
let mode="area",selected="All",tag="all";
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]));
function setMode(m){mode=m;selected="All";$("#areaMode").classList.toggle("active",m==="area");$("#foodMode").classList.toggle("active",m==="food");$("#filterTitle").textContent=m==="area"?"Broad Area":"Food Type";renderChips();render();}
function renderChips(){const opts=["All",...(mode==="area"?areaOptions:foodOptions)];$("#chips").innerHTML=opts.map(o=>`<button class="chip ${o===selected?"active":""}" data-v="${esc(o)}">${esc(o)}</button>`).join("");document.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{selected=b.dataset.v;renderChips();render();});}
function tagOK(r){if(tag==="star")return(r.Tag||"").includes("⭐");if(tag==="moon")return(r.Tag||"").includes("🌙");return true;}
function render(){const q=$("#search").value.trim().toLowerCase();let rows=restaurants.filter(r=>{const ok=selected==="All"||(mode==="area"?r["Broad Area"]===selected:r["Food Type"]===selected);const qok=!q||Object.values(r).join(" ").toLowerCase().includes(q);return ok&&qok&&tagOK(r);});
rows.sort((a,b)=>{if(mode==="food"&&selected!=="All")return(a["Food Rank"]||999)-(b["Food Rank"]||999);if(mode==="area"&&selected!=="All")return a.Location.localeCompare(b.Location)||a["Food Type"].localeCompare(b["Food Type"])||(a["Food Rank"]||999)-(b["Food Rank"]||999);return a["Food Type"].localeCompare(b["Food Type"])||(a["Food Rank"]||999)-(b["Food Rank"]||999);});
$("#count").textContent=`${rows.length} restaurant${rows.length===1?"":"s"}`;if(!rows.length){$("#list").innerHTML='<div class="empty">No matches.</div>';return}
$("#list").innerHTML=rows.map((r,i)=>{const rank=r["Food Rank"]?`#${r["Food Rank"]}`:"—";const isStar=(r.Tag||"").includes("⭐");const qmap=encodeURIComponent(`${r.Restaurant} Kyoto Japan`);const recog=r.Recognition?`<span class="badge">${esc(r.Recognition)}</span>`:"";const tagBadge=r.Tag?`<span class="badge">${esc(r.Tag)}</span>`:"";
return `<article class="card"><div class="top"><div class="rank ${isStar?"star":""}">${rank}</div><div class="info"><div class="name">${esc(r.Restaurant)}</div><div class="meta">${esc(r["Food Type"])} · ${esc(r["Broad Area"])} · ${esc(r.Location)} · ${esc(r["¥ / pp"])}</div><div class="why">${esc(r["Why go"])}</div><div class="badges">${tagBadge}${recog}</div></div></div><div class="actions"><a class="map" href="https://www.google.com/maps/search/?api=1&query=${qmap}" target="_blank">📍 Open in Maps</a><button class="details" onclick="toggleExtra(${i})">Info</button></div><div class="extra" id="x${i}"><b>Food rank:</b> ${rank} within ${esc(r["Food Type"])}<br><b>Broad area:</b> ${esc(r["Broad Area"])}<br><b>Specific location:</b> ${esc(r.Location)}</div></article>`;}).join("");}
window.toggleExtra=i=>{const el=$("#x"+i);el.style.display=el.style.display==="block"?"none":"block";};
$("#search").addEventListener("input",render);$("#areaMode").onclick=()=>setMode("area");$("#foodMode").onclick=()=>setMode("food");
function setTag(t){tag=t;$("#allBtn").classList.toggle("active",t==="all");$("#starBtn").classList.toggle("active",t==="star");$("#moonBtn").classList.toggle("active",t==="moon");render();}
$("#allBtn").onclick=()=>setTag("all");$("#starBtn").onclick=()=>setTag("star");$("#moonBtn").onclick=()=>setTag("moon");renderChips();render();
</script></body></html>
