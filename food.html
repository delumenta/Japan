<style>
/* =========================================================
   FOOD — TRAVEL APP UI
========================================================= */

:root{
  --bg:#070c10;
  --surface:#0d1318;
  --surface-2:#11181e;
  --surface-3:#151d24;

  --line:#263039;
  --line-soft:rgba(255,255,255,.065);

  --text:#f5f3ef;
  --muted:#929ca4;
  --muted-2:#66727b;

  --red:#ff625f;
  --red-soft:rgba(255,98,95,.09);
  --red-line:rgba(255,98,95,.30);

  --gold:#e4bd69;
  --green:#79c995;
  --blue:#78a9ef;

  --radius:14px;
}


/* =========================================================
   RESET
========================================================= */

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  min-height:100vh;

  background:
    radial-gradient(
      circle at 50% -8%,
      rgba(42,56,68,.30),
      transparent 28%
    ),
    var(--bg);

  color:var(--text);

  font-family:
    Inter,
    ui-sans-serif,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

  -webkit-font-smoothing:antialiased;
}

button,
input,
textarea{
  font:inherit;
}

button{
  -webkit-tap-highlight-color:transparent;
}


/* =========================================================
   HEADER
========================================================= */

header{
  position:relative;
  z-index:40;

  border-bottom:1px solid var(--line-soft);

  background:
    linear-gradient(
      180deg,
      rgba(12,18,23,.99),
      rgba(7,12,16,.98)
    );
}

.header-inner{
  width:100%;
  max-width:760px;

  margin:0 auto;

  padding:
    calc(14px + env(safe-area-inset-top))
    14px
    0;
}


/* =========================================================
   TITLE
========================================================= */

.title-row{
  display:flex;
  align-items:center;
  justify-content:space-between;

  gap:14px;
}

.title-row > div:first-child{
  min-width:0;
}

.eyebrow{
  margin-bottom:2px;

  color:var(--red);

  font-size:7px;
  font-weight:900;

  letter-spacing:.17em;
  text-transform:uppercase;
}

.food-page-title{
  display:flex;
  align-items:center;

  gap:9px;

  margin:0;
}

.food-page-title-icon{
  width:44px;
  height:44px;

  flex:0 0 44px;

  display:block;

  object-fit:contain;
}

.food-page-title span{
  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-size:27px;
  font-weight:700;
  line-height:1;
}

.trip-name{
  margin:
    3px
    0
    0
    53px;

  overflow:hidden;

  color:var(--muted);

  font-size:8px;
  font-weight:600;

  text-overflow:ellipsis;
  white-space:nowrap;
}


/* =========================================================
   ADD BUTTON
========================================================= */

.add-btn{
  flex:0 0 auto;

  min-height:36px;

  padding:7px 11px;

  border:1px solid var(--red-line);
  border-radius:10px;

  background:var(--red-soft);

  color:#f3b7b3;

  font-size:8px;
  font-weight:900;

  letter-spacing:.04em;

  cursor:pointer;

  transition:
    border-color .2s ease,
    background .2s ease,
    transform .15s ease;
}

.add-btn:active{
  transform:scale(.95);
}


/* =========================================================
   MY FOOD / DISCOVER
========================================================= */

.main-tabs{
  position:relative;

  display:grid;
  grid-template-columns:1fr 1fr;

  gap:0;

  margin-top:15px;

  border-bottom:1px solid var(--line);
}

.main-tab{
  position:relative;

  min-height:40px;

  padding:7px 5px;

  border:0;

  background:transparent;

  color:#737f87;

  font-size:8px;
  font-weight:900;

  letter-spacing:.05em;

  cursor:pointer;
}

.main-tab::after{
  content:"";

  position:absolute;

  left:20%;
  right:20%;
  bottom:-1px;

  height:2px;

  border-radius:999px;

  background:transparent;
}

.main-tab.active{
  color:#fff;
}

.main-tab.active::after{
  background:var(--red);

  box-shadow:
    0 0 8px rgba(255,98,95,.28);
}


/* =========================================================
   UNIFIED FILTER PANEL
========================================================= */

.unified-filter-panel{
  position:sticky;
  top:0;
  z-index:75;

  margin:
    0
    -14px;

  padding:
    8px
    14px
    9px;

  border-bottom:1px solid var(--line-soft);

  background:rgba(7,12,16,.96);

  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
}


/* =========================================================
   HORIZONTAL CHIPS
========================================================= */

.chips{
  display:flex;
  align-items:center;

  gap:5px;

  width:100%;

  margin:0 0 6px;

  padding:0 0 1px;

  overflow-x:auto;

  scrollbar-width:none;

  -webkit-overflow-scrolling:touch;
}

.chips::-webkit-scrollbar{
  display:none;
}

.chip{
  flex:0 0 auto;

  min-height:27px;

  padding:4px 9px;

  border:1px solid var(--line);
  border-radius:999px;

  background:rgba(17,24,30,.80);

  color:#8d979e;

  font-size:7px;
  font-weight:850;

  white-space:nowrap;

  cursor:pointer;

  transition:
    color .18s ease,
    border-color .18s ease,
    background .18s ease;
}

.chip.active{
  border-color:var(--red-line);

  background:var(--red-soft);

  color:#f0c0bc;
}


/* =========================================================
   FILTER CONTROLS
========================================================= */

.sticky-filter-bar{
  display:grid;

  grid-template-columns:
    minmax(0,1fr)
    minmax(0,1fr)
    minmax(130px,1.2fr)
    auto;

  align-items:center;

  gap:5px;

  width:100%;

  margin-top:2px;

  padding:0;

  border:0;

  background:transparent;
}

.filter-select-wrap{
  position:relative;

  min-width:0;
}

.filter-select-btn{
  width:100%;
  min-height:34px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  gap:5px;

  padding:6px 8px;

  overflow:hidden;

  border:1px solid var(--line);
  border-radius:9px;

  background:#0f161c;

  color:#aeb6bc;

  font-size:7px;
  font-weight:850;

  cursor:pointer;
}

.filter-select-btn > span:first-child{
  overflow:hidden;

  text-overflow:ellipsis;
  white-space:nowrap;
}

.filter-select-btn.active{
  border-color:var(--red-line);

  background:var(--red-soft);

  color:#f0c2bf;
}

.filter-chevron{
  flex:0 0 auto;

  color:#65717a;

  font-size:9px;
}


/* =========================================================
   FILTER DROPDOWN
========================================================= */

.filter-menu{
  position:absolute;

  top:calc(100% + 6px);
  left:0;

  z-index:130;

  width:max(100%,180px);
  max-height:290px;

  padding:5px;

  overflow-y:auto;

  border:1px solid var(--line);
  border-radius:11px;

  background:#0d1419;

  box-shadow:
    0 16px 40px rgba(0,0,0,.52);
}

.filter-menu[hidden]{
  display:none;
}

.filter-menu-item{
  width:100%;
  min-height:34px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  gap:8px;

  padding:6px 8px;

  border:0;
  border-radius:7px;

  background:transparent;

  color:#a6b0b7;

  font-size:8px;
  font-weight:800;

  text-align:left;

  cursor:pointer;
}

.filter-menu-item.active,
.filter-menu-item:hover{
  background:var(--red-soft);

  color:#fff;
}

.filter-menu-count{
  color:#626f77;

  font-size:6px;
}


/* =========================================================
   QUICK SEARCH
========================================================= */

.quick-filter-wrap{
  min-width:0;
  min-height:34px;

  display:flex;
  align-items:center;

  gap:6px;

  padding:0 9px;

  border:1px solid var(--line);
  border-radius:9px;

  background:#0f161c;
}

.quick-filter-wrap:focus-within{
  border-color:var(--red-line);

  background:
    rgba(255,98,95,.035);
}

.quick-filter-icon{
  flex:0 0 auto;

  opacity:.65;

  font-size:9px;
}

.quick-filter-input{
  width:100%;
  min-width:0;

  padding:0;

  border:0;
  outline:0;

  background:transparent;

  color:#e7e9e9;

  font-size:8px;
}

.quick-filter-input::placeholder{
  color:#626d75;
}


/* =========================================================
   CLEAR FILTER
========================================================= */

.clear-compact-filter{
  min-height:34px;

  padding:6px 9px;

  border:1px solid var(--line);
  border-radius:9px;

  background:#0f161c;

  color:#606c74;

  font-size:7px;
  font-weight:900;

  cursor:pointer;
}

.clear-compact-filter.active{
  border-color:rgba(255,98,95,.22);

  color:#d9948f;
}


/* =========================================================
   OLD / UNUSED FILTERS
========================================================= */

.food-side-filter,
#foodSideFilter,
.discover-area-row,
#discoverAreaRow,
#discoverControls,
.discover-controls,
#browseChips,
#discoverModeRow,
.discover-mode,
.discover-modes,
.mode-tabs{
  display:none !important;
}


/* =========================================================
   MAIN
========================================================= */

main{
  width:100%;
  max-width:760px;

  margin:0 auto;

  padding:
    14px
    14px
    100px;
}


/* =========================================================
   RESULTS HEADER
========================================================= */

.result-head{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;

  gap:10px;

  margin:
    2px
    1px
    11px;
}

.result-title{
  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-size:19px;
  font-weight:700;
}

.result-count{
  padding-bottom:2px;

  color:#69757d;

  font-size:7px;
  font-weight:750;
}


/* =========================================================
   FOOD SECTIONS
========================================================= */

.food-section{
  margin-bottom:20px;
}

.section-title{
  display:flex;
  align-items:center;

  gap:7px;

  margin:
    2px
    1px
    8px;

  padding-bottom:6px;

  border-bottom:1px solid var(--line-soft);

  color:#bfc5c9;

  font-size:8px;
  font-weight:900;

  letter-spacing:.07em;
}

.section-title span:last-child{
  margin-left:auto;

  color:#626e76;

  font-size:7px;
}


/* =========================================================
   RESTAURANT CARD
========================================================= */

.restaurant-card{
  position:relative;

  margin-bottom:8px;

  padding:
    11px
    11px
    9px;

  overflow:hidden;

  border:1px solid #252f37;
  border-radius:14px;

  background:
    linear-gradient(
      145deg,
      rgba(20,28,34,.97),
      rgba(12,18,23,.98)
    );

  box-shadow:
    0 6px 18px rgba(0,0,0,.13);

  transition:
    border-color .18s ease,
    transform .18s ease;
}

.restaurant-card::before{
  content:"";

  position:absolute;

  top:0;
  left:13px;
  right:13px;

  height:1px;

  background:
    linear-gradient(
      90deg,
      transparent,
      rgba(255,255,255,.07),
      transparent
    );
}


/* =========================================================
   CARD TOP
========================================================= */

.card-top{
  display:flex;
  align-items:flex-start;

  gap:9px;
}

.food-icon{
  width:34px;
  height:34px;

  flex:0 0 34px;

  display:flex;
  align-items:center;
  justify-content:center;

  border:1px solid rgba(255,98,95,.16);
  border-radius:10px;

  background:
    rgba(255,98,95,.055);

  font-size:16px;
}

.card-main{
  flex:1;

  min-width:0;
}

.restaurant-name{
  margin:0;

  color:#f8f7f4;

  font-size:12px;
  font-weight:850;

  line-height:1.25;
}

.japanese{
  margin-top:2px;

  color:#737f87;

  font-size:7.5px;
}

.location{
  margin-top:4px;

  color:#919ba2;

  font-size:7.5px;

  line-height:1.35;
}


/* =========================================================
   BADGES
========================================================= */

.badges{
  display:flex;
  flex-wrap:wrap;

  gap:4px;

  margin-top:7px;
}

.badge{
  padding:2px 5px;

  border:1px solid rgba(255,255,255,.07);
  border-radius:999px;

  background:rgba(255,255,255,.025);

  color:#9ea8ae;

  font-size:6.5px;
  font-weight:800;
}

.badge.pick{
  border-color:rgba(228,189,105,.22);

  background:rgba(228,189,105,.055);

  color:#e4bd69;
}

.badge.flex{
  border-color:rgba(120,169,239,.20);

  background:rgba(120,169,239,.055);

  color:#a7c7f3;
}

.badge.top{
  border-color:rgba(228,189,105,.22);

  background:rgba(228,189,105,.055);

  color:#e4bd69;
}

.badge.hot{
  border-color:rgba(238,145,87,.22);

  background:rgba(238,145,87,.055);

  color:#efa875;
}

.badge.scheduled{
  border-color:rgba(121,201,149,.20);

  background:rgba(121,201,149,.055);

  color:#9edab3;
}

.badge.eaten{
  border-color:rgba(121,201,149,.22);

  background:rgba(121,201,149,.07);

  color:#a6dbb8;
}

.restaurant-card.eaten-card{
  opacity:.62;
}


/* =========================================================
   RATING / PRICE
========================================================= */

.meta{
  display:flex;
  flex-wrap:wrap;

  gap:5px;

  margin-top:8px;
}

.meta-item{
  padding:3px 6px;

  border:0;
  border-radius:6px;

  background:rgba(255,255,255,.035);

  color:#b4bcc1;

  font-size:7px;
  font-weight:750;
}


/* =========================================================
   SCHEDULE
========================================================= */

.plan-box{
  margin-top:8px;

  padding:6px 8px;

  border-left:2px solid rgba(121,201,149,.55);

  border-radius:2px 7px 7px 2px;

  background:rgba(121,201,149,.045);

  color:#9fd3b0;

  font-size:7px;
  font-weight:800;
}


/* =========================================================
   DESCRIPTION
========================================================= */

.description{
  margin-top:8px;

  color:#8f999f;

  font-size:7.5px;
  line-height:1.5;
}


/* =========================================================
   ACTIONS
========================================================= */

.actions{
  display:flex;
  align-items:center;
  flex-wrap:wrap;

  gap:4px;

  margin-top:9px;

  padding-top:8px;

  border-top:1px solid var(--line-soft);
}

.action-btn{
  min-height:26px;

  display:inline-flex;
  align-items:center;
  justify-content:center;

  padding:4px 7px;

  border:1px solid rgba(255,98,95,.17);
  border-radius:7px;

  background:rgba(255,98,95,.035);

  color:#df8b86;

  text-decoration:none;

  font-size:6.5px;
  font-weight:900;

  cursor:pointer;
}

.action-btn.gold{
  border-color:rgba(228,189,105,.18);

  background:rgba(228,189,105,.035);

  color:#d9b86d;
}

.action-btn.green{
  border-color:rgba(121,201,149,.18);

  background:rgba(121,201,149,.035);

  color:#8fd0a6;
}

.action-btn.blue{
  border-color:rgba(120,169,239,.18);

  background:rgba(120,169,239,.035);

  color:#91b9ef;
}

.action-btn.muted{
  border-color:rgba(255,255,255,.07);

  background:rgba(255,255,255,.025);

  color:#79858c;
}


/* =========================================================
   EMPTY / LOADING STATE
========================================================= */

.state{
  padding:
    36px
    18px;

  border:1px dashed #303b43;
  border-radius:14px;

  background:rgba(255,255,255,.012);

  color:#77838b;

  font-size:8px;
  line-height:1.6;

  text-align:center;
}

.state strong{
  display:block;

  margin-bottom:5px;

  color:#e8e7e3;

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-size:14px;
  font-weight:700;
}


/* =========================================================
   ADD RESTAURANT SHEET
========================================================= */

.sheet-backdrop,
.more-backdrop{
  position:fixed;

  inset:0;

  z-index:150;

  display:none;
  align-items:flex-end;

  background:rgba(0,0,0,.72);

  backdrop-filter:blur(5px);
  -webkit-backdrop-filter:blur(5px);
}

.sheet-backdrop.open,
.more-backdrop.open{
  display:flex;
}

.sheet,
.more-sheet{
  width:100%;
  max-width:620px;

  max-height:
    calc(92vh - env(safe-area-inset-top));

  margin:0 auto;

  padding:
    8px
    14px
    calc(18px + env(safe-area-inset-bottom));

  overflow-y:auto;

  border:1px solid var(--line);
  border-radius:20px 20px 0 0;

  background:#0c1217;

  box-shadow:
    0 -20px 50px rgba(0,0,0,.35);
}

.sheet-handle{
  width:36px;
  height:4px;

  margin:
    2px
    auto
    13px;

  border-radius:999px;

  background:#35414a;
}

.sheet-head,
.more-head{
  display:flex;
  align-items:center;
  justify-content:space-between;

  gap:10px;

  margin-bottom:14px;
}

.sheet-title,
.more-title{
  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-size:19px;
}

.close-btn,
.more-close{
  width:34px;
  height:34px;

  border:1px solid var(--line);
  border-radius:9px;

  background:#131b21;

  color:#fff;

  cursor:pointer;
}


/* =========================================================
   GOOGLE PLACE AUTOFILL
========================================================= */

.google-place-box{
  grid-column:1/-1;

  margin-bottom:3px;

  padding:10px;

  border:1px solid rgba(120,169,239,.18);
  border-radius:11px;

  background:rgba(120,169,239,.035);
}

.google-place-label{
  margin-bottom:7px;

  color:#8fa0ad;

  font-size:7px;
  font-weight:900;

  letter-spacing:.04em;
}

#googlePlaceSearch{
  width:100%;
}

#googlePlaceSearch gmp-place-autocomplete,
gmp-place-autocomplete{
  width:100%;

  min-height:42px;
}

.place-status{
  margin-top:6px;

  color:#6f7d86;

  font-size:7px;
  line-height:1.4;
}

.place-status.success{
  color:#96d4ab;
}

.place-status.error{
  color:#f2a4a0;
}


/* =========================================================
   FORM
========================================================= */

.form-grid{
  display:grid;
  grid-template-columns:1fr 1fr;

  gap:9px;
}

.field.full{
  grid-column:1/-1;
}

.field label{
  display:block;

  margin-bottom:4px;

  color:#8d989f;

  font-size:6.5px;
  font-weight:900;

  letter-spacing:.04em;
}

.field input,
.field textarea{
  width:100%;

  min-height:40px;

  padding:8px 9px;

  border:1px solid var(--line);
  border-radius:9px;

  outline:0;

  background:#0f161c;

  color:#fff;

  font-size:9px;
}

.field textarea{
  min-height:76px;

  resize:vertical;
}

.field input:focus,
.field textarea:focus{
  border-color:var(--red-line);
}

.checks{
  display:grid;
  grid-template-columns:repeat(3,1fr);

  gap:5px;

  margin-top:10px;
}

.check{
  min-height:39px;

  display:flex;
  align-items:center;

  gap:6px;

  padding:6px 8px;

  border:1px solid var(--line);
  border-radius:9px;

  background:#10171d;

  color:#aab3b9;

  font-size:7px;
  font-weight:800;
}

.check input{
  width:14px;
  height:14px;

  accent-color:var(--red);
}

.save-btn{
  width:100%;

  min-height:43px;

  margin-top:11px;

  border:1px solid var(--red-line);
  border-radius:10px;

  background:var(--red-soft);

  color:#f2b5b1;

  font-size:8px;
  font-weight:900;

  letter-spacing:.05em;

  cursor:pointer;
}

.save-btn:disabled{
  opacity:.45;
}

.form-message{
  display:none;

  margin-top:8px;

  padding:8px;

  border-radius:8px;

  font-size:8px;
}

.form-message.error{
  display:block;

  border:1px solid rgba(255,98,95,.20);

  background:rgba(255,98,95,.055);

  color:#f3aaa6;
}

.form-message.success{
  display:block;

  border:1px solid rgba(121,201,149,.20);

  background:rgba(121,201,149,.055);

  color:#9dd8b2;
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:650px){

  .header-inner{
    padding-left:12px;
    padding-right:12px;
  }

  .unified-filter-panel{
    margin-left:-12px;
    margin-right:-12px;

    padding-left:12px;
    padding-right:12px;
  }

  main{
    padding-left:12px;
    padding-right:12px;
  }

  .sticky-filter-bar{
    grid-template-columns:
      minmax(0,1fr)
      minmax(0,1fr)
      34px;
  }

  .quick-filter-wrap{
    grid-column:1 / -1;
    grid-row:2;

    min-height:32px;
  }

  .clear-compact-filter{
