<!doctype html>
<html lang="en">

<head>
<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1, viewport-fit=cover"
>

<meta name="theme-color" content="#070c10">

<title>Food Finder · Japan Trip</title>

<style>

/* =========================================================
   COLORS
========================================================= */

:root{
  --bg:#070c10;
  --panel:#10161c;
  --panel-light:#151c23;
  --line:#29323b;
  --line-soft:rgba(255,255,255,.07);

  --text:#f5f5f3;
  --muted:#aeb5bc;

  --red:#c96f68;
  --blue:#5c9dff;
  --green:#67c587;
  --orange:#f4a34d;
  --gold:#e3b85c;
  --purple:#ad8cff;
}


/* =========================================================
   GLOBAL
========================================================= */

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;

  background:
    radial-gradient(
      circle at 50% -20%,
      #17202a 0%,
      transparent 38%
    ),
    var(--bg);

  color:var(--text);

  font-family:
    Inter,
    ui-sans-serif,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

  line-height:1.5;
}

button,
input,
select,
textarea{
  font:inherit;
}


/* =========================================================
   HEADER
========================================================= */

header{
  position:sticky;

  top:0;

  z-index:40;

  padding:
    calc(8px + env(safe-area-inset-top))
    12px
    8px;

  border-bottom:
    1px solid var(--line);

  background:
    rgba(7,12,16,.97);

  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
}

.header-inner{
  max-width:760px;
  margin:auto;
}


/* =========================================================
   TITLE
========================================================= */

.title-row{
  display:flex;

  align-items:center;
  justify-content:space-between;

  gap:10px;

  margin-bottom:8px;
}

.header-title{
  min-width:0;
}

.eyebrow{
  color:var(--red);

  font-size:8px;
  font-weight:900;

  letter-spacing:.14em;
}

.header-title h1{
  margin:2px 0 0;

  color:#fff;

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-size:22px;
  line-height:1.15;

  letter-spacing:-.025em;
}

.trip-name{
  margin-top:2px;

  color:var(--muted);

  font-size:8px;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}


/* =========================================================
   ADD BUTTON
========================================================= */

.add-button{
  flex:0 0 auto;

  min-height:36px;

  padding:
    6px
    10px;

  border:
    1px solid
    rgba(201,111,104,.35);

  border-radius:10px;

  background:
    rgba(201,111,104,.11);

  color:#f6dcda;

  font-size:9px;
  font-weight:900;

  cursor:pointer;
}


/* =========================================================
   SEARCH
========================================================= */

.search-box{
  width:100%;

  min-height:40px;

  padding:
    8px
    11px;

  border:
    1px solid var(--line);

  border-radius:11px;

  outline:none;

  background:#10171d;
  color:#fff;

  font-size:11px;
}

.search-box::placeholder{
  color:#77828b;
}

.search-box:focus{
  border-color:var(--red);
}


/* =========================================================
   CITY CHIPS
========================================================= */

.city-chips{
  display:flex;

  gap:5px;

  overflow-x:auto;

  margin-top:7px;

  padding:
    1px
    1px
    3px;

  scrollbar-width:none;
}

.city-chips::-webkit-scrollbar{
  display:none;
}

.city-chip{
  flex:0 0 auto;

  min-height:29px;

  padding:
    4px
    9px;

  border:
    1px solid var(--line);

  border-radius:999px;

  background:#10171d;

  color:#bec6cc;

  font-size:8px;
  font-weight:800;

  cursor:pointer;

  white-space:nowrap;
}

.city-chip.active{
  color:#fff;

  border-color:var(--red);

  background:
    rgba(201,111,104,.12);
}


/* =========================================================
   MODE SWITCH
========================================================= */

.mode-switch{
  display:grid;

  grid-template-columns:
    1fr
    1fr;

  gap:5px;

  margin-top:6px;
}

.mode-btn{
  min-height:32px;

  border:
    1px solid var(--line);

  border-radius:9px;

  background:#121a20;

  color:var(--muted);

  font-size:9px;
  font-weight:850;

  cursor:pointer;
}

.mode-btn.active{
  color:#fff;

  border-color:
    rgba(201,111,104,.55);

  background:
    rgba(201,111,104,.11);
}


/* =========================================================
   AREA / FOOD CHIPS
========================================================= */

.browse-chips{
  display:flex;

  gap:5px;

  overflow-x:auto;

  margin-top:6px;

  padding-bottom:2px;

  scrollbar-width:none;
}

.browse-chips::-webkit-scrollbar{
  display:none;
}

.browse-chip{
  flex:0 0 auto;

  min-height:27px;

  padding:
    4px
    8px;

  border:
    1px solid var(--line);

  border-radius:999px;

  background:#10171d;

  color:#b9c1c7;

  font-size:8px;
  font-weight:750;

  cursor:pointer;

  white-space:nowrap;
}

.browse-chip.active{
  color:#fff;

  border-color:var(--red);

  background:
    rgba(201,111,104,.12);
}


/* =========================================================
   MAIN
========================================================= */

main{
  max-width:760px;

  margin:auto;

  padding:
    12px
    12px
    150px;
}


/* =========================================================
   RESULTS HEADER
========================================================= */

.results-head{
  display:flex;

  align-items:flex-end;
  justify-content:space-between;

  gap:10px;

  margin:
    2px
    2px
    10px;
}

.results-head h2{
  margin:0;

  color:#fff;

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-size:19px;
}

.result-count{
  color:var(--muted);

  font-size:8px;

  white-space:nowrap;
}


/* =========================================================
   GROUP
========================================================= */

.food-group{
  margin-bottom:18px;
}

.food-group-title{
  display:flex;

  align-items:center;

  gap:6px;

  margin:
    4px
    2px
    7px;

  padding-bottom:6px;

  border-bottom:
    1px solid var(--line-soft);

  color:#fff;

  font-size:12px;
  font-weight:850;
}

.food-group-count{
  margin-left:auto;

  color:var(--muted);

  font-size:8px;
}


/* =========================================================
   RESTAURANT CARD
========================================================= */

.restaurant-card{
  margin-bottom:6px;

  padding:
    9px
    10px;

  border:
    1px solid var(--line);

  border-radius:12px;

  background:
    linear-gradient(
      145deg,
      #141c22,
      #0d1318
    );
}

.card-top{
  display:flex;

  align-items:flex-start;

  gap:8px;
}

.restaurant-icon{
  flex:0 0 auto;

  width:27px;
  height:27px;

  display:flex;

  align-items:center;
  justify-content:center;

  border:
    1px solid
    rgba(201,111,104,.18);

  border-radius:8px;

  background:
    rgba(201,111,104,.08);

  font-size:13px;
}

.restaurant-main{
  flex:1;
  min-width:0;
}

.restaurant-name{
  margin:0;

  color:#fff;

  font-size:13px;
  font-weight:850;

  line-height:1.2;
}

.japanese-name{
  margin-top:1px;

  color:#818d96;

  font-size:8px;
}

.restaurant-location{
  margin-top:2px;

  color:var(--muted);

  font-size:8px;
}


/* =========================================================
   BADGES
========================================================= */

.badges{
  display:flex;

  flex-wrap:wrap;

  gap:3px;

  margin-top:5px;
}

.badge{
  display:inline-flex;

  align-items:center;

  padding:
    2px
    5px;

  border:
    1px solid var(--line);

  border-radius:999px;

  background:
    rgba(255,255,255,.035);

  color:#cbd2d7;

  font-size:7px;
  font-weight:800;
}

.badge.cuisine{
  color:#fff;

  border-color:
    rgba(92,157,255,.18);

  background:
    rgba(92,157,255,.08);
}

.badge.pick{
  color:#f2cf72;

  border-color:
    rgba(227,184,92,.22);

  background:
    rgba(227,184,92,.08);
}

.badge.top{
  color:#e8c770;

  border-color:
    rgba(227,184,92,.22);

  background:
    rgba(227,184,92,.08);
}

.badge.hot{
  color:#ff9d74;

  border-color:
    rgba(244,163,77,.22);

  background:
    rgba(244,163,77,.08);
}

.badge.flexible{
  color:#aebdff;

  border-color:
    rgba(92,157,255,.20);

  background:
    rgba(92,157,255,.08);
}

.badge.trip{
  color:#cbbcff;

  border-color:
    rgba(173,140,255,.22);

  background:
    rgba(173,140,255,.08);
}

.badge.scheduled{
  color:#9fe1b5;

  border-color:
    rgba(103,197,135,.22);

  background:
    rgba(103,197,135,.08);
}


/* =========================================================
   SCORE
========================================================= */

.score-row{
  display:grid;

  grid-template-columns:
    1fr
    1fr;

  gap:5px;

  margin-top:6px;
}

.score-box{
  padding:
    5px
    7px;

  border:
    1px solid var(--line-soft);

  border-radius:8px;

  background:
    rgba(255,255,255,.025);
}

.score-label{
  color:#78848d;

  font-size:6px;
  font-weight:850;

  letter-spacing:.07em;
  text-transform:uppercase;
}

.score-value{
  margin-top:1px;

  color:#fff;

  font-size:9px;
  font-weight:800;
}


/* =========================================================
   DESCRIPTION
========================================================= */

.description{
  margin-top:6px;

  color:var(--muted);

  font-size:9px;
  line-height:1.35;
}


/* =========================================================
   ACTIONS
========================================================= */

.card-actions{
  display:flex;

  flex-wrap:wrap;

  gap:4px;

  margin-top:7px;
}

.card-btn{
  min-height:29px;

  display:inline-flex;

  align-items:center;
  justify-content:center;

  padding:
    4px
    8px;

  border:
    1px solid
    rgba(201,111,104,.25);

  border-radius:7px;

  background:
    rgba(201,111,104,.07);

  color:var(--red);

  text-decoration:none;

  font-size:8px;
  font-weight:850;

  cursor:pointer;
}

.card-btn.gold{
  color:var(--gold);

  border-color:
    rgba(227,184,92,.22);

  background:
    rgba(227,184,92,.06);
}

.card-btn.blue{
  color:var(--blue);

  border-color:
    rgba(92,157,255,.22);

  background:
    rgba(92,157,255,.06);
}

.card-btn.green{
  color:var(--green);

  border-color:
    rgba(103,197,135,.22);

  background:
    rgba(103,197,135,.06);
}


/* =========================================================
   LOADING / EMPTY
========================================================= */

.state-box{
  padding:
    28px
    16px;

  border:
    1px dashed #35414a;

  border-radius:14px;

  text-align:center;

  color:var(--muted);

  font-size:10px;
}

.state-box strong{
  display:block;

  margin-bottom:4px;

  color:#fff;

  font-size:12px;
}


/* =========================================================
   QUICK FILTER
========================================================= */

.quick-filter{
  position:fixed;

  left:0;
  right:0;

  bottom:
    calc(
      60px + env(safe-area-inset-bottom)
    );

  z-index:50;

  padding:
    4px
    6px;

  border-top:
    1px solid var(--line);

  background:
    rgba(7,12,16,.97);

  backdrop-filter:blur(18px);
}

.quick-filter-inner{
  max-width:760px;

  margin:auto;

  display:grid;

  grid-template-columns:
    repeat(4,1fr);

  gap:3px;
}

.quick-btn{
  min-height:29px;

  padding:2px;

  border:
    1px solid #26333d;

  border-radius:7px;

  background:#11181e;

  color:#aeb5bc;

  font-size:7px;
  font-weight:850;

  cursor:pointer;
}

.quick-btn.active{
  color:#fff;

  border-color:var(--red);

  background:
    rgba(201,111,104,.13);
}


/* =========================================================
   BOTTOM NAV
========================================================= */

.bottom-nav{
  position:fixed;

  left:0;
  right:0;
  bottom:0;

  z-index:80;

  display:grid;

  grid-template-columns:
    repeat(5,1fr);

  padding:
    7px
    8px
    calc(7px + env(safe-area-inset-bottom));

  border-top:
    1px solid var(--line);

  background:
    rgba(7,12,16,.98);

  backdrop-filter:blur(18px);
}

.bottom-nav a{
  min-height:47px;

  display:flex;

  flex-direction:column;

  align-items:center;
  justify-content:center;

  gap:2px;

  border-radius:10px;

  color:var(--muted);

  text-decoration:none;

  font-size:8px;
  font-weight:800;
}

.bottom-nav .nav-icon{
  font-size:16px;
  line-height:1;
}

.bottom-nav a.active{
  color:#fff;

  border:
    1px solid
    rgba(201,111,104,.24);

  background:
    rgba(201,111,104,.09);
}


/* =========================================================
   ADD RESTAURANT SHEET
========================================================= */

.sheet-backdrop{
  position:fixed;

  inset:0;

  z-index:100;

  display:none;

  align-items:flex-end;

  background:
    rgba(0,0,0,.65);

  backdrop-filter:blur(4px);
}

.sheet-backdrop.open{
  display:flex;
}

.sheet{
  width:100%;

  max-height:
    calc(92vh - env(safe-area-inset-top));

  overflow-y:auto;

  padding:
    8px
    14px
    calc(20px + env(safe-area-inset-bottom));

  border:
    1px solid var(--line);

  border-radius:
    20px
    20px
    0
    0;

  background:#0d1318;
}

.sheet-handle{
  width:40px;
  height:4px;

  margin:
    2px
    auto
    13px;

  border-radius:99px;

  background:#3a454d;
}

.sheet-title-row{
  display:flex;

  align-items:center;
  justify-content:space-between;

  gap:10px;

  margin-bottom:13px;
}

.sheet-title{
  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-size:20px;
}

.close-sheet{
  width:34px;
  height:34px;

  border:
    1px solid var(--line);

  border-radius:9px;

  background:#151c22;

  color:#fff;

  cursor:pointer;
}


/* =========================================================
   FORM
========================================================= */

.form-grid{
  display:grid;

  grid-template-columns:
    1fr
    1fr;

  gap:10px;
}

.form-field{
  min-width:0;
}

.form-field.full{
  grid-column:
    1 / -1;
}

.form-field label{
  display:block;

  margin-bottom:5px;

  color:#aeb5bc;

  font-size:8px;
  font-weight:850;
}

.form-field input,
.form-field select,
.form-field textarea{
  width:100%;

  min-height:42px;

  padding:
    8px
    10px;

  border:
    1px solid var(--line);

  border-radius:10px;

  outline:none;

  background:#10171d;

  color:#fff;

  font-size:11px;
}

.form-field textarea{
  min-height:75px;

  resize:vertical;
}

.form-field input:focus,
.form-field select:focus,
.form-field textarea:focus{
  border-color:var(--red);
}


/* =========================================================
   CHECKBOXES
========================================================= */

.check-row{
  display:grid;

  grid-template-columns:
    1fr
    1fr;

  gap:6px;

  margin-top:12px;
}

.check-card{
  display:flex;

  align-items:center;

  gap:7px;

  min-height:42px;

  padding:
    7px
    9px;

  border:
    1px solid var(--line);

  border-radius:10px;

  background:#11181e;

  color:#d6dadd;

  font-size:9px;
  font-weight:800;
}

.check-card input{
  width:16px;
  height:16px;
}


/* =========================================================
   SAVE
========================================================= */

.save-button{
  width:100%;

  min-height:47px;

  margin-top:13px;

  border:
    1px solid
    rgba(201,111,104,.4);

  border-radius:11px;

  background:
    rgba(201,111,104,.13);

  color:#f6dcda;

  font-size:10px;
  font-weight:900;

  cursor:pointer;
}

.save-button:disabled{
  opacity:.5;
}

.form-message{
  display:none;

  margin-top:10px;

  padding:
    9px
    10px;

  border-radius:9px;

  font-size:9px;
}

.form-message.error{
  display:block;

  color:#ffc7c3;

  background:
    rgba(201,111,104,.08);

  border:
    1px solid
    rgba(201,111,104,.25);
}

.form-message.success{
  display:block;

  color:#b9e9c8;

  background:
    rgba(103,197,135,.08);

  border:
    1px solid
    rgba(103,197,135,.25);
}


/* =========================================================
   DESKTOP
========================================================= */

@media(min-width:700px){

  .sheet{
    max-width:620px;

    margin:
      0
      auto;

    border-radius:
      20px
      20px
      0
      0;
  }

  .bottom-nav{
    left:50%;
    right:auto;

    width:min(820px,100%);

    transform:
      translateX(-50%);
  }

}

</style>
</head>


<body>


<!-- =========================================================
     HEADER
========================================================= -->

<header>

  <div class="header-inner">

    <div class="title-row">

      <div class="header-title">

        <div class="eyebrow">
          JAPAN TRIP
        </div>

        <h1>
          🍽️ Food Finder
        </h1>

        <div
          id="tripName"
          class="trip-name"
        >
          Loading trip…
        </div>

      </div>


      <button
        id="openAddButton"
        class="add-button"
        type="button"
      >
        ＋ ADD
      </button>

    </div>


    <input
      id="searchInput"
      class="search-box"
      type="search"
      placeholder="Search restaurant, cuisine or area..."
      autocomplete="off"
    >


    <div
      id="cityChips"
      class="city-chips"
    ></div>


    <div class="mode-switch">

      <button
        class="mode-btn active"
        data-mode="area"
      >
        📍 By Area
      </button>

      <button
        class="mode-btn"
        data-mode="food"
      >
        🍜 By Food
      </button>

    </div>


    <div
      id="browseChips"
      class="browse-chips"
    ></div>

  </div>

</header>



<!-- =========================================================
     RESULTS
========================================================= -->

<main>

  <div class="results-head">

    <h2 id="resultsTitle">
      Restaurants
    </h2>

    <div
      id="resultCount"
      class="result-count"
    ></div>

  </div>


  <div id="results">

    <div class="state-box">

      <strong>
        Loading restaurants…
      </strong>

      Getting your food list from Supabase.

    </div>

  </div>

</main>



<!-- =========================================================
     QUICK FILTER
========================================================= -->

<div class="quick-filter">

  <div class="quick-filter-inner">

    <button
      class="quick-btn"
      data-filter="pick"
    >
      ⭐ PICKS
    </button>

    <button
      class="quick-btn"
      data-filter="top"
    >
      🏆 TOP 100
    </button>

    <button
      class="quick-btn"
      data-filter="hot"
    >
      🔥 HOT
    </button>

    <button
      class="quick-btn"
      data-filter="flexible"
    >
      🌙 FLEXIBLE
    </button>

  </div>

</div>



<!-- =========================================================
     BOTTOM NAV
========================================================= -->

<nav
  class="bottom-nav"
  aria-label="Main navigation"
>

  <a id="homeNav">
    <span class="nav-icon">🏠</span>
    <span>HOME</span>
  </a>

  <a id="scheduleNav">
    <span class="nav-icon">📅</span>
    <span>PLAN</span>
  </a>

  <a
    class="active"
    aria-current="page"
  >
    <span class="nav-icon">🍽️</span>
    <span>FOOD</span>
  </a>

  <a id="hubNav">
    <span class="nav-icon">⭐</span>
    <span>HUB</span>
  </a>

  <a href="#">
    <span class="nav-icon">⋯</span>
    <span>MORE</span>
  </a>

</nav>



<!-- =========================================================
     ADD RESTAURANT SHEET
========================================================= -->

<div
  id="addSheet"
  class="sheet-backdrop"
>

  <div class="sheet">

    <div class="sheet-handle"></div>


    <div class="sheet-title-row">

      <div class="sheet-title">
        ＋ Add Restaurant
      </div>

      <button
        id="closeSheetButton"
        class="close-sheet"
        type="button"
      >
        ✕
      </button>

    </div>


    <form id="addRestaurantForm">

      <div class="form-grid">


        <div class="form-field full">

          <label>
            RESTAURANT NAME *
          </label>

          <input
            id="newName"
            required
            placeholder="e.g. Mugi to Mensuke"
          >

        </div>


        <div class="form-field full">

          <label>

/* =========================================================
   HELPERS
========================================================= */

function text(value){

  return String(
    value ?? ""
  );

}


function escapeHTML(value){

  return text(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


function normalize(value){

  return text(value)
    .trim()
    .toLowerCase();

}


function cuisineEmoji(cuisine){

  const value =
    normalize(cuisine);


  if(value.includes("ramen"))
    return "🍜";

  if(value.includes("sushi"))
    return "🍣";

  if(value.includes("yakitori"))
    return "🍢";

  if(value.includes("chicken"))
    return "🍗";

  if(value.includes("oyakodon"))
    return "🍳";

  if(value.includes("udon"))
    return "🥢";

  if(value.includes("soba"))
    return "🥢";

  if(value.includes("tonkatsu"))
    return "🐷";

  if(value.includes("unagi"))
    return "🐟";

  if(value.includes("tempura"))
    return "🍤";

  if(value.includes("curry"))
    return "🍛";

  if(value.includes("izakaya"))
    return "🍶";

  if(value.includes("gyoza"))
    return "🥟";

  if(value.includes("bakery"))
    return "🥐";

  if(value.includes("seafood"))
    return "🦐";

  return "🍽️";

}


function uniqueSorted(values){

  return [
    ...new Set(
      values
        .filter(Boolean)
        .map(v => text(v).trim())
        .filter(Boolean)
    )
  ]
  .sort(
    (a,b) =>
      a.localeCompare(b)
  );

}


/* =========================================================
   RESTAURANT FIELD HELPERS

   These make the page a little more tolerant if some older
   rows use slightly different field names.
========================================================= */

function restaurantRating(r){

  return (
    r.rating
    ??
    r.tabelog_rating
    ??
    ""
  );

}


function restaurantPrice(r){

  return (
    r.price
    ||
    r.dinner_price
    ||
    r.lunch_price
    ||
    ""
  );

}


function restaurantDescription(r){

  return (
    r.description
    ||
    r.why
    ||
    ""
  );

}


function restaurantCuisine(r){

  return (
    r.cuisine
    ||
    r.food
    ||
    "Restaurant"
  );

}


function restaurantJapanese(r){

  return (
    r.name_japanese
    ||
    r.japanese_name
    ||
    ""
  );

}


function restaurantCity(r){

  return (
    r.city
    ||
    ""
  );

}


function restaurantArea(r){

  return (
    r.area
    ||
    ""
  );

}


function restaurantLocation(r){

  return (
    r.location
    ||
    r.area
    ||
    r.city
    ||
    ""
  );

}


/* =========================================================
   TRIP RELATION
========================================================= */

function tripRelation(
  restaurantId
){

  return tripRestaurants.find(
    row =>
      Number(row.restaurant_id)
      ===
      Number(restaurantId)
  );

}


function isInTrip(r){

  return Boolean(
    tripRelation(r.id)
  );

}


function isPick(r){

  return Boolean(
    tripRelation(r.id)
      ?.is_pick
  );

}


function isFlexible(r){

  return Boolean(
    tripRelation(r.id)
      ?.is_flexible
  );

}


/* =========================================================
   MASTER BADGES
========================================================= */

function isTop100(r){

  if(
    r.is_tabelog_top100 === true
  ){
    return true;
  }


  const awardText =
    normalize(
      r.award
      ||
      r.recognition
    );


  return (
    awardText.includes("top 100")
    ||
    awardText.includes("top100")
  );

}


function isHot(r){

  if(r.is_hot === true){
    return true;
  }


  return normalize(
    r.award
    ||
    r.recognition
  )
  .includes("hot restaurant");

}


function isScheduled(r){

  return scheduleRows.some(
    row =>
      Number(row.restaurant_id)
      ===
      Number(r.id)
  );

}


/* =========================================================
   LOAD DATA
========================================================= */

async function loadPage(){

  try{


    /* USER */

    const {
      data:userData
    } =
      await db.auth.getUser();


    currentUser =
      userData?.user || null;



    /* TRIP */

    const {
      data:tripData,
      error:tripError
    } =
      await db
        .from("trips")
        .select("*")
        .eq("id",TRIP_ID)
        .single();


    if(tripError){
      throw tripError;
    }


    trip = tripData;


    tripName.textContent =
      trip.name ||
      `Trip ${TRIP_ID}`;



    /* MASTER RESTAURANTS */

    const {
      data:restaurantData,
      error:restaurantError
    } =
      await db
        .from("restaurants")
        .select("*")
        .eq("status","active")
        .order(
          "name",
          {
            ascending:true
          }
        );


    /*
      If your older rows don't use status="active",
      try again without the status filter.
    */

    if(restaurantError){

      console.warn(
        "Active restaurant query failed. Retrying all restaurants.",
        restaurantError
      );


      const retry =
        await db
          .from("restaurants")
          .select("*")
          .order(
            "name",
            {
              ascending:true
            }
          );


      if(retry.error){
        throw retry.error;
      }


      restaurants =
        retry.data || [];

    }

    else{

      restaurants =
        restaurantData || [];

    }



    /* TRIP RESTAURANTS */

    const tripResult =
      await db
        .from("trip_restaurants")
        .select("*")
        .eq(
          "trip_id",
          TRIP_ID
        );


    if(tripResult.error){

      console.warn(
        tripResult.error
      );

      tripRestaurants = [];

    }

    else{

      tripRestaurants =
        tripResult.data || [];

    }



    /* SCHEDULE */

    const scheduleResult =
      await db
        .from("schedule")
        .select(
          "id,restaurant_id,schedule_date,time_label,start_time,title"
        )
        .eq(
          "trip_id",
          TRIP_ID
        );


    if(scheduleResult.error){

      console.warn(
        scheduleResult.error
      );

      scheduleRows = [];

    }

    else{

      scheduleRows =
        scheduleResult.data || [];

    }



    createCityChips();

    createBrowseChips();

    render();

  }

  catch(error){

    console.error(error);


    results.innerHTML = `

      <div class="state-box">

        <strong>
          Couldn't load restaurants
        </strong>

        ${escapeHTML(
          error.message ||
          "Unknown error"
        )}

      </div>

    `;

  }

}

/* =========================================================
   BROWSE OPTIONS
========================================================= */

function currentCityRestaurants(){

  if(!selectedCity){
    return restaurants;
  }


  return restaurants.filter(
    r =>
      normalize(
        restaurantCity(r)
      )
      ===
      normalize(selectedCity)
  );

}


function createBrowseChips(){

  const source =
    currentCityRestaurants();


  const values =
    browseMode === "area"

      ?

      uniqueSorted(
        source.map(
          restaurantArea
        )
      )

      :

      uniqueSorted(
        source.map(

  const all =

  all.className =

modeButtons.forEach(

/* =========================================================
   SEARCH
========================================================= */

searchInput.addEventListener(
  "input",

      normalize(
        searchInput.value
      );

    render();

  }
);


/* =========================================================
   QUICK FILTERS
========================================================= */

quickButtons.forEach(
  button => {

    button.addEventListener(
      "click",
      () => {

        const filter =
          button.dataset.filter;


        if(
          activeFilters.has(
            filter
          )
        ){

          activeFilters.delete(
            filter
          );

          button.classList.remove(
            "active"
          );

        }

        else{

          activeFilters.add(
            filter
          );

          button.classList.add(
            "active"
          );

        }


        render();

      }
    );

  }
);


/* =========================================================
   FILTER RESTAURANTS
========================================================= */

function getFilteredRestaurants(){

  return restaurants.filter(
    r => {


      /* CITY */

      if(
        selectedCity
        &&
        normalize(
          restaurantCity(r)
        )
        !==
        normalize(selectedCity)
      ){

        return false;

      }


      /* AREA */

      if(
        browseMode === "area"
        &&
        selectedBrowse
        &&
        normalize(
          restaurantArea(r)
        )
        !==
        normalize(selectedBrowse)
      ){

        return false;

      }


      /* FOOD */

      if(
        browseMode === "food"
        &&
        selectedBrowse
        &&
        normalize(
          restaurantCuisine(r)
        )
        !==
        normalize(selectedBrowse)
      ){

        return false;

      }


      /* SEARCH */

      if(searchTerm){

        const haystack =
          normalize([

            r.name,

            restaurantJapanese(r),

            restaurantCuisine(r),

            restaurantCity(r),

            restaurantArea(r),

            restaurantLocation(r),

            restaurantDescription(r),

            r.award,

            r.recognition,

            restaurantRating(r),

            restaurantPrice(r)

          ].join(" "));


        if(
          !haystack.includes(
            searchTerm
          )
        ){

          return false;

        }

      }


      /* QUICK FILTERS = OR */

      if(activeFilters.size){

        const matches = [];


        if(
          activeFilters.has("pick")
        ){
          matches.push(
            isPick(r)
          );
        }


        if(
          activeFilters.has("top")
        ){
          matches.push(
            isTop100(r)
          );
        }


        if(
          activeFilters.has("hot")
        ){
          matches.push(
            isHot(r)
          );
        }


        if(
          activeFilters.has(
            "flexible"
          )
        ){
          matches.push(
            isFlexible(r)
          );
        }


        if(
          !matches.some(Boolean)
        ){
          return false;
        }

      }


      return true;

    }
  );

}

  if(isHot(r)){

  if(isFlexible(r)){

    `;

  }


  if(isInTrip(r)){

    html += `

  if(isScheduled(r)){

  return html;

}

              class="card-btn green"
              type="button"
              onclick="addExistingToTrip(${Number(r.id)})"
            >
              ＋ My Trip
            </button>
          `
        }


      </div>


    </article>

  `;

}


/* =========================================================
   RENDER
========================================================= */

function render(){

  const list =
    getFilteredRestaurants();


  let title =
    "All Food";


  if(selectedCity){

    title =
      selectedCity;

  }


  if(selectedBrowse){

    title =
      browseMode === "food"

      ?

      `${cuisineEmoji(
        selectedBrowse
      )} ${selectedBrowse}`

      :

      `📍 ${selectedBrowse}`;

  }


  resultsTitle.textContent =
    title;


  resultCount.textContent =
    `${list.length} ${
      list.length === 1
      ?
      "restaurant"
      :
      "restaurants"
    }`;


  if(!list.length){

    results.innerHTML = `

      <div class="state-box">

        <strong>
          No restaurants found
        </strong>

        Try another city, area,
        cuisine or filter.

      </div>

    `;

    return;

  }


  /*
    AREA MODE:
    group restaurants by cuisine,
    like your old food pages.
  */

  if(
    browseMode === "area"
  ){

    const groups = {};


    list.forEach(r => {

      const cuisine =
        restaurantCuisine(r);


      if(!groups[cuisine]){
        groups[cuisine] = [];
      }


      groups[cuisine].push(r);

    });


    const cuisines =
      Object.keys(groups)
        .sort();


    results.innerHTML =
      cuisines
        .map(cuisine => {

          const group =
            groups[cuisine];


          return `

            <section class="food-group">


              <div class="food-group-title">

                <span>
                  ${cuisineEmoji(
                    cuisine
                  )}
                </span>

                <span>
                  ${escapeHTML(
                    cuisine
                  )}
                </span>

                <span class="food-group-count">
                  ${group.length}
                </span>

              </div>


              ${
                group
                  .map(
                    restaurantCard
                  )
                  .join("")
              }


            </section>

          `;

        })
        .join("");

  }

  else{

    results.innerHTML =
      list
        .map(
          restaurantCard
        )
        .join("");

  }

}


/* =========================================================
   ADD EXISTING RESTAURANT TO TRIP
========================================================= */

async function addExistingToTrip(
  restaurantId
){

  if(!currentUser){

    window.location.href =
      "login.html";

    return;

  }


  try{

    const {
      error
    } =
      await db
        .from(
          "trip_restaurants"
        )
        .insert({

          trip_id:
            TRIP_ID,

          restaurant_id:
            restaurantId,

          is_pick:
            false,

          is_flexible:
            false

        });


    if(error){
      throw error;
    }


    tripRestaurants.push({

      trip_id:
        TRIP_ID,

      restaurant_id:
        restaurantId,

      is_pick:
        false,

      is_flexible:
        false

    });


    render();

  }

  catch(error){

    console.error(error);

    alert(
      error.message ||
      "Couldn't add restaurant to trip."
    );

  }

}


/* =========================================================
   TOGGLE PICK
========================================================= */

async function togglePick(
  restaurantId
){

  const relation =
    tripRelation(
      restaurantId
    );


  if(!relation){
    return;
  }


  const newValue =
    !relation.is_pick;


  try{

    const {
      error
    } =
      await db
        .from(
          "trip_restaurants"
        )
        .update({
          is_pick:newValue
        })
        .eq(
          "trip_id",
          TRIP_ID
        )
        .eq(
          "restaurant_id",
          restaurantId
        );


    if(error){
      throw error;
    }


    relation.is_pick =
      newValue;


    render();

  }

  catch(error){

    console.error(error);

    alert(
      error.message ||
      "Couldn't update Pick."
    );

  }

}

/* =========================================================
   ADD MASTER RESTAURANT
========================================================= */

document.getElementById(
  "addRestaurantForm"
)
.addEventListener(
  "submit",
  async event => {

    event.preventDefault();


    if(!currentUser){

      window.location.href =
        "login.html";

      return;

    }


    const saveButton =
      document.getElementById(
        "saveRestaurantButton"
      );


    saveButton.disabled =
      true;

    saveButton.textContent =
      "SAVING…";


    formMessage.className =
      "form-message";


    try{


      const name =
        document.getElementById(
          "newName"
        ).value.trim();


      const japanese =
        document.getElementById(
          "newJapanese"
        ).value.trim();


      const city =
        document.getElementById(
          "newCity"
        ).value.trim();


      const area =
        document.getElementById(
          "newArea"
        ).value.trim();


      const location =
        document.getElementById(
          "newLocation"
        ).value.trim();


      const cuisine =
        document.getElementById(
          "newCuisine"
        ).value.trim();


      const ratingText =
        document.getElementById(
          "newRating"
        ).value.trim();


      const price =
        document.getElementById(
          "newPrice"
        ).value.trim();


      const tabelogURL =
        document.getElementById(
          "newTabelog"
        ).value.trim();


      const mapsURL =
        document.getElementById(
          "newMaps"
        ).value.trim();


      const websiteURL =
        document.getElementById(
          "newWebsite"
        ).value.trim();


      const description =
        document.getElementById(
          "newDescription"
        ).value.trim();


      const addToTrip =
        document.getElementById(
          "newAddToTrip"
        ).checked;


      const markPick =
        document.getElementById(
          "newPick"
        ).checked;


      const flexible =
        document.getElementById(
          "newFlexible"
        ).checked;



      /* =====================================
         BASIC DUPLICATE CHECK
      ====================================== */

      const existing =
        restaurants.find(
          r =>
            normalize(r.name)
            ===
            normalize(name)
            &&
            normalize(
              restaurantCity(r)
            )
            ===
            normalize(city)
        );


      if(existing){

        throw new Error(
          "That restaurant already appears to be in the master list."
        );

      }



      /* =====================================
         MASTER RESTAURANT

         New user-created restaurants start
         unverified.
      ====================================== */

      const payload = {

        name:name,

        name_japanese:
          japanese || null,

        cuisine:
          cuisine || null,

        country:
          "Japan",

        city:
          city,

        area:
          area || null,

        location:
          location || null,

        description:
          description || null,

        price:
          price || null,

        tabelog_url:
          tabelogURL || null,

        maps_url:
          mapsURL || null,

        website_url:
          websiteURL || null,

        rating:
          ratingText
          ?
          Number(ratingText)
          :
          null,

        status:
          "active",

        created_by:
          currentUser.id,

        verified:
          false

      };


      const {
        data:newRestaurant,
        error:restaurantError
      } =
        await db
          .from(
            "restaurants"
          )
          .insert(payload)
          .select()
          .single();


      if(restaurantError){
        throw restaurantError;
      }



      /* =====================================
         ADD TO CURRENT TRIP
      ====================================== */

      if(addToTrip){

        const {
          data:newRelation,
          error:relationError
        } =
          await db
            .from(
              "trip_restaurants"
            )
            .insert({

              trip_id:
                TRIP_ID,

              restaurant_id:
                newRestaurant.id,

              is_pick:
                markPick,

              is_flexible:
                flexible

            })
            .select()
            .single();


        if(relationError){
          throw relationError;
        }


        tripRestaurants.push(
          newRelation
        );

      }



      restaurants.push(
        newRestaurant
      );


      restaurants.sort(
        (a,b) =>
          text(a.name)
            .localeCompare(
              text(b.name)
            )
      );


      showFormMessage(
        "Restaurant added to the master list.",
        "success"
      );


      document.getElementById(
        "addRestaurantForm"
      ).reset();


      document.getElementById(
        "newAddToTrip"
      ).checked =
        true;


      createCityChips();

      createBrowseChips();

      render();


      setTimeout(
        closeSheet,
        850
      );

    }

    catch(error){

      console.error(error);


      showFormMessage(
        error.message ||
        "Couldn't save restaurant.",
        "error"
      );

    }

    finally{

      saveButton.disabled =
        false;

      saveButton.textContent =
        "SAVE RESTAURANT";

    }

  }
);


/* =========================================================
   START
========================================================= */

loadPage();
