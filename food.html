<title>Kyoto Food Finder</title>


<style>

/* =========================================
   COLORS
========================================= */

:root{

  --bg:#070c10;

  --panel:#10161c;
  --panel-light:#151c23;
  --panel-active:#172027;

  --line:#29323b;
  --line-soft:rgba(255,255,255,.07);

  --text:#f5f5f3;
  --muted:#aeb5bc;
  --muted-blue:#91a5b3;

  --red:#c96f68;
  --blue:#5c9dff;
  --green:#67c587;
  --orange:#f4a34d;

}


/* =========================================
   GLOBAL
========================================= */

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{

  margin:0;

  background:
    radial-gradient(
      circle at 50% -20%,
      #17202a 0%,
      transparent 38%
    ),
    var(--bg);

  color:var(--text);

  font-family:
    Inter,
    ui-sans-serif,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

  line-height:1.5;

}


/* =========================================
   HEADER
========================================= */

header{

  position:sticky;

  top:0;

  z-index:20;

  background:rgba(7,12,16,.92);

  border-bottom:1px solid var(--line);

  padding:14px 14px 13px;

  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);

  box-shadow:
    0 10px 30px rgba(0,0,0,.20);

}


/* top row */

.header-top{

  max-width:760px;

  margin:0 auto 11px;

  display:flex;

  align-items:center;

  gap:11px;

}


/* home button */

.home-button{

  display:flex;

  align-items:center;
  justify-content:center;

  min-height:39px;

  padding:7px 11px;

  border:1px solid var(--line);

  border-radius:11px;

  background:#121a20;

  color:var(--muted);

  text-decoration:none;

  font-size:12px;

  font-weight:750;

  white-space:nowrap;

}

.home-button:active{

  background:var(--panel-active);

  color:#fff;

  border-color:var(--red);

}


/* title */

header h1{

  margin:0;

  color:#fff;

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-size:25px;

  letter-spacing:-.025em;

}


/* search */

.search{

  display:block;

  max-width:760px;

  width:100%;

  margin:auto;

  border:1px solid var(--line);

  border-radius:14px;

  padding:12px 14px;

  font-size:16px;

  outline:none;

  background:#10161c;

  color:#fff;

}

.search::placeholder{

  color:#77838d;

}

.search:focus{

  border-color:#536673;

  box-shadow:
    0 0 0 3px rgba(92,157,255,.10);

}


/* =========================================
   MAIN
========================================= */

main{

  max-width:760px;

  margin:auto;

  padding:
    16px
    12px
    96px;

}


/* =========================================
   AREA / FOOD SWITCH
========================================= */

.mode{

  display:grid;

  grid-template-columns:1fr 1fr;

  gap:9px;

  padding:7px;

  background:#10171d;

  border:1px solid #26333d;

  border-radius:17px;

  margin-bottom:17px;

}

.mode button,
.chip{

  appearance:none;

  border:1px solid #26333d;

  background:#121a20;

  border-radius:13px;

  padding:11px 13px;

  font-size:14px;

  font-weight:700;

  color:#dce2e6;

  cursor:pointer;

  transition:.2s ease;

}

.mode button.active,
.chip.active{

  background:var(--panel-active);

  color:#fff;

  border-color:var(--red);

  box-shadow:
    inset 0 0 0 1px rgba(201,111,104,.06);

}


/* =========================================
   FILTER CHIPS
========================================= */

.chips{

  display:flex;

  flex-wrap:wrap;

  gap:8px;

  overflow:visible;

  padding:2px 0 14px;

}

.chip{

  border-radius:999px;

  white-space:nowrap;

  padding:9px 13px;

}


/* =========================================
   LABELS
========================================= */

.section-title{

  font-size:11px;

  color:var(--red);

  font-weight:800;

  text-transform:uppercase;

  letter-spacing:.12em;

  margin:4px 2px 9px;

}

.count{

  font-size:12px;

  color:var(--muted);

  margin:0 2px 11px;

}


/* =========================================
   RESTAURANT CARDS
========================================= */

.card{

  background:
    linear-gradient(
      145deg,
      #151c22,
      #0f151a
    );

  border:1px solid var(--line);

  border-radius:20px;

  padding:15px;

  margin:0 0 11px;

  box-shadow:
    0 12px 30px rgba(0,0,0,.16);

}

.top{

  display:flex;

  align-items:flex-start;

  gap:12px;

}


/* rank */

.rank{

  min-width:48px;

  height:48px;

  border-radius:14px;

  background:rgba(92,157,255,.14);

  display:flex;

  align-items:center;
  justify-content:center;

  font-weight:800;

  color:var(--blue);

  font-size:14px;

  border:
    1px solid rgba(92,157,255,.10);

}

.rank.star{

  background:
    rgba(201,111,104,.13);

  color:var(--red);

  border-color:
    rgba(201,111,104,.11);

}


/* restaurant information */

.info{

  flex:1;

  min-width:0;

}

.name{

  font-weight:750;

  font-size:17px;

  line-height:1.3;

  color:#fff;

}

.meta{

  color:var(--muted-blue);

  font-size:12px;

  margin-top:5px;

  line-height:1.5;

}

.why{

  font-size:14px;

  margin-top:9px;

  line-height:1.5;

  color:#e4e7e9;

}


/* =========================================
   BADGES
========================================= */

.badges{

  display:flex;

  flex-wrap:wrap;

  gap:6px;

  margin-top:10px;

}

.badge{

  font-size:11px;

  padding:4px 8px;

  border-radius:999px;

  background:
    rgba(255,255,255,.06);

  color:#cbd2d7;

  border:
    1px solid rgba(255,255,255,.07);

}


/* =========================================
   CARD BUTTONS
========================================= */

.actions{

  display:grid;

  grid-template-columns:1fr auto;

  gap:8px;

  margin-top:12px;

}


/* Maps */

.map{

  display:block;

  text-align:center;

  background:
    rgba(201,111,104,.10);

  color:var(--red);

  border:
    1px solid rgba(201,111,104,.28);

  text-decoration:none;

  border-radius:11px;

  padding:9px 12px;

  font-weight:800;

  font-size:13px;

}


/* info */

.details{

  border:1px solid var(--line);

  background:#121a20;

  border-radius:11px;

  padding:8px 12px;

  font-weight:700;

  color:#c6ced4;

  cursor:pointer;

}


/* hidden extra info */

.extra{

  display:none;

  margin-top:10px;

  padding-top:10px;

  border-top:
    1px solid var(--line-soft);

  font-size:12px;

  color:var(--muted);

  line-height:1.6;

}


/* =========================================
   EMPTY
========================================= */

.empty{

  text-align:center;

  color:var(--muted);

  padding:50px 20px;

}


/* =========================================
   BOTTOM FILTER
========================================= */

.bottom{

  position:fixed;

  bottom:0;

  left:0;
  right:0;

  z-index:25;

  background:
    rgba(15,20,26,.94);

  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);

  border-top:1px solid var(--line);

  padding:
    8px
    12px
    calc(8px + env(safe-area-inset-bottom));

}

.bottom-inner{

  max-width:760px;

  margin:auto;

  display:grid;

  grid-template-columns:
    1fr 1fr 1fr;

  gap:8px;

}

.bottom button{

  border:
    1px solid #26333d;

  border-radius:12px;

  padding:10px 7px;

  background:#121a20;

  font-weight:750;

  color:#cbd2d7;

  cursor:pointer;

}

.bottom button.active{

  background:
    rgba(201,111,104,.08);

  color:var(--red);

  border-color:var(--red);

}


/* =========================================
   DESKTOP
========================================= */

@media(min-width:650px){

  header{

    padding-top:18px;

  }

  header h1{

    font-size:30px;

  }

  .card{

    padding:18px;

  }

}


/* =========================================
   SMALL MOBILE
========================================= */

@media(max-width:400px){

  .header-top{

    gap:8px;

  }

  header h1{

    font-size:22px;

  }

  .home-button{

    padding:7px 9px;

    font-size:11px;

  }

}

</style>

/* =========================================
   FILTER OPTIONS
========================================= */

const areaOptions = [

  "Arashiyama",
  "Downtown",
  "Fushimi",
  "Higashiyama",
  "Kyoto Station",
  "North Kyoto",
  "Okazaki",
  "Other Kyoto"

];


const foodOptions = [

  "Sushi / Omakase",
  "Ramen / Tsukemen",
  "Yakitori / Chicken",
  "Udon / Soba",
  "Oyakodon",
  "Tonkatsu",
  "Unagi",
  "Kaisendon",
  "Tempura",
  "Curry",
  "Izakaya",
  "Washoku",
  "Seafood",
  "Gyoza",
  "Bakery / Pâtisserie"

];


/* =========================================
   STATE
========================================= */

let mode = "area";

let selected = "All";

let tag = "all";


const $ = selector =>
  document.querySelector(selector);


/* =========================================
   ESCAPE HTML
========================================= */

const esc = value =>

  String(value ?? "").replace(

    /[&<>"']/g,

    character => ({

      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      "\"":"&quot;",
      "'":"&#039;"

    }[character])

  );


/* =========================================
   CHANGE MODE
========================================= */

function setMode(newMode){

  mode = newMode;

  selected = "All";


  $("#areaMode").classList.toggle(
    "active",
    newMode === "area"
  );


  $("#foodMode").classList.toggle(
    "active",
    newMode === "food"
  );


  $("#filterTitle").textContent =
    newMode === "area"
      ? "Broad Area"
      : "Food Type";


  renderChips();

  render();

}


/* =========================================
   CHIPS
========================================= */

function renderChips(){

  const options = [

    "All",

    ...(mode === "area"
      ? areaOptions
      : foodOptions)

  ];


  $("#chips").innerHTML =

    options.map(option => `

      <button

        class="chip ${
          option === selected
            ? "active"
            : ""
        }"

        data-v="${esc(option)}"

      >

        ${esc(option)}

      </button>

    `).join("");


  document
    .querySelectorAll(".chip")
    .forEach(button => {

      button.onclick = () => {

        selected =
          button.dataset.v;

        renderChips();

        render();

      };

    });

}


/* =========================================
   TAG FILTER
========================================= */

function tagOK(restaurant){

  if(tag === "star"){

    return (
      restaurant.Tag || ""
    ).includes("⭐");

  }


  if(tag === "moon"){

    return (
      restaurant.Tag || ""
    ).includes("🌙");

  }


  return true;

}


/* =========================================
   RENDER RESTAURANTS
========================================= */

function render(){

  const search =

    $("#search")
      .value
      .trim()
      .toLowerCase();


  let rows = restaurants.filter(
    restaurant => {

      const categoryOK =

        selected === "All"

        ||

        (
          mode === "area"
            ? restaurant["Broad Area"] === selected
            : restaurant["Food Type"] === selected
        );


      const searchOK =

        !search

        ||

        Object
          .values(restaurant)
          .join(" ")
          .toLowerCase()
          .includes(search);


      return (
        categoryOK
        &&
        searchOK
        &&
        tagOK(restaurant)
      );

    }
  );


  /* SORT */

  rows.sort((a,b) => {

    if(
      mode === "food"
      &&
      selected !== "All"
    ){

      return (
        (a["Food Rank"] || 999)
        -
        (b["Food Rank"] || 999)
      );

    }


    if(
      mode === "area"
      &&
      selected !== "All"
    ){

      return (

        a.Location.localeCompare(
          b.Location
        )

        ||

        a["Food Type"].localeCompare(
          b["Food Type"]
        )

        ||

        (
          (a["Food Rank"] || 999)
          -
          (b["Food Rank"] || 999)
        )

      );

    }


    return (

      a["Food Type"].localeCompare(
        b["Food Type"]
      )

      ||

      (
        (a["Food Rank"] || 999)
        -
        (b["Food Rank"] || 999)
      )

    );

  });


  /* COUNT */

  $("#count").textContent =

    `${rows.length} restaurant${
      rows.length === 1
        ? ""
        : "s"
    }`;


  /* EMPTY */

  if(!rows.length){

    $("#list").innerHTML = `

      <div class="empty">

        No matches.

      </div>

    `;

    return;

  }


  /* CARDS */

  $("#list").innerHTML =

    rows.map((restaurant,index) => {


      const rank =

        restaurant["Food Rank"]

          ? `#${restaurant["Food Rank"]}`

          : "—";


      const isStar =

        (restaurant.Tag || "")
          .includes("⭐");


      const mapQuery =

        encodeURIComponent(

          `${restaurant.Restaurant} Kyoto Japan`

        );


      const recognition =

        restaurant.Recognition

          ? `<span class="badge">
               ${esc(restaurant.Recognition)}
             </span>`

          : "";


      const tagBadge =

        restaurant.Tag

          ? `<span class="badge">
               ${esc(restaurant.Tag)}
             </span>`

          : "";


      return `

        <article class="card">


          <div class="top">


            <div
              class="rank ${
                isStar
                  ? "star"
                  : ""
              }"
            >

              ${rank}

            </div>


            <div class="info">


              <div class="name">

                ${esc(
                  restaurant.Restaurant
                )}

              </div>


              <div class="meta">

                ${esc(
                  restaurant["Food Type"]
                )}

                ·

                ${esc(
                  restaurant["Broad Area"]
                )}

                ·

                ${esc(
                  restaurant.Location
                )}

                ·

                ${esc(
                  restaurant["¥ / pp"]
                )}

              </div>


              <div class="why">

                ${esc(
                  restaurant["Why go"]
                )}

              </div>


              <div class="badges">

                ${tagBadge}

                ${recognition}

              </div>


            </div>

          </div>



          <div class="actions">


            <a

              class="map"

              href="https://www.google.com/maps/search/?api=1&query=${mapQuery}"

              target="_blank"

              rel="noopener noreferrer"

            >

              📍 Open in Maps

            </a>


            <button

              class="details"

              onclick="toggleExtra(${index})"

            >

              Info

            </button>


          </div>



          <div
            class="extra"
            id="x${index}"
          >

            <b>Food rank:</b>
            ${rank}
            within
            ${esc(
              restaurant["Food Type"]
            )}

            <br>

            <b>Broad area:</b>
            ${esc(
              restaurant["Broad Area"]
            )}

            <br>

            <b>Specific location:</b>
            ${esc(
              restaurant.Location
            )}

          </div>


        </article>

      `;

    }).join("");

}


/* =========================================
   EXTRA INFO
========================================= */

window.toggleExtra = index => {

  const element =
    $("#x" + index);


  element.style.display =

    element.style.display === "block"

      ? "none"

      : "block";

};


/* =========================================
   EVENTS
========================================= */

$("#search").addEventListener(
  "input",
  render
);


$("#areaMode").onclick =
  () => setMode("area");


$("#foodMode").onclick =
  () => setMode("food");


/* =========================================
   BOTTOM FILTER
========================================= */

function setTag(newTag){

  tag = newTag;


  $("#allBtn").classList.toggle(
    "active",
    newTag === "all"
  );


  $("#starBtn").classList.toggle(
    "active",
    newTag === "star"
  );


  $("#moonBtn").classList.toggle(
    "active",
    newTag === "moon"
  );


  render();

}


$("#allBtn").onclick =
  () => setTag("all");


$("#starBtn").onclick =
  () => setTag("star");


$("#moonBtn").onclick =
  () => setTag("moon");


/* =========================================
   INITIAL LOAD + URL FILTER
========================================= */

const params = new URLSearchParams(window.location.search);

const urlArea = params.get("area");
const urlFood = params.get("food");


if(urlArea && areaOptions.includes(urlArea)){

  mode = "area";
  selected = urlArea;

  $("#areaMode").classList.add("active");
  $("#foodMode").classList.remove("active");

  $("#filterTitle").textContent = "Broad Area";

}


else if(urlFood && foodOptions.includes(urlFood)){

  mode = "food";
  selected = urlFood;

  $("#foodMode").classList.add("active");
  $("#areaMode").classList.remove("active");

  $("#filterTitle").textContent = "Food Type";

}


renderChips();

render();

</script>
