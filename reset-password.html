<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f6f5f2;
      color: #222;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: white;
      padding: 32px 26px;
      border-radius: 18px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 26px;
    }

    .subtitle {
      color: #777;
      font-size: 14px;
      margin-bottom: 24px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin: 14px 0 7px;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 14px;
      border: 0;
      border-radius: 10px;
      background: #222;
      color: white;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }

    #message {
      margin-top: 16px;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div class="card">

    <h1>Set new password</h1>

    <div class="subtitle">
      Choose a new password for your account.
    </div>

    <form id="resetForm">

      <label for="password">
        New password
      </label>

      <input
        type="password"
        id="password"
        minlength="8"
        required
      >


      <label for="confirmPassword">
        Confirm new password
      </label>

      <input
        type="password"
        id="confirmPassword"
        minlength="8"
        required
      >


      <button type="submit">
        Update password
      </button>

    </form>

    <div id="message"></div>

  </div>


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>

    const SUPABASE_URL = "YOUR_SUPABASE_URL";
    const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY";

    const supabaseClient = supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );


    const form =
      document.getElementById("resetForm");

    const message =
      document.getElementById("message");


    form.addEventListener("submit", async (event) => {

      event.preventDefault();


      const password =
        document.getElementById("password").value;

      const confirmPassword =
        document.getElementById("confirmPassword").value;


      if (password !== confirmPassword) {

        message.style.color = "#c0392b";
        message.textContent =
          "The passwords do not match.";

        return;
      }


      const { data, error } =
        await supabaseClient.auth.updateUser({
          password: password
        });


      if (error) {

        console.error(error);

        message.style.color = "#c0392b";

        message.textContent =
          "Unable to update password. The reset link may have expired.";

        return;
      }


      message.style.color = "#2e7d32";

      message.textContent =
        "Password updated successfully! Redirecting...";


      setTimeout(() => {

        window.location.href = "login.html";

      }, 1500);

    });

  </script>

</body>
</html>
