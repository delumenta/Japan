<!doctype html>
<html lang="en">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1, viewport-fit=cover"
>

<meta name="theme-color" content="#070c10">

<title>My Trip</title>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script src="google-maps.js"></script>


<style>

:root{
  --bg:#070c10;
  --panel:#10161c;
  --panel2:#151c23;
  --line:#29323b;

  --text:#f5f5f3;
  --muted:#aeb5bc;
  --muted2:#7f8b93;

  --red:#c96f68;
  --red-soft:rgba(201,111,104,.10);
  --red-line:rgba(201,111,104,.38);

  --blue:#5c9dff;
  --green:#67c587;
}


/* =========================================================
   BASE
========================================================= */

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  min-height:100vh;

  background:
    radial-gradient(
      circle at 50% -10%,
      rgba(35,48,59,.32),
      transparent 30%
    ),
    var(--bg);

  color:var(--text);

  font-family:
    Inter,
    ui-sans-serif,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

  -webkit-font-smoothing:antialiased;
}

button{
  font:inherit;
}

a{
  color:inherit;
}

main{
  width:100%;
  max-width:760px;

  margin:auto;

  padding-bottom:
    calc(100px + env(safe-area-inset-bottom));
}


/* =========================================================
   HERO
========================================================= */

.hero{
  position:relative;

  min-height:420px;

  overflow:hidden;

  background:#0d1318;
}

.hero-image{
  position:absolute;
  inset:0;

  background-position:center;
  background-size:cover;

  transform:scale(1.012);
}

.hero-image::after{
  content:"";

  position:absolute;
  inset:0;

  background:

    linear-gradient(
      to bottom,
      rgba(4,8,11,.10) 0%,
      rgba(4,8,11,.15) 24%,
      rgba(4,8,11,.38) 55%,
      rgba(4,8,11,.83) 84%,
      #070c10 100%
    ),

    linear-gradient(
      to right,
      rgba(5,9,12,.30),
      transparent 62%,
      rgba(5,9,12,.12)
    );
}

.hero-inner{
  position:relative;
  z-index:2;

  min-height:470px;

  display:flex;
  flex-direction:column;

  padding:
    calc(18px + env(safe-area-inset-top))
    16px
    23px;
}

.hero-top{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;

  gap:18px;
}

.hero-copy{
  min-width:0;
}

.hero-eyebrow{
  color:#e7a29c;

  font-size:7px;
  font-weight:900;

  letter-spacing:.17em;

  text-transform:uppercase;

  text-shadow:
    0 2px 12px
    rgba(0,0,0,.75);
}

.hero-title{
  margin:7px 0 0;

  font:
    700
    36px/1
    Georgia,
    "Times New Roman",
    serif;

  letter-spacing:-.035em;

  text-shadow:
    0 4px 20px
    rgba(0,0,0,.78);
}

.hero-route{
  max-width:420px;

  margin-top:7px;

  color:rgba(245,245,243,.78);

  font-size:8px;
  line-height:1.45;

  text-shadow:
    0 2px 10px
    rgba(0,0,0,.80);
}

.hero-dates{
  margin-top:5px;

  color:rgba(226,231,233,.65);

  font-size:7px;

  text-shadow:
    0 2px 10px
    rgba(0,0,0,.8);
}


/* =========================================================
   JAPANESE DECORATION
========================================================= */

.hero-japanese{
  flex:0 0 auto;

  display:flex;
  flex-direction:column;
  align-items:center;

  margin-top:3px;

  color:rgba(255,255,255,.66);

  text-shadow:
    0 3px 15px
    rgba(0,0,0,.75);
}

.hero-japanese-main{
  writing-mode:vertical-rl;

  font-family:
    "Yu Mincho",
    "Hiragino Mincho ProN",
    Georgia,
    serif;

  font-size:25px;

  letter-spacing:.12em;
}

.hero-japanese-sub{
  margin-top:8px;

  color:rgba(255,255,255,.40);

  font-size:5px;
  font-weight:900;

  letter-spacing:.20em;
}


/* =========================================================
   COUNTDOWN
========================================================= */

.countdown{
  display:inline-flex;
  align-items:center;

  min-height:29px;

  margin-top:13px;

  padding:0 10px;

  border:
    1px solid
    rgba(255,255,255,.14);

  border-radius:999px;

  background:
    rgba(5,9,12,.48);

  color:#f0cbc8;

  font-size:7px;
  font-weight:900;

  letter-spacing:.06em;

  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
}

.hero-spacer{
  flex:1;
}


/* =========================================================
   HERO BOTTOM
========================================================= */

.hero-bottom{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;

  gap:12px;
}

.hero-bottom-copy{
  color:rgba(230,233,234,.58);

  font-size:6px;
  font-weight:800;

  letter-spacing:.08em;
}

.hero-bottom-line{
  width:54px;
  height:1px;

  margin-bottom:4px;

  background:
    rgba(255,255,255,.28);
}


/* =========================================================
   CONTENT
========================================================= */

.content{
  position:relative;
  z-index:3;

  margin-top:-20px;

  padding:
    12px
    12px
    22px;
}
/* =========================================================
   SECTION HEADER
========================================================= */

.section-head{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;

  gap:10px;

  margin:
    10px
    2px
    7px;
}

.section-left{
  min-width:0;
}

.section-label{
  color:#91a5b3;

  font-size:6.5px;
  font-weight:900;

  letter-spacing:.14em;
}

.section-title{
  margin-top:3px;

  font:
    700
    18px/1.05
    Georgia,
    "Times New Roman",
    serif;
}

.section-date{
  flex:0 0 auto;

  color:#66737c;

  font-size:6px;

  text-align:right;
}


/* =========================================================
   PLACES CARD
========================================================= */

.place-group{
  margin-bottom:8px;

  overflow:hidden;

  border:
    1px solid
    rgba(255,255,255,.11);

  border-radius:16px;

  background:
    linear-gradient(
      145deg,
      rgba(17,24,30,.96),
      rgba(10,16,21,.98)
    );

  box-shadow:
    0 10px 26px
    rgba(0,0,0,.14);
}


/* =========================================================
   AREA HEADER
========================================================= */

.place-group-head{
  width:100%;

  min-height:54px;

  display:flex;
  align-items:center;

  gap:9px;

  padding:
    9px
    11px;

  border:0;

  background:transparent;

  color:inherit;

  text-align:left;

  cursor:pointer;
}

.place-group-icon{
  flex:0 0 24px;

  width:24px;
  height:24px;

  display:flex;
  align-items:center;
  justify-content:center;

  color:#df938d;

  font-size:11px;
}

.place-group-main{
  flex:1;
  min-width:0;
}

.place-group-name{
  color:#f3f3f1;

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-size:14px;
  font-weight:700;
}

.place-group-meta{
  margin-top:3px;

  color:#74818a;

  font-size:6px;
}

.place-group-chevron{
  flex:0 0 20px;

  color:#7b8890;

  font-size:10px;

  text-align:center;

  transition:.18s;
}

.place-group.open
.place-group-chevron{
  transform:rotate(180deg);
}


/* =========================================================
   PLACE ROWS
========================================================= */

.place-list{
  display:none;

  padding:
    0
    11px
    7px;
}

.place-group.open
.place-list{
  display:block;
}

.place-row{
  display:grid;

  grid-template-columns:
    8px
    69px
    minmax(0,1fr)
    20px;

  gap:7px;

  align-items:center;

  min-height:50px;

  border-top:
    1px solid
    rgba(255,255,255,.055);
}

.place-dot{
  width:6px;
  height:6px;

  border:
    1px solid
    rgba(201,111,104,.74);

  border-radius:50%;

  background:
    rgba(201,111,104,.11);
}

.place-time{
  color:#9aa8b1;

  font-size:6px;
  font-weight:900;

  line-height:1.3;
}

.place-main{
  min-width:0;
}

.place-name{
  color:#f0f2f1;

  font-size:7.8px;
  font-weight:900;

  line-height:1.3;
}

.place-note{
  margin-top:3px;

  overflow:hidden;

  color:#687680;

  font-size:5.9px;
  line-height:1.35;

  display:-webkit-box;

  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
}


/* =========================================================
   SMALL MAP BUTTON
========================================================= */

.map-link{
  width:20px;
  height:20px;

  display:flex;
  align-items:center;
  justify-content:center;

  border:0;

  background:transparent;

  color:#84ace3;

  text-decoration:none;

  font-size:9px;

  opacity:.72;
}

.map-link:active{
  opacity:1;
}


/* =========================================================
   FULL PLAN
========================================================= */

.full-plan{
  min-height:36px;

  display:flex;
  align-items:center;
  justify-content:center;

  margin-top:7px;

  border:
    1px solid
    rgba(201,111,104,.26);

  border-radius:10px;

  background:
    rgba(201,111,104,.055);

  color:#ecc0bd;

  text-decoration:none;

  font-size:6.5px;
  font-weight:900;

  letter-spacing:.04em;
}


/* =========================================================
   DATE SECTION
========================================================= */

.date-section{
  margin-top:14px;
}

.date-section-label{
  margin:
    0
    2px
    7px;

  color:#91a5b3;

  font-size:6.5px;
  font-weight:900;

  letter-spacing:.14em;
}

.date-scroll{
  display:flex;

  gap:6px;

  overflow-x:auto;

  padding-bottom:3px;

  scrollbar-width:none;

  scroll-snap-type:x proximity;
}

.date-scroll::-webkit-scrollbar{
  display:none;
}

.date-btn{
  flex:0 0 54px;

  height:55px;

  border:
    1px solid
    var(--line);

  border-radius:13px;

  background:
    #0f161c;

  color:#76838c;

  cursor:pointer;

  scroll-snap-align:start;
}

.date-btn .num{
  display:block;

  color:#ebeded;

  font:
    700
    16px/1
    Georgia,
    "Times New Roman",
    serif;
}

.date-btn .dow{
  display:block;

  margin-top:5px;

  font-size:5.5px;
  font-weight:900;
}

.date-btn.active{
  border-color:
    rgba(201,111,104,.52);

  background:
    rgba(201,111,104,.11);

  color:#f0b9b4;
}

.date-btn.active .num{
  color:#f3cbc8;
}


/* =========================================================
   FOOD FINDER
========================================================= */

.food-section{
  margin-top:15px;
}

.food-nearby{
  width:100%;

  min-height:52px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  gap:9px;

  padding:
    9px
    10px;

  border:
    1px solid
    rgba(103,197,135,.36);

  border-radius:12px;

  background:
    linear-gradient(
      135deg,
      rgba(103,197,135,.09),
      rgba(103,197,135,.02)
    );

  color:#d7f5df;

  cursor:pointer;
}

.food-left{
  display:flex;
  align-items:center;

  gap:9px;

  text-align:left;
}

.food-icon{
  width:28px;
  height:28px;

  display:flex;
  align-items:center;
  justify-content:center;

  border:
    1px solid
    rgba(103,197,135,.16);

  border-radius:8px;

  background:
    rgba(103,197,135,.05);

  font-size:13px;
}

.food-title{
  color:#9de6b2;

  font-size:7.5px;
  font-weight:900;

  letter-spacing:.03em;
}

.food-sub{
  margin-top:2px;

  color:#77aa86;

  font-size:5.8px;
}

.food-arrow{
  color:var(--green);

  font-size:12px;

  transition:.18s;
}

.food-nearby.open
.food-arrow{
  transform:rotate(180deg);
}


/* =========================================================
   FOOD PANEL
========================================================= */

.nearby-panel{
  display:none;

  margin-top:6px;

  padding:8px;

  border:
    1px solid
    rgba(103,197,135,.19);

  border-radius:11px;

  background:
    rgba(103,197,135,.02);
}

.nearby-panel.show{
  display:block;
}

.nearby-status{
  color:#88aa93;

  font-size:6.5px;
  line-height:1.5;
}

.nearby-status.error{
  color:#ffc5c1;
}

.nearby-section{
  margin-top:8px;
}

.nearby-section:first-child{
  margin-top:0;
}

.nearby-section-title{
  padding-bottom:4px;

  color:#9de6b2;

  font-size:6.5px;
  font-weight:900;

  letter-spacing:.08em;
}

.nearby-item{
  min-height:40px;

  display:flex;
  align-items:center;

  gap:7px;

  padding:
    5px
    2px;

  border-top:
    1px solid
    rgba(255,255,255,.05);
}

.nearby-item-main{
  flex:1;
  min-width:0;
}

.nearby-item-name{
  color:#eef2ef;

  font-size:7.5px;
  font-weight:900;
}

.nearby-item-meta{
  margin-top:2px;

  color:#718c79;

  font-size:5.8px;
}

.nearby-map{
  flex:0 0 21px;

  width:21px;
  height:21px;

  display:flex;
  align-items:center;
  justify-content:center;

  border:0;

  background:transparent;

  text-decoration:none;

  font-size:9px;

  opacity:.72;
}

.nearby-more{
  min-height:32px;

  display:flex;
  align-items:center;
  justify-content:center;

  margin-top:7px;

  border:
    1px solid
    rgba(103,197,135,.20);

  border-radius:8px;

  color:#a9e8bb;

  text-decoration:none;

  font-size:6.5px;
  font-weight:900;
}


/* =========================================================
   STATES
========================================================= */

.empty{
  padding:
    18px
    10px;

  color:#75828a;

  text-align:center;

  font-size:7px;
  line-height:1.55;
}

.error-card{
  padding:12px;

  border:
    1px solid
    rgba(201,111,104,.34);

  border-radius:11px;

  color:#ffc5c1;

  font-size:8px;
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:480px){

  .hero{
    min-height:450px;
  }

  .hero-inner{
    min-height:450px;

    padding-left:13px;
    padding-right:13px;
  }

  .hero-title{
    font-size:33px;
  }

}


@media(max-width:360px){

  .hero-title{
    font-size:29px;
  }

  .place-row{
    grid-template-columns:
      8px
      61px
      minmax(0,1fr)
      19px;
  }

}

</style>

</head>



<body>


<main>


  <!-- =====================================================
       HERO
  ====================================================== -->

  <section class="hero">

    <div
      id="heroImage"
      class="hero-image"
    ></div>


    <div class="hero-inner">


      <div class="hero-top">


        <div class="hero-copy">

          <div
            id="tripEyebrow"
            class="hero-eyebrow"
          >
            LOADING TRIP…
          </div>


          <h1

            class="hero-title"

            My Trip
          </h1>


          <div
            id="tripRoute"

            Loading trip details…
          </div>


          <div
            id="tripDates"
            class="hero-dates"
          ></div>


          <div
            id="tripCountdown"
            class="countdown"
          >
            LOADING…
          </div>

        </div>


        <div class="hero-japanese">

          <div
            id="heroJapanese"
            class="hero-japanese-main"
          >
            旅
          </div>

          <div
            id="heroJapaneseSub"
            class="hero-japanese-sub"
          >
            JOURNEY
          </div>

        </div>


      </div>


      <div class="hero-spacer"></div>


      <div class="hero-bottom">

        <div class="hero-bottom-copy">

        </div>

        <div class="hero-bottom-line"></div>

      </div>


    </div>

  </section>



  <!-- =====================================================
       CONTENT
  ====================================================== -->

  <section class="content">


    <!-- ===================================================
         PLACES
    ==================================================== -->

    <div class="section-head">


      <div class="section-left">

        <div class="section-label">
          PLACES
        </div>

        <div
          id="placesTitle"
          class="section-title"
        >
          Today's Places
        </div>

      </div>


      <div
        id="placesDate"

      ></div>


    </div>


    <div id="placeGroups">

      <div class="empty">
        Loading places…
      </div>

    </div>


    <a
      id="fullPlan"
      class="full-plan"
      href="schedule.html"
    >
      OPEN FULL PLAN →
    </a>



    <!-- ===================================================
         DATE SELECTOR
    ==================================================== -->

    <div class="date-section">

      <div class="date-section-label">
        TRIP DAYS
      </div>

      <div
        id="dateScroll"
        class="date-scroll"
      ></div>

    </div>



    <!-- ===================================================
         FOOD FINDER
    ==================================================== -->

    <div
      id="foodFinder"
      class="food-section"
    ></div>


  </section>


</main>



<!-- =========================================================
     KEEP YOUR EXISTING FOOTER
========================================================= -->

<div id="footer"></div>

<script src="footer.js"></script>



<script>

/* =========================================================
   FALLBACK COVER
========================================================= */

const DEFAULT_HERO =
  "https://zngncasvdrrxyrkjqutj.supabase.co/storage/v1/object/sign/Photos/Bavkground%20image.png?token=eyJraWQiOiIzOTgxNDUwNy1mM2QwLTQ5ZGItODA4My0xODg1MWZkNGYxMmEiLCJhbGciOiJIUzUxMiJ9.eyJ1cmwiOiJQaG90b3MvQmF2a2dyb3VuZCBpbWFnZS5wbmciLCJzY29wZSI6ImRvd25sb2FkIiwiaWF0IjoxNzg5NzIwNzY5LCJleHAiOjMzMzI1NzIwNzY5fQ.fyNIjD9vAXA26vNjxYbQJmz5myxaSZbkT0xmjJvcmV0hbbImJWEwjLYe_nS8qOOA3EgAcOsEnCkU5sa8K0EmPQ";



/* =========================================================
   STATE
========================================================= */

let TRIP_ID =

  Number(
    new URLSearchParams(
      location.search
    ).get("trip")
  )

  ||

  Number(
    localStorage.getItem(
      "current_trip_id"
    )
  )

  ||

  null;


let currentUser = null;

let currentTrip = null;

let scheduleRows = [];

let placeMap =
  new Map();

let dayDates = [];

let selectedDate = null;

let openAreas = {};

let nearbyLoaded = false;

let nearbyLoading = false;



/* =========================================================
   HELPERS
========================================================= */

function txt(value){

  return String(
    value ?? ""
  );

}


function esc(value){

  return txt(value)

    .replaceAll(
      "&",
      "&amp;"
    )

    .replaceAll(
      "<",
      "&lt;"
    )

    .replaceAll(
      ">",
      "&gt;"
    )

    .replaceAll(
      '"',
      "&quot;"
    )

    .replaceAll(
      "'",
      "&#039;"
    );

}


function isoDate(date){

  return (

    `${date.getFullYear()}-` +

    `${String(
      date.getMonth() + 1
    ).padStart(2,"0")}-` +

    `${String(
      date.getDate()
    ).padStart(2,"0")}`

  );

}


function parseDate(value){

  return new Date(
    value +
    "T12:00:00"
  );

}


function shortDate(value){

  return parseDate(value)
    .toLocaleDateString(
      "en-SG",
      {
        day:"numeric",
        month:"short",
        year:"numeric"
      }
    );

}


function weekday(
  value,
  long = false
){

  return parseDate(value)
    .toLocaleDateString(
      "en-SG",
      {
        weekday:
          long
          ?
          "long"
          :
          "short"
      }
    )
    .toUpperCase();

}


function countryIcon(country){

  const value =
    txt(country)
      .toLowerCase();


  if(value.includes("japan")){
    return "🇯🇵";
  }

  if(value.includes("singapore")){
    return "🇸🇬";
  }

  if(value.includes("taiwan")){
    return "🇹🇼";
  }

  if(value.includes("korea")){
    return "🇰🇷";
  }

  if(value.includes("china")){
    return "🇨🇳";
  }

  if(value.includes("thailand")){
    return "🇹🇭";
  }

  if(value.includes("malaysia")){
    return "🇲🇾";
  }

  if(value.includes("indonesia")){
    return "🇮🇩";
  }


  return "✈️";

}



/* =========================================================
   JAPANESE HERO
========================================================= */

function japaneseTitle(country){

  const value =
    txt(country)
      .toLowerCase();


  if(value.includes("japan")){

    return {
      main:"日本",
      sub:"JAPAN"
    };

  }


  return {
    main:"旅",
    sub:"JOURNEY"
  };

}



/* =========================================================
   TIME SORTING
========================================================= */

function timeValue(row){

  if(!row.start_time){

    return null;

  }


  const parts =
    String(
      row.start_time
    )
    .split(":");


  const hour =
    Number(
      parts[0]
    );


  const minute =
    Number(
      parts[1] || 0
    );


  const second =
    Number(
      parts[2] || 0
    );


  if(
    !Number.isFinite(hour) ||
    !Number.isFinite(minute)
  ){

    return null;

  }


  return (
    hour * 3600 +
    minute * 60 +
    second
  );

}


function compareRows(
  a,
  b
){

  const timeA =
    timeValue(a);


  const timeB =
    timeValue(b);


  if(
    timeA !== null &&
    timeB === null
  ){
    return -1;
  }


  if(
    timeA === null &&
    timeB !== null
  ){
    return 1;
  }


  if(
    timeA !== null &&
    timeB !== null &&
    timeA !== timeB
  ){

    return (
      timeA -
      timeB
    );

  }


  const orderA =
    Number(
      a.sort_order || 0
    );


  const orderB =
    Number(
      b.sort_order || 0
    );


  if(
    orderA !== orderB
  ){

    return (
      orderA -
      orderB
    );

  }


  return (
    Number(a.id || 0) -
    Number(b.id || 0)
  );

}



/* =========================================================
   DISPLAY TIME
========================================================= */

function formatClock(value){

  if(!value){
    return "";
  }


  const parts =
    String(value)
      .split(":");


  let hour =
    Number(
      parts[0]
    );


  const minute =
    parts[1] || "00";


  if(!Number.isFinite(hour)){
    return value;
  }


  const suffix =
    hour >= 12
    ?
    "PM"
    :
    "AM";


  hour =
    hour % 12 ||
    12;


  return (

    `${hour}:` +

    `${minute} ` +

    suffix

  );

}


function timeText(row){

  if(row.time_label){

    return row.time_label;

  }


  if(
    row.start_time &&
    row.end_time
  ){

    return (

      `${formatClock(
        row.start_time
      )} – ` +

      `${formatClock(
        row.end_time
      )}`

    );

  }


  if(row.start_time){

    return formatClock(
      row.start_time
    );

  }


  return "Flexible";

}



/* =========================================================
   PLACE
========================================================= */

function rowPlace(row){

  if(!row.place_id){

    return null;

  }


  return (

    placeMap.get(
      Number(
        row.place_id
      )
    )

    ||

    null

  );

}


function rowArea(row){

  const place =
    rowPlace(row);


  return (

    txt(

      place?.area

      ||

      place?.city

      ||

      row.location_name

      ||

      "Other"

    )
    .trim()

    ||

    "Other"

  );

}



/* =========================================================
   MAP LINK
========================================================= */

function mapsHref(row){

  if(row.maps_url){

    return row.maps_url;

  }


  const place =
    rowPlace(row);


  if(place?.maps_url){

    return place.maps_url;

  }


  const lat =
    Number(
      row.latitude
      ??
      place?.latitude
    );


  const lng =
    Number(
      row.longitude
      ??
      place?.longitude
    );


  if(
    Number.isFinite(lat) &&
    Number.isFinite(lng) &&
    !(
      lat === 0 &&
      lng === 0
    )
  ){

    return (

      "https://www.google.com/maps/search/" +

      "?api=1&query=" +

      encodeURIComponent(
        `${lat},${lng}`
      )

    );

  }


  const address =

    row.address

    ||

    place?.address;


  if(address){

    return (

      "https://www.google.com/maps/search/" +

      "?api=1&query=" +

      encodeURIComponent(
        address
      )

    );

  }


  return "";

}



/* =========================================================
   HOME PLACE FILTER
========================================================= */

function isHomePlace(row){

  /*
    Home Places only shows rows linked
    to your master Places database.
  */

  if(!row.place_id){

    return false;

  }


  const type =
    txt(
      row.item_type
    )
    .toLowerCase();


  const excluded = [

    "transport",
    "hotel",
    "restaurant",
    "food",
    "meal",
    "flight",
    "reminder"

  ];


  return !excluded.some(
    word =>
      type.includes(word)
  );

}



/* =========================================================
   ACCESSIBLE TRIPS
========================================================= */

async function getAccessibleTrips(){

  const ownResult =

    await db
      .from("trips")
      .select("*")
      .eq(
        "owner_id",
        currentUser.id
      );


  if(ownResult.error){

    throw ownResult.error;

  }


  const memberResult =

    await db
      .from("trip_members")
      .select(`
        trip_id,
        role
      `)
      .eq(
        "user_id",
        currentUser.id
      );


  if(memberResult.error){

    throw memberResult.error;

  }


  const tripsMap =
    new Map();


  (
    ownResult.data ||
    []
  )
  .forEach(
    item => {

      tripsMap.set(
        Number(item.id),
        item
      );

    }
  );


  const sharedIds =

    [
      ...new Set(

        (
          memberResult.data ||
          []
        )

        .map(
          row =>
            Number(
              row.trip_id
            )
        )

        .filter(Boolean)

      )
    ];


  if(sharedIds.length){

    const sharedResult =

      await db
        .from("trips")
        .select("*")
        .in(
          "id",
          sharedIds
        );


    if(sharedResult.error){

      throw sharedResult.error;

    }


    (
      sharedResult.data ||
      []
    )
    .forEach(
      item => {

        tripsMap.set(
          Number(item.id),
          item
        );

      }
    );

  }


  return [

    ...tripsMap.values()

  ]
  .sort(
    (a,b) =>

      txt(
        a.start_date
      )
      .localeCompare(
        txt(
          b.start_date
        )
      )
  );

}



/* =========================================================
   RESOLVE TRIP
========================================================= */

async function resolveTrip(){

  const authResult =
    await db.auth.getUser();


  if(authResult.error){

    throw authResult.error;

  }


  currentUser =
    authResult.data?.user ||
    null;


  if(!currentUser){

    location.href =
      "login.html";


    throw new Error(
      "Please sign in."
    );

  }


  const trips =
    await getAccessibleTrips();


  if(!trips.length){

    throw new Error(
      "No trips available."
    );

  }


  let resolved =

    trips.find(
      item =>
        Number(item.id) ===
        Number(TRIP_ID)
    );


  if(!resolved){

    resolved =
      trips[0];

  }


  TRIP_ID =
    Number(
      resolved.id
    );


  localStorage.setItem(
    "current_trip_id",
    String(TRIP_ID)
  );


  history.replaceState(
    null,
    "",
    `index.html?trip=${TRIP_ID}`
  );

}



/* =========================================================
   LOAD DATA
========================================================= */

async function loadData(){

  await resolveTrip();


  const tripResult =

    await db
      .from("trips")
      .select("*")
      .eq(
        "id",
        TRIP_ID
      )
      .single();


  if(tripResult.error){

    throw tripResult.error;

  }


  currentTrip =
    tripResult.data;



  /* =======================================================
     SCHEDULE
  ======================================================= */

  const scheduleResult =

    await db
      .from("schedule")
      .select("*")
      .eq(
        "trip_id",
        TRIP_ID
      )
      .order(
        "schedule_date",
        {
          ascending:true
        }
      )
      .order(
        "sort_order",
        {
          ascending:true
        }
      );


  if(scheduleResult.error){

    throw scheduleResult.error;

  }


  scheduleRows =
    scheduleResult.data ||
    [];



  /* =======================================================
     MASTER PLACES
  ======================================================= */

  const placeIds =

    [
      ...new Set(

        scheduleRows

          .map(
            row =>
              Number(
                row.place_id
              )
          )

          .filter(
            Number.isFinite
          )

      )
    ];


  if(placeIds.length){

    const placeResult =

      await db
        .from("places")
        .select(`
          id,
          name,
          area,
          city,
          prefecture,
          address,
          latitude,
          longitude,
          maps_url
        `)
        .in(
          "id",
          placeIds
        );


    if(!placeResult.error){

      (
        placeResult.data ||
        []
      )
      .forEach(
        place => {

          placeMap.set(
            Number(place.id),
            place
          );

        }
      );

    }

  }



  /* =======================================================
     DATES
  ======================================================= */

  dayDates =

    [
      ...new Set(

        scheduleRows

          .map(
            row =>
              row.schedule_date
          )

          .filter(Boolean)

      )
    ]
    .sort();


  chooseInitialDate();


  renderHero();

  renderPage();

}



/* =========================================================
   CHOOSE DATE
========================================================= */

function chooseInitialDate(){

  if(!dayDates.length){

    selectedDate =
      currentTrip.start_date ||
      null;

    return;

  }


  const today =
    isoDate(
      new Date()
    );


  if(
    dayDates.includes(
      today
    )
  ){

    selectedDate =
      today;

    return;

  }


  if(
    today <
    dayDates[0]
  ){

    selectedDate =
      dayDates[0];

    return;

  }


  if(
    today >
    dayDates[
      dayDates.length - 1
    ]
  ){

    selectedDate =
      dayDates[
        dayDates.length - 1
      ];

    return;

  }


  selectedDate =

    dayDates.find(
      date =>
        date >= today
    )

    ||

    dayDates[0];

}

    )

    )}`

  /*

    japanese.main;


  document.getElementById(
    "heroJapaneseSub"
  ).textContent =

    japanese.sub;



  /* =======================================================
     COUNTDOWN
  ======================================================= */

  let countdown =
    "TRIP";


  if(
    currentTrip.start_date &&
    currentTrip.end_date
  ){

    const today =
      isoDate(
        new Date()
      );


    const start =
      currentTrip.start_date;


    const end =
      currentTrip.end_date;


    if(
      today <
      start
    ){

      const days =

        Math.ceil(

          (
            parseDate(start) -
            parseDate(today)
          )

          /

          86400000

        );


      countdown =

        `${days} DAY` +

        (
          days === 1
          ?
          ""
          :
          "S"
        )

        +

        " TO GO";

    }


    else if(
      today <= end
    ){

      const day =

        Math.floor(

          (
            parseDate(today) -
            parseDate(start)
          )

          /

          86400000

        )

        +

        1;


      const total =

        Math.floor(

          (
            parseDate(end) -
            parseDate(start)
          )

          /

          86400000

        )

        +

        1;


      countdown =
        `DAY ${day} OF ${total}`;

    }


    else{

      countdown =
        "TRIP COMPLETE";

    }

  }


  document.getElementById(
    "tripCountdown"
  ).textContent =
    countdown;


  document.title =

    `${
      currentTrip.name ||
      "My Trip"
    } · Travel`;

}

/* =========================================================
   GROUP BY AREA
========================================================= */

function groupPlaces(rows){

  const groups = [];

  let currentGroup =
    null;


  rows
    .filter(
      isHomePlace
    )
    .sort(
      compareRows
    )
    .forEach(
      row => {

        const area =
          rowArea(row);


        /*
          Consecutive same areas stay
          inside the same visual block.

          If itinerary later returns to
          the area, a new block appears.
        */

        if(
          !currentGroup ||
          currentGroup.name !== area
        ){

          currentGroup = {

            name:area,

            rows:[]

          };


          groups.push(
            currentGroup
          );

        }


        currentGroup.rows.push(
          row
        );

      }
    );


  return groups;

}



/* =========================================================
   AREA TIME
========================================================= */

function areaTime(rows){

  const timedRows =

    rows.filter(
      row =>
        row.start_time
    );


  if(!timedRows.length){

    return "Flexible";

  }


  const first =
    timedRows[0];


  const last =
    timedRows[
      timedRows.length - 1
    ];


  const start =
    formatClock(
      first.start_time
    );


  let end = "";


  if(last.end_time){

    end =
      formatClock(
        last.end_time
      );

  }


  else{

    end =
      formatClock(
        last.start_time
      );

  }


  if(
    start &&
    end &&
    start !== end
  ){

    return (
      `${start} – ${end}`
    );

  }


  return start;

}

/* =========================================================
   DISTANCE
========================================================= */

function distanceM(
  lat1,
  lng1,
  lat2,
  lng2
){

  const rad =
    value =>
      value *
      Math.PI /
      180;


  const earth =
    6371000;


  const dLat =
    rad(
      lat2 -
      lat1
    );


  const dLng =
    rad(
      lng2 -
      lng1
    );


  const a =

    Math.sin(
      dLat / 2
    ) ** 2

    +

    Math.cos(
      rad(lat1)
    )

    *

    Math.cos(
      rad(lat2)
    )

    *

    Math.sin(
      dLng / 2
    ) ** 2;


  return (

    earth *

    2 *

    Math.atan2(

      Math.sqrt(a),

      Math.sqrt(
        1-a
      )

    )

  );

}


function distanceLabel(distance){

  if(
    distance < 1000
  ){

    return (

      `${Math.max(
        10,
        Math.round(
          distance / 10
        ) * 10
      )} m`

    );

  }


  return (

    `${(
      distance / 1000
    ).toFixed(1)} km`

  );

}


function googleMapLink(
  lat,
  lng,
  url
){

  return (

    url

    ||

    (
      "https://www.google.com/maps/search/" +

      "?api=1&query=" +

      encodeURIComponent(
        `${lat},${lng}`
      )
    )

  );

}



/* =========================================================
   FOOD RESULT
========================================================= */

function renderFoodItem(item){

  return `

    <div class="nearby-item">


      <div class="nearby-item-main">


        <div class="nearby-item-name">

          ${esc(
            item.name ||
            "Restaurant"
          )}

        </div>


        <div class="nearby-item-meta">

          ${esc(

            [

              item.distance
              ?
              distanceLabel(
                item.distance
              )
              :
              "",

              item.area ||
              item.city ||
              ""

            ]

            .filter(Boolean)

            .join(" · ")

          )}

        </div>


      </div>


      ${
        item.map

        ?

        `

          <a
            class="nearby-map"
            href="${esc(item.map)}"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Open map"
          >
            📍
          </a>

        `

        :

        ""
      }


    </div>

  `;

}



/* =========================================================
   LOAD FOOD NEARBY
========================================================= */

async function loadNearbyFood(){

  const status =
    document.getElementById(
      "foodNearbyStatus"
    );


  const output =
    document.getElementById(
      "foodNearbyResults"
    );


  nearbyLoading =
    true;


  status.style.display =
    "";


  status.className =
    "nearby-status";


  status.textContent =
    "Finding food around you…";


  output.innerHTML =
    "";


  try{


    const position =

      await new Promise(
        (
          resolve,
          reject
        ) => {

          if(
            !navigator.geolocation
          ){

            reject(
              new Error(
                "Location is not available on this device."
              )
            );

            return;

          }


          navigator.geolocation
            .getCurrentPosition(

              resolve,

              reject,

              {
                enableHighAccuracy:true,
                timeout:12000,
                maximumAge:60000
              }

            );

        }
      );


    const lat =
      position.coords.latitude;


    const lng =
      position.coords.longitude;



    /* =====================================================
       SAVED PICKS
    ====================================================== */

    let picks = [];


    const tripRestaurantResult =

      await db
        .from("trip_restaurants")
        .select("*")
        .eq(
          "trip_id",
          TRIP_ID
        );


    if(
      !tripRestaurantResult.error
    ){

      const ids =

        [
          ...new Set(

            (
              tripRestaurantResult.data ||
              []
            )

            .map(
              row =>
                Number(
                  row.restaurant_id
                )
            )

            .filter(
              Number.isFinite
            )

          )
        ];


      if(ids.length){

        const restaurantResult =

          await db
            .from("restaurants")
            .select("*")
            .in(
              "id",
              ids
            );


        if(
          !restaurantResult.error
        ){

          picks =

            (
              restaurantResult.data ||
              []
            )

            .filter(
              restaurant =>

                Number.isFinite(
                  Number(
                    restaurant.latitude
                  )
                )

                &&

                Number.isFinite(
                  Number(
                    restaurant.longitude
                  )
                )
            )

            .map(
              restaurant => {

                const restaurantLat =
                  Number(
                    restaurant.latitude
                  );


                const restaurantLng =
                  Number(
                    restaurant.longitude
                  );


                return {

                  ...restaurant,

                  distance:
                    distanceM(

                      lat,
                      lng,

                      restaurantLat,
                      restaurantLng

                    ),

                  map:
                    googleMapLink(

                      restaurantLat,
                      restaurantLng,

                      restaurant.maps_url

                    )

                };

              }
            )

            .filter(
              restaurant =>
                restaurant.distance <=
                250
            )

            .sort(
              (a,b) =>
                a.distance -
                b.distance
            );

        }

      }

    }



    /* =====================================================
       GOOGLE NEARBY
    ====================================================== */

    let nearby = [];


    try{

      const library =
        await window
          .getGooglePlaces();


      const Place =
        library.Place;


      if(
        Place &&
        typeof Place.searchNearby ===
        "function"
      ){

        const response =

          await Place
            .searchNearby({

              fields:[
                "id",
                "displayName",
                "formattedAddress",
                "location",
                "googleMapsURI"
              ],

              locationRestriction:{

                center:{
                  lat,
                  lng
                },

                radius:1800

              },

              includedPrimaryTypes:[
                "restaurant",
                "cafe"
              ],

              maxResultCount:8,

              rankPreference:
                "DISTANCE"

            });


        nearby =

          (
            response.places ||
            []
          )

          .map(
            place => {

              const placeLat =

                typeof place
                  .location
                  ?.lat ===
                "function"

                ?

                place.location.lat()

                :

                place.location?.lat;


              const placeLng =

                typeof place
                  .location
                  ?.lng ===
                "function"

                ?

                place.location.lng()

                :

                place.location?.lng;


              return {

                name:
                  place.displayName ||
                  "Restaurant",

                area:
                  place.formattedAddress ||
                  "",

                distance:

                  Number.isFinite(
                    placeLat
                  )

                  &&

                  Number.isFinite(
                    placeLng
                  )

                  ?

                  distanceM(

                    lat,
                    lng,

                    placeLat,
                    placeLng

                  )

                  :

                  null,

                map:

                  place.googleMapsURI

                  ||

                  googleMapLink(
                    placeLat,
                    placeLng
                  )

              };

            }
          );

      }

    }


    catch(error){

      console.warn(
        "Google nearby food:",
        error
      );

    }



    /* =====================================================
       RENDER
    ====================================================== */

    status.style.display =
      "none";


    let html = "";


    html += `

      <div class="nearby-section">

        <div class="nearby-section-title">
          YOUR PICKS
        </div>

        ${
          picks.length

          ?

          picks
            .map(
              renderFoodItem
            )
            .join("")

          :

          `

            <div class="nearby-status">
              No saved picks within 250 m of you.
            </div>

          `
        }

      </div>

    `;


    html += `

      <div class="nearby-section">

        <div class="nearby-section-title">
          FOOD NEAR YOU
        </div>

        ${
          nearby.length

          ?

          nearby
            .map(
              renderFoodItem
            )
            .join("")

          :

          `

            <div class="nearby-status">
              No nearby Google results found.
            </div>

          `
        }

      </div>

    `;


    html += `

      <a
        class="nearby-more"
        href="food.html?trip=${TRIP_ID}&nearby=1"
      >
        SEE MORE FOOD →
      </a>

    `;


    output.innerHTML =
      html;


    nearbyLoaded =
      true;

  }


  catch(error){

    status.className =
      "nearby-status error";


    status.textContent =

      error.message

      ||

      "Could not get your location.";

  }


  finally{

    nearbyLoading =
      false;

  }

}
