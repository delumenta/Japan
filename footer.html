<style>
:root{
  --nav-bg:#070c10;--nav-surface:#10171d;--nav-line:#29343d;
  --nav-text:#f5f3ef;--nav-muted:#8d98a0;--nav-red:#ff625f;
  --nav-red-soft:rgba(255,98,95,.11);--nav-red-line:rgba(255,98,95,.38);
}
#footer{position:relative;z-index:9000}
.radial-backdrop{
  position:fixed;inset:0;z-index:9000;background:rgba(3,7,10,.60);
  backdrop-filter:blur(2px);opacity:0;visibility:hidden;transition:.22s ease;
}
.radial-backdrop.open{opacity:1;visibility:visible}
.radial-menu{
  position:fixed;right:max(16px,env(safe-area-inset-right));
  bottom:calc(16px + env(safe-area-inset-bottom));
  z-index:9020;width:340px;height:470px;pointer-events:none;
}
.radial-toggle{
  position:absolute;right:0;bottom:0;width:60px;height:60px;border-radius:50%;
  border:1px solid var(--nav-red-line);background:#10171d;cursor:pointer;
  display:grid;place-items:center;pointer-events:auto;
  box-shadow:0 8px 28px rgba(0,0,0,.48),0 0 18px rgba(255,98,95,.08);
}
.radial-toggle img{width:44px;height:44px;object-fit:contain;transition:.25s ease}
.radial-toggle .x{position:absolute;color:var(--nav-red);font:300 34px/1 system-ui;opacity:0;transform:rotate(-70deg) scale(.7);transition:.25s ease}
.radial-menu.open .radial-toggle img{opacity:0;transform:rotate(55deg) scale(.6)}
.radial-menu.open .radial-toggle .x{opacity:1;transform:none}

.radial-item{
  --x:0px;--y:0px;--d:0ms;
  position:absolute;right:7px;bottom:7px;display:flex;align-items:center;gap:8px;
  text-decoration:none;color:var(--nav-text);border:0;background:transparent;
  padding:0;cursor:pointer;opacity:0;pointer-events:none;
  transform:translate(0,0) scale(.35);transform-origin:right bottom;
  transition:transform .38s cubic-bezier(.18,.88,.28,1.12) var(--d),opacity .18s ease var(--d);
}
.radial-menu.open .radial-item{opacity:1;pointer-events:auto;transform:translate(var(--x),var(--y)) scale(1)}
.radial-label{
  order:-1;min-width:72px;text-align:right;padding:5px 8px;border-radius:999px;
  border:1px solid rgba(255,255,255,.08);background:rgba(7,12,16,.94);
  font:800 9px/1.2 Inter,system-ui,sans-serif;white-space:nowrap;
  box-shadow:0 5px 16px rgba(0,0,0,.28)
}
.radial-icon{
  width:45px;height:45px;flex:0 0 45px;border-radius:50%;
  border:1px solid var(--nav-line);background:rgba(16,23,29,.98);
  display:grid;place-items:center;box-shadow:0 6px 18px rgba(0,0,0,.34);
  font:18px/1 system-ui;
}
.radial-icon img{width:34px;height:34px;object-fit:contain}
.radial-item.active .radial-icon{border-color:var(--nav-red-line);background:var(--nav-red-soft);box-shadow:0 0 16px rgba(255,98,95,.17)}
.radial-item.active .radial-label{color:#ffc0bc;border-color:var(--nav-red-line)}

/* Side-opening curved fan */
.nav-home{--x:-84px;--y:-16px;--d:20ms}
.nav-plan{--x:-146px;--y:-55px;--d:40ms}
.nav-food{--x:-190px;--y:-108px;--d:60ms}
.nav-booking{--x:-216px;--y:-168px;--d:80ms}
.nav-expenses{--x:-221px;--y:-230px;--d:100ms}
.nav-map{--x:-207px;--y:-290px;--d:120ms}
.nav-profile{--x:-174px;--y:-344px;--d:140ms}
.nav-trips{--x:-125px;--y:-390px;--d:160ms}
.nav-places{--x:-68px;--y:-423px;--d:180ms}

/* Small utility actions sit nearer the centre of the arc */
.radial-utility{
  position:absolute;right:70px;bottom:78px;display:flex;gap:7px;
  opacity:0;pointer-events:none;transform:translate(20px,20px) scale(.7);transition:.28s ease .12s
}
.radial-menu.open .radial-utility{opacity:1;pointer-events:auto;transform:none}
.utility-btn{
  min-height:31px;padding:6px 9px;border:1px solid var(--nav-line);border-radius:999px;
  background:rgba(13,19,24,.96);color:#aeb7bd;font:800 7px Inter,system-ui;cursor:pointer
}
.utility-btn:hover{border-color:var(--nav-red-line);color:#ffc0bc}

.trip-backdrop{
  position:fixed;inset:0;z-index:9060;background:rgba(3,7,10,.72);
  display:flex;align-items:flex-end;justify-content:center;opacity:0;visibility:hidden;transition:.2s ease
}
.trip-backdrop.open{opacity:1;visibility:visible}
.trip-sheet{
  width:min(100%,520px);max-height:78vh;overflow:auto;padding:10px 14px calc(18px + env(safe-area-inset-bottom));
  border:1px solid #28343d;border-bottom:0;border-radius:20px 20px 0 0;background:#0d1318
}
.trip-handle{width:38px;height:3px;margin:2px auto 12px;border-radius:99px;background:#34414b}
.trip-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.trip-title{font:700 21px Georgia,serif;color:var(--nav-text)}
.trip-close{border:0;background:transparent;color:#8d98a0;font-size:23px;cursor:pointer}
.trip-list{display:grid;gap:7px}
.trip-msg{padding:18px;text-align:center;color:#89959d;font:9px Inter,system-ui}
.trip-card{
  display:grid;grid-template-columns:38px 1fr auto;gap:10px;align-items:center;padding:10px;
  border:1px solid #263039;border-radius:11px;background:#10171d;color:var(--nav-text);text-decoration:none
}
.trip-card.current{border-color:var(--nav-red-line);background:var(--nav-red-soft)}
.trip-flag{font-size:21px}.trip-name{font:900 9px Inter,system-ui}.trip-meta{margin-top:2px;color:#7e8a93;font:7px Inter,system-ui}
.trip-role{display:inline-block;margin-top:4px;color:#b4bdc3;font:900 6px Inter,system-ui}.trip-arrow{color:#65727b}

@media(max-width:430px){
  .radial-menu{right:8px;bottom:calc(8px + env(safe-area-inset-bottom));transform:scale(.88);transform-origin:right bottom}
}
</style>

<div id="radialBackdrop" class="radial-backdrop"></div>

<nav id="radialMenu" class="radial-menu" aria-label="Main navigation">
  <a id="sharedNavHome" class="radial-item nav-home"><span class="radial-label">Home</span><span class="radial-icon"><img data-icon="home" alt=""></span></a>
  <a id="sharedNavPlan" class="radial-item nav-plan"><span class="radial-label">Plan</span><span class="radial-icon"><img data-icon="plan" alt=""></span></a>
  <a id="sharedNavFood" class="radial-item nav-food"><span class="radial-label">Food</span><span class="radial-icon"><img data-icon="food" alt=""></span></a>
  <a id="sharedNavBooking" class="radial-item nav-booking"><span class="radial-label">Booking</span><span class="radial-icon"><img data-icon="booking" alt=""></span></a>
  <a id="sharedNavExpenses" class="radial-item nav-expenses"><span class="radial-label">Expenses</span><span class="radial-icon"><img data-icon="expenses" alt=""></span></a>
  <a id="sharedNavMap" class="radial-item nav-map"><span class="radial-label">Map</span><span class="radial-icon">🗺️</span></a>
  <a id="sharedNavProfile" class="radial-item nav-profile"><span class="radial-label">Profile</span><span class="radial-icon">👤</span></a>
  <a id="sharedNavTrips" class="radial-item nav-trips"><span class="radial-label">My Trips</span><span class="radial-icon">🧳</span></a>
  <a id="sharedNavPlaces" class="radial-item nav-places"><span class="radial-label">Places</span><span class="radial-icon">📍</span></a>

  <div class="radial-utility">
    <button id="sharedSwitchTrip" class="utility-btn" type="button">⇄ SWITCH TRIP</button>
    <button id="sharedLogout" class="utility-btn" type="button">LOG OUT</button>
  </div>

  <button id="radialToggle" class="radial-toggle" type="button" aria-label="Open menu" aria-expanded="false">
    <img data-icon="more" alt="">
    <span class="x">×</span>
  </button>
</nav>

<div id="tripBackdrop" class="trip-backdrop">
  <div class="trip-sheet">
    <div class="trip-handle"></div>
    <div class="trip-head"><div class="trip-title">Switch Trip</div><button id="tripClose" class="trip-close" type="button">×</button></div>
    <div id="tripList" class="trip-list"></div>
  </div>
</div>
