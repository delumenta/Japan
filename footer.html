<!-- =========================================================
     SHARED FOOTER
========================================================= -->

<style>

/* =========================================================
   FOOTER VARIABLES
========================================================= */

:root{
  --footer-bg:#070c10;
  --footer-panel:#10171d;
  --footer-panel2:#151d23;

  --footer-line:#29323b;

  --footer-text:#f5f5f3;
  --footer-muted:#8b969e;

  --footer-red:#c96f68;
}


/* =========================================================
   BOTTOM NAV
========================================================= */

.shared-bottom-nav{
  position:fixed;

  left:0;
  right:0;
  bottom:0;

  z-index:800;

  display:grid;
  grid-template-columns:repeat(5,1fr);

  gap:3px;

  padding:
    6px
    7px
    calc(6px + env(safe-area-inset-bottom));

  border-top:1px solid var(--footer-line);

  background:rgba(7,12,16,.97);

  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
}


.shared-bottom-nav a,
.shared-bottom-nav button{
  min-height:46px;

  display:flex;
  flex-direction:column;

  align-items:center;
  justify-content:center;

  gap:2px;

  border:0;
  border-radius:10px;

  background:transparent;

  color:var(--footer-muted);

  text-decoration:none;

  font-size:8px;
  font-weight:800;

  cursor:pointer;
}


.footer-nav-icon{
  font-size:16px;
}


.shared-bottom-nav .active{
  color:#fff;

  border:
    1px solid
    rgba(201,111,104,.22);

  background:
    rgba(201,111,104,.08);
}


/* =========================================================
   FAN OVERLAY
========================================================= */

.footer-fan-overlay{
  position:fixed;

  inset:0;

  z-index:1200;

  display:none;

  background:
    rgba(3,7,10,.92);

  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
}


.footer-fan-overlay.open{
  display:block;
}


/* =========================================================
   FAN STAGE
========================================================= */

.footer-fan-stage{
  position:absolute;

  left:50%;
  top:50%;

  width:min(560px,96vw);
  height:min(610px,78vh);

  transform:
    translate(-50%,-50%);
}


/* =========================================================
   FAN ITEM
========================================================= */

.fan-item{
  position:absolute;

  display:flex;

  align-items:center;

  gap:10px;

  color:#fff;

  text-decoration:none;

  cursor:pointer;

  transition:
    transform .22s ease,
    opacity .22s ease;
}


.fan-item:hover{
  transform:scale(1.04);
}


.fan-circle{
  width:68px;
  height:68px;

  flex:0 0 68px;

  display:flex;

  align-items:center;
  justify-content:center;

  border:
    1px solid
    #34414a;

  border-radius:50%;

  background:
    radial-gradient(
      circle at 40% 30%,
      #18232b,
      #10171d
    );

  box-shadow:
    0 10px 24px
    rgba(0,0,0,.30);

  font-size:27px;
}


.fan-label{
  min-width:108px;

  padding:
    8px
    12px;

  border:
    1px solid
    #263039;

  border-radius:999px;

  background:
    rgba(7,12,16,.93);

  color:#f2f2f0;

  font-size:11px;
  font-weight:900;

  text-align:center;

  white-space:nowrap;
}


/* =========================================================
   LEFT SIDE ITEMS
========================================================= */

.fan-item.left{
  flex-direction:row-reverse;
}


.fan-item.left .fan-label{
  text-align:center;
}


/* =========================================================
   ACTIVE FAN ITEM
========================================================= */

.fan-item.active .fan-circle{
  border-color:
    rgba(201,111,104,.70);

  background:
    rgba(201,111,104,.10);

  box-shadow:
    0 0 26px
    rgba(201,111,104,.12);
}


.fan-item.active .fan-label{
  border-color:
    rgba(201,111,104,.65);

  color:#f0aaa4;
}


/* =========================================================
   FAN POSITIONS

   Everything is positioned around
   the CENTER of the screen.
========================================================= */


/* TOP */

.fan-places{
  left:50%;
  top:0;

  transform:
    translateX(-50%);
}


/* UPPER LEFT */

.fan-trips{
  left:8%;
  top:13%;
}


/* UPPER RIGHT */

.fan-profile{
  right:8%;
  top:18%;
}


/* LEFT */

.fan-map{
  left:0;
  top:39%;
}


/* RIGHT */

.fan-expenses{
  right:0;
  top:39%;
}


/* LOWER LEFT */

.fan-booking{
  left:8%;
  top:62%;
}


/* LOWER RIGHT */

.fan-food{
  right:8%;
  top:62%;
}


/* BOTTOM LEFT */

.fan-plan{
  left:20%;
  bottom:0;
}


/* BOTTOM RIGHT */

.fan-home{
  right:20%;
  bottom:0;
}


/* =========================================================
   CENTER CLOSE BUTTON
========================================================= */

.footer-fan-close{
  position:absolute;

  left:50%;
  top:50%;

  width:82px;
  height:82px;

  transform:
    translate(-50%,-50%);

  display:flex;

  align-items:center;
  justify-content:center;

  border:
    1px solid
    rgba(201,111,104,.65);

  border-radius:50%;

  background:
    #11181e;

  color:#ff625b;

  font-size:36px;

  cursor:pointer;

  box-shadow:
    0 0 35px
    rgba(201,111,104,.08);
}


/* =========================================================
   SMALL ACTIONS
========================================================= */

.footer-fan-actions{
  position:absolute;

  left:50%;
  bottom:-64px;

  transform:
    translateX(-50%);

  display:flex;

  gap:8px;

  white-space:nowrap;
}


.footer-fan-small{
  min-height:36px;

  padding:
    7px
    13px;

  border:
    1px solid
    #29343d;

  border-radius:999px;

  background:#10171d;

  color:#aeb6bb;

  font-size:8px;
  font-weight:900;

  cursor:pointer;
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:600px){

  .footer-fan-stage{
    width:96vw;
    height:66vh;
  }


  .fan-circle{
    width:56px;
    height:56px;

    flex-basis:56px;

    font-size:22px;
  }


  .fan-label{
    min-width:84px;

    padding:
      7px
      9px;

    font-size:9px;
  }


  .footer-fan-close{
    width:72px;
    height:72px;

    font-size:31px;
  }


  .fan-trips{
    left:2%;
  }


  .fan-profile{
    right:2%;
  }


  .fan-booking{
    left:2%;
  }


  .fan-food{
    right:2%;
  }


  .fan-plan{
    left:12%;
  }


  .fan-home{
    right:12%;
  }

}


/* =========================================================
   DESKTOP FOOTER WIDTH
========================================================= */

@media(min-width:800px){

  .shared-bottom-nav{
    left:50%;
    right:auto;

    width:min(820px,100%);

    transform:
      translateX(-50%);
  }

}

</style>
