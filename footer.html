<!-- =========================================================
     SHARED FOOTER
     Loaded by footer.js
========================================================= -->

<style>
:root{
  --footer-bg:#070c10;
  --footer-panel:#10161c;
  --footer-line:#29323b;
  --footer-text:#f5f5f3;
  --footer-muted:#aeb5bc;
  --footer-red:#c96f68;
  --footer-blue:#5c9dff;
}

/* Prevent page content from sitting behind the fixed footer */
body{
  padding-bottom:calc(72px + env(safe-area-inset-bottom));
}

/* =========================================================
   BOTTOM NAV
========================================================= */

.bottom-nav{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  z-index:80;

  display:grid;
  grid-template-columns:repeat(5,1fr);

  padding:
    7px
    8px
    calc(7px + env(safe-area-inset-bottom));

  border-top:1px solid var(--footer-line);

  background:rgba(7,12,16,.98);

  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
}

.bottom-nav a,
.bottom-nav button{
  min-height:47px;

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:2px;

  border:0;
  border-radius:10px;

  background:transparent;
  color:var(--footer-muted);

  text-decoration:none;

  font:inherit;
  font-size:8px;
  font-weight:800;

  cursor:pointer;
}

.bottom-nav .nav-icon{
  font-size:16px;
  line-height:1;
}

.bottom-nav .active{
  color:#fff;

  border:1px solid rgba(201,111,104,.24);

  background:rgba(201,111,104,.09);
}

/* =========================================================
   SHEETS
========================================================= */

.footer-sheet-backdrop{
  position:fixed;
  inset:0;
  z-index:150;

  display:none;
  align-items:flex-end;

  background:rgba(0,0,0,.68);

  backdrop-filter:blur(4px);
  -webkit-backdrop-filter:blur(4px);
}

.footer-sheet-backdrop.open{
  display:flex;
}

.footer-sheet{
  width:100%;
  max-width:760px;

  max-height:calc(92vh - env(safe-area-inset-top));
  overflow-y:auto;

  margin:0 auto;

  padding:
    8px
    14px
    calc(18px + env(safe-area-inset-bottom));

  border:1px solid var(--footer-line);
  border-radius:20px 20px 0 0;

  background:#0d1318;
  color:var(--footer-text);
}

.footer-sheet-handle{
  width:38px;
  height:4px;

  margin:2px auto 12px;

  border-radius:999px;

  background:#39454d;
}

.footer-sheet-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;

  margin-bottom:12px;
}

.footer-sheet-title{
  font-family:Georgia,"Times New Roman",serif;
  font-size:19px;
}

.footer-sheet-close{
  width:34px;
  height:34px;

  border:1px solid var(--footer-line);
  border-radius:9px;

  background:#151c22;
  color:#fff;

  font:inherit;
  cursor:pointer;
}

/* =========================================================
   MORE
========================================================= */

.footer-more-link{
  width:100%;
  min-height:58px;

  display:flex;
  align-items:center;
  gap:10px;

  padding:9px 10px;
  margin-bottom:6px;

  border:1px solid var(--footer-line);
  border-radius:11px;

  background:#11181e;
  color:#fff;

  text-decoration:none;
  text-align:left;

  font:inherit;
  cursor:pointer;
}

.footer-more-icon{
  flex:0 0 31px;

  font-size:18px;
  text-align:center;
}

.footer-more-main{
  flex:1;
  min-width:0;
}

.footer-more-title{
  font-size:9px;
  font-weight:900;
}

.footer-more-sub{
  margin-top:2px;

  color:#7f8b93;

  font-size:6.5px;
  line-height:1.4;
}

.footer-more-arrow{
  color:#8d9aa2;
  font-size:12px;
}

/* =========================================================
   TRIP SWITCHER
========================================================= */

.footer-trip-list{
  display:flex;
  flex-direction:column;
  gap:7px;
}

.footer-trip-card{
  width:100%;
  min-height:70px;

  display:flex;
  align-items:center;
  gap:10px;

  padding:10px;

  border:1px solid var(--footer-line);
  border-radius:12px;

  background:#11181e;
  color:#fff;

  text-decoration:none;
}

.footer-trip-card.current{
  border-color:rgba(201,111,104,.55);
  background:rgba(201,111,104,.09);
}

.footer-trip-icon{
  flex:0 0 36px;

  font-size:21px;
  text-align:center;
}

.footer-trip-main{
  flex:1;
  min-width:0;
}

.footer-trip-name{
  font-size:9px;
  font-weight:900;
  line-height:1.3;
}

.footer-trip-meta{
  margin-top:3px;

  color:#87949c;

  font-size:6.5px;
  line-height:1.4;
}

.footer-trip-role{
  display:inline-block;

  margin-top:4px;
  padding:2px 5px;

  border:1px solid rgba(92,157,255,.22);
  border-radius:999px;

  color:#8ab9ff;

  font-size:5.5px;
  font-weight:900;
}

.footer-trip-card.current .footer-trip-role{
  border-color:rgba(201,111,104,.28);
  color:#e7aaa5;
}

.footer-trip-arrow{
  color:#7f8b93;
  font-size:13px;
}

.footer-trip-message{
  padding:18px 10px;

  color:#7f8b93;

  font-size:8px;
  text-align:center;
  line-height:1.5;
}

.footer-trip-message.error{
  color:#ffc5c1;
}

/* =========================================================
   DESKTOP
========================================================= */

@media(min-width:700px){

  .footer-sheet{
    max-width:620px;
  }

  .bottom-nav{
    left:50%;
    right:auto;

    width:min(820px,100%);

    transform:translateX(-50%);

    border-left:1px solid var(--footer-line);
    border-right:1px solid var(--footer-line);

    border-radius:16px 16px 0 0;
  }

}
</style>
