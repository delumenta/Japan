<!-- =========================================================
     SHARED FOOTER — FLOATING PILL
========================================================= -->

<style>
:root{
  --footer-bg:#070c10;
  --footer-panel:#10161c;
  --footer-line:#29323b;
  --footer-text:#f5f5f3;
  --footer-muted:#8b959c;
  --footer-red:#ff625f;
}

body{
  padding-bottom: calc(88px + env(safe-area-inset-bottom));
}

.bottom-nav{
  position: fixed;
  z-index: 80;
  left: 50%;
  bottom: calc(12px + env(safe-area-inset-bottom));
  transform: translateX(-50%);

  width: min(520px, calc(100% - 28px));

  display: grid;
  grid-template-columns: repeat(6, 1fr);
  align-items: center;
  gap: 2px;

  padding: 6px 7px;

  border: 1px solid rgba(255,255,255,.08);
  border-radius: 999px;

  background: rgba(12, 18, 23, .82);
  backdrop-filter: blur(22px) saturate(1.2);
  -webkit-backdrop-filter: blur(22px) saturate(1.2);

  box-shadow:
    0 18px 40px rgba(0,0,0,.38),
    inset 0 1px 0 rgba(255,255,255,.06);
}

.bottom-nav a,
.bottom-nav button{
  min-width: 0;
  height: 58px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  padding: 0;
  border: 0;
  border-radius: 999px;
  background: transparent;
  color: var(--footer-muted);
  text-decoration: none;
  font: inherit;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

.bottom-nav .nav-icon{
  width: 28px;
  height: 28px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: none;
  border: 0;
  box-shadow: none;
}

.bottom-nav .nav-icon img{
  display: block;
  width: 24px;
  height: 24px;
  object-fit: contain;
  opacity: .78;
  transition: transform .18s ease, opacity .18s ease, filter .18s ease;
}

#sharedNavHub .nav-icon img{ width: 20px; height: 20px; }

.bottom-nav .nav-label{
  font-size: 7px;
  font-weight: 800;
  letter-spacing: .06em;
  line-height: 1;
  white-space: nowrap;
}

.bottom-nav a.active,
.bottom-nav button.active{
  color: var(--footer-red);
  background: rgba(255,98,95,.12);
}

.bottom-nav a.active .nav-icon img,
.bottom-nav button.active .nav-icon img{
  opacity: 1;
  transform: scale(1.06);
  filter: brightness(1.1) saturate(1.15);
}

.bottom-nav a.active .nav-label,
.bottom-nav button.active .nav-label{
  color: #ff8b88;
}

@media (hover:hover){
  .bottom-nav a:hover .nav-icon img,
  .bottom-nav button:hover .nav-icon img{
    opacity: 1;
    transform: translateY(-1px);
  }
  .bottom-nav a:hover .nav-label,
  .bottom-nav button:hover .nav-label{
    color: #dfe4e7;
  }
  .bottom-nav a.active:hover .nav-label,
  .bottom-nav button.active:hover .nav-label{
    color: #ff8b88;
  }
}

.bottom-nav a:active .nav-icon,
.bottom-nav button:active .nav-icon{
  transform: scale(.92);
}

/* sheets — unchanged behaviour */
.footer-sheet-backdrop{
  position: fixed;
  inset: 0;
  z-index: 150;
  display: none;
  align-items: flex-end;
  background: rgba(0,0,0,.68);
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
}
.footer-sheet-backdrop.open{ display: flex; }

.footer-sheet{
  width: 100%;
  max-width: 620px;
  max-height: calc(92vh - env(safe-area-inset-top));
  overflow-y: auto;
  margin: 0 auto;
  padding: 8px 14px calc(18px + env(safe-area-inset-bottom));
  border: 1px solid var(--footer-line);
  border-radius: 20px 20px 0 0;
  background: #0d1318;
  color: var(--footer-text);
}
.footer-sheet-handle{
  width: 38px; height: 4px;
  margin: 2px auto 12px;
  border-radius: 999px;
  background: #39454d;
}
.footer-sheet-head{
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 12px;
}
.footer-sheet-title{
  font-family: Georgia, "Times New Roman", serif;
  font-size: 19px;
}
.footer-sheet-close{
  width: 34px; height: 34px;
  border: 1px solid var(--footer-line);
  border-radius: 9px;
  background: #151c22;
  color: #fff;
  font: inherit;
  cursor: pointer;
}
.footer-more-link{
  width: 100%;
  min-height: 58px;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 10px;
  margin-bottom: 6px;
  border: 1px solid var(--footer-line);
  border-radius: 11px;
  background: #11181e;
  color: #fff;
  text-decoration: none;
  text-align: left;
  font: inherit;
  cursor: pointer;
}
.footer-more-link:hover{
  border-color: #39454d;
  background: #141c22;
}
.footer-more-link.current{
  border-color: rgba(255,98,95,.30);
  background: rgba(255,98,95,.065);
}
.footer-more-icon{ flex: 0 0 31px; font-size: 18px; text-align: center; }
.footer-more-main{ flex: 1; min-width: 0; }
.footer-more-title{ font-size: 9px; font-weight: 900; }
.footer-more-sub{ margin-top: 2px; color: #7f8b93; font-size: 6.5px; line-height: 1.4; }
.footer-more-arrow{ color: #8d9aa2; font-size: 12px; }
.footer-more-separator{ height: 1px; margin: 11px 2px; background: var(--footer-line); }
.footer-more-link.logout{
  border-color: rgba(201,111,104,.28);
  background: rgba(201,111,104,.055);
}
.footer-more-link.logout .footer-more-title{ color: #efa39d; }
.footer-more-link.logout:disabled{ opacity: .55; cursor: wait; }

.footer-trip-list{ display: flex; flex-direction: column; gap: 7px; }
.footer-trip-card{
  width: 100%;
  min-height: 70px;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px;
  border: 1px solid var(--footer-line);
  border-radius: 12px;
  background: #11181e;
  color: #fff;
  text-decoration: none;
}
.footer-trip-card.current{
  border-color: rgba(201,111,104,.55);
  background: rgba(201,111,104,.09);
}
.footer-trip-icon{ flex: 0 0 36px; font-size: 21px; text-align: center; }
.footer-trip-main{ flex: 1; min-width: 0; }
.footer-trip-name{ font-size: 9px; font-weight: 900; line-height: 1.3; }
.footer-trip-meta{ margin-top: 3px; color: #87949c; font-size: 6.5px; line-height: 1.4; }
.footer-trip-role{
  display: inline-block;
  margin-top: 4px;
  padding: 2px 5px;
  border: 1px solid rgba(92,157,255,.22);
  border-radius: 999px;
  color: #8ab9ff;
  font-size: 5.5px;
  font-weight: 900;
}
.footer-trip-card.current .footer-trip-role{
  border-color: rgba(201,111,104,.28);
  color: #e7aaa5;
}
.footer-trip-arrow{ color: #7f8b93; font-size: 13px; }
.footer-trip-message{ padding: 18px 10px; color: #7f8b93; font-size: 8px; text-align: center; line-height: 1.5; }
.footer-trip-message.error{ color: #ffc5c1; }

@media (max-width: 390px){
  .bottom-nav{ width: calc(100% - 16px); padding: 5px; }
  .bottom-nav .nav-label{ font-size: 6.5px; }
}
</style>
