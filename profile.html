<!doctype html>
<html lang="en">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1, viewport-fit=cover"
>

<meta name="theme-color" content="#070c10">

<title>Profile & Sharing · Travel</title>


<style>

:root{
  --bg:#070c10;
  --panel:#10161c;
  --panel2:#151c23;
  --line:#29323b;
  --text:#f5f5f3;
  --muted:#aeb5bc;
  --muted2:#75828b;
  --red:#c96f68;
  --green:#67c587;
  --blue:#5c9dff;
  --gold:#e3b85c;
}

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;

  min-height:100vh;

  background:
    radial-gradient(
      circle at 50% -10%,
      #17212a 0%,
      transparent 38%
    ),
    var(--bg);

  color:var(--text);

  font-family:
    Inter,
    ui-sans-serif,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
}

button,
input,
select{
  font:inherit;
}

button{
  cursor:pointer;
}


/* =========================================================
   HEADER
========================================================= */

header{
  position:sticky;

  top:0;

  z-index:40;

  padding:
    calc(11px + env(safe-area-inset-top))
    14px
    10px;

  border-bottom:
    1px solid var(--line);

  background:
    rgba(7,12,16,.96);

  backdrop-filter:
    blur(18px);

  -webkit-backdrop-filter:
    blur(18px);
}

.header-inner{
  max-width:760px;

  margin:auto;
}

.eyebrow{
  color:var(--red);

  font-size:8px;
  font-weight:900;

  letter-spacing:.14em;
}

h1{
  margin:
    3px
    0
    0;

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-size:24px;
}

.header-sub{
  margin-top:3px;

  color:var(--muted);

  font-size:8px;
}


/* =========================================================
   MAIN
========================================================= */

main{
  max-width:760px;

  margin:auto;

  padding:
    13px
    13px
    30px;
}

.section-label{
  margin:
    18px
    2px
    7px;

  color:#91a5b3;

  font-size:7px;
  font-weight:900;

  letter-spacing:.13em;
}

.section-label:first-child{
  margin-top:2px;
}


/* =========================================================
   PROFILE
========================================================= */

.profile-card{
  padding:12px;

  border:
    1px solid
    var(--line);

  border-radius:15px;

  background:
    linear-gradient(
      145deg,
      #151d23,
      #0e1419
    );
}

.profile-top{
  display:flex;

  align-items:center;

  gap:11px;
}

.avatar{
  flex:0 0 45px;

  width:45px;
  height:45px;

  display:flex;

  align-items:center;
  justify-content:center;

  overflow:hidden;

  border:
    1px solid
    #35414a;

  border-radius:50%;

  background:#1a232a;

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-size:18px;
  font-weight:800;
}

.avatar img{
  width:100%;
  height:100%;

  object-fit:cover;
}

.profile-info{
  flex:1;

  min-width:0;
}

.profile-name{
  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-size:16px;
  font-weight:800;
}

.profile-email{
  margin-top:2px;

  overflow:hidden;

  color:var(--muted);

  font-size:7px;

  text-overflow:ellipsis;
  white-space:nowrap;
}

.account-role{
  margin-top:4px;

  color:#7f8c94;

  font-size:6px;
  font-weight:900;

  letter-spacing:.08em;

  text-transform:uppercase;
}

.edit-profile{
  min-height:32px;

  padding:
    5px
    9px;

  border:
    1px solid
    var(--line);

  border-radius:8px;

  background:#151d23;

  color:#cbd1d5;

  font-size:7px;
  font-weight:900;
}


/* =========================================================
   USER ID
========================================================= */

.user-id-box{
  display:flex;

  align-items:center;

  gap:8px;

  margin-top:11px;

  padding:
    8px
    9px;

  border:
    1px solid
    rgba(92,157,255,.18);

  border-radius:10px;

  background:
    rgba(92,157,255,.045);
}

.user-id-info{
  flex:1;

  min-width:0;
}

.user-id-label{
  color:#7f9ab3;

  font-size:6px;
  font-weight:900;

  letter-spacing:.1em;
}

.user-id-value{
  margin-top:3px;

  overflow:hidden;

  color:#cbd8e3;

  font-family:
    ui-monospace,
    SFMono-Regular,
    Menlo,
    monospace;

  font-size:7px;

  text-overflow:ellipsis;
  white-space:nowrap;
}

.copy-id-btn{
  min-width:55px;
  min-height:30px;

  padding:
    5px
    8px;

  border:
    1px solid
    rgba(92,157,255,.25);

  border-radius:8px;

  background:
    rgba(92,157,255,.07);

  color:#a9caff;

  font-size:7px;
  font-weight:900;
}


/* =========================================================
   TRIP
========================================================= */

.trip-card{
  padding:12px;

  border:
    1px solid
    rgba(201,111,104,.30);

  border-radius:15px;

  background:
    linear-gradient(
      145deg,
      rgba(201,111,104,.07),
      #10161c 55%
    );
}

.trip-top{
  display:flex;

  align-items:flex-start;
  justify-content:space-between;

  gap:8px;
}

.trip-name{
  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-size:17px;
}

.trip-country{
  margin-top:3px;

  color:#8f9ba3;

  font-size:7px;
}

.trip-dates{
  margin-top:3px;

  color:var(--muted);

  font-size:7px;
}

.trip-status-row{
  display:flex;

  flex-wrap:wrap;

  gap:5px;

  margin-top:8px;
}

.role-pill,
.public-pill{
  display:inline-flex;

  align-items:center;

  padding:
    4px
    7px;

  border-radius:999px;

  font-size:6px;
  font-weight:900;
}

.role-pill.owner{
  border:
    1px solid
    rgba(227,184,92,.25);

  background:
    rgba(227,184,92,.08);

  color:#e7c97d;
}

.role-pill.editor{
  border:
    1px solid
    rgba(103,197,135,.25);

  background:
    rgba(103,197,135,.08);

  color:#afe3bf;
}

.role-pill.viewer{
  border:
    1px solid
    rgba(92,157,255,.25);

  background:
    rgba(92,157,255,.08);

  color:#aacbff;
}

.public-pill{
  border:
    1px solid
    rgba(103,197,135,.22);

  background:
    rgba(103,197,135,.07);

  color:#afe3bf;
}

.trip-actions{
  display:grid;

  grid-template-columns:
    1fr
    1fr;

  gap:6px;

  margin-top:11px;
}

.trip-action{
  min-height:37px;

  display:flex;

  align-items:center;
  justify-content:center;

  border:
    1px solid
    var(--line);

  border-radius:9px;

  background:#151d23;

  color:#cbd1d5;

  text-decoration:none;

  font-size:7px;
  font-weight:900;
}

.trip-action.primary{
  border-color:
    rgba(201,111,104,.30);

  background:
    rgba(201,111,104,.07);

  color:#efaaa5;
}


/* =========================================================
   MEMBERS
========================================================= */

.member-list{
  overflow:hidden;

  border:
    1px solid
    var(--line);

  border-radius:14px;

  background:#10161c;
}

.member{
  display:flex;

  align-items:center;

  gap:9px;

  min-height:57px;

  padding:
    8px
    10px;

  border-bottom:
    1px solid
    rgba(255,255,255,.055);
}

.member:last-child{
  border-bottom:0;
}

.member-avatar{
  flex:0 0 34px;

  width:34px;
  height:34px;

  display:flex;

  align-items:center;
  justify-content:center;

  overflow:hidden;

  border:
    1px solid
    #34404a;

  border-radius:50%;

  background:#182129;

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-size:12px;
  font-weight:800;
}

.member-avatar img{
  width:100%;
  height:100%;

  object-fit:cover;
}

.member-info{
  flex:1;

  min-width:0;
}

.member-name{
  font-size:9px;
  font-weight:900;
}

.member-access{
  margin-top:2px;

  color:#7e8a92;

  font-size:6.5px;
}

.role-badge{
  padding:
    4px
    7px;

  border-radius:999px;

  font-size:6px;
  font-weight:900;
}

.role-badge.owner{
  color:#e4c67c;

  background:
    rgba(227,184,92,.07);

  border:
    1px solid
    rgba(227,184,92,.22);
}

.role-badge.editor{
  color:#aee5bf;

  background:
    rgba(103,197,135,.07);

  border:
    1px solid
    rgba(103,197,135,.22);
}

.role-badge.viewer{
  color:#a8caff;

  background:
    rgba(92,157,255,.07);

  border:
    1px solid
    rgba(92,157,255,.22);
}

.member-menu{
  width:30px;
  height:30px;

  border:0;
  border-radius:7px;

  background:transparent;

  color:#87939b;
}

.share-button{
  width:100%;

  min-height:43px;

  margin-top:8px;

  border:
    1px solid
    rgba(201,111,104,.32);

  border-radius:11px;

  background:
    rgba(201,111,104,.09);

  color:#f0cfcc;

  font-size:8px;
  font-weight:900;
}

.permission-note{
  margin-top:8px;

  padding:
    9px
    10px;

  border:
    1px solid
    var(--line);

  border-radius:10px;

  background:
    rgba(255,255,255,.018);

  color:#79868e;

  font-size:7px;
  line-height:1.55;
}

.permission-note strong{
  color:#b7c0c5;
}


/* =========================================================
   NO TRIP
========================================================= */

.no-trip{
  padding:
    16px
    12px;

  border:
    1px dashed
    #35414a;

  border-radius:14px;

  background:#0e1419;

  text-align:center;
}

.no-trip-icon{
  font-size:25px;
}

.no-trip-title{
  margin-top:6px;

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-size:15px;
}

.no-trip-text{
  max-width:380px;

  margin:
    5px
    auto
    0;

  color:#7f8b93;

  font-size:7px;
  line-height:1.55;
}

.trip-button{
  width:100%;

  min-height:42px;

  display:flex;

  align-items:center;
  justify-content:center;

  margin-top:10px;

  border:
    1px solid
    rgba(201,111,104,.25);

  border-radius:10px;

  background:
    rgba(201,111,104,.07);

  color:#efaaa5;

  text-decoration:none;

  font-size:8px;
  font-weight:900;
}


/* =========================================================
   SHEETS
========================================================= */

.backdrop{
  position:fixed;

  inset:0;

  display:none;

  align-items:flex-end;

  background:
    rgba(0,0,0,.72);

  backdrop-filter:
    blur(4px);

  -webkit-backdrop-filter:
    blur(4px);
}

.backdrop{
  z-index:120;
}

.backdrop.open{
  display:flex;
}

.sheet{
  width:100%;

  max-height:90vh;

  overflow:auto;

  padding:
    8px
    14px
    calc(18px + env(safe-area-inset-bottom));

  border:
    1px solid
    var(--line);

  border-radius:
    20px
    20px
    0
    0;

  background:#0d1318;
}

.sheet{
  max-width:600px;

  margin:auto;
}

.handle{
  width:38px;
  height:4px;

  margin:
    2px
    auto
    13px;

  border-radius:999px;

  background:#39454d;
}

.sheet-head{
  display:flex;

  align-items:center;
  justify-content:space-between;

  gap:10px;

  margin-bottom:13px;
}

.sheet-title{
  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-size:19px;
}

.close{
  width:34px;
  height:34px;

  border:
    1px solid
    var(--line);

  border-radius:9px;

  background:#151c22;

  color:#fff;
}


/* =========================================================
   FORMS
========================================================= */

.field{
  margin-bottom:10px;
}

.field label{
  display:block;

  margin-bottom:4px;

  color:#aeb5bc;

  font-size:7px;
  font-weight:900;
}

.field input,
.field select{
  width:100%;

  min-height:43px;

  padding:
    8px
    10px;

  border:
    1px solid
    var(--line);

  border-radius:9px;

  outline:none;

  background:#10171d;

  color:#fff;

  font-size:10px;
}

.field input:focus,
.field select:focus{
  border-color:var(--red);
}

.help{
  margin-top:5px;

  color:#74818a;

  font-size:7px;
  line-height:1.45;
}

.primary,
.danger{
  width:100%;

  min-height:44px;

  margin-top:4px;

  border-radius:10px;

  font-size:8px;
  font-weight:900;
}

.primary{
  border:
    1px solid
    rgba(103,197,135,.30);

  background:
    rgba(103,197,135,.10);

  color:#b6e9c6;
}

.danger{
  border:
    1px solid
    rgba(201,111,104,.25);

  background:
    rgba(201,111,104,.05);

  color:#df938c;
}

.primary:disabled,
.danger:disabled{
  opacity:.5;
}

.message{
  display:none;

  margin-top:9px;

  padding:8px;

  border-radius:8px;

  font-size:7px;
}

.message.error{
  display:block;

  border:
    1px solid
    rgba(201,111,104,.25);

  background:
    rgba(201,111,104,.07);

  color:#ffc3bf;
}


/* =========================================================
   STATE
========================================================= */

.state{
  padding:
    24px
    15px;

  border:
    1px dashed
    #35414a;

  border-radius:13px;

  color:var(--muted);

  text-align:center;

  font-size:8px;
  line-height:1.55;
}

.state strong{
  display:block;

  margin-bottom:4px;

  color:#fff;

  font-size:11px;
}


</style>

</head>


<body>


<!-- =========================================================
     HEADER
========================================================= -->

<header>

  <div class="header-inner">

    <div class="eyebrow">
      ACCOUNT
    </div>

    <h1>
      👤 Profile & Sharing
    </h1>

    <div
      id="headerSub"
      class="header-sub"
    >
      Loading profile…
    </div>

  </div>

</header>



<!-- =========================================================
     MAIN
========================================================= -->

<main id="main">

  <div class="state">

    <strong>
      Loading profile…
    </strong>

    Getting your account details.

  </div>

</main>



<!-- =========================================================
     EDIT PROFILE
========================================================= -->

<div
  id="profileSheet"
  class="backdrop"
>

  <div class="sheet">

    <div class="handle"></div>


    <div class="sheet-head">

      <div class="sheet-title">
        Edit Profile
      </div>

      <button
        class="close"
        type="button"
        data-close
      >
        ✕
      </button>

    </div>


    <form id="profileForm">

      <div class="field">

        <label>
          DISPLAY NAME
        </label>

        <input
          id="profileName"
          maxlength="60"
          required
          placeholder="Your name"
        >

      </div>


      <div class="field">

        <label>
          AVATAR IMAGE URL
        </label>

        <input
          id="profileAvatar"
          type="url"
          placeholder="https://..."
        >

      </div>


      <button
        id="saveProfile"
        class="primary"
        type="submit"
      >
        SAVE PROFILE
      </button>


      <div
        id="profileMessage"
        class="message"
      ></div>

    </form>

  </div>

</div>



<!-- =========================================================
     ADD MEMBER
========================================================= -->

<div
  id="memberSheet"
  class="backdrop"
>

  <div class="sheet">

    <div class="handle"></div>


    <div class="sheet-head">

      <div class="sheet-title">
        Add Person
      </div>

      <button
        class="close"
        type="button"
        data-close
      >
        ✕
      </button>

    </div>


    <form id="memberForm">

      <div class="field">

        <label>
          USER ID
        </label>

        <input
          id="memberUserId"
          required
          placeholder="Supabase User UUID"
          autocomplete="off"
        >


        <div class="help">

          Ask the person to open Profile
          and press COPY beside their User ID.

        </div>

      </div>


      <div class="field">

        <label>
          ACCESS
        </label>

        <select id="memberRole">

          <option value="viewer">
            👁️ Viewer · can view
          </option>

          <option value="editor">
            ✏️ Editor · can view and edit
          </option>

        </select>

      </div>


      <button
        id="addMemberButton"
        class="primary"
        type="submit"
      >
        ADD TO TRIP
      </button>


      <div
        id="memberMessage"
        class="message"
      ></div>

    </form>

  </div>

</div>



<!-- =========================================================
     EDIT MEMBER
========================================================= -->

<div
  id="editMemberSheet"
  class="backdrop"
>

  <div class="sheet">

    <div class="handle"></div>


    <div class="sheet-head">

      <div class="sheet-title">
        Member Access
      </div>

      <button
        class="close"
        type="button"
        data-close
      >
        ✕
      </button>

    </div>


    <div class="field">

      <label>
        PERSON
      </label>

      <input
        id="editMemberName"
        disabled
      >

    </div>


    <div class="field">

      <label>
        ACCESS
      </label>

      <select id="editMemberRole">

        <option value="viewer">
          👁️ Viewer · can view
        </option>

        <option value="editor">
          ✏️ Editor · can view and edit
        </option>

      </select>

    </div>


    <button
      id="saveMemberRole"
      class="primary"
      type="button"
    >
      SAVE ACCESS
    </button>


    <button
      id="removeMember"
      class="danger"
      type="button"
    >
      REMOVE FROM TRIP
    </button>


    <div
      id="editMemberMessage"
      class="message"
    ></div>

  </div>

</div>



<!-- =========================================================
     SHARED FOOTER
========================================================= -->

<div id="footer"></div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>


<script>

/* =========================================================
   STATE
========================================================= */

let currentUser = null;

let profile = null;

let trip = null;

let ownerProfile = null;

let members = [];

let accessibleTrips = [];

let currentTripId = null;

let myRole = null;

let editingMemberId = null;

let publication = null;


/* =========================================================
   HELPERS
========================================================= */

function esc(value){

  return String(
    value ?? ""
  )

  .replaceAll("&","&amp;")
  .replaceAll("<","&lt;")
  .replaceAll(">","&gt;")
  .replaceAll('"',"&quot;")
  .replaceAll("'","&#039;");

}


function norm(value){

  return String(
    value ?? ""
  )
  .trim()
  .toLowerCase();

}


function initials(name){

  const words =
    String(
      name || "?"
    )
    .trim()
    .split(/\s+/)
    .filter(Boolean);


  if(!words.length){

    return "?";

  }


  if(words.length === 1){

    return words[0]
      .slice(
        0,
        2
      )
      .toUpperCase();

  }


  return (
    words[0][0]
    +
    words[
      words.length - 1
    ][0]
  )
  .toUpperCase();

}


function avatarHTML(
  person,
  cssClass
){

  const name =
    person?.display_name ||
    "User";


  if(person?.avatar_url){

    return `

      <div class="${cssClass}">

        <img
          src="${esc(
            person.avatar_url
          )}"
          alt="${esc(name)}"
        >

      </div>

    `;

  }


  return `

    <div class="${cssClass}">

      ${esc(
        initials(name)
      )}

    </div>

  `;

}


function isOwner(){

  return Boolean(
    trip &&
    currentUser &&
    trip.owner_id ===
    currentUser.id
  );

}


function normalizeRole(role){

  return (
    role === "editor"
    ?
    "editor"
    :
    "viewer"
  );

}


function countryEmoji(country){

  const value =
    norm(country);


  const map = {

    japan:"🇯🇵",

    singapore:"🇸🇬",

    malaysia:"🇲🇾",

    indonesia:"🇮🇩",

    thailand:"🇹🇭",

    vietnam:"🇻🇳",

    taiwan:"🇹🇼",

    china:"🇨🇳",

    korea:"🇰🇷",

    "south korea":"🇰🇷",

    france:"🇫🇷",

    italy:"🇮🇹",

    spain:"🇪🇸",

    uk:"🇬🇧",

    "united kingdom":"🇬🇧",

    usa:"🇺🇸",

    "united states":"🇺🇸"

  };


  return (
    map[value]
    ||
    "✈️"
  );

}


function prettyTripDates(){

  if(
    !trip?.start_date ||
    !trip?.end_date
  ){

    return "";

  }


  const start =
    new Date(
      trip.start_date +
      "T12:00:00"
    );


  const end =
    new Date(
      trip.end_date +
      "T12:00:00"
    );


  return (
    start.toLocaleDateString(
      "en-SG",
      {
        day:"numeric",
        month:"short"
      }
    )
    +
    " – "
    +
    end.toLocaleDateString(
      "en-SG",
      {
        day:"numeric",
        month:"short",
        year:"numeric"
      }
    )
  );

}

/* =========================================================
   ACCESSIBLE TRIPS
========================================================= */

async function getAccessibleTrips(){

  const ownResult =
    await db
      .from("trips")
      .select("*")
      .eq(
        "owner_id",
        currentUser.id
      );


  if(ownResult.error){

    throw ownResult.error;

  }


  const memberResult =
    await db
      .from("trip_members")
      .select(`
        trip_id,
        role
      `)
      .eq(
        "user_id",
        currentUser.id
      );


  if(memberResult.error){

    throw memberResult.error;

  }


  const memberships =
    memberResult.data || [];


  const sharedIds =
    [
      ...new Set(
        memberships
          .map(
            row =>
              Number(
                row.trip_id
              )
          )
          .filter(Boolean)
      )
    ];


  let sharedTrips = [];


  if(sharedIds.length){

    const sharedResult =
      await db
        .from("trips")
        .select("*")
        .in(
          "id",
          sharedIds
        );


    if(sharedResult.error){

      throw sharedResult.error;

    }


    sharedTrips =
      sharedResult.data || [];

  }


  const map =
    new Map();


  (ownResult.data || [])
    .filter(
      item =>
        item.status !==
        "deleted"
    )
    .forEach(
      item => {

        map.set(
          Number(
            item.id
          ),
          {
            ...item,
            access_role:"owner"
          }
        );

      }
    );


  sharedTrips
    .filter(
      item =>
        item.status !==
        "deleted"
    )
    .forEach(
      item => {

        const id =
          Number(
            item.id
          );


        if(map.has(id)){

          return;

        }


        const membership =
          memberships.find(
            row =>
              Number(
                row.trip_id
              ) ===
              id
          );


        map.set(
          id,
          {
            ...item,

            access_role:
              normalizeRole(
                membership?.role
              )
          }
        );

      }
    );


  return [
    ...map.values()
  ];

}


/* =========================================================
   FIND CURRENT TRIP
========================================================= */

async function findCurrentTrip(){

  trip = null;

  ownerProfile = null;

  members = [];

  myRole = null;

  publication = null;

  currentTripId = null;


  const params =
    new URLSearchParams(
      location.search
    );


  const urlTrip =
    Number(
      params.get(
        "trip"
      )
    ) || null;


  const savedTrip =
    Number(
      localStorage.getItem(
        "current_trip_id"
      )
    ) || null;


  const firstTrip =
    accessibleTrips[0]?.id
    ||
    null;


  const candidates =
    [
      urlTrip,
      savedTrip,
      firstTrip
    ]
    .map(Number)
    .filter(
      (value,index,array) =>
        Number.isFinite(value) &&
        value > 0 &&
        array.indexOf(value) ===
        index
    );


  for(
    const tripId
    of candidates
  ){

    const available =
      accessibleTrips.some(
        item =>
          Number(
            item.id
          ) ===
          Number(
            tripId
          )
      );


    if(!available){

      continue;

    }


    const found =
      await tryLoadTrip(
        tripId
      );


    if(found){

      currentTripId =
        Number(
          tripId
        );


      localStorage.setItem(
        "current_trip_id",
        String(
          currentTripId
        )
      );


      history.replaceState(
        null,
        "",
        `profile.html?trip=${currentTripId}`
      );


      return;

    }

  }


}


/* =========================================================
   LOAD TRIP
========================================================= */

async function tryLoadTrip(
  tripId
){

  const result =
    await db
      .from("trips")
      .select("*")
      .eq(
        "id",
        tripId
      )
      .maybeSingle();


  if(result.error){

    console.warn(
      result.error
    );

    return false;

  }


  if(!result.data){

    return false;

  }


  trip =
    result.data;


  if(
    trip.owner_id ===
    currentUser.id
  ){

    myRole =
      "owner";

  }


  else{

    const membership =
      await db
        .from("trip_members")
        .select(`
          id,
          role
        `)
        .eq(
          "trip_id",
          trip.id
        )
        .eq(
          "user_id",
          currentUser.id
        )
        .maybeSingle();


    if(
      membership.error ||
      !membership.data
    ){

      trip = null;

      return false;

    }


    myRole =
      normalizeRole(
        membership.data.role
      );

  }


  await loadTripPeople();

  await loadPublication();


  return true;

}

/* =========================================================
   TRIP PEOPLE
========================================================= */

async function loadTripPeople(){

  if(!trip){

    return;

  }


  const ownerResult =
    await db
      .from("profiles")
      .select(`
        id,
        display_name,
        avatar_url
      `)
      .eq(
        "id",
        trip.owner_id
      )
      .maybeSingle();


  if(!ownerResult.error){

    ownerProfile =
      ownerResult.data;

  }


  const memberResult =
    await db
      .from("trip_members")
      .select(`
        id,
        trip_id,
        user_id,
        role,
        created_at
      `)
      .eq(
        "trip_id",
        trip.id
      )
      .order(
        "created_at",
        {
          ascending:true
        }
      );


  if(memberResult.error){

    console.warn(
      memberResult.error
    );

    members = [];

    return;

  }


  const rawMembers =
    memberResult.data || [];


  const ids =
    [
      ...new Set(
        rawMembers
          .map(
            row =>
              row.user_id
          )
          .filter(Boolean)
      )
    ];


  if(!ids.length){

    members = [];

    return;

  }


  const profilesResult =
    await db
      .from("profiles")
      .select(`
        id,
        display_name,
        avatar_url
      `)
      .in(
        "id",
        ids
      );


  if(profilesResult.error){

    members =
      rawMembers.map(
        row => ({
          ...row,
          profile:null
        })
      );

    return;

  }


  const people =
    profilesResult.data || [];


  members =
    rawMembers.map(
      row => ({

        ...row,

        profile:
          people.find(
            person =>
              person.id ===
              row.user_id
          )
          ||
          null

      })
    );

}

========================================================= */

async function copyUserId(
  button
){

  try{

    await navigator
      .clipboard
      .writeText(
        currentUser.id
      );

  }


  catch(error){

    const temp =
      document.createElement(
        "textarea"
      );


    temp.value =
      currentUser.id;


    document.body
      .appendChild(
        temp
      );


    temp.select();


    document.execCommand(
      "copy"
    );


    temp.remove();

  }


  button.textContent =
    "COPIED ✓";


  setTimeout(
    () => {

      button.textContent =
        "COPY";

    },
    1500
  );

}

document.getElementById(
  "memberForm"

.addEventListener(
  "submit",

  async event => {

    event.preventDefault();


    const button =
      document.getElementById(
        "addMemberButton"
      );


    const message =
      document.getElementById(
        "memberMessage"
      );


    button.disabled =
      true;


    button.textContent =
      "ADDING…";


    message.className =
      "message";


    try{

      if(
        !trip ||
        !isOwner()
      ){

        throw new Error(
          "Only the trip owner can add people."
        );

      }


      const userId =
        document.getElementById(
          "memberUserId"
        )
        .value
        .trim();


      const role =
        document.getElementById(
          "memberRole"
        ).value === "editor"

        ?

        "editor"

        :

        "viewer";


      const uuidPattern =
        /^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i;


      if(
        !uuidPattern.test(
          userId
        )
      ){

        throw new Error(
          "Please enter a valid Supabase User ID."
        );

      }


      if(
        userId ===
        trip.owner_id
      ){

        throw new Error(
          "This user already owns the trip."
        );

      }


      if(
        members.some(
          member =>
            member.user_id ===
            userId
        )
      ){

        throw new Error(
          "This person is already on the trip."
        );

      }


      const profileResult =
        await db
          .from("profiles")
          .select(`
            id,
            display_name
          `)
          .eq(
            "id",
            userId
          )
          .maybeSingle();


      if(profileResult.error){

        throw profileResult.error;

      }


      if(!profileResult.data){

        throw new Error(
          "No profile was found for that User ID."
        );

      }


      const result =
        await db
          .from("trip_members")
          .insert({

            trip_id:
              trip.id,

            user_id:
              userId,

            role:
              role

          })
          .select()
          .single();


      if(result.error){

        throw result.error;

      }


      await loadTripPeople();


      closeSheets();

      render();

    }


    catch(error){

      message.textContent =
        error.message ||
        "Couldn't add this person.";


      message.className =
        "message error";

    }


    finally{

      button.disabled =
        false;


      button.textContent =
        "ADD TO TRIP";

    }

  }
);


/* =========================================================
   EDIT MEMBER
========================================================= */

function openEditMember(id){

  if(!isOwner()){

    return;

  }


  const member =
    members.find(
      row =>
        Number(
          row.id
        )
        ===
        Number(
          id
        )
    );


  if(!member){

    return;

  }


  editingMemberId =
    member.id;


  document.getElementById(
    "editMemberName"
  ).value =
    member.profile?.display_name
    ||
    member.user_id;


  document.getElementById(
    "editMemberRole"
  ).value =
    normalizeRole(
      member.role
    );


  document.getElementById(
    "editMemberMessage"
  ).className =
    "message";


  document.getElementById(
    "editMemberSheet"
  )
  .classList
  .add(
    "open"
  );

}


/* =========================================================
   SAVE ROLE
========================================================= */

document.getElementById(
  "saveMemberRole"
).onclick =
  async () => {

    if(
      !editingMemberId ||
      !trip ||
      !isOwner()
    ){

      return;

    }


    const message =
      document.getElementById(
        "editMemberMessage"
      );


    const role =
      document.getElementById(
        "editMemberRole"
      ).value === "editor"

      ?

      "editor"

      :

      "viewer";


    try{

      const result =
        await db
          .from("trip_members")
          .update({

            role:
              role

          })
          .eq(
            "id",
            editingMemberId
          )
          .eq(
            "trip_id",
            trip.id
          )
          .select();


      if(result.error){

        throw result.error;

      }


      if(!result.data?.length){

        throw new Error(
          "Member access was not updated."
        );

      }


      await loadTripPeople();


      closeSheets();

      render();

    }


    catch(error){

      message.textContent =
        error.message ||
        "Couldn't update member.";


      message.className =
        "message error";

    }

  };


/* =========================================================
   REMOVE MEMBER
========================================================= */

document.getElementById(
  "removeMember"
).onclick =
  async () => {

    if(
      !editingMemberId ||
      !trip ||
      !isOwner()
    ){

      return;

    }


    const member =
      members.find(
        row =>
          Number(
            row.id
          )
          ===
          Number(
            editingMemberId
          )
      );


    if(!member){

      return;

    }


    const name =
      member.profile?.display_name
      ||
      "this person";


    if(
      !confirm(
        `Remove ${name} from this trip?`
      )
    ){

      return;

    }


    try{

      const result =
        await db
          .from("trip_members")
          .delete()
          .eq(
            "id",
            editingMemberId
          )
          .eq(
            "trip_id",
            trip.id
          )
          .select();


      if(result.error){

        throw result.error;

      }


      if(!result.data?.length){

        throw new Error(
          "Member was not removed."
        );

      }


      editingMemberId =
        null;


      await loadTripPeople();


      closeSheets();

      render();

    }


    catch(error){

      const message =
        document.getElementById(
          "editMemberMessage"
        );


      message.textContent =
        error.message ||
        "Couldn't remove member.";


      message.className =
        "message error";

    }

  };


/* =========================================================
   GO
========================================================= */

start();

</script>
