<title>Forgot Password · Travel</title>

<style>

:root{
  --bg:#05090c;
  --panel:#0d151b;
  --line:#2b3942;
  --text:#f5f2ed;
  --muted:#8f9ca5;
  --red:#ff625f;
  --green:#67c587;

  --serif:
    Georgia,
    "Times New Roman",
    serif;
}

*{
  box-sizing:border-box;
}

html,
body{
  min-height:100%;
}

body{
  margin:0;

  min-height:100vh;

  display:flex;
  align-items:center;
  justify-content:center;

  padding:
    calc(28px + env(safe-area-inset-top))
    16px
    calc(28px + env(safe-area-inset-bottom));

  color:var(--text);

  font-family:
    Inter,
    ui-sans-serif,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

  -webkit-font-smoothing:antialiased;

  background-image:

    linear-gradient(
      180deg,
      rgba(3,7,9,.28) 0%,
      rgba(3,7,9,.36) 42%,
      rgba(3,7,9,.76) 100%
    ),

    linear-gradient(
      90deg,
      rgba(3,7,9,.30) 0%,
      rgba(3,7,9,.08) 50%,
      rgba(3,7,9,.30) 100%
    ),

    url("https://zngncasvdrrxyrkjqutj.supabase.co/storage/v1/object/sign/Photos/Login.png?token=eyJraWQiOiIzOTgxNDUwNy1mM2QwLTQ5ZGItODA4My0xODg1MWZkNGYxMmEiLCJhbGciOiJIUzUxMiJ9.eyJ1cmwiOiJQaG90b3MvTG9naW4ucG5nIiwic2NvcGUiOiJkb3dubG9hZCIsImlhdCI6MTc4OTc0NDE4OSwiZXhwIjozMTcxNDk3NDQxODl9.X7moDFBcRY_zc43Mn23R5gv4BDFcyV9r6fxCmFgiUM8pVmaYHRkzyvgI3KkNlea7qzAM8VcgHrc2MhAo6U4cZg");

  background-size:cover;
  background-position:center center;
  background-repeat:no-repeat;
  background-attachment:fixed;
}


/* =========================================
   BACKGROUND VIGNETTE
========================================= */

body::after{
  content:"";

  position:fixed;
  inset:0;

  pointer-events:none;

  background:
    radial-gradient(
      ellipse at center,
      rgba(0,0,0,0) 28%,
      rgba(0,0,0,.13) 67%,
      rgba(0,0,0,.40) 100%
    );
}

button,
input{
  font:inherit;
}


/* =========================================
   WRAPPER
========================================= */

.wrap{
  position:relative;
  z-index:1;

  width:100%;
  max-width:370px;
}


/* =========================================
   CARD
========================================= */

.card{
  position:relative;

  overflow:hidden;

  padding:
    24px
    22px
    21px;

  border:
    1px solid
    rgba(73,90,101,.74);

  border-radius:19px;

  background:
    linear-gradient(
      145deg,
      rgba(17,27,34,.96),
      rgba(9,16,21,.97)
    );

  box-shadow:
    0 24px 70px rgba(0,0,0,.42),
    0 2px 8px rgba(0,0,0,.24);

  backdrop-filter:blur(13px);
  -webkit-backdrop-filter:blur(13px);
}


/* coral top line */

.card::before{
  content:"";

  position:absolute;

  top:0;
  left:17px;
  right:17px;

  height:3px;

  border-radius:
    0
    0
    4px
    4px;

  background:var(--red);
}


/* =========================================
   HEADER
========================================= */

.header{
  display:flex;
  align-items:center;

  gap:14px;

  margin-bottom:13px;
}


/* =========================================
   LOGO
========================================= */

.logo{
  width:52px;
  height:52px;

  flex:
    0
    0
    52px;

  display:grid;
  place-items:center;

  border:
    1px solid
    rgba(255,98,95,.34);

  border-radius:50%;

  background:
    rgba(5,10,13,.50);
}

.logo img{
  width:42px;
  height:42px;

  display:block;

  object-fit:contain;
}


/* =========================================
   TITLE
========================================= */

.title-block{
  min-width:0;
}

h1{
  margin:0;

  font-family:var(--serif);

  font-size:27px;
  line-height:1;

  letter-spacing:-.035em;

  white-space:nowrap;
}

h1 span{
  color:var(--red);
}


/* =========================================
   SUBTITLE
========================================= */

.subtitle{
  margin:
    0
    0
    18px;

  color:#9ba8b0;

  font-size:10px;
  line-height:1.55;
}


/* =========================================
   DIVIDER
========================================= */

.divider{
  height:1px;

  margin:
    0
    -4px
    17px;

  background:
    linear-gradient(
      90deg,
      transparent,
      rgba(255,255,255,.09) 8%,
      rgba(255,255,255,.09) 92%,
      transparent
    );
}


/* =========================================
   FORM
========================================= */

label{
  display:block;

  margin-bottom:6px;

  color:#a9b6be;

  font-size:7px;
  font-weight:900;

  letter-spacing:.13em;
}

input{
  width:100%;

  min-height:51px;

  padding:
    0
    13px;

  border:
    1px solid
    #2a3943;

  border-radius:11px;

  outline:none;

  background:
    rgba(4,10,14,.73);

  color:#fff;

  font-size:12px;

  transition:
    border-color .15s ease,
    background .15s ease,
    box-shadow .15s ease;
}

input::placeholder{
  color:#61717b;
}

input:focus{
  border-color:
    rgba(255,98,95,.58);

  background:#081116;

  box-shadow:
    0
    0
    0
    3px
    rgba(255,98,95,.055);
}


/* =========================================
   RESET BUTTON
========================================= */

.reset-button{
  width:100%;

  min-height:47px;

  margin-top:15px;

  border:
    1px solid
    rgba(255,98,95,.72);

  border-radius:11px;

  background:
    linear-gradient(
      180deg,
      rgba(255,98,95,.23),
      rgba(255,98,95,.14)
    );

  color:#ffe0dd;

  font-size:9px;
  font-weight:950;

  letter-spacing:.15em;

  cursor:pointer;

  transition:
    background .15s ease,
    transform .08s ease;
}

.reset-button:hover{
  background:
    rgba(255,98,95,.23);
}

.reset-button:active{
  transform:
    translateY(1px);
}

.reset-button:disabled{
  opacity:.5;
  cursor:default;
}


/* =========================================
   MESSAGE
========================================= */

.message{
  display:none;

  margin-top:11px;

  padding:
    10px
    11px;

  border-radius:10px;

  font-size:9px;
  line-height:1.45;
}

.message.error{
  display:block;

  color:#ffc7c3;

  border:
    1px solid
    rgba(255,98,95,.32);

  background:
    rgba(255,98,95,.07);
}

.message.success{
  display:block;

  color:#c4ebd0;

  border:
    1px solid
    rgba(103,197,135,.28);

  background:
    rgba(103,197,135,.07);
}


/* =========================================
   BACK TO LOGIN
========================================= */

.login-row{
  margin-top:16px;

  padding-top:16px;

  border-top:
    1px solid
    rgba(255,255,255,.07);

  text-align:center;

  color:#8b98a0;

  font-size:9px;
}

.login-row a{
  margin-left:3px;

  color:#fff;

  font-weight:900;

  text-decoration:none;
}

.login-row a:hover{
  color:#ff8b87;
}


/* =========================================
   FOOTER
========================================= */

.footer{
  margin-top:13px;

  color:
    rgba(139,153,162,.62);

  text-align:center;

  font-size:7px;
  font-weight:700;

  letter-spacing:.14em;

  text-transform:uppercase;

  text-shadow:
    0
    2px
    7px
    rgba(0,0,0,.9);
}


/* =========================================
   MOBILE
========================================= */

@media(max-width:480px){

  body{
    padding-left:13px;
    padding-right:13px;

    background-attachment:scroll;
    background-position:center center;
  }

  .wrap{
    max-width:355px;
  }

  .card{
    padding:
      22px
      18px
      19px;
  }

  .logo{
    width:48px;
    height:48px;

    flex-basis:48px;
  }

  .logo img{
    width:39px;
    height:39px;
  }

  h1{
    font-size:25px;
  }

}


@media(max-width:350px){

  .header{
    gap:11px;
  }

  h1{
    font-size:23px;
  }

  .card{
    padding-left:15px;
    padding-right:15px;
  }

}

<body>


<div class="wrap">


  <div class="card">


    <!-- =====================================
         HEADER
    ====================================== -->

    <div class="header">

      <div class="logo">

        <img
          src="https://zngncasvdrrxyrkjqutj.supabase.co/storage/v1/object/sign/Photos/Travel3Logo.png?token=eyJraWQiOiIzOTgxNDUwNy1mM2QwLTQ5ZGItODA4My0xODg1MWZkNGYxMmEiLCJhbGciOiJIUzUxMiJ9.eyJ1cmwiOiJQaG90b3MvVHJhdmVsM0xvZ28ucG5nIiwic2NvcGUiOiJkb3dubG9hZCIsImlhdCI6MTc4OTcwNDUwMiwiZXhwIjozMzMyNTcwNDUwMn0.ciD2sShYC95aeLTucRmbI-AvrtletO259ymPAGCURr4FXltkLRmqiKd_yzkwrLl_q4XGahAWzevvfVkWyGOlZg"
          alt="Travel logo"
        >

      </div>


      <div class="title-block">

        <h1>
          Forgot password<span>?</span>
        </h1>

      </div>

    </div>


    <!-- =====================================
         SUBTITLE
    ====================================== -->

    <div class="subtitle">

      Enter your email address and we'll send you
      a link to choose a new password.

    </div>


    <div class="divider"></div>


    <!-- =====================================
         FORM
    ====================================== -->

    <form id="forgotForm">


      <label for="email">
        EMAIL ADDRESS
      </label>


      <input
        id="email"
        type="email"
        autocomplete="email"
        placeholder="you@example.com"
        required
      >


      <button
        id="submitBtn"
        class="reset-button"
        type="submit"
      >
        SEND RESET LINK
      </button>


      <div
        id="message"
        class="message"
      ></div>


    </form>


    <!-- =====================================
         LOGIN LINK
    ====================================== -->

    <div class="login-row">

      Remembered your password?

      <a href="login.html">
        Sign in
      </a>

    </div>


  </div>


  <div class="footer">
    Your trips are linked to your account
  </div>


</div>



<!-- =========================================
     SUPABASE
========================================= -->

<script
  src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>

<script src="supabase.js"></script>


<script>

/* =========================================
   ELEMENTS
========================================= */

const form =
  document.getElementById(
    "forgotForm"
  );

const emailInput =
  document.getElementById(
    "email"
  );

const submitBtn =
  document.getElementById(
    "submitBtn"
  );

const message =
  document.getElementById(
    "message"
  );


/* =========================================
   MESSAGE
========================================= */

function showMessage(
  text,
  type
){

  message.textContent =
    text;

  message.className =
    "message " + type;

}


/* =========================================
   RESET PASSWORD EMAIL
========================================= */

form.addEventListener(
  "submit",
  async event => {

    event.preventDefault();


    const email =
      emailInput.value
        .trim();


    if(!email){
      return;
    }


    submitBtn.disabled =
      true;

    submitBtn.textContent =
      "SENDING…";


    message.textContent = "";

    message.className =
      "message";


    try{


      /* =====================================
         RESET DESTINATION
      ====================================== */

      const redirectTo =
        new URL(
          "reset-password.html",
          window.location.href
        ).href;


      /* =====================================
         SUPABASE RESET
      ====================================== */

      const {
        error
      } =
        await db.auth
          .resetPasswordForEmail(
            email,
            {
              redirectTo
            }
          );


      if(error){
        throw error;
      }


      /*
        We deliberately don't reveal
        whether this email actually
        exists in the database.
      */

      showMessage(
        "If an account exists for this email, a password reset link has been sent. Check your inbox and spam folder.",
        "success"
      );


      emailInput.value = "";


    }

    catch(error){

      console.error(error);


      showMessage(
        error.message ||
        "Unable to send the reset email. Please try again.",
        "error"
      );

    }

    finally{

      submitBtn.disabled =
        false;

      submitBtn.textContent =
        "SEND RESET LINK";

    }

  }
);

</script>


<script src="pwa.js"></script>
