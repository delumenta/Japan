<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070c10">
<title>Home Guide · Travel</title>
<style>
:root{--bg:#070c10;--text:#f7f4ef;--muted:#9aa4ab;--red:#ff6b68;}
*{box-sizing:border-box} html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text)}
body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;-webkit-tap-highlight-color:transparent}
.tutorial{position:relative;width:100%;height:100svh;max-width:720px;margin:auto;overflow:hidden;background:#05090c}
.screen{position:absolute;inset:0;display:flex;align-items:flex-start;justify-content:center;background:#05090c}
.screen img{display:block;width:100%;height:100%;object-fit:cover;object-position:top center;user-select:none;-webkit-user-drag:none}
.dim{position:absolute;inset:0;background:rgba(3,6,8,.57);pointer-events:none}
.highlight{position:absolute;z-index:3;border:1px solid rgba(255,140,136,.92);border-radius:18px;box-shadow:0 0 0 9999px rgba(3,6,8,.63),0 0 0 3px rgba(255,107,104,.08),0 0 28px rgba(255,107,104,.20);pointer-events:none;transition:top .28s cubic-bezier(.2,.8,.2,1),left .28s cubic-bezier(.2,.8,.2,1),width .28s cubic-bezier(.2,.8,.2,1),height .28s cubic-bezier(.2,.8,.2,1)}
.topbar{position:absolute;z-index:8;left:0;right:0;top:0;display:flex;align-items:center;justify-content:space-between;padding:calc(14px + env(safe-area-inset-top)) 18px 10px;pointer-events:none}
.guide-label{color:rgba(255,255,255,.78);font-size:7px;font-weight:900;letter-spacing:.18em;text-transform:uppercase;text-shadow:0 2px 8px rgba(0,0,0,.7)}
.step-counter{color:#efaaa6;font-size:7px;font-weight:900;letter-spacing:.12em;text-shadow:0 2px 8px rgba(0,0,0,.7)}
.card{position:absolute;z-index:10;left:18px;right:18px;bottom:calc(18px + env(safe-area-inset-bottom));padding:15px 15px 13px;border:1px solid rgba(255,255,255,.13);border-radius:18px;background:linear-gradient(145deg,rgba(17,26,32,.96),rgba(8,14,18,.97));box-shadow:0 20px 50px rgba(0,0,0,.42);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.card-kicker{color:#ef8d88;font-size:6.5px;font-weight:900;letter-spacing:.18em;text-transform:uppercase}
.card-title{margin-top:6px;color:#fffaf5;font-family:Georgia,"Times New Roman",serif;font-size:22px;font-weight:700;line-height:1.06;letter-spacing:-.02em}
.card-copy{margin-top:8px;color:#aab4ba;font-size:8px;line-height:1.55}
.progress{display:flex;gap:5px;margin-top:13px}.progress-dot{width:16px;height:3px;border-radius:999px;background:#334049;transition:.2s ease}.progress-dot.active{width:28px;background:var(--red)}
.actions{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px;margin-top:13px}
.action-btn{min-height:39px;padding:0 13px;border-radius:999px;border:1px solid #2b3740;background:#10181e;color:#9ea9af;font-size:6.5px;font-weight:900;letter-spacing:.07em;cursor:pointer}
.action-btn.primary{border-color:rgba(255,107,104,.48);background:rgba(255,107,104,.10);color:#f4b0ac}
.action-btn:disabled{opacity:.35;cursor:default}.skip{justify-self:start;border-color:transparent;background:transparent;padding-left:2px;padding-right:2px;color:#7d8990}.next{justify-self:end}
@media(max-width:390px){.card{left:12px;right:12px;padding:13px 13px 12px}.card-title{font-size:20px}.card-copy{font-size:7.6px}.topbar{padding-left:14px;padding-right:14px}}
</style>
</head>
<body>
<main class="tutorial" id="tutorial">
  <div class="screen">
    <img src="https://zngncasvdrrxyrkjqutj.supabase.co/storage/v1/object/sign/Photos/Screenshot_20260920_214756_Chrome.jpg?token=eyJraWQiOiIzOTgxNDUwNy1mM2QwLTQ5ZGItODA4My0xODg1MWZkNGYxMmEiLCJhbGciOiJIUzUxMiJ9.eyJ1cmwiOiJQaG90b3MvU2NyZWVuc2hvdF8yMDI2MDkyMF8yMTQ3NTZfQ2hyb21lLmpwZyIsInNjb3BlIjoiZG93bmxvYWQiLCJpYXQiOjE3ODk5MTIyMjYsImV4cCI6MzMzMjU5MTIyMjZ9.USTE0vaXfkyMfZWLTTp53CUlMYyCeOICgCpLmlHIybc_cnrGTtdHNQstlnGgnIk1XA__tJhN67o6ebonYRXF7A" alt="Travel homepage tutorial screenshot">
  </div>
  <div class="dim"></div>
  <div id="highlight" class="highlight"></div>
  <div class="topbar">
    <div class="guide-label">HOME GUIDE</div>
    <div id="stepCounter" class="step-counter">1 / 5</div>
  </div>
  <section class="card" aria-live="polite">
    <div id="cardKicker" class="card-kicker">YOUR TRIP</div>
    <div id="cardTitle" class="card-title">Your trip at a glance</div>
    <div id="cardCopy" class="card-copy">Your trip name, country, route and travel dates are shown at the top of Home.</div>
    <div id="progress" class="progress"></div>
    <div class="actions">
      <button id="skipBtn" class="action-btn skip" type="button">SKIP</button>
      <button id="backBtn" class="action-btn" type="button">BACK</button>
      <button id="nextBtn" class="action-btn primary next" type="button">NEXT</button>
    </div>
  </section>
</main>
<script>
const steps=[
  {kicker:"YOUR TRIP",title:"Your trip at a glance",copy:"Your trip name, country, route and travel dates are shown at the top of Home.",box:{top:8,left:4,width:82,height:27}},
  {kicker:"TRIP SWITCHING",title:"Manage or switch trips",copy:"TRIPS shows how many trips you have. Tap MANAGE TRIP or MANAGE TRIPS to switch between trips or manage them.",box:{top:26,left:4,width:58,height:8}},
  {kicker:"COUNTDOWN",title:"See how close your trip is",copy:"The countdown updates automatically before, during and after your trip.",box:{top:35,left:4,width:36,height:8}},
  {kicker:"TRIP DAYS",title:"Jump to any itinerary day",copy:"Swipe through your trip days and tap a date to preview that day's itinerary on Home.",box:{top:61,left:4,width:92,height:12}},
  {kicker:"YOUR ITINERARY",title:"Preview the selected day",copy:"Home shows a quick preview of the selected day's itinerary. Tap VIEW FULL PLAN whenever you want the complete schedule.",box:{top:73,left:4,width:92,height:21}}
];
let index=0;
const highlight=document.getElementById("highlight"),cardKicker=document.getElementById("cardKicker"),cardTitle=document.getElementById("cardTitle"),cardCopy=document.getElementById("cardCopy"),stepCounter=document.getElementById("stepCounter"),progress=document.getElementById("progress"),backBtn=document.getElementById("backBtn"),nextBtn=document.getElementById("nextBtn"),skipBtn=document.getElementById("skipBtn");
function withTrip(url){const p=new URLSearchParams(location.search);const trip=p.get("trip");return trip?`${url}?trip=${encodeURIComponent(trip)}`:url}
function goNextGuide(){location.href=withTrip("index2-tutorial.html")}
function render(){const s=steps[index];cardKicker.textContent=s.kicker;cardTitle.textContent=s.title;cardCopy.textContent=s.copy;stepCounter.textContent=`${index+1} / ${steps.length}`;highlight.style.top=`${s.box.top}%`;highlight.style.left=`${s.box.left}%`;highlight.style.width=`${s.box.width}%`;highlight.style.height=`${s.box.height}%`;progress.innerHTML=steps.map((_,i)=>`<span class="progress-dot${i===index?" active":""}"></span>`).join("");backBtn.disabled=index===0;nextBtn.textContent=index===steps.length-1?"NEXT GUIDE":"NEXT"}
backBtn.onclick=()=>{if(index>0){index--;render()}};
nextBtn.onclick=()=>{if(index<steps.length-1){index++;render()}else{goNextGuide()}};
skipBtn.onclick=goNextGuide;
render();
</script>
</body>
</html>
