<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070c10">
<title>Expenses · Travel</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>

<style>
:root{
  --bg:#070c10;--surface:#0d1318;--surface2:#11181e;--surface3:#151d24;
  --line:#263039;--soft:rgba(255,255,255,.065);--text:#f5f3ef;
  --muted:#929ca4;--muted2:#66727b;--red:#ff625f;--redsoft:rgba(255,98,95,.09);
  --redline:rgba(255,98,95,.30);--green:#79c995;--blue:#78a9ef;--gold:#e4bd69;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;min-height:100vh;color:var(--text);
  background:radial-gradient(circle at 50% -8%,rgba(42,56,68,.30),transparent 28%),var(--bg);
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
header{
  position:sticky;top:0;z-index:40;border-bottom:1px solid var(--soft);
  background:rgba(7,12,16,.965);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)
}
.header-inner{max-width:760px;margin:auto;padding:calc(14px + env(safe-area-inset-top)) 14px 11px}
.title-row{display:flex;align-items:center;justify-content:space-between;gap:14px}
.eyebrow{margin-bottom:2px;color:var(--red);font-size:7px;font-weight:900;letter-spacing:.17em}
h1{margin:3px 0 0;font-family:Georgia,"Times New Roman",serif;font-size:27px;line-height:1}
.trip-name{margin-top:4px;color:var(--muted);font-size:8px}
.add-btn{
  min-height:36px;padding:7px 11px;border:1px solid var(--redline);border-radius:10px;
  background:var(--redsoft);color:#f3b7b3;font-size:8px;font-weight:900
}
main{width:100%;max-width:760px;margin:auto;padding:14px 14px 100px}

/* summary */
.summary{
  padding:12px;border:1px solid #252f37;border-radius:14px;
  background:linear-gradient(145deg,rgba(20,28,34,.97),rgba(12,18,23,.98));
}
.summary-label{color:#89959d;font-size:6.5px;font-weight:900;letter-spacing:.1em}
.summary-total{margin-top:4px;font-family:Georgia,serif;font-size:27px;font-weight:800}
.summary-sub{margin-top:3px;color:var(--muted);font-size:7px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.stat{padding:8px;border:1px solid var(--soft);border-radius:9px;background:#10171c}
.stat-k{color:#78858d;font-size:5.8px;font-weight:900}
.stat-v{margin-top:3px;color:#e9e8e4;font-size:9px;font-weight:900}

/* filters */
.filters{display:flex;gap:5px;overflow-x:auto;margin:10px 0 12px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto;min-height:29px;padding:0 9px;border:1px solid var(--line);
  border-radius:999px;background:#0f161c;color:#8c989f;font-size:6.5px;font-weight:900
}
.chip.active{border-color:var(--redline);background:var(--redsoft);color:#efb4b0}

/* list */
.section-head{display:flex;justify-content:space-between;align-items:center;margin:13px 1px 7px;padding-bottom:6px;border-bottom:1px solid var(--soft)}
.section-title{color:#bfc5c9;font-size:7px;font-weight:900;letter-spacing:.1em}
.section-count{color:#69757d;font-size:6px}
.date-group{margin-bottom:11px}
.date-label{margin:9px 2px 5px;color:#7f8b93;font-size:6.5px;font-weight:900;letter-spacing:.07em}
.expense{
  display:flex;align-items:center;gap:9px;min-height:58px;margin-bottom:5px;padding:8px 9px;
  border:1px solid #252f37;border-radius:11px;background:#0f161c;cursor:pointer
}
.exp-icon{
  flex:0 0 34px;width:34px;height:34px;display:flex;align-items:center;justify-content:center;
  border:1px solid var(--soft);border-radius:9px;background:#141c22;font-size:15px
}
.exp-main{flex:1;min-width:0}
.exp-title{overflow:hidden;color:#f1f1ef;font-size:8px;font-weight:900;text-overflow:ellipsis;white-space:nowrap}
.exp-meta{margin-top:3px;color:#748089;font-size:6px}
.exp-right{text-align:right}
.exp-amount{color:#f3f1ed;font-size:8.5px;font-weight:900}
.receipt-mark{margin-top:3px;color:#9fc2f1;font-size:6px}
.empty{padding:24px 12px;border:1px dashed #303b43;border-radius:12px;color:#77838b;text-align:center;font-size:7px;line-height:1.6}
.error{margin-bottom:10px;padding:9px;border:1px solid var(--redline);border-radius:9px;background:var(--redsoft);color:#ffc0bc;font-size:7px}

/* sheet */
.backdrop{
  position:fixed;inset:0;z-index:150;display:none;align-items:flex-end;background:rgba(0,0,0,.72);
  backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)
}
.backdrop.open{display:flex}
.sheet{
  width:100%;max-width:620px;max-height:92vh;margin:auto;overflow:auto;
  padding:8px 14px calc(18px + env(safe-area-inset-bottom));
  border:1px solid var(--line);border-radius:20px 20px 0 0;background:#0c1217
}
.handle{width:36px;height:4px;margin:2px auto 13px;border-radius:999px;background:#35414a}
.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:13px}
.sheet-title{font-family:Georgia,serif;font-size:19px}
.close{width:34px;height:34px;border:1px solid var(--line);border-radius:9px;background:#131b21;color:#fff}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.field{margin-bottom:9px}
.field label{display:block;margin-bottom:4px;color:#8d989f;font-size:6.5px;font-weight:900}
.field input,.field select,.field textarea{
  width:100%;min-height:40px;padding:8px 9px;border:1px solid var(--line);border-radius:9px;
  outline:0;background:#0f161c;color:#fff;font-size:9px
}
.field textarea{min-height:64px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--redline)}

/* receipt */
.receipt-box{
  padding:9px;border:1px dashed #35414a;border-radius:11px;background:#0e151a
}
.receipt-actions{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.receipt-btn{
  min-height:37px;border:1px solid rgba(120,169,239,.20);border-radius:9px;
  background:rgba(120,169,239,.045);color:#a5c7f4;font-size:7px;font-weight:900
}
.receipt-preview{display:none;position:relative;margin-top:8px}
.receipt-preview.show{display:block}
.receipt-preview img{display:block;width:100%;max-height:260px;object-fit:contain;border:1px solid var(--line);border-radius:9px;background:#080d11}
.remove-photo{
  position:absolute;top:7px;right:7px;min-height:28px;padding:0 8px;border:1px solid var(--redline);
  border-radius:7px;background:rgba(7,12,16,.88);color:#f0aaa5;font-size:6px;font-weight:900
}
.receipt-existing{margin-top:7px;color:#87949c;font-size:6.5px}
.receipt-existing a{color:#9fc2f1;text-decoration:none}
.save{
  width:100%;min-height:42px;margin-top:4px;border:1px solid rgba(121,201,149,.25);
  border-radius:10px;background:rgba(121,201,149,.075);color:#a7dbb8;font-size:7.5px;font-weight:900
}
.delete{
  width:100%;min-height:38px;margin-top:7px;border:1px solid rgba(255,98,95,.18);
  border-radius:10px;background:rgba(255,98,95,.035);color:#d98a83;font-size:7px;font-weight:900
}
.message{display:none;margin-top:8px;padding:8px;border-radius:8px;font-size:7px}
.message.show{display:block}
.message.bad{border:1px solid var(--redline);background:var(--redsoft);color:#ffc0bc}
.message.good{border:1px solid rgba(121,201,149,.22);background:rgba(121,201,149,.06);color:#a7dbb8}

@media(max-width:480px){
  .header-inner,main{padding-left:12px;padding-right:12px}
  h1{font-size:25px}.grid2{grid-template-columns:1fr 1fr}
}

header{
  position:relative;
  top:auto;
  width:calc(100% - 24px);
  max-width:720px;
  margin:0 auto;
  overflow:hidden;

}

</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="title-row">
      <div>
        <div class="eyebrow">TRIP SPENDING</div>
        <h1>Expenses</h1>
        <div id="tripName" class="trip-name">Loading trip…</div>
      </div>
      <button class="add-btn" type="button" onclick="openAdd()">＋ ADD</button>
    </div>
  </div>
</header>

<main>
  <div id="pageError"></div>

  <section class="summary">
    <div class="summary-label">TOTAL SPENT</div>
    <div id="totalSpent" class="summary-total">—</div>
    <div id="summarySub" class="summary-sub">Loading expenses…</div>
    <div class="stats">
      <div class="stat"><div class="stat-k">FOOD</div><div id="foodTotal" class="stat-v">—</div></div>
      <div class="stat"><div class="stat-k">TRANSPORT</div><div id="transportTotal" class="stat-v">—</div></div>
      <div class="stat"><div class="stat-k">SHOPPING</div><div id="shoppingTotal" class="stat-v">—</div></div>
    </div>
  </section>

  <div id="filters" class="filters"></div>

  <div class="section-head">
    <div class="section-title">EXPENSE HISTORY</div>
    <div id="expenseCount" class="section-count"></div>
  </div>

  <div id="expenseList"><div class="empty">Loading expenses…</div></div>
</main>

<div id="expenseSheet" class="backdrop">
  <div class="sheet">
    <div class="handle"></div>
    <div class="sheet-head">
      <div id="sheetTitle" class="sheet-title">Add Expense</div>
      <button class="close" type="button" onclick="closeSheet()">✕</button>
    </div>

    <form id="expenseForm">
      <div class="field">
        <label>WHAT DID YOU SPEND ON?</label>
        <input id="title" maxlength="120" required placeholder="e.g. Yakitori Tsujiya">
      </div>

      <div class="grid2">
        <div class="field">
          <label>CATEGORY</label>
          <select id="category">
            <option value="food">🍜 Food</option>
            <option value="transport">🚆 Transport</option>
            <option value="accommodation">🏨 Accommodation</option>
            <option value="activity">🎟 Activity</option>
            <option value="shopping">🛍 Shopping</option>
            <option value="other">📦 Other</option>
          </select>
        </div>
        <div class="field">
          <label>DATE</label>
          <input id="expenseDate" type="date" required>
        </div>
      </div>

      <div class="grid2">
        <div class="field">
          <label>AMOUNT</label>
          <input id="amount" type="number" min="0" step="0.01" inputmode="decimal" required placeholder="0">
        </div>
        <div class="field">
          <label>CURRENCY</label>
          <select id="currency">
            <option>JPY</option><option>SGD</option><option>USD</option><option>EUR</option>
            <option>GBP</option><option>KRW</option><option>TWD</option><option>THB</option>
            <option>MYR</option><option>IDR</option><option>CNY</option><option>HKD</option>
          </select>
        </div>
      </div>

      <div class="grid2">
        <div class="field">
          <label>PAYMENT</label>
          <select id="paymentMethod">
            <option value="">Not specified</option>
            <option value="cash">Cash</option>
            <option value="card">Credit / Debit Card</option>
            <option value="mobile">Mobile Payment</option>
            <option value="other">Other</option>
          </select>
        </div>
        <div class="field">
          <label>PAID BY</label>
          <input id="paidBy" maxlength="80" placeholder="Optional">
        </div>
      </div>

      <div class="field">
        <label>NOTES</label>
        <textarea id="notes" placeholder="Optional notes…"></textarea>
      </div>

      <div class="field">
        <label>RECEIPT PHOTO</label>
        <div class="receipt-box">
          <div class="receipt-actions">
            <button class="receipt-btn" type="button" onclick="document.getElementById('cameraInput').click()">📷 TAKE PHOTO</button>
            <button class="receipt-btn" type="button" onclick="document.getElementById('galleryInput').click()">🖼 CHOOSE PHOTO</button>
          </div>
          <input id="cameraInput" type="file" accept="image/*" capture="environment" hidden>
          <input id="galleryInput" type="file" accept="image/*" hidden>
          <div id="receiptPreview" class="receipt-preview">
            <img id="receiptImage" alt="Receipt preview">
            <button class="remove-photo" type="button" onclick="removeSelectedPhoto()">REMOVE</button>
          </div>
          <div id="existingReceipt" class="receipt-existing"></div>
        </div>
      </div>

      <button id="saveButton" class="save" type="submit">SAVE EXPENSE</button>
      <button id="deleteButton" class="delete" type="button" onclick="deleteExpense()" style="display:none">DELETE EXPENSE</button>
      <div id="formMessage" class="message"></div>
    </form>
  </div>
</div>

<div id="footer"></div>
<script src="footer.js"></script>

<script>
const RECEIPT_BUCKET="receipts";
let TRIP_ID=Number(new URLSearchParams(location.search).get("trip"))||Number(localStorage.getItem("current_trip_id"))||null;
let currentUser=null,currentTrip=null,expenses=[],editingId=null,selectedFile=null,removeOldReceipt=false,currentFilter="all";

const categories={
  food:["🍜","Food"],transport:["🚆","Transport"],accommodation:["🏨","Accommodation"],
  activity:["🎟","Activity"],shopping:["🛍","Shopping"],other:["📦","Other"]
};
function esc(v){return String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}
function localISO(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`}
function prettyDate(s){return new Date(s+"T12:00:00").toLocaleDateString("en-SG",{weekday:"short",day:"numeric",month:"short",year:"numeric"})}
function money(amount,currency){try{return new Intl.NumberFormat("en-SG",{style:"currency",currency:currency||"SGD",maximumFractionDigits:["JPY","KRW","IDR"].includes(currency)?0:2}).format(Number(amount)||0)}catch{return `${currency||""} ${Number(amount||0).toFixed(2)}`}}
function showError(msg){document.getElementById("pageError").innerHTML=`<div class="error">${esc(msg)}</div>`}
function formMsg(msg,type="bad"){const x=document.getElementById("formMessage");x.textContent=msg;x.className=`message show ${type}`}
function clearMsg(){document.getElementById("formMessage").className="message"}

async function start(){
  try{
    const {data:{user},error}=await db.auth.getUser(); if(error)throw error;
    if(!user){location.href="login.html";return}
    currentUser=user;
    if(!TRIP_ID){
      const r=await db.from("trips").select("id").eq("owner_id",user.id).neq("status","deleted").order("start_date",{ascending:true}).limit(1);
      if(r.error)throw r.error;if(!r.data?.length)throw new Error("No trip selected.");
      TRIP_ID=Number(r.data[0].id);localStorage.setItem("current_trip_id",String(TRIP_ID));
    }
    const t=await db.from("trips").select("id,name,country,owner_id").eq("id",TRIP_ID).single();
    if(t.error)throw t.error;currentTrip=t.data;
    document.getElementById("tripName").textContent=currentTrip.name||"My Trip";
    history.replaceState(null,"",`expense.html?trip=${TRIP_ID}`);
    await loadExpenses();
  }catch(e){console.error(e);showError(e.message||"Could not load expenses.")}
}

async function loadExpenses(){
  const r=await db.from("trip_expenses").select("*").eq("trip_id",TRIP_ID).order("expense_date",{ascending:false}).order("created_at",{ascending:false});
  if(r.error)throw r.error;expenses=r.data||[];render();
}

function render(){
  const currencies=[...new Set(expenses.map(x=>x.currency).filter(Boolean))];
  const totalByCurrency={};expenses.forEach(x=>totalByCurrency[x.currency]=(totalByCurrency[x.currency]||0)+Number(x.amount||0));
  const totals=Object.entries(totalByCurrency).map(([c,v])=>money(v,c));
  document.getElementById("totalSpent").textContent=totals.length===1?totals[0]:(totals.length?totals.join(" + "):"—");
  document.getElementById("summarySub").textContent=expenses.length?`${expenses.length} recorded expense${expenses.length===1?"":"s"} · totals kept in original currencies`:"No expenses recorded yet";
  document.getElementById("expenseCount").textContent=`${expenses.length}`;

  const catTotal=cat=>{
    const rows=expenses.filter(x=>x.category===cat), by={};rows.forEach(x=>by[x.currency]=(by[x.currency]||0)+Number(x.amount||0));
    const a=Object.entries(by).map(([c,v])=>money(v,c));return a.length?a.join(" + "):"—";
  };
  document.getElementById("foodTotal").textContent=catTotal("food");
  document.getElementById("transportTotal").textContent=catTotal("transport");
  document.getElementById("shoppingTotal").textContent=catTotal("shopping");

  const opts=["all",...Object.keys(categories)];
  document.getElementById("filters").innerHTML=opts.map(k=>`<button class="chip ${currentFilter===k?"active":""}" onclick="setFilter('${k}')">${k==="all"?"ALL":categories[k][0]+" "+categories[k][1].toUpperCase()}</button>`).join("");

  const rows=currentFilter==="all"?expenses:expenses.filter(x=>x.category===currentFilter);
  if(!rows.length){document.getElementById("expenseList").innerHTML=`<div class="empty">${expenses.length?"No expenses in this category.":"No expenses yet.<br>Tap <strong>＋ ADD</strong> after you spend something."}</div>`;return}
  const groups={};rows.forEach(x=>(groups[x.expense_date]??=[]).push(x));
  document.getElementById("expenseList").innerHTML=Object.entries(groups).map(([date,items])=>`
    <div class="date-group"><div class="date-label">${esc(prettyDate(date).toUpperCase())}</div>
    ${items.map(expenseCard).join("")}</div>`).join("");
}
function expenseCard(x){
  const c=categories[x.category]||categories.other;
  return `<div class="expense" onclick="openEdit(${Number(x.id)})">
    <div class="exp-icon">${c[0]}</div><div class="exp-main"><div class="exp-title">${esc(x.title)}</div>
    <div class="exp-meta">${esc(c[1])}${x.payment_method?" · "+esc(x.payment_method):""}${x.paid_by?" · "+esc(x.paid_by):""}</div></div>
    <div class="exp-right"><div class="exp-amount">${esc(money(x.amount,x.currency))}</div>${x.receipt_path?`<div class="receipt-mark">🧾 RECEIPT</div>`:""}</div>
  </div>`;
}
function setFilter(k){currentFilter=k;render()}

function resetForm(){
  editingId=null;selectedFile=null;removeOldReceipt=false;clearMsg();
  document.getElementById("expenseForm").reset();document.getElementById("expenseDate").value=localISO();
  document.getElementById("currency").value=currentTrip?.country?.toLowerCase().includes("japan")?"JPY":"SGD";
  document.getElementById("receiptPreview").classList.remove("show");document.getElementById("receiptImage").removeAttribute("src");
  document.getElementById("existingReceipt").innerHTML="";document.getElementById("deleteButton").style.display="none";
}
function openAdd(){resetForm();document.getElementById("sheetTitle").textContent="Add Expense";document.getElementById("saveButton").textContent="SAVE EXPENSE";document.getElementById("expenseSheet").classList.add("open")}
async function openEdit(id){
  resetForm();const x=expenses.find(e=>Number(e.id)===Number(id));if(!x)return;editingId=id;
  document.getElementById("sheetTitle").textContent="Edit Expense";document.getElementById("saveButton").textContent="SAVE CHANGES";
  document.getElementById("title").value=x.title||"";document.getElementById("category").value=x.category||"other";
  document.getElementById("expenseDate").value=x.expense_date||localISO();document.getElementById("amount").value=x.amount??"";
  document.getElementById("currency").value=x.currency||"SGD";document.getElementById("paymentMethod").value=x.payment_method||"";
  document.getElementById("paidBy").value=x.paid_by||"";document.getElementById("notes").value=x.notes||"";
  document.getElementById("deleteButton").style.display="block";
  if(x.receipt_path){
    try{
      const {data,error}=await db.storage.from(RECEIPT_BUCKET).createSignedUrl(x.receipt_path,3600);
      if(!error&&data?.signedUrl)document.getElementById("existingReceipt").innerHTML=`Current receipt: <a href="${esc(data.signedUrl)}" target="_blank" rel="noopener">VIEW PHOTO ↗</a> · <button type="button" onclick="markRemoveReceipt()" style="border:0;background:none;color:#d98a83;font-size:6.5px">REMOVE</button>`;
    }catch{}
  }
  document.getElementById("expenseSheet").classList.add("open");
}
function closeSheet(){document.getElementById("expenseSheet").classList.remove("open")}
document.getElementById("expenseSheet").onclick=e=>{if(e.target.id==="expenseSheet")closeSheet()}

function chooseFile(file){
  if(!file)return;
  if(!file.type.startsWith("image/")){formMsg("Please choose an image file.");return}
  if(file.size>10*1024*1024){formMsg("Receipt image must be under 10 MB.");return}
  selectedFile=file;removeOldReceipt=false;
  const img=document.getElementById("receiptImage");img.src=URL.createObjectURL(file);document.getElementById("receiptPreview").classList.add("show");
}
document.getElementById("cameraInput").onchange=e=>chooseFile(e.target.files?.[0]);
document.getElementById("galleryInput").onchange=e=>chooseFile(e.target.files?.[0]);
function removeSelectedPhoto(){selectedFile=null;document.getElementById("cameraInput").value="";document.getElementById("galleryInput").value="";document.getElementById("receiptPreview").classList.remove("show")}
function markRemoveReceipt(){removeOldReceipt=true;document.getElementById("existingReceipt").innerHTML=`Receipt will be removed when you save.`}

async function uploadReceipt(expenseId,file){
  const ext=(file.name.split(".").pop()||"jpg").replace(/[^a-zA-Z0-9]/g,"").toLowerCase()||"jpg";
  const path=`${TRIP_ID}/${currentUser.id}/${expenseId}/${crypto.randomUUID()}.${ext}`;
  const {error}=await db.storage.from(RECEIPT_BUCKET).upload(path,file,{contentType:file.type||"image/jpeg",upsert:false});
  if(error)throw error;return path;
}

document.getElementById("expenseForm").onsubmit=async e=>{
  e.preventDefault();clearMsg();const btn=document.getElementById("saveButton");btn.disabled=true;btn.textContent="SAVING…";
  try{
    const title=document.getElementById("title").value.trim(), amount=Number(document.getElementById("amount").value);
    if(!title)throw new Error("Please enter what you spent on.");if(!Number.isFinite(amount)||amount<0)throw new Error("Please enter a valid amount.");
    const payload={
      trip_id:TRIP_ID,user_id:currentUser.id,title,
      category:document.getElementById("category").value,amount,
      currency:document.getElementById("currency").value,
      expense_date:document.getElementById("expenseDate").value,
      payment_method:document.getElementById("paymentMethod").value||null,
      paid_by:document.getElementById("paidBy").value.trim()||null,
      notes:document.getElementById("notes").value.trim()||null,
      updated_at:new Date().toISOString()
    };
    let row,oldPath=null;
    if(editingId){
      const old=expenses.find(x=>Number(x.id)===Number(editingId));oldPath=old?.receipt_path||null;
      const r=await db.from("trip_expenses").update(payload).eq("id",editingId).eq("trip_id",TRIP_ID).select().single();
      if(r.error)throw r.error;row=r.data;
    }else{
      const r=await db.from("trip_expenses").insert(payload).select().single();if(r.error)throw r.error;row=r.data;
    }
    let receiptPath=row.receipt_path||oldPath;
    if(selectedFile){
      const newPath=await uploadReceipt(row.id,selectedFile);
      if(oldPath)await db.storage.from(RECEIPT_BUCKET).remove([oldPath]);
      receiptPath=newPath;
    }else if(removeOldReceipt&&oldPath){
      await db.storage.from(RECEIPT_BUCKET).remove([oldPath]);receiptPath=null;
    }
    if(receiptPath!==row.receipt_path){
      const u=await db.from("trip_expenses").update({receipt_path:receiptPath,updated_at:new Date().toISOString()}).eq("id",row.id).eq("trip_id",TRIP_ID);
      if(u.error)throw u.error;
    }
    formMsg(editingId?"Expense updated.":"Expense saved.","good");await loadExpenses();setTimeout(closeSheet,350);
  }catch(err){console.error(err);formMsg(err.message||"Could not save expense.")}
  finally{btn.disabled=false;btn.textContent=editingId?"SAVE CHANGES":"SAVE EXPENSE"}
};

async function deleteExpense(){
  if(!editingId||!confirm("Delete this expense?"))return;
  try{
    const x=expenses.find(e=>Number(e.id)===Number(editingId));
    if(x?.receipt_path)await db.storage.from(RECEIPT_BUCKET).remove([x.receipt_path]);
    const r=await db.from("trip_expenses").delete().eq("id",editingId).eq("trip_id",TRIP_ID);if(r.error)throw r.error;
    closeSheet();await loadExpenses();
  }catch(e){formMsg(e.message||"Could not delete expense.")}
}
start();
</script>
</body>
