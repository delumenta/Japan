<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#070d11"><title>Trip Album</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#05090c;color:#eee;font-family:Arial,sans-serif}.shell{max-width:920px;margin:auto;padding:28px 20px 100px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:24px}.back{color:#8e9ba2;text-decoration:none;font-size:12px}.eyebrow{color:#e36b6b;font-size:9px;font-weight:900;letter-spacing:.12em}.title{font-family:Georgia,serif;font-size:34px;margin:6px 0}.sub{color:#78868e;font-size:11px}.tools{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid #34434b;background:#0e171c;color:#b8c2c7;border-radius:10px;padding:10px 13px;font-size:10px;font-weight:800;cursor:pointer}.btn.primary{border-color:#6d3d42;color:#ff9292;background:#211619}.filters{display:flex;gap:7px;margin:20px 0}.filter{border:1px solid #2d3c44;background:#0d161b;color:#849198;border-radius:999px;padding:7px 11px;font-size:9px;font-weight:800;cursor:pointer}.filter.active{border-color:#6d3d42;color:#ff9292;background:#211619}.album{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.card{position:relative;background:#0c151a;border:1px solid #223139;border-radius:12px;overflow:hidden;cursor:grab}.card.dragging{opacity:.35}.card img{display:block;width:100%;aspect-ratio:1;object-fit:cover}.meta{padding:8px}.place{font-size:9px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.kind{margin-top:3px;color:#718088;font-size:8px}.empty{grid-column:1/-1;padding:70px 20px;text-align:center;color:#64737b;border:1px dashed #27363e;border-radius:14px}.hint{color:#66747b;font-size:9px;margin:0 0 12px}.drag{position:absolute;right:7px;top:7px;background:#071015cc;border:1px solid #314149;border-radius:7px;padding:4px 6px;color:#a8b3b8;font-size:10px}@media(max-width:650px){.album{grid-template-columns:repeat(3,1fr)}.title{font-size:28px}.top{align-items:flex-start;flex-direction:column}}@media(max-width:420px){.album{grid-template-columns:repeat(2,1fr)}}
</style></head><body><main class="shell"><a class="back" id="back" href="schedule.html">← PLAN</a><div class="top"><div><div class="eyebrow">PRIVATE TRIP COLLECTION</div><h1 class="title">Photo Album</h1><div class="sub" id="subtitle">Your Photo References and My Photos in one place.</div></div><div class="tools"><button class="btn primary" id="exportAll">⇩ EXPORT ALL PHOTOS</button></div></div><div class="filters"><button class="filter active" data-filter="all">ALL</button><button class="filter" data-filter="reference">PHOTO REFERENCES</button><button class="filter" data-filter="mine">MY PHOTOS</button></div><p class="hint">Drag photos to arrange your album. Your order is saved automatically.</p><section id="album" class="album"></section></main>
<script>
const params=new URLSearchParams(location.search);const tripId=Number(params.get('trip')||localStorage.getItem('current_trip_id'));let rows=[],filter='all',dragId=null;
document.getElementById('back').href='schedule.html?trip='+tripId;
async function signed(path){const r=await db.storage.from('trip-place-photos').createSignedUrl(path,3600);return r.data?.signedUrl||''}
async function load(){const auth=await db.auth.getUser();if(!auth.data?.user){location.href='login.html';return}const r=await db.from('trip_place_photos').select('*').eq('trip_id',tripId).order('sort_order',{ascending:true}).order('created_at',{ascending:true});if(r.error){document.getElementById('album').innerHTML='<div class="empty">'+r.error.message+'</div>';return}rows=r.data||[];await render()}
async function render(){const host=document.getElementById('album');const visible=filter==='all'?rows:rows.filter(x=>x.category===filter);if(!visible.length){host.innerHTML='<div class="empty">No photos here yet.</div>';return}host.innerHTML='';for(const row of visible){const el=document.createElement('article');el.className='card';el.draggable=true;el.dataset.id=row.id;el.innerHTML='<span class="drag">⠿</span><img alt=""><div class="meta"><div class="place"></div><div class="kind"></div></div>';el.querySelector('img').src=await signed(row.storage_path);el.querySelector('.place').textContent=row.place_name||'Trip photo';el.querySelector('.kind').textContent=row.category==='reference'?'PHOTO REFERENCE':'MY PHOTO';el.addEventListener('dragstart',()=>{dragId=Number(row.id);el.classList.add('dragging')});el.addEventListener('dragend',()=>el.classList.remove('dragging'));el.addEventListener('dragover',e=>e.preventDefault());el.addEventListener('drop',async e=>{e.preventDefault();const target=Number(row.id);if(!dragId||dragId===target)return;const from=rows.findIndex(x=>Number(x.id)===dragId),to=rows.findIndex(x=>Number(x.id)===target);const moved=rows.splice(from,1)[0];rows.splice(to,0,moved);await render();await saveOrder()});host.appendChild(el)}}
async function saveOrder(){await Promise.all(rows.map((r,i)=>db.from('trip_place_photos').update({sort_order:i}).eq('id',r.id)))}
document.querySelectorAll('.filter').forEach(b=>b.onclick=async()=>{document.querySelectorAll('.filter').forEach(x=>x.classList.remove('active'));b.classList.add('active');filter=b.dataset.filter;await render()});
document.getElementById('exportAll').onclick=async()=>{if(!rows.length){alert('No photos to export yet.');return}const b=document.getElementById('exportAll');b.disabled=true;b.textContent='EXPORTING…';try{for(let i=0;i<rows.length;i++){const r=rows[i],d=await db.storage.from('trip-place-photos').download(r.storage_path);if(d.error)throw d.error;const ext=(r.original_name?.split('.').pop()||d.data.type?.split('/').pop()||'jpg').replace(/[^a-z0-9]/gi,'');const place=(r.place_name||'trip-photo').replace(/[^a-z0-9 _-]/gi,'').trim().replace(/\s+/g,'-');const a=document.createElement('a');a.href=URL.createObjectURL(d.data);a.download=String(i+1).padStart(3,'0')+'-'+place+'.'+ext;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1500);await new Promise(x=>setTimeout(x,180))}}catch(e){alert(e.message||'Export failed.')}finally{b.disabled=false;b.textContent='⇩ EXPORT ALL PHOTOS'}};
load();
</script><div id="footer"></div><script src="footer.js"></script><script src="pwa.js"></script><script src="travel-assist-global.js"></script></body></html>
