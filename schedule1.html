<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover" />

  <title>Trip Map · Japan Autumn 2026</title>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>

  <!-- Your existing Google Maps loader -->
  <script src="google-maps.js"></script>

  <style>
    :root{
      --bg:#070c10;
      --panel:#10161c;
      --panel-light:#151c23;
      --line:#29323b;
      --text:#f5f5f3;
      --muted:#aeb5bc;
      --red:#c96f68;
      --blue:#5c9dff;
      --green:#67c587;
      --orange:#f4a34d;
      --gold:#e3b85c;
    }

    *{
      box-sizing:border-box;
    }

    html,
    body{
      margin:0;
      padding:0;
      background:var(--bg);
      color:var(--text);
      font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    body{
      min-height:100vh;
      padding-bottom:96px;
    }

    button,
    input{
      font:inherit;
    }

    button{
      -webkit-tap-highlight-color:transparent;
    }

    .app{
      width:min(100%, 820px);
      margin:0 auto;
    }

    /* =========================
       HEADER
    ========================= */

    .hero{
      padding:
        calc(18px + env(safe-area-inset-top))
        18px
        14px;
    }

    .eyebrow{
      color:var(--red);
      font-size:11px;
      font-weight:900;
      letter-spacing:1.6px;
      text-transform:uppercase;
      margin-bottom:6px;
    }

    h1{
      margin:0;
      font-family:Georgia, "Times New Roman", serif;
      font-size:30px;
      line-height:1.05;
      letter-spacing:-.5px;
    }

    .subtitle{
      margin-top:7px;
      color:var(--muted);
      font-size:13px;
      line-height:1.5;
    }

    /* =========================
       DATE STRIP
    ========================= */

    .date-wrap{
      padding:0 0 14px;
    }

    .dates{
      display:flex;
      gap:8px;
      overflow-x:auto;
      padding:2px 18px 7px;
      scrollbar-width:none;
      scroll-behavior:smooth;
    }

    .dates::-webkit-scrollbar{
      display:none;
    }

    .date-chip{
      flex:0 0 auto;
      min-width:61px;
      border:1px solid var(--line);
      background:var(--panel);
      color:var(--text);
      border-radius:16px;
      padding:9px 11px 8px;
      cursor:pointer;
      text-align:center;
      transition:.18s ease;
    }

    .date-chip .day{
      display:block;
      color:var(--muted);
      font-size:9px;
      font-weight:900;
      letter-spacing:1px;
      margin-bottom:2px;
    }

    .date-chip .num{
      display:block;
      font-family:Georgia, serif;
      font-size:20px;
      line-height:1;
    }

    .date-chip.active{
      border-color:var(--red);
      background:rgba(201,111,104,.15);
      box-shadow:
        inset 0 0 0 1px rgba(201,111,104,.15),
        0 0 0 1px rgba(201,111,104,.03);
    }

    .date-chip.active .day{
      color:var(--red);
    }

    /* =========================
       SECTION
    ========================= */

    .section{
      padding:0 14px 16px;
    }

    .section-head{
      display:flex;
      align-items:flex-end;
      justify-content:space-between;
      gap:12px;
      padding:0 4px 10px;
    }

    .section-label{
      color:var(--muted);
      font-size:10px;
      font-weight:900;
      letter-spacing:1.5px;
      text-transform:uppercase;
    }

    .section-title{
      margin-top:3px;
      font-family:Georgia, serif;
      font-size:21px;
    }

    .count{
      color:var(--muted);
      font-size:11px;
      white-space:nowrap;
    }

    /* =========================
       MAP CARD
    ========================= */

    .map-card{
      position:relative;
      overflow:hidden;
      border:1px solid var(--line);
      border-radius:22px;
      background:var(--panel);
      box-shadow:0 12px 35px rgba(0,0,0,.22);
    }

    #map{
      width:100%;
      height:390px;
      background:#182027;
    }

    .map-loading{
      position:absolute;
      inset:0;
      z-index:20;
      display:flex;
      align-items:center;
      justify-content:center;
      background:rgba(7,12,16,.90);
      backdrop-filter:blur(4px);
      color:var(--muted);
      font-size:13px;
      text-align:center;
      padding:30px;
    }

    .map-loading.hidden{
      display:none;
    }

    .map-error{
      position:absolute;
      inset:0;
      z-index:21;
      display:none;
      align-items:center;
      justify-content:center;
      background:var(--panel);
      padding:30px;
      text-align:center;
    }

    .map-error.show{
      display:flex;
    }

    .map-error-inner{
      max-width:340px;
    }

    .map-error-icon{
      font-size:30px;
      margin-bottom:10px;
    }

    .map-error-title{
      font-family:Georgia, serif;
      font-size:20px;
      margin-bottom:7px;
    }

    .map-error-text{
      color:var(--muted);
      font-size:12px;
      line-height:1.6;
    }

    /* =========================
       MAP CONTROLS
    ========================= */

    .map-actions{
      display:flex;
      gap:8px;
      padding:10px;
      border-top:1px solid var(--line);
      background:var(--panel);
    }

    .map-action{
      flex:1;
      border:1px solid var(--line);
      background:var(--panel-light);
      color:var(--text);
      border-radius:13px;
      padding:10px 8px;
      font-size:11px;
      font-weight:850;
      cursor:pointer;
    }

    .map-action:active{
      transform:scale(.98);
    }

    .map-action.primary{
      border-color:rgba(92,157,255,.45);
      color:#bcd5ff;
      background:rgba(92,157,255,.10);
    }

    /* =========================
       STATUS
    ========================= */

    .status{
      margin-top:10px;
      padding:11px 13px;
      border:1px solid var(--line);
      border-radius:14px;
      background:var(--panel);
      color:var(--muted);
      font-size:11px;
      line-height:1.5;
    }

    .status strong{
      color:var(--text);
    }

    /* =========================
       STOP LIST
    ========================= */

    .stops{
      display:flex;
      flex-direction:column;
      gap:9px;
    }

    .stop{
      display:grid;
      grid-template-columns:42px 1fr auto;
      gap:11px;
      align-items:center;

      border:1px solid var(--line);
      border-radius:17px;
      background:var(--panel);
      padding:12px;

      cursor:pointer;
      transition:.15s ease;
    }

    .stop:active{
      transform:scale(.99);
    }

    .stop.no-location{
      opacity:.62;
    }

    .stop-number{
      width:38px;
      height:38px;
      border-radius:50%;

      display:flex;
      align-items:center;
      justify-content:center;

      background:var(--red);
      color:#fff;

      border:3px solid rgba(255,255,255,.90);

      font-size:13px;
      font-weight:950;

      box-shadow:0 3px 10px rgba(0,0,0,.28);
    }

    .stop.no-location .stop-number{
      background:#555e66;
    }

    .stop-time{
      color:var(--red);
      font-size:10px;
      font-weight:900;
      letter-spacing:.5px;
      margin-bottom:3px;
    }

    .stop-name{
      font-family:Georgia, serif;
      font-size:16px;
      line-height:1.2;
    }

    .stop-location{
      color:var(--muted);
      font-size:10px;
      line-height:1.4;
      margin-top:4px;
    }

    .stop-arrow{
      color:var(--muted);
      font-size:19px;
      padding:5px;
    }

    .empty{
      border:1px dashed var(--line);
      border-radius:17px;
      padding:28px 20px;
      color:var(--muted);
      text-align:center;
      font-size:12px;
      line-height:1.6;
    }

    /* =========================
       GOOGLE MAP INFO WINDOW
    ========================= */

    .info-window{
      color:#111;
      min-width:190px;
      max-width:250px;
      font-family:
        Inter,
        system-ui,
        -apple-system,
        sans-serif;
      padding:2px 1px 4px;
    }

    .info-number{
      color:#9c4e49;
      font-size:10px;
      font-weight:900;
      letter-spacing:1px;
      margin-bottom:4px;
    }

    .info-title{
      font-family:Georgia, serif;
      font-size:17px;
      font-weight:700;
      margin-bottom:4px;
    }

    .info-time{
      font-size:11px;
      font-weight:800;
      margin-bottom:4px;
    }

    .info-location{
      color:#666;
      font-size:11px;
      line-height:1.4;
      margin-bottom:10px;
    }

    .info-button{
      display:inline-block;
      border:0;
      border-radius:9px;
      background:#111;
      color:white;
      padding:8px 11px;
      text-decoration:none;
      font-size:10px;
      font-weight:850;
      cursor:pointer;
    }

    /* =========================
       FULL SCREEN MAP
    ========================= */

    body.map-fullscreen{
      overflow:hidden;
    }

    body.map-fullscreen .map-card{
      position:fixed;
      z-index:1000;
      inset:0;
      border:0;
      border-radius:0;
      background:var(--bg);
      padding-top:env(safe-area-inset-top);
    }

    body.map-fullscreen #map{
      height:calc(
        100vh - 62px - env(safe-area-inset-top)
      );
    }

    body.map-fullscreen .map-actions{
      height:62px;
      padding-bottom:
        calc(10px + env(safe-area-inset-bottom));
    }

    /* =========================
       BOTTOM NAV
    ========================= */

    .bottom-nav{
      position:fixed;
      z-index:500;
      left:0;
      right:0;
      bottom:0;

      padding:
        7px 8px
        calc(7px + env(safe-area-inset-bottom));

      background:rgba(7,12,16,.96);
      backdrop-filter:blur(18px);

      border-top:1px solid var(--line);
    }

    .bottom-nav-inner{
      width:min(100%,820px);
      margin:0 auto;

      display:grid;
      grid-template-columns:repeat(5,1fr);
      gap:2px;
    }

    .nav-item{
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:3px;

      min-height:50px;

      color:#838c94;
      text-decoration:none;
      border-radius:12px;

      font-size:8px;
      font-weight:850;
      letter-spacing:.7px;
    }

    .nav-icon{
      font-size:18px;
      line-height:1;
    }

    .nav-item.active{
      color:var(--red);
      background:rgba(201,111,104,.08);
    }

    @media(max-width:520px){
      #map{
        height:355px;
      }

      h1{
        font-size:27px;
      }

      .section{
        padding-left:10px;
        padding-right:10px;
      }

      .hero{
        padding-left:15px;
        padding-right:15px;
      }

      .dates{
        padding-left:15px;
        padding-right:15px;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <!-- =========================
       HEADER
  ========================== -->
  <header class="hero">
    <div class="eyebrow">Japan · Autumn 2026</div>
    <h1>Your Trip Map</h1>

    <div class="subtitle">
      Pick a day to see your scheduled stops on the map.
    </div>
  </header>


  <!-- =========================
       DATE CHIPS
  ========================== -->
  <div class="date-wrap">
    <div class="dates" id="dateChips"></div>
  </div>


  <!-- =========================
       MAP
  ========================== -->
  <section class="section">

    <div class="section-head">
      <div>
        <div class="section-label">Today's Route</div>
        <div class="section-title" id="mapDateTitle">
          Loading...
        </div>
      </div>

      <div class="count" id="mapCount"></div>
    </div>


    <div class="map-card" id="mapCard">

      <div id="map"></div>

      <div class="map-loading" id="mapLoading">
        Loading your trip map...
      </div>

      <div class="map-error" id="mapError">
        <div class="map-error-inner">
          <div class="map-error-icon">🗺️</div>

          <div class="map-error-title">
            Map unavailable
          </div>

          <div class="map-error-text" id="mapErrorText">
            Google Maps could not be loaded.
          </div>
        </div>
      </div>

      <div class="map-actions">

        <button
          class="map-action primary"
          type="button"
          onclick="fitMapToStops()">
          ◎ FIT ROUTE
        </button>

        <button
          class="map-action"
          id="expandButton"
          type="button"
          onclick="toggleFullScreenMap()">
          ⛶ EXPAND
        </button>

      </div>

    </div>


    <div class="status" id="status">
      <strong>Loading schedule...</strong>
    </div>

  </section>


  <!-- =========================
       STOPS
  ========================== -->
  <section class="section">

    <div class="section-head">
      <div>
        <div class="section-label">Itinerary</div>
        <div class="section-title">Stops</div>
      </div>
    </div>

    <div class="stops" id="stopList"></div>

  </section>

</div>


<!-- =========================
     BOTTOM NAV
========================== -->
<nav class="bottom-nav">
  <div class="bottom-nav-inner">

    <a class="nav-item" id="navHome" href="index.html">
      <span class="nav-icon">⌂</span>
      <span>HOME</span>
    </a>

    <a class="nav-item" id="navPlan" href="schedule.html">
      <span class="nav-icon">▦</span>
      <span>PLAN</span>
    </a>

    <a class="nav-item" id="navFood" href="food.html">
      <span class="nav-icon">♨</span>
      <span>FOOD</span>
    </a>

    <a class="nav-item active" id="navHub" href="maps.html">
      <span class="nav-icon">⌖</span>
      <span>MAP</span>
    </a>

    <a class="nav-item" id="navMore" href="profile.html">
      <span class="nav-icon">•••</span>
      <span>MORE</span>
    </a>

  </div>
</nav>


<script>
/* ============================================================
   CONFIG
============================================================ */

const params = new URLSearchParams(window.location.search);

const TRIP_ID =
  Number(params.get("trip")) || 1;

const START_DATE =
  "2026-10-18";

const END_DATE =
  "2026-10-30";


/* ============================================================
   STATE
============================================================ */

let scheduleRows = [];

let selectedDate =
  params.get("date") || START_DATE;

let googleMap = null;

let googleMaps = null;

let infoWindow = null;

let markers = [];

let currentMappedStops = [];

let googleReady = false;


/* ============================================================
   HELPERS
============================================================ */

function escapeHtml(value){
  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}


function validCoordinate(value){
  if(
    value === null ||
    value === undefined ||
    value === ""
  ){
    return false;
  }

  const n = Number(value);

  return Number.isFinite(n);
}


function hasCoordinates(row){

  if(
    !validCoordinate(row.latitude) ||
    !validCoordinate(row.longitude)
  ){
    return false;
  }

  const lat = Number(row.latitude);
  const lng = Number(row.longitude);

  if(
    lat < -90 ||
    lat > 90 ||
    lng < -180 ||
    lng > 180
  ){
    return false;
  }

  if(lat === 0 && lng === 0){
    return false;
  }

  return true;
}


function formatTime(value){

  if(!value){
    return "";
  }

  const parts =
    String(value).split(":");

  let hour =
    Number(parts[0]);

  const minute =
    parts[1] || "00";

  const suffix =
    hour >= 12 ? "PM" : "AM";

  hour =
    hour % 12 || 12;

  return `${hour}:${minute} ${suffix}`;
}


function getTimeText(row){

  if(row.time_label){
    return row.time_label;
  }

  if(row.start_time){
    return formatTime(row.start_time);
  }

  return "";
}


function prettyDate(dateString){

  const date =
    new Date(dateString + "T12:00:00");

  return new Intl.DateTimeFormat(
    "en-GB",
    {
      weekday:"short",
      day:"numeric",
      month:"short"
    }
  ).format(date);
}


function shortWeekday(dateString){

  const date =
    new Date(dateString + "T12:00:00");

  return new Intl.DateTimeFormat(
    "en-GB",
    { weekday:"short" }
  )
  .format(date)
  .toUpperCase();
}


function dayNumber(dateString){
  return Number(
    dateString.split("-")[2]
  );
}


function dateRange(start,end){

  const result = [];

  let cursor =
    new Date(start + "T12:00:00");

  const finish =
    new Date(end + "T12:00:00");

  while(cursor <= finish){

    const y =
      cursor.getFullYear();

    const m =
      String(
        cursor.getMonth()+1
      ).padStart(2,"0");

    const d =
      String(
        cursor.getDate()
      ).padStart(2,"0");

    result.push(
      `${y}-${m}-${d}`
    );

    cursor.setDate(
      cursor.getDate()+1
    );
  }

  return result;
}


/* ============================================================
   NAV LINKS
============================================================ */

function setupNavigation(){

  const suffix =
    `?trip=${encodeURIComponent(TRIP_ID)}`;

  document.getElementById("navHome").href =
    "index.html" + suffix;

  document.getElementById("navPlan").href =
    "schedule.html" + suffix;

  document.getElementById("navFood").href =
    "food.html" + suffix;

  document.getElementById("navHub").href =
    "maps.html" + suffix;

  document.getElementById("navMore").href =
    "profile.html" + suffix;
}


/* ============================================================
   DATE CHIPS
============================================================ */

function renderDateChips(){

  const container =
    document.getElementById(
      "dateChips"
    );

  const dates =
    dateRange(
      START_DATE,
      END_DATE
    );

  container.innerHTML =
    dates.map(date => {

      const active =
        date === selectedDate;

      return `
        <button
          class="date-chip
                 ${active ? "active" : ""}"
          data-date="${date}"
          type="button"
          onclick="selectDate('${date}')">

          <span class="day">
            ${shortWeekday(date)}
          </span>

          <span class="num">
            ${dayNumber(date)}
          </span>

        </button>
      `;

    }).join("");

  requestAnimationFrame(() => {

    const active =
      container.querySelector(
        ".date-chip.active"
      );

    if(active){
      active.scrollIntoView({
        behavior:"smooth",
        inline:"center",
        block:"nearest"
      });
    }

  });
}


function selectDate(date){

  selectedDate = date;

  const url =
    new URL(window.location.href);

  url.searchParams.set(
    "trip",
    TRIP_ID
  );

  url.searchParams.set(
    "date",
    date
  );

  history.replaceState(
    {},
    "",
    url
  );

  renderDateChips();
  renderSelectedDay();
}


/* ============================================================
   SUPABASE
============================================================ */

async function loadSchedule(){

  const status =
    document.getElementById(
      "status"
    );

  try{

    const {
      data,
      error
    } = await db
      .from("schedule")
      .select(`
        id,
        trip_id,
        schedule_date,
        start_time,
        end_time,
        time_label,
        sort_order,
        title,
        item_type,
        description,
        notes,
        restaurant_id,
        place_id,
        location_name,
        address,
        latitude,
        longitude,
        maps_url,
        is_optional,
        is_locked
      `)
      .eq("trip_id",TRIP_ID)
      .gte(
        "schedule_date",
        START_DATE
      )
      .lte(
        "schedule_date",
        END_DATE
      )
      .order(
        "schedule_date",
        { ascending:true }
      )
      .order(
        "sort_order",
        { ascending:true }
      );

    if(error){
      throw error;
    }

    scheduleRows =
      data || [];

    status.innerHTML =
      `<strong>${scheduleRows.length} schedule items loaded.</strong>
       Choose a date above to view its map.`;

    renderSelectedDay();

  }catch(error){

    console.error(error);

    status.innerHTML =
      `<strong>Could not load schedule.</strong><br>
       ${escapeHtml(
         error.message ||
         "Unknown Supabase error."
       )}`;

    document.getElementById(
      "stopList"
    ).innerHTML =
      `<div class="empty">
        Your schedule could not be loaded.
       </div>`;
  }
}


/* ============================================================
   SELECTED DAY
============================================================ */

function getSelectedRows(){

  return scheduleRows
    .filter(row =>
      row.schedule_date ===
      selectedDate
    )
    .sort((a,b) =>
      Number(a.sort_order || 0) -
      Number(b.sort_order || 0)
    );
}


function renderSelectedDay(){

  const rows =
    getSelectedRows();

  document.getElementById(
    "mapDateTitle"
  ).textContent =
    prettyDate(selectedDate);

  const mapped =
    rows.filter(
      hasCoordinates
    );

  document.getElementById(
    "mapCount"
  ).textContent =
    `${mapped.length}/${rows.length} mapped`;

  renderStops(rows);

  if(googleReady){
    renderMapStops(rows);
  }
}


/* ============================================================
   STOP LIST
============================================================ */

function renderStops(rows){

  const container =
    document.getElementById(
      "stopList"
    );

  if(!rows.length){

    container.innerHTML =
      `<div class="empty">
        No schedule items found for
        ${escapeHtml(
          prettyDate(selectedDate)
        )}.
       </div>`;

    return;
  }

  container.innerHTML =
    rows.map((row,index) => {

      const mapped =
        hasCoordinates(row);

      const time =
        getTimeText(row);

      const location =
        row.location_name ||
        row.address ||
        "";

      return `
        <div
          class="stop
                 ${mapped
                    ? ""
                    : "no-location"}"
          onclick="
            ${mapped
              ? `focusStop(${index})`
              : ""}
          ">

          <div class="stop-number">
            ${index+1}
          </div>

          <div>

            ${
              time
              ? `<div class="stop-time">
                   ${escapeHtml(time)}
                 </div>`
              : ""
            }

            <div class="stop-name">
              ${escapeHtml(row.title)}
            </div>

            <div class="stop-location">

              ${
                mapped
                ? "📍 "
                : "⚠ "
              }

              ${
                escapeHtml(
                  location ||
                  (
                    mapped
                      ? "Mapped location"
                      : "No coordinates yet"
                  )
                )
              }

            </div>

          </div>

          <div class="stop-arrow">
            ${mapped ? "›" : ""}
          </div>

        </div>
      `;

    }).join("");
}


/* ============================================================
   GOOGLE MAP LOADING
============================================================ */

async function initializeGoogleMap(){

  const loading =
    document.getElementById(
      "mapLoading"
    );

  const errorBox =
    document.getElementById(
      "mapError"
    );

  const errorText =
    document.getElementById(
      "mapErrorText"
    );

  try{

    /*
      Your google-maps.js should provide
      window.loadGoogleMaps().

      This is the same loader pattern used
      by your restaurant setup page.
    */

    if(
      typeof window.loadGoogleMaps
      !== "function"
    ){
      throw new Error(
        "loadGoogleMaps() was not found in google-maps.js."
      );
    }

    googleMaps =
      await window.loadGoogleMaps();

    /*
      Depending on your loader,
      it may return google.maps
      OR Google may be available
      through window.google.maps.
    */

    const maps =
      googleMaps ||
      window.google?.maps;

    if(!maps){
      throw new Error(
        "Google Maps loaded, but google.maps was not available."
      );
    }

    googleMaps = maps;

    googleMap =
      new googleMaps.Map(
        document.getElementById(
          "map"
        ),
        {
          center:{
            lat:35.0116,
            lng:135.7681
          },

          zoom:12,

          mapTypeControl:false,

          streetViewControl:false,

          fullscreenControl:false,

          clickableIcons:true,

          gestureHandling:"greedy"
        }
      );

    infoWindow =
      new googleMaps.InfoWindow();

    googleReady = true;

    loading.classList.add(
      "hidden"
    );

    errorBox.classList.remove(
      "show"
    );

    renderSelectedDay();

  }catch(error){

    console.error(error);

    loading.classList.add(
      "hidden"
    );

    errorText.textContent =
      error.message ||
      "Google Maps could not be loaded.";

    errorBox.classList.add(
      "show"
    );
  }
}


/* ============================================================
   MAP MARKERS
============================================================ */

function clearMarkers(){

  markers.forEach(marker => {
    marker.setMap(null);
  });

  markers = [];

  currentMappedStops = [];

  if(infoWindow){
    infoWindow.close();
  }
}


function createNumberMarker(number){

  return {
    path:
      googleMaps.SymbolPath.CIRCLE,

    fillColor:"#c96f68",
    fillOpacity:1,

    strokeColor:"#ffffff",
    strokeWeight:3,

    scale:15,

    labelOrigin:
      new googleMaps.Point(0,0)
  };
}


function renderMapStops(rows){

  if(!googleMap){
    return;
  }

  clearMarkers();

  /*
    Preserve the original itinerary
    number even if a stop is missing
    coordinates.
  */

  currentMappedStops =
    rows
      .map((row,index) => ({
        row,
        itineraryNumber:index+1
      }))
      .filter(item =>
        hasCoordinates(item.row)
      );


  if(!currentMappedStops.length){

    googleMap.setCenter({
      lat:35.0116,
      lng:135.7681
    });

    googleMap.setZoom(11);

    document.getElementById(
      "status"
    ).innerHTML =
      `<strong>No mapped stops for this day yet.</strong>
       Add latitude and longitude to your schedule locations
       and they will appear here automatically.`;

    return;
  }


  currentMappedStops.forEach(
    (item,mappedIndex) => {

      const row =
        item.row;

      const number =
        item.itineraryNumber;

      const position = {
        lat:Number(row.latitude),
        lng:Number(row.longitude)
      };


      const marker =
        new googleMaps.Marker({

          map:googleMap,

          position,

          title:row.title,

          icon:
            createNumberMarker(number),

          label:{
            text:String(number),
            color:"#ffffff",
            fontSize:"11px",
            fontWeight:"900"
          },

          zIndex:
            100 + number
        });


      marker.addListener(
        "click",
        () => {
          openStopInfo(
            row,
            number,
            marker
          );
        }
      );


      markers.push(marker);

      item.marker =
        marker;

      item.mappedIndex =
        mappedIndex;
    }
  );


  fitMapToStops();


  document.getElementById(
    "status"
  ).innerHTML =
    `<strong>${currentMappedStops.length} mapped stops.</strong>
     Tap a numbered marker to see the stop and open directions.`;
}


/* ============================================================
   INFO WINDOW
============================================================ */

function googleDirectionsUrl(row){

  const lat =
    Number(row.latitude);

  const lng =
    Number(row.longitude);

  return (
    "https://www.google.com/maps/dir/?api=1" +
    "&destination=" +
    encodeURIComponent(
      `${lat},${lng}`
    )
  );
}


function openStopInfo(
  row,
  number,
  marker
){

  const time =
    getTimeText(row);

  const location =
    row.location_name ||
    row.address ||
    "";

  const directions =
    googleDirectionsUrl(row);


  const html = `
    <div class="info-window">

      <div class="info-number">
        STOP ${number}
      </div>

      <div class="info-title">
        ${escapeHtml(row.title)}
      </div>

      ${
        time
        ? `<div class="info-time">
             ${escapeHtml(time)}
           </div>`
        : ""
      }

      ${
        location
        ? `<div class="info-location">
             ${escapeHtml(location)}
           </div>`
        : ""
      }

      <a
        class="info-button"
        href="${directions}"
        target="_blank"
        rel="noopener">
        DIRECTIONS →
      </a>

    </div>
  `;


  infoWindow.setContent(html);

  infoWindow.open({
    map:googleMap,
    anchor:marker
  });
}


/* ============================================================
   FOCUS STOP
============================================================ */

function focusStop(originalIndex){

  const number =
    originalIndex + 1;

  const item =
    currentMappedStops.find(
      x =>
        x.itineraryNumber === number
    );

  if(!item){
    return;
  }

  googleMap.panTo(
    item.marker.getPosition()
  );

  googleMap.setZoom(16);

  openStopInfo(
    item.row,
    item.itineraryNumber,
    item.marker
  );

  document.getElementById(
    "mapCard"
  ).scrollIntoView({
    behavior:"smooth",
    block:"start"
  });
}


/* ============================================================
   FIT MAP
============================================================ */

function fitMapToStops(){

  if(
    !googleMap ||
    !markers.length
  ){
    return;
  }

  if(markers.length === 1){

    googleMap.setCenter(
      markers[0].getPosition()
    );

    googleMap.setZoom(15);

    return;
  }


  const bounds =
    new googleMaps.LatLngBounds();


  markers.forEach(marker => {
    bounds.extend(
      marker.getPosition()
    );
  });


  googleMap.fitBounds(
    bounds,
    55
  );


  /*
    Prevent Google from zooming
    ridiculously close when points
    are near each other.
  */

  googleMaps.event.addListenerOnce(
    googleMap,
    "idle",
    () => {

      if(
        googleMap.getZoom() > 16
      ){
        googleMap.setZoom(16);
      }

    }
  );
}


/* ============================================================
   FULL SCREEN
============================================================ */

function toggleFullScreenMap(){

  const body =
    document.body;

  const button =
    document.getElementById(
      "expandButton"
    );

  const entering =
    !body.classList.contains(
      "map-fullscreen"
    );


  body.classList.toggle(
    "map-fullscreen",
    entering
  );


  button.textContent =
    entering
      ? "✕ CLOSE"
      : "⛶ EXPAND";


  setTimeout(() => {

    if(
      googleMap &&
      googleMaps
    ){

      googleMaps.event.trigger(
        googleMap,
        "resize"
      );

      fitMapToStops();
    }

  },120);
}


/* ============================================================
   START
============================================================ */

async function start(){

  setupNavigation();

  renderDateChips();

  /*
    Supabase and Google Maps can
    load independently.
  */

  await Promise.allSettled([
    loadSchedule(),
    initializeGoogleMap()
  ]);
}


start();
</script>
