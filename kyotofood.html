<!doctype html>
<html lang="en">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1, viewport-fit=cover"
>

<meta name="theme-color" content="#070c10">

<title>Kyoto Food Finder</title>


<style>

/* =========================================================
   COLORS
========================================================= */

:root{
  --bg:#070c10;

  --panel:#10161c;
  --panel-light:#151c23;
  --panel-active:#172027;

  --line:#29323b;
  --line-soft:rgba(255,255,255,.07);

  --text:#f5f5f3;
  --muted:#aeb5bc;
  --muted-blue:#91a5b3;

  --red:#c96f68;
  --blue:#5c9dff;
  --green:#67c587;
  --orange:#f4a34d;
  --gold:#e3b85c;
}


/* =========================================================
   GLOBAL
========================================================= */

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{

  margin:0;

  background:
    radial-gradient(
      circle at 50% -20%,
      #17202a 0%,
      transparent 38%
    ),
    var(--bg);

  color:var(--text);

  font-family:
    Inter,
    ui-sans-serif,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

  line-height:1.5;

}


/* =========================================================
   STICKY HEADER
========================================================= */

header{

  position:sticky;

  top:0;

  z-index:40;

  background:
    rgba(7,12,16,.96);

  border-bottom:
    1px solid var(--line);

  padding:
    10px
    12px
    8px;

  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);

}

.header-inner{

  max-width:760px;

  margin:auto;

}


/* =========================================================
   HEADER TOP
========================================================= */

.header-top{

  display:flex;

  align-items:center;

  gap:10px;

}

.home-button{

  display:flex;

  align-items:center;
  justify-content:center;

  min-height:37px;

  padding:
    6px
    10px;

  border:
    1px solid var(--line);

  border-radius:10px;

  background:#121a20;

  color:var(--muted);

  text-decoration:none;

  font-size:11px;

  font-weight:750;

  white-space:nowrap;

}

.header-title{
  min-width:0;
}

.header-title h1{

  margin:0;

  color:#fff;

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-size:22px;

  letter-spacing:-.025em;

}

.header-title div{

  margin-top:1px;

  color:var(--muted);

  font-size:10px;

}


/* =========================================================
   SEARCH
========================================================= */

.search-wrap{

  margin-top:8px;

}

.search-box{

  width:100%;

  min-height:41px;

  padding:
    9px
    12px;

  border:
    1px solid var(--line);

  border-radius:12px;

  outline:none;

  background:#10171d;

  color:#fff;

  font:inherit;

  font-size:12px;

}

.search-box::placeholder{
  color:#77828b;
}

.search-box:focus{
  border-color:var(--red);
}


/* =========================================================
   STICKY BROWSE CONTROLS
========================================================= */

.sticky-browse{

  margin-top:8px;

  padding-top:8px;

  border-top:
    1px solid var(--line-soft);

}


/* =========================================================
   MODE SWITCH
========================================================= */

.mode-switch{

  display:grid;

  grid-template-columns:
    1fr
    1fr;

  gap:7px;

  margin-bottom:7px;

}

.mode-btn{

  appearance:none;

  min-height:37px;

  border:
    1px solid var(--line);

  border-radius:10px;

  background:#121a20;

  color:var(--muted);

  font-size:10px;

  font-weight:800;

  cursor:pointer;

}

.mode-btn.active{

  color:#fff;

  border-color:var(--red);

  background:
    rgba(201,111,104,.10);

}


/* =========================================================
   CHIPS
========================================================= */

.chip-section{
  margin:0;
}

.chips{

  display:flex;

  gap:7px;

  overflow-x:auto;

  padding:
    1px
    1px
    3px;

  scrollbar-width:none;

  scroll-snap-type:x proximity;

}

.chips::-webkit-scrollbar{
  display:none;
}

.chip{

  appearance:none;

  flex:0 0 auto;

  min-height:31px;

  padding:
    5px
    10px;

  border:
    1px solid var(--line);

  border-radius:999px;

  background:#10171d;

  color:#c5ccd1;

  font-size:9px;

  font-weight:750;

  cursor:pointer;

  white-space:nowrap;

  scroll-snap-align:start;

}

.chip.active{

  color:#fff;

  border-color:var(--red);

  background:
    rgba(201,111,104,.11);

}


/* =========================================================
   PAGE
========================================================= */

main{

  max-width:760px;

  margin:auto;

  padding:
    14px
    12px
    105px;

}


/* =========================================================
   RESULTS HEADER
========================================================= */

.results-head{

  display:flex;

  align-items:flex-end;

  justify-content:space-between;

  gap:10px;

  margin:
    2px
    2px
    12px;

}

.results-head h2{

  margin:0;

  color:#fff;

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-size:21px;

}

.result-count{

  color:var(--muted);

  font-size:9px;

  white-space:nowrap;

}


/* =========================================================
   FOOD GROUP
========================================================= */

.food-group{

  margin-bottom:22px;

}

.food-group-title{

  display:flex;

  align-items:center;

  gap:8px;

  margin:
    5px
    2px
    9px;

  padding-bottom:7px;

  border-bottom:
    1px solid var(--line-soft);

  color:#fff;

  font-size:14px;

  font-weight:850;

}

.food-group-count{

  margin-left:auto;

  color:var(--muted);

  font-size:9px;

  font-weight:700;

}


/* =========================================================
   RESTAURANT CARD
========================================================= */

.restaurant-card{

  position:relative;

  margin-bottom:9px;

  padding:13px;

  border:
    1px solid var(--line);

  border-radius:16px;

  background:
    linear-gradient(
      145deg,
      #141c22,
      #0d1318
    );

}

.card-top{

  display:flex;

  align-items:flex-start;

  gap:10px;

}

.rank{

  flex:0 0 auto;

  min-width:30px;

  height:30px;

  display:flex;

  align-items:center;
  justify-content:center;

  border-radius:9px;

  background:
    rgba(201,111,104,.10);

  border:
    1px solid rgba(201,111,104,.20);

  color:var(--red);

  font-size:10px;

  font-weight:900;

}

.restaurant-main{

  flex:1;

  min-width:0;

}

.restaurant-name{

  margin:0;

  color:#fff;

  font-size:14px;

  font-weight:850;

  line-height:1.25;

}

.restaurant-location{

  margin-top:3px;

  color:var(--muted);

  font-size:9px;

}


/* =========================================================
   BADGES
========================================================= */

.badges{

  display:flex;

  flex-wrap:wrap;

  gap:5px;

  margin-top:8px;

}

.badge{

  display:inline-flex;

  align-items:center;

  min-height:24px;

  padding:
    4px
    7px;

  border-radius:999px;

  border:
    1px solid var(--line);

  background:
    rgba(255,255,255,.035);

  color:#cbd2d7;

  font-size:8px;

  font-weight:800;

}

.badge.cuisine{

  color:#fff;

  background:
    rgba(92,157,255,.08);

  border-color:
    rgba(92,157,255,.18);

}

.badge.pick{

  color:#f2cf72;

  background:
    rgba(227,184,92,.08);

  border-color:
    rgba(227,184,92,.22);

}

.badge.hot{

  color:#ff9d74;

  background:
    rgba(244,163,77,.08);

  border-color:
    rgba(244,163,77,.22);

}

.badge.tabelog{

  color:#e8c770;

  background:
    rgba(227,184,92,.08);

  border-color:
    rgba(227,184,92,.22);

}

.badge.flexible{

  color:#aebdff;

  background:
    rgba(92,157,255,.08);

  border-color:
    rgba(92,157,255,.20);

}


/* =========================================================
   CARD INFO
========================================================= */

.card-info{

  display:grid;

  grid-template-columns:
    1fr
    1fr;

  gap:7px;

  margin-top:10px;

}

.info-box{

  padding:
    7px
    8px;

  border-radius:10px;

  background:
    rgba(255,255,255,.025);

  border:
    1px solid var(--line-soft);

}

.info-label{

  color:#77838c;

  font-size:7px;

  font-weight:800;

  text-transform:uppercase;

  letter-spacing:.08em;

}

.info-value{

  margin-top:2px;

  color:#d9dee1;

  font-size:9px;

  font-weight:700;

}

.why-go{

  margin-top:9px;

  color:var(--muted);

  font-size:10px;

  line-height:1.5;

}


/* =========================================================
   CARD ACTIONS
========================================================= */

.card-actions{

  display:flex;

  gap:7px;

  margin-top:10px;

}

.card-btn{

  display:inline-flex;

  align-items:center;
  justify-content:center;

  min-height:35px;

  padding:
    7px
    10px;

  border-radius:10px;

  border:
    1px solid rgba(201,111,104,.25);

  background:
    rgba(201,111,104,.08);

  color:var(--red);

  text-decoration:none;

  font-size:9px;

  font-weight:800;

  cursor:pointer;

}

.card-btn.info{

  border-color:
    rgba(92,157,255,.22);

  background:
    rgba(92,157,255,.07);

  color:var(--blue);

}


/* =========================================================
   EXPANDED INFO
========================================================= */

.extra-info{

  display:none;

  margin-top:10px;

  padding-top:10px;

  border-top:
    1px solid var(--line-soft);

  color:var(--muted);

  font-size:9px;

  line-height:1.55;

}

.extra-info.open{
  display:block;
}


/* =========================================================
   EMPTY STATE
========================================================= */

.empty-state{

  padding:
    32px
    18px;

  border:
    1px dashed #35414a;

  border-radius:17px;

  text-align:center;

  color:var(--muted);

}

.empty-state strong{

  display:block;

  margin-bottom:5px;

  color:#fff;

}


/* =========================================================
   BOTTOM FILTER
========================================================= */

.bottom-filter{

  position:fixed;

  left:0;
  right:0;
  bottom:0;

  z-index:50;

  padding:
    8px
    10px
    calc(8px + env(safe-area-inset-bottom));

  background:
    rgba(7,12,16,.97);

  border-top:
    1px solid var(--line);

  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);

}

.bottom-filter-inner{

  max-width:760px;

  margin:auto;

  display:grid;

  grid-template-columns:
    repeat(4,1fr);

  gap:6px;

}

.bottom-btn{

  appearance:none;

  min-height:42px;

  padding:
    5px
    3px;

  border:
    1px solid #26333d;

  border-radius:10px;

  background:#11181e;

  color:#aeb5bc;

  font-size:9px;

  font-weight:850;

  cursor:pointer;

}

.bottom-btn.active{

  color:#fff;

  border-color:var(--red);

  background:
    rgba(201,111,104,.12);

}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:480px){

  .header-title h1{
    font-size:20px;
  }

  .restaurant-card{
    padding:12px;
  }

  .restaurant-name{
    font-size:14px;
  }

  .bottom-btn{
    font-size:8.5px;
  }

}


/* =========================================================
   VERY SMALL PHONES
========================================================= */

@media(max-width:360px){

  .header-title h1{
    font-size:18px;
  }

  .bottom-btn{
    font-size:8px;
  }

  .home-button{
    padding:
      6px
      8px;
  }

}

</style>

  "Ramen / Tsukemen":"🍜",
  "Yakitori / Chicken":"🍗",
  "Udon / Soba":"🥢",
  "Oyakodon":"🍳",
  "Tonkatsu":"🐷",
  "Unagi":"🐟",
  "Kaisendon":"🐟",
  "Tempura":"🍤",

};



/* =========================================================
   STATE
========================================================= */

let selectedArea = "";

let selectedFood = "";

let searchTerm = "";

   ELEMENTS
========================================================= */

/* =========================================================
   SPECIAL FILTERS
========================================================= */

function isPick(r){

  return (r.Tag || "")
    .includes("⭐");

}


function isFlexible(r){

  return (r.Tag || "")
    .includes("🌙");

}


function isHot(r){

  return (r.Recognition || "")
    .toLowerCase()
    .includes("hot restaurant");

}


function isTabelog(r){

  const recognition =
    (r.Recognition || "")
      .toLowerCase();

  return (
    recognition.includes("top 100")
    ||
    recognition.includes("tabelog")
  );

}



/* =========================================================
   CREATE CHIPS
========================================================= */

function createChips(){

  areaChips.innerHTML = "";
  foodChips.innerHTML = "";


  const allArea =
    document.createElement("button");

  allArea.className =
    "chip active";

  allArea.textContent =
    "All Areas";

  allArea.dataset.value = "";

  areaChips.appendChild(allArea);


  areaOptions.forEach(area => {

    const button =
      document.createElement("button");

    button.className =
      "chip";

    button.dataset.value =
      area;

    button.textContent =
      area;

    areaChips.appendChild(button);

  });


  const allFood =
    document.createElement("button");

  allFood.className =
    "chip active";

  allFood.textContent =
    "All Food";

  allFood.dataset.value = "";

  foodChips.appendChild(allFood);


  foodOptions.forEach(food => {

    const button =
      document.createElement("button");

    button.className =
      "chip";

    button.dataset.value =
      food;

    button.textContent =
      (cuisineEmoji[food] || "🍽️")
      + " "
      + food;

    foodChips.appendChild(button);

  });


  areaChips
    .querySelectorAll(".chip")
    .forEach(button => {

      button.addEventListener(
        "click",
        () => {

          selectedArea =
            button.dataset.value;

          areaChips
            .querySelectorAll(".chip")
            .forEach(b => {

              b.classList.toggle(
                "active",
                b === button
              );

            });

          render();

        }
      );

    });


  foodChips
    .querySelectorAll(".chip")
    .forEach(button => {

      button.addEventListener(
        "click",
        () => {

          selectedFood =
            button.dataset.value;

          foodChips
            .querySelectorAll(".chip")
            .forEach(b => {

              b.classList.toggle(
                "active",
                b === button
              );

            });

          render();

        }
      );

    });

}



/* =========================================================
   FILTER RESTAURANTS
========================================================= */

function getFilteredRestaurants(){

  return restaurants.filter(r => {


    if(
      selectedArea
      &&
      r.Area !== selectedArea
    ){
      return false;
    }


    if(
      selectedFood
      &&
      r.Food !== selectedFood
    ){
      return false;
    }


    if(searchTerm){

      const haystack = [

        r.Name,
        r.Food,
        r.Area,
        r.Location,
        r.Why,
        r.Recognition

      ]
      .join(" ")
      .toLowerCase();


      if(
        !haystack.includes(searchTerm)
      ){
        return false;
      }

    }


    /*
       Bottom filters use OR logic.

       Example:
       Picks + Hot
       = restaurants that are
       Picks OR Hot.
    */

    if(activeFilters.size){

      const matches = [];


      if(activeFilters.has("pick")){
        matches.push(isPick(r));
      }

      if(activeFilters.has("tabelog")){
        matches.push(isTabelog(r));
      }

      if(activeFilters.has("hot")){
        matches.push(isHot(r));
      }

      if(activeFilters.has("flexible")){
        matches.push(isFlexible(r));
      }


      if(
        !matches.some(Boolean)
      ){
        return false;
      }

    }


    return true;

  });

}



/* =========================================================
   BADGES
========================================================= */

function buildBadges(r){

  let html = "";


  html +=
    `<span class="badge cuisine">
      ${cuisineEmoji[r.Food] || "🍽️"}
      ${r.Food}
    </span>`;


  if(isPick(r)){

    html +=
      `<span class="badge pick">
        ⭐ Pick
      </span>`;

  }


  if(isTabelog(r)){

    html +=
      `<span class="badge tabelog">
        🏆 Tabelog
      </span>`;

  }


  if(isHot(r)){

    html +=
      `<span class="badge hot">
        🔥 Hot
      </span>`;

  }


  if(isFlexible(r)){

    html +=
      `<span class="badge flexible">
        🌙 Flexible
      </span>`;

  }


  return html;

}



/* =========================================================
   RESTAURANT CARD
========================================================= */

function restaurantCard(r){

  const mapsQuery =
    encodeURIComponent(
      r.Name + " Kyoto Japan"
    );


  const recognition =
    r.Recognition
      ? r.Recognition
      : "—";


  return `

    <article class="restaurant-card">


      <div class="card-top">


        <div class="rank">
          #${r.Rank}
        </div>


        <div class="restaurant-main">


          <h3 class="restaurant-name">
            ${r.Name}
          </h3>


          <div class="restaurant-location">

            📍 ${r.Location}
            ·
            ${r.Area}

          </div>


          <div class="badges">

            ${buildBadges(r)}

          </div>


        </div>


      </div>


      <div class="card-info">


        <div class="info-box">

          <div class="info-label">
            Price
          </div>

          <div class="info-value">
            ${r.Price}
          </div>

        </div>


        <div class="info-box">

          <div class="info-label">
            Recognition
          </div>

          <div class="info-value">
            ${recognition}
          </div>

        </div>


      </div>


      <div class="why-go">

        ${r.Why}

      </div>


      <div class="card-actions">


        <a
          href="https://www.google.com/maps/search/?api=1&query=${mapsQuery}"
          target="_blank"
          class="card-btn"
        >
          📍 Maps
        </a>


        <button
          class="card-btn info"
          onclick="toggleInfo(this)"
        >
          ℹ️ Info
        </button>


      </div>


      <div class="extra-info">

        <strong style="color:#fff;">
          ${r.Name}
        </strong>

        <br>

        ${cuisineEmoji[r.Food] || "🍽️"}
        ${r.Food}

        <br>

        📍 ${r.Location} · ${r.Area}

        <br>

        💴 ${r.Price}

        ${
          r.Recognition
          ?
          `<br>🏆 ${r.Recognition}`
          :
          ""
        }

      </div>


    </article>

  `;

}



/* =========================================================
   TOGGLE INFO
========================================================= */

function toggleInfo(button){

  const card =
    button.closest(
      ".restaurant-card"
    );

  const info =
    card.querySelector(
      ".extra-info"
    );


  info.classList.toggle(
    "open"
  );


  button.textContent =
    info.classList.contains("open")
      ? "✕ Close"
      : "ℹ️ Info";

}



/* =========================================================
   AREA MODE
========================================================= */

function renderAreaMode(list){

  if(!list.length){

    results.innerHTML = `

      <div class="empty-state">

        <strong>
          No restaurants found
        </strong>

        Try another area, food type or filter.

      </div>

    `;

    return;

  }


  const grouped = {};


  list.forEach(r => {

    if(!grouped[r.Food]){
      grouped[r.Food] = [];
    }

    grouped[r.Food].push(r);

  });


  const foodOrder =
    foodOptions.filter(
      food => grouped[food]
    );


  results.innerHTML =
    foodOrder
      .map(food => {


        const group =
          grouped[food]
            .sort(
              (a,b) =>
                a.Rank - b.Rank
            );


        return `

          <section class="food-group">


            <div class="food-group-title">

              <span>
                ${cuisineEmoji[food] || "🍽️"}
              </span>

              <span>
                ${food}
              </span>

              <span class="food-group-count">
                ${group.length}
              </span>

            </div>


            ${group
              .map(restaurantCard)
              .join("")
            }


          </section>

        `;

      })
      .join("");

}



/* =========================================================
   FOOD MODE
========================================================= */

function renderFoodMode(list){

  if(!list.length){

    results.innerHTML = `

      <div class="empty-state">

        <strong>
          No restaurants found
        </strong>

        Try another food type, area or filter.

      </div>

    `;

    return;

  }


  const sorted =
    [...list]
      .sort(
        (a,b) =>
          a.Rank - b.Rank
      );


  results.innerHTML =
    sorted
      .map(restaurantCard)
      .join("");

}



/* =========================================================
   UPDATE TITLE
========================================================= */

function updateTitle(list){

  if(browseMode === "area"){

    if(selectedArea){

      resultsTitle.textContent =
        selectedArea;

    }

    else{

      resultsTitle.textContent =
        "All Kyoto Food";

    }

  }


  else{

    if(selectedFood){

      resultsTitle.textContent =
        (cuisineEmoji[selectedFood] || "🍽️")
        + " "
        + selectedFood;

    }

    else{

      resultsTitle.textContent =
        "All Food Types";

    }

  }


  resultCount.textContent =
    list.length
    +
    (
      list.length === 1
      ? " restaurant"
      : " restaurants"
    );

}



/* =========================================================
   RENDER
========================================================= */

function render(){

  const list =
    getFilteredRestaurants();


  updateTitle(list);


  if(browseMode === "area"){

    renderAreaMode(list);

  }

  else{

    renderFoodMode(list);

  }

}



/* =========================================================
   MODE SWITCH
========================================================= */

modeButtons.forEach(button => {

  button.addEventListener(
    "click",
    () => {


      browseMode =
        button.dataset.mode;


      modeButtons.forEach(b => {

        b.classList.toggle(
          "active",
          b === button
        );

      });


      if(browseMode === "area"){

        areaSection.style.display =
          "block";

        foodSection.style.display =
          "none";

      }

      else{

        areaSection.style.display =
          "none";

        foodSection.style.display =
          "block";

      }


      render();

    }
  );

});



/* =========================================================
   BOTTOM FILTERS
========================================================= */

bottomButtons.forEach(button => {

  button.addEventListener(
    "click",
    () => {


      const filter =
        button.dataset.filter;


      if(
        activeFilters.has(filter)
      ){

        activeFilters.delete(filter);

        button.classList.remove(
          "active"
        );

      }

      else{

        activeFilters.add(filter);

        button.classList.add(
          "active"
        );

      }


      render();

    }
  );

});



/* =========================================================
   SEARCH
========================================================= */

searchInput.addEventListener(
  "input",
  () => {

    searchTerm =
      searchInput.value
        .trim()
        .toLowerCase();

    render();

  }
);



/* =========================================================
   URL PARAMETERS
========================================================= */

function loadURLParameters(){

  const params =
    new URLSearchParams(
      window.location.search
    );


  const area =
    params.get("area");

  const location =
    params.get("location");

  const food =
    params.get("food");


  if(
    area
    &&
    areaOptions.includes(area)
  ){

    browseMode = "area";

    selectedArea = area;

  }


  if(location){

    browseMode = "area";


    const match =
      restaurants.find(
        r =>
          r.Location
            .toLowerCase()
            ===
          location.toLowerCase()
      );


    if(match){

      selectedArea =
        match.Area;

      searchTerm =
        location.toLowerCase();

      searchInput.value =
        location;

    }

  }


  if(
    food
    &&
    foodOptions.includes(food)
  ){

    browseMode = "food";

    selectedFood = food;

  }


  updateUIFromState();

}



/* =========================================================
   SYNC UI
========================================================= */

function updateUIFromState(){


  modeButtons.forEach(button => {

    button.classList.toggle(
      "active",
      button.dataset.mode === browseMode
    );

  });


  if(browseMode === "area"){

    areaSection.style.display =
      "block";

    foodSection.style.display =
      "none";

  }

  else{

    areaSection.style.display =
      "none";

    foodSection.style.display =
      "block";

  }


  areaChips
    .querySelectorAll(".chip")
    .forEach(button => {

      button.classList.toggle(
        "active",
        button.dataset.value === selectedArea
      );

    });


  foodChips
    .querySelectorAll(".chip")
    .forEach(button => {

      button.classList.toggle(
        "active",
        button.dataset.value === selectedFood
      );

    });

}



/* =========================================================
   START
========================================================= */

createChips();

loadURLParameters();

render();
