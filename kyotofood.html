<!doctype html>
<html lang="en">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1, viewport-fit=cover"
>

<meta name="theme-color" content="#070c10">

<title>Kyoto Food Finder</title>


<style>

/* =========================================================
   COLORS
========================================================= */

:root{
  --bg:#070c10;

  --panel:#10161c;
  --panel-light:#151c23;
  --panel-active:#172027;

  --line:#29323b;
  --line-soft:rgba(255,255,255,.07);

  --text:#f5f5f3;
  --muted:#aeb5bc;

  --red:#c96f68;
  --blue:#5c9dff;
  --green:#67c587;
  --orange:#f4a34d;
  --gold:#e3b85c;
}


/* =========================================================
   GLOBAL
========================================================= */

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{

  margin:0;

  background:
    radial-gradient(
      circle at 50% -20%,
      #17202a 0%,
      transparent 38%
    ),
    var(--bg);

  color:var(--text);

  font-family:
    Inter,
    ui-sans-serif,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

  line-height:1.5;

}


/* =========================================================
   STICKY HEADER
========================================================= */

header{

  position:sticky;

  top:0;

  z-index:40;

  background:
    rgba(7,12,16,.97);

  border-bottom:
    1px solid var(--line);

  padding:
    8px
    12px
    8px;

  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);

}

.header-inner{

  max-width:760px;

  margin:auto;

}


/* =========================================================
   TOP NAV
========================================================= */

.top-nav{

  display:grid;

  grid-template-columns:
    repeat(3,1fr);

  gap:6px;

  margin-bottom:8px;

}

.nav-link{

  display:flex;

  align-items:center;
  justify-content:center;

  min-height:33px;

  padding:
    5px
    6px;

  border:
    1px solid var(--line);

  border-radius:9px;

  background:#11181e;

  color:var(--muted);

  text-decoration:none;

  font-size:9px;

  font-weight:800;

  white-space:nowrap;

}

.nav-link:hover{

  color:#fff;

  border-color:var(--red);

}


/* =========================================================
   TITLE
========================================================= */

.header-title{

  margin:
    0
    1px
    7px;

}

.header-title h1{

  margin:0;

  color:#fff;

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-size:21px;

  line-height:1.2;

  letter-spacing:-.025em;

}

.header-title div{

  margin-top:2px;

  color:var(--muted);

  font-size:9px;

}


/* =========================================================
   SEARCH
========================================================= */

.search-box{

  width:100%;

  min-height:39px;

  padding:
    8px
    11px;

  border:
    1px solid var(--line);

  border-radius:11px;

  outline:none;

  background:#10171d;

  color:#fff;

  font:inherit;

  font-size:11px;

}

.search-box::placeholder{
  color:#77828b;
}

.search-box:focus{
  border-color:var(--red);
}


/* =========================================================
   BROWSE
========================================================= */

.sticky-browse{

  margin-top:7px;

  padding-top:7px;

  border-top:
    1px solid var(--line-soft);

}


/* =========================================================
   BY AREA / BY FOOD
========================================================= */

.mode-switch{

  display:grid;

  grid-template-columns:
    1fr
    1fr;

  gap:6px;

  margin-bottom:7px;

}

.mode-btn{

  appearance:none;

  min-height:36px;

  border:
    1px solid var(--line);

  border-radius:10px;

  background:#121a20;

  color:var(--muted);

  font-size:10px;

  font-weight:850;

  cursor:pointer;

}

.mode-btn.active{

  color:#fff;

  border-color:var(--red);

  background:
    rgba(201,111,104,.11);

}


/* =========================================================
   CHIPS
========================================================= */

.chips{

  display:flex;

  gap:6px;

  overflow-x:auto;

  padding:
    1px
    1px
    3px;

  scrollbar-width:none;

}

.chips::-webkit-scrollbar{
  display:none;
}

.chip{

  appearance:none;

  flex:0 0 auto;

  min-height:30px;

  padding:
    5px
    9px;

  border:
    1px solid var(--line);

  border-radius:999px;

  background:#10171d;

  color:#c5ccd1;

  font-size:9px;

  font-weight:750;

  cursor:pointer;

  white-space:nowrap;

}

.chip.active{

  color:#fff;

  border-color:var(--red);

  background:
    rgba(201,111,104,.12);

}


/* =========================================================
   PAGE
========================================================= */

main{

  max-width:760px;

  margin:auto;

  padding:
    13px
    12px
    105px;

}


/* =========================================================
   RESULTS HEADER
========================================================= */

.results-head{

  display:flex;

  align-items:flex-end;

  justify-content:space-between;

  gap:10px;

  margin:
    2px
    2px
    11px;

}

.results-head h2{

  margin:0;

  color:#fff;

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-size:21px;

}

.result-count{

  color:var(--muted);

  font-size:9px;

  white-space:nowrap;

}


/* =========================================================
   CUISINE GROUP
========================================================= */

.food-group{

  margin-bottom:21px;

}

.food-group-title{

  display:flex;

  align-items:center;

  gap:7px;

  margin:
    4px
    2px
    9px;

  padding-bottom:7px;

  border-bottom:
    1px solid var(--line-soft);

  color:#fff;

  font-size:14px;

  font-weight:850;

}

.food-group-count{

  margin-left:auto;

  color:var(--muted);

  font-size:9px;

}


/* =========================================================
   CARD
========================================================= */

.restaurant-card{

  margin-bottom:9px;

  padding:12px;

  border:
    1px solid var(--line);

  border-radius:15px;

  background:
    linear-gradient(
      145deg,
      #141c22,
      #0d1318
    );

}

.card-top{

  display:flex;

  align-items:flex-start;

  gap:9px;

}

.rank{

  flex:0 0 auto;

  min-width:29px;

  height:29px;

  display:flex;

  align-items:center;
  justify-content:center;

  border-radius:8px;

  background:
    rgba(201,111,104,.10);

  border:
    1px solid rgba(201,111,104,.20);

  color:var(--red);

  font-size:10px;

  font-weight:900;

}

.restaurant-main{

  flex:1;

  min-width:0;

}

.restaurant-name{

  margin:0;

  color:#fff;

  font-size:14px;

  font-weight:850;

  line-height:1.25;

}

.restaurant-location{

  margin-top:3px;

  color:var(--muted);

  font-size:9px;

}


/* =========================================================
   BADGES
========================================================= */

.badges{

  display:flex;

  flex-wrap:wrap;

  gap:5px;

  margin-top:7px;

}

.badge{

  display:inline-flex;

  align-items:center;

  padding:
    4px
    7px;

  border-radius:999px;

  border:
    1px solid var(--line);

  background:
    rgba(255,255,255,.035);

  color:#cbd2d7;

  font-size:8px;

  font-weight:800;

}

.badge.cuisine{

  color:#fff;

  border-color:
    rgba(92,157,255,.18);

  background:
    rgba(92,157,255,.08);

}

.badge.pick{

  color:#f2cf72;

  border-color:
    rgba(227,184,92,.22);

  background:
    rgba(227,184,92,.08);

}

.badge.tabelog{

  color:#e8c770;

  border-color:
    rgba(227,184,92,.22);

  background:
    rgba(227,184,92,.08);

}

.badge.hot{

  color:#ff9d74;

  border-color:
    rgba(244,163,77,.22);

  background:
    rgba(244,163,77,.08);

}

.badge.flexible{

  color:#aebdff;

  border-color:
    rgba(92,157,255,.20);

  background:
    rgba(92,157,255,.08);

}


/* =========================================================
   BUDGET
========================================================= */

.budget-box{

  margin-top:9px;

  padding:
    8px
    9px;

  border:
    1px solid var(--line-soft);

  border-radius:10px;

  background:
    rgba(255,255,255,.025);

}

.budget-label{

  color:#78848d;

  font-size:7px;

  font-weight:850;

  letter-spacing:.08em;

  text-transform:uppercase;

}

.budget-value{

  margin-top:3px;

  color:#fff;

  font-size:10px;

  font-weight:800;

}

.budget-note{

  margin-top:2px;

  color:var(--muted);

  font-size:8px;

}


/* =========================================================
   WHY
========================================================= */

.why-go{

  margin-top:8px;

  color:var(--muted);

  font-size:10px;

  line-height:1.45;

}


/* =========================================================
   ACTIONS
========================================================= */

.card-actions{

  display:flex;

  gap:6px;

  margin-top:9px;

}

.card-btn{

  display:inline-flex;

  align-items:center;
  justify-content:center;

  min-height:34px;

  padding:
    6px
    10px;

  border-radius:9px;

  border:
    1px solid rgba(201,111,104,.25);

  background:
    rgba(201,111,104,.08);

  color:var(--red);

  text-decoration:none;

  font-size:9px;

  font-weight:850;

  cursor:pointer;

}

.card-btn.info{

  color:var(--blue);

  border-color:
    rgba(92,157,255,.22);

  background:
    rgba(92,157,255,.07);

}


/* =========================================================
   EXTRA INFO
========================================================= */

.extra-info{

  display:none;

  margin-top:9px;

  padding-top:9px;

  border-top:
    1px solid var(--line-soft);

  color:var(--muted);

  font-size:9px;

  line-height:1.55;

}

.extra-info.open{
  display:block;
}


/* =========================================================
   EMPTY
========================================================= */

.empty-state{

  padding:
    30px
    17px;

  border:
    1px dashed #35414a;

  border-radius:15px;

  text-align:center;

  color:var(--muted);

  font-size:11px;

}

.empty-state strong{

  display:block;

  margin-bottom:5px;

  color:#fff;

}


/* =========================================================
   BOTTOM FILTERS
========================================================= */

.bottom-filter{

  position:fixed;

  left:0;
  right:0;
  bottom:0;

  z-index:50;

  padding:
    7px
    8px
    calc(7px + env(safe-area-inset-bottom));

  border-top:
    1px solid var(--line);

  background:
    rgba(7,12,16,.97);

  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);

}

.bottom-filter-inner{

  max-width:760px;

  margin:auto;

  display:grid;

  grid-template-columns:
    repeat(4,1fr);

  gap:5px;

}

.bottom-btn{

  appearance:none;

  min-height:41px;

  padding:
    4px
    2px;

  border:
    1px solid #26333d;

  border-radius:10px;

  background:#11181e;

  color:#aeb5bc;

  font-size:8.5px;

  font-weight:850;

  cursor:pointer;

}

.bottom-btn.active{

  color:#fff;

  border-color:var(--red);

  background:
    rgba(201,111,104,.13);

}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:380px){

  .header-title h1{
    font-size:19px;
  }

  .nav-link{
    font-size:8px;
  }

  .bottom-btn{
    font-size:7.8px;
  }

}

</style>

  "Yakitori / Chicken":"🍗",
  "Udon / Soba":"🥢",
  "Oyakodon":"🍳",
  "Tonkatsu":"🐷",
  "Unagi":"🐟",
  "Kaisendon":"🐟",
  "Tempura":"🍤",
  "Curry":"🍛",

  "Washoku":"🍚",
  "Seafood":"🦐",
  "Gyoza":"🥟",
  "Bakery / Pâtisserie":"🥐"

};



/* =========================================================
   STATE
========================================================= */

let browseMode = "area";

let selectedArea = "";

let selectedFood = "";

let selectedLocation = "";

let searchTerm = "";

const activeFilters =
  new Set();



/* =========================================================
   ELEMENTS
========================================================= */

const areaChips =
  document.getElementById("areaChips");

const foodChips =
  document.getElementById("foodChips");

const areaSection =
  document.getElementById("areaSection");

const foodSection =
  document.getElementById("foodSection");

  document.getElementById("results");

const resultsTitle =
  document.getElementById("resultsTitle");

const resultCount =
  document.getElementById("resultCount");

const searchInput =
  document.getElementById("searchInput");

const modeButtons =
  document.querySelectorAll(".mode-btn");

const bottomButtons =
  document.querySelectorAll(".bottom-btn");



/* =========================================================
   SPECIAL FILTER CHECKS
========================================================= */

function isPick(r){

  return (r.Tag || "")
    .includes("⭐");

}


function isFlexible(r){

  return (r.Tag || "")
    .includes("🌙");

}


function isHot(r){

  return (r.Recognition || "")
    .toLowerCase()
    .includes("hot restaurant");

}


function isTabelog(r){

  const text =
    (r.Recognition || "")
      .toLowerCase();

  return (
    text.includes("top 100")
    ||
    text.includes("tabelog")
  );

}



/* =========================================================
   CREATE AREA / FOOD CHIPS
========================================================= */

function createChips(){

  areaChips.innerHTML = "";
  foodChips.innerHTML = "";


  /* ALL AREA */

  const allArea =
    document.createElement("button");

  allArea.className =
    "chip active";

  allArea.dataset.value = "";

  allArea.textContent =
    "All Areas";

  areaChips.appendChild(allArea);



  /* AREAS */

  areaOptions.forEach(area => {

    const button =
      document.createElement("button");

    button.className =
      "chip";

    button.dataset.value =
      area;

    button.textContent =
      area;

    areaChips.appendChild(button);

  });



  /* ALL FOOD */

  const allFood =
    document.createElement("button");

  allFood.className =
    "chip active";

  allFood.dataset.value = "";

  allFood.textContent =
    "All Food";

  foodChips.appendChild(allFood);



  /* FOOD */

  foodOptions.forEach(food => {

    const button =
      document.createElement("button");

    button.className =
      "chip";

    button.dataset.value =
      food;

    button.textContent =
      `${cuisineEmoji[food] || "🍽️"} ${food}`;

    foodChips.appendChild(button);

  });



  /* =======================================================
     AREA CLICK

     IMPORTANT:
     Clicking an Area automatically clears
     Food + exact Location + Search.
  ======================================================= */

  areaChips
    .querySelectorAll(".chip")
    .forEach(button => {

      button.addEventListener(
        "click",
        () => {

          browseMode = "area";

          selectedArea =
            button.dataset.value;

          selectedFood = "";

          selectedLocation = "";

          searchTerm = "";

          searchInput.value = "";


          syncModeButtons();

          syncAreaChips();

          syncFoodChips();

          render();

        }
      );

    });



  /* =======================================================
     FOOD CLICK

     IMPORTANT:
     Clicking Food automatically clears
     Area + exact Location + Search.
  ======================================================= */

  foodChips
    .querySelectorAll(".chip")
    .forEach(button => {

      button.addEventListener(
        "click",
        () => {

          browseMode = "food";

          selectedFood =
            button.dataset.value;

          selectedArea = "";

          selectedLocation = "";

          searchTerm = "";

          searchInput.value = "";


          syncModeButtons();

          syncAreaChips();

          syncFoodChips();

          render();

        }
      );

    });

}



/* =========================================================
   MODE SWITCH

   AREA -> clears FOOD
   FOOD -> clears AREA / LOCATION
========================================================= */

modeButtons.forEach(button => {

  button.addEventListener(
    "click",
    () => {


      browseMode =
        button.dataset.mode;


      searchTerm = "";

      searchInput.value = "";


      if(browseMode === "area"){

        selectedFood = "";

      }

      else{

        selectedArea = "";

        selectedLocation = "";

      }


      syncModeButtons();

      syncAreaChips();

      syncFoodChips();

      render();

    }
  );

});



/* =========================================================
   SYNC MODE
========================================================= */

function syncModeButtons(){

  modeButtons.forEach(button => {

    button.classList.toggle(
      "active",
      button.dataset.mode === browseMode
    );

  });


  if(browseMode === "area"){

    areaSection.style.display =
      "block";

    foodSection.style.display =
      "none";

  }

  else{

    areaSection.style.display =
      "none";

    foodSection.style.display =
      "block";

  }

}



/* =========================================================
   SYNC AREA
========================================================= */

function syncAreaChips(){

  areaChips
    .querySelectorAll(".chip")
    .forEach(button => {

      button.classList.toggle(
        "active",
        button.dataset.value === selectedArea
      );

    });

}



/* =========================================================
   SYNC FOOD
========================================================= */

function syncFoodChips(){

  foodChips
    .querySelectorAll(".chip")
    .forEach(button => {

      button.classList.toggle(
        "active",
        button.dataset.value === selectedFood
      );

    });

}



/* =========================================================
   FILTER RESTAURANTS
========================================================= */

function getFilteredRestaurants(){

  return restaurants.filter(r => {


    /* AREA */

    if(
      browseMode === "area"
      &&
      selectedArea
      &&
      r.Area !== selectedArea
    ){

      return false;

    }


    /* EXACT LOCATION */

    if(
      browseMode === "area"
      &&
      selectedLocation
      &&
      r.Location.toLowerCase()
        !==
      selectedLocation.toLowerCase()
    ){

      return false;

    }


    /* FOOD */

    if(
      browseMode === "food"
      &&
      selectedFood
      &&
      r.Food !== selectedFood
    ){

      return false;

    }


    /* SEARCH */

    if(searchTerm){

      const haystack = [

        r.Name,
        r.Food,
        r.Area,
        r.Location,
        r.Budget,
        r.Why,
        r.Recognition

      ]
      .join(" ")
      .toLowerCase();


      if(
        !haystack.includes(searchTerm)
      ){

        return false;

      }

    }


    /*
       SPECIAL BOTTOM FILTERS

       These use OR logic.

       ⭐ + 🔥
       = Picks OR Hot.

       They do NOT interfere with
       Area / Food browse mode.
    */

    if(activeFilters.size){

      const matches = [];


      if(activeFilters.has("pick")){
        matches.push(isPick(r));
      }

      if(activeFilters.has("tabelog")){
        matches.push(isTabelog(r));
      }

      if(activeFilters.has("hot")){
        matches.push(isHot(r));
      }

      if(activeFilters.has("flexible")){
        matches.push(isFlexible(r));
      }


      if(
        !matches.some(Boolean)
      ){

        return false;

      }

    }


    return true;

  });

}



/* =========================================================
   BADGES
========================================================= */

function buildBadges(r){

  let html = "";


  html += `

    <span class="badge cuisine">

      ${cuisineEmoji[r.Food] || "🍽️"}
      ${r.Food}

    </span>

  `;


  if(isPick(r)){

    html += `

      <span class="badge pick">
        ⭐ Pick
      </span>

    `;

  }


  if(isTabelog(r)){

    html += `

      <span class="badge tabelog">
        🏆 Tabelog
      </span>

    `;

  }


  if(isHot(r)){

    html += `

      <span class="badge hot">
        🔥 Hot
      </span>

    `;

  }


  if(isFlexible(r)){

    html += `

      <span class="badge flexible">
        🌙 Flexible
      </span>

    `;

  }


  return html;

}



/* =========================================================
   RESTAURANT CARD
========================================================= */

function restaurantCard(r){

  const mapsQuery =
    encodeURIComponent(
      `${r.Name} Kyoto Japan`
    );


  return `

    <article class="restaurant-card">


      <div class="card-top">


        <div class="rank">
          #${r.Rank}
        </div>


        <div class="restaurant-main">


          <h3 class="restaurant-name">
            ${r.Name}
          </h3>


          <div class="restaurant-location">

            📍 ${r.Location}
            ·
            ${r.Area}

          </div>


          <div class="badges">

            ${buildBadges(r)}

          </div>


        </div>


      </div>



      <div class="budget-box">

        <div class="budget-label">
          💴 Budget / person
        </div>

        <div class="budget-value">
          ${r.Budget}
        </div>

      </div>



      <div class="why-go">

        ${r.Why}

      </div>



      <div class="card-actions">


        <a
          href="https://www.google.com/maps/search/?api=1&query=${mapsQuery}"
          target="_blank"
          rel="noopener noreferrer"
          class="card-btn"
        >
          📍 Maps
        </a>


        <button
          type="button"
          class="card-btn info"
          onclick="toggleInfo(this)"
        >
          ℹ️ Info
        </button>


      </div>



      <div class="extra-info">

        <strong style="color:#fff;">
          ${r.Name}
        </strong>

        <br>

        ${cuisineEmoji[r.Food] || "🍽️"}
        ${r.Food}

        <br>

        📍 ${r.Location} · ${r.Area}

        <br>

        💴 ${r.Budget}

        ${
          r.Recognition
          ?
          `<br>🏆 ${r.Recognition}`
          :
          ""
        }

      </div>


    </article>

  `;

}



/* =========================================================
   INFO BUTTON
========================================================= */

function toggleInfo(button){

  const card =
    button.closest(
      ".restaurant-card"
    );

  const info =
    card.querySelector(
      ".extra-info"
    );


  info.classList.toggle(
    "open"
  );


  button.textContent =
    info.classList.contains("open")
      ? "✕ Close"
      : "ℹ️ Info";

}



/* =========================================================
   AREA MODE
========================================================= */

function renderAreaMode(list){

  if(!list.length){

    showEmpty();

    return;

  }


  const grouped = {};


  list.forEach(r => {

    if(!grouped[r.Food]){

      grouped[r.Food] = [];

    }

    grouped[r.Food].push(r);

  });


  const orderedFoods =
    foodOptions.filter(
      food => grouped[food]
    );


  results.innerHTML =
    orderedFoods
      .map(food => {


        const group =
          grouped[food]
            .sort(
              (a,b) =>
                a.Rank - b.Rank
            );


        return `

          <section class="food-group">


            <div class="food-group-title">

              <span>
                ${cuisineEmoji[food] || "🍽️"}
              </span>

              <span>
                ${food}
              </span>

              <span class="food-group-count">
                ${group.length}
              </span>

            </div>


            ${
              group
                .map(restaurantCard)
                .join("")
            }


          </section>

        `;

      })
      .join("");

}



/* =========================================================
   FOOD MODE
========================================================= */

function renderFoodMode(list){

  if(!list.length){

    showEmpty();

    return;

  }


  const sorted =
    [...list]
      .sort(
        (a,b) =>
          a.Rank - b.Rank
      );


  results.innerHTML =
    sorted
      .map(restaurantCard)
      .join("");

}



/* =========================================================
   EMPTY
========================================================= */

function showEmpty(){

  results.innerHTML = `

    <div class="empty-state">

      <strong>
        No restaurants found
      </strong>

      Try another area, food type,
      search or bottom filter.

    </div>

  `;

}



/* =========================================================
   RESULT TITLE
========================================================= */

function updateTitle(list){

  if(browseMode === "area"){


    if(selectedLocation){

      resultsTitle.textContent =
        `📍 ${selectedLocation}`;

    }

    else if(selectedArea){

      resultsTitle.textContent =
        selectedArea;

    }

    else{

      resultsTitle.textContent =
        "All Kyoto Food";

    }

  }


  else{


    if(selectedFood){

      resultsTitle.textContent =
        `${cuisineEmoji[selectedFood] || "🍽️"} ${selectedFood}`;

    }

    else{

      resultsTitle.textContent =
        "All Food Types";

    }

  }


  resultCount.textContent =
    `${list.length} ${
      list.length === 1
        ? "restaurant"
        : "restaurants"
    }`;

}



/* =========================================================
   RENDER
========================================================= */

function render(){

  const list =
    getFilteredRestaurants();


  updateTitle(list);


  if(browseMode === "area"){

    renderAreaMode(list);

  }

  else{

    renderFoodMode(list);

  }

}



/* =========================================================
   BOTTOM FILTERS
========================================================= */

bottomButtons.forEach(button => {

  button.addEventListener(
    "click",
    () => {


      const filter =
        button.dataset.filter;


      if(activeFilters.has(filter)){

        activeFilters.delete(filter);

        button.classList.remove(
          "active"
        );

      }

      else{

        activeFilters.add(filter);

        button.classList.add(
          "active"
        );

      }


      render();

    }
  );

});



/* =========================================================
   SEARCH
========================================================= */

searchInput.addEventListener(
  "input",
  () => {

    searchTerm =
      searchInput.value
        .trim()
        .toLowerCase();

    render();

  }
);



/* =========================================================
   URL PARAMETERS

   Examples:

   kyotofood.html?area=Arashiyama

   kyotofood.html?location=Gion

   kyotofood.html?location=Fushimi%20Inari

   kyotofood.html?food=Ramen%20%2F%20Tsukemen
========================================================= */

function loadURLParameters(){

  const params =
    new URLSearchParams(
      window.location.search
    );


  const area =
    params.get("area");

  const location =
    params.get("location");

  const food =
    params.get("food");



  /* AREA */

  if(
    area
    &&
    areaOptions.includes(area)
  ){

    browseMode = "area";

    selectedArea = area;

    selectedFood = "";

    selectedLocation = "";

  }



  /* EXACT LOCATION */

  if(location){

    browseMode = "area";

    selectedFood = "";

    selectedLocation =
      location;


    const match =
      restaurants.find(
        r =>
          r.Location
            .toLowerCase()
            ===
          location.toLowerCase()
      );


    if(match){

      selectedArea =
        match.Area;

    }

  }



  /* FOOD */

  if(
    food
    &&
    foodOptions.includes(food)
  ){

    browseMode = "food";

    selectedFood = food;

    selectedArea = "";

    selectedLocation = "";

  }


  syncModeButtons();

  syncAreaChips();

  syncFoodChips();

}



/* =========================================================
   START
========================================================= */

createChips();

loadURLParameters();

render();
