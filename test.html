<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Travelite Test</title>
<style>body{margin:0;background:#0b0c0e;color:#f5f1ed;font-family:Arial}.wrap{max-width:540px;margin:auto;padding:24px 18px}h1{font-size:30px}.muted,label{color:#aaa}label{display:block;font-size:12px;margin:12px 0 6px}input,select,textarea{width:100%;box-sizing:border-box;background:#111318;color:#fff;border:1px solid #303238;border-radius:11px;padding:13px}textarea{min-height:150px}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.cityrow{display:grid;grid-template-columns:1.2fr 1fr 1fr auto;gap:7px;align-items:end;margin:8px 0}.btn{border:0;border-radius:11px;padding:13px 15px;font-weight:bold;cursor:pointer}.dark{background:#22252b;color:#fff}.red{background:#eb474b;color:#fff}.wide{width:100%;margin-top:10px}.buttons{display:flex;gap:8px;margin-top:22px}.buttons .red{flex:1}.hidden{display:none}.card{background:#15171b;border:1px solid #2b2e34;border-radius:14px;padding:14px;margin:10px 0}.meta{font-size:12px;color:#aaa;margin-top:6px}.timeitem{display:grid;grid-template-columns:58px 1fr;gap:10px;padding:10px 0;border-top:1px solid #2b2e34}.timeitem:first-of-type{border-top:0}.time{font-weight:bold;font-size:13px}.dayhead{display:flex;justify-content:space-between;gap:10px}.tag{font-size:10px;color:#aaa;text-transform:uppercase;letter-spacing:.08em}@media(max-width:520px){.cityrow{grid-template-columns:1fr 1fr}.citybox{grid-column:1/-1}}</style></head><body><main class="wrap">
<div style="font-weight:bold;letter-spacing:.15em;font-size:13px">TRAVELITE · TEST</div><div id="stepText" class="muted" style="font-size:12px;margin-top:6px">TRIP · 1 OF 5</div>
<section id="s1"><h1>Build your trip.</h1><p class="muted">Add every city where you will stay.</p><label>Country</label><select><option>Japan</option></select><div class="row"><div><label>Trip starts</label><input id="start" type="date" value="2026-10-18"></div><div><label>Trip ends</label><input id="end" type="date" value="2026-10-30"></div></div><label>Cities</label><div id="cities"></div><button id="add" type="button" class="btn dark wide">＋ Add City</button><div class="buttons"><button id="next1" class="btn red">Continue</button></div></section>
<section id="s2" class="hidden"><h1>Add your places.</h1><textarea id="pois" placeholder="Kiyomizu-dera&#10;USJ&#10;Nara"></textarea><div class="buttons"><button class="btn dark back">Back</button><button id="next2" class="btn red">Match places</button></div></section>
<section id="s3" class="hidden"><h1>Travelite understood this.</h1><div id="matches"></div><div class="buttons"><button class="btn dark back">Back</button><button id="next3" class="btn red">Build scenes</button></div></section>
<section id="s4" class="hidden"><h1>Scene cards.</h1><div id="scenes"></div><div class="buttons"><button class="btn dark back">Back</button><button id="next4" class="btn red">Balance trip</button></div></section>
<section id="s5" class="hidden"><h1>Balanced trip.</h1><div id="trip"></div><div class="buttons"><button class="btn dark back">Back</button></div></section>
</main><script>
(function(){
var step=1, resolved=[], places=[];
function el(id){return document.getElementById(id)}
function show(n){step=n;for(var i=1;i<=5;i++)el('s'+i).classList.toggle('hidden',i!==n);el('stepText').textContent='TRIP · '+n+' OF 5'}
function addCity(city,from,to){var r=document.createElement('div');r.className='cityrow';r.innerHTML='<div class="citybox"><label>City</label><select class="c"><option>Kyoto</option><option>Osaka</option><option>Nara</option><option>Nagoya</option><option>Tokyo</option><option>Kobe</option><option>Himeji</option><option>Uji</option></select></div><div><label>From</label><input class="f" type="date"></div><div><label>To</label><input class="t" type="date"></div><button type="button" class="btn dark x">×</button>';el('cities').appendChild(r);r.querySelector('.c').value=city||'Osaka';r.querySelector('.f').value=from||el('start').value;r.querySelector('.t').value=to||el('end').value;r.querySelector('.x').onclick=function(){if(document.querySelectorAll('.cityrow').length>1)r.remove()}}
function cityRows(){return Array.prototype.map.call(document.querySelectorAll('.cityrow'),function(r){return {city:r.querySelector('.c').value,from:r.querySelector('.f').value,to:r.querySelector('.t').value}})}
el('add').onclick=function(){var rs=document.querySelectorAll('.cityrow'),last=rs[rs.length-1];addCity('Osaka',last?last.querySelector('.t').value:el('start').value,el('end').value)};
el('next1').onclick=function(){show(2)};
var SB='https://zngncasvdrrxyrkjqutj.supabase.co';
var KEY='sb_publishable_wUrH6t12z4tRKruS28LqWQ_2GG06U9m';
function norm(s){return String(s||'').toLowerCase().normalize('NFKD').replace(/[^a-z0-9 ]/g,' ').replace(/\\b(temple|shrine|taisha|ji|dera|the|of|park)\\b/g,' ').replace(/\\s+/g,' ').trim()}
function safe(s){return String(s||'').replace(/[&<>"]/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]})}
async function loadPlaces(){if(places.length)return;var r=await fetch(SB+'/rest/v1/places?select=id,name,name_japanese,city,area,region,estimated_minutes_min,estimated_minutes_max,visit_behavior,prominence,timing_intelligence,status&status=eq.active&limit=2000',{headers:{apikey:KEY,Authorization:'Bearer '+KEY}});if(!r.ok)throw new Error('Place database '+r.status);places=await r.json()}
function findPlace(q){var nq=norm(q),best=null,score=0;places.forEach(function(p){var n=norm(p.name),s=0;if(n===nq)s=100;else if(n.indexOf(nq)>=0||nq.indexOf(n)>=0)s=90;else{var a=nq.split(' '),b=n.split(' '),hit=a.filter(function(x){return b.indexOf(x)>=0}).length;s=80*hit/Math.max(a.length,b.length,1)}if(s>score){score=s;best=p}});return score>=52?best:null}
function mins(p){var a=Number(p.estimated_minutes_min)||60,b=Number(p.estimated_minutes_max)||a;return Math.round((a+b)/2)}
function clock(m){var h=Math.floor(m/60)%24,mm=m%60;return String(h).padStart(2,'0')+':'+String(mm).padStart(2,'0')}
function baseFor(iso,bs){return bs.find(function(b){return b.from<=iso&&b.to>=iso})}
function buildSchedule(){
 var bs=cityRows(),a=new Date(el('start').value+'T00:00:00'),end=new Date(el('end').value+'T00:00:00'),days=[];
 while(a<=end){var iso=a.toISOString().slice(0,10);days.push({date:new Date(a),iso:iso,base:baseFor(iso,bs),items:[]});a.setDate(a.getDate()+1)}
 var matched=resolved.filter(function(r){return r.place});
 var byCity={};matched.forEach(function(r){var city=r.place.city||'Other';(byCity[city]||(byCity[city]=[])).push(r.place)});
 Object.keys(byCity).forEach(function(city){
   var eligible=days.filter(function(d){return d.base&&norm(d.base.city)===norm(city)});
   if(!eligible.length)return;
   byCity[city].sort(function(x,y){return String(x.region||x.area||'').localeCompare(String(y.region||y.area||''))});
   byCity[city].forEach(function(p){
     var target=eligible.slice().sort(function(x,y){return x.items.reduce(function(s,z){return s+mins(z)},0)-y.items.reduce(function(s,z){return s+mins(z)},0)})[0];
     target.items.push(p);
   });
 });
 el('trip').innerHTML=days.map(function(d,i){
   var title='Day '+(i+1)+' · '+d.date.toLocaleDateString('en-SG',{weekday:'short',day:'numeric',month:'short'});
   if(!d.base)return '<div class="card"><div class="dayhead"><b>'+title+'</b><span class="tag">No base</span></div></div>';
   if(!d.items.length)return '<div class="card"><div class="dayhead"><b>'+title+'</b><span class="tag">'+safe(d.base.city)+'</span></div><div class="meta">Free day · no POIs assigned</div></div>';
   var t=540,body='';
   d.items.forEach(function(p,j){
     if(j>0)t+=30;
     if(t>=720&&t<780){body+='<div class="timeitem"><div class="time">12:00</div><div><b>Lunch / break</b><div class="meta">60 min</div></div></div>';t=780}
     var dur=mins(p);
     body+='<div class="timeitem"><div class="time">'+clock(t)+'</div><div><b>'+safe(p.name)+'</b><div class="meta">'+safe(p.area||p.region||p.city)+' · ~'+dur+' min'+(p.visit_behavior?' · '+safe(p.visit_behavior):'')+'</div></div></div>';
     t+=dur;
   });
   return '<div class="card"><div class="dayhead"><b>'+title+'</b><span class="tag">'+safe(d.base.city)+'</span></div>'+body+'</div>';
 }).join('');
 show(5);
}
el('next2').onclick=async function(){var lines=el('pois').value.split('\\n').map(function(x){return x.trim()}).filter(Boolean);el('matches').innerHTML='<div class="card">Reading Travelite place data…</div>';show(3);try{await loadPlaces();resolved=lines.map(function(q){var p=findPlace(q);return {raw:q,place:p}});el('matches').innerHTML=resolved.length?resolved.map(function(r){return r.place?'<div class="card"><b>'+safe(r.raw)+' → '+safe(r.place.name)+'</b><div class="meta">'+safe(r.place.city)+' · '+safe(r.place.region||r.place.area||'')+' · ~'+mins(r.place)+' min</div></div>':'<div class="card"><b>'+safe(r.raw)+'</b><div class="meta">Not confidently matched — not scheduled.</div></div>'}).join(''):'<div class="card">No places entered.</div>'}catch(e){el('matches').innerHTML='<div class="card">Could not load Travelite data: '+safe(e.message)+'</div>'}};
el('next3').onclick=function(){var matched=resolved.filter(function(r){return r.place});el('scenes').innerHTML=matched.length?matched.map(function(r){var p=r.place;return '<div class="card"><b>'+safe(p.name)+'</b><div class="meta">'+safe(p.city)+' · '+safe(p.region||p.area||'')+' · '+mins(p)+' min</div></div>'}).join(''):'<div class="card">No matched POIs.</div>';show(4)};
el('next4').onclick=buildSchedule;
Array.prototype.forEach.call(document.querySelectorAll('.back'),function(b){b.onclick=function(){show(step-1)}});
addCity('Kyoto',el('start').value,el('end').value);
})();
</script></body></html>
